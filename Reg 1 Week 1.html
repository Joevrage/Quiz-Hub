<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reg 1 Week 1: Pectoral & Scapular Anatomy Practice Quiz</title>
  <style>
    :root {
      --primary-color: #1a365d;
      --secondary-color: #2b6cb0;
      --accent-color: #3182ce;
      --bg-color: #f7fafc;
      --card-bg: #ffffff;
      --text-main: #2d3748;
      --text-muted: #718096;
      --correct-bg: #c6f6d5;
      --correct-border: #38a169;
      --correct-text: #22543d;
      --incorrect-bg: #fed7d7;
      --incorrect-border: #e53e3e;
      --incorrect-text: #742a2a;
      --border-color: #e2e8f0;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.24);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      margin: 0;
      padding: 0;
    }

    .header-banner {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: #ffffff;
      padding: 28px 20px 20px;
      text-align: center;
    }

    .header-banner h1 {
      margin: 0 0 6px 0;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .header-banner p {
      margin: 0;
      font-size: 0.95rem;
      opacity: 0.9;
    }

    .sticky-score-bar {
      position: -webkit-sticky;
      position: sticky;
      top: 0;
      z-index: 1000;
      background-color: var(--card-bg);
      border-bottom: 2px solid var(--border-color);
      padding: 12px 20px;
      box-shadow: var(--shadow-sm);
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 900px;
      margin: 0 auto;
    }

    .score-text {
      font-size: 1rem;
      font-weight: 700;
      color: var(--primary-color);
    }

    .progress-bar-container {
      width: 45%;
      background-color: var(--border-color);
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background-color: var(--accent-color);
      transition: width 0.3s ease;
    }

    .quiz-container {
      max-width: 850px;
      margin: 20px auto 40px;
      padding: 0 16px;
    }

    .question-card {
      background-color: var(--card-bg);
      border-radius: 10px;
      border: 1px solid var(--border-color);
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
    }

    .question-number {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--accent-color);
      margin-bottom: 6px;
      letter-spacing: 0.05em;
    }

    .question-text {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--primary-color);
      margin-bottom: 18px;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      padding: 14px 18px;
      background-color: #ffffff;
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.98rem;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.15s ease-in-out;
      line-height: 1.4;
      display: flex;
      align-items: flex-start;
    }

    .option-btn:hover:not(:disabled) {
      background-color: #ebf8ff;
      border-color: var(--accent-color);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      background-color: var(--correct-bg) !important;
      border-color: var(--correct-border) !important;
      color: var(--correct-text) !important;
      font-weight: 600;
    }

    .option-btn.incorrect {
      background-color: var(--incorrect-bg) !important;
      border-color: var(--incorrect-border) !important;
      color: var(--incorrect-text) !important;
    }

    .explanation-box {
      margin-top: 16px;
      padding: 16px;
      border-radius: 8px;
      font-size: 0.92rem;
      line-height: 1.5;
      display: none;
    }

    .explanation-box.correct {
      display: block;
      background-color: var(--correct-bg);
      border-left: 5px solid var(--correct-border);
      color: var(--correct-text);
    }

    .explanation-box.incorrect {
      display: block;
      background-color: var(--incorrect-bg);
      border-left: 5px solid var(--incorrect-border);
      color: var(--incorrect-text);
    }

    .summary-card {
      display: none;
      background-color: var(--card-bg);
      border-radius: 12px;
      border: 2px solid var(--accent-color);
      padding: 32px 24px;
      text-align: center;
      box-shadow: var(--shadow-md);
      margin-top: 30px;
    }

    .summary-card h2 {
      color: var(--primary-color);
      margin-top: 0;
      font-size: 1.8rem;
    }

    .final-score-badge {
      font-size: 3rem;
      font-weight: 800;
      color: var(--secondary-color);
      margin: 16px 0;
    }

    .summary-message {
      font-size: 1.05rem;
      color: var(--text-main);
      margin-bottom: 24px;
    }

    .reset-btn {
      background-color: var(--primary-color);
      color: #ffffff;
      border: none;
      padding: 14px 32px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .reset-btn:hover {
      background-color: var(--secondary-color);
    }

    @media (max-width: 600px) {
      .header-banner h1 {
        font-size: 1.4rem;
      }

      .sticky-score-bar {
        padding: 10px 14px;
      }

      .score-text {
        font-size: 0.88rem;
      }

      .progress-bar-container {
        width: 35%;
      }

      .question-card {
        padding: 18px;
      }

      .option-btn {
        padding: 12px 14px;
        font-size: 0.92rem;
      }
    }
  </style>
</head>
<body>

<div class="header-banner">
  <h1>Reg 1 Week 1 Practice Quiz</h1>
  <p>Pectoral, Scapular, & Shoulder Regions (25 High-Yield Board Questions)</p>
</div>

<div class="sticky-score-bar">
  <span id="score-text" class="score-text">Score: 0 / 25 (0%)</span>
  <div class="progress-bar-container">
    <div id="progress-bar-fill" class="progress-bar-fill"></div>
  </div>
  <span id="progress-text" class="score-text">0 / 25</span>
</div>

<div class="quiz-container">
  <div id="quiz-questions"></div>

  <div id="summary-card" class="summary-card">
    <h2>Quiz Complete!</h2>
    <div id="final-score-badge" class="final-score-badge">0%</div>
    <p id="summary-message" class="summary-message"></p>
    <button class="reset-btn" onclick="resetQuiz()">Retake Quiz</button>
  </div>
</div>

<script>
const quizData = [
  {
    question: "Which muscle group includes levator scapulae and the rhomboids?",
    options: [
      "Superficial posterior axio-appendicular muscles",
      "Deep posterior axio-appendicular muscles",
      "Scapulohumeral muscles",
      "Anterior axio-appendicular muscles"
    ],
    correct: 1,
    explanation: "Correct! The deep posterior axio-appendicular (extrinsic shoulder) muscles are levator scapulae, rhomboid minor, and rhomboid major. Trapezius and latissimus dorsi are superficial posterior extrinsic muscles."
  },
  {
    question: "What is the complete origin of the trapezius muscle according to lecture specifications?",
    options: [
      "Medial 1/3 of superior nuchal line, EOP, nuchal ligament, and SPs C7-T12",
      "Entire superior nuchal line, EOP, and SPs C1-T12",
      "Transverse processes of C1-C4 and spinous processes of C7-T5",
      "Lateral 1/3 of clavicle, acromion, and spine of scapula"
    ],
    correct: 0,
    explanation: "Correct! The trapezius originates from the medial 1/3 of the superior nuchal line, external occipital protuberance (EOP), nuchal ligament, and spinous processes of C7 through T12."
  },
  {
    question: "Which nerve provides MOTOR innervation to the trapezius muscle?",
    options: [
      "Dorsal scapular nerve (C5)",
      "Spinal accessory nerve (CN XI)",
      "Thoracodorsal nerve (C6-C8)",
      "Axillary nerve (C5-C6)"
    ],
    correct: 1,
    explanation: "Correct! Motor innervation to the trapezius is provided by the Spinal Accessory Nerve (CN XI), while sensory branches arise from C3-C4."
  },
  {
    question: "Superior (upward) rotation of the scapular glenoid cavity is achieved through the combined co-contraction of which trapezius fibers?",
    options: [
      "Middle fibers and levator scapulae",
      "Descending (superior) and ascending (inferior) fibers",
      "Middle and ascending fibers",
      "Descending fibers only"
    ],
    correct: 1,
    explanation: "Correct! The descending (superior) fibers pull the scapula upward, and the ascending (inferior) fibers pull the medial scapula downward; together, they co-contract to rotate the glenoid cavity superiorly."
  },
  {
    question: "What is the primary action of the middle fibers of the trapezius muscle?",
    options: [
      "Elevates the scapula",
      "Depresses the scapula",
      "Retracts (adducts) the scapula",
      "Protracts the scapula"
    ],
    correct: 2,
    explanation: "Correct! The horizontally oriented middle fibers of trapezius pull the scapula medially toward the vertebral column, causing scapular retraction."
  },
  {
    question: "Where does the latissimus dorsi muscle insert on the humerus?",
    options: [
      "Greater tubercle (superior facet)",
      "Lesser tubercle",
      "Floor / medial lip of the intertubercular groove (bicipital groove)",
      "Deltoid tuberosity"
    ],
    correct: 2,
    explanation: "Correct! The latissimus dorsi inserts directly into the floor / medial lip of the intertubercular groove (bicipital groove) of the humerus."
  },
  {
    question: "When the arms are FIXED (such as during climbing or pull-ups), what is the specific functional action of the latissimus dorsi?",
    options: [
      "Protracts the scapula",
      "Raises the body/trunk toward the arms",
      "Elevates the clavicle",
      "Superiorly rotates the glenoid cavity"
    ],
    correct: 1,
    explanation: "Correct! When the origin is mobile and the insertion at the arms is fixed (e.g., during climbing), latissimus dorsi contracts to raise the trunk/body upward."
  },
  {
    question: "Which nerve innervates the latissimus dorsi muscle?",
    options: [
      "Dorsal scapular nerve (C5)",
      "Thoracodorsal nerve (C6-C8)",
      "Long thoracic nerve (C5-C7)",
      "Lower subscapular nerve (C6-C7)"
    ],
    correct: 1,
    explanation: "Correct! Latissimus dorsi is innervated by the thoracodorsal nerve (C6-C8)."
  },
  {
    question: "What is the origin of the levator scapulae muscle?",
    options: [
      "Transverse processes (TPs) of C1-C4",
      "Spinous processes of C7-T1",
      "Costal junction of rib 1",
      "Spinous processes of T2-T5"
    ],
    correct: 0,
    explanation: "Correct! Levator scapulae originates from the transverse processes (TPs) of C1-C4 and inserts into the superior portion of the medial border of the scapula."
  },
  {
    question: "Regarding muscle origins, how do you correctly distinguish rhomboid minor from rhomboid major?",
    options: [
      "Rhomboid minor is superficial to rhomboid major",
      "Rhomboid minor originates superiorly (SP C7-T1), whereas major originates inferiorly (SP T2-T5)",
      "Rhomboid minor is deep to rhomboid major",
      "Rhomboid minor originates on TPs C1-C4, whereas major originates on SPs C7-T1"
    ],
    correct: 1,
    explanation: "Correct! 'Minor over major' refers strictly to superior vs. inferior origin (minor originates superiorly at C7-T1, major inferiorly at T2-T5), NOT superficial vs. deep."
  },
  {
    question: "Which single nerve innervates levator scapulae, rhomboid minor, AND rhomboid major?",
    options: [
      "Long thoracic nerve (C5-C7)",
      "Thoracodorsal nerve (C6-C8)",
      "Dorsal scapular nerve (C5)",
      "Suprascapular nerve (C5-C6)"
    ],
    correct: 2,
    explanation: "Correct! The dorsal scapular nerve (C5, with sensory fibers from C3-C4) innervates levator scapulae, rhomboid minor, and rhomboid major."
  },
  {
    question: "What nerve innervates BOTH the deltoid muscle and the teres minor muscle?",
    options: [
      "Axillary nerve (C5-C6)",
      "Suprascapular nerve (C5-C6)",
      "Lower subscapular nerve (C6-C7)",
      "Radial nerve (C5-T1)"
    ],
    correct: 0,
    explanation: "Correct! The axillary nerve (C5-C6) innervates both the deltoid muscle and the teres minor muscle."
  },
  {
    question: "Where do all three parts of the deltoid muscle insert?",
    options: [
      "Greater tubercle of the humerus",
      "Lesser tubercle of the humerus",
      "Deltoid tuberosity of the humerus",
      "Intertubercular groove"
    ],
    correct: 2,
    explanation: "Correct! All three parts (anterior, middle, and posterior) of the deltoid converge to insert on the deltoid tuberosity of the humerus."
  },
  {
    question: "Which part of the deltoid muscle is primarily responsible for arm FLEXION and MEDIAL ROTATION?",
    options: [
      "Anterior (clavicular) part",
      "Middle (acromial) part",
      "Posterior (spinal) part",
      "All three parts act identically"
    ],
    correct: 0,
    explanation: "Correct! The anterior (clavicular) part flexes and medially rotates the humerus; the middle part abducts; the posterior part extends and laterally rotates."
  },
  {
    question: "Where does the teres major muscle insert, and what nerve innervates it?",
    options: [
      "Intertubercular groove (medial lip) | Lower subscapular nerve (C6-C7)",
      "Greater tubercle (middle facet) | Suprascapular nerve (C5-C6)",
      "Lesser tubercle | Upper subscapular nerve (C5-C6)",
      "Deltoid tuberosity | Axillary nerve (C5-C6)"
    ],
    correct: 0,
    explanation: "Correct! Teres major originates from the dorsal surface of the inferior angle of the scapula, inserts into the medial lip of the intertubercular groove, and is innervated by the lower subscapular nerve (C6-C7)."
  },
  {
    question: "Which rotator cuff tendon is most commonly ruptured or subjected to degenerative tendonitis?",
    options: [
      "Subscapularis tendon",
      "Supraspinatus tendon",
      "Infraspinatus tendon",
      "Teres minor tendon"
    ],
    correct: 1,
    explanation: "Correct! The supraspinatus tendon is the most commonly ruptured rotator cuff tendon because it passes beneath the acromion process and supports the weight of the upper limb."
  },
  {
    question: "Match the correct humeral insertion facets for Supraspinatus, Infraspinatus, and Teres Minor:",
    options: [
      "Supraspinatus = Superior facet | Infraspinatus = Middle facet | Teres minor = Inferior facet (all on Greater Tubercle)",
      "Supraspinatus = Lesser tubercle | Infraspinatus = Greater tubercle | Teres minor = Bicipital groove",
      "Supraspinatus = Middle facet | Infraspinatus = Superior facet | Teres minor = Inferior facet",
      "Supraspinatus = Inferior facet | Infraspinatus = Middle facet | Teres minor = Superior facet"
    ],
    correct: 0,
    explanation: "Correct! All three insert on the greater tubercle of the humerus: Supraspinatus on the superior facet, Infraspinatus on the middle facet, and Teres minor on the inferior facet."
  },
  {
    question: "Which two rotator cuff muscles share the primary functional action of LATERAL (external) ROTATION of the humerus?",
    options: [
      "Supraspinatus and Subscapularis",
      "Infraspinatus and Teres minor",
      "Subscapularis and Teres major",
      "Supraspinatus and Infraspinatus"
    ],
    correct: 1,
    explanation: "Correct! Both Infraspinatus and Teres minor insert on the posterior aspect of the greater tubercle and function as lateral (external) rotators of the arm."
  },
  {
    question: "Where does the Subscapularis muscle insert, and what is its primary action?",
    options: [
      "Lesser tubercle of humerus | Medial rotation of humerus",
      "Greater tubercle of humerus | Abduction of humerus",
      "Deltoid tuberosity | Extension of humerus",
      "Medial lip of bicipital groove | Lateral rotation of humerus"
    ],
    correct: 0,
    explanation: "Correct! Subscapularis originates in the subscapular fossa, inserts onto the lesser tubercle of the humerus, and acts as a powerful medial (internal) rotator of the arm."
  },
  {
    question: "Which nerve(s) innervate the Subscapularis muscle?",
    options: [
      "Suprascapular nerve (C5-C6) only",
      "Upper and lower subscapular nerves (C5-C7)",
      "Axillary nerve (C5-C6) only",
      "Thoracodorsal nerve (C6-C8)"
    ],
    correct: 1,
    explanation: "Correct! Subscapularis receives dual innervation from both the upper subscapular nerve and lower subscapular nerve (C5-C7)."
  },
  {
    question: "Which rule accurately describes the nerve supply to Pectoralis Major vs. Pectoralis Minor?",
    options: [
      "Pectoralis major gets Lateral Pectoral Nerve only; Pectoralis minor gets Medial Pectoral Nerve only",
      "Pectoralis major gets BOTH Lateral and Medial Pectoral Nerves; Pectoralis minor gets Medial Pectoral Nerve ONLY",
      "Pectoralis minor gets BOTH nerves; Pectoralis major gets Lateral Pectoral Nerve only",
      "Both muscles receive both lateral and medial pectoral nerves equally"
    ],
    correct: 1,
    explanation: "Correct! Pectoralis major receives both lateral and medial pectoral nerves (lateral to clavicular head, medial to sternocostal head), whereas Pectoralis minor receives ONLY the medial pectoral nerve."
  },
  {
    question: "What is the origin, insertion, and innervation of the Subclavius muscle?",
    options: [
      "Origin: Costal junction of rib 1 | Insertion: Inferior surface of clavicle | Nerve: Nerve to subclavius (C5-C6)",
      "Origin: Clavicle | Insertion: Coracoid process | Nerve: Lateral pectoral nerve",
      "Origin: Sternum | Insertion: Rib 1 | Nerve: Medial pectoral nerve",
      "Origin: Ribs 3-5 | Insertion: Clavicle | Nerve: Subscapular nerve"
    ],
    correct: 0,
    explanation: "Correct! Subclavius originates at the costal junction of rib 1, inserts on the middle/distal inferior surface of the clavicle, and is innervated by the nerve to subclavius (C5-C6)."
  },
  {
    question: "Damage to the Long Thoracic Nerve (C5-C7) paralyzes serratus anterior and results in which classic clinical sign?",
    options: [
      "Ape hand deformity",
      "Winged scapula (scapular winging)",
      "Wrist drop",
      "Frozen shoulder"
    ],
    correct: 1,
    explanation: "Correct! The long thoracic nerve innervates serratus anterior. Paralyzing this muscle prevents the medial border of the scapula from holding flat against the thoracic cage, causing a winged scapula."
  },
  {
    question: "From ANTERIOR to POSTERIOR, what are the three anatomical layers comprising the 'Subscapularis Sandwich'?",
    options: [
      "Serratus anterior (bread) -> Subscapularis (filling) -> Scapula (bread)",
      "Pectoralis major -> Subscapularis -> Serratus anterior",
      "Scapula -> Subscapularis -> Serratus anterior",
      "Subscapularis -> Serratus anterior -> Scapula"
    ],
    correct: 0,
    explanation: "Correct! From anterior to posterior, the sequence is Serratus anterior, Subscapularis, and Scapula. Anatomical 'sandwiches' are named for the structure in the middle (Subscapularis)."
  },
  {
    question: "Which mnemonic/rule correctly identifies the attachments along the intertubercular (bicipital) groove of the humerus?",
    options: [
      "'Lady between two majors': Pectoralis major (lateral lip), Latissimus dorsi (floor), Teres major (medial lip)",
      "'Lady between two majors': Teres major (lateral lip), Latissimus dorsi (floor), Pectoralis major (medial lip)",
      "'Three majors in a row': Pectoralis major, Teres major, Greater major",
      "'SITS in a groove': Supraspinatus, Infraspinatus, Teres minor, Subscapularis"
    ],
    correct: 0,
    explanation: "Correct! 'A lady between two majors' describes the bicipital groove attachments: Pectoralis major on the lateral lip, Latissimus dorsi ('lady') on the floor, and Teres major on the medial lip."
  }
];

let answeredCount = 0;
let correctCount = 0;

function renderQuiz() {
  const container = document.getElementById('quiz-questions');
  container.innerHTML = '';

  quizData.forEach((q, index) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = `q-card-${index}`;

    let optionsHTML = '';
    q.options.forEach((opt, optIdx) => {
      optionsHTML += `
        <button class="option-btn" id="opt-${index}-${optIdx}" onclick="checkAnswer(${index}, ${optIdx})">
          <span style="font-weight:700; margin-right:8px;">${String.fromCharCode(65 + optIdx)}.</span>
          <span>${opt}</span>
        </button>
      `;
    });

    card.innerHTML = `
      <div class="question-number">Question ${index + 1} of 25</div>
      <div class="question-text">${q.question}</div>
      <div class="options-grid">${optionsHTML}</div>
      <div class="explanation-box" id="explanation-${index}"></div>
    `;

    container.appendChild(card);
  });
}

function checkAnswer(qIdx, selectedOptIdx) {
  const q = quizData[qIdx];
  const explanationBox = document.getElementById(`explanation-${qIdx}`);
  const selectedBtn = document.getElementById(`opt-${qIdx}-${selectedOptIdx}`);

  q.options.forEach((_, optIdx) => {
    const btn = document.getElementById(`opt-${qIdx}-${optIdx}`);
    btn.disabled = true;
    if (optIdx === q.correct) {
      btn.classList.add('correct');
    }
  });

  if (selectedOptIdx === q.correct) {
    correctCount++;
    explanationBox.className = 'explanation-box correct';
    explanationBox.innerHTML = `<strong>Correct!</strong> ${q.explanation}`;
  } else {
    selectedBtn.classList.add('incorrect');
    explanationBox.className = 'explanation-box incorrect';
    explanationBox.innerHTML = `<strong>Incorrect.</strong> ${q.explanation}`;
  }

  answeredCount++;
  updateTracker();

  if (answeredCount === quizData.length) {
    showSummary();
  }
}

function updateTracker() {
  const percentage = Math.round((correctCount / Math.max(1, answeredCount)) * 100);
  document.getElementById('score-text').innerText = `Score: ${correctCount} / 25 (${percentage}%)`;
  document.getElementById('progress-text').innerText = `${answeredCount} / 25`;
  
  const progressPercent = (answeredCount / quizData.length) * 100;
  document.getElementById('progress-bar-fill').style.width = `${progressPercent}%`;
}

function showSummary() {
  const summaryCard = document.getElementById('summary-card');
  const finalScoreBadge = document.getElementById('final-score-badge');
  const summaryMessage = document.getElementById('summary-message');

  const percentage = Math.round((correctCount / quizData.length) * 100);
  finalScoreBadge.innerText = `${percentage}% (${correctCount}/25)`;

  if (percentage >= 90) {
    summaryMessage.innerText = "Mastery Level Achieved! Excellent job. You have locked down the muscle origins, insertions, innervations, and clinical rules for Week 1.";
  } else if (percentage >= 75) {
    summaryMessage.innerText = "Strong Performance! Review the detailed explanations above for any missed questions, specifically focusing on nerve levels and facet attachments.";
  } else {
    summaryMessage.innerText = "Good Practice Run! Go back over the Week 1 slide deck and transcript before retaking the quiz.";
  }

  summaryCard.style.display = 'block';
  summaryCard.scrollIntoView({ behavior: 'smooth' });
}

function resetQuiz() {
  answeredCount = 0;
  correctCount = 0;
  document.getElementById('summary-card').style.display = 'none';
  updateTracker();
  renderQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

renderQuiz();
</script>
