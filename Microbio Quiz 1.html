<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Microbiology Quiz 1 Material Review</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --primary-accent: #ff9900;
            --correct-color: #22c55e;
            --correct-bg: #14532d;
            --incorrect-color: #ef4444;
            --incorrect-bg: #7f1d1d;
            --border-color: #333333;
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.5);
            --shadow-md: 0 4px 10px rgba(0,0,0,0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.5;
            padding-bottom: 40px;
        }

        .header-sticky {
            position: -webkit-sticky;
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: var(--card-bg);
            border-bottom: 2px solid var(--primary-accent);
            padding: 12px 20px;
            box-shadow: var(--shadow-sm);
        }

        .header-container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary-accent);
        }

        .score-box {
            font-size: 1rem;
            font-weight: 600;
            background-color: #262626;
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background-color: var(--border-color);
            position: absolute;
            bottom: 0;
            left: 0;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background-color: var(--primary-accent);
            transition: width 0.3s ease;
        }

        .quiz-container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 16px;
        }

        .question-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }

        .question-header {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--primary-accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 18px;
            color: var(--text-primary);
        }

        .options-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            width: 100%;
            text-align: left;
            padding: 14px 16px;
            font-size: 0.95rem;
            color: var(--text-primary);
            background-color: #262626;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary-accent);
            background-color: #333333;
        }

        .option-btn:disabled {
            cursor: default;
        }

        .option-btn.correct-choice {
            background-color: var(--correct-bg) !important;
            border-color: var(--correct-color) !important;
            color: #ffffff !important;
            font-weight: 600;
        }

        .option-btn.incorrect-choice {
            background-color: var(--incorrect-bg) !important;
            border-color: var(--incorrect-color) !important;
            color: #ffffff !important;
            font-weight: 600;
        }

        .option-btn.dimmed {
            opacity: 0.4;
        }

        .explanation-box {
            margin-top: 16px;
            padding: 16px 18px;
            border-radius: 8px;
            font-size: 0.92rem;
            line-height: 1.6;
            display: none;
        }

        .explanation-box.visible {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .explanation-box.correct {
            background-color: #052e16;
            border-left: 4px solid var(--correct-color);
            color: #d1fae5;
        }

        .explanation-box.incorrect {
            background-color: #450a0a;
            border-left: 4px solid var(--incorrect-color);
            color: #fee2e2;
        }

        .status-banner {
            font-size: 1.05rem;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }

        .status-banner.correct {
            color: var(--correct-color);
        }

        .status-banner.incorrect {
            color: var(--incorrect-color);
        }

        .explanation-summary {
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .rationale-list {
            list-style: none;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .rationale-item {
            font-size: 0.88rem;
            line-height: 1.45;
        }

        .rationale-item strong {
            color: var(--primary-accent);
        }

        .summary-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--primary-accent);
            display: none;
        }

        .summary-card.visible {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        .summary-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .summary-score {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--primary-accent);
            margin-bottom: 16px;
        }

        .summary-text {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .reset-btn {
            background-color: var(--primary-accent);
            color: #000000;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .reset-btn:hover {
            background-color: #e68a00;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="header-sticky">
        <div class="header-container">
            <div class="header-title">Microbiology: Quiz 1 Material Review</div>
            <div class="score-box" id="scoreDisplay">Score: 0 / 0 (0%)</div>
        </div>
        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progressBar"></div>
        </div>
    </div>

    <div class="quiz-container" id="quizContainer"></div>

    <div class="quiz-container">
        <div class="summary-card" id="summaryCard">
            <div class="summary-title" id="summaryTitle">Quiz Completed!</div>
            <div class="summary-score" id="finalScore">0 / 0</div>
            <div class="summary-text" id="summaryFeedback">Here is your performance breakdown.</div>
            <button class="reset-btn" onclick="resetQuiz()">Retake Quiz</button>
        </div>
    </div>

    <script>

            {

            {

            },
            {

                    <div class="question-header">Question ${index + 1} of ${activeQuestions.length}</div>
                    <div class="question-text">${q.question}</div>
                    <div class="options-list">${optionsHTML}</div>
                    <div class="explanation-box" id="exp-${index}"></div>
                `;

                container.appendChild(card);
            });

            document.getElementById('scoreDisplay').innerText = `Score: 0 / ${activeQuestions.length} (0%)`;
            document.getElementById('progressBar').style.width = '0%';
        }

        function selectOption(qIdx, selectedOptIdx) {
            if (currentAnswers[qIdx] !== null) return;

            currentAnswers[qIdx] = selectedOptIdx;
            const q = activeQuestions[qIdx];
            const chosenOption = q.options[selectedOptIdx];
            const isCorrect = chosenOption.correct;

            q.options.forEach((opt, optIdx) => {
                const btn = document.getElementById(`btn-${qIdx}-${optIdx}`);
                btn.disabled = true;

                if (opt.correct) {
                    btn.classList.add('correct-choice');
                } else if (optIdx === selectedOptIdx) {
                    btn.classList.add('incorrect-choice');
                } else {
                    btn.classList.add('dimmed');
                }
            });

            let rationaleHTML = '<ul class="rationale-list">';
            q.options.forEach((opt, optIdx) => {
                const letter = String.fromCharCode(65 + optIdx);
                rationaleHTML += `
                    <li class="rationale-item">
                        <strong>${letter}) ${opt.text}:</strong> ${opt.reason}
                    </li>
                `;
            });
            rationaleHTML += '</ul>';

            const expBox = document.getElementById(`exp-${qIdx}`);
            expBox.className = `explanation-box visible ${isCorrect ? 'correct' : 'incorrect'}`;
            expBox.innerHTML = `
                <div class="status-banner ${isCorrect ? 'correct' : 'incorrect'}">
                    ${isCorrect ? 'Correct!' : 'Incorrect.'}
                </div>
                <div class="explanation-summary">
                    ${q.summary}
                </div>
                ${rationaleHTML}
            `;

            updateScore();
        }

        function updateScore() {
            const answeredCount = currentAnswers.filter(a => a !== null).length;
            const correctCount = currentAnswers.reduce((acc, selectedOptIdx, idx) => {
                if (selectedOptIdx === null) return acc;
                return activeQuestions[idx].options[selectedOptIdx].correct ? acc + 1 : acc;
            }, 0);

            const percentage = Math.round((correctCount / activeQuestions.length) * 100);

            document.getElementById('scoreDisplay').innerText = `Score: ${correctCount} / ${activeQuestions.length} (${percentage}%)`;
            document.getElementById('progressBar').style.width = `${(answeredCount / activeQuestions.length) * 100}%`;

            if (answeredCount === activeQuestions.length) {
                showSummary(correctCount, percentage);
            }
        }

        function showSummary(correctCount, percentage) {
            const summaryCard = document.getElementById('summaryCard');
            const finalScore = document.getElementById('finalScore');
            const feedback = document.getElementById('summaryFeedback');

            finalScore.innerText = `${correctCount} / ${activeQuestions.length} (${percentage}%)`;

            if (percentage >= 90) {
                feedback.innerText = "Mastery demonstrated across all fundamental bacteriology and cytology concepts.";
            } else if (percentage >= 75) {
                feedback.innerText = "Proficient comprehension. Review flagged items on flagellar locomotion and envelope dynamics.";
            } else {
                feedback.innerText = "Recommended review of historical biogenesis, flagellar arrangements, and endospore physiology.";
            }

            summaryCard.classList.add('visible');
            summaryCard.scrollIntoView({ behavior: 'smooth' });
        }

        function resetQuiz() {
            document.getElementById('summaryCard').classList.remove('visible');
            renderQuiz();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.onload = renderQuiz;
    </script>
</body>
</html>
