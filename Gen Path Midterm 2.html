<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gen Path Week 6 Quiz</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f0f0f;color:#fff;font-family:system-ui,Arial,sans-serif;line-height:1.45}
a{text-decoration:none}.wrap{max-width:900px;margin:0 auto;padding:16px}
.card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;padding:16px;margin:12px 0}
.muted{color:#a0a0a0}.btn,.chip{background:#222;color:#fff;border:1px solid #ff9900;border-radius:8px;padding:8px 12px;cursor:pointer;font-size:14px;display:inline-block;margin:3px}
.btn:hover{background:#ff9900;color:#000}.chip.on,.btn.act{background:#ff9900;color:#000}
#hdr{position:sticky;top:0;z-index:10;background:#1a1a1a;border-bottom:1px solid #333;padding:8px 12px}
#hdr .row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}.pill{background:#2a2a2a;border-radius:20px;padding:4px 10px;font-size:13px}
#bar{position:absolute;left:0;bottom:0;height:3px;background:#ff9900;width:0;transition:width .3s}
.opt{display:block;width:100%;text-align:left;background:#222;color:#fff;border:1px solid #333;border-radius:8px;padding:10px;margin:6px 0;cursor:pointer;font-size:15px}
.opt:hover:not(:disabled){border-color:#ff9900}.opt.ok{background:#14532d;border-color:#22c55e}.opt.bad{background:#7f1d1d;border-color:#ef4444}
.ban{font-weight:700;margin:10px 0 4px}.g{color:#22c55e}.r{color:#ef4444}.why{font-size:14px;margin:4px 0;color:#ddd}
.tag{font-size:12px;color:#000;background:#ff9900;border-radius:4px;padding:1px 6px;margin-right:6px}
.wrong-popup{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:50;pointer-events:none}.wrong-popup img{max-width:60vw;max-height:60vh}.hidden{display:none}
.retake-btn.hub-btn{background:#222;color:#fff;border:1px solid #ff9900}.retake-btn.hub-btn:hover{background:#ff9900;color:#000}
</style></head><body>
<audio id="wrongAudio" src="Wrong-answer.mp3" preload="auto"></audio>
<div id="wrongPopup" class="wrong-popup hidden"><img id="wrongImage" src="Erijah.png" alt="Incorrect Feedback"></div>
<div id="app"></div>
<script>
const SUBJECTS=[
{title:"Hemostasis & Coagulation",week:"Wk 6"},
{title:"Clotting Disorders & Bruising",week:"Wk 6"},
{title:"Injury Terms & Arachidonic Acid Pathway",week:"Wk 6"},
{title:"Phases of Inflammation & Exudates",week:"Wk 6"},
{title:"Tissue Repair & Pathological Healing",week:"Wk 6"},
{title:"Cell Death Mechanisms",week:"Wk 6"}];
// Q(subject, slideRef, difficulty, priority, stem, [[correctText, why],[wrong, why],[wrong, why],[wrong, why]])
let _id=0;
function Q(s,ref,d,p,stem,o){return{id:_id++,subjectIndex:s,week:"Wk 6",slideRef:ref,difficulty:d,priority:p,stem,
options:o.map((x,i)=>({text:x[0],correct:i===0,why:x[1]+" ["+ref+"]"}))}}
const questionBank=[
Q(0,"Slide-6","easy",true,"The fastest response to a bleeding injury is a _______ reflex that produces _______ of arteries.",[
["sympathetic; vasoconstriction","Neurogenic vascular spasm acts through sympathetic nerves on arterial smooth muscle, slowing flow."],
["parasympathetic; vasodilation","Vasodilation increases flow and parasympathetic input is not the hemostatic reflex."],
["chemical; vasoconstriction","Chemical signaling is slower; the first step is neurogenic."],
["sympathetic; vasodilation","Right pathway but wrong direction; dilation would increase bleeding."]]),
Q(0,"Slide-7","medium",true,"A laceration exposes injured tissue. Tissue cells release _______, which activates clotting factor _______ of the extrinsic pathway.",[
["thromboplastin; VII","Tissue factor (thromboplastin) from injured tissue activates Factor VII."],
["thromboxane; VII","Thromboxane comes from platelets and enhances spasm/aggregation; it is not tissue factor."],
["thromboplastin; XII","Factor XII is the intrinsic initiator, activated by medial collagen or glass."],
["thromboxane; XII","Wrong mediator and wrong pathway."]]),
Q(0,"Slide-8","medium",true,"Which set contains all four vitamin K-dependent clotting factors (the '1972' mnemonic)?",[
["II, VII, IX, X","Prothrombin, VII, IX and X require vitamin K for synthesis."],
["I, V, VIII, XII","None of these is vitamin K-dependent in the list."],
["VIII, IX, XI, XII","Factors VIII, XI and XII are not vitamin K-dependent."],
["III, IV, V, VIII","Tissue factor, calcium, V and VIII are not vitamin K-dependent."]]),
Q(0,"Slide-9","medium",false,"Hyperinsulinemia of metabolic syndrome inhibits plasminogen activator. The most likely consequence is _______.",[
["impaired clot lysis and a hypercoagulable state","Less plasmin forms from plasminogen, so fibrin clots persist."],
["excess plasmin and spontaneous bleeding","Inhibiting the activator lowers plasmin, not raises it."],
["decreased fibrin formation","Fibrin formation is upstream and unaffected."],
["deficiency of Factor VIII","Factor VIII is not related to plasminogen activation."]]),
Q(1,"Slide-12","hard",true,"A boy has prolonged bleeding after a minor injury. Labs show Factor IX deficiency. This disorder is _______ and is nicknamed _______.",[
["hemophilia B; Christmas disease","Factor IX deficiency, X-linked recessive, named for the first patient."],
["hemophilia A; classic hemophilia","Hemophilia A is Factor VIII deficiency."],
["hemophilia C; autosomal recessive","Hemophilia C is Factor XI deficiency, autosomal recessive."],
["von Willebrand disease; Factor IX","Not Factor IX; vWF is related to Factor VIII."]]),
Q(1,"Slide-11","medium",true,"An elderly patient has numerous flat, purple-brown patches from fragile, sun-damaged vessels and thin skin. These are best termed _______.",[
["purpura","Purpura reflects age-related vessel fragility with multiple leaking vessels."],
["petechiae","Petechiae are tiny pinpoint bruises, not larger fragility patches."],
["ecchymosis","Ecchymosis is a single large deep-purple (often traumatic) bruise."],
["hematoma","Hematoma is blood collected outside vessels; a general term, not the age pattern."]]),
Q(2,"Slide-16","easy",true,"A physician-induced injury, such as an adverse effect after treatment, is termed _______.",[
["iatrogenic","Iatrogenesis means provider-induced injury."],
["idiopathic","Idiopathic means unknown or poorly understood cause."],
["etiologic","Etiology is simply the cause."],
["pathogenic","Pathogenesis is the mechanism of disease."]]),
Q(2,"Slide-18","hard",true,"A patient needs complete blockade of both prostaglandin and leukotriene production. Which agent and target best accomplish this?",[
["corticosteroid inhibiting phospholipase A2","Steroids block phospholipase A2, preventing arachidonic acid formation and both pathways."],
["ibuprofen inhibiting COX","NSAIDs block only the COX (prostaglandin) side."],
["acetaminophen inhibiting COX","Tylenol is an analgesic without meaningful anti-inflammatory action."],
["NSAID inhibiting lipoxygenase","NSAIDs do not block the lipoxygenase/leukotriene pathway."]]),
Q(3,"Slide-23","medium",true,"Histamine is no longer actively released, yet blood flow has not normalized and tissues remain congested at day 4. This is the _______ phase.",[
["subacute passive congestion","3 to 5 days: histamine inactive but congestion persists."],
["acute active congestion","Active congestion has ongoing histamine release in the first 48 hours."],
["chronic anabolic","Chronic phase (5+ days) is repair and rebuilding."],
["exudative","The exudative phase is the acute, histamine-driven phase."]]),
Q(3,"Slide-22","medium",true,"A patient with pneumonia has a pleural friction rub. The exudate is most likely _______.",[
["fibrinous","Fibrin clot strands in serous fluid cause friction rubs in pleuritis or pericarditis."],
["serous","Serous is watery blister-like fluid, the most abundant, not the friction type."],
["purulent","Purulent exudate is neutrophils plus bacteria (pus)."],
["transudate","Transudate is non-inflammatory edema."]]),
Q(4,"Slide-24","hard",true,"After an ankle sprain, a patient rests only and develops a stiff, fibrotic joint. The responsible phenotype is _______, which secretes _______ and activates myofibroblasts.",[
["M1 macrophage; nitric oxide and TNF","M1 perpetuates inflammation and drives rigid, fibrotic healing."],
["M2 macrophage; growth factors","M2 promotes normal repair and collagen remodeling."],
["M1 macrophage; growth factors","M1 secretes NO/TNF, not growth factors."],
["M2 macrophage; nitric oxide and TNF","NO and TNF are M1 products."]]),
Q(4,"Slide-27","medium",true,"Normal healing lays down disorganized collagen _______ first, then remodels to _______ in response to fibroblast tensile stress.",[
["type III; type I","Type III 'haystack' is replaced by stronger type I via movement and M2 activity."],
["type I; type III","Reversed; type I is the strongest, final collagen."],
["type II; type I","Type II is cartilage collagen."],
["type IV; type II","Not the sequence of wound remodeling."]]),
Q(4,"Slide-28","medium",true,"Unremodeled type III collagen has a negative charge and attracts Ca2+ from tissue fluid, producing _______.",[
["dystrophic calcification","Calcium deposits in previously damaged tissue; a calcified granuloma is an example."],
["keloid formation","Keloid is overproduced dense collagen, not calcium deposition."],
["proud flesh","Excess friable granulation tissue, mostly seen in horses."],
["Wallerian degeneration","Distal axon degeneration after nerve injury."]]),
Q(4,"Transcript-6.3","medium",false,"A clean scalpel incision with closely apposed dermal edges and a deep, jagged scrape both heal. Which pairing is correct?",[
["incision: primary intention; scrape: secondary intention","Primary leaves little scar in regenerative epithelium; wide or deep wounds fill with granulation tissue."],
["incision: secondary intention; scrape: primary intention","Reversed."],
["both heal by primary intention","Large surface area wounds need granulation tissue."],
["both heal by secondary intention","Clean apposed incisions can heal by primary intention."]]),
Q(5,"Slide-37","medium",true,"Which form of cell death is programmed yet still produces inflammation, primarily in inflammatory cells?",[
["pyroptosis","Programmed but inflammatory."],
["apoptosis","Programmed and non-inflammatory; phagocytes clear packaged fragments."],
["necrosis","Accidental death, inflammatory but not programmed."],
["karyolysis","A nuclear change (fading) seen in necrosis, not a death mechanism."]])
];
const $=s=>document.querySelector(s),app=$("#app");
const LS={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let sel=new Set(SUBJECTS.map((_,i)=>i)),prio=false,quiz=[],ans=[],cur=0,score=0,lastN=0;
let mode=LS.get("quizViewMode","single"),mute=LS.get("stfuErijah",false);
const L="ABCD";
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pool(){return questionBank.filter(q=>sel.has(q.subjectIndex))}
function renderHome(){
const cnt=i=>questionBank.filter(q=>q.subjectIndex===i).length,m=LS.get("quiz_missed_history",[]).length,p=pool();
const sizes=[["Quickie",15],["Standard",25],["Intense",35],["Full Exam",50]];
app.innerHTML=`<div class="wrap"><a class="btn" href="index.html">← Back to Main Page</a>
<h1 style="color:#ff9900">Gen Path: Injury &amp; Inflammation</h1><div class="muted">Week 6 • Hemostasis, inflammation, healing, necrosis</div>
<div class="card"><b>Modules</b><div>${SUBJECTS.map((s,i)=>`<span class="chip ${sel.has(i)?"on":""}" onclick="tog(${i})">[${s.week}] ${s.title} (${cnt(i)})</span>`).join("")}</div>
<button class="btn" onclick="selAll()">Select All</button><button class="btn" onclick="sel.clear();renderHome()">Clear</button>
<button class="btn ${prio?"act":""}" onclick="prio=!prio;renderHome()">Prioritize Missed (${m})</button></div>
<div class="card"><b>Active Pool: ${p.length} high-yield questions across ${sel.size} modules selected.</b><div style="margin-top:8px">
${sizes.map(([n,c])=>`<button class="btn" onclick="start(${c})">${n} (${c} Qs)</button>`).join("")}
<button class="btn" onclick="start(${p.length})">All Selected (${p.length} Qs)</button></div></div></div>`}
function tog(i){sel.has(i)?sel.delete(i):sel.add(i);renderHome()}
function selAll(){sel=new Set(SUBJECTS.map((_,i)=>i));renderHome()}
function start(n){
let p=shuffle(pool());if(!p.length)return;
if(prio){const mh=LS.get("quiz_missed_history",[]);p=p.filter(q=>mh.includes(q.id)).concat(p.filter(q=>!mh.includes(q.id)))}
lastN=n;quiz=p.slice(0,n).map(q=>({...q,options:shuffle(q.options)}));ans=[];cur=0;score=0;renderQuiz()}
function renderQuiz(){
const y=window.scrollY,done=ans.filter(a=>a!==undefined).length,tot=quiz.length;
const pct=done?Math.round(score/done*100):0;
const list=mode==="single"?[cur]:quiz.map((_,i)=>i);
app.innerHTML=`<div id="hdr"><div class="row"><b style="color:#ff9900">Gen Path Wk 6</b><span class="muted">Injury &amp; Inflammation</span>
<span class="pill">Score: ${score} / ${done} (${pct}%)</span>
<span class="pill">${mode==="single"?`Q ${cur+1} of ${tot}`:`Answered ${done} of ${tot}`}</span>
<button class="btn" id="modeBtn" onclick="mode=mode==='single'?'all':'single';LS.set('quizViewMode',mode);renderQuiz()">View: ${mode==="single"?"One by One":"All at Once"}</button>
<button class="btn" id="stfuBtn" onclick="mute=!mute;LS.set('stfuErijah',mute);renderQuiz()">${mute?"Bring Back Erijah":"STFU Erijah"}</button>
<button class="btn" onclick="renderHome()">Menu / Filter</button><a class="btn" href="index.html">Main Page</a></div>
<div id="bar" style="width:${done/tot*100}%"></div></div>
<div class="wrap">${list.map(qb).join("")}${nav()}</div>`;
window.scrollTo(0,y)}
function qb(i){
const q=quiz[i],a=ans[i],s=SUBJECTS[q.subjectIndex];
let h=`<div class="card"><div><span class="tag">${q.week}</span><span class="muted">${s.title} • ${q.difficulty}${q.priority?" • high-yield":""}</span></div>
<p style="font-size:17px"><b>${i+1}.</b> ${q.stem}</p>`;
q.options.forEach((o,j)=>{let c="";if(a!==undefined){if(o.correct)c="ok";else if(j===a)c="bad"}
h+=`<button class="opt ${c}" ${a!==undefined?"disabled":""} onclick="pick(${i},${j})">${L[j]}) ${o.text}</button>`});
if(a!==undefined){const ok=q.options[a].correct;
h+=`<div class="ban ${ok?"g":"r"}">${ok?"Correct!":"Incorrect."}</div>`+q.options.map((o,j)=>`<div class="why"><b>${L[j]}) [${o.correct?"CORRECT":"INCORRECT"}]:</b> ${o.why}</div>`).join("")}
return h+"</div>"}
function nav(){
const all=ans.filter(a=>a!==undefined).length===quiz.length;
if(mode==="all")return all?`<button class="btn act" onclick="showSummary()">Finish &amp; See Results</button>`:"";
return `<button class="btn" ${cur?"":"disabled"} onclick="cur--;renderQuiz()">← Prev</button>`+(cur<quiz.length-1?`<button class="btn" onclick="cur++;renderQuiz()">Next →</button>`:"")+(all?`<button class="btn act" onclick="showSummary()">Finish &amp; See Results</button>`:"")}
function pick(i,j){
if(ans[i]!==undefined)return;ans[i]=j;const q=quiz[i],ok=q.options[j].correct,mh=LS.get("quiz_missed_history",[]);
if(ok){score++;LS.set("quiz_missed_history",mh.filter(x=>x!==q.id))}
else{if(!mh.includes(q.id))mh.push(q.id);LS.set("quiz_missed_history",mh);wrongFx()}
renderQuiz()}
function wrongFx(){if(mute)return;try{const a=$("#wrongAudio");a.currentTime=0;a.play().catch(()=>{})}catch(e){}
const p=$("#wrongPopup");p.classList.remove("hidden");setTimeout(()=>p.classList.add("hidden"),1200)}
function showSummary(){
const pct=Math.round(score/quiz.length*100);
app.innerHTML=`<div class="wrap"><div class="card"><h1 style="color:#ff9900">Exam Complete</h1><h2>${score} / ${quiz.length} (${pct}%)</h2>
<button class="btn retake-btn" onclick="start(lastN)">Retake Same Exam</button>
<button class="btn retake-btn" onclick="renderHome()">Return to Dashboard</button>
<a href="index.html" class="retake-btn hub-btn btn">Back to Main Page</a></div></div>`}
renderHome();
</script></body></html>
