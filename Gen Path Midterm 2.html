<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gen Path Week 6: Injury & Inflammation — Quiz Hub</title>
  <style>
    :root {
      --bg-body: #0f0f0f;
      --bg-card: #1a1a1a;
      --bg-elevated: #222222;
      --border-subtle: #2a2a2a;
      --border-strong: #333333;
      --accent: #ff9900;
      --accent-hover: #e68a00;
      --text-primary: #ffffff;
      --text-muted: #a0a0a0;
      --correct-bg: #14532d;
      --correct-border: #22c55e;
      --incorrect-bg: #7f1d1d;
      --incorrect-border: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-body);
      color: var(--text-primary);
      line-height: 1.55;
      min-height: 100vh;
    }

    .hidden {
      display: none !important;
    }

    /* Sticky Top Header */
    #topHeader {
      position: sticky;
      top: 0;
      z-index: 1000;
      background-color: #121212;
      border-bottom: 1px solid var(--border-strong);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.7);
    }

    .header-inner {
      max-width: 980px;
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand-group {
      display: flex;
      flex-direction: column;
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hub-pill {
      background-color: var(--accent);
      color: #000000;
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 900;
      font-size: 0.85rem;
    }

    .brand-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .header-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .stat-pill {
      background-color: var(--bg-card);
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .stat-pill.score {
      border-color: var(--accent);
      color: var(--accent);
    }

    .hdr-btn {
      background-color: var(--bg-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      padding: 6px 11px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease;
    }

    .hdr-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .hdr-btn.muted-active {
      background-color: var(--incorrect-bg);
      border-color: var(--incorrect-border);
      color: #ffffff;
    }

    .hdr-btn.main-link {
      border-color: var(--accent);
    }

    .progress-track {
      width: 100%;
      height: 4px;
      background-color: #1f1f1f;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background-color: var(--accent);
      transition: width 0.25s ease;
    }

    /* Main Container */
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 16px 80px;
    }

    /* Home Dashboard */
    .top-nav-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .back-main-btn {
      background-color: #222222;
      color: #ffffff;
      border: 1px solid #ff9900;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.88rem;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .back-main-btn:hover {
      background-color: #ff9900;
      color: #000000;
    }

    .dash-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .dash-header {
      margin-bottom: 18px;
    }

    .week-tag {
      display: inline-block;
      background-color: rgba(255, 153, 0, 0.15);
      color: var(--accent);
      border: 1px solid var(--accent);
      font-size: 0.75rem;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 8px;
    }

    .dash-title {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .dash-desc {
      color: var(--text-muted);
      font-size: 0.92rem;
    }

    .filter-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .filter-label {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .filter-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .small-btn {
      background-color: var(--bg-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .small-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .small-btn.active-missed {
      background-color: var(--accent);
      color: #000000;
      border-color: var(--accent);
      font-weight: 800;
    }

    .module-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 18px;
    }

    .module-chip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      padding: 12px 16px;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
    }

    .module-chip.selected {
      background-color: rgba(255, 153, 0, 0.12);
      border-color: var(--accent);
    }

    .module-chip-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .wk-badge {
      background-color: var(--accent);
      color: #000000;
      font-size: 0.75rem;
      font-weight: 900;
      padding: 2px 7px;
      border-radius: 5px;
      white-space: nowrap;
    }

    .module-chip:not(.selected) .wk-badge {
      background-color: #333333;
      color: var(--text-muted);
    }

    .mod-name {
      font-weight: 700;
      font-size: 0.94rem;
    }

    .mod-count {
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: 700;
      white-space: nowrap;
    }

    .module-chip.selected .mod-count {
      color: var(--accent);
    }

    .pool-counter {
      background-color: #141414;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 18px;
    }

    .pool-counter strong {
      color: var(--accent);
    }

    .launcher-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
    }

    .launch-btn {
      background-color: var(--bg-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      padding: 14px 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }

    .launch-btn:hover:not(:disabled) {
      background-color: var(--accent);
      border-color: var(--accent);
      color: #000000;
    }

    .launch-btn:hover:not(:disabled) .launch-sub {
      color: #111111;
    }

    .launch-btn.primary-launch {
      background-color: var(--accent);
      border-color: var(--accent);
      color: #000000;
    }

    .launch-btn.primary-launch .launch-sub {
      color: #111111;
    }

    .launch-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .launch-title {
      font-weight: 800;
      font-size: 0.95rem;
    }

    .launch-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Question Cards */
    .q-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 20px;
    }

    .q-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      font-size: 0.78rem;
    }

    .q-num {
      font-weight: 800;
      color: var(--accent);
      font-size: 0.85rem;
    }

    .meta-badge {
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-strong);
      color: var(--text-muted);
      padding: 2px 8px;
      border-radius: 5px;
      font-weight: 600;
    }

    .meta-badge.wk {
      background-color: rgba(255, 153, 0, 0.14);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 800;
    }

    .meta-badge.hy {
      background-color: rgba(239, 68, 68, 0.15);
      border-color: #ef4444;
      color: #fca5a5;
      font-weight: 700;
    }

    .q-stem {
      font-size: 1.06rem;
      font-weight: 600;
      margin-bottom: 18px;
      color: var(--text-primary);
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .opt-btn {
      width: 100%;
      background-color: var(--bg-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      padding: 13px 16px;
      text-align: left;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      transition: all 0.15s ease;
    }

    .opt-btn:hover:not(:disabled) {
      border-color: var(--accent);
      background-color: #292929;
    }

    .opt-btn:disabled {
      cursor: default;
    }

    .opt-letter {
      font-weight: 800;
      color: var(--accent);
      min-width: 22px;
    }

    .opt-btn.correct {
      background-color: var(--correct-bg);
      border-color: var(--correct-border);
      color: #ffffff;
    }

    .opt-btn.correct .opt-letter {
      color: #86efac;
    }

    .opt-btn.incorrect {
      background-color: var(--incorrect-bg);
      border-color: var(--incorrect-border);
      color: #ffffff;
    }

    .opt-btn.incorrect .opt-letter {
      color: #fca5a5;
    }

    .opt-btn.dimmed {
      opacity: 0.55;
    }

    /* Streamlined Rationale Box (No Redundant Takeaway Box) */
    .rationale-box {
      margin-top: 16px;
      background-color: #141414;
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      padding: 16px;
    }

    .status-banner {
      display: inline-block;
      font-weight: 900;
      font-size: 0.95rem;
      padding: 4px 12px;
      border-radius: 6px;
      margin-bottom: 12px;
    }

    .status-banner.good {
      background-color: var(--correct-bg);
      border: 1px solid var(--correct-border);
      color: #86efac;
    }

    .status-banner.bad {
      background-color: var(--incorrect-bg);
      border: 1px solid var(--incorrect-border);
      color: #fca5a5;
    }

    .rationale-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.88rem;
    }

    .rationale-list li {
      padding: 8px 10px;
      border-radius: 6px;
      background-color: #1b1b1b;
      border-left: 3px solid #444444;
      color: #e5e5e5;
    }

    .rationale-list li.rat-correct {
      border-left-color: var(--correct-border);
      background-color: rgba(20, 83, 45, 0.25);
    }

    .rationale-list li.rat-wrong {
      border-left-color: var(--incorrect-border);
    }

    .rat-tag {
      font-weight: 800;
      margin-right: 4px;
    }

    .rat-tag.ok {
      color: #4ade80;
    }

    .rat-tag.no {
      color: #f87171;
    }

    /* Single Question Navigation */
    .single-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      gap: 10px;
    }

    .nav-btn {
      background-color: var(--bg-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      padding: 10px 18px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .nav-btn:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
    }

    .nav-btn.primary {
      background-color: var(--accent);
      border-color: var(--accent);
      color: #000000;
    }

    .nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Summary Card */
    .summary-card {
      background-color: var(--bg-card);
      border: 1px solid var(--accent);
      border-radius: 14px;
      padding: 28px 24px;
      text-align: center;
      margin-top: 24px;
    }

    .summary-pct {
      font-size: 3rem;
      font-weight: 900;
      color: var(--accent);
      margin: 8px 0;
    }

    .summary-sub {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 22px;
    }

    .summary-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .retake-btn {
      background-color: var(--accent);
      color: #000000;
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 11px 18px;
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: all 0.15s ease;
    }

    .retake-btn:hover {
      background-color: var(--accent-hover);
    }

    .retake-btn.secondary {
      background-color: #222222;
      color: #ffffff;
      border: 1px solid var(--border-strong);
    }

    .retake-btn.secondary:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .retake-btn.hub-btn {
      background-color: #222222;
      color: #ffffff;
      border: 1px solid #ff9900;
      text-decoration: none;
      display: inline-block;
    }

    .retake-btn.hub-btn:hover {
      background-color: #ff9900;
      color: #000000;
    }

    /* Wrong Answer Popup */
    .wrong-popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 3000;
      pointer-events: none;
      animation: popIn 0.15s ease-out;
    }

    .wrong-popup img {
      max-width: 80vw;
      max-height: 55vh;
      border-radius: 12px;
      border: 3px solid var(--incorrect-border);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.92);
      background-color: #111111;
    }

    @keyframes popIn {
      from { transform: translate(-50%, -50%) scale(0.85); opacity: 0; }
      to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Wrong Answer Audio & Visual Elements -->
  <audio id="wrongAudio" src="Wrong-answer.mp3" preload="auto"></audio>
  <div id="wrongPopup" class="wrong-popup hidden">
    <img id="wrongImage" src="Erijah.png" alt="Incorrect Feedback" onerror="this.parentElement.classList.add('hidden')" />
  </div>

  <!-- Sticky Top Bar -->
  <header id="topHeader">
    <div class="header-inner">
      <div class="brand-group">
        <div class="brand-title">
          <span>GEN PATH</span>
          <span class="hub-pill">HUB</span>
        </div>
        <span class="brand-sub">Week 6: Injury, Acute Inflammation &amp; Vascular Response</span>
      </div>

      <div class="header-controls">
        <span class="stat-pill score" id="scorePill">Score: 0 / 0 (0%)</span>
        <span class="stat-pill" id="progressPill">Ready</span>
        <button class="hdr-btn" id="modeBtn" title="Switch viewing mode">View: One by One</button>
        <button class="hdr-btn" id="stfuBtn" title="Mute wrong answer audio/popup">STFU Erijah</button>
        <button class="hdr-btn hidden" id="menuBtn">Menu / Filter</button>
        <a href="index.html" class="hdr-btn main-link">Main Page</a>
      </div>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </header>

  <main id="appMain"></main>

  <script>
    // =========================================================================
    // MASTER SUBJECT / MODULE TAXONOMY (WEEK 6 LABELED)
    // =========================================================================
    const SUBJECTS = [
      { title: "Injury Etiology, Cardinal Signs & Vasoactive Mediators", week: "Wk 6" },
      { title: "Vascular Events, Extravasation & Exudate Patterns", week: "Wk 6" },
      { title: "Inflammatory Timelines, Phases & Tissue Repair Foundations", week: "Wk 6" }
    ];

    // =========================================================================
    // EXHAUSTIVE APPLICATION-HEAVY QUESTION BANK (WEEK 6)
    // =========================================================================
    const questionBank = [
      // MODULE 0: Injury Etiology, Cardinal Signs & Vasoactive Mediators
      {
        id: 1,
        subjectIndex: 0,
        week: "Wk 6",
        slideRef: "Slide-3",
        difficulty: "easy",
        priority: true,
        stem: "Which classical Latin term corresponds to the fifth cardinal sign of inflammation later added by Galen to Celsus's original four signs?",
        options: [
          { text: "Functio laesa", correct: true, why: "Galen added functio laesa (altered or lost function) as the 5th cardinal sign alongside Celsus's rubor, tumor, calor, and dolor. [Slide #3]" },
          { text: "Rubor", correct: false, why: "Rubor denotes redness from hyperemia and was one of Celsus's original four cardinal signs. [Slide #3]" },
          { text: "Tumor", correct: false, why: "Tumor denotes swelling from edema and was one of Celsus's original four cardinal signs. [Slide #3]" },
          { text: "Dolor", correct: false, why: "Dolor denotes pain from chemical irritation and pressure and was one of Celsus's original four signs. [Slide #3]" }
        ]
      },
      {
        id: 2,
        subjectIndex: 0,
        week: "Wk 6",
        slideRef: "Slide-2",
        difficulty: "medium",
        priority: true,
        stem: "A patient develops localized tissue necrosis and acute inflammation at the site of a prescribed corticosteroid injection administered into a tendon sheath. How is the etiology of this tissue injury classified?",
        options: [
          { text: "Iatrogenic injury", correct: true, why: "Iatrogenesis refers to adverse tissue injury induced directly by a physician or healthcare provider's treatment. [Slide #2]" },
          { text: "Idiopathic injury", correct: false, why: "Idiopathic describes a condition arising spontaneously from an unknown cause rather than a known medical intervention. [Slide #2]" },
          { text: "Nosocomial etiology", correct: false, why: "Nosocomial refers specifically to hospital-acquired infections rather than direct treatment-induced trauma. [Slide #2]" },
          { text: "Congenital etiology", correct: false, why: "Congenital conditions are present at birth rather than induced by a therapeutic procedure. [Slide #2]" }
        ]
      },
      {
        id: 3,
        subjectIndex: 0,
        week: "Wk 6",
        slideRef: "Lecture Transcript",
        difficulty: "medium",
        priority: true,
        stem: "Immediately following an acute ankle inversion trauma, hemostatic vasoconstriction occurs within seconds, whereas erythema and edema develop several minutes later. Which difference in control mechanisms explains this temporal gap?",
        options: [
          { text: "Vascular spasm is triggered by an immediate neurogenic reflex, whereas inflammation requires multistep chemical mediation", correct: true, why: "Initial bleeding control relies on rapid neurogenic reflexes, whereas inflammation depends on mast cell degranulation and enzymatic synthesis of chemical mediators. [Lecture Transcript]" },
          { text: "Initial bleeding is driven by prostaglandins, whereas inflammation relies on slow sympathetic nerve firing", correct: false, why: "This inverts the mechanisms; neurogenic reflexes act immediately on blood vessels while prostaglandins are synthesized later during inflammation. [Lecture Transcript]" },
          { text: "Vasoconstriction requires de novo transcription of cytokines, whereas edema is caused by direct mechanical tearing", correct: false, why: "Vasoconstriction does not require gene transcription, and inflammatory edema is driven by histamine-induced permeability. [Lecture Transcript]" },
          { text: "Neurogenic reflexes increase capillary permeability immediately, whereas chemical mediators arrest blood flow", correct: false, why: "Neurogenic reflexes induce immediate vasoconstriction to limit bleeding, while chemical mediators increase blood flow and permeability. [Lecture Transcript]" }
        ]
      },
      {
        id: 4,
        subjectIndex: 0,
        week: "Wk 6",
        slideRef: "Slide-4",
        difficulty: "medium",
        priority: true,
        stem: "Administration of a drug that selectively inhibits the enzyme phospholipase A2 in injured tissue will directly block the synthesis of _______ from membrane phospholipids.",
        options: [
          { text: "arachidonic acid", correct: true, why: "Phospholipase converts membrane phospholipids from mast cells and injured cells into arachidonic acid, the precursor for eicosanoids. [Slide #4]" },
          { text: "preformed histamine", correct: false, why: "Histamine is stored preformed in mast cell granules and released by degranulation rather than synthesized by phospholipase. [Slide #4]" },
          { text: "serotonin (5-HT)", correct: false, why: "Serotonin is released via mast cell and platelet degranulation rather than cleaved from membrane phospholipids. [Slide #4]" },
          { text: "complement factor C3a", correct: false, why: "Complement proteins are plasma zymogens synthesized by the liver rather than membrane phospholipid derivatives. [Slide #4]" }
        ]
      },
      {
        id: 5,
        subjectIndex: 0,
        week: "Wk 6",
        slideRef: "Slide-4",
        difficulty: "medium",
        priority: true,
        stem: "Which three eicosanoid families are generated downstream once arachidonic acid is liberated from damaged cell membranes?",

    // =========================================================================
    // STATE & LOCAL STORAGE
    // =========================================================================
    const MISSED_KEY = "quiz_missed_history";
    const MODE_KEY = "quizViewMode";
    const MUTE_KEY = "stfuErijah";

    let selectedModules = new Set(SUBJECTS.map((_, i) => i));
    let prioritizeMissed = false;
    let viewMode = localStorage.getItem(MODE_KEY) || "single"; // "single" | "all"
    let isMuted = localStorage.getItem(MUTE_KEY) === "true";

    let activeQuiz = [];
    let currentIndex = 0;
    let userAnswers = {}; // { [questionId]: chosenOptionIndex }
    let popupTimer = null;

    // =========================================================================
    // HELPERS
    // =========================================================================
    function fisherYates(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function escapeHTML(str) {
      return String(str).replace(/[&<>"']/g, ch => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[ch]));
    }

    function getMissedSet() {
      try {
        return new Set(JSON.parse(localStorage.getItem(MISSED_KEY) || "[]"));
      } catch (e) {
        return new Set();
      }
    }

    function saveMissedSet(set) {
      try {
        localStorage.setItem(MISSED_KEY, JSON.stringify([...set]));
      } catch (e) {}
    }

    function triggerWrongFeedback() {
      if (isMuted) return;
      const audio = document.getElementById("wrongAudio");
      const popup = document.getElementById("wrongPopup");

      if (audio) {
        audio.currentTime = 0;
        audio.play().catch(() => {});
      }
      if (popup) {
        popup.classList.remove("hidden");
        if (popupTimer) clearTimeout(popupTimer);
        popupTimer = setTimeout(() => {
          popup.classList.add("hidden");
        }, 1200);
      }
    }

    function syncHeaderControls() {
      const modeBtn = document.getElementById("modeBtn");
      const stfuBtn = document.getElementById("stfuBtn");

      modeBtn.textContent = viewMode === "single" ? "View: One by One" : "View: All at Once";
      stfuBtn.textContent = isMuted ? "Bring Back Erijah" : "STFU Erijah";
      stfuBtn.classList.toggle("muted-active", isMuted);
    }

    function updateHeaderStats() {
      const total = activeQuiz.length;
      const answeredIds = Object.keys(userAnswers);
      const answeredCount = answeredIds.length;
      let correctCount = 0;

      activeQuiz.forEach(q => {
        const chosen = userAnswers[q.id];
        if (chosen !== undefined && q.options[chosen] && q.options[chosen].correct) {
          correctCount++;
        }
      });

      const pct = total > 0 ? Math.round((correctCount / total) * 100) : 0;
      document.getElementById("scorePill").textContent = `Score: ${correctCount} / ${total} (${pct}%)`;

      if (total === 0) {
        document.getElementById("progressPill").textContent = "Dashboard";
        document.getElementById("progressFill").style.width = "0%";
      } else {
        if (viewMode === "single") {
          document.getElementById("progressPill").textContent = `Q ${Math.min(currentIndex + 1, total)} of ${total}`;
        } else {
          document.getElementById("progressPill").textContent = `Answered ${answeredCount} of ${total}`;
        }
        document.getElementById("progressFill").style.width = `${(answeredCount / total) * 100}%`;
      }
    }

    // =========================================================================
    // HOME DASHBOARD & MODULE FILTERING
    // =========================================================================
    function renderHome() {
      activeQuiz = [];
      userAnswers = {};
      currentIndex = 0;

      document.getElementById("menuBtn").classList.add("hidden");
      updateHeaderStats();

      const missedSet = getMissedSet();
      const filteredPool = questionBank.filter(q => selectedModules.has(q.subjectIndex));
      const missedInPoolCount = filteredPool.filter(q => missedSet.has(q.id)).length;
      const totalSelected = filteredPool.length;

      const main = document.getElementById("appMain");
      main.innerHTML = `
        <div class="top-nav-row">
          <a href="index.html" class="back-main-btn">← Back to Main Page</a>
        </div>

        <div class="dash-card">
          <div class="dash-header">
            <span class="week-tag">Week 6 Material • General Pathology</span>
            <h1 class="dash-title">Week 6: Injury, Acute Inflammation &amp; Vascular Response</h1>
            <p class="dash-desc">
              Application-calibrated NBCE Part 1 practice bank covering injury etiologies, SHARP cardinal signs, histamine &amp; arachidonic acid cascades, leukocyte extravasation, exudate patterns, and tissue repair.

          </div>

          <div class="filter-toolbar">
            <span class="filter-label">Filter Study Modules (Week 6):</span>

            </div>
          </div>

          <div class="module-grid" id="moduleGrid">
            ${SUBJECTS.map((subj, idx) => {

              return `
                <div class="module-chip ${isSel ? "selected" : ""}" data-idx="${idx}">
                  <div class="module-chip-left">
                    <span class="wk-badge">[${escapeHTML(subj.week)}]</span>
                    <span class="mod-name">${escapeHTML(subj.title)}</span>
                  </div>
                  <span class="mod-count">(${count} Qs)</span>
                </div>
              `;
            }).join("")}
          </div>

          <div class="pool-counter">
            Active Pool: <strong>${totalSelected}</strong> high-yield application questions across <strong>${selectedModules.size}</strong> module${selectedModules.size === 1 ? "" : "s"} selected.
          </div>

          <div class="launcher-grid">
            <button class="launch-btn" data-len="15" ${totalSelected === 0 ? "disabled" : ""}>
              <span class="launch-title">Quickie</span>
              <span class="launch-sub">(${Math.min(15, totalSelected)} Qs)</span>
            </button>
            <button class="launch-btn" data-len="25" ${totalSelected === 0 ? "disabled" : ""}>
              <span class="launch-title">Standard</span>
              <span class="launch-sub">(${Math.min(25, totalSelected)} Qs)</span>
            </button>
            <button class="launch-btn" data-len="35" ${totalSelected === 0 ? "disabled" : ""}>
              <span class="launch-title">Intense</span>
              <span class="launch-sub">(${Math.min(35, totalSelected)} Qs)</span>
            </button>
            <button class="launch-btn" data-len="50" ${totalSelected === 0 ? "disabled" : ""}>
              <span class="launch-title">Full Exam</span>
              <span class="launch-sub">(${Math.min(50, totalSelected)} Qs)</span>
            </button>
            <button class="launch-btn primary-launch" data-len="all" ${totalSelected === 0 ? "disabled" : ""}>
              <span class="launch-title">All Selected</span>
              <span class="launch-sub">(${totalSelected} Qs)</span>
            </button>
          </div>
        </div>
      `;

      // Attach dashboard listeners
      main.querySelectorAll(".module-chip").forEach(chip => {
        chip.addEventListener("click", () => {
          const idx = Number(chip.dataset.idx);
          if (selectedModules.has(idx)) {
            selectedModules.delete(idx);
          } else {
            selectedModules.add(idx);
          }
          renderHome();
        });
      });

      document.getElementById("selectAllBtn").addEventListener("click", () => {
        selectedModules = new Set(SUBJECTS.map((_, i) => i));
        renderHome();
      });

      document.getElementById("clearAllBtn").addEventListener("click", () => {
        selectedModules.clear();
        renderHome();
      });

      document.getElementById("missedToggleBtn").addEventListener("click", () => {
        prioritizeMissed = !prioritizeMissed;
        renderHome();
      });

      main.querySelectorAll(".launch-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const rawLen = btn.dataset.len;
          const limit = rawLen === "all" ? Infinity : Number(rawLen);
          launchQuiz(limit);
        });
      });
    }

    // =========================================================================
    // QUIZ LAUNCH & TWO-WAY FISHER-YATES SHUFFLE
    // =========================================================================
    let lastLaunchLimit = Infinity;

    function launchQuiz(limit) {
      lastLaunchLimit = limit;
      const pool = JSON.parse(JSON.stringify(
        questionBank.filter(q => selectedModules.has(q.subjectIndex))
      ));

      if (pool.length === 0) return;

      // Shuffle options inside every question (Two-Way Fisher-Yates part 1)
      pool.forEach(q => fisherYates(q.options));

      // Shuffle question pool (Two-Way Fisher-Yates part 2)
      fisherYates(pool);

      // If Prioritize Missed is enabled, partition missed questions to the front
      if (prioritizeMissed) {
        const missedSet = getMissedSet();
        const missedFirst = pool.filter(q => missedSet.has(q.id));
        const others = pool.filter(q => !missedSet.has(q.id));
        activeQuiz = [...missedFirst, ...others].slice(0, limit);
      } else {
        activeQuiz = pool.slice(0, limit);
      }

      currentIndex = 0;
      userAnswers = {};
      document.getElementById("menuBtn").classList.remove("hidden");
      renderQuizView();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // =========================================================================
    // RENDER QUIZ (ONE BY ONE OR ALL AT ONCE)
    // =========================================================================
    function buildQuestionCardHTML(q, index) {
      const subj = SUBJECTS[q.subjectIndex] || { title: "General Pathology", week: q.week };
      const chosenIdx = userAnswers[q.id];
      const isAnswered = chosenIdx !== undefined;
      const isUserCorrect = isAnswered && q.options[chosenIdx] && q.options[chosenIdx].correct;
      const diffCap = q.difficulty.charAt(0).toUpperCase() + q.difficulty.slice(1);

      const optionsHTML = q.options.map((opt, oi) => {
        let cls = "opt-btn";
        if (isAnswered) {
          if (opt.correct) {
            cls += " correct";
          } else if (oi === chosenIdx) {
            cls += " incorrect";
          } else {
            cls += " dimmed";
          }
        }
        return `
          <button class="${cls}" data-qid="${q.id}" data-oi="${oi}" ${isAnswered ? "disabled" : ""}>
            <span class="opt-letter">${String.fromCharCode(65 + oi)})</span>
            <span>${escapeHTML(opt.text)}</span>
          </button>
        `;
      }).join("");

      let rationaleHTML = "";
      if (isAnswered) {
        rationaleHTML = `
          <div class="rationale-box">
            <div class="status-banner ${isUserCorrect ? "good" : "bad"}">
              ${isUserCorrect ? "Correct!" : "Incorrect."}
            </div>
            <ul class="rationale-list">
              ${q.options.map((opt, oi) => `
                <li class="${opt.correct ? "rat-correct" : "rat-wrong"}">
                  <span class="rat-tag ${opt.correct ? "ok" : "no"}">
                    ${String.fromCharCode(65 + oi)}) [${opt.correct ? "CORRECT" : "INCORRECT"}]:
                  </span>
                  ${escapeHTML(opt.why)}
                </li>
              `).join("")}
            </ul>
          </div>
        `;
      }

      return `
        <article class="q-card" id="qcard-${q.id}">
          <div class="q-meta">
            <span class="q-num">Question ${index + 1} of ${activeQuiz.length}</span>
            <span class="meta-badge wk">[${escapeHTML(q.week)}]</span>
            <span class="meta-badge">${escapeHTML(subj.title)}</span>
            <span class="meta-badge">${diffCap}</span>
            ${q.priority ? '<span class="meta-badge hy">High-Yield</span>' : ""}
          </div>
          <div class="q-stem">${escapeHTML(q.stem)}</div>
          <div class="options-list">
            ${optionsHTML}
          </div>
          ${rationaleHTML}
        </article>
      `;
    }

    function renderQuizView() {
      updateHeaderStats();
      const main = document.getElementById("appMain");
      const allAnswered = Object.keys(userAnswers).length === activeQuiz.length;

      if (viewMode === "single") {
        const q = activeQuiz[currentIndex];
        const isCurrentAnswered = userAnswers[q.id] !== undefined;
        const isLast = currentIndex === activeQuiz.length - 1;

        main.innerHTML = `
          ${buildQuestionCardHTML(q, currentIndex)}
          <div class="single-nav">
            <button class="nav-btn" id="prevQBtn" ${currentIndex === 0 ? "disabled" : ""}>← Previous</button>
            ${isLast && allAnswered
              ? `<button class="nav-btn primary" id="finishBtn">View Final Summary →</button>`
              : `<button class="nav-btn ${isCurrentAnswered ? "primary" : ""}" id="nextQBtn" ${isLast ? "disabled" : ""}>Next Question →</button>`
            }
          </div>
          ${allAnswered ? renderSummaryHTML() : ""}
        `;

        const prevBtn = document.getElementById("prevQBtn");
        if (prevBtn) {
          prevBtn.addEventListener("click", () => {
            if (currentIndex > 0) {
              currentIndex--;
              renderQuizView();
              window.scrollTo({ top: 0, behavior: "smooth" });
            }
          });
        }

        const nextBtn = document.getElementById("nextQBtn");
        if (nextBtn) {
          nextBtn.addEventListener("click", () => {
            if (currentIndex < activeQuiz.length - 1) {
              currentIndex++;
              renderQuizView();
              window.scrollTo({ top: 0, behavior: "smooth" });
            }
          });
        }

        const finishBtn = document.getElementById("finishBtn");
        if (finishBtn) {
          finishBtn.addEventListener("click", () => {
            const sumEl = document.getElementById("summaryCard");
            if (sumEl) sumEl.scrollIntoView({ behavior: "smooth" });
          });
        }
      } else {
        // All at once mode
        main.innerHTML = `
          ${activeQuiz.map((q, idx) => buildQuestionCardHTML(q, idx)).join("")}
          ${allAnswered ? renderSummaryHTML() : ""}
        `;
      }

      // Attach option click listeners
      main.querySelectorAll(".opt-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const qid = Number(btn.dataset.qid);
          const oi = Number(btn.dataset.oi);
          handleOptionSelect(qid, oi);
        });
      });

      // Attach summary buttons if visible
      const retakeSameBtn = document.getElementById("retakeSameBtn");
      if (retakeSameBtn) {
        retakeSameBtn.addEventListener("click", () => launchQuiz(lastLaunchLimit));
      }
      const backDashBtn = document.getElementById("backDashBtn");
      if (backDashBtn) {
        backDashBtn.addEventListener("click", () => renderHome());
      }
    }

    function handleOptionSelect(qid, oi) {
      if (userAnswers[qid] !== undefined) return;

      const q = activeQuiz.find(item => item.id === qid);
      if (!q) return;

      userAnswers[qid] = oi;
      const isCorrect = Boolean(q.options[oi] && q.options[oi].correct);

      // Update localStorage missed history
      const missedSet = getMissedSet();
      if (isCorrect) {
        missedSet.delete(qid);
      } else {
        missedSet.add(qid);
        triggerWrongFeedback();
      }
      saveMissedSet(missedSet);

      const scrollY = window.scrollY;
      renderQuizView();

      if (viewMode === "all") {
        window.scrollTo({ top: scrollY });
      }

      if (Object.keys(userAnswers).length === activeQuiz.length) {
        const sumEl = document.getElementById("summaryCard");
        if (sumEl && viewMode === "single") {
          sumEl.scrollIntoView({ behavior: "smooth" });
        }
      }
    }

    // =========================================================================
    // COMPLETION SUMMARY
    // =========================================================================
    function renderSummaryHTML() {
      const total = activeQuiz.length;
      let correct = 0;
      activeQuiz.forEach(q => {
        const chosen = userAnswers[q.id];
        if (chosen !== undefined && q.options[chosen] && q.options[chosen].correct) {
          correct++;
        }
      });
      const pct = total > 0 ? Math.round((correct / total) * 100) : 0;

      let tierMsg = "Solid effort—review the missed rationales and run another pass.";
      if (pct >= 90) {
        tierMsg = "Board-ready mastery of Week 6 Injury & Inflammation.";
      } else if (pct < 70) {
        tierMsg = "Use 'Prioritize Missed' on the dashboard to drill your weak mechanisms.";
      }

      return `
        <section class="summary-card" id="summaryCard">
          <span class="week-tag">Week 6 Assessment Complete</span>
          <div class="summary-pct">${pct}%</div>
          <p class="summary-sub">You scored <strong>${correct} out of ${total}</strong>. ${tierMsg}</p>
          <div class="summary-actions">
            <button class="retake-btn" id="retakeSameBtn">Retake Same Exam</button>
            <button class="retake-btn secondary" id="backDashBtn">Return to Dashboard</button>
            <a href="index.html" class="retake-btn hub-btn">Back to Main Page</a>
          </div>
        </section>
      `;
    }

    // =========================================================================
    // HEADER BUTTON LISTENERS & INITIALIZATION
    // =========================================================================
    document.getElementById("modeBtn").addEventListener("click", () => {
      viewMode = viewMode === "single" ? "all" : "single";
      localStorage.setItem(MODE_KEY, viewMode);
      syncHeaderControls();
      if (activeQuiz.length > 0) {
        const scrollY = window.scrollY;
        renderQuizView();
        if (viewMode === "all") window.scrollTo({ top: scrollY });
      }
    });

    document.getElementById("stfuBtn").addEventListener("click", () => {
      isMuted = !isMuted;
      localStorage.setItem(MUTE_KEY, String(isMuted));
      syncHeaderControls();
      if (isMuted) {
        const popup = document.getElementById("wrongPopup");
        if (popup) popup.classList.add("hidden");
      }
    });

    document.getElementById("menuBtn").addEventListener("click", () => {
      renderHome();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    window.onload = () => {
      syncHeaderControls();
      renderHome();
    };
  </script>
</body>
</html>
