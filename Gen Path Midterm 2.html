<script>
const SUBJECTS = [
  "Hemostasis & Neurogenic vs Chemical Signaling",
  "Coagulation Pathways & Fates of a Thrombus",
  "Clotting Disorders & Bruising",
  "Injury Terms, Mediators & Arachidonic Acid",
  "Phases of Inflammation & Exudates",
  "Macrophages, Collagen & Tissue Repair",
  "Wound Healing & Pathological Healing",
  "Cell Death & Necrotic Patterns",
  "Starling's Forces & Edema",
  "Lipid Accumulations",
  "Mineral & Heavy Metal Accumulations",
  "Amyloidosis & Multiple Myeloma",
  "Vitamin & Mineral Deficiencies",
  "Neoplasia: Growth Abnormalities, Benign vs Malignant & Staging",
  "Blood, Lymph & Bone Cancers"
];

let _id = 1;
function makeQ(week, subjectIndex, ref, difficulty, priority, stem, opts) {
  const wLabel = `Week ${week} • ${ref}`;
  return {
    id: _id++,
    week: week,
    subjectIndex: subjectIndex,
    quarter: 3,
    slideRef: ref,
    difficulty: difficulty,
    priority: priority,
    stem: stem,
    options: opts.map((item, idx) => ({
      text: item[0],
      correct: idx === 0,
      why: `${item[1]} [${wLabel}]`
    }))
  };
}

const T = "Lecture Transcript";
const S = "Slide Deck";

const questionBank = [
  // ================= SUBJECT 0: Hemostasis & Signaling (Week 6) =================
  makeQ(6, 0, S, "easy", true, "The three steps of hemostasis, in sequential order, are vascular spasm, _______, and _______.", [
    ["platelet plug formation; coagulation", "Vascular spasm occurs immediately, followed by platelet aggregation and finally the slower chemical coagulation cascade."],
    ["coagulation; platelet plug formation", "Coagulation is the slowest, final stage of hemostasis rather than the second step."],
    ["clot lysis; coagulation", "Fibrinolytic clot lysis occurs after bleeding has stopped and tissue repair begins."],
    ["platelet plug formation; clot lysis", "Clot lysis dissolves fibrin after vessel repair and is not one of the three steps of hemostasis."]
  ]),
  makeQ(6, 0, T, "medium", true, "Compared with chemical signaling after tissue injury, neurogenic signaling is _______ acting and _______ lasting.", [
    ["faster; shorter", "Sympathetic neural reflexes fire within seconds but fatigue rapidly, whereas chemical mediators act slower and persist longer."],
    ["faster; longer", "Neural reflexes act immediately upon injury but do not sustain prolonged vascular responses."],
    ["slower; shorter", "Chemical mediators are slower acting; neurogenic pathways provide the fastest initial response."],
    ["slower; longer", "Slower onset with prolonged duration characterizes chemical mediator signaling rather than neurogenic reflexes."]
  ]),
  makeQ(6, 0, S, "medium", true, "The immediate vascular response to an arterial laceration is a _______ reflex producing _______ of smooth muscle.", [
    ["neurogenic; vasoconstriction", "Sympathetic nerves rapidly constrict arterial smooth muscle to reduce local blood flow and limit hemorrhage."],
    ["chemical; vasoconstriction", "Chemical mediators act later; the initial vascular spasm is driven by a rapid neurogenic reflex."],
    ["neurogenic; vasodilation", "Vasodilation increases blood flow to the injured site, whereas early hemostasis requires vasoconstriction."],
    ["chemical; vasodilation", "Histamine-induced vasodilation occurs later during acute inflammation, not during initial hemostasis."]
  ]),
  makeQ(6, 0, T, "medium", true, "Arterial vasoconstriction during vascular spasm assists platelets primarily by _______.", [
    ["slowing blood flow so platelets can adhere to the damaged wall and aggregate", "Reduced shear force and slower flow allow platelets to bind exposed medial collagen and form a plug."],
    ["cleaving soluble fibrinogen into insoluble fibrin strands", "Fibrinogen cleavage is catalyzed by thrombin during the common coagulation pathway, not by smooth muscle contraction."],
    ["activating plasminogen to prevent intravascular thrombosis", "Plasminogen activation initiates fibrinolysis after hemostasis rather than aiding platelet adhesion."],
    ["directly activating Factor VII in the extrinsic cascade", "Factor VII is activated by tissue thromboplastin released from damaged cells, not by vasoconstriction."]
  ]),
  makeQ(6, 0, T, "medium", true, "When platelets bind exposed medial collagen, they release _______, which _______ vascular spasm and recruits additional platelets.", [
    ["thromboxane; enhances", "Platelet-derived thromboxane reinforces arterial vasoconstriction and promotes further platelet aggregation."],
    ["thromboplastin; enhances", "Thromboplastin is tissue factor released by injured extravascular cells, not a platelet granule product."],
    ["thromboxane; inhibits", "Thromboxane promotes vasoconstriction and aggregation rather than relaxing arterial smooth muscle."],
    ["plasmin; enhances", "Plasmin digests fibrin clots and plays no role in recruiting platelets or sustaining spasm."]
  ]),
  makeQ(6, 0, S, "medium", false, "Activated platelets release PDGF and FGF to stimulate _______, and release VEGF to restore _______.", [
    ["fibroblast proliferation and collagen synthesis; local blood supply", "PDGF and FGF drive fibroblast collagen deposition, whereas VEGF stimulates angiogenesis."],
    ["local blood supply; fibroblast proliferation and collagen synthesis", "VEGF drives new capillary formation, while PDGF and FGF stimulate fibroblast collagen repair."],
    ["fibrinolytic clot dissolution; platelet plug aggregation", "Growth factors coordinate tissue repair and angiogenesis rather than clot lysis or aggregation."],
    ["Factor XII contact activation; Factor VII extrinsic activation", "Clotting factors are activated by collagen and tissue factor rather than platelet growth factors."]
  ]),
  makeQ(6, 0, T, "hard", true, "Seconds after a deep laceration to the forearm, the surrounding skin blanches and bleeding slows before any fibrin mesh has formed. This immediate response is mediated by _______.", [
    ["sympathetic stimulation of arterial smooth muscle", "The rapid neurogenic vascular spasm constricts local arterioles within seconds of trauma."],
    ["histamine release from degranulating tissue mast cells", "Histamine causes vasodilation and redness during acute inflammation rather than immediate blanching."],
    ["tissue thromboplastin activating circulating Factor VII", "Extrinsic coagulation takes minutes to generate fibrin and does not cause immediate skin blanching."],
    ["plasmin-mediated cleavage of cross-linked fibrin strands", "Plasmin lyses established clots after hemostasis rather than slowing initial arterial bleeding."]
  ]),
  makeQ(6, 0, T, "hard", true, "A patient with severe thrombocytopenia exhibits normal initial blanching after a minor skin cut but continues to ooze blood persistently. Which phase of hemostasis is primarily impaired?", [
    ["platelet plug formation", "Insufficient circulating platelets prevent mechanical sealing of the vascular defect despite intact vascular spasm."],
    ["vascular spasm", "Initial skin blanching confirms that the neurogenic vasoconstrictive reflex is functioning normally."],
    ["sympathetic arterial innervation", "Sympathetic vasoconstriction remains intact, as evidenced by the immediate blanching response."],
    ["plasminogen conversion to plasmin", "Fibrinolysis removes clots after healing and does not cause primary oozing from a fresh cut."]
  ]),

  // ================= SUBJECT 1: Coagulation & Thrombus Fates (Week 6) =================
  makeQ(6, 1, S, "medium", true, "Damage to the vessel interior exposes medial collagen, which activates Factor _______ to initiate the _______ coagulation pathway.", [
    ["XII; intrinsic", "Factor XII (Hageman factor) contacts negatively charged medial collagen to trigger the intrinsic cascade."],
    ["VII; intrinsic", "Factor VII initiates the extrinsic pathway via tissue factor rather than intrinsic collagen contact."],
    ["XII; extrinsic", "Factor XII initiates the intrinsic pathway; the extrinsic pathway begins with Factor VII."],
    ["X; extrinsic", "Factor X is the convergence point of the common pathway rather than an initiating factor."]
  ]),
  makeQ(6, 1, S, "medium", true, "Trauma to extravascular tissues releases _______, which activates Factor _______ of the extrinsic pathway.", [
    ["thromboplastin; VII", "Tissue thromboplastin (tissue factor) complexes with and activates Factor VII to start the extrinsic cascade."],
    ["thromboxane; VII", "Thromboxane is released by activated platelets to promote aggregation, not to activate Factor VII."],
    ["thromboplastin; XII", "Factor XII is activated by negatively charged medial collagen in the intrinsic pathway."],
    ["thromboxane; XII", "Neither thromboxane nor Factor XII belongs to the tissue-factor extrinsic cascade."]
  ]),
  makeQ(6, 1, T, "medium", true, "Whole blood placed in an unlined glass test tube clots without tissue trauma because the negatively charged glass mimics _______.", [
    ["exposed medial collagen", "Both glass and medial collagen carry negative surface charges that activate Factor XII in the intrinsic pathway."],
    ["tissue thromboplastin", "Tissue thromboplastin activates the extrinsic pathway via Factor VII rather than contact activation."],
    ["circulating plasminogen", "Plasminogen is the inactive precursor of fibrinolytic plasmin and does not initiate clotting."],
    ["platelet thromboxane", "Thromboxane is a chemical eicosanoid mediator rather than a negatively charged contact surface."]
  ]),
  makeQ(6, 1, S, "medium", true, "Both coagulation pathways converge at Factor _______, enabling _______ to cleave soluble fibrinogen into insoluble _______.", [
    ["X; thrombin; fibrin", "Activated Factor X converts prothrombin into thrombin, which polymerizes fibrinogen into a fibrin mesh."],
    ["VIII; plasmin; fibrin", "Factor VIII is an intrinsic cofactor upstream of Factor X, and plasmin degrades fibrin."],
    ["X; plasmin; fibrinogen", "Plasmin is a fibrinolytic enzyme that dissolves clots rather than forming fibrin."],
    ["XII; thrombin; plasminogen", "Factor XII initiates only the intrinsic pathway and does not serve as the common convergence point."]
  ]),
  makeQ(6, 1, S, "medium", true, "Which group lists all four vitamin K-dependent coagulation factors?", [
    ["Factors II, VII, IX, and X", "Factors II (prothrombin), VII, IX, and X require hepatic vitamin K-dependent carboxylation to function."],
    ["Factors I, V, VIII, and XII", "None of these four factors require vitamin K for hepatic synthesis."],
    ["Factors VIII, IX, XI, and XII", "Only Factor IX in this group is vitamin K-dependent; VIII, XI, and XII are not."],
    ["Factors III, IV, V, and VIII", "Tissue factor (III), calcium (IV), Factor V, and Factor VIII do not depend on vitamin K."]
  ]),
  makeQ(6, 1, T, "medium", true, "A thrombus fragment detaches from a deep leg vein, travels through the circulation, and occludes a distal vessel. This migrating mass is a(n) _______.", [
    ["embolus", "An embolus is any detached intravascular mass carried by blood flow to a distant site."],
    ["hematoma", "A hematoma is a localized collection of extravasated blood outside the vascular lumen."],
    ["aneurysm", "An aneurysm is a localized pathological dilation or ballooning of a weakened arterial wall."],
    ["varicosity", "A varicosity is a dilated, tortuous vein resulting from valvular incompetence."]
  ]),
  makeQ(6, 1, S, "medium", false, "An intravascular thrombus that becomes infiltrated by fibroblasts and permanently replaced with collagenous scar has undergone _______.", [
    ["organization", "Organization replaces the thrombus with vascularized connective tissue scar anchored to the vessel wall."],
    ["lysis", "Lysis refers to enzymatic dissolution of the fibrin clot by plasmin."],
    ["embolization", "Embolization occurs when fragments break loose and travel downstream."],
    ["debridement", "Debridement is the phagocytic removal of necrotic cellular debris by macrophages."]
  ]),
  makeQ(6, 1, T, "medium", false, "Localized ballooning from structural weakness of an arterial wall is a(n) _______, whereas a dilated vein prone to stasis clots is a(n) _______.", [
    ["aneurysm; varicosity", "Arterial wall weakness produces aneurysms, while venous valve failure produces varicosities."],
    ["varicosity; aneurysm", "Varicosities occur in veins, whereas aneurysms occur in weakened arterial walls."],
    ["embolus; aneurysm", "An embolus is a mobile intravascular clot rather than a structural arterial dilation."],
    ["hematoma; varicosity", "A hematoma represents extravascular blood accumulation rather than an arterial wall bulge."]
  ]),
  makeQ(6, 1, T, "medium", false, "A thrombus forming in a sluggish varicose vein produces a _______ thrombus due to trapped erythrocytes, whereas a high-flow arterial clot forms a _______ thrombus.", [
    ["red; white", "Venous stasis traps abundant red blood cells, whereas rapid arterial flow yields platelet-rich white thrombi."],
    ["white; red", "White thrombi form in high-shear arteries, while red thrombi form in low-flow veins."],
    ["red; red", "Arterial thrombi are composed primarily of platelets and fibrin and appear pale rather than red."],
    ["white; white", "Slow venous circulation traps red cells, producing dark red thrombi."]
  ]),
  makeQ(6, 1, T, "medium", false, "Slow or turbulent blood flow predisposes patients to thrombosis primarily because it _______.", [
    ["concentrates activated clotting factors and brings platelets into wall contact", "Stasis and turbulence disrupt protective laminar flow and prevent dilution of activated clotting factors."],
    ["triggers immediate sympathetic arterial vasodilation", "Turbulence disrupts endothelial alignment and concentrates clotting factors rather than inducing vasodilation."],
    ["accelerates plasmin-mediated fibrinolysis", "Plasmin degrades fibrin clots; stasis promotes clot growth rather than clot lysis."],
    ["induces acute autoimmune thrombocytopenia", "Altered hemodynamics affect local coagulation factor concentration rather than platelet destruction."]
  ]),
  makeQ(6, 1, S, "medium", true, "Heparin functions clinically as a(n) _______, whereas plasmin generated from plasminogen functions as a(n) _______.", [
    ["anticoagulant; thrombolytic", "Heparin inhibits coagulation cascade enzymes to prevent clotting, whereas plasmin digests existing fibrin clots."],
    ["thrombolytic; anticoagulant", "Heparin prevents new thrombus formation, while plasmin dissolves formed fibrin."],
    ["anticoagulant; procoagulant", "Plasmin breaks down fibrin meshes and opposes clot persistence."],
    ["procoagulant; thrombolytic", "Heparin inhibits clotting factors rather than promoting coagulation."]
  ]),
  makeQ(6, 1, T, "hard", true, "A hypertensive patient with an ulcerated atherosclerotic plaque develops a coronary thrombus without external trauma, while a laceration patient clots at a skin wound. The initiating factors are, respectively, _______.", [
    ["Factor XII and Factor VII", "Exposed subendothelial collagen activates intrinsic Factor XII, while extravascular tissue trauma releases thromboplastin to activate extrinsic Factor VII."],
    ["Factor VII and Factor XII", "Internal endothelial injury triggers intrinsic Factor XII first, whereas external tissue injury triggers extrinsic Factor VII."],
    ["Factor VIII and Factor X", "Factor VIII is an intrinsic cofactor and Factor X is the common pathway convergence point, not the initiators."],
    ["Factor II and Factor IX", "Factors II and IX are vitamin K-dependent factors downstream of the initial triggers."]
  ]),
  makeQ(6, 1, S, "hard", true, "A patient with severe metabolic syndrome develops marked hyperinsulinemia that inhibits plasminogen activator. The most direct consequence is _______.", [
    ["impaired fibrinolysis leading to a hypercoagulable state", "Inhibiting plasminogen activator reduces plasmin generation, preventing normal breakdown of fibrin clots."],
    ["excessive plasmin activity causing spontaneous mucosal hemorrhage", "Blocking plasminogen activator decreases plasmin levels rather than increasing fibrinolysis."],
    ["decreased hepatic synthesis of Factor VIII", "Factor VIII is synthesized independently of plasminogen activator inhibition."],
    ["accelerated conversion of fibrinogen into soluble fibrin", "Inhibiting plasminogen activator impairs clot breakdown rather than accelerating fibrin formation."]
  ]),

  // ================= SUBJECT 2: Clotting Disorders & Bruising (Week 6) =================
  makeQ(6, 2, S, "medium", true, "Patients with hemophilia A experience prolonged hemorrhage because Factor VIII is required to activate Factor _______, resulting in deficient _______ generation.", [
    ["X; fibrin", "Without Factor VIII cofactor activity, intrinsic activation of Factor X fails and common-pathway fibrin formation is impaired."],
    ["XII; fibrin", "Factor XII acts upstream at the start of the intrinsic pathway and does not require Factor VIII."],
    ["X; plasmin", "Plasmin dissolves clots and is generated from plasminogen rather than Factor X."],
    ["VII; thrombin", "Factor VII belongs to the extrinsic pathway and activates Factor X independently of Factor VIII."]
  ]),
  makeQ(6, 2, S, "medium", true, "Hemophilia A follows an _______ inheritance pattern and therefore manifests predominantly in _______.", [
    ["X-linked recessive; males", "Males possess a single X chromosome and lack a second normal allele to compensate for the mutated Factor VIII gene."],
    ["autosomal recessive; females", "Autosomal recessive inheritance characterizes hemophilia C and affects males and females equally."],
    ["X-linked recessive; females", "Females typically carry one normal X allele and are asymptomatic carriers rather than affected patients."],
    ["autosomal dominant; males", "Hemophilia A is transmitted as an X-linked recessive trait rather than autosomal dominant."]
  ]),
  makeQ(6, 2, S, "hard", true, "A young boy presents with hemarthroses and prolonged bleeding after dental extraction, and lab assays reveal a Factor IX deficiency. This condition is _______.", [
    ["hemophilia B", "Factor IX deficiency (Christmas disease) is an X-linked recessive bleeding disorder clinically indistinguishable from hemophilia A."],
    ["hemophilia A", "Hemophilia A results from a deficiency of Factor VIII rather than Factor IX."],
    ["hemophilia C", "Hemophilia C is an autosomal recessive deficiency of Factor XI that rarely causes spontaneous bleeding."],
    ["von Willebrand disease", "Von Willebrand disease impairs platelet adhesion and stabilizes Factor VIII rather than causing isolated Factor IX loss."]
  ]),
  makeQ(6, 2, S, "medium", true, "Hemophilia C differs genetically and clinically from hemophilias A and B because it is inherited in an _______ manner and rarely causes spontaneous hemorrhage.", [
    ["autosomal recessive", "Hemophilia C (Factor XI deficiency) is autosomal recessive, affecting both sexes equally with milder bleeding."],
    ["X-linked recessive", "X-linked recessive inheritance applies to hemophilias A and B, not hemophilia C."],
    ["autosomal dominant", "Hemophilia C requires two mutated alleles and is not inherited as a dominant trait."],
    ["acquired vitamin K-dependent", "Hemophilia C is an inherited genetic deficiency of Factor XI rather than an acquired nutritional defect."]
  ]),
  makeQ(6, 2, T, "hard", true, "A male infant presents with recurrent mucocutaneous bleeding and reduced Factor VIII activity due to deficiency of its protective carrier protein. The deficient protein is _______.", [
    ["von Willebrand factor", "Von Willebrand factor mediates platelet adhesion to collagen and protects circulating Factor VIII from premature degradation."],
    ["Hageman factor", "Hageman factor is Factor XII, which initiates contact activation in the intrinsic pathway."],
    ["prothrombin", "Prothrombin is Factor II, a vitamin K-dependent zymogen cleaved into thrombin."],
    ["tissue thromboplastin", "Tissue thromboplastin is Factor III, which initiates the extrinsic pathway."]
  ]),
  makeQ(6, 2, T, "medium", false, "Acute bleeding episodes in patients with severe hemophilia A, B, or C are managed primarily by _______.", [

function makeQ(week, subjectIndex, ref, difficulty, priority, stem, opts) {
  const wLabel = `Week ${week} • ${ref}`;
  const options = opts.map((item, idx) => ({
    text: item[0],
    correct: idx === 0,
    why: `${item[1]} [${wLabel}]`
  }));
  const id = _id++;
  const target = id % 4;
  const correctOpt = options.splice(0, 1)[0];
  options.splice(target, 0, correctOpt);
  return {
    id: id,
    week: week,
    subjectIndex: subjectIndex,
    quarter: 3,
    slideRef: ref,
    difficulty: difficulty,
    priority: priority,
    stem: stem,
    options: options
  };
}

  const RULES = {

  const FALLBACK = { 0:5, 1:6, 2:9, 3:12, 4:15, 5:19, 6:22, 7:10, 8:14, 9:18, 10:21, 11:24, 12:28, 13:13, 14:19 };

  questionBank.forEach((q) => {
    const rules = RULES[q.week];
    const correct = q.options.find((o) => o.correct);
    const text = (q.stem + " " + (correct ? correct.text : "")).toLowerCase();
    let n = null;
    if (rules) {
      const hit = rules.find(([re]) => re.test(text));
      if (hit) n = hit[1];
    }
    if (n === null) n = FALLBACK[q.subjectIndex];
    const title = (TITLES[q.week] && TITLES[q.week][n]) || "";
    q.slideRef = n;
    const tag = `[Week ${q.week} • Slide #${n}${title ? ": " + title : ""}]`;
    q.options.forEach((o) => {
      o.why = o.why.replace(/\[Week[^\]]*\]\s*$/, "").trim() + " " + tag;
    });
  });

  const flagged = [];
  questionBank.forEach((q) => {
    const L = q.options.map((o) => o.text.length);
    const ci = q.options.findIndex((o) => o.correct);
    const d = L.filter((_, i) => i !== ci);
    const avg = d.reduce((a, b) => a + b, 0) / d.length;
    if (L[ci] > Math.max(...d) && L[ci] >= avg * 1.25 && L[ci] - avg >= 10) {
      flagged.push({ id: q.id, week: q.week, stem: q.stem.slice(0, 60), correctLen: L[ci], avgDistractorLen: Math.round(avg) });
    }
  });
  console.log(`[MT2 cleanup 2] slideRef set on ${questionBank.length} questions`);
  console.log(`[MT2 cleanup 2] length-tell offenders: ${flagged.length} of ${questionBank.length}`);
  if (flagged.length) console.table(flagged);
  window.MT2_LENGTH_FLAGS = flagged;
})();

// ============================================================================
// UI STATE & RENDERING ENGINE
// ============================================================================
let activeQuizList = [];
let userAnswers = {}; // { [questionId]: selectedOptionIndex }
let viewMode = "all"; // "all" or "single"
let currentIndex = 0;

const weekFilterEl = document.getElementById("weekFilter");
const subjectFilterEl = document.getElementById("subjectFilter");
const diffFilterEl = document.getElementById("diffFilter");
const lengthFilterEl = document.getElementById("lengthFilter");
const viewToggleBtn = document.getElementById("viewToggle");
const shuffleBtn = document.getElementById("shuffleBtn");
const resetBtn = document.getElementById("resetBtn");
const scorePillEl = document.getElementById("scorePill");
const quizContainerEl = document.getElementById("quizContainer");

function initFilters() {
  const uniqueWeeks = [...new Set(questionBank.map(q => q.week))].sort((a, b) => a - b);
  weekFilterEl.innerHTML = `<option value="all">All Weeks</option>` +
    uniqueWeeks.map(w => `<option value="${w}">Week ${w} Only</option>`).join("");

  subjectFilterEl.innerHTML = `<option value="all">All Modules</option>` +
    SUBJECTS.map((title, idx) => `<option value="${idx}">${title}</option>`).join("");
}

function fisherYatesShuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function randomizeOptionsOnce() {
  questionBank.forEach(q => {
    fisherYatesShuffle(q.options);
  });
}

function updateScorePill() {
  const answeredIds = Object.keys(userAnswers).map(Number);
  const totalAnswered = answeredIds.length;
  let correctCount = 0;
  answeredIds.forEach(id => {
    const q = questionBank.find(item => item.id === id);
    if (q && q.options[userAnswers[id]] && q.options[userAnswers[id]].correct) {
      correctCount++;
    }
  });
  const pct = totalAnswered > 0 ? Math.round((correctCount / totalAnswered) * 100) : 0;
  scorePillEl.textContent = `Score: ${correctCount} / ${totalAnswered} (${pct}%)`;
}

function rebuildActivePool() {
  const weekVal = weekFilterEl.value;
  const subjVal = subjectFilterEl.value;
  const diffVal = diffFilterEl.value;
  const lenVal = lengthFilterEl.value;

  const filtered = questionBank.filter(q => {
    if (weekVal !== "all" && q.week !== Number(weekVal)) return false;
    if (subjVal !== "all" && q.subjectIndex !== Number(subjVal)) return false;
    if (diffVal !== "all" && q.difficulty !== diffVal) return false;
    return true;
  });

  if (lenVal === "all") {
    activeQuizList = filtered.slice();
  } else {
    const limit = Number(lenVal);
    activeQuizList = filtered.slice(0, Math.min(limit, filtered.length));
  }

  if (currentIndex >= activeQuizList.length) {
    currentIndex = Math.max(0, activeQuizList.length - 1);
  }
}

function createQuestionCard(q, displayNumber) {
  const card = document.createElement("div");
  card.className = "q-card";

  const meta = document.createElement("div");
  meta.className = "q-meta";

  const weekBadge = document.createElement("span");
  weekBadge.className = "badge week";
  weekBadge.textContent = `Week ${q.week}`;
  meta.appendChild(weekBadge);

  const subjBadge = document.createElement("span");
  subjBadge.className = "badge";
  subjBadge.textContent = SUBJECTS[q.subjectIndex];
  meta.appendChild(subjBadge);

  const diffBadge = document.createElement("span");
  diffBadge.className = "badge";
  diffBadge.textContent = `Difficulty: ${q.difficulty.toUpperCase()}`;
  meta.appendChild(diffBadge);

  if (q.priority === true) {
    const prioBadge = document.createElement("span");
    prioBadge.className = "badge priority";
    prioBadge.textContent = "★ High-Yield Board";
    meta.appendChild(prioBadge);
  }

  card.appendChild(meta);

  const stem = document.createElement("div");
  stem.className = "q-stem";
  stem.textContent = `${displayNumber}. ${q.stem}`;
  card.appendChild(stem);

  const optsList = document.createElement("div");
  optsList.className = "options-list";

  const selectedIdx = userAnswers[q.id];
  const isAnswered = selectedIdx !== undefined;
  const letters = ["A", "B", "C", "D"];

  q.options.forEach((opt, idx) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "opt-btn";
    btn.textContent = `${letters[idx]}. ${opt.text}`;

    if (isAnswered) {
      btn.disabled = true;
      if (opt.correct) {
        btn.classList.add("correct");
      } else {
        btn.classList.add("dimmed");
      }
    } else {
      btn.addEventListener("click", () => {
        userAnswers[q.id] = idx;
        updateScorePill();
        render();
      });
    }

    optsList.appendChild(btn);
  });

  card.appendChild(optsList);

  if (isAnswered) {
    const ratBox = document.createElement("div");
    ratBox.className = "rationale-box";

    q.options.forEach((opt, idx) => {
      const item = document.createElement("div");
      const statusLabel = opt.correct ? "Correct" : "Incorrect";
      item.className = "rationale-item " + (opt.correct ? "is-right" : (idx === selectedIdx ? "is-wrong" : ""));
      item.innerHTML = `<strong>${letters[idx]} (${statusLabel}):</strong> ${opt.why}`;
      ratBox.appendChild(item);
    });

    card.appendChild(ratBox);
  }

  return card;
}

function render() {
  quizContainerEl.innerHTML = "";

  if (activeQuizList.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty-state";
    empty.textContent = "No questions match the current filter combination.";
    quizContainerEl.appendChild(empty);
    return;
  }

  if (viewMode === "all") {
    activeQuizList.forEach((q, idx) => {
      quizContainerEl.appendChild(createQuestionCard(q, idx + 1));
    });
  } else {
    const q = activeQuizList[currentIndex];
    quizContainerEl.appendChild(createQuestionCard(q, currentIndex + 1));

    const nav = document.createElement("div");
    nav.className = "nav-bar";

    const prevBtn = document.createElement("button");
    prevBtn.type = "button";
    prevBtn.textContent = "← Previous";
    prevBtn.disabled = currentIndex === 0;
    prevBtn.addEventListener("click", () => {
      if (currentIndex > 0) {
        currentIndex--;
        render();
      }
    });

    const counter = document.createElement("span");
    counter.style.fontWeight = "600";
    counter.style.color = "var(--muted)";
    counter.textContent = `Question ${currentIndex + 1} of ${activeQuizList.length}`;

    const nextBtn = document.createElement("button");
    nextBtn.type = "button";
    nextBtn.textContent = "Next →";
    nextBtn.disabled = currentIndex >= activeQuizList.length - 1;
    nextBtn.addEventListener("click", () => {
      if (currentIndex < activeQuizList.length - 1) {
        currentIndex++;
        render();
      }
    });

    nav.appendChild(prevBtn);
    nav.appendChild(counter);
    nav.appendChild(nextBtn);
    quizContainerEl.appendChild(nav);
  }
}

weekFilterEl.addEventListener("change", () => {
  currentIndex = 0;
  rebuildActivePool();
  render();
});

subjectFilterEl.addEventListener("change", () => {
  currentIndex = 0;
  rebuildActivePool();
  render();
});

diffFilterEl.addEventListener("change", () => {
  currentIndex = 0;
  rebuildActivePool();
  render();
});

lengthFilterEl.addEventListener("change", () => {
  currentIndex = 0;
  rebuildActivePool();
  render();
});

viewToggleBtn.addEventListener("click", () => {
  viewMode = viewMode === "all" ? "single" : "all";
  viewToggleBtn.textContent = viewMode === "all" ? "View: All at Once" : "View: One by One";
  render();
});

shuffleBtn.addEventListener("click", () => {
  fisherYatesShuffle(questionBank);
  questionBank.forEach(q => fisherYatesShuffle(q.options));
  currentIndex = 0;
  rebuildActivePool();
  render();
});

resetBtn.addEventListener("click", () => {
  userAnswers = {};
  currentIndex = 0;
  updateScorePill();
  rebuildActivePool();
  render();
});

randomizeOptionsOnce();
initFilters();
rebuildActivePool();
updateScorePill();
render();
</script>
