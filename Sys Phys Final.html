const DIFF_RANK={easy:0,medium:1,hard:2},PHASE_LABEL=['Phase 1: Basics','Phase 2: Core Concepts','Phase 3: Application / Hard'],L=['A','B','C','D'];
const $=id=>document.getElementById(id),ls=(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},sv=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let viewMode=ls('quizViewMode','single'),muted=ls('stfuErijah','0')==='1',orderMode=ls('quizOrderMode','random'),prioMissed=false;
let missed=[];try{missed=JSON.parse(ls('quiz_missed_history','[]'))}catch(e){}
let selected=new Set(SUBJECTS.map((_,i)=>i)),quizQ=[],ans={},cur=0,lastN=0,score=0;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pool(){return questionBank.filter(x=>selected.has(x.subjectIndex))}
function upd(){const n=quizQ.length,a=Object.keys(ans).length;$('scorePill').textContent='Score: '+score+' / '+a+' ('+(a?Math.round(score/a*100):0)+'%)';
$('progPill').textContent=n?(viewMode==='single'?'Q '+Math.min(cur+1,n)+' of '+n:'Answered '+a+' of '+n):'Q 0 of 0';
$('progressBar').style.width=n?(a/n*100)+'%':'0';$('modeBtn').textContent='View: '+(viewMode==='single'?'One by One':'All at Once');
$('stfuBtn').textContent=muted?'Bring Back Erijah':'STFU Erijah'}
function toggleMode(){viewMode=viewMode==='single'?'all':'single';sv('quizViewMode',viewMode);upd();if(quizQ.length&&!$('app').dataset.home)renderQuiz()}

function toggleOrder(){orderMode=orderMode==='random'?'tiered':'random';sv('quizOrderMode',orderMode);renderHome()}
function togglePrioritizeMissed(){prioMissed=!prioMissed;renderHome()}
function tog(i){selected.has(i)?selected.delete(i):selected.add(i);renderHome()}
function selAll(){selected=new Set(SUBJECTS.map((_,i)=>i));renderHome()}function clr(){selected=new Set();renderHome()}
function setMode(m){viewMode=m;sv('quizViewMode',m);renderHome()}
function renderHome(){const app=$('app');app.dataset.home='1';quizQ=[];ans={};score=0;cur=0;upd();$('progPill').textContent='Q 0 of 0';
const P=pool(),mods=selected.size,mc=missed.filter(id=>questionBank.some(q=>q.id===id)).length;
let h='<div class="card"><h2>Subject Modules</h2><div class="row">';
SUBJECTS.forEach((s,i)=>{const c=questionBank.filter(q=>q.subjectIndex===i).length;h+=`<button class="chip ${selected.has(i)?'on':''}" onclick="tog(${i})">[${s.week}] ${s.title} (${c})</button>`});
h+='</div><div class="row"><button class="btn" onclick="selAll()">Select All</button><button class="btn" onclick="clr()">Clear</button></div>';
h+=`<h2>Display Mode</h2><div class="row"><button class="chip ${viewMode==='single'?'on':''}" onclick="setMode('single')">One by One</button><button class="chip ${viewMode==='all'?'on':''}" onclick="setMode('all')">All at Once</button></div>`;
h+=`<p><b>Active Pool:</b> ${P.length} high-yield questions across ${mods} modules selected. <span class="star">&#9733;</span> = flagged board/exam priority (${P.filter(q=>q.priority).length}).</p>`;
h+=`<div class="row"><button class="btn ${orderMode==='tiered'?'on':''}" onclick="toggleOrder()">${orderMode==='random'?'Order: Random':'Order: Basics &rarr; Hard'}</button><button class="btn ${prioMissed?'on':''}" onclick="togglePrioritizeMissed()">Prioritize Missed (${mc})</button></div>`;
h+='<h2>Exam Length</h2><div class="row">';[['Quickie',15],['Standard',25],['Intense',35],['Full Exam',50]].forEach(([n,c])=>h+=`<button class="btn" onclick="launchQuiz(${c})">${n} (${c} Qs)</button>`);
h+=`<button class="btn pri" onclick="launchQuiz(${P.length})">All Selected (${P.length} Qs)</button></div></div>`;app.innerHTML=h}
function launchQuiz(n){let p=pool();if(!p.length)return;p=shuffle(p);if(prioMissed)p.sort((a,b)=>missed.includes(b.id)-missed.includes(a.id));

if(orderMode==='tiered')quizQ.sort((a,b)=>DIFF_RANK[a.difficulty]-DIFF_RANK[b.difficulty]||a.subjectIndex-b.subjectIndex);
ans={};score=0;cur=0;$('app').dataset.home='';renderQuiz();window.scrollTo(0,0)}
function renderQuiz(){viewMode==='single'?renderSingleQuestion():renderAllQuestions();upd()}
function card(q,i){const a=ans[i],done=a!==undefined;let h=`<div class="card" id="q${i}">`;
if(orderMode==='tiered')h+=`<div class="phase">${PHASE_LABEL[DIFF_RANK[q.difficulty]]}</div><br>`;
h+=`<div class="meta"><span class="qn">Q${i+1}</span>[${SUBJECTS[q.subjectIndex].week}] ${SUBJECTS[q.subjectIndex].title}${q.priority?' <span class="star">&#9733; High-Yield</span>':''}</div><div><b>${q.stem}</b></div>`;
q.options.forEach((o,k)=>{let c='';if(done){if(o.correct)c='c';else if(k===a)c='w'}h+=`<button class="opt ${c}" ${done?'disabled':''} onclick="pick(${i},${k})">${L[k]}) ${o.text}</button>`});
if(done){const ok=q.options[a].correct;h+=`<div class="ban ${ok?'g':'r'}">${ok?'Correct!':'Incorrect.'}</div>`;
q.options.forEach((o,k)=>h+=`<div class="why"><b class="${o.correct?'g':'r'}">${L[k]}) [${o.correct?'CORRECT':'INCORRECT'}]:</b> ${o.why}</div>`)}
return h+'</div>'}
function pick(i,k){if(ans[i]!==undefined)return;const q=quizQ[i];ans[i]=k;const sy=window.scrollY;
if(q.options[k].correct){score++;missed=missed.filter(x=>x!==q.id)}else{if(!missed.includes(q.id))missed.push(q.id);wrong()}
sv('quiz_missed_history',JSON.stringify(missed));renderQuiz();window.scrollTo(0,sy)}
function wrong(){if(muted)return;try{const a=$('wrongAudio');a.currentTime=0;a.play().catch(()=>{})}catch(e){}const p=$('wrongPopup');p.classList.remove('hidden');setTimeout(()=>p.classList.add('hidden'),1200)}
function renderSingleQuestion(){const i=cur,n=quizQ.length,d=ans[i]!==undefined;
$('app').innerHTML=card(quizQ[i],i)+`<div class="row"><button class="btn" ${i===0?'disabled':''} onclick="nav(-1)">Previous</button>`+(i<n-1?`<button class="btn pri" onclick="nav(1)">Next Question</button>`:`<button class="btn pri" onclick="showSummary()">Finish &amp; Results</button>`)+'</div>'}
function renderAllQuestions(){let h='';quizQ.forEach((q,i)=>h+=card(q,i));
if(Object.keys(ans).length===quizQ.length)h+='<div class="row"><button class="btn pri" onclick="showSummary()">View Complete Performance Analysis &rarr;</button></div>';$('app').innerHTML=h}
function showSummary(){const n=quizQ.length,a=Object.keys(ans).length,pc=a?Math.round(score/a*100):0;upd();
$('app').innerHTML=`<div class="card"><h2>Completion Summary</h2><div class="big">${score} / ${n}</div><p>Accuracy: ${pc}% (${a} answered)</p><div class="row"><button class="btn pri" onclick="retake()">Retake Same Exam</button><button class="btn" onclick="renderHome()">Return to Dashboard</button><a href="index.html" class="btn">Return to Hub</a></div></div>`;window.scrollTo(0,0)}
function nav(d){cur+=d;renderQuiz()}function retake(){launchQuiz(lastN)}
Object.assign(window,{toggleMode,toggleMute,toggleOrder,togglePrioritizeMissed,tog,selAll,clr,setMode,renderHome,launchQuiz,pick,showSummary,nav,retake});
upd();renderHome();
}catch(e){document.getElementById('app').innerHTML='<div class="card"><b>Script error:</b> '+e.message+'</div>';console.error(e)}})();
</script></body></html>
