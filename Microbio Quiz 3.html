            {

                stem: "Which products are generated by the Entner-Doudoroff pathway?",

                    { text: "2 ethanol and 3 ATP", correct: true, why: "Entner-Doudoroff, the least common alternative to Embden-Meyerhof, produces 2 ethanol and 3 ATP. [Lec 4, Slide #5]" },

            {

                ]

            {
                id: 5, quarter: 1, lecture: 4, slideRef: 4, difficulty: "Medium",

            {

            {

            {

            {

            {

                options: [
                    { text: "Transposons", correct: true, why: "Transposons are recombination only; they move DNA to different positions within the chromosome rather than transferring it between cells. [Lec 5, Slide #20]" },
                    { text: "Conjugation", correct: false, why: "Conjugation transfers DNA between cells through cell-to-cell contact. [Lec 5, Slide #20]" },
                    { text: "Transformation", correct: false, why: "Transformation transfers free DNA into a cell. [Lec 5, Slide #24]" },
                    { text: "Transduction", correct: false, why: "Transduction transfers DNA between cells via bacterial viruses. [Lec 5, Slide #26]" }
                ]
            },
            {
                id: 48, quarter: 4, lecture: 5, slideRef: 28, difficulty: "Easy",
                stem: "Transposons, also called jumping genes, are officially referred to as:",
                options: [
                    { text: "Mobile genetic elements", correct: true, why: "Transposons are DNA sequences that move to different chromosome positions (transposition), can cause mutation, and are officially called mobile genetic elements. [Lec 5, Slide #28]" },
                    { text: "Resistance transfer factors", correct: false, why: "Resistance transfer factors (RTFs) are conjugative plasmids carrying pilus and antibiotic-inhibiting genes. [Lec 5, Slide #21]" },
                    { text: "High frequency recombination strains", correct: false, why: "Hfr strains are high frequency recombination strains involved in conjugation. [Lec 5, Slide #21]" },
                    { text: "Replisome enzyme complexes", correct: false, why: "The replisome (helicase, primase, SSBP, topoisomerase, DNA polymerase, ligase) carries out replication. [Lec 5, Slide #5]" }
                ]
            }
        ];

        let currentSet = quizData;
        let round = 1;
        let quizMode = 'full';
        let answers = {};
        let popupTimeout = null;

        function fisherYates(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function shuffleQuiz() {
            fisherYates(currentSet);
            currentSet.forEach(q => fisherYates(q.options));
        }

        function updateScore() {
            const total = currentSet.length;
            const correct = Object.values(answers).filter(Boolean).length;
            const pct = total ? Math.round((correct / total) * 100) : 0;
            const label = round === 1 ? 'Score' : `Review ${round - 1}`;
            document.getElementById('scoreTracker').textContent = `${label}: ${correct} / ${total} (${pct}%)`;
            return { total, correct, pct, answered: Object.keys(answers).length };
        }

        function el(tag, className, text) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (text !== undefined) node.textContent = text;
            return node;
        }

        function handleSelect(q, chosenIdx, card) {
            if (q.id in answers) return;
            const chosen = q.options[chosenIdx];
            answers[q.id] = chosen.correct;

            if (!chosen.correct) {
                const wrongAudio = document.getElementById('wrongAudio');
                if (wrongAudio) {
                    wrongAudio.currentTime = 0;
                    wrongAudio.play().catch(err => console.log("Audio play blocked:", err));
                }

                const popup = document.getElementById('wrongPopup');
                if (popup) {
                    popup.classList.remove('hidden');
                    clearTimeout(popupTimeout);
                    popupTimeout = setTimeout(() => {
                        popup.classList.add('hidden');
                    }, 2000);
                }
            }

            const buttons = card.querySelectorAll('.option-btn');
            buttons.forEach((btn, i) => {
                btn.disabled = true;
                if (q.options[i].correct) btn.classList.add('correct');
                else if (i === chosenIdx) btn.classList.add('incorrect');
            });

            const fb = el('div', 'feedback-box');
            fb.appendChild(el('div', 'status-banner ' + (chosen.correct ? 'correct' : 'incorrect'), chosen.correct ? 'Correct!' : 'You didn’t know that?!'));
            fb.appendChild(el('div', 'reference', `Reference: Lecture ${q.lecture}, Slide #${q.slideRef}`));
            const list = el('ul', 'breakdown-list');
            q.options.forEach((opt, i) => {
                const li = el('li', 'breakdown-item');
                li.appendChild(el('span', 'tag ' + (opt.correct ? 'right' : 'wrong'), opt.correct ? 'Correct: ' : 'Incorrect: '));
                li.appendChild(el('span', 'opt-name', `(${String.fromCharCode(97 + i)}) ${opt.text}`));
                li.appendChild(document.createTextNode(' — ' + opt.why));
                list.appendChild(li);
            });
            fb.appendChild(list);
            card.appendChild(fb);

            const s = updateScore();
            if (s.answered === s.total) showSummary(s);
        }

        function showSummary(s) {
            const summary = document.getElementById('summary');
            const reviewBtn = document.getElementById('reviewBtn');
            const missed = currentSet.filter(q => !answers[q.id]);
            document.getElementById('summaryScore').textContent = `${s.correct} / ${s.total} (${s.pct}%)`;
            if (round === 1) {
                document.querySelector('.summary-title').textContent = 'Quiz Complete';
                let msg;
                if (s.pct >= 90) msg = 'Absolute Gigachad. You drained that test dry.';
                else if (s.pct >= 70) msg = "Solid run! You're locked in, get in some more reps.";
                else msg = 'You lasted less than 30 seconds. Time for a rematch.';
                document.getElementById('summaryMsg').textContent = msg;
            } else {
                document.querySelector('.summary-title').textContent = `Review Round ${round - 1} Complete`;
                document.getElementById('summaryMsg').textContent = missed.length
                    ? `${missed.length} still missed. Go again.`
                    : 'Everything cleared. All correct.';
            }
            reviewBtn.style.display = missed.length ? 'inline-block' : 'none';
            reviewBtn.textContent = `Review Missed (${missed.length})`;
            summary.classList.remove('hidden');
            summary.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function updateModeButtons() {
            const fullBtn = document.getElementById('fullQuizBtn');
            const quickBtn = document.getElementById('quickQuizBtn');
            if (quizMode === 'full') {
                fullBtn.classList.add('active');
                quickBtn.classList.remove('active');
            } else {
                quickBtn.classList.add('active');
                fullBtn.classList.remove('active');
            }
        }

        function renderQuiz(set) {
            const popup = document.getElementById('wrongPopup');
            if (popup) popup.classList.add('hidden');

            if (set) {
                currentSet = set;
            } else {
                fisherYates(quizData);
                currentSet = (quizMode === 'quick') ? quizData.slice(0, 15) : [...quizData];
            }

            answers = {};
            shuffleQuiz();
            const container = document.getElementById('quiz');
            container.innerHTML = '';
            document.getElementById('summary').classList.add('hidden');

            currentSet.forEach((q, qIdx) => {
                const card = el('div', 'question-card');
                const meta = el('div', 'question-meta');
                meta.appendChild(el('span', 'badge', `Question ${qIdx + 1} of ${currentSet.length}`));
                meta.appendChild(el('span', 'badge', q.difficulty));
                card.appendChild(meta);
                card.appendChild(el('div', 'question-text', q.stem));

                const opts = el('div', 'options-list');
                q.options.forEach((opt, i) => {
                    const btn = el('button', 'option-btn');
                    btn.type = 'button';
                    btn.appendChild(el('span', 'option-letter', String.fromCharCode(97 + i) + ')'));
                    btn.appendChild(el('span', '', opt.text));
                    btn.addEventListener('click', () => handleSelect(q, i, card));
                    opts.appendChild(btn);
                });
                card.appendChild(opts);
                container.appendChild(card);
            });

            updateScore();
            window.scrollTo({ top: 0 });
        }

        document.getElementById('fullQuizBtn').addEventListener('click', () => {
            quizMode = 'full';
            round = 1;
            updateModeButtons();
            renderQuiz();
        });

        document.getElementById('quickQuizBtn').addEventListener('click', () => {
            quizMode = 'quick';
            round = 1;
            updateModeButtons();
            renderQuiz();
        });

        document.getElementById('retakeBtn').addEventListener('click', () => {
            round = 1;
            renderQuiz();
        });

        document.getElementById('reviewBtn').addEventListener('click', () => {
            round++;
            renderQuiz(currentSet.filter(q => !answers[q.id]));
        });

        window.onload = () => {
            updateModeButtons();
            renderQuiz();
        };
    </script>
</body>
</html>
