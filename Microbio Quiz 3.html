<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microbio Quiz 3: Comprehensive Metabolism & Genetics</title>
    <style>
        :root {
            --bg-main: #0f0f0f;
            --bg-card: #1a1a1a;
            --text-main: #ffffff;
            --text-muted: #a3a3a3;
            --accent: #ff9900;
            --correct-bg: #14532d;
            --correct-border: #22c55e;
            --incorrect-bg: #7f1d1d;
            --incorrect-border: #ef4444;
            --border-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.6;
            padding-bottom: 60px;
        }

        header {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 1.5rem;
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--accent);
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .header-sticky {
            position: sticky;
            top: 0;
            background-color: rgba(26, 26, 26, 0.95);
            backdrop-filter: blur(5px);
            border-bottom: 2px solid var(--accent);
            padding: 12px 20px;
            z-index: 1000;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .header-container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent);
        }

        .score-box {
            font-size: 1rem;
            font-weight: 600;
            background-color: #262626;
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background-color: var(--border-color);
            position: absolute;
            bottom: 0;
            left: 0;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background-color: var(--accent);
            transition: width 0.3s ease;
        }

        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .question-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .question-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            list-style: none;
        }

        .option-btn {
            background-color: #262626;
            color: var(--text-main);
            border: 1.5px solid var(--border-color);
            padding: 14px 16px;
            text-align: left;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #333333;
            border-color: var(--accent);
        }

        .option-btn.correct {
            background-color: var(--correct-bg);
            border-color: var(--correct-border);
            color: #fff;
        }

        .option-btn.incorrect {
            background-color: var(--incorrect-bg);
            border-color: var(--incorrect-border);
            color: #fff;
        }

        .option-btn:disabled {
            cursor: default;
        }

        .feedback-box {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 6px;
            display: none;
            background-color: #222222;
            border-left: 4px solid var(--accent);
        }

        .feedback-box.show {
            display: block;
        }

        .status-banner {
            font-weight: bold;
            font-size: 1rem;
            margin-bottom: 0.5rem;
        }

        .status-banner.correct {
            color: var(--correct-border);
        }

        .status-banner.incorrect {
            color: var(--incorrect-border);
        }

        .explanation-text {
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
            color: #e5e5e5;
        }

        .rationales-list {
            list-style: none;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 0.5rem;
        }

        .rationales-list li {
            margin-bottom: 0.4rem;
        }

        .summary-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 32px;
            text-align: center;
            display: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 2rem;
        }

        .summary-card.visible {
            display: block;
        }

        .summary-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 12px;
        }

        .summary-score {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 16px;
        }

        .summary-text {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .reset-btn {
            background-color: var(--accent);
            color: #000000;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .reset-btn:hover {
            background-color: #e68a00;
        }

        @media (max-width: 600px) {
            .container {
                margin: 1rem auto;
                padding: 0 0.5rem;
            }
            .question-card {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Microbio Quiz 3</h1>
        <div class="subtitle">Comprehensive Practice Quiz: Lectures 4 & 5 (Metabolism, Respiration, Fermentation & Genetics)</div>
    </header>

    <div class="header-sticky">
        <div class="header-container">
            <div class="header-title">Microbiology: Quiz 3 Hub</div>
            <div class="score-box" id="scoreDisplay">Score: 0 / 0 (0%)</div>
        </div>
        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progressBar"></div>
        </div>
    </div>

    <div class="container" id="quizContainer"></div>

    <div class="container">
        <div class="summary-card" id="summaryCard">
            <div class="summary-title" id="summaryTitle">Quiz Completed!</div>
            <div class="summary-score" id="finalScore">0 / 0</div>
            <div class="summary-text" id="summaryFeedback">Here is your performance breakdown.</div>
            <button class="reset-btn" onclick="resetQuiz()">Retake Quiz</button>
        </div>
    </div>

    <script>
        const wrongAudio = new Audio('Wrong-answer.m4a');

        const rawQuizData = [
            // --- LECTURE 4: METABOLISM & FERMENTATION ---
            {
                question: "Which carbon and energy source is universally preferred by bacteria when multiple sources are available ('Glucose is king!')?",
                options: [
                    { text: "Lactose", correct: false, why: "Incorrect. Disaccharides require secondary breakdown enzymes and are never preferred over glucose." },
                    { text: "Glucose", correct: true, why: "Correct! Bacteria utilize glucose preferentially to the exclusion of other sugars as long as it is available." },
                    { text: "Fructose", correct: false, why: "Incorrect. Fructose is a monosaccharide but is not preferentially selected over glucose." },
                    { text: "Amino acids", correct: false, why: "Incorrect. Carbohydrates like glucose are prioritized for rapid catabolism." }
                ],
                explanation: "Glucose is the premier carbon and energy source for bacteria ('Glucose is king!'), utilized preferentially over secondary disaccharides."
            },
            {
                question: "What is the most common glycolytic pathway utilized by bacteria, yielding 2 pyruvates and 4 ATP (gross)?",
                options: [
                    { text: "Embden-Meyerhof pathway", correct: true, why: "Correct! When in doubt, bacteria use the Embden-Meyerhof pathway for glycolysis." },
                    { text: "Entner-Doudoroff pathway", correct: false, why: "Incorrect. Entner-Doudoroff is less common and yields 3 ATP and 2 ethanol." },
                    { text: "Pentose phosphate pathway", correct: false, why: "Incorrect. Pentose phosphate pathway generates NADPH and biosynthetic precursors." },
                    { text: "Tricarboxylic acid cycle", correct: false, why: "Incorrect. The TCA cycle occurs downstream of glycolysis." }
                ],
                explanation: "The Embden-Meyerhof pathway is the standard, most common glycolytic pathway across bacterial species."
            },
            {
                question: "How does the alternative Entner-Doudoroff glycolytic pathway compare to Embden-Meyerhof?",
                options: [
                    { text: "It is universal in all gram-positive rods.", correct: false, why: "Incorrect. It is a lot less common and utilized by only a few types of bacteria." },
                    { text: "It is less common, used by only a few bacteria, and yields 2 ethanol and 3 ATP.", correct: true, why: "Correct! Entner-Doudoroff produces 2 ethanol and 3 ATP, making it slightly less energy-efficient." },
                    { text: "It operates exclusively under obligate aerobic conditions.", correct: false, why: "Incorrect. It is an alternative glycolytic route." },
                    { text: "It produces zero ATP molecules.", correct: false, why: "Incorrect. It yields 3 net ATP." }
                ],
                explanation: "The Entner-Doudoroff pathway is less common, utilized by specific bacteria, and yields 3 ATP along with 2 ethanol."
            },
            {
                question: "In aerobic respiration, what molecule serves as the final (terminal) electron acceptor in the electron transport chain?",
                options: [
                    { text: "Nitrate (NO3-)", correct: false, why: "Incorrect. Nitrate is used in anaerobic denitrification." },
                    { text: "Molecular oxygen (O2)", correct: true, why: "Correct! Aerobic respiration relies strictly on molecular oxygen (O2) as the final electron acceptor." },
                    { text: "Sulfate (SO42-)", correct: false, why: "Incorrect. Sulfate is used in anaerobic sulfate reduction." },
                    { text: "Carbon dioxide (CO2)", correct: false, why: "Incorrect. CO2 is a metabolic byproduct." }
                ],
                explanation: "Aerobic respiration uses molecular oxygen (O2) as the ultimate electron acceptor to generate water and maximize ATP."
            },
            {
                question: "Which anaerobic respiratory process utilizes nitrate as a final electron acceptor and is important in agriculture soil fertilization and gut flora?",
                options: [
                    { text: "Biological methanogenesis", correct: false, why: "Incorrect. Methanogenesis produces methane from CO2/organic decay." },
                    { text: "Denitrification", correct: true, why: "Correct! Denitrification involves agricultural nitrate soil fertilization and gut flora processing." },
                    { text: "Sulfate reduction", correct: false, why: "Incorrect. Sulfate reduction produces hydrogen sulfide (rotten egg smell)." },
                    { text: "Alcoholic fermentation", correct: false, why: "Incorrect. Alcoholic fermentation is a fermentative pathway, not anaerobic respiration." }
                ],
                explanation: "Denitrification is an anaerobic respiratory pathway using nitrogen/nitrate as an electron acceptor, active in agriculture and intestinal flora."
            },
            {
                question: "What environmental odor or indicator is classically associated with bacterial sulfate reduction?",
                options: [
                    { text: "Sweet fruity aroma", correct: false, why: "Incorrect. That is typical of certain ester fermentations." },
                    { text: "Rotten egg smell", correct: true, why: "Correct! Sulfate reduction produces hydrogen sulfide gas (H2S), resulting in a rotten egg smell." },
                    { text: "Swamp gas bubbling", correct: false, why: "Incorrect. Swamp gas is associated with methanogenesis." },
                    { text: "Vinegar tang", correct: false, why: "Incorrect. Vinegar is acetic acid fermentation." }
                ],
                explanation: "Sulfate reduction generates hydrogen sulfide, producing the characteristic rotten egg smell."
            },
            {
                question: "Biological methanogenesis is classically referenced in natural environments with which of the following?",
                options: [
                    { text: "Cow farts and swamp gas", correct: true, why: "Correct! Methanogenesis occurs during organic decay in swamps and ruminant digestive tracts." },
                    { text: "Hot spring sulfur vents", correct: false, why: "Incorrect. That relates to sulfur-oxidizing thermophiles." },
                    { text: "Root nodule nitrogen fixation", correct: false, why: "Incorrect. That is nitrogenase activity." },
                    { text: "Lactic acid milk curdling", correct: false, why: "Incorrect. That is homolactic fermentation." }
                ],
                explanation: "Biological methanogenesis produces methane during organic matter decay in swamps and ruminant guts ('cow farts and swamp gas')."
            },
            {
                question: "Most Lactobacillus and Lactococcus species ferment glucose into lactic acid as the sole end product. This is known as:",
                options: [
                    { text: "Homolactic fermentation", correct: true, why: "Correct! Homolactic fermentation produces lactic acid as the sole end product." },
                    { text: "Heterolactic fermentation", correct: false, why: "Incorrect. Heterolactic fermentation produces lactic acid, ethanol, acetic acid, and CO2." },
                    { text: "Mixed acid fermentation", correct: false, why: "Incorrect. Mixed acid fermentation produces multiple distinct acids." },
                    { text: "Alcoholic fermentation", correct: false, why: "Incorrect. Alcoholic fermentation yields ethanol and CO2." }
                ],
                explanation: "Homolactic fermentation converts pyruvate directly into lactic acid as the exclusive end product."
            },
            {
                question: "Which fermentation pathway produces a complex mixture of acetic acid, lactic acid, succinic acid, formic acid, and ethanol?",
                options: [
                    { text: "Mixed acid fermentation", correct: true, why: "Correct! Mixed acid fermentation is the classic pathway yielding this exact product set." },
                    { text: "Homolactic fermentation", correct: false, why: "Incorrect. Homolactic yields only lactic acid." },
                    { text: "Butyric acid fermentation", correct: false, why: "Incorrect. Butyric acid fermentation is used primarily by Clostridium." },
                    { text: "Propionic acid fermentation", correct: false, why: "Incorrect. Propionic acid fermentation yields propionic acid and acetic acid." }
                ],
                explanation: "Mixed acid fermentation yields multiple acids plus ethanol."
            },
            {
                question: "Enzymes that are produced continuously in constant amounts by a bacterial cell, regardless of substrate presence, are termed:",
                options: [
                    { text: "Constitutive enzymes", correct: true, why: "Correct! Constitutive enzymes are always present and active." },
                    { text: "Inducible enzymes", correct: false, why: "Incorrect. Inducible enzymes are synthesized only in response to a substrate." },
                    { text: "Repressible enzymes", correct: false, why: "Incorrect. Repressible enzymes are turned off by excess product." },
                    { text: "Allosteric enzymes", correct: false, why: "Incorrect. Allosteric refers to regulatory binding sites." }
                ],
                explanation: "Constitutive enzymes are essential house-keeping enzymes synthesized at a constant baseline rate."
            },
            {
                question: "What non-genetic regulatory mechanism involves a pathway end-product binding to the allosteric site of the initial enzyme to immediately shut it down?",
                options: [
                    { text: "Feedback inhibition", correct: true, why: "Correct! Feedback inhibition provides immediate, non-genetic control over metabolic flux." },
                    { text: "Catabolite repression", correct: false, why: "Incorrect. Catabolite repression operates at the genetic transcription level." },
                    { text: "Frameshift mutation", correct: false, why: "Incorrect. Mutations alter DNA permanently." },
                    { text: "Operon induction", correct: false, why: "Incorrect. Induction activates transcription." }
                ],
                explanation: "Feedback inhibition is an instant, enzyme-level control mechanism where excess end-product allosterically inhibits the first pathway enzyme."
            },

            // --- LECTURE 5: BACTERIAL GENETICS & REPLICATION ---
            {
                question: "Regarding bacterial genetics, which of the following is NOT always true for all bacteria?",
                options: [
                    { text: "They have circular chromosomes.", correct: true, why: "Correct! While most bacteria possess circular chromosomes, a few species (e.g., Borrelia) have linear chromosomes." },
                    { text: "They are haploid.", correct: false, why: "Incorrect. All bacteria are haploid." },
                    { text: "Their DNA does not associate with histones.", correct: false, why: "Incorrect. Bacterial DNA lacks true histone octamers." },
                    { text: "They have no intron/exon arrangement.", correct: false, why: "Incorrect. Bacteria completely lack intron/exon splicing." }
                ],
                explanation: "While the vast majority of bacteria have circular chromosomes, linear chromosomes exist in certain species, making circularity non-universal."
            },
            {
                question: "Are plasmids required for the basic vegetative survival of a bacterial cell?",
                options: [
                    { text: "Yes, plasmids encode essential chromosomal replication machinery.", correct: false, why: "Incorrect. Essential genes reside on the main chromosome." },
                    { text: "No, plasmids are non-essential extrachromosomal DNA, though they carry advantageous traits.", correct: true, why: "Correct! Plasmids are dispensable for basic life but provide adaptive benefits like antibiotic resistance." },
                    { text: "Yes, without plasmids ribosomes cannot assemble.", correct: false, why: "Incorrect. Ribosomal RNA genes are chromosomal." },
                    { text: "No, plasmids are only found in viruses.", correct: false, why: "Incorrect. Plasmids are extrachromosomal bacterial DNA." }
                ],
                explanation: "Plasmids are extrachromosomal DNA elements that carry non-essential, advantageous genes (such as R-factors for drug resistance)."
            },
            {
                question: "What unique expression capability do prokaryotes possess because they lack introns and exons and a nuclear membrane?",
                options: [
                    { text: "Mitotic chromosome segregation", correct: false, why: "Incorrect. Bacteria divide via binary fission." },
                    { text: "Simultaneous transcription and translation in the cytoplasm", correct: true, why: "Correct! Without a nuclear envelope or splicing, ribosomes can translate mRNA while it is being transcribed." },
                    { text: "Alternative splicing of transcripts", correct: false, why: "Incorrect. Splicing requires eukaryotic machinery." },
                    { text: "Meiotic recombination", correct: false, why: "Incorrect. Bacteria reproduce asexually." }
                ],
                explanation: "Because prokaryotes lack a nuclear membrane and introns, transcription and translation occur concurrently in the cytoplasm."
            },
            {
                question: "What term describes the sum of all genetic determinants in an organism?",
                options: [
                    { text: "Phenotype", correct: false, why: "Incorrect. Phenotype is observable physical properties." },
                    { text: "Genotype", correct: true, why: "Correct! Genotype is the complete genetic constitution." },
                    { text: "Wild type", correct: false, why: "Incorrect. Wild type is the natural strain." },
                    { text: "Auxotroph", correct: false, why: "Incorrect. Auxotroph is a nutritional mutant." }
                ],
                explanation: "Genotype represents the total genetic makeup, whereas phenotype refers to observable traits."
            },
            {
                question: "Which genetic term refers to the observable physical or biochemical properties of an organism?",
                options: [
                    { text: "Genotype", correct: false, why: "Incorrect. Genotype is the underlying DNA sequence." },
                    { text: "Phenotype", correct: true, why: "Correct! Phenotype is the observable expression of the genotype." },
                    { text: "Revertant", correct: false, why: "Incorrect. Revertant is a back-mutant." },
                    { text: "Auxotroph", correct: false, why: "Incorrect. Auxotroph is a growth-factor mutant." }
                ],
                explanation: "Phenotype is the collection of observable traits resulting from genotype-environment interactions."
            },
            {
                question: "What is an auxotroph (nutritional mutant)?",
                options: [
                    { text: "A mutant strain unable to grow on minimal media without a specific added growth factor", correct: true, why: "Correct! Auxotrophs have lost biosynthetic capabilities and require pre-formed growth factors." },
                    { text: "A strain that synthesizes all nutrients independently", correct: false, why: "Incorrect. That describes a prototroph." },
                    { text: "A bacterium that survives only at extreme high temperatures", correct: false, why: "Incorrect. That is a thermophile." },
                    { text: "A virus-resistant mutant", correct: false, why: "Incorrect. That is phage-resistant." }
                ],
                explanation: "An auxotroph is a mutant microorganism requiring an extra organic growth factor that the wild type can synthesize."
            },
            {
                question: "What is a 'revertant' (back-mutant)?",
                options: [
                    { text: "A mutant organism that undergoes a second mutation restoring its original wild-type phenotype", correct: true, why: "Correct! A revertant mutates back to its original wild-type form." },
                    { text: "A bacterium that loses its plasmid during binary fission", correct: false, why: "Incorrect. That is plasmid curing." },
                    { text: "A cell reverting from aerobic to anaerobic respiration", correct: false, why: "Incorrect. That is metabolic switching." },
                    { text: "An endospore reverting to vegetative growth", correct: false, why: "Incorrect. That is germination." }
                ],
                explanation: "A revertant (back-mutant) undergoes subsequent mutations that restore its original ancestral phenotype."
            }
        ];

        let quizData = [];

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function initQuiz() {
            quizData = JSON.parse(JSON.stringify(rawQuizData));
            shuffle(quizData);
            quizData.forEach(q => {
                q.options.forEach((opt, idx) => opt.originalIndex = idx);
                shuffle(q.options);
            });

            document.getElementById('summaryCard').classList.remove('visible');
            document.getElementById('quizContainer').style.display = 'block';

            renderQuiz();
            updateScore();
        }

        function renderQuiz() {
            const container = document.getElementById('quizContainer');
            container.innerHTML = '';

            quizData.forEach((q, qIndex) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.dataset.questionIndex = qIndex;

                let optionsHTML = '';
                q.options.forEach((opt, oIndex) => {
                    optionsHTML += `<li><button class="option-btn" onclick="selectAnswer(${qIndex}, ${oIndex}, ${opt.originalIndex})">${String.fromCharCode(65 + oIndex)}) ${opt.text}</button></li>`;
                });

                card.innerHTML = `
                    <div class="question-title">Q${qIndex + 1}. ${q.question}</div>
                    <ul class="options-list" id="options-${qIndex}">
                        ${optionsHTML}
                    </ul>
                    <div class="feedback-box" id="feedback-${qIndex}">
                        <div class="status-banner" id="status-${qIndex}"></div>
                        <div class="explanation-text" id="expl-${qIndex}"></div>
                        <ul class="rationales-list" id="rat-${qIndex}"></ul>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function selectAnswer(qIndex, chosenOptionIndex, originalOptionIndex) {
            const q = quizData[qIndex];
            if (q.answered) return;
            q.answered = true;
            q.userChoice = originalOptionIndex;

            const optionsContainer = document.getElementById(`options-${qIndex}`);
            const buttons = optionsContainer.getElementsByClassName('option-btn');
            
            for (let i = 0; i < buttons.length; i++) {
                buttons[i].disabled = true;
            }

            const isCorrect = q.options[chosenOptionIndex].correct;

            if (!isCorrect) {
                wrongAudio.currentTime = 0;
                wrongAudio.play().catch(e => console.log("Audio play blocked or missing:", e));
            }

            q.options.forEach((opt, idx) => {
                if (opt.correct) {
                    buttons[idx].classList.add('correct');
                } else if (idx === chosenOptionIndex && !isCorrect) {
                    buttons[idx].classList.add('incorrect');
                }
            });

            const feedbackBox = document.getElementById(`feedback-${qIndex}`);
            const statusBanner = document.getElementById(`status-${qIndex}`);
            const explText = document.getElementById(`expl-${qIndex}`);
            const ratList = document.getElementById(`rat-${qIndex}`);

            feedbackBox.classList.add('show');
            if (isCorrect) {
                statusBanner.textContent = "Correct!";
                statusBanner.className = "status-banner correct";
            } else {
                statusBanner.textContent = "Incorrect.";
                statusBanner.className = "status-banner incorrect";
            }

            explText.textContent = q.explanation;

            let ratHTML = '';
            q.options.forEach((opt, idx) => {
                const letter = String.fromCharCode(65 + idx);
                ratHTML += `<li><strong>${letter}) ${opt.text}</strong>: ${opt.why}</li>`;
            });
            ratList.innerHTML = ratHTML;

            updateScore();
            checkCompletion();
        }

        function updateScore() {
            let answeredCount = 0;
            let correctCount = 0;

            quizData.forEach(q => {
                if (q.answered) {
                    answeredCount++;
                    const chosen = q.options.find(opt => opt.originalIndex === q.userChoice);
                    if (chosen && chosen.correct) {
                        correctCount++;
                    }
                }
            });

            const total = quizData.length;
            const percentage = total > 0 ? Math.round((correctCount / total) * 100) : 0;
            document.getElementById('scoreDisplay').textContent = `Score: ${correctCount} / ${total} (${percentage}%)`;
            
            const progressPct = total > 0 ? (answeredCount / total) * 100 : 0;
            document.getElementById('progressBar').style.width = progressPct + '%';
        }

        function checkCompletion() {
            const allAnswered = quizData.every(q => q.answered);
            if (allAnswered) {
                let correctCount = quizData.filter(q => {
                    const chosen = q.options.find(opt => opt.originalIndex === q.userChoice);
                    return chosen && chosen.correct;
                }).length;
                const total = quizData.length;
                const percentage = Math.round((correctCount / total) * 100);

                document.getElementById('finalScore').textContent = `${correctCount} / ${total} (${percentage}%)`;
                
                let feedbackMsg = "Solid run! You're locked in.";
                if (percentage >= 90) {
                    feedbackMsg = "Absolute Gigachad. You drained that test dry.";
                } else if (percentage < 70) {
                    feedbackMsg = "You really didn't fucking know that.";
                }
                document.getElementById('summaryFeedback').textContent = feedbackMsg;

                document.getElementById('summaryCard').classList.add('visible');
                document.getElementById('summaryCard').scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function resetQuiz() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            initQuiz();
        }

        window.onload = initQuiz;
    </script>
</body>
</html>
