    <script>
        const rawQuizData = [
            // PART 1: LECTURE 4 - METABOLISM & FERMENTATION
            {

                explanation: "While the vast majority of bacteria have circular chromosomes, a few species have linear chromosomes; thus, circularity is not universally true for 100% of bacterial species."
            },
            {

                options: [
                    { text: "Yes, without plasmids a bacterium cannot replicate its chromosome.", correct: false, why: "Incorrect. Plasmids are not part of core chromosome replication." },

                explanation: "In bacteria, translation can occur concurrently with transcription on the same mRNA strand because there is no nuclear membrane separating the processes and no intron splicing is required."

                    { text: "Lactose is present AND glucose is NOT present.", correct: true, why: "Correct! Lactose removes the repressor, and the absence of glucose elevates cAMP/CAP to drive strong transcription." },
                    { text: "Lactose is absent AND glucose is present.", correct: false, why: "Incorrect. The lac repressor remains bound to the operator, preventing transcription entirely." },
                    { text: "Both lactose and glucose are absent.", correct: false, why: "Incorrect. Without lactose, the repressor blocks the operator." }
                ],
                explanation: "Strong transcription of the lac operon requires two conditions: lactose must be present (to remove the repressor) and glucose must be absent (allowing high cAMP levels to activate CAP)."
            },
            {
                question: "What occurs at the lac operon when lactose is present BUT glucose is ALSO present in high concentrations?",
                options: [
                    { text: "Strong transcription occurs because lactose is present.", correct: false, why: "Incorrect. Glucose suppresses high transcription via catabolite repression." },
                    { text: "No/low-level transcription occurs because glucose is preferred and cAMP levels remain low.", correct: true, why: "Correct! Catabolite repression keeps cAMP low, preventing CAP binding; thus, only basal/negligible transcription occurs." },
                    { text: "The lac operon DNA is degraded by exonucleases.", correct: false, why: "Incorrect. Operons are regulated, not destroyed." },
                    { text: "The operator undergoes a frameshift mutation.", correct: false, why: "Incorrect. Operon regulation is physiological, not mutational." }
                ],
                explanation: "Because 'glucose is king,' the presence of glucose keeps intracellular cAMP low, preventing the CAP activator from stimulating the promoter. Transcription remains low or absent."
            },
            {
                question: "How does a repressible operon (such as the tryptophan or arginine operon) normally operate under default cellular conditions?",
                options: [
                    { text: "It is normally OFF and must be induced by an external sugar.", correct: false, why: "Incorrect. That describes an inducible operon like the lac operon." },
                    { text: "It is normally ON and actively transcribing, but is turned OFF when excess metabolic end-product accumulates.", correct: true, why: "Correct! Repressible operons synthesize anabolic enzymes continuously until the end-product accumulates and activates the repressor." },
                    { text: "It is permanently inactive in all bacteria.", correct: false, why: "Incorrect. Repressible operons function daily in bacterial anabolism." },
                    { text: "It requires bacteriophage infection to function.", correct: false, why: "Incorrect. Operons are native bacterial genetic units." }
                ],
                explanation: "Repressible operons are normally ON (transcribing enzymes for anabolism) and are repressed only when their metabolic end-product accumulates in excess."
            },

            // PART 4: HORIZONTAL GENE TRANSFER & RECOMBINATION
            {
                question: "Which mechanism of horizontal gene transfer involves the uptake of naked, soluble environmental DNA released from lysed or destroyed bacteria?",
                options: [
                    { text: "Transduction", correct: false, why: "Incorrect. Transduction requires a bacteriophage." },
                    { text: "Transformation", correct: true, why: "Correct! Transformation is the direct uptake of naked environmental DNA fragments by competent bacterial cells." },
                    { text: "Conjugation", correct: false, why: "Incorrect. Conjugation requires cell-to-cell contact via a sex pilus." },
                    { text: "Transposition", correct: false, why: "Incorrect. Transposition is intracellular recombination." }
                ],
                explanation: "Transformation is the process by which a competent bacterium binds and internalizes naked DNA fragments from the surrounding extracellular environment."
            },
            {
                question: "Which method of horizontal gene transfer is mediated by a bacteriophage (bacterial virus) transferring genetic material from a donor cell to a recipient?",
                options: [
                    { text: "Transformation", correct: false, why: "Incorrect. Transformation uses naked DNA." },
                    { text: "Transduction", correct: true, why: "Correct! Transduction specifically relies on a bacteriophage vector to transfer bacterial DNA." },
                    { text: "Conjugation", correct: false, why: "Incorrect. Conjugation uses a sex pilus." },
                    { text: "Transposition", correct: false, why: "Incorrect. Transposons do not use viral vectors." }
                ],
                explanation: "Transduction is the viral-mediated transfer of bacterial DNA from one host cell to another via accidental packaging during bacteriophage assembly."
            },
            {
                question: "Which form of horizontal gene transfer is the most common, is mediated by direct physical contact via a sex pilus, and is primarily performed by Gram-negative bacteria?",
                options: [
                    { text: "Transformation", correct: false, why: "Incorrect. Transformation does not use pili." },
                    { text: "Conjugation", correct: true, why: "Correct! Conjugation involves physical bridge formation via a sex pilus to transfer plasmids between cells." },
                    { text: "Transduction", correct: false, why: "Incorrect. Transduction uses bacteriophages." },
                    { text: "Transposition", correct: false, why: "Incorrect. Transposition occurs within a single cell's DNA." }
                ],
                explanation: "Conjugation is bacterial 'mating' where donor cells (F+) use a sex pilus to transfer plasmid DNA directly into a recipient cell (F-)."
            },
            {
                question: "Which genetic element represents a mechanism of genetic recombination (rearranging DNA sequences within a cell), but is NOT an intercellular transfer mechanism between different bacteria?",
                options: [
                    { text: "Transduction", correct: false, why: "Incorrect. Transduction transfers DNA between cells via phages." },
                    { text: "Transformation", correct: false, why: "Incorrect. Transformation transfers DNA between cells." },
                    { text: "Transposons ('jumping genes')", correct: true, why: "Correct! Transposons move DNA segments within a genome or between a plasmid and chromosome, but cannot transfer between independent cells on their own." },
                    { text: "Conjugation", correct: false, why: "Incorrect. Conjugation is an intercellular transfer mechanism." }
                ],
                explanation: "Transposons are mobile genetic elements ('jumping genes') that facilitate intracellular recombination, but require a vector like a conjugative plasmid or phage to move between cells."
            },
            {
                question: "When a transposon relocates into a new genetic location, how does it physically insert itself into the target DNA sequence?",
                options: [
                    { text: "It dissolves the cell membrane and exports the entire chromosome.", correct: false, why: "Incorrect. Transposons act strictly on nucleic acid sequences." },
                    { text: "It cleaves the target DNA, unwinds the strands, and 'scootches' into the site, inserting a new sequence arrangement.", correct: true, why: "Correct! Transposase enzymes cleave the target site and integrate the mobile transposon sequence directly." },
                    { text: "It packages itself into a capsid and buds out of the nucleus.", correct: false, why: "Incorrect. Transposons are not viruses and bacteria lack a nucleus." },
                    { text: "It forces the bacterium to undergo sexual meiosis.", correct: false, why: "Incorrect. Bacteria are asexual." }
                ],
                explanation: "Transposons use transposase enzymes to cut target DNA and insert their sequence into the new genomic locus ('scooching in')."
            },
            {
                question: "Which genetic phenomenon involves both gene induction and end-product repression to coordinate metabolic enzyme synthesis?",
                options: [
                    { text: "Operon-based genetic regulation", correct: true, why: "Correct! Operon systems coordinate inducible and repressible enzyme synthesis at the transcriptional level." },
                    { text: "Allosteric feedback inhibition", correct: false, why: "Incorrect. Feedback inhibition is non-genetic protein-level inhibition." },
                    { text: "Constitutive expression", correct: false, why: "Incorrect. Constitutive genes are not regulated by induction/repression." },
                    { text: "Frameshift mutation", correct: false, why: "Incorrect. Frameshift is a type of DNA damage." }
                ],
                explanation: "Operon systems provide transcriptional regulation through induction (turning genes on) or repression (turning genes off) in response to cellular metabolic demands."
            }
        ];

        let quizData = [];

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function initQuiz() {
            quizData = JSON.parse(JSON.stringify(rawQuizData));
            shuffle(quizData);
            quizData.forEach(q => {
                q.options.forEach((opt, idx) => opt.originalIndex = idx);
                shuffle(q.options);
            });

            renderQuiz();
            updateScore();
        }

        function renderQuiz() {
            const container = document.getElementById('quizContainer');
            container.innerHTML = '';

            quizData.forEach((q, qIndex) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.dataset.questionIndex = qIndex;

                let optionsHTML = '';
                q.options.forEach((opt, oIndex) => {
                    optionsHTML += `<button class="option-btn" onclick="selectAnswer(${qIndex}, ${oIndex}, ${opt.originalIndex})">${String.fromCharCode(65 + oIndex)}) ${opt.text}</button>`;
                });

                card.innerHTML = `
                    <div class="question-title">Q${qIndex + 1}. ${q.question}</div>
                    <div class="options-list" id="options-${qIndex}">
                        ${optionsHTML}
                    </div>
                    <div class="feedback-box" id="feedback-${qIndex}">
                        <div class="status-banner" id="status-${qIndex}"></div>
                        <div class="explanation-text" id="expl-${qIndex}"></div>
                        <ul class="rationales-list" id="rat-${qIndex}"></ul>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function selectAnswer(qIndex, chosenOptionIndex, originalOptionIndex) {
            const q = quizData[qIndex];
            if (q.answered) return;
            q.answered = true;
            q.userChoice = originalOptionIndex;

            const optionsContainer = document.getElementById(`options-${qIndex}`);
            const buttons = optionsContainer.getElementsByClassName('option-btn');
            
            for (let i = 0; i < buttons.length; i++) {
                buttons[i].disabled = true;
            }

            const isCorrect = q.options[chosenOptionIndex].correct;

            q.options.forEach((opt, idx) => {
                if (opt.correct) {
                    buttons[idx].classList.add('correct');
                } else if (idx === chosenOptionIndex && !isCorrect) {
                    buttons[idx].classList.add('incorrect');
                }
            });

            const feedbackBox = document.getElementById(`feedback-${qIndex}`);
            const statusBanner = document.getElementById(`status-${qIndex}`);
            const explText = document.getElementById(`expl-${qIndex}`);
            const ratList = document.getElementById(`rat-${qIndex}`);

            feedbackBox.classList.add('show');
            if (isCorrect) {
                statusBanner.textContent = "Correct!";
                statusBanner.className = "status-banner correct";
            } else {
                statusBanner.textContent = "Incorrect.";
                statusBanner.className = "status-banner incorrect";
            }

            explText.textContent = q.explanation;

            let ratHTML = '';
            q.options.forEach((opt, idx) => {
                const letter = String.fromCharCode(65 + idx);
                ratHTML += `<li><strong>${letter}) ${opt.text}</strong>: ${opt.why}</li>`;
            });
            ratList.innerHTML = ratHTML;

            updateScore();
        }

        function updateScore() {
            let answeredCount = 0;
            let correctCount = 0;

            quizData.forEach(q => {
                if (q.answered) {
                    answeredCount++;
                    const chosen = q.options.find(opt => opt.originalIndex === q.userChoice);
                    if (chosen && chosen.correct) {
                        correctCount++;
                    }
                }
            });

            const total = quizData.length;
            const percentage = total > 0 ? Math.round((correctCount / total) * 100) : 0;
            document.getElementById('scoreDisplay').textContent = `Score: ${correctCount} / ${total} (${percentage}%)`;
        }

        window.onload = initQuiz;
    </script>
</body>
