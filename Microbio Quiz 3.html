                    "A) MHC Class II: Correct. Professional APCs present exogenous antigens on MHC Class II molecules to activate CD4+ helper T-cells.",
                    "B) MHC Class I: Incorrect. MHC Class I presents endogenous antigens to CD8+ cytotoxic T-cells.",
                    "C) IgD: Incorrect. IgD acts as a B-cell surface antigen receptor.",
                    "D) CD25+Foxp3+: Incorrect. These markers designate regulatory T-cell phenotypes rather than antigen presentation molecules."
                ]
            }
        ];

        let activeQuizData = [];
        let currentScore = 0;
        let answeredCount = 0;

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function renderQuiz() {
            activeQuizData = shuffleArray(JSON.parse(JSON.stringify(rawQuizData)));

            const container = document.getElementById('quiz-container');
            container.innerHTML = '';

            activeQuizData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `card-${index}`;

                const qNum = document.createElement('div');
                qNum.className = 'question-number';
                qNum.innerText = `Question ${index + 1} of ${activeQuizData.length}`;

                const qText = document.createElement('div');
                qText.className = 'question-stem';
                qText.innerText = item.stem;

                const optionsGrid = document.createElement('div');
                optionsGrid.className = 'options-grid';

                let optionsWithIndices = item.options.map((opt, idx) => ({ text: opt, isCorrect: idx === item.correctIndex }));
                shuffleArray(optionsWithIndices);

                optionsWithIndices.forEach((optObj, optIdx) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerText = `${String.fromCharCode(65 + optIdx)}. ${optObj.text}`;
                    btn.onclick = () => handleAnswer(index, optObj.isCorrect, btn, optionsGrid);
                    optionsGrid.appendChild(btn);
                });

                const exp = document.createElement('div');
                exp.className = 'explanation';
                exp.id = `exp-${index}`;

                let rationalesHTML = '<ul class="rationale-list">';
                item.rationales.forEach(rat => {
                    rationalesHTML += `<li>• ${rat}</li>`;
                });
                rationalesHTML += '</ul>';

                exp.innerHTML = `
                    <div class="explanation-paragraph"><strong>Explanation:</strong> ${item.explanationText}</div>
                    ${rationalesHTML}
                `;

                card.appendChild(qNum);
                card.appendChild(qText);
                card.appendChild(optionsGrid);
                card.appendChild(exp);

                container.appendChild(card);
            });

            updateHeader();
        }

        function handleAnswer(qIndex, isCorrect, selectedBtn, optionsContainer) {
            const card = document.getElementById(`card-${qIndex}`);
            const buttons = optionsContainer.querySelectorAll('.option-btn');
            const exp = document.getElementById(`exp-${qIndex}`);

            buttons.forEach(btn => btn.disabled = true);

            if (isCorrect) {
                selectedBtn.classList.add('correct');
                currentScore++;
            } else {
                selectedBtn.classList.add('incorrect');
                // Highlight the correct one
                buttons.forEach(btn => {
                    // Check button text against the actual correct text
                    const originalItem = activeQuizData[qIndex];
                    const correctText = originalItem.options[originalItem.correctIndex];
                    if (btn.innerText.includes(correctText)) {
                        btn.classList.add('correct');
                    }
                });

                // Play wrong answer sound effect
                wrongSound.currentTime = 0;
                wrongSound.play().catch(error => {
                    console.log("Audio playback prevented or failed:", error);
                });
            }

            exp.style.display = 'block';
            answeredCount++;

            updateHeader();

            if (answeredCount === activeQuizData.length) {
                showSummary();
            }
        }

        function updateHeader() {
            const total = activeQuizData.length;
            const pct = total === 0 ? 0 : Math.round((currentScore / total) * 100);
            document.getElementById('score-display').innerText = `Score: ${currentScore} / ${total} (${pct}%)`;
        }

        function showSummary() {
            const total = activeQuizData.length;
            const pct = Math.round((currentScore / total) * 100);
            const summaryCard = document.getElementById('summary-card');
            const finalScore = document.getElementById('final-score');
            const feedback = document.getElementById('summary-feedback');

            finalScore.innerText = `${pct}%`;

            if (pct >= 90) {
                feedback.innerText = "Absolute Gigachad. You drained that test dry.";
            } else if (pct >= 75) {
                feedback.innerText = "You lasted less than 30 seconds. Time for a rematch.";
            } else {
                feedback.innerText = "You really didn’t fucking know that.";
            }

            summaryCard.style.display = 'block';
            summaryCard.scrollIntoView({ behavior: 'smooth' });
        }

        function resetQuiz() {
            currentScore = 0;
            answeredCount = 0;
            document.getElementById('summary-card').style.display = 'none';
            renderQuiz();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.onload = renderQuiz;
    </script>
</body>
</html>
