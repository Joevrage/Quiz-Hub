];
let hist={};try{hist=JSON.parse(localStorage.getItem('quiz_missed_history')||'{}')}catch(e){}
const saveHist=()=>{try{localStorage.setItem('quiz_missed_history',JSON.stringify(hist))}catch(e){}};
let sel=new Set(SUBJECTS.map((_,i)=>i)),prio=false,view='single',muted=false,QS=[],UA=[],cur=0,score=0,pt=null;
try{muted=localStorage.getItem('stfuErijah')==='1'}catch(e){}
try{view=localStorage.getItem('quizViewMode')||'single'}catch(e){}
const $=id=>document.getElementById(id),L='ABCD';
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pool=()=>questionBank.filter(q=>sel.has(q.subjectIndex));
const missed=()=>questionBank.filter(q=>hist[q.id]>0).length;
function stfuUI(){const b=$('stfuBtn');b.textContent=muted?'Bring Back Erijah':'STFU Erijah';b.classList.toggle('muted',muted);
if(muted){const a=$('wrongAudio');if(a){a.pause();a.currentTime=0}clearTimeout(pt);$('wrongPopup').classList.add('hidden')}}
function toggleStfu(){muted=!muted;try{localStorage.setItem('stfuErijah',muted?'1':'0')}catch(e){}stfuUI()}
function modeUI(){const b=$('modeBtn');b.textContent=view==='all'?'View: All at Once':'View: One by One';b.classList.toggle('active',view==='all')}
function setView(v){view=v;try{localStorage.setItem('quizViewMode',v)}catch(e){}modeUI();QS.length?go():home()}
function hdr(){const n=QS.length,a=UA.filter(x=>x!==null).length;
$('q-display').textContent=!n?'Question 0 of 0':view==='all'?'Answered '+a+' of '+n:'Question '+Math.min(cur+1,n)+' of '+n;
$('score-display').textContent='Score: '+score+' / '+a+' ('+(a?Math.round(score/a*100):0)+'%)';
$('progress-bar').style.width=(n?a/n*100:0)+'%'}
function home(){QS=[];UA=[];cur=0;score=0;hdr();$('wrongPopup').classList.add('hidden');
const p=pool(),chips=SUBJECTS.map((s,i)=>'<span class="chip '+(sel.has(i)?'on':'')+'" onclick="tg('+i+')">'+s+' ('+questionBank.filter(q=>q.subjectIndex===i).length+')</span>').join('');
$('main').innerHTML='<div class="card"><h2>Select Subjects</h2><div class="chips">'+chips+'</div><button class="btn" onclick="sa(true)">Select All</button><button class="btn" onclick="sa(false)">Clear</button><button class="btn '+(prio?'pri':'')+'" onclick="prio=!prio;home()">Prioritize Missed ('+missed()+')</button><div class="counter">'+p.length+' questions across '+sel.size+' subjects selected</div></div>'+
'<div class="card"><h2>Display Mode</h2><div class="chips"><span class="chip '+(view==='single'?'on':'')+'" onclick="setView(\'single\')">One by One (Flashcard/Card View)</span><span class="chip '+(view==='all'?'on':'')+'" onclick="setView(\'all\')">All at Once (Continuous List)</span></div></div>'+
'<div class="card"><h2>Launch</h2><div class="grid">'+[15,25,35,50].map(n=>'<button class="btn pri" onclick="start('+n+')">'+(n===50?'Full Exam (50 Qs)':'Quickie ('+n+' Qs)')+'</button>').join('')+'<button class="btn pri" onclick="start(0)">Entire Selected Bank ('+p.length+')</button></div></div>'}
function tg(i){sel.has(i)?sel.delete(i):sel.add(i);home()}
function sa(a){sel=a?new Set(SUBJECTS.map((_,i)=>i)):new Set();home()}
function prep(l){return l.map(q=>{const c=JSON.parse(JSON.stringify(q));shuffle(c.options);return c})}
function begin(list){QS=prep(list);UA=new Array(QS.length).fill(null);cur=0;score=0;go()}
function start(n){const p=pool();if(!p.length)return;const t=n?Math.min(n,p.length):p.length;let d=[];
if(prio){const c=p.slice();while(d.length<t&&c.length){const w=c.map(q=>1+3*(hist[q.id]||0));let r=Math.random()*w.reduce((a,b)=>a+b,0),k=0;while(r>w[k]&&k<c.length-1){r-=w[k];k++}d.push(c.splice(k,1)[0])}}
else d=shuffle(p.slice()).slice(0,t);begin(d)}
function expl(q,nx){const ok=q._ok;return '<div class="expl"><div class="status '+(ok?'ok':'bad')+'">'+(ok?'CORRECT!':'INCORRECT.')+'</div><div class="core"><b>Core Concept:</b> '+q.options.find(o=>o.correct).why+'</div><ul>'+q.options.map((o,i)=>'<li><b>'+L[i]+'.</b> '+o.text+' &mdash; '+o.why+'</li>').join('')+'</ul>'+(nx?'<button class="btn pri" onclick="nxt()">'+(cur===QS.length-1?'Finish':'Next')+'</button>':'')+'</div>'}
function card(i,single){const q=QS[i],a=UA[i],done=a!==null;
return '<div class="card" id="c'+i+'"><div class="badges">'+(single?'':'<span class="badge">Q'+(i+1)+'</span>')+'<span class="badge">'+SUBJECTS[q.subjectIndex]+'</span><span class="badge g">'+q.difficulty+'</span>'+(q.priority?'<span class="badge">High-yield</span>':'')+'</div><div class="stem">'+(single?(i+1)+'. ':'')+q.stem+'</div>'+
q.options.map((o,k)=>'<button class="option-btn '+(done?(o.correct?'correct':k===a?'incorrect':'dim'):'')+'" '+(done?'disabled':'')+' onclick="pick('+i+','+k+')">'+L[k]+'. '+o.text+'</button>').join('')+(done?expl(q,single):'')+'</div>'}
function go(){hdr();$('wrongPopup').classList.add('hidden');
if(view==='all'){$('main').innerHTML=QS.map((_,i)=>card(i,false)).join('')+(UA.every(x=>x!==null)?fin():'')}
else{$('main').innerHTML=card(cur,true);window.scrollTo({top:0})}}
const fin=()=>'<div class="card" id="fin" style="text-align:center"><button class="btn pri" onclick="summary()">View Final Results Summary</button></div>';
function pick(i,k){if(UA[i]!==null)return;const q=QS[i];q._ok=q.options[k].correct;UA[i]=k;
if(q._ok){score++;if(hist[q.id]){hist[q.id]--;if(!hist[q.id])delete hist[q.id]}}
else{hist[q.id]=(hist[q.id]||0)+1;if(!muted){const w=$('wrongAudio');if(w){w.currentTime=0;w.play().catch(e=>console.log('Audio play blocked:',e))}const p=$('wrongPopup');p.classList.remove('hidden');clearTimeout(pt);pt=setTimeout(()=>p.classList.add('hidden'),2000)}}
saveHist();hdr();
if(view==='all'){$('c'+i).outerHTML=card(i,false);if(UA.every(x=>x!==null)&&!$('fin')){$('main').insertAdjacentHTML('beforeend',fin())}}
else $('main').innerHTML=card(i,true)}
function nxt(){if(cur>=QS.length-1)return summary();cur++;go()}
function summary(){const n=QS.length,pct=Math.round(score/n*100);
const m=pct>=90?'Absolute Gigachad. You drained that test dry.':pct>=70?'You lasted less than 30 seconds. Time for a rematch.':'You really didn’t fucking know that.';
const row=(l,f)=>{const a=QS.filter(f);return a.length?'<tr><td>'+l+'</td><td>'+a.filter(q=>q._ok).length+' / '+a.length+'</td></tr>':''};
$('progress-bar').style.width='100%';
$('main').innerHTML='<div class="card sum"><h2>'+pct+'%</h2><p>'+score+' / '+n+' correct</p><p>'+m+'</p><table><tr><th>Difficulty</th><th>Correct</th></tr>'+['easy','medium','hard'].map(d=>row(d,q=>q.difficulty===d)).join('')+'</table><table><tr><th>Subject</th><th>Correct</th></tr>'+SUBJECTS.map((s,i)=>row(s,q=>q.subjectIndex===i)).join('')+'</table><button class="btn pri" onclick="retake()">Retake Quiz</button><button class="btn pri" onclick="review()">Review Missed</button><button class="btn" onclick="home()">Back to Menu</button><a href="index.html" class="btn hub-btn">Back to Main Page</a></div>';window.scrollTo({top:0})}
function retake(){const ids=QS.map(q=>q.id);begin(shuffle(questionBank.filter(q=>ids.includes(q.id))))}
function review(){const ids=QS.filter(q=>!q._ok).map(q=>q.id);if(!ids.length){alert('Nothing missed. Nice.');return}begin(questionBank.filter(q=>ids.includes(q.id)))}
window.onload=()=>{$('stfuBtn').addEventListener('click',toggleStfu);$('menuBtn').addEventListener('click',home);$('modeBtn').addEventListener('click',()=>setView(view==='all'?'single':'all'));stfuUI();modeUI();home()};
</script></body></html>
