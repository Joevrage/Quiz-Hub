                    { text: "Transcellular space, cerebrospinal fluid, and synovial fluid", correct: false, why: "C) Incorrect. These are subcategories of transcellular fluid." },

                takeaway: "The three primary fluid compartments maintaining osmotic equilibrium are the intravascular space, interstitial space, and intracellular space."

        let currentScore = 0;
        let answeredQuestions = new Set();
        const totalQuestions = quizData.length;
        
        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
        }

        function renderQuiz() {
            shuffleArray(quizData);
            quizData.forEach(q => shuffleArray(q.options));
            
            const quizContainer = document.getElementById('quiz-container');
            quizContainer.innerHTML = '';
            currentScore = 0;
            answeredQuestions.clear();
            updateScoreDisplay();
            
            document.getElementById('summary-card').style.display = 'none';
            document.getElementById('quiz-container').style.display = 'block';
            window.scrollTo(0, 0);

            quizData.forEach((data, qIndex) => {
                const questionCard = document.createElement('div');
                questionCard.className = 'question-card';
                questionCard.id = `q-${qIndex}`;

                const questionNumber = document.createElement('div');
                questionNumber.className = 'question-number';
                questionNumber.innerText = `Question ${qIndex + 1} of ${totalQuestions}`;
                
                const questionText = document.createElement('div');
                questionText.className = 'question-text';
                questionText.innerText = data.question;

                const optionsContainer = document.createElement('div');
                optionsContainer.className = 'options-container';

                data.options.forEach((opt, oIndex) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    const letter = String.fromCharCode(65 + oIndex);
                    btn.innerText = `${letter}. ${opt.text}`;
                    
                    btn.onclick = () => handleAnswer(qIndex, oIndex, btn, opt.correct, data);
                    optionsContainer.appendChild(btn);
                });

                const explanationDiv = document.createElement('div');
                explanationDiv.className = 'explanation';
                explanationDiv.id = `exp-${qIndex}`;

                questionCard.appendChild(questionNumber);
                questionCard.appendChild(questionText);
                questionCard.appendChild(optionsContainer);
                questionCard.appendChild(explanationDiv);
                quizContainer.appendChild(questionCard);
            });
        }

        function handleAnswer(qIndex, oIndex, btnElement, isCorrect, data) {
            if (answeredQuestions.has(qIndex)) return;
            answeredQuestions.add(qIndex);
            
            const allButtons = document.getElementById(`q-${qIndex}`).querySelectorAll('.option-btn');
            allButtons.forEach((btn, idx) => {
                btn.disabled = true;
                if (data.options[idx].correct) {
                    btn.classList.add('correct');
                }
            });

            const expDiv = document.getElementById(`exp-${qIndex}`);
            
            let rationaleHTML = '<div class="rationale-list">';
            data.options.forEach((opt, idx) => {
                const letter = String.fromCharCode(65 + idx);
                rationaleHTML += `<div class="rationale-item"><strong>${letter})</strong> ${opt.why}</div>`;
            });
            rationaleHTML += '</div>';

            if (isCorrect) {
                currentScore++;
                expDiv.innerHTML = `
                    <div class="explanation-banner correct-banner">Correct!</div>
                    <div class="takeaway-text"><strong>Core Takeaway:</strong> ${data.explanation}</div>
                    ${rationaleHTML}
                `;
            } else {
                btnElement.classList.add('incorrect');
                expDiv.innerHTML = `
                    <div class="explanation-banner incorrect-banner">Incorrect.</div>
                    <div class="takeaway-text"><strong>Core Takeaway:</strong> ${data.explanation}</div>
                    ${rationaleHTML}
                `;
            }
            
            expDiv.style.display = 'block';
            updateScoreDisplay();

            if (answeredQuestions.size === totalQuestions) {
                showSummary();
            }
        }

        function updateScoreDisplay() {
            let percentage = totalQuestions === 0 ? 0 : Math.round((currentScore / totalQuestions) * 100);
            document.getElementById('score-header').innerText = `Score: ${currentScore} / ${totalQuestions} (${percentage}%)`;
        }

        function showSummary() {
            setTimeout(() => {
                document.getElementById('quiz-container').style.display = 'none';
                const summaryCard = document.getElementById('summary-card');
                summaryCard.style.display = 'block';
                
                let percentage = Math.round((currentScore / totalQuestions) * 100);
                document.getElementById('final-score-display').innerText = `${currentScore} / ${totalQuestions} (${percentage}%)`;
                
                let feedback = percentage >= 85 ? "Exceptional work! You have mastered fluid balance, Starling forces, hypothalamic osmoregulation, and the Gibbs-Donnan equilibrium." : "Review the 10% cellular buffering threshold, SFO/OVLT osmoreceptors, and ADH mechanisms.";
                document.getElementById('final-feedback').innerText = feedback;
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, 800); 
        }

        function resetQuiz() { 
            renderQuiz(); 
        }

        window.onload = renderQuiz;
    </script>
