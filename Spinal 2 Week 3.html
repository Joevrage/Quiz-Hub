            "What are the origin sites of the Multifidus muscle?\tPosterior sacrum, PSIS, mammillary processes of L1-L5, TPs of T1-T12, and articular processes of C4-C7.",
            "What is the insertion range of the Multifidus muscle?\tSpinous processes of C2 down through L5.",
            "What nerve innervates the Multifidus muscle?\tDorsal rami of spinal nerves.",
            "What are the 3 actions of the Multifidus muscle?\tExtension, lateral flexion, and contralateral rotation of vertebrae.",
            "Why is Multifidus clinically significant in spinal rehabilitation?\tIt is a primary segmental postural stabilizer and the most commonly strained deep back muscle during heavy lifting/flexion.",
            "How many vertebral segments does Rotatores Brevis span?\t1 segment (inserts on the spinous process 1 level above origin).",
            "How many vertebral segments does Rotatores Longus span?\t2 segments (inserts on the spinous process 2 levels above origin).",
            "What is the origin of Rotatores Longus?\tTransverse processes of C4-C7, T1-T12, and L1-L5.",
            "What is the origin of Rotatores Brevis?\tTransverse processes of C3-C7, T1-T12, and L1-L5.",
            "Why does Rotatores Brevis extend up to C3 TP while Rotatores Longus stops at C4?\tRotatores Brevis attaches 1 segment above (reaching C2 SP), whereas Longus spanning 2 segments from C3 would target C1, which lacks a spinous process.",
            "What are the primary actions of the Rotatores group?\tExtension and contralateral rotation of the spine (lacks lateral flexion).",
            "What nerve innervates the Rotatores group?\tDorsal rami of spinal nerves.",
            "Where are Interspinous muscles present as paired structures?\tC3-T1 and T12-S1.",
            "What is the insertion of Interspinous muscles?\tSpinous process 1 segment above origin (C2-L5 where present).",
            "What is the action of Interspinous muscles?\tExtension of the vertebral column.",
            "What nerve innervates Interspinous muscles?\tDorsal rami of spinal nerves.",
            "How are Intertransversarii structured in the cervical spine (C3-T1)?\tPaired anterior and posterior muscles.",
            "How are Intertransversarii structured in the thoracic spine (T1-T12)?\tSingle muscle bundles between transverse processes.",
            "How are Intertransversarii structured in the lumbar spine (L1-L5)?\tPaired medial and lateral muscles (to stabilize J-shaped facets).",
            "What is the critical innervation exception for Intertransversarii?\tVentral rami EXCEPT medial lumbar Intertransversarii, which are innervated by DORSAL rami.",
            "What is the primary action of Intertransversarii muscles?\tLateral flexion of the spine and postural stabilization.",
            "What structural direction defines all Transversospinalis muscle fibers?\tThey originate on Transverse Processes (TPs) and run medially/superiorly to insert on Spinous Processes (SPs).",
            "What rotational motion occurs when right-sided Transversospinalis muscles contract independently?\tLeft (contralateral) spinal rotation.",
            "What motion occurs when Transversospinalis muscles contract bilaterally?\tPure spinal extension.",
            "Why is Multifidus omitted from deep diagrams showing Rotatores?\tIts thick, broad muscle bulk would obscure the deeper Rotatores and intersegmental muscles.",
            "What fiber type predominates in deep intersegmental spinal muscles?\tSlow-twitch, highly oxidative Type I fibers specialized for posture and proprioception.",
            "Compare segment spans: Rotatores Brevis vs. Rotatores Longus vs. Multifidus vs. Semispinalis.\tBrevis = 1 segment<br>Longus = 2 segments<br>Multifidus = 3-4 segments<br>Semispinalis = 4-6 segments.",
            "What process on lumbar vertebrae serves as an origin for Multifidus?\tMammillary process (on posterior aspect of superior articular process).",
            "Which spinal level lacks a true spinous process, limiting upper SP attachments?\tAtlas (C1).",
            "What nerve supplies suboccipital muscles from C1 dorsal ramus?\tSuboccipital nerve.",
            "What is the insertion of Semispinalis Capitis?\tOccipital bone between superior and inferior nuchal lines.",
            "What functional role do Intertransversarii play in the thoracic spine despite rib presence?\tProprioceptive sensory transducers and postural micro-adjusters."
        ].join("\n");

        // App State Variables
        let userAnswers = {};
        let score = 0;

        // Populate TSV textarea on load
        document.getElementById("tsv-textarea").value = ankiTSVData;

        // Copy TSV Function
        function copyAnkiTSV() {
            const textarea = document.getElementById("tsv-textarea");
            textarea.select();
            document.execCommand('copy');
            const copyBtn = document.querySelector('.copy-btn');
            copyBtn.innerText = "Copied to Clipboard!";
            setTimeout(() => {
                copyBtn.innerText = "Copy TSV to Clipboard";
            }, 2000);
        }
        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
        }

        // Initialize Quiz Function
        function initQuiz() {
            userAnswers = {};
            score = 0;
            updateHeader();

            shuffleArray(quizData);
            quizData.forEach(q => shuffleArray(q.options));
            
            const container = document.getElementById("quiz-container");
            container.innerHTML = "";
            document.getElementById("summary-card").style.display = "none";

            quizData.forEach((qData, index) => {
                const card = document.createElement("div");
                card.className = "quiz-card";
                card.id = `question-card-${index}`;

                const qNum = document.createElement("div");
                qNum.className = "question-number";
                qNum.innerText = `Question ${index + 1} of ${quizData.length}`;

                const qText = document.createElement("div");
                qText.className = "question-text";
                qText.innerText = qData.q;

                const optionsGrid = document.createElement("div");
                optionsGrid.className = "options-grid";

                qData.options.forEach((optText, optIndex) => {
                    const btn = document.createElement("button");
                    btn.className = "option-btn";
                    btn.id = `btn-${index}-${optIndex}`;
                    btn.innerText = `${String.fromCharCode(65 + optIndex)}) ${optText}`;
                    btn.onclick = () => handleAnswer(index, optIndex);
                    optionsGrid.appendChild(btn);
                });

                const expBox = document.createElement("div");
                expBox.className = "explanation-box";
                expBox.id = `exp-${index}`;
                expBox.innerHTML = `<div class="explanation-title">Explanation & Context:</div>${qData.exp}`;

                card.appendChild(qNum);
                card.appendChild(qText);
                card.appendChild(optionsGrid);
                card.appendChild(expBox);

                container.appendChild(card);
            });
        }

        // Handle User Selection
        function handleAnswer(questionIndex, selectedOptionIndex) {
            if (userAnswers[questionIndex] !== undefined) return; // Prevent double clicking

            userAnswers[questionIndex] = selectedOptionIndex;
            const qData = quizData[questionIndex];
            const isCorrect = selectedOptionIndex === qData.correct;

            if (isCorrect) score++;

            // Lock all option buttons for this question
            qData.options.forEach((_, optIndex) => {
                const btn = document.getElementById(`btn-${questionIndex}-${optIndex}`);
                btn.disabled = true;
                if (optIndex === qData.correct) {
                    btn.classList.add("correct");
                } else if (optIndex === selectedOptionIndex && !isCorrect) {
                    btn.classList.add("incorrect");
                }
            });

            // Reveal Explanation
            document.getElementById(`exp-${questionIndex}`).style.display = "block";

            // Update Progress Header
            updateHeader();

            // Check if Quiz Complete
            if (Object.keys(userAnswers).length === quizData.length) {
                showSummary();
            }
        }

        // Update Header Status
        function updateHeader() {
            const answeredCount = Object.keys(userAnswers).length;
            const total = quizData.length;
            const percentage = total > 0 ? Math.round((score / total) * 100) : 0;

            document.getElementById("score-display").innerText = `Score: ${score} / ${answeredCount} (${percentage}%)`;
            
            const progressPercent = (answeredCount / total) * 100;
            document.getElementById("progress-bar").style.width = `${progressPercent}%`;
        }

        // Display Final Summary
        function showSummary() {
            const total = quizData.length;
            const percentage = Math.round((score / total) * 100);

            document.getElementById("final-score-text").innerText = `${percentage}% (${score}/${total})`;

            let feedback = "";
            if (percentage >= 90) {
                feedback = "Outstanding Mastery! You have exceptional recall of Transversospinalis attachments, segment spans, and innervation nuances.";
            } else if (percentage >= 75) {
                feedback = "Great Performance! Review the missed explanations and Anki deck to solidify the finer board exceptions.";
            } else if (percentage >= 60) {
                feedback = "Solid Foundation. Focus on segment spanning rules (Rotatores vs. Multifidus vs. Semispinalis) and Intertransversarii innervation.";
            } else {
                feedback = "Keep Practicing! Review the Week 3 notes and audio transcript, then run through the Anki deck before retaking.";
            }

            document.getElementById("final-feedback-text").innerText = feedback;
            document.getElementById("summary-card").style.display = "block";

            // Scroll to summary card
            document.getElementById("summary-card").scrollIntoView({ behavior: 'smooth' });
        }

        // Run on load
        window.onload = initQuiz;
    </script>
</body>
