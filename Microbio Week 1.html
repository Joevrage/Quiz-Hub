<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Microbiology Quiz 1 Material Review</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --primary-accent: #ff9900;
            --correct-color: #10b981;
            --correct-bg: #064e3b;
            --incorrect-color: #ef4444;
            --incorrect-bg: #7f1d1d;
            --border-color: #333333;
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.5);
            --shadow-md: 0 4px 10px rgba(0,0,0,0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.5;
            padding-bottom: 40px;
        }

        .header-sticky {
            position: -webkit-sticky;
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: var(--card-bg);
            border-bottom: 2px solid var(--primary-accent);
            padding: 12px 20px;
            box-shadow: var(--shadow-sm);
        }

        .header-container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary-accent);
        }

        .score-box {
            font-size: 1rem;
            font-weight: 600;
            background-color: #262626;
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background-color: var(--border-color);
            position: absolute;
            bottom: 0;
            left: 0;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background-color: var(--primary-accent);
            transition: width 0.3s ease;
        }

        .quiz-container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 16px;
        }

        .question-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }

        .question-header {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--primary-accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 18px;
            color: var(--text-primary);
        }

        .options-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            width: 100%;
            text-align: left;
            padding: 14px 16px;
            font-size: 0.95rem;
            color: var(--text-primary);
            background-color: #262626;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary-accent);
            background-color: #333333;
        }

        .option-btn:disabled {
            cursor: default;
        }

        .option-btn.correct-choice {
            background-color: var(--correct-bg) !important;
            border-color: var(--correct-color) !important;
            color: #ffffff !important;
            font-weight: 600;
        }

        .option-btn.incorrect-choice {
            background-color: var(--incorrect-bg) !important;
            border-color: var(--incorrect-color) !important;
            color: #ffffff !important;
            font-weight: 600;
        }

        .option-btn.dimmed {
            opacity: 0.4;
        }

        .explanation-box {
            margin-top: 16px;
            padding: 14px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            line-height: 1.5;
            display: none;
        }

        .explanation-box.visible {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .explanation-box.correct {
            background-color: var(--correct-bg);
            border-left: 4px solid var(--correct-color);
            color: #d1fae5;
        }

        .explanation-box.incorrect {
            background-color: var(--incorrect-bg);
            border-left: 4px solid var(--incorrect-color);
            color: #fee2e2;
        }

        .summary-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--primary-accent);
            display: none;
        }

        .summary-card.visible {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        .summary-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .summary-score {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--primary-accent);
            margin-bottom: 16px;
        }

        .summary-text {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .reset-btn {
            background-color: var(--primary-accent);
            color: #000000;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .reset-btn:hover {
            background-color: #e68a00;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="header-sticky">
        <div class="header-container">
            <div class="header-title">Microbiology: Quiz 1 Material Review</div>
            <div class="score-box" id="scoreDisplay">Score: 0 / 30 (0%)</div>
        </div>
        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progressBar"></div>
        </div>
    </div>

    <div class="quiz-container" id="quizContainer"></div>

    <div class="quiz-container">
        <div class="summary-card" id="summaryCard">
            <div class="summary-title" id="summaryTitle">Quiz Completed!</div>
            <div class="summary-score" id="finalScore">0 / 30</div>
            <div class="summary-text" id="summaryFeedback">Here is your performance breakdown.</div>
            <button class="reset-btn" onclick="resetQuiz()">Retake Quiz</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                question: "Which category of bacteria contains all organisms of medical importance?",
                options: ["Archaea", "Eubacteria", "Eukaryotes", "Prions"],
                correct: 1,
                explanation: "Eubacteria (often referred to simply as bacteria) includes all bacteria of medical importance[cite: 1, 3]. Archaea are distinct organisms[cite: 1, 3]."
            },
            {
                question: "What unit of measurement is specifically used when measuring viruses compared to bacteria?",
                options: ["Viruses = Micrometer (μm); Bacteria = Nanometer (nm)", "Viruses = Nanometer (nm); Bacteria = Micrometer (μm)", "Both are measured exclusively in millimeters", "Viruses = Picometers; Bacteria = Angstroms"],
                correct: 1,
                explanation: "Viruses are measured in nanometers (10–250 nm), while bacteria are measured in micrometers (0.2–5 μm)[cite: 1, 3]."
            },
            {
                question: "What is the typical size range of most bacteria compared to a human Red Blood Cell (RBC)?",
                options: ["Bacteria: 0.2–5 μm; RBC: 7–10 μm", "Bacteria: 10–25 μm; RBC: 2–5 μm", "Bacteria: 100–200 nm; RBC: 1–2 μm", "Bacteria: 7–10 μm; RBC: 0.2–5 μm"],
                correct: 0,
                explanation: "Bacteria typically range from 0.2 to 5 μm in size[cite: 1, 3], making them smaller than human red blood cells, which average 7 to 10 μm[cite: 1, 3]."
            },
            {
                question: "Which historical figure disproved spontaneous generation for maggots on decaying meat?",
                options: ["Louis Pasteur", "Francesco Redi", "Anton von Leeuwenhoek", "Robert Koch"],
                correct: 1,
                explanation: "Francesco Redi performed the early experiment disproving abiogenesis for maggots using covered/uncovered meat jars[cite: 1, 3]."
            },
            {
                question: "Which scientist disproved abiogenesis for microorganisms using swan-necked flasks?",
                options: ["Anton von Leeuwenhoek", "Francesco Redi", "Louis Pasteur", "Robert Hooke"],
                correct: 2,
                explanation: "Louis Pasteur disproved spontaneous generation for microbes using swan-necked flask experiments[cite: 1, 3]."
            },
            {
                question: "What is the fundamental difference between Abiogenesis and Biogenesis?",
                options: ["Abiogenesis states life comes from pre-existing life; Biogenesis claims life arises from non-living matter", "Abiogenesis claims living things arise from non-living matter/vital forces; Biogenesis states living things arise only from others of their same kind", "Abiogenesis applies only to viruses; Biogenesis applies to bacteria", "Abiogenesis refers to chemical disinfection; Biogenesis refers to sterilization"],
                correct: 1,
                explanation: "Abiogenesis claims living things arise from non-living matter via vital forces, whereas Biogenesis states living things arise only from pre-existing living organisms[cite: 1, 3]."
            },
            {
                question: "Who was the first person to observe live bacteria and protozoa using high-quality single-lens microscopes?",
                options: ["Louis Pasteur", "Francesco Redi", "Anton von Leeuwenhoek", "Robert Koch"],
                correct: 2,
                explanation: "Anton von Leeuwenhoek observed living bacteria and protozoa for the first time[cite: 1, 3]."
            },
            {
                question: "What primary structural feature differentiates prokaryotes from eukaryotes?",
                options: ["Prokaryotes have membrane-bound organelles", "Prokaryotes lack a nucleus", "Eukaryotes lack ribosomes", "Prokaryotes contain linear chromosomes wrapped in histones"],
                correct: 1,
                explanation: "Prokaryotes lack a membrane-bound nucleus, whereas eukaryotes possess a nucleus[cite: 1, 3]."
            },
            {
                question: "Which lipid component is present in eukaryotic plasma membranes to maintain structural integrity but is absent in most prokaryotic plasma membranes?",
                options: ["Phospholipid bilayer", "Sterols (e.g., cholesterol)", "Integral proteins", "Peripheral proteins"],
                correct: 1,
                explanation: "Most prokaryotes lack sterols in their plasma membranes, whereas eukaryotic plasma membranes contain sterols such as cholesterol[cite: 1, 4]."
            },
            {
                question: "What is the size composition of prokaryotic cytoplasmic ribosomes compared to eukaryotic cytoplasmic ribosomes?",
                options: ["Prokaryotes = 80S; Eukaryotes = 70S", "Prokaryotes = 70S; Eukaryotes = 80S", "Prokaryotes = 50S; Eukaryotes = 30S", "Prokaryotes = 60S; Eukaryotes = 40S"],
                correct: 1,
                explanation: "Prokaryotes possess 70S ribosomes, whereas eukaryotic cytoplasmic ribosomes are 80S[cite: 1, 3]."
            },
            {
                question: "Which term is defined as the complete destruction or removal of ALL viable microorganisms, including endospores and viruses?",
                options: ["Disinfection", "Sterilization", "Bacteriostasis", "Sanitization"],
                correct: 1,
                explanation: "Sterilization refers to the total destruction or removal of all viable microbial life, including spores and viruses[cite: 5]."
            },
            {
                question: "An 'opportunistic pathogen' is best defined as a microbe that:",
                options: ["Causes severe disease in individuals with healthy, normal immune defenses", "Causes disease when host defenses are compromised or when established outside its normal habitat", "Is completely incapable of causing infection under any condition", "Spreads exclusively via insect vectors"],
                correct: 1,
                explanation: "Opportunistic pathogens cause disease when host immune defenses are compromised or when established outside their normal anatomical habitat[cite: 5]."
            },
            {
                question: "What is the relationship between Pathogenicity and Virulence?",
                options: ["Pathogenicity is the degree of damage, while virulence is the capability to cause disease", "Pathogenicity is the ability to cause harm, while virulence is the degree or severity of pathogenicity", "Pathogenicity applies only to viruses, while virulence applies only to bacteria", "Pathogenicity is quantitative, while virulence is qualitative"],
                correct: 1,
                explanation: "Pathogenicity is the qualitative ability to cause disease, whereas virulence refers to the degree or intensity of pathogenicity[cite: 5]."
            },
            {
                question: "Most bacteria that possess flagella exhibit which cell shape?",
                options: ["Cocci (spherical)", "Rods (bacilli)", "Spirochetes (corkscrew)", "Spirilla (rigid helix)"],
                correct: 1,
                explanation: "Most bacteria that possess flagella are rod-shaped[cite: 1, 3]."
            },
            {
                question: "What three basic components form the physical structure of a bacterial flagellum?",
                options: ["Capsule, Slime layer, Peptidoglycan", "Filament, Hook, Basal Body", "Pilus, Fimbriae, Flagellin", "Outer membrane, Periplasm, Plasma membrane"],
                correct: 1,
                explanation: "A flagellum consists of the filament (flagellin), hook ('universal joint'), and basal body (anchor)[cite: 1, 3]."
            },
            {
                question: "What powers the rotation of bacterial flagella?",
                options: ["Direct ATP hydrolysis via ATPase", "Proton Motive Force (H+) generated by the Electron Transport Chain driving Mot proteins", "GTP consumption in the cytoplasm", "Passive diffusion of sodium ions"],
                correct: 1,
                explanation: "Flagellar rotation is powered by the Proton Motive Force (H+) generated by the ETC, with protons moving through Mot (motion) proteins[cite: 1, 3]."
            },
            {
                question: "Which flagellar arrangement features a cluster of multiple flagella located at only ONE pole of the cell?",
                options: ["Monotrichous", "Lophotrichous", "Amphitrichous", "Peritrichous"],
                correct: 1,
                explanation: "Lophotrichous describes a cluster or tuft of flagella on one end. Monotrichous = single; Amphitrichous = one on both ends; Peritrichous = all around[cite: 1, 3]."
            },
            {
                question: "During flagellar movement, what rotation direction produces a smooth 'run' versus a 'tumble'?",
                options: ["Run = Clockwise; Tumble = Counterclockwise", "Run = Counterclockwise; Tumble = Clockwise", "Run = Side-to-side; Tumble = Stationary", "Run = Linear; Tumble = Circular"],
                correct: 1,
                explanation: "Counterclockwise rotation produces a smooth forward run, whereas clockwise rotation causes tumbles[cite: 1, 3]."
            },
            {
                question: "How does a bacterium alter its movement behavior when navigating a REPELLENT concentration gradient?",
                options: ["Tumbles less, moving up the gradient slowly", "Tumbles more often, moving down the gradient at INCREASED speeds", "Stops moving entirely to conserve ATP", "Moves in a perfectly straight line toward the repellent"],
                correct: 1,
                explanation: "In a repellent gradient, bacteria tumble more frequently and move rapidly down the gradient to escape[cite: 1, 3]."
            },
            {
                question: "How does a bacterium adapt its movement behavior when navigating an ATTRACTANT concentration gradient?",
                options: ["Tumbles less, moving up the gradient at SLOWER speeds", "Tumbles more, moving down the gradient rapidly", "Moves in random directions at max speed", "Rotates clockwise continuously"],
                correct: 0,
                explanation: "In an attractant gradient, the bacterium tumbles less, performs longer runs up the gradient, and moves slowly[cite: 1, 3]."
            },
            {
                question: "Why is the protein flagellin classified as a Pathogen-Associated Molecular Pattern (PAMP or MAMP)?",
                options: ["Because it is a host cell protein stolen by bacteria", "Because flagellin is a conserved bacterial protein recognized by host immune cells (e.g., macrophages) to trigger innate responses like fever and inflammation", "Because it directly degrades host white blood cells", "Because it prevents phagocytosis"],
                correct: 1,
                explanation: "Flagellin is a conserved microbial protein absent in human cells. Host macrophages recognize flagellin as a PAMP/MAMP to trigger innate immune responses like inflammation, fever, and phagocytosis[cite: 1, 3]."
            },
            {
                question: "Axial filaments (endoflagella) are internal flagella located between the cell wall and outer membrane that produce undulating motility in which group of bacteria?",
                options: ["Gram-positive cocci", "Spirochetes", "Acid-fast bacilli", "Mycoplasmas"],
                correct: 1,
                explanation: "Axial filaments (endoflagella) are internal flagella located in the periplasmic space, found specifically in spirochetes[cite: 1, 3]."
            },
            {
                question: "From which cellular structure do bacterial pili and fimbriae originate?",
                options: ["Outer membrane", "Peptidoglycan cell wall", "Cytoplasmic (plasma) membrane", "Capsule"],
                correct: 2,
                explanation: "Non-motile appendages (pili and fimbriae) originate directly from the cytoplasmic membrane[cite: 1, 3]."
            },
            {
                question: "How do short pili (fimbriae) enable bacterial adhesion to host cells despite both cells carrying negative surface charges?",
                options: ["By neutralizing the host's nuclear membrane", "By overcoming electrostatic repulsion to bind host cells before depolymerizing to allow permanent cell wall/capsule attachment", "By secreting exotoxins that dissolve the host plasma membrane", "By wrapping around the host cell using axial filaments"],
                correct: 1,
                explanation: "Both bacteria and host cells carry negative surface charges. Short pili overcome electrostatic repulsion to bind host cells, then depolymerize so the cell wall/capsule can establish permanent attachments and resist flushing[cite: 1, 3]."
            },
            {
                question: "What is the primary function of long pili (sex pili or F pili)?",
                options: ["Active swimming locomotion", "Conjugation (direct transfer of plasmid DNA between bacterial cells)", "Phagocytosis inhibition", "Dehydration protection"],
                correct: 1,
                explanation: "Long pili (sex/F pili) mediate bacterial conjugation (the transfer of plasmid DNA between cells)[cite: 1, 3]."
            },
            {
                question: "What primary advantage does the loose polysaccharide slime layer provide to a bacterial cell?",
                options: ["Active swimming movement", "Protection from dehydration and nutrient loss, as well as serving in adhesion", "Direct horizontal gene transfer", "Complete resistance to autoclaving"],
                correct: 1,
                explanation: "The slime layer is a loose shield that protects the cell from dehydration and loss of nutrients, while also assisting in adhesion[cite: 1, 3]."
            },
            {
                question: "How does a bacterial capsule function as a virulence factor?",
                options: ["It destroys host red blood cells via hemolysins", "It limits or prevents phagocytic immune cells from engulfing the bacteria", "It allows bacteria to undergo binary fission twice as fast", "It produces high-energy ATP through photosynthesis"],
                correct: 1,
                explanation: "Capsules serve as a major virulence factor by preventing phagocytes (like macrophages) from engulfing and destroying the bacterial cell[cite: 1]."
            },
            {
                question: "Which statement correctly describes bacterial genetic material and plasmids?",
                options: ["Bacterial genomes are diploid; plasmids are essential for cell survival", "Bacterial genomes are haploid double-stranded DNA; plasmids exist independently, carry non-essential favorable traits, and are non-functional on their own", "Bacterial chromosomes are strictly linear; plasmids contain all essential survival genes", "Plasmids are located inside the bacterial nucleus"],
                correct: 1,
                explanation: "Bacterial DNA is haploid (single set) double-stranded DNA. Plasmids are non-essential extra-chromosomal DNA circles carrying favorable traits (e.g., antibiotic resistance) but are non-functional on their own without the chromosome[cite: 1, 4]."
            },
            {
                question: "What is the function of the prokaryotic actin cytoskeleton?",
                options: ["Synthesizing ribosomes and proteins", "Defining cell shape and helping maintain cell shape during cell enlargement and division", "Generating ATP via oxidative phosphorylation", "Propelling the cell forward via runs and tumbles"],
                correct: 1,
                explanation: "Prokaryotic actin filaments curl within the cell body to define cell shape and maintain structural integrity during cell division and enlargement[cite: 1]."
            },
            {
                question: "Which genus of endospore-forming bacteria is a notable Gram-negative exception?",
                options: ["Bacillus", "Clostridium", "Coxiella", "Sporosarcina"],
                correct: 2,
                explanation: "While endospore formation is mostly seen in Gram-positive genera like Bacillus, Clostridium, and Sporosarcina, Coxiella is the notable Gram-negative spore-forming genus[cite: 1]."
            }
        ];

        let currentAnswers = new Array(questions.length).fill(null);

        function renderQuiz() {
            const container = document.getElementById('quizContainer');
            container.innerHTML = '';

            questions.forEach((q, index) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `q-card-${index}`;

                let optionsHTML = '';
                q.options.forEach((opt, optIdx) => {
                    optionsHTML += `
                        <button class="option-btn" 
                                id="btn-${index}-${optIdx}" 
                                onclick="selectOption(${index}, ${optIdx})">
                            ${String.fromCharCode(65 + optIdx)}. ${opt}
                        </button>
                    `;
                });

                card.innerHTML = `
                    <div class="question-header">Question ${index + 1} of ${questions.length}</div>
                    <div class="question-text">${q.question}</div>
                    <div class="options-list">${optionsHTML}</div>
                    <div class="explanation-box" id="exp-${index}"></div>
                `;

                container.appendChild(card);
            });
        }

        function selectOption(qIdx, selectedOptIdx) {
            if (currentAnswers[qIdx] !== null) return;

            currentAnswers[qIdx] = selectedOptIdx;
            const q = questions[qIdx];
            const isCorrect = selectedOptIdx === q.correct;

            q.options.forEach((_, optIdx) => {
                const btn = document.getElementById(`btn-${qIdx}-${optIdx}`);
                btn.disabled = true;

                if (optIdx === q.correct) {
                    btn.classList.add('correct-choice');
                } else if (optIdx === selectedOptIdx) {
                    btn.classList.add('incorrect-choice');
                } else {
                    btn.classList.add('dimmed');
                }
            });

            const expBox = document.getElementById(`exp-${qIdx}`);
            expBox.classList.add('visible', isCorrect ? 'correct' : 'incorrect');
            expBox.innerHTML = `<strong>${isCorrect ? '✓ Correct' : '✗ Incorrect'}</strong><br>${q.explanation}`;

            updateScore();
        }

        function updateScore() {
            const answeredCount = currentAnswers.filter(a => a !== null).length;
            const correctCount = currentAnswers.reduce((acc, ans, idx) => {
                return ans === questions[idx].correct ? acc + 1 : acc;
            }, 0);

            const percentage = Math.round((correctCount / questions.length) * 100);
            
            document.getElementById('scoreDisplay').innerText = `Score: ${correctCount} / ${questions.length} (${percentage}%)`;
            document.getElementById('progressBar').style.width = `${(answeredCount / questions.length) * 100}%`;

            if (answeredCount === questions.length) {
                showSummary(correctCount, percentage);
            }
        }

        function showSummary(correctCount, percentage) {
            const summaryCard = document.getElementById('summaryCard');
            const finalScore = document.getElementById('finalScore');
            const feedback = document.getElementById('summaryFeedback');

            finalScore.innerText = `${correctCount} / ${questions.length} (${percentage}%)`;

            if (percentage >= 90) {
                feedback.innerText = "Excellent! You have thoroughly mastered all Quiz 1 material up through Endospores.";
            } else if (percentage >= 75) {
                feedback.innerText = "Solid job! Double check pili mechanisms and flagellar power sources before taking Quiz 1.";
            } else {
                feedback.innerText = "Good practice run. Review the Quiz 1 material up through endospores and retake the quiz!";
            }

            summaryCard.classList.add('visible');
            summaryCard.scrollIntoView({ behavior: 'smooth' });
        }

        function resetQuiz() {
            currentAnswers = new Array(questions.length).fill(null);
            document.getElementById('summaryCard').classList.remove('visible');
            document.getElementById('scoreDisplay').innerText = `Score: 0 / ${questions.length} (0%)`;
            document.getElementById('progressBar').style.width = '0%';
            renderQuiz();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.onload = renderQuiz;
    </script>
</body>
</html>
