<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Microbiology Quiz 1 Practice Review</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --primary-accent: #ff9900;
            --correct-color: #10b981;
            --correct-bg: #064e3b;
            --incorrect-color: #ef4444;
            --incorrect-bg: #7f1d1d;
            --border-color: #333333;
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.5);
            --shadow-md: 0 4px 10px rgba(0,0,0,0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.5;
            padding-bottom: 40px;
        }

        .header-sticky {
            position: -webkit-sticky;
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: var(--card-bg);
            border-bottom: 2px solid var(--primary-accent);
            padding: 12px 20px;
            box-shadow: var(--shadow-sm);
        }

        .header-container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary-accent);
        }

        .score-box {
            font-size: 1rem;
            font-weight: 600;
            background-color: #262626;
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background-color: var(--border-color);
            position: absolute;
            bottom: 0;
            left: 0;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background-color: var(--primary-accent);
            transition: width 0.3s ease;
        }

        .quiz-container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 16px;
        }

        .question-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }

        .question-header {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--primary-accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 18px;
            color: var(--text-primary);
        }

        .options-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            width: 100%;
            text-align: left;
            padding: 14px 16px;
            font-size: 0.95rem;
            color: var(--text-primary);
            background-color: #262626;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary-accent);
            background-color: #333333;
        }

        .option-btn:disabled {
            cursor: default;
        }

        .option-btn.correct-choice {
            background-color: var(--correct-bg) !important;
            border-color: var(--correct-color) !important;
            color: #ffffff !important;
            font-weight: 600;
        }

        .option-btn.incorrect-choice {
            background-color: var(--incorrect-bg) !important;
            border-color: var(--incorrect-color) !important;
            color: #ffffff !important;
            font-weight: 600;
        }

        .option-btn.dimmed {
            opacity: 0.4;
        }

        .explanation-box {
            margin-top: 16px;
            padding: 14px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            line-height: 1.5;
            display: none;
        }

        .explanation-box.visible {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .explanation-box.correct {
            background-color: var(--correct-bg);
            border-left: 4px solid var(--correct-color);
            color: #d1fae5;
        }

        .explanation-box.incorrect {
            background-color: var(--incorrect-bg);
            border-left: 4px solid var(--incorrect-color);
            color: #fee2e2;
        }

        .summary-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--primary-accent);
            display: none;
        }

        .summary-card.visible {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        .summary-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .summary-score {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--primary-accent);
            margin-bottom: 16px;
        }

        .summary-text {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .reset-btn {
            background-color: var(--primary-accent);
            color: #000000;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .reset-btn:hover {
            background-color: #e68a00;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="header-sticky">
        <div class="header-container">
            <div class="header-title">Microbiology: Quiz 1 Material Review</div>
            <div class="score-box" id="scoreDisplay">Score: 0 / 25 (0%)</div>
        </div>
        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progressBar"></div>
        </div>
    </div>

    <div class="quiz-container" id="quizContainer"></div>

    <div class="quiz-container">
        <div class="summary-card" id="summaryCard">
            <div class="summary-title" id="summaryTitle">Quiz Completed!</div>
            <div class="summary-score" id="finalScore">0 / 25</div>
            <div class="summary-text" id="summaryFeedback">Here is your performance breakdown.</div>
            <button class="reset-btn" onclick="resetQuiz()">Retake Quiz</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                question: "Which category of bacteria contains all organisms of medical importance?",
                options: ["Archaea", "Eubacteria", "Eukaryotes", "Prions"],
                correct: 1,
                explanation: "Eubacteria (often referred to simply as bacteria) includes all bacteria of medical importance[cite: 1, 2, 4]. Archaea are evolutionarily distinct organisms[cite: 1, 2, 4]."
            },
            {
                question: "What unit of measurement is specifically used when measuring viruses compared to bacteria, fungi, and helminths?",
                options: ["Viruses = Micrometer (μm); Bacteria = Nanometer (nm)", "Viruses = Nanometer (nm); Bacteria = Micrometer (μm)", "Both are measured exclusively in millimeters", "Viruses = Picometers; Bacteria = Angstroms"],
                correct: 1,
                explanation: "Viruses are measured in nanometers (10–250 nm), while bacteria, fungi, and worms are measured in micrometers (0.2–5 μm for bacteria)[cite: 1, 4, 7]."
            },
            {
                question: "What is the typical size range of most bacteria compared to a human Red Blood Cell (RBC)?",
                options: ["Bacteria: 0.2–5 μm; RBC: 7–10 μm", "Bacteria: 10–25 μm; RBC: 2–5 μm", "Bacteria: 100–200 nm; RBC: 1–2 μm", "Bacteria: 7–10 μm; RBC: 0.2–5 μm"],
                correct: 0,
                explanation: "Bacteria typically range from 0.2 to 5 μm in size[cite: 1, 4, 7], making them smaller than human red blood cells, which average 7 to 10 μm[cite: 1, 4]."
            },
            {
                question: "Which historical figure provided early experimental evidence against spontaneous generation by showing that maggots do not arise spontaneously from decaying meat?",
                options: ["Louis Pasteur", "Francesco Redi", "Anton von Leeuwenhoek", "Robert Koch"],
                correct: 1,
                explanation: "Francesco Redi (1668) performed one of history's first biological experiments using open and covered jars of meat to demonstrate that maggots (fly larvae) do not spontaneously generate[cite: 1, 6]."
            },
            {
                question: "Which scientist disproved spontaneous generation (abiogenesis) for microorganisms using swan-necked flasks and developed early pasteurization?",
                options: ["Anton von Leeuwenhoek", "Francesco Redi", "Louis Pasteur", "Robert Hooke"],
                correct: 2,
                explanation: "Louis Pasteur disproved spontaneous generation for microbes using swan-necked flask experiments and contributed to early vaccines and pasteurization[cite: 1]."
            },
            {
                question: "What is the fundamental difference between Abiogenesis and Biogenesis?",
                options: ["Abiogenesis states life comes from pre-existing life; Biogenesis claims life arises from non-living matter", "Abiogenesis claims living things arise from non-living matter/vital forces; Biogenesis states living things arise only from others of their same kind", "Abiogenesis applies only to viruses; Biogenesis applies to bacteria", "Abiogenesis refers to chemical disinfection; Biogenesis refers to sterilization"],
                correct: 1,
                explanation: "Abiogenesis (spontaneous generation) claims living things arise from non-living matter via vital forces, whereas Biogenesis states living things arise only from others of their same kind[cite: 1, 6, 7]."
            },
            {
                question: "Who is credited with inventing single-lens microscopes and being the first person to observe live bacteria and protozoa?",
                options: ["Louis Pasteur", "Francesco Redi", "Anton von Leeuwenhoek", "Robert Koch"],
                correct: 2,
                explanation: "Anton von Leeuwenhoek is known as the 'Father of Microbiology' for grinding high-quality lenses to observe living bacteria and protozoa for the first time[cite: 1, 6, 7]."
            },
            {
                question: "What primary structural feature differentiates prokaryotes from eukaryotes?",
                options: ["Prokaryotes have membrane-bound organelles", "Prokaryotes lack a nucleus", "Eukaryotes lack ribosomes", "Prokaryotes contain linear chromosomes wrapped in histones"],
                correct: 1,
                explanation: "Prokaryotes are defined as organisms without a membrane-bound nucleus, whereas eukaryotic cells possess a nucleus[cite: 1, 2, 4, 6, 7]."
            },
            {
                question: "Which lipid component is present in eukaryotic plasma membranes to maintain structural integrity but is absent in most prokaryotic plasma membranes?",
                options: ["Phospholipid bilayer", "Sterols (e.g., cholesterol)", "Integral proteins", "Peripheral proteins"],
                correct: 1,
                explanation: "Most prokaryotes lack sterols in their plasma membranes, whereas eukaryotic plasma membranes contain sterols such as cholesterol[cite: 1, 6]."
            },
            {
                question: "What is the size composition of prokaryotic ribosomes compared to eukaryotic cytoplasmic ribosomes?",
                options: ["Prokaryotes = 80S; Eukaryotes = 70S", "Prokaryotes = 70S; Eukaryotes = 80S", "Prokaryotes = 50S; Eukaryotes = 30S", "Prokaryotes = 60S; Eukaryotes = 40S"],
                correct: 1,
                explanation: "Prokaryotes possess 70S ribosomes, whereas eukaryotic cytoplasmic ribosomes are 80S (organellar ribosomes are 70S)[cite: 1, 6]."
            },
            {
                question: "Which medical term is defined as the complete removal or destruction of ALL viable microorganisms, including bacterial endospores and viruses?",
                options: ["Disinfection", "Sterilization", "Bacteriostasis", "Sanitization"],
                correct: 1,
                explanation: "Sterilization refers to the total destruction or removal of all viable microbial life, including spores and viruses[cite: 7]."
            },
            {
                question: "An 'opportunistic pathogen' is best defined as a microbe that:",
                options: ["Causes severe disease in individuals with healthy, normal immune defenses", "Causes disease when host defenses are compromised or when established outside its normal habitat", "Is completely incapable of causing infection under any condition", "Spreads exclusively via insect vectors"],
                correct: 1,
                explanation: "Opportunistic pathogens cause disease when host immune defenses are compromised or when established outside their normal anatomical habitat[cite: 7]."
            },
            {
                question: "What is the relationship between Pathogenicity and Virulence?",
                options: ["Pathogenicity is the degree of damage, while virulence is the capability to cause disease", "Pathogenicity is the ability to cause harm, while virulence is the degree or severity of pathogenicity", "Pathogenicity applies only to viruses, while virulence applies only to bacteria", "Pathogenicity is quantitative, while virulence is qualitative"],
                correct: 1,
                explanation: "Pathogenicity is the ability to cause disease/harm, whereas virulence refers to the degree or intensity of pathogenicity[cite: 7]."
            },
            {
                question: "Which flagellar arrangement consists of a tuft or cluster of multiple flagella located at only ONE pole of the cell?",
                options: ["Monotrichous", "Lophotrichous", "Amphitrichous", "Peritrichous"],
                correct: 1,
                explanation: "Lophotrichous describes a cluster or tuft of flagella on one end. Monotrichous = single flagellum; Amphitrichous = flagella at both ends; Peritrichous = flagella all around[cite: 2, 4]."
            },
            {
                question: "Bacterial motility consists of 'runs' and 'tumbles'. What rotation direction of the flagellum produces a 'run'?",
                options: ["Clockwise rotation", "Counterclockwise rotation", "Side-to-side oscillation", "Stationary spinning"],
                correct: 1,
                explanation: "Counterclockwise flagellar rotation produces a smooth, forward 'run', whereas clockwise rotation causes 'tumbles'[cite: 4]."
            },
            {
                question: "How does a bacterium adapt its movement behavior when navigating a REPELLENT concentration gradient?",
                options: ["Tumbles less, moving up the gradient slowly", "Tumbles more often, moving down the gradient at INCREASED speeds", "Stops moving entirely to conserve ATP", "Moves in a perfectly straight line toward the repellent"],
                correct: 1,
                explanation: "In a repellent gradient, bacteria tumble more frequently and move rapidly down the concentration gradient to move away from the harmful stimulus[cite: 4]."
            },
            {
                question: "How does a bacterium adapt its movement behavior when navigating an ATTRACTANT concentration gradient?",
                options: ["Tumbles less, moving up the gradient at SLOWER speeds", "Tumbles more, moving down the gradient rapidly", "Moves in random directions at max speed", "Rotates clockwise continuously"],
                correct: 0,
                explanation: "In an attractant gradient, the bacterium tumbles less and moves slowly up the concentration gradient[cite: 4]."
            },
            {
                question: "When NO chemical gradient (neither attractant nor repellent) is present in the environment, how does a bacterium move?",
                options: ["In a straight line indefinitely", "In random directions with equal runs and tumbles", "Remains completely motionless", "Tumbles continuously without running"],
                correct: 1,
                explanation: "Without a chemical gradient, bacterial movement orientation is completely random, alternating between runs and tumbles."
            },
            {
                question: "Why is the protein flagellin classified as a Pathogen-Associated Molecular Pattern (PAMP or MAMP)?",
                options: ["Because it is a host cell protein stolen by bacteria", "Because flagellin is a conserved microbial protein recognized by host immune cells to trigger innate responses", "Because it directly degrades host white blood cells", "Because it prevents phagocytosis"],
                correct: 1,
                explanation: "Flagellin is a conserved bacterial protein absent in human cells. Host immune cells recognize flagellin as a PAMP/MAMP to activate innate immune defenses[cite: 4]."
            },
            {
                question: "Axial filaments (endoflagella) produce a corkscrew/undulating motility and are located in the periplasmic space of which group of bacteria?",
                options: ["Gram-positive cocci", "Spirochetes", "Acid-fast bacilli", "Mycoplasmas"],
                correct: 1,
                explanation: "Axial filaments (endoflagella) are internal flagella located between the cell wall and outer membrane, found specifically in spirochetes[cite: 2, 3, 4]."
            },
            {
                question: "What are the two structural layers that make up the bacterial glycocalyx?",
                options: ["Peptidoglycan layer and Outer membrane", "Capsule and Slime layer", "Lipid A and O-antigen", "Plasma membrane and Cell wall"],
                correct: 1,
                explanation: "The glycocalyx consists of two structural categories: Capsule and Slime layer[cite: 2, 4, 5]."
            },
            {
                question: "Which bacterial appendage is primarily responsible for conjugation (the transfer of plasmid DNA between bacterial cells)?",
                options: ["Flagella", "Fimbriae", "Sex Pilus", "Endoflagella"],
                correct: 2,
                explanation: "Long pili (sex pili / F pili) mediate bacterial conjugation (transfer of DNA), while short pili/fimbriae function primarily in attachment[cite: 2, 4, 5]."
            },
            {
                question: "What is the primary structural polysaccharide polymer composing the cell wall of Eubacteria?",
                options: ["Chitin", "Cellulose", "Peptidoglycan", "Pseudomurein"],
                correct: 2,
                explanation: "The cell walls of prokaryotic eubacteria typically contain peptidoglycan[cite: 1, 5, 6]."
            },
            {
                question: "What is the primary functional purpose of bacterial endospores?",
                options: ["Cellular reproduction and population expansion", "Survival under extreme/harsh environmental conditions", "Active locomotion toward nutrient sources", "Horizontal gene transfer"],
                correct: 1,
                explanation: "Bacterial endospores are dormant structures formed inside the cell specifically for survival under hostile conditions, not for reproduction[cite: 2, 3]."
            },
            {
                question: "Which endospore-forming genus is a notable Gram-negative exception?",
                options: ["Bacillus", "Clostridium", "Coxiella", "Staphylococcus"],
                correct: 2,
                explanation: "While most spore-producing bacteria are Gram-positive (such as Bacillus and Clostridium), Coxiella is the only Gram-negative genus mentioned that forms endospores[cite: 2, 3]."
            }
        ];

        let currentAnswers = new Array(questions.length).fill(null);

        function renderQuiz() {
            const container = document.getElementById('quizContainer');
            container.innerHTML = '';

            questions.forEach((q, index) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `q-card-${index}`;

                let optionsHTML = '';
                q.options.forEach((opt, optIdx) => {
                    optionsHTML += `
                        <button class="option-btn" 
                                id="btn-${index}-${optIdx}" 
                                onclick="selectOption(${index}, ${optIdx})">
                            ${String.fromCharCode(65 + optIdx)}. ${opt}
                        </button>
                    `;
                });

                card.innerHTML = `
                    <div class="question-header">Question ${index + 1} of ${questions.length}</div>
                    <div class="question-text">${q.question}</div>
                    <div class="options-list">${optionsHTML}</div>
                    <div class="explanation-box" id="exp-${index}"></div>
                `;

                container.appendChild(card);
            });
        }

        function selectOption(qIdx, selectedOptIdx) {
            if (currentAnswers[qIdx] !== null) return;

            currentAnswers[qIdx] = selectedOptIdx;
            const q = questions[qIdx];
            const isCorrect = selectedOptIdx === q.correct;

            q.options.forEach((_, optIdx) => {
                const btn = document.getElementById(`btn-${qIdx}-${optIdx}`);
                btn.disabled = true;

                if (optIdx === q.correct) {
                    btn.classList.add('correct-choice');
                } else if (optIdx === selectedOptIdx) {
                    btn.classList.add('incorrect-choice');
                } else {
                    btn.classList.add('dimmed');
                }
            });

            const expBox = document.getElementById(`exp-${qIdx}`);
            expBox.classList.add('visible', isCorrect ? 'correct' : 'incorrect');
            expBox.innerHTML = `<strong>${isCorrect ? '✓ Correct' : '✗ Incorrect'}</strong><br>${q.explanation}`;

            updateScore();
        }

        function updateScore() {
            const answeredCount = currentAnswers.filter(a => a !== null).length;
            const correctCount = currentAnswers.reduce((acc, ans, idx) => {
                return ans === questions[idx].correct ? acc + 1 : acc;
            }, 0);

            const percentage = Math.round((correctCount / questions.length) * 100);
            
            document.getElementById('scoreDisplay').innerText = `Score: ${correctCount} / ${questions.length} (${percentage}%)`;
            document.getElementById('progressBar').style.width = `${(answeredCount / questions.length) * 100}%`;

            if (answeredCount === questions.length) {
                showSummary(correctCount, percentage);
            }
        }

        function showSummary(correctCount, percentage) {
            const summaryCard = document.getElementById('summaryCard');
            const finalScore = document.getElementById('finalScore');
            const feedback = document.getElementById('summaryFeedback');

            finalScore.innerText = `${correctCount} / ${questions.length} (${percentage}%)`;

            if (percentage >= 90) {
                feedback.innerText = "Excellent! You have mastered all Quiz 1 material up through Endospores.";
            } else if (percentage >= 75) {
                feedback.innerText = "Solid job! Double check flagella mechanics and size ranges before taking Quiz 1.";
            } else {
                feedback.innerText = "Good practice run. Review the Quiz 1 material up through endospores and retake the quiz!";
            }

            summaryCard.classList.add('visible');
            summaryCard.scrollIntoView({ behavior: 'smooth' });
        }

        function resetQuiz() {
            currentAnswers = new Array(questions.length).fill(null);
            document.getElementById('summaryCard').classList.remove('visible');
            document.getElementById('scoreDisplay').innerText = `Score: 0 / ${questions.length} (0%)`;
            document.getElementById('progressBar').style.width = '0%';
            renderQuiz();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.onload = renderQuiz;
    </script>
</body>
</html>
