<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sublux Listings Quiz v2</title>
  <style>
    :root {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      --bg: #0f0f0f;
      --card: #1a1a1a;
      --bd: #282828;
      --tx: #ffffff;
      --mu: #888888;
      --ac: #ff9900;
      --accent: #ff9900;
      --accent-hover: #cc7a00;
      --border-color: #282828;
      --ok: #14532d;
      --okb: #22c55e;
      --no: #7f1d1d;
      --nob: #ef4444;
      --op: #242424;
      --incorrect-border: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px);
    }

    body {
      background: var(--bg);
      color: var(--tx);
      padding: 0 14px 60px;
    }

    header {
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 9;
      background: var(--bg);
      border-bottom: 2px solid var(--ac);
      max-width: 850px;
      margin: 0 auto 20px;
      padding: 12px 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 17px;
      text-transform: uppercase;
    }

    h1 span {
      background: var(--ac);
      color: #000;
      padding: 2px 6px;
      border-radius: 4px;
    }

    #score {
      font-weight: bold;
      color: var(--ac);
      font-size: 14px;
    }

    /* Mode Selector */
    .mode-container {
      max-width: 850px;
      margin: 0 auto 16px auto;
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .mode-btn {
      background: #222222;
      color: #ffffff;
      border: 1px solid var(--border-color);
      padding: 8px 20px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s, border-color 0.2s;
    }

    .mode-btn.active {
      background: var(--accent);
      color: #000000;
      border-color: var(--accent);
    }

    main {
      max-width: 850px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 8px;
      padding: 18px;
    }

    .tag {
      font-size: 11px;
      font-weight: bold;
      color: var(--ac);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .q {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.45;
      margin-bottom: 14px;
    }

    .opt {
      display: flex;
      gap: 10px;
      width: 100%;
      text-align: left;
      background: var(--op);
      color: var(--tx);
      border: 1px solid var(--bd);
      border-radius: 6px;
      padding: 11px 13px;
      margin-bottom: 8px;
      font-size: 14px;
      line-height: 1.35;
      cursor: pointer;
    }

    .opt b {
      color: var(--ac);
      min-width: 18px;
    }

    .opt:hover:not(.lk) {
      border-color: var(--ac);
    }

    .lk {
      cursor: default;
    }

    .opt.ok {
      background: var(--ok);
      border-color: var(--okb);
    }

    .opt.no {
      background: var(--no);
      border-color: var(--nob);
    }

    .ex {
      display: none;
      margin-top: 10px;
      padding: 14px 16px;
      border-left: 3px solid var(--ac);
      background: #121212;
      border-radius: 4px;
      font-size: 13.5px;
      line-height: 1.45;
      color: var(--mu);
    }

    .ex strong {
      color: var(--tx);
    }

    .status-banner {
      font-weight: bold;
      display: inline-block;
      margin-bottom: 8px;
      font-size: 15px;
    }

    .status-banner.correct {
      color: var(--okb);
    }

    .status-banner.incorrect {
      color: var(--nob);
    }

    .ref-text {
      font-size: 12px;
      color: var(--mu);
      margin-bottom: 10px;
      font-style: italic;
    }

    .rationale-list {
      list-style-type: none;
      padding-left: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
    }

    .rationale-list li {
      font-size: 13px;
      line-height: 1.4;
      color: #9ca3af;
    }

    .rationale-list li strong {
      color: #e5e7eb;
    }

    .wrong-popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2000;
      pointer-events: none;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: popIn 0.15s ease-out;
    }

    .wrong-popup.hidden {
      display: none;
    }

    .wrong-popup img {
      max-width: 80vw;
      max-height: 55vh;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
      border: 3px solid var(--incorrect-border);
      display: block;
      object-fit: contain;
      background: #111;
    }

    @keyframes popIn {
      from { transform: translate(-50%, -50%) scale(0.85); opacity: 0; }
      to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }

    .summary-card {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 8px;
      padding: 24px;
      text-align: center;
      margin-top: 20px;
    }

    .summary-card.hidden {
      display: none;
    }

    .summary-title {
      font-size: 20px;
      font-weight: bold;
      color: var(--ac);
      margin-bottom: 10px;
    }

    .summary-score {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .summary-msg {
      font-size: 15px;
      margin-bottom: 20px;
      color: #e5e7eb;
      font-weight: 600;
    }

    .retake-btn {
      background-color: var(--accent);
      color: #000000;
      border: 1px solid var(--accent);
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      margin: 4px;
      display: inline-block;
      text-decoration: none;
      transition: background-color 0.2s, color 0.2s;
    }

    .retake-btn:hover {
      background-color: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .retake-btn.hub-btn {
      background-color: #222222;
      color: #ffffff;
      border: 1px solid var(--accent);
    }

    .retake-btn.hub-btn:hover {
      background-color: var(--accent);
      color: #000000;
    }
  </style>
</head>
<body>

  <audio id="wrongAudio" src="Wrong-answer.mp3" preload="auto"></audio>
  <div id="wrongPopup" class="wrong-popup hidden">
    <img id="wrongImage" src="Erijah.png" alt="Wrong Answer">
  </div>

  <header>
    <h1>Sublux <span>Listings v2</span></h1>

    <button class="mode-btn" id="quickQuizBtn">Quickie</button>
  </div>

  <main id="m"></main>

  <div class="summary-card hidden" id="summary">
    <div class="summary-title" id="summaryTitle">Quiz Complete</div>
    <div class="summary-score" id="summaryScore"></div>
    <div class="summary-msg" id="summaryMsg"></div>
    <button class="retake-btn" id="retakeBtn">Retake Quiz</button>
    <button class="retake-btn" id="reviewBtn" style="display:none">Review Missed</button>
    <a href="index.html" class="retake-btn hub-btn">Back to Main Page</a>
  </div>

          "(a) Posterior subluxation of C1 would need dens or transverse ligament failure — Correct. Anatomical containment by the dens and transverse ligament prevents posterior C1 translation without severe trauma.",

        "Lecture 5, Slide #38",
        [
          "(a) RA — Correct. Occiput rotation is opposite to atlas on the matching side; atlas right posterior (RP) dictates occiput right anterior (RA).",

          "(c) LA — Incorrect. Mismatches laterality side.",
          "(d) LP — Incorrect. Incorrect side and rotational direction."
        ]
      ],
      [
        "Occiput",
        "Decode PS-LS-LP.",
        ["Posterior-superior; left side superior; left side rotated posterior", "Posterior-superior; left side superior; left side rotated anterior", "Posterior sacrum; left ala; left posterior", "Anterior-superior; left side superior; left side rotated posterior"],
        "PS = posterior-superior (lateral X-ray), LS = laterality, LP = rotation on that same left side.",

        [
          "(a) Posterior-superior; left side superior; left side rotated posterior — Correct. PS = Posterior-Superior, LS = Left Superior laterality, LP = Left Posterior rotation.",
          "(b) Posterior-superior; left side superior; left side rotated anterior — Incorrect. Final letter 'P' indicates posterior rotation, not anterior.",
          "(c) Posterior sacrum; left ala; left posterior — Incorrect. Mixes occipital cranial terminology with sacral SI joint listings.",
          "(d) Anterior-superior; left side superior; left side rotated posterior — Incorrect. Initial designation is Posterior-Superior (PS)."
        ]
      ],
      [
        "Occiput",
        "When the atlas goes AS, which occiput listing is typically taught alongside it?",
        ["PS", "AS", "PI", "AI"],
        "The atlas and occiput move opposite each other. Atlas AS goes with occiput PS (the lecture focus).",
        "Lecture 5, Slide #49",
        [
          "(a) PS — Correct. Biomechanically, atlas anterior-superior (AS) pairing most commonly accompanies occiput posterior-superior (PS).",

          "(c) PI — Incorrect. PI is an ilium listing nomenclature.",
          "(d) AI — Incorrect. AI refers to inferior atlas displacement."
        ]
      ],
      [
        "Occiput",
        "Which occiput listing is internally consistent?",
        ["PS-RS-RP", "PS-RS-LA", "PS-LS-RA", "PS-LS-RP"],

        "Lecture 5, Slide #53",
        [
          "(a) PS-RS-RP — Correct. Laterality and rotation components must match sides (Right Superior laterality pairs exclusively with Right Anterior or Right Posterior rotation).",

          "(c) PS-LS-RA — Incorrect. Mismatches left laterality with right rotation.",
          "(d) PS-LS-RP — Incorrect. Mismatches left laterality with right rotation."
        ]
      ],
      [
        "Region ID",
        "Which listing can only be an ilium?",
        ["PI", "BP", "PS", "ASL"],
        "PI, AS, EX and IN are ilium. BP is sacrum, PS is occiput, ASL is atlas.",
        "Lecture 1, Slide #12",
        [
          "(a) PI — Correct. PI, AS, EX, and IN are exclusive ilium innominate listing codes.",
          "(b) BP — Incorrect. BP designates a lumbosacral base posterior sacrum listing.",
          "(c) PS — Incorrect. PS designates an occiput cranial listing.",
          "(d) ASL — Incorrect. ASL represents an atlas cervical listing."
        ]
      ],
      [
        "Region ID",
        "Which segment is a PS-LS listing?",
        ["Occiput", "Atlas", "Sacrum", "Ilium"],

        "Lecture 1, Slide #15",
        [
          "(a) Occiput — Correct. Occiput listings begin with PS/AS followed by a hyphenated laterality designator.",
          "(b) Atlas — Incorrect. Atlas listings use AS/AI without hyphens.",
          "(c) Sacrum — Incorrect. Sacrum uses BP or hyphenated SI joint codes (P-R/P-L).",
          "(d) Ilium — Incorrect. Ilium uses PI, AS, EX, IN."
        ]
      ],
      [
        "Region ID",
        "What are the coccyx listings?",
        ["A, A-R, A-L", "P, P-R, P-L", "PI, AS, EX, IN", "AI, AS, ASR, ASL"],
        "The coccyx misaligns anterior, listed A, A-R or A-L.",
        "Lecture 1, Slide #18",
        [
          "(a) A, A-R, A-L — Correct. Coccyx subluxations misalign anteriorly and are categorized as A, A-R, or A-L.",
          "(b) P, P-R, P-L — Incorrect. Posterior coccygeal listings are not clinically recognized.",
          "(c) PI, AS, EX, IN — Incorrect. These represent innominate ilium listings.",
          "(d) AI, AS, ASR, ASL — Incorrect. These represent atlas cervical listings."
        ]
      ],
      [
        "Spondy vs BP",
        "On a lateral X-ray L4 and the sacrum line up, but L5 sits forward of both. What is it?",
        ["Anterior spondylolisthesis of L5", "BP sacrum", "P-L sacrum", "PI ilium"],
        "L5 slipped forward relative to L4 and sacrum, so it is a true spondy.",
        "Lecture 3, Slide #31",
        [
          "(a) Anterior spondylolisthesis of L5 — Correct. When L5 is displaced anteriorly relative to both S1 and L4, true anterior spondylolisthesis is confirmed.",
          "(b) BP sacrum — Incorrect. BP involves posterior sacral base rocking while maintaining normal L4-L5 alignment.",
          "(c) P-L sacrum — Incorrect. P-L denotes SI joint sacral ala rotation.",
          "(d) PI ilium — Incorrect. Ilium misalignments are evaluated via pelvic radiography and PSIS landmarks."
        ]
      ],
      [
        "Spondy vs BP",
        "On a lateral X-ray L4 and L5 are aligned and the sacral base is posterior to both. What is it?",
        ["BP sacrum", "Anterior spondylolisthesis of L5", "Posterior L5", "P-R sacrum"],
        "L4 and L5 stay in line while the sacrum rocks back. That is BP. Always check L4 before calling a spondy.",
        "Lecture 3, Slide #35",
        [
          "(a) BP sacrum — Correct. Maintenance of normal L4-L5 alignment combined with a posteriorly rocked sacral base confirms a Base Posterior (BP) sacrum.",
          "(b) Anterior spondylolisthesis of L5 — Incorrect. Requires anterior displacement of L5 relative to L4.",
          "(c) Posterior L5 — Incorrect. Not standard chiropractic listing nomenclature.",
          "(d) P-R sacrum — Incorrect. P-R designates unilateral SI joint rotation."
        ]
      ]
    ];

    let currentSet = [];
    let round = 1;
    let quizMode = 'full';
    let answers = {};
    let popupTimeout = null;
    let missed = [];

    const wrongAudio = document.getElementById('wrongAudio');
    const wrongPopup = document.getElementById('wrongPopup');

    const fisherYates = array => {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.random() * (i + 1) | 0;
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    };

    function initQuiz(mode = 'full') {
      quizMode = mode;
      round = 1;
      missed = [];
      answers = {};

      const fullShuffled = fisherYates(D);
      currentSet = (quizMode === 'quick') ? fullShuffled.slice(0, 15) : fullShuffled;

      document.getElementById('fullQuizBtn').classList.toggle('active', quizMode === 'full');
      document.getElementById('quickQuizBtn').classList.toggle('active', quizMode === 'quick');

      document.getElementById('summary').classList.add('hidden');
      renderQuiz(currentSet);
    }

    function renderQuiz(set) {
      const m = document.getElementById('m');
      m.innerHTML = '';
      answers = {};

      set.forEach((d, n) => {
        const c = document.createElement('div');
        c.className = 'card';
        c.id = `card_${n}`;

        const labelPrefix = (round === 1) ? `Question ${n + 1} of ${set.length}` : `Review Question ${n + 1} of ${set.length}`;
        c.innerHTML = `<div class="tag">${d[0]} · ${labelPrefix}</div><div class="q"></div>`;
        c.querySelector('.q').textContent = d[1];

        const opts = fisherYates(d[2].map((t, i) => ({ t, ok: i === 0 })));
        const bs = [];

        opts.forEach((o, i) => {
          const b = document.createElement('button');
          b.className = 'opt';
          b.innerHTML = '<b>' + 'ABCD'[i] + '.</b><span></span>';
          b.lastChild.textContent = o.t;
          bs.push(b);
          c.appendChild(b);

          b.onclick = () => {
            if (b.classList.contains('lk')) return;
            bs.forEach(x => x.classList.add('lk'));
            answers[n] = o.ok;

            bs.forEach((x, k) => {
              if (opts[k].ok) x.classList.add('ok');
            });

            const banner = c.querySelector('.status-banner');
            if (o.ok) {
              b.classList.add('ok');
              banner.className = 'status-banner correct';
              banner.textContent = 'Correct!';
            } else {
              b.classList.add('no');
              banner.className = 'status-banner incorrect';
              banner.textContent = 'You didn’t know that?!';

              wrongAudio.currentTime = 0;
              wrongAudio.play().catch(() => {});
              wrongPopup.classList.remove('hidden');
              if (popupTimeout) clearTimeout(popupTimeout);
              popupTimeout = setTimeout(() => {
                wrongPopup.classList.add('hidden');
              }, 2000);
            }

            ex.style.display = 'block';
            updateScoreUI();
            checkAllAnswered(set);
          };
        });

        const ex = document.createElement('div');
        ex.className = 'ex';

        let rationalesHtml = '<ul class="rationale-list">';
        d[5].forEach(rat => {
          rationalesHtml += `<li><strong>${rat.split(' — ')[0]}</strong> — ${rat.split(' — ')[1]}</li>`;
        });
        rationalesHtml += '</ul>';

        ex.innerHTML = `
          <div class="status-banner"></div>
          <div class="ref-text">Reference: ${d[4]}</div>
          <div style="margin-bottom:8px;"><strong>Explanation:</strong> ${d[3]}</div>
          ${rationalesHtml}
        `;
        c.appendChild(ex);

        m.appendChild(c);
      });

      updateScoreUI();
    }

    function updateScoreUI() {
      const total = currentSet.length;
      let correctCount = 0;
      let answeredCount = 0;

      Object.keys(answers).forEach(k => {
        answeredCount++;
        if (answers[k]) correctCount++;
      });

      const pct = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;
      const label = (round === 1) ? 'Score' : `Review ${round - 1}`;
      document.getElementById('score').textContent = `${label}: ${correctCount} / ${answeredCount} (${pct}%)`;
    }

    function checkAllAnswered(set) {
      if (Object.keys(answers).length === set.length) {
        showSummary(set);
      }
    }

    function showSummary(set) {
      let correctCount = 0;
      missed = [];

      set.forEach((d, n) => {
        if (answers[n]) {
          correctCount++;
        } else {
          missed.push(d);
        }
      });

      const total = set.length;
      const pct = total > 0 ? Math.round((correctCount / total) * 100) : 0;

      const summaryCard = document.getElementById('summary');
      const summaryTitle = document.getElementById('summaryTitle');
      const summaryScore = document.getElementById('summaryScore');
      const summaryMsg = document.getElementById('summaryMsg');
      const reviewBtn = document.getElementById('reviewBtn');

      if (round === 1) {
        summaryTitle.textContent = 'Quiz Complete';
      } else {
        summaryTitle.textContent = `Review Round ${round - 1} Complete`;
      }

      summaryScore.textContent = `Final Score: ${correctCount} / ${total} (${pct}%)`;

      let msg = '';
      if (pct >= 90) {
        msg = 'Absolute Gigachad. You drained that test dry.';
      } else if (pct >= 70) {
        msg = "Solid run! You're locked in, get in some more reps.";
      } else {
        msg = 'You lasted less than 30 seconds. Time for a rematch.';
      }
      summaryMsg.textContent = msg;

      if (missed.length > 0) {
        reviewBtn.style.display = 'inline-block';
        reviewBtn.textContent = `Review Missed (${missed.length})`;
      } else {
        reviewBtn.style.display = 'none';
        if (round > 1) {
          summaryMsg.textContent += ' Everything cleared. All correct.';
        }
      }

      summaryCard.classList.remove('hidden');
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    document.getElementById('fullQuizBtn').onclick = () => initQuiz('full');
    document.getElementById('quickQuizBtn').onclick = () => initQuiz('quick');

    document.getElementById('retakeBtn').onclick = () => {
      initQuiz(quizMode);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    document.getElementById('reviewBtn').onclick = () => {
      if (missed.length > 0) {
        round++;
        document.getElementById('summary').classList.add('hidden');
        renderQuiz(missed);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    };

    window.onload = () => {
      initQuiz('full');
    };
  </script>
</body>
