<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sublux Analysis: Listings & Biomechanics Quiz</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --card-border: #282828;
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent-orange: #ff9900;
            --correct-bg: #14532d;
            --correct-border: #22c55e;
            --incorrect-bg: #7f1d1d;
            --incorrect-border: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px 15px 60px 15px;
            user-select: none;
        }

        .sticky-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(15, 15, 15, 0.96);
            backdrop-filter: blur(8px);
            border-bottom: 2px solid var(--accent-orange);
            padding: 12px 20px;
            max-width: 850px;
            margin: -20px auto 25px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .hub-title {
            font-size: 18px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .hub-badge {
            background-color: var(--accent-orange);
            color: #000;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .score-counter {
            font-size: 15px;
            font-weight: bold;
            color: var(--accent-orange);
            background: #242424;
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid #333;
        }

        .quiz-container {
            max-width: 850px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .question-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: border-color 0.2s;
        }

        .question-card:hover {
            border-color: #383838;
        }

        .q-number {
            font-size: 12px;
            font-weight: bold;
            color: var(--accent-orange);
            text-transform: uppercase;
            margin-bottom: 6px;
            display: block;
        }

        .q-text {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.45;
            margin-bottom: 16px;
            color: #f3f4f6;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 9px;
        }

        .option-btn {
            background-color: #242424;
            border: 1px solid #333;
            color: #e5e7eb;
            padding: 12px 14px;
            border-radius: 6px;
            text-align: left;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.15s, border-color 0.15s;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            line-height: 1.35;
        }

        .option-btn:hover:not(.locked) {
            background-color: #2e2e2e;
            border-color: var(--accent-orange);
        }

        .option-key {
            font-weight: 900;
            color: var(--accent-orange);
            min-width: 18px;
        }

        .option-btn.locked {
            cursor: default;
        }

        .option-btn.correct {
            background-color: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: #ffffff !important;
            font-weight: bold;
        }

        .option-btn.incorrect {
            background-color: var(--incorrect-bg) !important;
            border-color: var(--incorrect-border) !important;
            color: #ffffff !important;
        }

        .explanation-box {
            display: none;
            margin-top: 14px;
            padding: 12px 14px;
            background-color: #121212;
            border-left: 3px solid var(--accent-orange);
            border-radius: 4px;
            font-size: 13.5px;
            line-height: 1.45;
            color: #d1d5db;
        }

        .explanation-box strong {
            color: var(--accent-orange);
        }
    </style>
</head>
<body>

    <header class="sticky-header">
        <div class="hub-title">
            <span>Sublux</span><span class="hub-badge">Listings</span>
        </div>
        <div class="score-counter" id="scoreDisplay">Score: 0 / 0 (0%)</div>
    </header>

    <main class="quiz-container" id="quizContainer"></main>

    <script>
        const quizData = [
            {
                q: "What is the primary anatomical reference point utilized for constructing spinal listings from C2 down to L5 in the Palmer–Gonstead listing system?",
                options: [
                    "Vertebral body",
                    "Spinous process",
                    "Transverse process",
                    "Superior articular facet"
                ],
                correct: 1,
                exp: "In the Palmer–Gonstead system, the reference point for segments C2 through L5 is strictly the spinous process. Diversified cervical listings use the vertebral body instead."
            },
            {
                q: "A patient presents with an L5 PLS listing. When performing motion palpation on this segment, which set of motion restrictions will be identified?",
                options: [
                    "Reduced extension, reduced right rotation, and reduced right lateral flexion",
                    "Reduced extension, reduced left rotation, and reduced left lateral flexion",
                    "Reduced extension, reduced left rotation, and reduced right lateral flexion",
                    "Reduced flexion, reduced right rotation, and reduced left lateral flexion"
                ],
                correct: 1,
                exp: "PLS indicates posteriority (reduced extension), spinous rotated left (stuck left rotation = reduced left rotation), and open wedging on the left/same side (unable to laterally bend back to the left = reduced left lateral flexion)."
            },
            {
                q: "A Palmer–Gonstead listing with wedging on the opposite side of spinous rotation (such as PLI or PRI) is classified as which type of listing?",
                options: [
                    "Simple listing",
                    "Rotary listing",
                    "Coupled listing",
                    "Translational listing"
                ],
                correct: 1,
                exp: "When the wedge is on the opposite side of spinous rotation (PLI or PRI), it is designated as a Rotary listing. When on the same side (PLS or PRS), it is a Simple listing."
            },
            {
                q: "When adjusting a lumbar rotary listing such as L4 PLI, what specific regional anatomical contact point is utilized, and how is it suffixed in notes?",
                options: [
                    "Lamina; PLI-la",
                    "Transverse process; PLI-t",
                    "Mammillary process; PLI-m",
                    "Spinous process; PLI-sp"
                ],
                correct: 2,
                exp: "For lumbar rotary listings (PLI / PRI), the preferred contact point on the side of the open wedge is the mammillary process, denoted with the suffix '-m' (e.g., PLI-m)."
            },
            {
                q: "For a thoracic rotary listing such as T6 PRI, which anatomical landmark represents the primary contact point on the side of the wedge?",
                options: [
                    "Spinous process",
                    "Transverse process (-t)",
                    "Mammillary process (-m)",
                    "Lamina (-la)"
                ],
                correct: 1,
                exp: "In the thoracic spine, rotary listings contact the transverse process on the side of the wedge, designated with '-t' (e.g., PRI-t). Cervical uses lamina (-la) and lumbar uses mammillary (-m)."
            },
            {
                q: "In the cervical spine (C2–C7), the Diversified system references the vertebral body. A Palmer–Gonstead listing of PL translates to which Diversified listing?",
                options: [
                    "Body Left",
                    "Body Right",
                    "Body Posterior",
                    "Body Anterior"
                ],
                correct: 1,
                exp: "Because a spinous process rotated to the left (PL) forces the anterior/vertebral body to swing posterior on the right side, a Palmer–Gonstead PL translates directly to a Diversified Body Right."
            },
            {
                q: "If an examiner identifies a Diversified 'Body Left' listing at C5, what motion palpation rotational restriction is present?",
                options: [
                    "Reduced left rotation",
                    "Reduced right rotation",
                    "Reduced lateral flexion only",
                    "Reduced cervical flexion only"
                ],
                correct: 1,
                exp: "A Body Left means the spinous is rotated to the right (PR). A right spinous malposition cannot rotate back into right rotation, meaning it has reduced right rotation."
            },
            {
                q: "When motion palpating a T4 PRS listing, what dynamic biomechanical limitation in lateral flexion will be elicited?",
                options: [
                    "Reduced left lateral flexion",
                    "Reduced right lateral flexion",
                    "Reduced extension only",
                    "Unrestricted bilateral lateral flexion"
                ],
                correct: 1,
                exp: "In a PRS listing, the wedging is on the right side (same side as spinous rotation). Because it is fixated open on the right and closed on the left, it cannot tilt back into right lateral flexion."
            },
            {
                q: "What is the primary anatomical reference landmark used to formulate all ilium (innominate) subluxation listings?",
                options: [
                    "Anterior Superior Iliac Spine (ASIS)",
                    "Ischial tuberosity",
                    "Posterior Superior Iliac Spine (PSIS)",
                    "Sacral base"
                ],
                correct: 2,
                exp: "The Posterior Superior Iliac Spine (PSIS) is the universal anatomical reference point for all ilium subluxation listings (PI, AS, EX, IN)."
            },
            {
                q: "When evaluating a subluxation between the sacrum and the L5 vertebra at the disc level, what is the anatomical reference point and resulting listing?",
                options: [
                    "Sacral apex; Apex Posterior (AP)",
                    "Sacral base; Base Posterior (BP)",
                    "Sacral ala; P-R",
                    "Sacral canal; S1 Retrolisthesis"
                ],
                correct: 1,
                exp: "When the sacrum subluxates relative to L5 at the disc level, the reference point is the sacral base, and posterior rocking of this base is listed as Base Posterior (BP)."
            },
            {
                q: "How must a sacral subluxation at the right sacroiliac joint involving posterior rotation of the sacral ala be formally documented to distinguish it from spinal listings?",
                options: [
                    "PR",
                    "P-R",
                    "R-Sacrum",
                    "Sacral PR-m"
                ],
                correct: 1,
                exp: "Sacral SI joint listings require a hyphen (P-R or P-L). Without the dash, 'PR' would designate a spinal vertebra spinous right listing (such as C2 or L5 PR)."
            },
            {
                q: "Which pair of compound ilium listings are categorized as 'married' because their individual components reinforce each other's biomechanical effects?",
                options: [
                    "PIEx and ASIn",
                    "PIIn and ASEx",
                    "PI and AS",
                    "EX and IN"
                ],
                correct: 0,
                exp: "PIEx and ASIn are the 'married' listings. PI and EX both cause functional leg shortening and toe-in; AS and IN both cause functional leg lengthening and toe-out."
            },
            {
                q: "On radiographic and visual examination, which classic finding corresponds to an isolated PI (posterior-inferior) ilium listing?",
                options: [
                    "Decreased vertical innominate height and smaller obturator foramen",
                    "Increased vertical innominate height and larger obturator foramen",
                    "Narrowed obturator foramen and elevated gluteal fold",
                    "Widened innominate transverse width and toe-out flare"
                ],
                correct: 1,
                exp: "A PI ilium causes the innominate to rock back and down, which on AP pelvic radiography increases vertical innominate height, increases obturator foramen dimensions, and lowers the gluteal fold."
            },
            {
                q: "What is the primary anatomical reference landmark used for establishing Atlas (C1) subluxation listings?",
                options: [
                    "Posterior arch of atlas",
                    "Anterior arch (tubercle) of atlas",
                    "Odontoid process of axis",
                    "Lateral mass transverse process"
                ],
                correct: 1,
                exp: "Atlas listings always reference the anterior arch (anterior tubercle) of C1, which is why all Palmer atlas listings start with the letter 'A'."
            },
            {
                q: "Why are all Palmer-Gonstead Atlas listings prefixed with an 'A' (Anterior) rather than a 'P' (Posterior)?",
                options: [
                    "The posterior arch is cartilage and cannot be palpated",
                    "Posterior subluxation of C1 on C2 is structurally impossible without fracture of the dens or rupture of the transverse ligament",
                    "The atlas facets face exclusively anteriorly and cannot translate posteriorly",
                    "Palmer protocol arbitrarily chose anteriority to avoid confusion with the pelvis"
                ],
                correct: 1,
                exp: "Atlas listings always begin with 'A' because posterior subluxation of atlas on axis is considered anatomically impossible without catastrophic disruption of the dens and transverse ligament."
            },
            {
                q: "In an Atlas listing of ASRP, what specific mechanical displacement does the final letter 'P' indicate?",
                options: [
                    "The entire atlas has shifted directly posterior relative to C2",
                    "The right lateral mass of the atlas has rotated posterior on the side of laterality",
                    "The patient exhibits posterior head carriage",
                    "The left transverse process has rotated anteriorly"
                ],
                correct: 1,
                exp: "In ASRP, A = Anterior, S = Superior, R = Right laterality (side of contact), and P = the right lateral mass has rotated Posterior on that side of laterality."
            },
            {
                q: "What is the universal anatomical reference point for formulating Occiput (C0) subluxation listings?",
                options: [
                    "External occipital protuberance (Inion)",
                    "Foramen magnum",
                    "Base/condyles of the occiput (posterior portion of occiput)",
                    "Mastoid process of the temporal bone"
                ],
                correct: 2,
                exp: "The reference point for Occiput listings is the base/condyles of the occiput (the posterior aspect of the skull/condyles articulating with C1)."
            },
            {
                q: "In the Occiput listing PS-RS-RA, how is the subluxation mechanically decoded?",
                options: [
                    "Posterior-Superior condyle, Right-Superior laterality, Right condyle rotated Anterior",
                    "Posterior Sacrum, Right Sacral Ala, Right Anterior rotation",
                    "Primary Superior, Right Shift, Rotational Atlas",
                    "Posterior-Superior condyle, Right Sacrum, Reduced Abduction"
                ],
                correct: 0,
                exp: "PS-RS-RA decodes as: PS = Posterior-Superior occiput rock, RS = Right side went Superior (laterality/wedge side), RA = the right side rotated Anterior."
            },
            {
                q: "What are the testable subluxation listings recognized for the Coccyx?",
                options: [
                    "P, P-R, P-L",
                    "A, A-R, A-L",
                    "PI, AS, EX, IN",
                    "AI, AS, ASR, ASL"
                ],
                correct: 1,
                exp: "According to the pelvic listing protocols, Coccyx subluxations misalign anteriorly and are listed as: A (Anterior), A-R (Anterior-Right), and A-L (Anterior-Left)."
            },
            {
                q: "On lateral radiograph, what finding confirms an actual spondylolisthesis at L5 rather than a Base Posterior (BP) sacrum?",
                options: [
                    "L5 is anterior to S1, but L4 remains aligned with S1",
                    "L5 has slipped anterior relative to both S1 and L4",
                    "The L5-S1 disc space opens widely in the posterior aspect",
                    "The sacral base angle exceeds 60 degrees"
                ],
                correct: 1,
                exp: "As emphasized in lecture, to distinguish an anterior spondylolisthesis from a BP sacrum, you must check L4: in a true L5 spondylolisthesis, L5 is anterior to both S1 and L4 above it. In BP sacrum, L4 and L5 remain aligned while the sacrum alone rocks backward."
            }
        ];

        // Fisher-Yates Shuffle
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        let answeredCount = 0;
        let correctCount = 0;

        function updateScore() {
            const total = quizData.length;
            const pct = answeredCount === 0 ? 0 : Math.round((correctCount / answeredCount) * 100);
            document.getElementById('scoreDisplay').textContent = `Score: ${correctCount} / ${answeredCount} (${pct}%)`;
        }

        function renderQuiz() {
            shuffleArray(quizData);
            const container = document.getElementById('quizContainer');
            container.innerHTML = '';

            quizData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `qCard_${index}`;

                const qNum = document.createElement('span');
                qNum.className = 'q-number';
                qNum.textContent = `Question ${index + 1} of ${quizData.length}`;
                card.appendChild(qNum);

                const qText = document.createElement('div');
                qText.className = 'q-text';
                qText.textContent = item.q;
                card.appendChild(qText);

                const optGrid = document.createElement('div');
                optGrid.className = 'options-grid';

                const optKeys = ['A', 'B', 'C', 'D'];
                item.options.forEach((optStr, optIdx) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerHTML = `<span class="option-key">${optKeys[optIdx]}.</span> <span>${optStr}</span>`;

                    btn.addEventListener('click', () => {
                        handleChoice(index, optIdx, card, item);
                    });

                    optGrid.appendChild(btn);
                });

                card.appendChild(optGrid);

                const expBox = document.createElement('div');
                expBox.className = 'explanation-box';
                expBox.id = `exp_${index}`;
                expBox.innerHTML = `<strong>Explanation:</strong> ${item.exp}`;
                card.appendChild(expBox);

                container.appendChild(card);
            });

            updateScore();
        }

        function handleChoice(qIdx, chosenIdx, cardElement, item) {
            const buttons = cardElement.querySelectorAll('.option-btn');
            if (buttons[0].classList.contains('locked')) return; // already answered

            buttons.forEach(btn => btn.classList.add('locked'));

            answeredCount++;
            if (chosenIdx === item.correct) {
                correctCount++;
                buttons[chosenIdx].classList.add('correct');
            } else {
                buttons[chosenIdx].classList.add('incorrect');
                buttons[item.correct].classList.add('correct');
            }

            const exp = document.getElementById(`exp_${qIdx}`);
            exp.style.display = 'block';

            updateScore();
        }

        window.onload = renderQuiz;
    </script>
</body>
</html>
