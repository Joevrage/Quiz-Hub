<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chiropractic Biomechanical Listings Mastery Hub</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --primary-accent: #ff9900;
            --correct-color: #22c55e;
            --correct-bg: #14532d;
            --incorrect-color: #ef4444;
            --incorrect-bg: #7f1d1d;
            --border-color: #333333;
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.5);
            --shadow-md: 0 4px 10px rgba(0,0,0,0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.5;
            padding-bottom: 40px;
        }

        .header-sticky {
            position: -webkit-sticky;
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: var(--card-bg);
            border-bottom: 2px solid var(--primary-accent);
            padding: 12px 20px;
            box-shadow: var(--shadow-sm);
        }

        .header-container {
            max-width: 850px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--primary-accent);
        }

        .score-box {
            font-size: 0.95rem;
            font-weight: 600;
            background-color: #262626;
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background-color: var(--border-color);
            position: absolute;
            bottom: 0;
            left: 0;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background-color: var(--primary-accent);
            transition: width 0.3s ease;
        }

        .quiz-container {
            max-width: 850px;
            margin: 20px auto;
            padding: 0 16px;
        }

        .question-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }

        .question-header {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--primary-accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .question-text {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 18px;
            color: var(--text-primary);
        }

        .options-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            width: 100%;
            text-align: left;
            padding: 13px 16px;
            font-size: 0.95rem;
            color: var(--text-primary);
            background-color: #262626;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary-accent);
            background-color: #333333;
        }

        .option-btn:disabled {
            cursor: default;
        }

        .option-btn.correct-choice {
            background-color: var(--correct-bg) !important;
            border-color: var(--correct-color) !important;
            color: #ffffff !important;
            font-weight: 600;
        }

        .option-btn.incorrect-choice {
            background-color: var(--incorrect-bg) !important;
            border-color: var(--incorrect-color) !important;
            color: #ffffff !important;
            font-weight: 600;
        }

        .option-btn.dimmed {
            opacity: 0.35;
        }

        .explanation-box {
            margin-top: 16px;
            padding: 14px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            line-height: 1.5;
            display: none;
        }

        .explanation-box.visible {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .explanation-box.correct {
            background-color: var(--correct-bg);
            border-left: 4px solid var(--correct-color);
            color: #d1fae5;
        }

        .explanation-box.incorrect {
            background-color: var(--incorrect-bg);
            border-left: 4px solid var(--incorrect-color);
            color: #fee2e2;
        }

        .summary-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--primary-accent);
            display: none;
        }

        .summary-card.visible {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        .summary-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .summary-score {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--primary-accent);
            margin-bottom: 16px;
        }

        .summary-text {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .reset-btn {
            background-color: var(--primary-accent);
            color: #000000;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .reset-btn:hover {
            background-color: #e68a00;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="header-sticky">
        <div class="header-container">
            <div class="header-title">Biomechanical Listings Mastery Hub</div>
            <div class="score-box" id="scoreDisplay">Score: 0 / 24 (0%)</div>
        </div>
        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progressBar"></div>
        </div>
    </div>

    <div class="quiz-container" id="quizContainer"></div>

    <div class="quiz-container">
        <div class="summary-card" id="summaryCard">
            <div class="summary-title" id="summaryTitle">Assessment Complete</div>
            <div class="summary-score" id="finalScore">0 / 24</div>
            <div class="summary-text" id="summaryFeedback">Performance feedback will appear here.</div>
            <button class="reset-btn" onclick="resetQuiz()">Retake Assessment</button>
        </div>
    </div>

    <script>
        const quizData = [
            // ATLAS (C1) SUBLUXATIONS
            {
                question: "Lateral and AP open-mouth radiographs reveal the atlas plane line is divergent anteriorly relative to the odontoid (anterior-superior tilt). The right lateral mass is wider and displaced lateral to C2, and on the vertex view, the right transverse process is rotated posteriorly. What is the Palmer-Gonstead atlas listing?",
                options: ["ASRP", "ASRA", "AIRP", "ASLP"],
                correct: 0,
                explanation: "First letter: 'A' = Anterior atlas plane line (superior tilt anteriorly). Second letter: 'S' = Superior atlas plane line. Third letter: 'R' = Right lateral mass displacement (larger/wider lateral mass on the right). Fourth letter: 'P' = Posterior rotation of the right transverse process relative to the left."
            },
            {
                question: "Analysis of C1 demonstrates an anterior-inferior atlas plane line on the lateral cervical film. The right lateral mass is displaced laterally, and on rotation analysis, the right transverse process has rotated anteriorly. What is the designated 4-letter atlas listing?",
                options: ["AIRP", "AIRA", "AILP", "ASRA"],
                correct: 1,
                explanation: "'A' = Atlas plane line anterior; 'I' = Inferior tilt of atlas plane line relative to horizontal; 'R' = Right lateral displacement; 'A' = Anterior rotation of the right transverse process (indicated on the side of lateral mass shift)."
            },
            {
                question: "Radiographic and motion palpation findings indicate an atlas with an open wedge anteriorly/superiorly. The left lateral mass is prominent laterally on APOM, and rotation testing indicates the left transverse process has rotated anteriorly. What is the listing?",
                options: ["ASLA", "ASLP", "AILA", "ASRA"],
                correct: 0,
                explanation: "ASLA denotes: 'A' = Anterior atlas, 'S' = Superior plane line, 'L' = Left lateral mass shift, 'A' = Anterior rotation of the left transverse process."
            },
            {
                question: "C1 motion palpation and imaging reveal that the atlas plane line is inferior on the lateral film. The left lateral mass exhibits lateral displacement on the open-mouth view, and the vertex view demonstrates posterior rotation of the left transverse process. What is the listing?",
                options: ["AILA", "ASLP", "AIRP", "AILP"],
                correct: 3,
                explanation: "'A' = Anterior; 'I' = Inferior tilt; 'L' = Left lateral mass displacement; 'P' = Posterior rotation of that left transverse process."
            },
            {
                question: "On an AP open-mouth film, the right lateral mass of C1 shows lateral overhang without any observable transverse process rotation on the vertex view, while the lateral film shows a superior atlas plane line. What is the listing?",
                options: ["ASR", "ASL", "AIR", "ASRA"],
                correct: 0,
                explanation: "When no rotational component (A or P) is present on the side of lateral shift, the listing concludes as a 3-letter designation: ASR (Anterior, Superior, Right)."
            },
            {
                question: "An APOM radiograph demonstrates left lateral mass overhang of the atlas with an inferior atlas plane line. Radiographic rotational analysis reveals no transverse process rotation on the side of lateral shift. What is the listing?",
                options: ["ASL", "AIL", "AILA", "AILP"],
                correct: 1,
                explanation: "Inferior atlas plane line ('I') with left lateral mass shift ('L') and zero rotational divergence yields the 3-letter listing AIL."
            },

            // OCCIPUT (C0) SUBLUXATIONS
            {
                question: "Occipital analysis reveals that the occiput has extended (condyles slid anteriorly) on the atlas, the right condyle is wedged superiorly (lateral flexion right), and the right condyle has rotated anteriorly. What is the Palmer/Gonstead occiput listing?",
                options: ["AS-RS-RA", "AS-RS-RP", "PS-RS-RA", "AS-LS-LA"],
                correct: 0,
                explanation: "First pair: 'AS' = Anterior-Superior condylar glide (extension of C0 on C1). Second pair: 'RS' = Right Superior (lateral flexion to the right). Third pair: 'RA' = Right Anterior (anterior rotation of the right condyle)."
            },
            {
                question: "Assessment of the atlanto-occipital joint demonstrates occipital flexion fixation (condyles displaced posteriorly/superiorly on atlas facets). The right condyle is superior, and the right condyle is rotated posteriorly. What is the designated occiput listing?",
                options: ["AS-RS-RP", "PS-RS-RP", "PS-RS-RA", "PS-LS-LP"],
                correct: 1,
                explanation: "'PS' = Posterior-Superior condylar fixation (occipital flexion malposition). 'RS' = Right Superior (right lateral wedging). 'RP' = Right Posterior (posterior rotation of the right occipital condyle)."
            },
            {
                question: "On radiographic evaluation of C0-C1, the occiput is extended on the atlas. The left condyle is found to be superior on the open-mouth view, and rotation analysis demonstrates posterior rotation of the left condyle. What is the listing?",
                options: ["AS-LS-LP", "AS-LS-LA", "PS-LS-LP", "AS-RS-RP"],
                correct: 0,
                explanation: "'AS' indicates anterior extension fixation; 'LS' indicates Left Superior lateral tilt; 'LP' indicates Left Posterior condylar rotation."
            },
            {
                question: "Biomechanical evaluation of the craniocervical junction shows posterior condylar displacement (PS), left superior tilt (LS), and anterior rotation of the left occipital condyle. What is the listing?",
                options: ["PS-LS-LA", "PS-LS-LP", "AS-LS-LA", "PS-RS-RA"],
                correct: 0,
                explanation: "The listing is PS-LS-LA: Posterior-Superior glide, Left Superior lateral tilt, and Left Anterior condylar rotation."
            },

            // PELVIS / ILIUM SUBLUXATIONS (GONSTEAD)
            {
                question: "During pelvic analysis, the right ilium demonstrates a decreased vertical measurement of the obturator foramen on radiograph, an elevated PSIS, a lowered ASIS, and an apparent elongated leg on the right side in the prone position. What is the primary ilium listing?",
                options: ["AS Ilium", "PI Ilium", "IN Ilium", "EX Ilium"],
                correct: 0,
                explanation: "An AS (Anterior-Superior) ilium rotates anteriorly and superiorly on the sacrum, resulting in a smaller/flattened obturator foramen vertical diameter, elevated PSIS, lowered ASIS, and an anatomical/functional long leg."
            },
            {
                question: "A patient presents with a low right gluteal fold and a short leg on the right in the prone position. An AP pelvic radiograph reveals an increased vertical height of the right obturator foramen and an increased vertical height of the right innominate bone. What is the listing?",
                options: ["PI Ilium", "AS Ilium", "EX Ilium", "IN Ilium"],
                correct: 0,
                explanation: "A PI (Posterior-Inferior) ilium listing causes the PSIS to rotate down and back, increasing the vertical measurement of the obturator foramen and the iliac shadow while creating a functional short leg on that side."
            },
            {
                question: "Radiographic evaluation of the pelvis reveals a widened iliac bone shadow from the SI joint to the lateral crest on the left, coupled with a narrowed transverse measurement of the left obturator foramen. Foot flare on the left is internally rotated. What is the listing?",
                options: ["IN Ilium", "EX Ilium", "PI Ilium", "AS Ilium"],
                correct: 0,
                explanation: "An IN (Internal) ilium rotates toward the pelvic midline, widening the iliac wing on an AP radiograph, narrowing the horizontal diameter of the obturator foramen, and promoting internal foot flare (toe-in)."
            },
            {
                question: "Pelvic examination reveals external toe-flare on the right side during ambulation. Radiographic measurement shows a narrower iliac wing on the right and an increased transverse diameter of the right obturator foramen. What is the listing?",
                options: ["IN Ilium", "EX Ilium", "PI-IN Ilium", "AS-IN Ilium"],
                correct: 1,
                explanation: "An EX (External) ilium rotates away from the midline, presenting radiographically with a narrowed iliac wing, a wider transverse obturator foramen, and external foot flare (toe-out)."
            },
            {
                question: "A patient exhibits a right functional short leg, an elevated and wider right obturator foramen, and a narrowed right iliac wing on an AP radiograph. What is the compound ilium listing?",
                options: ["PI-EX", "PI-IN", "AS-EX", "AS-IN"],
                correct: 0,
                explanation: "Short leg + elongated vertical obturator = PI. Narrowed iliac wing + widened transverse obturator = EX. Combined listing = PI-EX."
            },
            {
                question: "On the left side, the patient presents with a functional long leg, a decreased vertical height of the obturator foramen, and a widened iliac wing from SI joint to lateral margin. What is the compound ilium listing?",
                options: ["AS-IN", "AS-EX", "PI-IN", "PI-EX"],
                correct: 0,
                explanation: "Long leg + decreased vertical obturator dimension = AS. Widened iliac wing = IN. Combined listing = AS-IN."
            },
            {
                question: "Analysis shows a right innominate with a short leg, increased vertical obturator height, and a widened ilium on the AP pelvic view with toe-in presentation. What is the compound listing?",
                options: ["PI-IN", "PI-EX", "AS-IN", "AS-EX"],
                correct: 0,
                explanation: "Short leg + tall vertical obturator = PI. Widened ilium + toe-in = IN. Combined listing = PI-IN."
            },
            {
                question: "Pelvic analysis demonstrates a left anterior-superior pelvic tilt (flattened vertical obturator) combined with an externally rotated hemipelvis (narrowed iliac wing and toe-out flare). What is the compound listing?",
                options: ["AS-EX", "AS-IN", "PI-EX", "PI-IN"],
                correct: 0,
                explanation: "Anterior-superior rotation (AS) combined with external rotation (EX) forms the AS-EX listing."
            },

            // SACRUM & EXTREMITIES
            {
                question: "Motion palpation of the sacrum reveals hypermobility on the left, but on the right, the sacral base is locked posterior and inferior relative to the right ilium with localized edema at the upper right SI joint. What is the sacral listing?",
                options: ["P-R (Right Posterior Sacrum)", "P-L (Left Posterior Sacrum)", "Base Posterior (BP)", "Anterior-Inferior Sacrum"],
                correct: 0,
                explanation: "Posterior-inferior subluxation of the right sacral base relative to the ilium is designated as a Right Posterior Sacrum (P-R)."
            },
            {
                question: "On a lateral lumbar-pelvic radiograph, the sacral base angle is significantly increased, the lumbosacral angle is acute, and bilateral deep sacral sulci palpate posterior-to-anterior with restricted nutation. What is the listing?",
                options: ["Base Posterior (BP)", "Base Anterior (Anterior Sacrum)", "Rotated Sacrum Left", "Rotated Sacrum Right"],
                correct: 0,
                explanation: "A Base Posterior (BP) sacrum listing indicates posterior displacement of the entire sacral base relative to the fifth lumbar vertebra, restricting anterior sacral nutation."
            },
            {
                question: "During knee evaluation, the tibia displays an abnormal lateral tilt relative to the femur with opening on medial joint stress (cubitus valgus equivalent at the knee), and the tibial plateau resists medial glide. What is the tibial listing?",
                options: ["Abducted Tibia (Valgus)", "Adducted Tibia (Varus)", "Posterior Tibia", "Internal Tibia"],
                correct: 0,
                explanation: "An Abducted Tibia listing represents a valgus malposition of the knee joint with restricted medial glide and stress localized across the medial collateral ligament."
            },
            {
                question: "Evaluation of the patella demonstrates that it is fixed toward the superolateral aspect of the femoral trochlea, resisting inferior and medial glides during extension. What is the patellar listing?",
                options: ["Superior-Lateral Patella", "Superior-Medial Patella", "Inferior-Lateral Patella", "Inferior-Medial Patella"],
                correct: 0,
                explanation: "The patella most frequently displaces superiorly and laterally (Superior-Lateral Patella) due to the lateral pull of the vastus lateralis and the Q-angle vector, resisting inferior and medial translation."
            },
            {
                question: "A runner presents with lateral foot pain. Motion palpation reveals that the cuboid has dropped toward the plantar surface and resists dorsally directed springing. What is the tarsal listing?",
                options: ["Plantar (Inferior) Cuboid", "Dorsal (Superior) Cuboid", "Medial Navicular", "Plantar Cuneiform"],
                correct: 0,
                explanation: "A Plantar (Subluxated/Dropped) Cuboid is the classic cuboid listing, presenting with a prominent bony point on the plantar lateral foot and restricted dorsal mobilization."
            },
            {
                question: "Following an inversion ankle sprain, the distal fibula is tender and palpates prominent anteriorly, resisting posterior glide relative to the distal tibia. What is the fibular listing?",
                options: ["Anterior Distal Fibula", "Posterior Distal Fibula", "Superior Proximal Fibula", "Inferior Distal Fibula"],
                correct: 0,
                explanation: "Inversion sprains with plantarflexion frequently drag the distal fibula anteriorly and inferiorly, locking it in an Anterior Distal Fibula listing that resists posterior drawer glide."
            }
        ];

        let activeQuestions = [];
        let currentAnswers = [];

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function renderQuiz() {
            activeQuestions = shuffleArray(JSON.parse(JSON.stringify(quizData)));
            currentAnswers = new Array(activeQuestions.length).fill(null);

            const container = document.getElementById('quizContainer');
            container.innerHTML = '';

            activeQuestions.forEach((q, index) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `q-card-${index}`;

                let optionsHTML = '';
                q.options.forEach((opt, optIdx) => {
                    optionsHTML += `
                        <button class="option-btn" 
                                id="btn-${index}-${optIdx}" 
                                onclick="selectOption(${index}, ${optIdx})">
                            <span style="font-weight: 700; color: var(--primary-accent); margin-right: 8px;">${String.fromCharCode(65 + optIdx)}.</span> ${opt}
                        </button>
                    `;
                });

                card.innerHTML = `
                    <div class="question-header">Question ${index + 1} of ${activeQuestions.length}</div>
                    <div class="question-text">${q.question}</div>
                    <div class="options-list">${optionsHTML}</div>
                    <div class="explanation-box" id="exp-${index}"></div>
                `;

                container.appendChild(card);
            });

            document.getElementById('scoreDisplay').innerText = `Score: 0 / ${activeQuestions.length} (0%)`;
            document.getElementById('progressBar').style.width = '0%';
        }

        function selectOption(qIdx, selectedOptIdx) {
            if (currentAnswers[qIdx] !== null) return;

            currentAnswers[qIdx] = selectedOptIdx;
            const q = activeQuestions[qIdx];
            const isCorrect = selectedOptIdx === q.correct;

            q.options.forEach((_, optIdx) => {
                const btn = document.getElementById(`btn-${qIdx}-${optIdx}`);
                btn.disabled = true;

                if (optIdx === q.correct) {
                    btn.classList.add('correct-choice');
                } else if (optIdx === selectedOptIdx) {
                    btn.classList.add('incorrect-choice');
                } else {
                    btn.classList.add('dimmed');
                }
            });

            const expBox = document.getElementById(`exp-${qIdx}`);
            expBox.classList.add('visible', isCorrect ? 'correct' : 'incorrect');
            expBox.innerHTML = `<strong>${isCorrect ? '✓ Correct' : '✗ Incorrect'}</strong><br>${q.explanation}`;

            updateScore();
        }

        function updateScore() {
            const answeredCount = currentAnswers.filter(a => a !== null).length;
            const correctCount = currentAnswers.reduce((acc, ans, idx) => {
                return ans === activeQuestions[idx].correct ? acc + 1 : acc;
            }, 0);

            const percentage = Math.round((correctCount / activeQuestions.length) * 100);
            
            document.getElementById('scoreDisplay').innerText = `Score: ${correctCount} / ${activeQuestions.length} (${percentage}%)`;
            document.getElementById('progressBar').style.width = `${(answeredCount / activeQuestions.length) * 100}%`;

            if (answeredCount === activeQuestions.length) {
                showSummary(correctCount, percentage);
            }
        }

        function showSummary(correctCount, percentage) {
            const summaryCard = document.getElementById('summaryCard');
            const finalScore = document.getElementById('finalScore');
            const feedback = document.getElementById('summaryFeedback');

            finalScore.innerText = `${correctCount} / ${activeQuestions.length} (${percentage}%)`;

            if (percentage >= 90) {
                feedback.innerText = "Mastery demonstrated across upper cervical (Atlas/Occiput), pelvic (PI/AS/IN/EX), and peripheral listings!";
            } else if (percentage >= 75) {
                feedback.innerText = "Solid clinical reasoning. Revisit 4-letter atlas rotation and compound ilium listings.";
            } else {
                feedback.innerText = "Review the directional rules for atlas lateral mass overhang and pelvic radiographic landmarks.";
            }

            summaryCard.classList.add('visible');
            summaryCard.scrollIntoView({ behavior: 'smooth' });
        }

        function resetQuiz() {
            document.getElementById('summaryCard').classList.remove('visible');
            renderQuiz();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.onload = renderQuiz;
    </script>
</body>
</html>
