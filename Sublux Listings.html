<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sublux Analysis: Listings & Biomechanics Quiz</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --card-border: #282828;
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent-orange: #ff9900;
            --correct-bg: #14532d;
            --correct-border: #22c55e;
            --incorrect-bg: #7f1d1d;
            --incorrect-border: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px 15px 60px 15px;
            user-select: none;
        }

        .sticky-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(15, 15, 15, 0.96);
            backdrop-filter: blur(8px);
            border-bottom: 2px solid var(--accent-orange);
            padding: 12px 20px;
            max-width: 850px;
            margin: -20px auto 25px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .hub-title {
            font-size: 18px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .hub-badge {
            background-color: var(--accent-orange);
            color: #000;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .score-counter {
            font-size: 15px;
            font-weight: bold;
            color: var(--accent-orange);
            background: #242424;
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid #333;
        }

        .quiz-container {
            max-width: 850px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .question-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: border-color 0.2s;
        }

        .question-card:hover {
            border-color: #383838;
        }

        .q-number {
            font-size: 12px;
            font-weight: bold;
            color: var(--accent-orange);
            text-transform: uppercase;
            margin-bottom: 6px;
            display: block;
        }

        .q-text {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.45;
            margin-bottom: 16px;
            color: #f3f4f6;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 9px;
        }

        .option-btn {
            background-color: #242424;
            border: 1px solid #333;
            color: #e5e7eb;
            padding: 12px 14px;
            border-radius: 6px;
            text-align: left;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.15s, border-color 0.15s;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            line-height: 1.35;
        }

        .option-btn:hover:not(.locked) {
            background-color: #2e2e2e;
            border-color: var(--accent-orange);
        }

        .option-key {
            font-weight: 900;
            color: var(--accent-orange);
            min-width: 18px;
        }

        .option-btn.locked {
            cursor: default;
        }

        .option-btn.correct {
            background-color: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: #ffffff !important;
            font-weight: bold;
        }

        .option-btn.incorrect {
            background-color: var(--incorrect-bg) !important;
            border-color: var(--incorrect-border) !important;
            color: #ffffff !important;
        }

        .explanation-box {
            display: none;
            margin-top: 14px;
            padding: 14px 16px;
            background-color: #121212;
            border-left: 3px solid var(--accent-orange);
            border-radius: 4px;
            font-size: 13.5px;
            line-height: 1.45;
            color: #d1d5db;
        }

        .status-banner {
            font-weight: bold;
            font-size: 15px;
            padding: 6px 10px;
            border-radius: 4px;
            margin-bottom: 10px;
            display: inline-block;
        }
        .status-banner.correct {
            background-color: var(--correct-bg);
            color: #22c55e;
            border: 1px solid var(--correct-border);
        }
        .status-banner.incorrect {
            background-color: var(--incorrect-bg);
            color: #ef4444;
            border: 1px solid var(--incorrect-border);
        }

        .exp-summary {
            margin-bottom: 12px;
            color: #f3f4f6;
        }

        .rationale-list {
            list-style-type: none;
            padding-left: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .rationale-list li {
            font-size: 13px;
            line-height: 1.4;
            color: #9ca3af;
        }
        .rationale-list li strong {
            color: #e5e7eb;
        }
    </style>
</head>

                ],
                correct: 1,
                summary: "As emphasized in lecture, to distinguish an anterior spondylolisthesis from a BP sacrum, you must check L4: in a true L5 spondylolisthesis, L5 is anterior to both S1 and L4 above it. In BP sacrum, L4 and L5 remain aligned while the sacrum alone rocks backward.",
                rationales: [
                    "A) L5 is anterior to S1, but L4 remains aligned with S1: Incorrect. If L4 aligns with S1 while L5 is anterior, it reflects a segmental relationship typical of sacral rocking.",
                    "B) L5 has slipped anterior relative to both S1 and L4: Correct. True spondylolisthesis is confirmed when L5 has anteriorly displaced relative to both the sacrum below and L4 above.",
                    "C) The L5-S1 disc space opens widely in the posterior aspect: Incorrect. Disc space wedging can occur in various mechanical dysfunctions.",
                    "D) The sacral base angle exceeds 60 degrees: Incorrect. Base angle variations measure lumbar lordosis rather than anterolisthesis slippage."
                ]
            }
        ];

        // Fisher-Yates Shuffle
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        let answeredCount = 0;
        let correctCount = 0;

        function updateScore() {
            const total = quizData.length;
            const pct = answeredCount === 0 ? 0 : Math.round((correctCount / answeredCount) * 100);
            document.getElementById('scoreDisplay').textContent = `Score: ${correctCount} / ${answeredCount} (${pct}%)`;
        }

        function renderQuiz() {
            shuffleArray(quizData);
            const container = document.getElementById('quizContainer');
            container.innerHTML = '';

            quizData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `qCard_${index}`;

                const qNum = document.createElement('span');
                qNum.className = 'q-number';
                qNum.textContent = `Question ${index + 1} of ${quizData.length}`;
                card.appendChild(qNum);

                const qText = document.createElement('div');
                qText.className = 'q-text';
                qText.textContent = item.q;
                card.appendChild(qText);

                const optGrid = document.createElement('div');
                optGrid.className = 'options-grid';

                const optKeys = ['A', 'B', 'C', 'D'];
                item.options.forEach((optStr, optIdx) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerHTML = `<span class="option-key">${optKeys[optIdx]}.</span> <span>${optStr}</span>`;

                    btn.addEventListener('click', () => {
                        handleChoice(index, optIdx, card, item);
                    });

                    optGrid.appendChild(btn);
                });

                card.appendChild(optGrid);

                const expBox = document.createElement('div');
                expBox.className = 'explanation-box';
                expBox.id = `exp_${index}`;
                
                const statusBanner = document.createElement('div');
                statusBanner.className = `status-banner ${optIdx === item.correct ? 'correct' : ''}`; // placeholder style updated in handler
                statusBanner.id = `status_${index}`;
                expBox.appendChild(statusBanner);

                const sumDiv = document.createElement('div');
                sumDiv.className = 'exp-summary';
                sumDiv.textContent = item.summary;
                expBox.appendChild(sumDiv);

                const ratList = document.createElement('ul');
                ratList.className = 'rationale-list';
                item.rationales.forEach(rat => {
                    const li = document.createElement('li');
                    li.textContent = rat;
                    ratList.appendChild(li);
                });
                expBox.appendChild(ratList);

                card.appendChild(expBox);

                container.appendChild(card);
            });

            updateScore();
        }

        function handleChoice(qIdx, chosenIdx, cardElement, item) {
            const buttons = cardElement.querySelectorAll('.option-btn');
            if (buttons[0].classList.contains('locked')) return; // already answered

            buttons.forEach(btn => btn.classList.add('locked'));

            answeredCount++;
            const isCorrect = (chosenIdx === item.correct);
            if (isCorrect) {
                correctCount++;
                buttons[chosenIdx].classList.add('correct');
            } else {
                buttons[chosenIdx].classList.add('incorrect');
                buttons[item.correct].classList.add('correct');
            }

            const statusEl = cardElement.querySelector(`#status_${qIdx}`);
            if (isCorrect) {
                statusEl.className = 'status-banner correct';
                statusEl.textContent = 'Correct!';
            } else {
                statusEl.className = 'status-banner incorrect';
                statusEl.textContent = 'Incorrect.';
            }

            const exp = document.getElementById(`exp_${qIdx}`);
            exp.style.display = 'block';

            updateScore();
        }

        window.onload = renderQuiz;
    </script>
</body>
</html>
