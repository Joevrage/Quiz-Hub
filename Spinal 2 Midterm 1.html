const questionBank=[
// ---- Quarter 1 (slides 1-12)
Q(1,1,3,'easy',true,'The upper trapezius is innervated primarily by the _______ nerve.',[
['dorsal scapular','Incorrect: the dorsal scapular nerve (C5) feeds levator scapula and the rhomboids, not trapezius.'],

['Spine of the scapula','Incorrect: the spine of the scapula is a trapezius insertion.'],
['Intertubercular groove of the humerus','Correct: latissimus dorsi inserts on the medial intertubercular groove of the humerus.'],

['Lateral third of the clavicle','Incorrect: the lateral clavicle is a trapezius insertion.']],1),
Q(3,1,6,'medium',false,'Levator scapula attaches to the transverse processes of which vertebrae?',[

Q(5,1,10,'medium',false,'Splenius capitis inserts on the:',[

Q(6,1,7,'hard',true,'Which muscle attaches SP C7-T1, retracts the scapula, and rotates the glenoid cavity inferiorly?',[
['Trapezius','Incorrect: trapezius rotates the scapula superiorly, the opposite rotation.'],

Q(7,2,13,'medium',true,'Serratus posterior superior elevates the ribs during:',[

Q(8,2,14,'easy',false,'Serratus posterior inferior inserts on which ribs?',[
['Ribs 2-5','Incorrect: ribs 2-5 are the superior serratus insertion.'],

Q(9,2,16,'medium',false,'Iliocostalis lumborum inserts on the:',[

Q(10,2,17,'medium',true,'Iliocostalis thoracis originates on the _______ and inserts on the _______.',[

Q(11,2,20,'medium',false,'Longissimus thoracis inserts on the transverse processes of T1-T12 and:',[

['SP T4-T7','Incorrect: SP T4-T7 is the spinalis insertion.']],0),

['inferior nuchal line','Incorrect: the inferior nuchal line is a suboccipital attachment.'],
['occipital region between the nuchal lines','Incorrect: that is the semispinalis capitis insertion.'],
['mastoid process','Correct: longissimus capitis (articular processes C4-C7, TP T1-T5) inserts on the mastoid.'],
['transverse process of C1','Incorrect: TP C1 is the oblique capitis superior origin.']],2),
Q(13,2,24,'medium',false,'Spinalis thoracis originates on SP T11-L2 and inserts on:',[

['ribs 3-12','Incorrect: that is longissimus thoracis.'],
['the mastoid process','Incorrect: spinalis thoracis does not reach the skull.'],
['TP C4-C6','Incorrect: that is iliocostalis cervicis.']],0),

Q(14,3,25,'easy',true,'Which erector spinae muscle may be absent?',[

['Iliocostalis lumborum','Incorrect: iliocostalis lumborum is a consistent muscle.']],0),
Q(15,3,28,'medium',false,'Semispinalis thoracis runs from the transverse processes of T7-T12 to the spinous processes of:',[

Q(16,3,30,'hard',true,'Contraction of the right semispinalis capitis rotates the head toward which side, and why?',[

Q(17,3,32,'medium',true,'Multifidus inserts how many segments above its origin?',[

['2','Incorrect: two segments is rotatores longus.'],
['3-4','Correct: multifidus spans 3-4 segments above its origin.'],
['5-6','Incorrect: no transversospinalis muscle in this set uses 5-6 segments.']],2),
Q(18,3,34,'hard',true,'Ranked from most to fewest segments spanned above the origin, which order is correct?',[
['Rotatores brevis, rotatores longus, multifidus','Incorrect: this order is inverted.'],
['Rotatores longus, multifidus, rotatores brevis','Incorrect: multifidus (3-4) spans more than longus (2).'],
['Multifidus, rotatores brevis, rotatores longus','Incorrect: brevis (1) spans fewer than longus (2).'],
['Multifidus, rotatores longus, rotatores brevis','Correct: multifidus 3-4, rotatores longus 2, rotatores brevis 1.']],3),
Q(19,3,35,'medium',false,'Rotatores brevis produces which actions?',[

['Ipsilateral rotation and flexion','Incorrect: rotation is contralateral and there is no flexion.']],0),
// ---- Quarter 4 (slides 37-47)
Q(20,4,38,'hard',true,'Intertransversarii are innervated by _______ rami, except the medial lumbar muscles, which receive _______ rami.',[
['ventral; dorsal','Correct: ventral rami, except medial lumbar (dorsal rami).'],
['dorsal; ventral','Incorrect: the pattern is inverted.'],
['dorsal; dorsal','Incorrect: most intertransversarii are ventral-ramus muscles.'],
['ventral; ventral','Incorrect: the medial lumbar exception is dorsal.']],0),
Q(21,4,40,'easy',false,'Rectus capitis posterior minor arises from the posterior tubercle of C1 and produces:',[
['extension of the head','Correct: it extends the head.'],
['ipsilateral rotation of the head','Incorrect: that is rectus capitis posterior major.'],
['flexion of the head','Incorrect: it lies posterior, so it cannot flex.'],
['rotation of C1','Incorrect: that is oblique capitis inferior.']],0),
Q(22,4,41,'medium',true,'Which suboccipital muscle arises from SP C2, inserts on the inferior nuchal line, and extends and ipsilaterally rotates the head?',[

Q(23,4,43,'hard',true,'Which suboccipital muscle does NOT attach to the skull?',[

['Oblique capitis superior','Incorrect: it inserts between the nuchal lines.'],
['Oblique capitis inferior','Correct: OCI runs from SP C2 to TP C1 and rotates C1 ipsilaterally.']],3),
Q(24,4,44,'medium',false,'Which meningeal layer directly hugs the surface of the spinal cord?',[

['Denticulate ligament','Incorrect: it is an extension of pia mater, not a layer.']],2),
Q(25,4,45,'medium',false,'The filum terminale is an extension of which structure that tethers the conus medullaris?',[
['Dura mater','Incorrect: the filum is not dura.'],
['Pia mater','Correct: it is a pia mater extension anchoring the cord inferiorly.'],
['Cauda equina nerve roots','Incorrect: it is not a nerve.'],
['Arachnoid mater','Incorrect: the filum is not arachnoid.']],1),
Q(26,4,46,'medium',true,'Denticulate ligaments are extensions of the:',[
['dura mater','Incorrect: dura attaches to bones and muscles.'],
['arachnoid mater','Incorrect: arachnoid forms trabecular web-like tissue.'],
['filum terminale','Incorrect: the filum anchors the cord inferiorly.'],
['pia mater','Correct: denticulate ligaments suspend the cord as pia extensions.']],3),
Q(27,1,4,'easy',true,'The thoracolumbar fascia is synonymous with the _______ fascia.',[['lumbodorsal','Correct: thoracolumbar, thoracodorsal, lumbar dorsal and lumbodorsal fascia are the same low-back sheet and the latissimus dorsi origin.'],['palmar','Incorrect: the palmar fascia is in the hand.'],['nuchal','Incorrect: the nuchal ligament lies in the neck.'],['plantar','Incorrect: the plantar fascia is in the foot.']],0),
Q(28,1,3,'medium',true,'Trapezius arises from the spinous processes of:',[['C7-T12','Correct: trapezius spans SP C7-T12 plus the nuchal ligament and EOP.'],['C7-T6','Incorrect: this stops short of T12.'],['T7-L5','Incorrect: that is latissimus dorsi.'],['T2-T5','Incorrect: that is rhomboid major.']],0),
Q(29,1,4,'medium',true,'Latissimus dorsi produces which humeral actions?',[['Flexion, lateral rotation, abduction','Incorrect: each action is the opposite of the real one.'],['Extension, medial rotation, adduction','Correct: latissimus dorsi extends, medially rotates and adducts the humerus.'],['Extension, lateral rotation, abduction','Incorrect: rotation is medial and movement is adduction.'],['Flexion, medial rotation, adduction','Incorrect: the muscle extends, not flexes.']],1),
Q(30,1,6,'hard',true,'Which muscle is NOT primarily supplied by the dorsal scapular nerve (C5)?',[['Levator scapula','Incorrect: levator scapula is a dorsal scapular nerve muscle.'],['Rhomboid minor','Incorrect: rhomboid minor is a dorsal scapular nerve muscle.'],['Rhomboid major','Incorrect: rhomboid major is a dorsal scapular nerve muscle.'],['Trapezius','Correct: trapezius is supplied by CN XI, the spinal accessory nerve.']],3),
Q(31,1,11,'medium',false,'Splenius cervicis attaches to the spinous processes of T3-T6 and the:',[['transverse processes of C1-C4','Correct: cervicis stops at the cervical vertebrae.'],['mastoid process','Incorrect: that is splenius capitis.'],['superior nuchal line','Incorrect: that is splenius capitis.'],['ribs 2-5','Incorrect: that is serratus posterior superior.']],0),
Q(32,1,10,'medium',false,'Splenius capitis rotates the head:',[['contralaterally','Incorrect: the splenii are ipsilateral rotators.'],['ipsilaterally','Correct: splenius capitis extends, laterally flexes and ipsilaterally rotates the head.'],['not at all','Incorrect: rotation is a listed action.'],['only with the opposite side','Incorrect: ipsilateral rotation is its own action.']],1),
Q(33,2,14,'medium',false,'Serratus posterior inferior is innervated by the:',[['dorsal rami of C1','Incorrect: that is the suboccipital nerve.'],['dorsal scapular nerve','Incorrect: that supplies scapular muscles.'],['ventral rami of T9-T12','Correct: SPI is fed by the ventral rami of the lower thoracic nerves.'],['spinal accessory nerve','Incorrect: that supplies trapezius.']],2),
Q(34,2,16,'easy',true,'Erector spinae muscles are innervated by the _______ rami of spinal nerves.',[['dorsal','Correct: all erector spinae components are fed by dorsal rami.'],['ventral','Incorrect: ventral rami feed the serratus posteriors.'],['anterior primary','Incorrect: that is the ventral ramus.'],['sinuvertebral','Incorrect: that nerve is not an erector spinae supply.']],0),

let hist={};try{hist=JSON.parse(localStorage.getItem('quiz_missed_history')||'{}')}catch(e){}
const saveHistory=()=>{try{localStorage.setItem('quiz_missed_history',JSON.stringify(hist))}catch(e){}};
let selectedSubjects=new Set(SUBJECTS.map((_,i)=>i)),prioritizeMissed=false;
let quizQuestions=[],userAnswers=[],currentIndex=0,score=0,popupTimeout=null,muted=false;
try{muted=localStorage.getItem('stfuErijah')==='1'}catch(e){}
const $=id=>document.getElementById(id);
function updateStfuButton(){const b=$('stfuBtn');b.textContent=muted?'Bring Back Erijah':'STFU Erijah';b.classList.toggle('muted',muted);
if(muted){const a=$('wrongAudio');if(a){a.pause();a.currentTime=0}if(popupTimeout)clearTimeout(popupTimeout);$('wrongPopup').classList.add('hidden')}}
function toggleStfu(){muted=!muted;try{localStorage.setItem('stfuErijah',muted?'1':'0')}catch(e){}updateStfuButton()}
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const getFilteredPool=()=>questionBank.filter(q=>selectedSubjects.has(q.subjectIndex));
const missedCount=()=>questionBank.filter(q=>hist[q.id]>0).length;
function toggleSubject(i){selectedSubjects.has(i)?selectedSubjects.delete(i):selectedSubjects.add(i);renderHome()}
function selectAllSubjects(all){selectedSubjects=all?new Set(SUBJECTS.map((_,i)=>i)):new Set();renderHome()}
function togglePrio(){prioritizeMissed=!prioritizeMissed;renderHome()}
function setHeader(){const n=quizQuestions.length,a=userAnswers.filter(x=>x!==null).length;
$('q-display').textContent=n?'Question '+Math.min(currentIndex+1,n)+' of '+n:'Question 0 of 0';
$('score-display').textContent='Score: '+score+' / '+a+' ('+(a?Math.round(score/a*100):0)+'%)';
$('progress-bar').style.width=(n?a/n*100:0)+'%'}
function renderHome(){
quizQuestions=[];userAnswers=[];currentIndex=0;score=0;setHeader();$('wrongPopup').classList.add('hidden');
const pool=getFilteredPool();
const chips=SUBJECTS.map((s,i)=>'<span class="chip '+(selectedSubjects.has(i)?'on':'')+'" onclick="toggleSubject('+i+')">'+s+' ('+questionBank.filter(q=>q.subjectIndex===i).length+')</span>').join('');
$('main').innerHTML='<div class="card"><h2>Select Subjects</h2><div class="chips">'+chips+'</div>'+
'<button class="btn" onclick="selectAllSubjects(true)">Select All</button><button class="btn" onclick="selectAllSubjects(false)">Clear</button>'+
'<button class="btn '+(prioritizeMissed?'pri':'')+'" onclick="togglePrio()">Prioritize Missed ('+missedCount()+')</button>'+
'<div class="counter">'+pool.length+' questions across '+selectedSubjects.size+' subjects selected</div></div>'+
'<div class="card"><h2>Launch</h2><div class="grid">'+[15,25,35,50].map(n=>'<button class="btn pri" onclick="startQuiz('+n+')">'+(n===50?'Full Exam (50 Qs)':'Quickie ('+n+' Qs)')+'</button>').join('')+
'<button class="btn pri" onclick="startQuiz(0)">Entire Selected Bank ('+pool.length+')</button></div></div>'}
function prep(list){return list.map(q=>{const c=JSON.parse(JSON.stringify(q));shuffle(c.options);return c})}
function startQuiz(count){
const pool=getFilteredPool();if(!pool.length)return;
const target=count?Math.min(count,pool.length):pool.length;let drawn=[];
if(prioritizeMissed){let copy=pool.slice();while(drawn.length<target&&copy.length){const w=copy.map(q=>1+3*(hist[q.id]||0));let r=Math.random()*w.reduce((a,b)=>a+b,0),k=0;while(r>w[k]&&k<copy.length-1){r-=w[k];k++}drawn.push(copy.splice(k,1)[0])}}
else drawn=shuffle(pool.slice()).slice(0,target);
quizQuestions=prep(drawn);userAnswers=new Array(quizQuestions.length).fill(null);currentIndex=0;score=0;renderQuestion()}
function renderQuestion(){
const q=quizQuestions[currentIndex];setHeader();$('wrongPopup').classList.add('hidden');
$('main').innerHTML='<div class="card" id="card"><div class="badges"><span class="badge">'+SUBJECTS[q.subjectIndex]+'</span><span class="badge g">'+q.difficulty+'</span>'+(q.priority?'<span class="badge">High-yield</span>':'')+'</div><div class="stem">'+q.stem+'</div>'+
q.options.map((o,i)=>'<button class="option-btn" onclick="selectOption('+i+')">'+'ABCD'[i]+'. '+o.text+'</button>').join('')+'</div>';window.scrollTo({top:0})}
function selectOption(oi){
const q=quizQuestions[currentIndex];if(userAnswers[currentIndex]!==null)return;
const ok=q.options[oi].correct;userAnswers[currentIndex]=oi;
document.querySelectorAll('.option-btn').forEach((b,bi)=>{b.disabled=true;if(q.options[bi].correct)b.classList.add('correct');else if(bi===oi)b.classList.add('incorrect');else b.classList.add('dim')});
q._ok=ok;
if(ok){score++;if(hist[q.id]){hist[q.id]--;if(!hist[q.id])delete hist[q.id]}}
else{hist[q.id]=(hist[q.id]||0)+1;
if(!muted){const wa=$('wrongAudio');if(wa){wa.currentTime=0;wa.play().catch(e=>console.log('Audio play blocked:',e))}
const p=$('wrongPopup');p.classList.remove('hidden');clearTimeout(popupTimeout);popupTimeout=setTimeout(()=>p.classList.add('hidden'),2000)}}
saveHistory();
const last=currentIndex===quizQuestions.length-1;
const e=document.createElement('div');e.className='expl';
e.innerHTML='<div class="status '+(ok?'ok':'bad')+'">'+(ok?'Correct!':'Incorrect.')+'</div><div class="core"><b>Core Concept:</b> '+q.options.find(o=>o.correct).why+'</div><ul>'+
q.options.map((o,i)=>'<li><b>'+'ABCD'[i]+'.</b> '+o.text+' &mdash; '+o.why+'</li>').join('')+'</ul><button class="btn pri" onclick="next()">'+(last?'Finish':'Next')+'</button>';
$('card').appendChild(e);setHeader()}
function next(){if(currentIndex>=quizQuestions.length-1)return showSummary();currentIndex++;renderQuestion()}
function showSummary(){
const n=quizQuestions.length,pct=Math.round(score/n*100);
const msg=pct>=90?'Absolute Gigachad. You drained that test dry.':pct>=70?'You lasted less than 30 seconds. Time for a rematch.':'You really didn’t fucking know that.';
const rows=['easy','medium','hard'].map(d=>{const a=quizQuestions.filter(q=>q.difficulty===d);return a.length?'<tr><td>'+d+'</td><td>'+a.filter(q=>q._ok).length+' / '+a.length+'</td></tr>':''}).join('');
const sr=SUBJECTS.map((s,i)=>{const a=quizQuestions.filter(q=>q.subjectIndex===i);return a.length?'<tr><td>'+s+'</td><td>'+a.filter(q=>q._ok).length+' / '+a.length+'</td></tr>':''}).join('');
$('progress-bar').style.width='100%';
$('main').innerHTML='<div class="card sum"><h2>'+pct+'%</h2><p>'+score+' / '+n+' correct</p><p>'+msg+'</p><table><tr><th>Difficulty</th><th>Correct</th></tr>'+rows+'</table><table><tr><th>Subject</th><th>Correct</th></tr>'+sr+'</table>'+
'<button class="btn pri" onclick="retake()">Retake Quiz</button><button class="btn pri" onclick="reviewMissed()">Review Missed</button><button class="btn" onclick="renderHome()">Back to Menu</button></div>';window.scrollTo({top:0})}
function retake(){const ids=quizQuestions.map(q=>q.id);quizQuestions=prep(shuffle(questionBank.filter(q=>ids.includes(q.id))));userAnswers=new Array(quizQuestions.length).fill(null);currentIndex=0;score=0;renderQuestion()}
function reviewMissed(){const ids=quizQuestions.filter(q=>!q._ok).map(q=>q.id);if(!ids.length){alert('Nothing missed. Nice.');return}
quizQuestions=prep(questionBank.filter(q=>ids.includes(q.id)));userAnswers=new Array(quizQuestions.length).fill(null);currentIndex=0;score=0;renderQuestion()}
window.onload=()=>{$('stfuBtn').addEventListener('click',toggleStfu);$('menuBtn').addEventListener('click',renderHome);updateStfuButton();renderHome()};
</script></body></html>
