<script>
const STORAGE_KEY = 'reg1_midterm_master_history_v5';

const SUBJECTS = [
  "Posterior Shoulder Muscles & Scapular Motions",   // 0
  "Scapulohumeral Muscles & Rotator Cuff",           // 1
  "Pectoral Region & Thoracic Wall",                  // 2
  "Arm Compartments & Biceps/Triceps",                // 3
  "Anterior Forearm: Flexor-Pronators",               // 4
  "Posterior Forearm & Anatomical Snuffbox",          // 5
  "Hand Intrinsics, Compartments & Carpal Tunnel",    // 6
  "Brachial Plexus & Peripheral Nerves",              // 7
  "Arteries, Veins & Axillary Spaces",                // 8
  "Elbow Ligaments, Entrapments & Thoracic Outlet"    // 9
];
const SUBJECT_QUARTER = [1, 1, 1, 2, 2, 2, 3, 3, 4, 4];

/* Builder: first option listed is the correct one; options are shuffled at quiz time. */
let _id = 0;
const RAW = [];
function Q(sub, d, p, stem, concept, o) {
  _id++;
  RAW.push({ id: _id, subjectIndex: sub, difficulty: { e: "easy", m: "medium", h: "hard" }[d], priority: !!p, stem, concept,
    options: o.map((x, i) => ({ text: x[0], correct: i === 0, why: x[1] })) });
}
function finalize(arr) {
  const sorted = arr.slice().sort((a, b) => a.subjectIndex - b.subjectIndex || a.id - b.id);
  return sorted.map((q, i) => {
    const slide = i + 1;
    return { id: q.id, subjectIndex: q.subjectIndex, quarter: SUBJECT_QUARTER[q.subjectIndex], slideRef: slide,
      difficulty: q.difficulty, priority: q.priority, stem: q.stem, concept: q.concept,
      options: q.options.map(o => ({ text: o.text, correct: o.correct, why: o.why + " [Slide #" + slide + "]" })) };
  });
}

/* ===== MODULE 0: POSTERIOR AXIO-APPENDICULAR & SCAPULAR MOTIONS ===== */
Q(0,"e",1,"Which two muscles form the superficial layer of the posterior axio-appendicular group?","The trapezius and latissimus dorsi are the superficial extrinsic muscles, lying over the levator scapulae and rhomboids.",[
["Trapezius and latissimus dorsi","Both are broad superficial extrinsic muscles joining the trunk to the shoulder girdle."],
["Levator scapulae and rhomboids","These form the deep layer of the posterior axio-appendicular group."],
["Deltoid and teres major","These are scapulohumeral muscles."],
["Pectoralis major and subclavius","These belong to the anterior axio-appendicular group."]]);
Q(0,"e",1,"The trapezius is motorically innervated by the _______ nerve.","The trapezius is supplied by the spinal accessory nerve (CN XI), the nerve lesioned in shoulder drooping.",[
["spinal accessory","CN XI supplies the trapezius."],
["thoracodorsal","The thoracodorsal nerve supplies the latissimus dorsi."],
["dorsal scapular","The dorsal scapular nerve supplies the rhomboids and levator scapulae."],
["long thoracic","The long thoracic nerve supplies the serratus anterior."]]);
Q(0,"m",1,"The trapezius arises from the superior nuchal line, external occipital protuberance, nuchal ligament, and spinous processes of _______.","The trapezius origin runs from the skull down to T12; the lumbar origins belong to the latissimus dorsi.",[
["C7-T12","The trapezius origin ends at T12."],
["L1-L5","Lumbar spinous processes contribute to the latissimus dorsi, not the trapezius."],
["C1-C4","C1-C4 transverse processes give rise to the levator scapulae."],
["S1-S3","Sacral attachments belong to the thoracolumbar fascia and latissimus dorsi."]]);
Q(0,"m",1,"Assuming the vertebral column is fixed and the scapula is free to move, contraction of the middle fibers of the trapezius produces which motion?","The horizontal middle fibers pull the scapula toward the spine, producing retraction.",[
["Retraction","Middle fibers run horizontally from the spinous processes to the scapular spine."],
["Protraction","Protraction is produced by the serratus anterior and pectoralis minor."],
["Depression","Depression is produced by the ascending fibers."],
["Elevation","Elevation is produced by the descending fibers."]]);
Q(0,"m",1,"Which scapular movement results when the descending and ascending trapezius fibers contract together?","The two fiber groups act together to rotate the glenoid cavity superiorly.",[
["Superior rotation of the glenoid","The opposing pulls on the acromion and the scapular spine rotate the glenoid upward."],
["Inferior rotation of the glenoid","Inferior rotation is produced by the rhomboids."],
["Protraction of the scapula","Protraction is produced by the serratus anterior and pectoralis minor."],
["Elevation of the scapula","Elevation is produced by the descending fibers alone."]]);
Q(0,"m",1,"Assuming the trunk is stabilized and the humerus is free to move, contraction of the latissimus dorsi produces which set of motions?","The latissimus dorsi extends, adducts, and medially rotates the humerus.",[
["Extension, adduction, and medial rotation","The lat pulls the humerus back, toward the trunk, and rotates it inward."],
["Flexion, abduction, and lateral rotation","These are the opposite of the lat actions."],
["Extension, abduction, and medial rotation","The lat adducts the humerus; it does not abduct it."],
["Flexion, adduction, and lateral rotation","The lat extends and medially rotates the humerus."]]);
Q(0,"m",1,"When the upper extremities are fixed on an overhead bar, contraction of the latissimus dorsi produces which action?","With the humerus fixed, the latissimus dorsi pulls the trunk upward toward the arms, as in climbing.",[
["Raising the body toward the arms","With the humerus fixed, the lat lifts the trunk during climbing."],
["Lowering the body away from the arms","Contraction pulls the trunk toward the fixed arms, not away."],
["Elevating the scapula","Scapular elevation is a trapezius and levator scapulae action."],
["Laterally rotating the humerus","The lat is a medial rotator."]]);
Q(0,"e",0,"The latissimus dorsi is innervated by the _______ nerve.","The latissimus dorsi is supplied by the thoracodorsal nerve (C6-C8), a posterior cord branch.",[
["thoracodorsal","Thoracic plus dorsum (back) identifies this nerve."],
["dorsal scapular","The dorsal scapular nerve supplies the rhomboids and levator scapulae."],
["long thoracic","The long thoracic nerve supplies the serratus anterior."],
["lower subscapular","The lower subscapular nerve supplies the teres major and subscapularis."]]);
Q(0,"m",0,"The levator scapulae originates from which vertebral landmarks?","The levator scapulae arises from the transverse processes of C1-C4.",[
["Transverse processes of C1-C4","These upper cervical processes are its origin."],
["Spinous processes of C7-T1","These give rise to the rhomboid minor."],
["Spinous processes of T2-T5","These give rise to the rhomboid major."],
["Spinous processes of T7-L5","These give rise to the latissimus dorsi."]]);
Q(0,"m",1,"Assuming the cervical spine is stabilized and the scapula is free to move, contraction of the levator scapulae produces which motion?","With the neck fixed, the levator scapulae elevates the scapula.",[
["Elevation of the scapula","It lifts the scapula toward its cervical origin."],
["Depression of the scapula","Depression is produced by the ascending trapezius and pectoralis minor."],
["Superior rotation of the glenoid","Superior rotation is produced by the trapezius."],
["Protraction of the scapula","Protraction is produced by the serratus anterior and pectoralis minor."]]);
Q(0,"m",1,"Which origin rule distinguishes the rhomboid minor from the rhomboid major?","Minor over major refers to superior versus inferior origin: minor from C7-T1, major from T2-T5.",[
["Minor arises from C7-T1; major arises from T2-T5","The minor has the more superior origin."],
["Minor arises from T2-T5; major arises from C7-T1","This inverts the origins."],
["Minor is supplied by the long thoracic nerve; major by the dorsal scapular nerve","Both rhomboids are supplied by the dorsal scapular nerve."],
["Minor arises from the ribs; major arises from the vertebrae","Both arise from vertebral spinous processes."]]);
Q(0,"h",1,"Which muscle pair retracts the scapula, rotates the glenoid cavity inferiorly, and is supplied by the dorsal scapular nerve?","The rhomboids retract the scapula and rotate the glenoid inferiorly; both receive the dorsal scapular nerve.",[
["Rhomboid major and rhomboid minor","They share the nerve supply and both actions."],
["Middle trapezius and levator scapulae","The trapezius is supplied by CN XI and the middle fibers do not rotate inferiorly."],
["Serratus anterior and pectoralis minor","These protract the scapula."],
["Latissimus dorsi and teres major","These act on the humerus, not the glenoid."]]);
Q(0,"m",0,"Which two muscles act together to produce protraction of the scapula?","The serratus anterior and pectoralis minor pull the scapula forward around the rib cage.",[
["Serratus anterior and pectoralis minor","Both pull the scapula anteriorly along the thoracic wall."],
["Rhomboid major and rhomboid minor","The rhomboids retract the scapula."],
["Middle trapezius and levator scapulae","The middle trapezius retracts and the levator elevates."],
["Ascending trapezius and latissimus dorsi","These produce depression and adduction, not protraction."]]);
Q(0,"h",1,"Which muscle originates from the same bony sites where the trapezius inserts?","The trapezius inserts on the spine of the scapula, acromion, and lateral third of the clavicle, the same sites that give rise to the deltoid.",[
["Deltoid","It arises from the scapular spine, acromion, and lateral third of the clavicle."],
["Supraspinatus","It arises from the supraspinous fossa, not the spine or acromion."],
["Levator scapulae","It arises from the C1-C4 transverse processes."],
["Pectoralis major","It arises from the medial clavicle, sternum, and ribs."]]);

/* ===== MODULE 1: SCAPULOHUMERAL & ROTATOR CUFF ===== */
Q(1,"e",1,"All three portions of the deltoid converge to insert on the _______ of the humerus.","The anterior, middle, and posterior deltoid share one insertion on the deltoid tuberosity.",[
["deltoid tuberosity","This landmark is named for the muscle that attaches to it."],
["greater tubercle","The greater tubercle receives three rotator cuff muscles."],
["lesser tubercle","The lesser tubercle receives the subscapularis."],
["intertubercular groove","The groove receives the pectoralis major, latissimus dorsi, and teres major."]]);
Q(1,"m",1,"Assuming the pectoral girdle is fixed and the humerus is free to move, contraction of the anterior deltoid fibers produces which motion?","The anterior deltoid flexes the humerus, the middle abducts, and the posterior extends.",[
["Flexion","The anterior fibers pass in front of the joint axis."],
["Extension","Extension is produced by the posterior fibers."],
["Abduction","Abduction is produced mainly by the middle fibers."],
["Adduction","The deltoid does not adduct the humerus."]]);
Q(1,"e",0,"The deltoid is innervated by the _______ nerve.","The deltoid and teres minor are supplied by the axillary nerve (C5-C6).",[
["axillary","The axillary nerve passes through the quadrangular space to the deltoid."],
["suprascapular","It supplies the supraspinatus and infraspinatus."],
["dorsal scapular","It supplies the rhomboids and levator scapulae."],
["thoracodorsal","It supplies the latissimus dorsi."]]);
Q(1,"m",0,"Teres major inserts on which part of the humerus?","The teres major inserts on the medial portion of the intertubercular groove alongside the latissimus dorsi.",[
["Medial portion of the intertubercular groove","It attaches medially, beside the latissimus dorsi."],
["Lateral portion of the intertubercular groove","The lateral portion receives the pectoralis major."],
["Lesser tubercle","The lesser tubercle receives the subscapularis."],
["Greater tubercle","The greater tubercle receives three rotator cuff muscles."]]);
Q(1,"e",1,"Which muscle is NOT part of the rotator cuff (SITS) group?","The cuff is the supraspinatus, infraspinatus, teres minor, and subscapularis; the teres major is not included.",[
["Teres major","It inserts lower on the humerus and is not a cuff muscle."],
["Teres minor","It is the T in SITS."],
["Infraspinatus","It is the I in SITS."],
["Subscapularis","It is the second S in SITS."]]);
Q(1,"m",1,"Which rotator cuff muscle arises superior to the scapular spine and abducts the humerus?","The supraspinatus occupies the supraspinous fossa and abducts the humerus.",[
["Supraspinatus","It lies in the supraspinous fossa above the spine."],
["Infraspinatus","It lies below the spine and laterally rotates."],
["Subscapularis","It lies on the anterior subscapular fossa."],
["Teres minor","It arises from the lateral border below the spine."]]);
Q(1,"h",1,"Which pairing of rotator cuff muscle and humeral attachment is correct?","From superior to inferior, the greater tubercle receives the supraspinatus, infraspinatus, and teres minor; the subscapularis takes the lesser tubercle.",[
["Infraspinatus: middle facet of the greater tubercle","The infraspinatus attaches to the middle facet."],
["Supraspinatus: inferior facet of the greater tubercle","The supraspinatus attaches to the superior facet."],
["Teres minor: superior facet of the greater tubercle","The teres minor attaches to the inferior facet."],
["Subscapularis: middle facet of the greater tubercle","The subscapularis attaches to the lesser tubercle."]]);
Q(1,"m",0,"Which nerve supplies both the supraspinatus and the infraspinatus?","The suprascapular nerve (C5-C6) supplies both muscles, which abduct and laterally rotate the humerus.",[
["Suprascapular nerve","It supplies both spinati."],
["Axillary nerve","It supplies the deltoid and teres minor."],
["Dorsal scapular nerve","It supplies the rhomboids and levator scapulae."],
["Upper subscapular nerve","It supplies the subscapularis."]]);
Q(1,"h",1,"Which muscle laterally rotates the humerus and is innervated by the axillary nerve?","The teres minor laterally rotates the humerus and is the cuff muscle supplied by the axillary nerve.",[
["Teres minor","It is an external rotator supplied by the axillary nerve."],
["Infraspinatus","It also laterally rotates but is supplied by the suprascapular nerve."],
["Teres major","It medially rotates and is supplied by the lower subscapular nerve."],
["Deltoid","It is axillary-supplied but does not laterally rotate."]]);
Q(1,"e",1,"The subscapularis is the only rotator cuff muscle that inserts on the _______ of the humerus.","The subscapularis inserts on the lesser tubercle and medially rotates the humerus.",[
["lesser tubercle","It attaches anteriorly."],
["superior facet of the greater tubercle","This receives the supraspinatus."],
["middle facet of the greater tubercle","This receives the infraspinatus."],
["inferior facet of the greater tubercle","This receives the teres minor."]]);
Q(1,"m",0,"The subscapularis receives motor innervation from which nerves?","The subscapularis is a dual-supplied muscle: upper and lower subscapular nerves.",[
["Upper and lower subscapular nerves","Both posterior cord branches reach it."],
["Suprascapular nerve alone","It supplies the supraspinatus and infraspinatus."],
["Thoracodorsal and axillary nerves","These supply the latissimus dorsi, deltoid, and teres minor."],
["Dorsal scapular and long thoracic nerves","These supply the rhomboids and serratus anterior."]]);
Q(1,"m",1,"Which rotator cuff tendon is most commonly ruptured?","The supraspinatus tendon is the most commonly ruptured cuff tendon.",[
["Supraspinatus","It supports the top of the humerus and bears much of the arm's weight."],
["Infraspinatus","It is ruptured less often."],
["Teres minor","It is ruptured less often."],
["Subscapularis","It is ruptured less often."]]);
Q(1,"m",0,"Rotator cuff problems such as frozen shoulder have been increasingly reported in which group?","Cuff issues and frozen shoulder are increasingly reported in perimenopausal and menopausal women; the cause is not yet known.",[
["Women in perimenopause and menopause","Reports cluster in women in their late 30s through 60s."],
["Adolescent male athletes","Degenerative cuff problems are not typical of this group."],
["Children under ten","Degenerative cuff problems do not occur here."],
["Men under twenty-five","Degenerative cuff problems are typical of older patients."]]);

/* ===== MODULE 2: PECTORAL REGION & THORACIC WALL ===== */
Q(2,"e",0,"The anterior axio-appendicular group includes the pectoralis major, pectoralis minor, serratus anterior, and the _______.","The four anterior axio-appendicular muscles are the pectoralis major and minor, subclavius, and serratus anterior.",[
["subclavius","It runs from rib 1 to the clavicle."],
["deltoid","It is a scapulohumeral muscle."],
["teres major","It is a scapulohumeral muscle."],
["latissimus dorsi","It is a posterior axio-appendicular muscle."]]);

Q(9,"m",1,"Which thoracic outlet syndrome type is most common, and which is least common?","Neurogenic is the most common type; arterial is the least common because the tunica media keeps the artery open.",[
["Neurogenic is most common; arterial is least common","The tunica media resists arterial compression."],
["Arterial is most common; neurogenic is least common","This inverts the prevalence."],
["Venous is most common; neurogenic is least common","Neurogenic is the most common."],
["All types occur equally often","Prevalence differs."]]);
Q(9,"m",1,"Which pairing of thoracic outlet syndrome type and sign is correct?","Venous compression causes bluish color and swelling; arterial compression causes pallor and coldness.",[
["Venous: bluish color and swelling; arterial: pallor and coldness","Veins back up while arteries lose flow."],
["Venous: pallor and coldness; arterial: bluish color and swelling","This inverts the signs."],
["Neurogenic: bluish color and swelling","Neurogenic causes pain, tingling, and numbness."],
["Neurogenic: pallor and coldness","Neurogenic causes pain, tingling, and numbness."]]);


const questionBank = finalize(RAW);

/* ----------------- State & Storage Engine ----------------- */
let hist = {};
try { hist = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch (e) {}
const saveHistory = () => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(hist)); } catch (e) {} };

let selectedSubjects = new Set(SUBJECTS.map((_, i) => i));
let prioritizeMissed = false;
let quizQuestions = [];
let currentIndex = 0;
let score = 0;
let answeredCount = 0;
let popupTimeout = null;
let muted = false;
let viewMode = 'single';

try { muted = localStorage.getItem('stfuErijah') === '1'; } catch (e) {}
try { viewMode = localStorage.getItem('quizViewMode') || 'single'; } catch (e) {}

const $ = id => document.getElementById(id);

function updateStfuButton() {
  const b = $('stfuBtn');
  if (!b) return;
  b.textContent = muted ? 'Bring Back Erijah' : 'STFU Erijah';
  b.classList.toggle('muted', muted);
  if (muted) {
    const a = $('wrongAudio');
    if (a) { a.pause(); a.currentTime = 0; }
    if (popupTimeout) clearTimeout(popupTimeout);
    const p = $('wrongPopup');
    if (p) p.classList.add('hidden');
  }
}
function toggleStfu() {
  muted = !muted;
  try { localStorage.setItem('stfuErijah', muted ? '1' : '0'); } catch (e) {}
  updateStfuButton();
}
function updateModeButton() {
  const b = $('modeBtn');
  if (!b) return;
  b.textContent = viewMode === 'all' ? 'View: All at Once' : 'View: One by One';
  b.classList.toggle('active', viewMode === 'all');
}
function toggleMode() {
  viewMode = viewMode === 'all' ? 'single' : 'all';
  try { localStorage.setItem('quizViewMode', viewMode); } catch (e) {}
  updateModeButton();
  if (quizQuestions.length > 0) renderActiveQuiz(); else renderHome();
}
function updateHeader() {
  const total = quizQuestions.length;
  const pct = answeredCount ? Math.round((score / answeredCount) * 100) : 0;
  $('progress-pill').textContent = viewMode === 'all'
    ? `Answered: ${answeredCount} / ${total}`
    : `Question ${total ? Math.min(currentIndex + 1, total) : 0} of ${total}`;
  $('score-pill').textContent = `Score: ${score} / ${answeredCount} (${pct}%)`;
  $('progress-bar').style.width = (total ? (answeredCount / total) * 100 : 0) + '%';
}
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function cloneForQuiz(q) {
  const c = JSON.parse(JSON.stringify(q));
  c.options = shuffle(c.options);
  c._locked = false; c._selectedIndex = null; c._isCorrect = false;
  return c;
}
function hidePopup() {
  if (popupTimeout) clearTimeout(popupTimeout);
  const p = $('wrongPopup'); if (p) p.classList.add('hidden');
  const a = $('wrongAudio'); if (a) { a.pause(); a.currentTime = 0; }
}

/* ----------------- Filter & Menu Dashboard ----------------- */
function getFilteredPool() { return questionBank.filter(q => selectedSubjects.has(q.subjectIndex)); }
function toggleSubject(idx) { if (selectedSubjects.has(idx)) selectedSubjects.delete(idx); else selectedSubjects.add(idx); renderHome(); }
function selectAllSubjects() { selectedSubjects = new Set(SUBJECTS.map((_, i) => i)); renderHome(); }
function clearSubjects() { selectedSubjects.clear(); renderHome(); }
function missedTotal() { return questionBank.filter(q => (hist[q.id] || 0) > 0).length; }
function toggleMissedFilter() { if (missedTotal() === 0) return; prioritizeMissed = !prioritizeMissed; renderHome(); }
function clearMissedHistory() {
  if (!confirm('Clear your saved missed-question history?')) return;
  hist = {}; saveHistory(); prioritizeMissed = false; renderHome();
}
function setViewModeFromHome(m) {
  viewMode = m;
  try { localStorage.setItem('quizViewMode', viewMode); } catch (e) {}
  updateModeButton(); renderHome();
}

function renderHome() {
  hidePopup();
  quizQuestions = []; currentIndex = 0; score = 0; answeredCount = 0;
  updateHeader(); updateModeButton();
  $('bank-count-header').textContent = questionBank.length;

  const totalMissed = missedTotal();
  const pool = getFilteredPool();
  const counts = SUBJECTS.map((_, i) => questionBank.filter(q => q.subjectIndex === i).length);
  const dis = pool.length === 0 ? 'disabled' : '';

  $('app-container').innerHTML = `
    <div class="dashboard-card">
      <div class="dash-title">Master Practice Dashboard</div>
      <div class="dash-desc">Select modules, target missed questions with weighted sampling, and choose your study view.</div>

      <div class="filter-section">
        <div class="filter-title">
          <span>1. Select Subject Modules</span>
          <div style="display:flex;gap:6px;">
            <button class="btn-ui" onclick="selectAllSubjects()">Select All</button>
            <button class="btn-ui" onclick="clearSubjects()">Clear</button>
          </div>
        </div>
        <div class="subject-chips">
          ${SUBJECTS.map((s, i) => `<div class="chip ${selectedSubjects.has(i) ? 'active' : ''}" onclick="toggleSubject(${i})">${s} (${counts[i]})</div>`).join('')}
        </div>
      </div>

      <div class="filter-section">
        <div class="filter-title"><span>2. Study Targeting</span>
          ${totalMissed ? `<button class="btn-ui" onclick="clearMissedHistory()">Clear Missed History</button>` : ''}
        </div>
        <div class="selector-row">
          <div class="chip ${totalMissed === 0 ? 'disabled' : (prioritizeMissed ? 'active' : '')}" onclick="toggleMissedFilter()">
            ${totalMissed === 0 ? 'Prioritize Missed (0): nothing missed yet' : `Prioritize Missed (${totalMissed}): weighted 3x`}
          </div>
        </div>
      </div>

      <div class="filter-section">
        <div class="filter-title">3. Display Mode</div>
        <div class="selector-row">
          <div class="chip ${viewMode === 'single' ? 'active' : ''}" onclick="setViewModeFromHome('single')">One by One (Flashcard/Card View)</div>
          <div class="chip ${viewMode === 'all' ? 'active' : ''}" onclick="setViewModeFromHome('all')">All at Once (Continuous List)</div>
        </div>
      </div>

      <div class="bank-counter">${pool.length} questions across ${selectedSubjects.size} subjects selected</div>

      <div class="filter-title" style="margin-top:20px;">4. Launch Quiz Session</div>
      <div class="launch-grid">
        <button class="btn-launch" ${dis} onclick="startQuiz(15)">Quickie (15 Qs)</button>
        <button class="btn-launch" ${dis} onclick="startQuiz(25)">Quickie (25 Qs)</button>
        <button class="btn-launch" ${dis} onclick="startQuiz(35)">Quickie (35 Qs)</button>
        <button class="btn-launch" ${dis} onclick="startQuiz(50)">Full Exam (50 Qs)</button>
        <button class="btn-launch" ${dis} onclick="startQuiz('all')">Entire Selected Bank (${pool.length})</button>
      </div>
    </div>`;
}

/* ----------------- Quiz Execution Engine ----------------- */
function startQuiz(countParam) {
  const pool = getFilteredPool();
  if (pool.length === 0) return;
  const target = countParam === 'all' ? pool.length : Math.min(countParam, pool.length);

  let chosen = [];
  if (prioritizeMissed) {
    let rest = [...pool];
    while (chosen.length < target && rest.length > 0) {
      const weights = rest.map(q => ((hist[q.id] || 0) > 0 ? 3 : 1));
      let r = Math.random() * weights.reduce((a, b) => a + b, 0);
      let k = 0;
      while (k < rest.length - 1 && r >= weights[k]) { r -= weights[k]; k++; }
      chosen.push(rest.splice(k, 1)[0]);
    }
  } else {
    chosen = shuffle(pool).slice(0, target);
  }

  quizQuestions = chosen.map(cloneForQuiz);
  currentIndex = 0; score = 0; answeredCount = 0;
  renderActiveQuiz();
}
function renderActiveQuiz() { if (viewMode === 'all') renderAllQuestions(); else renderQuestion(); }

function cardMeta(q, label) {
  return `<div class="meta">
    <span class="badge">${label}</span>
    <span class="badge alt">${SUBJECTS[q.subjectIndex]}</span>
    <span class="badge alt diff-${q.difficulty}">${q.difficulty}</span>
    <span class="badge alt">Quarter ${q.quarter} &bull; Slide #${q.slideRef}</span>
    ${q.priority ? '<span class="badge">High-Yield</span>' : ''}
  </div>`;
}
function stemHTML(q) { return esc(q.stem).replace(/_{3,}/g, '<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>'); }
function optionsHTML(q, qi) {
  const L = ['A', 'B', 'C', 'D'];
  return q.options.map((opt, oi) => `<button class="option-btn ${getOptionClass(q, oi)}" ${q._locked ? 'disabled' : ''} onclick="handleAnswer(${qi}, ${oi})"><b>${L[oi]}.</b> ${esc(opt.text)}</button>`).join('');
}

function renderQuestion() {
  updateHeader();
  if (currentIndex >= quizQuestions.length) { renderSummary(); return; }
  const q = quizQuestions[currentIndex];
  $('app-container').innerHTML = `
    <div class="card" id="qcard-${currentIndex}">
      ${cardMeta(q, `Question ${currentIndex + 1} of ${quizQuestions.length}`)}
      <div class="stem">${stemHTML(q)}</div>
      <div class="options-container">${optionsHTML(q, currentIndex)}</div>
      <div id="explanation-container">${q._locked ? renderExplanationHTML(q) : ''}</div>
      ${q._locked ? `<div class="nav-actions"><button class="next-btn" onclick="nextQuestion()">${currentIndex === quizQuestions.length - 1 ? 'View Results Summary' : 'Next Question &rarr;'}</button></div>` : '<div class="kbd-hint">Shortcuts: A-D to answer, Enter or Right Arrow for next.</div>'}
    </div>`;
}
function nextQuestion() {
  currentIndex++;
  if (currentIndex >= quizQuestions.length) renderSummary();
  else { renderQuestion(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
}

function renderAllQuestions() {
  updateHeader();
  $('app-container').innerHTML = `
    <div id="all-questions-list">
      ${quizQuestions.map((q, qi) => `
        <div class="card" id="qcard-${qi}">
          ${cardMeta(q, `Q${qi + 1}`)}
          <div class="stem">${stemHTML(q)}</div>
          <div class="options-container">${optionsHTML(q, qi)}</div>
          <div id="explanation-container-${qi}">${q._locked ? renderExplanationHTML(q) : ''}</div>
        </div>`).join('')}
    </div>
    ${answeredCount === quizQuestions.length ? `<div class="actions-row" id="final-btn-row"><button class="btn-launch" style="padding:14px 28px;" onclick="renderSummary()">View Final Results Summary</button></div>` : ''}`;
}

function getOptionClass(q, oi) {
  if (!q._locked) return '';
  if (q.options[oi].correct) return 'correct';
  if (q._selectedIndex === oi) return 'incorrect';
  return 'dim';
}

function handleAnswer(qIndex, oIndex) {
  const q = quizQuestions[qIndex];
  if (!q || q._locked) return;
  q._locked = true; q._selectedIndex = oIndex; q._isCorrect = q.options[oIndex].correct;
  answeredCount++;
  if (q._isCorrect) {
    score++;
    if (hist[q.id]) { hist[q.id] = Math.max(0, hist[q.id] - 1); saveHistory(); }
  } else {
    hist[q.id] = (hist[q.id] || 0) + 1; saveHistory();
    triggerWrongFeedback();
  }
  updateHeader();

  if (viewMode === 'all') {
    const card = $(`qcard-${qIndex}`);
    if (card) {
      card.querySelectorAll('.option-btn').forEach((btn, bi) => { btn.disabled = true; btn.className = `option-btn ${getOptionClass(q, bi)}`; });
      const exp = $(`explanation-container-${qIndex}`);
      if (exp) exp.innerHTML = renderExplanationHTML(q);
    }
    if (answeredCount === quizQuestions.length && !$('final-btn-row')) {
      const div = document.createElement('div');
      div.id = 'final-btn-row'; div.className = 'actions-row';
      div.innerHTML = `<button class="btn-launch" style="padding:14px 28px;" onclick="renderSummary()">View Final Results Summary</button>`;
      $('app-container').appendChild(div);
      div.scrollIntoView({ behavior: 'smooth' });
    }
  } else {
    renderQuestion();
  }
}

function renderExplanationHTML(q) {
  const L = ['A', 'B', 'C', 'D'];
  return `
    <div class="explain">
      <div class="banner ${q._isCorrect ? 'ok' : 'bad'}">${q._isCorrect ? 'CORRECT!' : 'INCORRECT.'}</div>
      <div class="concept"><b>Core Concept:</b> ${esc(q.concept)}</div>
      <ul>${q.options.map((opt, i) => `<li class="${opt.correct ? 'c' : ''}"><b>${L[i]}) ${esc(opt.text)}:</b> ${esc(opt.why)}</li>`).join('')}</ul>
    </div>`;
}

function triggerWrongFeedback() {
  if (muted) return;
  const audio = $('wrongAudio');
  if (audio) { audio.currentTime = 0; audio.play().catch(err => console.log('Audio autoplay prevented:', err)); }
  const popup = $('wrongPopup');
  if (popup) {
    popup.classList.remove('hidden');
    clearTimeout(popupTimeout);
    popupTimeout = setTimeout(() => popup.classList.add('hidden'), 2000);
  }
}

/* ----------------- Summary & Analytics ----------------- */
function renderSummary() {
  hidePopup();
  const total = quizQuestions.length;
  const pct = total ? Math.round((score / total) * 100) : 0;
  const tier = pct >= 90 ? 'Absolute Gigachad. You drained that test dry.'
    : pct >= 70 ? 'You lasted less than 30 seconds. Time for a rematch.'
    : 'You really didn’t fucking know that.';

  const subjectStats = {};
  const diffStats = { easy: { total: 0, correct: 0 }, medium: { total: 0, correct: 0 }, hard: { total: 0, correct: 0 } };
  quizQuestions.forEach(q => {
    const s = SUBJECTS[q.subjectIndex];
    if (!subjectStats[s]) subjectStats[s] = { total: 0, correct: 0 };
    subjectStats[s].total++; diffStats[q.difficulty].total++;
    if (q._isCorrect) { subjectStats[s].correct++; diffStats[q.difficulty].correct++; }
  });
  const missedCount = quizQuestions.filter(q => !q._isCorrect).length;
  const dRow = (label, color, d) => `<tr><td style="text-align:left;color:${color};font-weight:700;">${label}</td><td>${d.correct} / ${d.total}</td><td>${d.total ? Math.round(d.correct / d.total * 100) : 0}%</td></tr>`;

  $('app-container').innerHTML = `
    <div class="summary-card">
      <div class="score-big">${pct}%</div>
      <div style="font-size:1.15rem;color:#ccc;margin-top:4px;">${score} / ${total} Correct</div>
      <div class="tier-text" style="color:var(--accent);">${tier}</div>

      <div class="filter-title" style="margin-top:24px;">Cognitive Level Breakdown</div>
      <table class="summary-table">
        <thead><tr><th style="text-align:left;">Difficulty Level</th><th>Correct</th><th>Percentage</th></tr></thead>
        <tbody>
          ${dRow('Easy (Direct Recall)', '#22c55e', diffStats.easy)}
          ${dRow('Medium (Application &amp; Relationships)', '#f59e0b', diffStats.medium)}
          ${dRow('Hard (Multi-Concept Integration)', '#ef4444', diffStats.hard)}
        </tbody>
      </table>

      <div class="filter-title" style="margin-top:24px;">Subject Module Breakdown</div>
      <table class="summary-table">
        <thead><tr><th style="text-align:left;">Module / Subject</th><th>Correct</th><th>Percentage</th></tr></thead>
        <tbody>
          ${Object.keys(subjectStats).map(s => { const st = subjectStats[s]; return `<tr><td style="text-align:left;font-weight:600;">${s}</td><td>${st.correct} / ${st.total}</td><td>${Math.round(st.correct / st.total * 100)}%</td></tr>`; }).join('')}
        </tbody>
      </table>

      <div class="actions-row">
        <button class="btn-ui" onclick="renderHome()">Back to Menu</button>
        <button class="btn-ui active" onclick="retakeCurrentSet()">Retake Quiz</button>
        ${missedCount > 0 ? `<button class="btn-ui" style="border-color:#ef4444;color:#ef4444;" onclick="reviewMissedNow()">Review Missed (${missedCount})</button>` : ''}
        <a href="index.html" class="btn-ui">Back to Main Page</a>
      </div>
    </div>`;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function restartWith(idSet) {
  const subset = questionBank.filter(q => idSet.has(q.id));
  quizQuestions = shuffle(subset).map(cloneForQuiz);
  currentIndex = 0; score = 0; answeredCount = 0;
  renderActiveQuiz();
}
function retakeCurrentSet() { restartWith(new Set(quizQuestions.map(q => q.id))); }
function reviewMissedNow() { restartWith(new Set(quizQuestions.filter(q => !q._isCorrect).map(q => q.id))); }

document.addEventListener('keydown', e => {
  if (viewMode !== 'single' || !quizQuestions.length) return;
  const q = quizQuestions[currentIndex];
  if (!q) return;
  const k = e.key.toLowerCase();
  if (!q._locked && k.length === 1 && 'abcd'.includes(k)) handleAnswer(currentIndex, 'abcd'.indexOf(k));
  else if (q._locked && (e.key === 'Enter' || e.key === 'ArrowRight')) nextQuestion();
});

window.addEventListener('load', () => { updateStfuButton(); updateModeButton(); renderHome(); });
</script>
