  {"id": 100, "subjectIndex": 5, "quarter": 3, "slideRef": 61, "difficulty": "medium", "priority": true, "stem": "Which muscle is in the superficial layer of the posterior forearm?", "options": [{"text": "Brachioradialis", "correct": true, "why": "Superficial posterior: anconeus, brachioradialis, ECRL, ECRB, ED, EDM, ECU. [Slide #61]"}, {"text": "Extensor indicis", "correct": false, "why": "Extensor indicis is deep. [Slide #61]"}, {"text": "Abductor pollicis longus", "correct": false, "why": "APL is deep. [Slide #61]"}, {"text": "Extensor pollicis brevis", "correct": false, "why": "EPB is deep. [Slide #61]"}]},
  {"id": 101, "subjectIndex": 5, "quarter": 3, "slideRef": 61, "difficulty": "easy", "priority": false, "stem": "The posterior forearm contains which functional groups?", "options": [{"text": "Extensors and supinators", "correct": true, "why": "Posterior forearm: extensors and supinators. [Slide #61]"}, {"text": "Flexors and pronators", "correct": false, "why": "These are anterior. [Slide #61]"}, {"text": "Flexors and supinators", "correct": false, "why": "Flexors are anterior. [Slide #61]"}, {"text": "Extensors and pronators", "correct": false, "why": "Pronators are anterior. [Slide #61]"}]},
  {"id": 102, "subjectIndex": 5, "quarter": 3, "slideRef": 62, "difficulty": "medium", "priority": true, "stem": "The anconeus assists the triceps in forearm extension and also:", "options": [{"text": "stabilizes the elbow and may abduct the ulna in pronation", "correct": true, "why": "Anconeus assists triceps, stabilizes the elbow, and may abduct the ulna during pronation. [Slide #62]"}, {"text": "supinates the forearm", "correct": false, "why": "Supination is supinator and biceps. [Slide #62]"}, {"text": "flexes the elbow", "correct": false, "why": "Anconeus extends; it does not flex. [Slide #62]"}, {"text": "radially deviates the wrist", "correct": false, "why": "Radial deviation is ECRL/ECRB/FCR. [Slide #62]"}]},
  {"id": 103, "subjectIndex": 5, "quarter": 3, "slideRef": 62, "difficulty": "medium", "priority": false, "stem": "Anconeus arises from the lateral epicondyle and inserts on the:", "options": [{"text": "lateral olecranon and superior posterior ulna", "correct": true, "why": "Anconeus: lateral surface of olecranon and superior posterior ulna. [Slide #62]"}, {"text": "radial tuberosity", "correct": false, "why": "That is biceps. [Slide #62]"}, {"text": "styloid process of the radius", "correct": false, "why": "That is brachioradialis. [Slide #62]"}, {"text": "proximal 1/3 of the radius", "correct": false, "why": "That is supinator. [Slide #62]"}]},
  {"id": 104, "subjectIndex": 5, "quarter": 3, "slideRef": 63, "difficulty": "medium", "priority": true, "stem": "Which radial-nerve muscle in the posterior group acts mainly as a forearm flexor?", "options": [{"text": "Brachioradialis", "correct": true, "why": "Brachioradialis is posterior and radial-innervated, yet flexes the forearm (may assist supination). [Slide #63]"}, {"text": "Anconeus", "correct": false, "why": "Anconeus extends the forearm. [Slide #63]"}, {"text": "Supinator", "correct": false, "why": "Supinator supinates. [Slide #63]"}, {"text": "Extensor carpi radialis longus", "correct": false, "why": "ECRL extends and abducts the wrist. [Slide #63]"}]},
  {"id": 105, "subjectIndex": 5, "quarter": 3, "slideRef": 63, "difficulty": "medium", "priority": false, "stem": "Brachioradialis arises from the lateral supracondylar ridge and inserts on the:", "options": [{"text": "styloid process and distal 1/3 of the radius", "correct": true, "why": "Brachioradialis inserts on the radial styloid and distal 1/3 of radius. [Slide #63]"}, {"text": "radial tuberosity", "correct": false, "why": "That is biceps. [Slide #63]"}, {"text": "base of the 3rd metacarpal", "correct": false, "why": "That is ECRB. [Slide #63]"}, {"text": "coronoid process of the ulna", "correct": false, "why": "That is brachialis. [Slide #63]"}]},
  {"id": 106, "subjectIndex": 5, "quarter": 3, "slideRef": 64, "difficulty": "medium", "priority": true, "stem": "Which statement correctly contrasts ECRL and ECRB?", "options": [{"text": "ECRL: supracondylar ridge to MC2; ECRB: lateral epicondyle to MC3", "correct": true, "why": "ECRL starts higher (lateral supracondylar ridge) and inserts on MC2; ECRB starts at the lateral epicondyle and inserts on MC3. [Slide #64]"}, {"text": "ECRL: lateral epicondyle to MC3; ECRB: supracondylar ridge to MC2", "correct": false, "why": "Reversed. [Slide #64]"}, {"text": "Both insert on the base of MC5", "correct": false, "why": "MC5 receives ECU. [Slide #64]"}, {"text": "ECRL is median; ECRB is ulnar", "correct": false, "why": "Both are deep radial nerve. [Slide #64]"}]},
  {"id": 107, "subjectIndex": 5, "quarter": 3, "slideRef": 64, "difficulty": "medium", "priority": true, "stem": "Contraction of ECRL or ECRB produces which wrist actions?", "options": [{"text": "Extension and abduction (radial deviation)", "correct": true, "why": "Both extend and abduct (radially deviate) the wrist. [Slide #64]"}, {"text": "Extension and adduction", "correct": false, "why": "That is ECU. [Slide #64]"}, {"text": "Flexion and abduction", "correct": false, "why": "That is FCR. [Slide #64]"}, {"text": "Flexion and adduction", "correct": false, "why": "That is FCU. [Slide #64]"}]},
  {"id": 108, "subjectIndex": 5, "quarter": 3, "slideRef": 65, "difficulty": "easy", "priority": true, "stem": "Extensor carpi radialis brevis inserts on the base of the _______ metacarpal.", "options": [{"text": "third", "correct": true, "why": "ECRB: base of the 3rd metacarpal. [Slide #65]"}, {"text": "second", "correct": false, "why": "MC2 is ECRL (and FCR). [Slide #65]"}, {"text": "fifth", "correct": false, "why": "MC5 is ECU. [Slide #65]"}, {"text": "first", "correct": false, "why": "MC1 is APL. [Slide #65]"}]},
  {"id": 109, "subjectIndex": 5, "quarter": 3, "slideRef": 66, "difficulty": "easy", "priority": true, "stem": "The anterior forearm has two digitorum flexors, but the posterior forearm has _______ digitorum extensor(s).", "options": [{"text": "one", "correct": true, "why": "Only one extensor digitorum exists; flexors have superficialis and profundus. [Slide #66]"}, {"text": "two", "correct": false, "why": "There is no 'superficial' and 'deep' extensor digitorum. [Slide #66]"}, {"text": "three", "correct": false, "why": "There is only one. [Slide #66]"}, {"text": "four", "correct": false, "why": "Four is the number of tendons, not muscles. [Slide #66]"}]},
  {"id": 110, "subjectIndex": 5, "quarter": 3, "slideRef": 66, "difficulty": "medium", "priority": true, "stem": "Extensor digitorum inserts on the _______ of digits 2-5.", "options": [{"text": "extensor expansions", "correct": true, "why": "ED inserts on the extensor expansions, allowing extension at the MCP, PIP, and DIP joints. [Slide #66]"}, {"text": "bases of the distal phalanges", "correct": false, "why": "That is FDP. [Slide #66]"}, {"text": "middle phalanges", "correct": false, "why": "That is FDS. [Slide #66]"}, {"text": "bases of the metacarpals", "correct": false, "why": "Metacarpal bases receive the carpal extensors. [Slide #66]"}]},
  {"id": 111, "subjectIndex": 5, "quarter": 3, "slideRef": 66, "difficulty": "medium", "priority": false, "stem": "Extensor digitorum, EDM, and ECU are innervated by the:", "options": [{"text": "posterior interosseous nerve (deep radial branch)", "correct": true, "why": "These are supplied by the posterior interosseous nerve, a branch of the deep radial nerve. [Slide #66]"}, {"text": "anterior interosseous nerve", "correct": false, "why": "The AIN is a median branch to deep anterior muscles. [Slide #66]"}, {"text": "superficial radial nerve", "correct": false, "why": "The superficial radial nerve is cutaneous. [Slide #66]"}, {"text": "deep branch of the ulnar nerve", "correct": false, "why": "The deep ulnar branch supplies intrinsic hand muscles. [Slide #66]"}]},
  {"id": 112, "subjectIndex": 5, "quarter": 3, "slideRef": 67, "difficulty": "medium", "priority": false, "stem": "Extensor digiti minimi inserts on the base of the:", "options": [{"text": "middle phalanx of the 5th digit", "correct": true, "why": "EDM: base of the middle phalanx of digit 5. [Slide #67]"}, {"text": "5th metacarpal", "correct": false, "why": "MC5 receives ECU. [Slide #67]"}, {"text": "distal phalanx of the 5th digit", "correct": false, "why": "EDM inserts at the middle phalanx. [Slide #67]"}, {"text": "proximal phalanx of the 5th digit, medial side", "correct": false, "why": "That is abductor digiti minimi. [Slide #67]"}]},
  {"id": 113, "subjectIndex": 5, "quarter": 3, "slideRef": 68, "difficulty": "medium", "priority": true, "stem": "Extensor carpi ulnaris inserts on the base of the 5th metacarpal to produce:", "options": [{"text": "wrist extension and adduction (ulnar deviation)", "correct": true, "why": "ECU extends and adducts (ulnar deviates) the wrist. [Slide #68]"}, {"text": "wrist extension and abduction", "correct": false, "why": "That is ECRL/ECRB. [Slide #68]"}, {"text": "wrist flexion and adduction", "correct": false, "why": "That is FCU. [Slide #68]"}, {"text": "5th digit IP extension", "correct": false, "why": "That is EDM. [Slide #68]"}]},
  {"id": 114, "subjectIndex": 5, "quarter": 3, "slideRef": 69, "difficulty": "medium", "priority": true, "stem": "The supinator inserts on the:", "options": [{"text": "proximal 1/3 of the radius", "correct": true, "why": "Supinator: lateral epicondyle and ulnar crest to the proximal 1/3 of the radius (lateral, anterior, posterior). [Slide #69]"}, {"text": "radial tuberosity", "correct": false, "why": "That is biceps, the other supinator. [Slide #69]"}, {"text": "distal 1/4 of the anterior radius", "correct": false, "why": "That is pronator quadratus. [Slide #69]"}, {"text": "radial styloid", "correct": false, "why": "That is brachioradialis. [Slide #69]"}]},
  {"id": 115, "subjectIndex": 5, "quarter": 3, "slideRef": 69, "difficulty": "hard", "priority": true, "stem": "Which nerve passes under the supinator and is entrapped there?", "options": [{"text": "Deep branch of the radial nerve", "correct": true, "why": "The deep radial nerve goes under the supinator; entrapment there affects the deep radial nerve. [Slide #69]"}, {"text": "Superficial branch of the radial nerve", "correct": false, "why": "The superficial branch is cutaneous and does not pass under the supinator. [Slide #69]"}, {"text": "Anterior interosseous nerve", "correct": false, "why": "AIN is a median branch in the anterior forearm. [Slide #69]"}, {"text": "Ulnar nerve", "correct": false, "why": "The ulnar nerve passes behind the medial epicondyle and through Guyon's canal. [Slide #69]"}]},
  {"id": 116, "subjectIndex": 5, "quarter": 3, "slideRef": 69, "difficulty": "hard", "priority": false, "stem": "Which pair of muscles supinates the forearm but has different nerves?", "options": [{"text": "Supinator (deep radial) and biceps (musculocutaneous)", "correct": true, "why": "Supinator: deep radial nerve; biceps: musculocutaneous. Both supinate. [Slide #69]"}, {"text": "Pronator teres and pronator quadratus", "correct": false, "why": "These pronate. [Slide #69]"}, {"text": "Brachioradialis and anconeus", "correct": false, "why": "Brachioradialis may assist supination, but both are radial. [Slide #69]"}, {"text": "ECRL and ECRB", "correct": false, "why": "These extend the wrist. [Slide #69]"}]},
  {"id": 117, "subjectIndex": 5, "quarter": 3, "slideRef": 70, "difficulty": "medium", "priority": true, "stem": "Abductor pollicis longus abducts the thumb at which joint?", "options": [{"text": "Carpometacarpal (CMC)", "correct": true, "why": "APL abducts the thumb at the CMC joint (inserts on the base of MC1; slide lists 5th, a typo). [Slide #70]"}, {"text": "Metacarpophalangeal (MCP)", "correct": false, "why": "APL acts at the CMC. [Slide #70]"}, {"text": "Interphalangeal (IP)", "correct": false, "why": "Thumb IP extension is EPL. [Slide #70]"}, {"text": "Radiocarpal", "correct": false, "why": "APL acts on the thumb, not the wrist. [Slide #70]"}]},
  {"id": 118, "subjectIndex": 5, "quarter": 3, "slideRef": 71, "difficulty": "medium", "priority": false, "stem": "Extensor pollicis brevis inserts on the base of the _______ of the pollex.", "options": [{"text": "proximal phalanx", "correct": true, "why": "EPB: base of the proximal phalanx of the thumb. [Slide #71]"}, {"text": "distal phalanx", "correct": false, "why": "That is EPL (and FPL anteriorly). [Slide #71]"}, {"text": "first metacarpal", "correct": false, "why": "That is APL. [Slide #71]"}, {"text": "lateral side of the first metacarpal", "correct": false, "why": "That is opponens pollicis. [Slide #71]"}]},
  {"id": 119, "subjectIndex": 5, "quarter": 3, "slideRef": 72, "difficulty": "medium", "priority": true, "stem": "Extensor pollicis longus arises from the middle 1/3 posterior ulna and inserts on the _______.", "options": [{"text": "base of the distal phalanx of the pollex", "correct": true, "why": "EPL inserts on the base of the distal phalanx of the thumb, extending at MCP and IP. [Slide #72]"}, {"text": "base of the proximal phalanx of the pollex", "correct": false, "why": "That is EPB. [Slide #72]"}, {"text": "base of the first metacarpal", "correct": false, "why": "That is APL. [Slide #72]"}, {"text": "extensor expansion of digit 2", "correct": false, "why": "That is extensor indicis. [Slide #72]"}]},
  {"id": 120, "subjectIndex": 5, "quarter": 3, "slideRef": 72, "difficulty": "hard", "priority": true, "stem": "Which is the exception to the usual 'longus before brevis' order on the lateral forearm?", "options": [{"text": "EPB is encountered before EPL", "correct": true, "why": "For the thumb extensors, brevis (EPB) comes before longus (EPL). [Slide #72]"}, {"text": "ECRB is encountered before ECRL", "correct": false, "why": "ECRL comes first (higher on the supracondylar ridge). [Slide #72]"}, {"text": "APL is encountered after EPL", "correct": false, "why": "APL is not the stated exception. [Slide #72]"}, {"text": "Palmaris brevis precedes palmaris longus", "correct": false, "why": "Palmaris brevis is in the hand. [Slide #72]"}]},
  {"id": 121, "subjectIndex": 5, "quarter": 3, "slideRef": 72, "difficulty": "easy", "priority": true, "stem": "Which three tendons bound the anatomical snuffbox?", "options": [{"text": "APL, EPB, and EPL", "correct": true, "why": "Snuffbox boundaries: APL and EPB (lateral) and EPL (medial). [Slide #72]"}, {"text": "FCR, palmaris longus, and FCU", "correct": false, "why": "These are anterior wrist tendons. [Slide #72]"}, {"text": "ECRL, ECRB, and ECU", "correct": false, "why": "These are carpal extensors. [Slide #72]"}, {"text": "ED, EDM, and extensor indicis", "correct": false, "why": "These are digital extensors. [Slide #72]"}]},
  {"id": 122, "subjectIndex": 5, "quarter": 3, "slideRef": 72, "difficulty": "easy", "priority": true, "stem": "Which artery is palpated in the anatomical snuffbox?", "options": [{"text": "Radial artery", "correct": true, "why": "The radial artery crosses the floor of the snuffbox. [Slide #72]"}, {"text": "Ulnar artery", "correct": false, "why": "The ulnar artery runs medially through Guyon's canal. [Slide #72]"}, {"text": "Brachial artery", "correct": false, "why": "The brachial artery ends at the cubital fossa. [Slide #72]"}, {"text": "Anterior interosseous artery", "correct": false, "why": "This lies deep in the anterior forearm. [Slide #72]"}]},
  {"id": 123, "subjectIndex": 5, "quarter": 3, "slideRef": 73, "difficulty": "medium", "priority": true, "stem": "Extensor indicis inserts on the extensor expansion of digit:", "options": [{"text": "2 (index finger)", "correct": true, "why": "Extensor indicis: extensor expansion of digit 2; extends it and assists wrist extension. [Slide #73]"}, {"text": "5", "correct": false, "why": "Digit 5 has extensor digiti minimi. [Slide #73]"}, {"text": "1", "correct": false, "why": "The thumb has EPL and EPB. [Slide #73]"}, {"text": "3", "correct": false, "why": "Digit 3 has no dedicated extensor. [Slide #73]"}]},
  {"id": 124, "subjectIndex": 5, "quarter": 3, "slideRef": 66, "difficulty": "hard", "priority": true, "stem": "Which statement about forearm muscles that 'start in the arm' is correct?", "options": [{"text": "Brachioradialis and ECRL arise from the supracondylar ridge", "correct": true, "why": "Brachioradialis and ECRL arise above the epicondyle on the lateral supracondylar ridge; most others arise from the lateral epicondyle. [Slide #66]"}, {"text": "EPL and extensor indicis arise from the lateral epicondyle", "correct": false, "why": "These deep muscles arise from the posterior ulna/interosseous membrane. [Slide #66]"}, {"text": "APL arises from the medial epicondyle", "correct": false, "why": "APL arises from the posterior radius, ulna, and interosseous membrane. [Slide #66]"}, {"text": "ECRB arises from the supracondylar ridge", "correct": false, "why": "ECRB arises from the lateral epicondyle. [Slide #66]"}]},
  {"id": 125, "subjectIndex": 5, "quarter": 3, "slideRef": 63, "difficulty": "medium", "priority": false, "stem": "Which deep tendon reflex tests the C6 level at the forearm?", "options": [{"text": "Brachioradialis reflex", "correct": true, "why": "The brachioradialis reflex tests C6. [Slide #63]"}, {"text": "Triceps reflex", "correct": false, "why": "The triceps reflex tests C7. [Slide #63]"}, {"text": "Pronator quadratus reflex", "correct": false, "why": "Not a standard reflex. [Slide #63]"}, {"text": "Flexor carpi ulnaris reflex", "correct": false, "why": "Not a standard reflex. [Slide #63]"}]},
  {"id": 126, "subjectIndex": 5, "quarter": 3, "slideRef": 61, "difficulty": "medium", "priority": false, "stem": "Forearm compartment syndrome is treated by emergency _______.", "options": [{"text": "fasciotomy to relieve pressure", "correct": true, "why": "Cutting open the forearm fascia (fasciotomy) relieves compression of muscles and the radial/ulnar arteries. [Slide #61]"}, {"text": "tendon transfer", "correct": false, "why": "Tendon transfer is not the emergency treatment. [Slide #61]"}, {"text": "carpal tunnel release", "correct": false, "why": "That releases the flexor retinaculum. [Slide #61]"}, {"text": "joint fusion", "correct": false, "why": "Fusion is not for compartment syndrome. [Slide #61]"}]},
  {"id": 127, "subjectIndex": 6, "quarter": 4, "slideRef": 75, "difficulty": "medium", "priority": true, "stem": "Threading a needle, buttoning a shirt, and holding a pencil are examples of:", "options": [{"text": "precision handling", "correct": true, "why": "Precision handling involves fine control of the digits. [Slide #75]"}, {"text": "power grasping", "correct": false, "why": "Power grasp is a full palm grip. [Slide #75]"}, {"text": "hook grip", "correct": false, "why": "Hook grip is a low-energy carrying grip. [Slide #75]"}, {"text": "position of rest", "correct": false, "why": "Position of rest is used for casting. [Slide #75]"}]},
  {"id": 128, "subjectIndex": 6, "quarter": 4, "slideRef": 75, "difficulty": "medium", "priority": false, "stem": "Power grasping (palm grasp) is strongest with the wrist in which position?", "options": [{"text": "Extension", "correct": true, "why": "Power grasp is stronger with extension. [Slide #75]"}, {"text": "Flexion", "correct": false, "why": "Wrist flexion slackens the long flexors and weakens grip. [Slide #75]"}, {"text": "Ulnar deviation alone", "correct": false, "why": "The key position is extension. [Slide #75]"}, {"text": "Full pronation", "correct": false, "why": "Grip strength depends on wrist extension, not forearm rotation. [Slide #75]"}]},
  {"id": 129, "subjectIndex": 6, "quarter": 4, "slideRef": 75, "difficulty": "medium", "priority": false, "stem": "Which grip consumes less energy?", "options": [{"text": "Hook grip", "correct": true, "why": "The hook grip consumes less energy. [Slide #75]"}, {"text": "Pinching", "correct": false, "why": "Pinching (holding a coin) is a precision motion. [Slide #75]"}, {"text": "Precision handling", "correct": false, "why": "Precision handling needs fine control. [Slide #75]"}, {"text": "Snapping", "correct": false, "why": "Snapping is a pinching motion. [Slide #75]"}]},
  {"id": 130, "subjectIndex": 6, "quarter": 4, "slideRef": 75, "difficulty": "easy", "priority": false, "stem": "The position of the wrist and hand used for immobilization in a cast is the _______.", "options": [{"text": "position of rest", "correct": true, "why": "The position of rest is used for casting to stabilize a fracture. [Slide #75]"}, {"text": "power grasp position", "correct": false, "why": "Power grasp is a functional grip. [Slide #75]"}, {"text": "full flexion position", "correct": false, "why": "Not the casting position. [Slide #75]"}, {"text": "hook grip position", "correct": false, "why": "Hook grip is a carrying grip. [Slide #75]"}]},
  {"id": 131, "subjectIndex": 6, "quarter": 4, "slideRef": 77, "difficulty": "medium", "priority": true, "stem": "How many compartments contain the intrinsic hand muscles?", "options": [{"text": "Five", "correct": true, "why": "Five: thenar, adductor, hypothenar, central (lumbricals), and interosseous. [Slide #77]"}, {"text": "Three", "correct": false, "why": "There are five. [Slide #77]"}, {"text": "Four", "correct": false, "why": "There are five; the adductor compartment is separate from thenar. [Slide #77]"}, {"text": "Seven", "correct": false, "why": "There are five. [Slide #77]"}]},
  {"id": 132, "subjectIndex": 6, "quarter": 4, "slideRef": 77, "difficulty": "medium", "priority": true, "stem": "Which compartment of the hand contains the lumbricals?", "options": [{"text": "Central compartment, with the long flexor tendons", "correct": true, "why": "The lumbricals sit in the central compartment with the long flexor tendons. [Slide #77]"}, {"text": "Interosseous compartments", "correct": false, "why": "These hold the interossei between the metacarpals. [Slide #77]"}, {"text": "Thenar compartment", "correct": false, "why": "Thenar = APB, FPB, opponens pollicis. [Slide #77]"}, {"text": "Adductor compartment", "correct": false, "why": "This contains only adductor pollicis. [Slide #77]"}]},
  {"id": 133, "subjectIndex": 6, "quarter": 4, "slideRef": 78, "difficulty": "easy", "priority": true, "stem": "Which three muscles form the thenar compartment?", "options": [{"text": "Abductor pollicis brevis, flexor pollicis brevis, opponens pollicis", "correct": true, "why": "Thenar: APB, FPB, OP. [Slide #78]"}, {"text": "APB, FPB, adductor pollicis", "correct": false, "why": "Adductor pollicis has its own compartment. [Slide #78]"}, {"text": "APL, EPB, EPL", "correct": false, "why": "These are forearm muscles of the snuffbox. [Slide #78]"}, {"text": "ADM, FDMB, ODM", "correct": false, "why": "These are hypothenar. [Slide #78]"}]},
  {"id": 134, "subjectIndex": 6, "quarter": 4, "slideRef": 79, "difficulty": "easy", "priority": true, "stem": "The thenar muscles are innervated by the _______ branch of the median nerve.", "options": [{"text": "recurrent", "correct": true, "why": "Recurrent branch of the median nerve (C8-T1). [Slide #79]"}, {"text": "palmar cutaneous", "correct": false, "why": "This branch is sensory. [Slide #79]"}, {"text": "anterior interosseous", "correct": false, "why": "AIN supplies deep anterior forearm muscles. [Slide #79]"}, {"text": "deep", "correct": false, "why": "'Deep branch' is the ulnar nerve to hypothenar, adductor, and interossei. [Slide #79]"}]},
  {"id": 135, "subjectIndex": 6, "quarter": 4, "slideRef": 79, "difficulty": "medium", "priority": true, "stem": "The thenar muscles arise from the flexor retinaculum and which carpal tubercles?", "options": [{"text": "Scaphoid and trapezium", "correct": true, "why": "All three thenar muscles: flexor retinaculum plus tubercles of scaphoid and trapezium. [Slide #79]"}, {"text": "Pisiform and hamate", "correct": false, "why": "These are hypothenar origins. [Slide #79]"}, {"text": "Capitate and trapezoid", "correct": false, "why": "Capitate contributes to adductor pollicis (oblique head). [Slide #79]"}, {"text": "Lunate and triquetrum", "correct": false, "why": "These are not thenar origins. [Slide #79]"}]},
  {"id": 136, "subjectIndex": 6, "quarter": 4, "slideRef": 81, "difficulty": "medium", "priority": true, "stem": "Opponens pollicis inserts on the lateral side of the 1st metacarpal and acts to:", "options": [{"text": "draw the 1st metacarpal medially to oppose the thumb", "correct": true, "why": "Opponens pollicis draws MC1 medially into opposition. [Slide #81]"}, {"text": "abduct the thumb at the MCP", "correct": false, "why": "That is APB. [Slide #81]"}, {"text": "flex the thumb", "correct": false, "why": "That is FPB/FPL. [Slide #81]"}, {"text": "adduct the thumb toward the palm", "correct": false, "why": "That is adductor pollicis. [Slide #81]"}]},
  {"id": 137, "subjectIndex": 6, "quarter": 4, "slideRef": 79, "difficulty": "hard", "priority": false, "stem": "Which two thenar muscles share an insertion on the lateral base of the proximal phalanx of the thumb?", "options": [{"text": "Abductor pollicis brevis and flexor pollicis brevis", "correct": true, "why": "APB and FPB both insert on the lateral base of the proximal phalanx; OP inserts on MC1. [Slide #79]"}, {"text": "Opponens pollicis and APB", "correct": false, "why": "OP inserts on the lateral 1st metacarpal. [Slide #79]"}, {"text": "Adductor pollicis and FPB", "correct": false, "why": "Adductor pollicis inserts on the medial side. [Slide #79]"}, {"text": "FPL and EPL", "correct": false, "why": "Both insert on the distal phalanx. [Slide #79]"}]},
  {"id": 138, "subjectIndex": 6, "quarter": 4, "slideRef": 83, "difficulty": "hard", "priority": true, "stem": "Adductor pollicis has which two heads of origin?", "options": [{"text": "Oblique: MC2-3 bases and capitate; transverse: MC3 shaft", "correct": true, "why": "Oblique head: bases of MC2-3, capitate, adjacent carpals; transverse head: anterior shaft of MC3. [Slide #83]"}, {"text": "Oblique: MC3 shaft; transverse: MC2-3 bases and capitate", "correct": false, "why": "Reversed. [Slide #83]"}, {"text": "Oblique: scaphoid; transverse: trapezium", "correct": false, "why": "Scaphoid/trapezium are thenar origins. [Slide #83]"}, {"text": "Oblique: pisiform; transverse: hook of hamate", "correct": false, "why": "These are hypothenar origins. [Slide #83]"}]},
  {"id": 139, "subjectIndex": 6, "quarter": 4, "slideRef": 83, "difficulty": "medium", "priority": true, "stem": "Adductor pollicis is innervated by the _______.", "options": [{"text": "deep branch of the ulnar nerve", "correct": true, "why": "Adductor pollicis: deep branch of the ulnar nerve (C8-T1), unlike the median-supplied thenar muscles. [Slide #83]"}, {"text": "recurrent branch of the median nerve", "correct": false, "why": "That supplies the thenar muscles. [Slide #83]"}, {"text": "posterior interosseous nerve", "correct": false, "why": "That supplies posterior forearm extensors. [Slide #83]"}, {"text": "superficial radial nerve", "correct": false, "why": "That is cutaneous. [Slide #83]"}]},
  {"id": 140, "subjectIndex": 6, "quarter": 4, "slideRef": 83, "difficulty": "medium", "priority": false, "stem": "Adductor pollicis inserts on the:", "options": [{"text": "medial side of the proximal phalanx of the thumb", "correct": true, "why": "Adductor pollicis inserts on the medial base of the thumb's proximal phalanx. [Slide #83]"}, {"text": "lateral side of the proximal phalanx of the thumb", "correct": false, "why": "That is APB/FPB. [Slide #83]"}, {"text": "lateral side of the 1st metacarpal", "correct": false, "why": "That is opponens pollicis. [Slide #83]"}, {"text": "base of the distal phalanx of the thumb", "correct": false, "why": "That is FPL/EPL. [Slide #83]"}]},
  {"id": 141, "subjectIndex": 6, "quarter": 4, "slideRef": 84, "difficulty": "easy", "priority": false, "stem": "Which three muscles form the hypothenar compartment?", "options": [{"text": "Abductor digiti minimi, flexor digiti minimi brevis, opponens digiti minimi", "correct": true, "why": "Hypothenar: ADM, FDMB, ODM. [Slide #84]"}, {"text": "ADM, palmaris longus, ODM", "correct": false, "why": "Palmaris longus is a forearm muscle. [Slide #84]"}, {"text": "APB, FPB, OP", "correct": false, "why": "These are thenar. [Slide #84]"}, {"text": "Lumbricals 3 and 4 with ODM", "correct": false, "why": "Lumbricals are central. [Slide #84]"}]},
  {"id": 142, "subjectIndex": 6, "quarter": 4, "slideRef": 85, "difficulty": "easy", "priority": true, "stem": "Abductor digiti minimi originates from the _______.", "options": [{"text": "pisiform", "correct": true, "why": "ADM arises from the pisiform. [Slide #85]"}, {"text": "hook of hamate", "correct": false, "why": "Hook of hamate gives rise to FDMB and ODM. [Slide #85]"}, {"text": "scaphoid tubercle", "correct": false, "why": "That is a thenar origin. [Slide #85]"}, {"text": "capitate", "correct": false, "why": "That is part of the adductor pollicis oblique head. [Slide #85]"}]},
  {"id": 143, "subjectIndex": 6, "quarter": 4, "slideRef": 86, "difficulty": "medium", "priority": true, "stem": "Which hypothenar muscles arise from the hook of hamate and flexor retinaculum?", "options": [{"text": "Flexor digiti minimi brevis and opponens digiti minimi", "correct": true, "why": "FDMB and ODM arise from the hook of hamate and flexor retinaculum; ADM arises from the pisiform. [Slide #86]"}, {"text": "Abductor digiti minimi and FDMB", "correct": false, "why": "ADM arises from the pisiform. [Slide #86]"}, {"text": "ADM and ODM", "correct": false, "why": "ADM arises from the pisiform. [Slide #86]"}, {"text": "Palmar interossei 2 and 3", "correct": false, "why": "Interossei arise from metacarpals. [Slide #86]"}]},
  {"id": 144, "subjectIndex": 6, "quarter": 4, "slideRef": 87, "difficulty": "medium", "priority": false, "stem": "Opponens digiti minimi inserts on the medial border of the 5th metacarpal to:", "options": [{"text": "cup the palm and oppose digit 5 toward the thumb", "correct": true, "why": "ODM draws MC5 anteriorly and medially, cupping the palm. [Slide #87]"}, {"text": "abduct digit 5", "correct": false, "why": "That is ADM. [Slide #87]"}, {"text": "flex the 5th proximal phalanx", "correct": false, "why": "That is FDMB. [Slide #87]"}, {"text": "extend digit 5", "correct": false, "why": "That is EDM. [Slide #87]"}]},
  {"id": 145, "subjectIndex": 6, "quarter": 4, "slideRef": 85, "difficulty": "medium", "priority": true, "stem": "All hypothenar muscles are innervated by the _______.", "options": [{"text": "deep branch of the ulnar nerve", "correct": true, "why": "All three hypothenar muscles: deep branch of the ulnar nerve (C8-T1). [Slide #85]"}, {"text": "recurrent branch of the median nerve", "correct": false, "why": "Supplies the thenar muscles. [Slide #85]"}, {"text": "superficial branch of the ulnar nerve", "correct": false, "why": "The superficial branch supplies palmaris brevis. [Slide #85]"}, {"text": "posterior interosseous nerve", "correct": false, "why": "Supplies forearm extensors. [Slide #85]"}]},
  {"id": 146, "subjectIndex": 6, "quarter": 4, "slideRef": 79, "difficulty": "hard", "priority": true, "stem": "Which statement correctly contrasts thenar and hypothenar innervation?", "options": [{"text": "Thenar: recurrent median; hypothenar: deep ulnar", "correct": true, "why": "Thenar muscles are recurrent median; hypothenar muscles are deep ulnar. [Slide #79]"}, {"text": "Thenar: deep ulnar; hypothenar: recurrent median", "correct": false, "why": "Reversed. [Slide #79]"}, {"text": "Both are recurrent median", "correct": false, "why": "Hypothenar is ulnar. [Slide #79]"}, {"text": "Both are deep ulnar", "correct": false, "why": "Thenar (except the separate adductor) is median. [Slide #79]"}]},
  {"id": 147, "subjectIndex": 6, "quarter": 4, "slideRef": 76, "difficulty": "hard", "priority": false, "stem": "Which muscle pair is responsible for opposing the thumb and little finger toward each other?", "options": [{"text": "Opponens pollicis and opponens digiti minimi", "correct": true, "why": "OP draws MC1 medially; ODM draws MC5 anteriorly/medially, cupping the palm. [Slide #76]"}, {"text": "APB and ADM", "correct": false, "why": "These abduct their digits. [Slide #76]"}, {"text": "FPB and FDMB", "correct": false, "why": "These flex their proximal phalanges. [Slide #76]"}, {"text": "Adductor pollicis and palmar interossei", "correct": false, "why": "These adduct. [Slide #76]"}]},
  {"id": 148, "subjectIndex": 6, "quarter": 4, "slideRef": 83, "difficulty": "medium", "priority": false, "stem": "Adductor pollicis differs from the thenar muscles because it is:", "options": [{"text": "in its own compartment and ulnar-innervated", "correct": true, "why": "Adductor pollicis has its own adductor compartment and the deep ulnar nerve. [Slide #83]"}, {"text": "in the thenar compartment and median-innervated", "correct": false, "why": "It is not in the thenar compartment. [Slide #83]"}, {"text": "a forearm muscle supplied by the radial nerve", "correct": false, "why": "It is an intrinsic hand muscle. [Slide #83]"}, {"text": "in the hypothenar compartment", "correct": false, "why": "It acts on the thumb. [Slide #83]"}]},
  {"id": 149, "subjectIndex": 7, "quarter": 4, "slideRef": 89, "difficulty": "medium", "priority": true, "stem": "What is the action of the lumbricals?", "options": [{"text": "Flex the MCP joints and extend the IP joints", "correct": true, "why": "Lumbricals flex at the MCP and extend the IP joints of digits 2-5. [Slide #89]"}, {"text": "Extend the MCP and flex the IP joints", "correct": false, "why": "Reversed. [Slide #89]"}, {"text": "Abduct digits from the midline", "correct": false, "why": "That is the dorsal interossei. [Slide #89]"}, {"text": "Adduct digits toward the midline", "correct": false, "why": "That is the palmar interossei. [Slide #89]"}]},
  {"id": 150, "subjectIndex": 7, "quarter": 4, "slideRef": 89, "difficulty": "hard", "priority": true, "stem": "How are the lumbricals innervated?", "options": [{"text": "1-2 by median; 3-4 by deep ulnar", "correct": true, "why": "Lumbricals 1-2 median; 3-4 deep branch of ulnar (mirrors the FDP split). [Slide #89]"}, {"text": "1-2 by deep ulnar; 3-4 by median", "correct": false, "why": "Reversed. [Slide #89]"}, {"text": "All four by median", "correct": false, "why": "Lumbricals 3-4 are ulnar. [Slide #89]"}, {"text": "All four by deep ulnar", "correct": false, "why": "Lumbricals 1-2 are median. [Slide #89]"}]},
  {"id": 151, "subjectIndex": 7, "quarter": 4, "slideRef": 89, "difficulty": "hard", "priority": true, "stem": "Which statement correctly contrasts lumbrical and interosseous origins?", "options": [{"text": "Lumbricals arise from FDP tendons; interossei from metacarpals", "correct": true, "why": "Lumbricals attach to tendons (FDP); interossei attach to bone (metacarpals). [Slide #89]"}, {"text": "Lumbricals from metacarpals; interossei from FDP tendons", "correct": false, "why": "Reversed. [Slide #89]"}, {"text": "Both arise from FDS tendons", "correct": false, "why": "Lumbricals use FDP, and interossei use bone. [Slide #89]"}, {"text": "Both arise from the flexor retinaculum", "correct": false, "why": "The flexor retinaculum is a thenar/hypothenar origin. [Slide #89]"}]},
  {"id": 152, "subjectIndex": 7, "quarter": 4, "slideRef": 89, "difficulty": "medium", "priority": false, "stem": "Lumbricals insert on the _______ of digits 2-5.", "options": [{"text": "lateral side of the extensor expansion", "correct": true, "why": "Lumbricals insert on the lateral side of the extensor expansions of digits 2-5. [Slide #89]"}, {"text": "bases of the distal phalanges", "correct": false, "why": "That is FDP. [Slide #89]"}, {"text": "middle phalanges", "correct": false, "why": "That is FDS. [Slide #89]"}, {"text": "palmar surface of the metacarpals", "correct": false, "why": "That is the palmar interosseous origin. [Slide #89]"}]},
  {"id": 153, "subjectIndex": 7, "quarter": 4, "slideRef": 91, "difficulty": "medium", "priority": true, "stem": "The dorsal interossei act to _______ the digits.", "options": [{"text": "abduct", "correct": true, "why": "DAB: dorsal interossei abduct from the midline (also extend IP joints). [Slide #91]"}, {"text": "adduct", "correct": false, "why": "PAD: palmar interossei adduct. [Slide #91]"}, {"text": "oppose", "correct": false, "why": "Opposition is the opponens muscles. [Slide #91]"}, {"text": "flex at the DIP", "correct": false, "why": "DIP flexion is FDP. [Slide #91]"}]},
  {"id": 154, "subjectIndex": 7, "quarter": 4, "slideRef": 91, "difficulty": "medium", "priority": false, "stem": "Dorsal interossei arise from the _______.", "options": [{"text": "adjacent sides of the metacarpals", "correct": true, "why": "Dorsal interossei arise from adjacent sides of metacarpals. [Slide #91]"}, {"text": "tendons of FDP", "correct": false, "why": "That is the lumbrical origin. [Slide #91]"}, {"text": "pisiform", "correct": false, "why": "That is ADM. [Slide #91]"}, {"text": "flexor retinaculum", "correct": false, "why": "That is the thenar/hypothenar origin. [Slide #91]"}]},
  {"id": 155, "subjectIndex": 7, "quarter": 4, "slideRef": 92, "difficulty": "medium", "priority": true, "stem": "Palmar interossei arise from and insert on digits:", "options": [{"text": "2, 4, and 5", "correct": true, "why": "Palmar interossei: metacarpals 2, 4, 5 to proximal phalanges 2, 4, 5. Digit 3 is skipped. [Slide #92]"}, {"text": "2, 3, and 4", "correct": false, "why": "Digits 2-4 receive the dorsal interossei. [Slide #92]"}, {"text": "1, 2, and 3", "correct": false, "why": "Digit 3 is skipped; digit 1 has its own adductor. [Slide #92]"}, {"text": "3, 4, and 5", "correct": false, "why": "Digit 3 has no palmar interosseous. [Slide #92]"}]},
  {"id": 156, "subjectIndex": 7, "quarter": 4, "slideRef": 92, "difficulty": "medium", "priority": true, "stem": "Which digit lacks a palmar interosseous muscle?", "options": [{"text": "Digit 3", "correct": true, "why": "The midline of the hand runs through digit 3, so it cannot be adducted to itself. [Slide #92]"}, {"text": "Digit 2", "correct": false, "why": "Digit 2 has a palmar interosseous. [Slide #92]"}, {"text": "Digit 4", "correct": false, "why": "Digit 4 has a palmar interosseous. [Slide #92]"}, {"text": "Digit 5", "correct": false, "why": "Digit 5 has a palmar interosseous. [Slide #92]"}]},
  {"id": 157, "subjectIndex": 7, "quarter": 4, "slideRef": 91, "difficulty": "hard", "priority": false, "stem": "Dorsal interossei insert on digits _______, and the reference midline passes through digit 3.", "options": [{"text": "2-4", "correct": true, "why": "Dorsal interossei insert on digits 2-4; digit 3 receives two. [Slide #91]"}, {"text": "2, 4, and 5", "correct": false, "why": "These are the palmar interosseous digits. [Slide #91]"}, {"text": "1-5", "correct": false, "why": "The thumb and little finger have dedicated abductors. [Slide #91]"}, {"text": "3 only", "correct": false, "why": "Digits 2 and 4 also receive dorsal interossei. [Slide #91]"}]},
  {"id": 158, "subjectIndex": 7, "quarter": 4, "slideRef": 92, "difficulty": "easy", "priority": true, "stem": "All interossei are innervated by the _______.", "options": [{"text": "deep branch of the ulnar nerve", "correct": true, "why": "Both palmar and dorsal interossei: deep branch of ulnar nerve (C8-T1). [Slide #92]"}, {"text": "recurrent branch of the median nerve", "correct": false, "why": "Supplies the thenar muscles. [Slide #92]"}, {"text": "median nerve proper", "correct": false, "why": "The median nerve supplies only lumbricals 1-2 among the central muscles. [Slide #92]"}, {"text": "posterior interosseous nerve", "correct": false, "why": "Despite its name, it supplies forearm extensors. [Slide #92]"}]},
  {"id": 159, "subjectIndex": 7, "quarter": 4, "slideRef": 93, "difficulty": "medium", "priority": true, "stem": "The palmar fascia (palmar aponeurosis) is the expanded tendon of:", "options": [{"text": "palmaris longus, when present", "correct": true, "why": "Palmar fascia = expanded tendon of palmaris longus when present. [Slide #93]"}, {"text": "flexor carpi radialis", "correct": false, "why": "FCR inserts on MC2. [Slide #93]"}, {"text": "flexor digitorum superficialis", "correct": false, "why": "FDS inserts on the middle phalanges. [Slide #93]"}, {"text": "palmaris brevis", "correct": false, "why": "Palmaris brevis is a small subcutaneous muscle. [Slide #93]"}]},
  {"id": 160, "subjectIndex": 7, "quarter": 4, "slideRef": 93, "difficulty": "hard", "priority": false, "stem": "The fibrous digital sheaths enclose the synovial sheaths and the tendons of _______.", "options": [{"text": "FDS, FDP, and FPL", "correct": true, "why": "Digital fibrous sheaths are ligamentous tubes enclosing the superficial and deep flexor tendons and FPL. [Slide #93]"}, {"text": "ED and extensor indicis", "correct": false, "why": "Extensor tendons run dorsally. [Slide #93]"}, {"text": "FCR and FCU", "correct": false, "why": "These insert at the wrist. [Slide #93]"}, {"text": "lumbricals and interossei", "correct": false, "why": "These insert on the extensor expansions. [Slide #93]"}]},
  {"id": 161, "subjectIndex": 7, "quarter": 4, "slideRef": 93, "difficulty": "easy", "priority": true, "stem": "How many structures pass through the carpal tunnel?", "options": [{"text": "9 tendons and 1 nerve", "correct": true, "why": "Four FDS, four FDP, one FPL tendon, plus the median nerve. [Slide #93]"}, {"text": "10 tendons and 2 nerves", "correct": false, "why": "The ulnar nerve does not pass through. [Slide #93]"}, {"text": "8 tendons and 1 nerve", "correct": false, "why": "FPL adds a 9th tendon. [Slide #93]"}, {"text": "9 tendons, 1 nerve, and 1 artery", "correct": false, "why": "The ulnar artery goes through Guyon's canal. [Slide #93]"}]},
  {"id": 162, "subjectIndex": 7, "quarter": 4, "slideRef": 93, "difficulty": "medium", "priority": true, "stem": "Which structure passes through the carpal tunnel?", "options": [{"text": "Flexor pollicis longus tendon", "correct": true, "why": "FPL is one of the 9 carpal tunnel tendons. [Slide #93]"}, {"text": "Flexor carpi radialis tendon", "correct": false, "why": "FCR has its own separate compartment in the retinaculum. [Slide #93]"}, {"text": "Ulnar nerve", "correct": false, "why": "The ulnar nerve passes through Guyon's canal. [Slide #93]"}, {"text": "Palmaris longus tendon", "correct": false, "why": "Palmaris longus passes superficial to the retinaculum. [Slide #93]"}]},
  {"id": 163, "subjectIndex": 7, "quarter": 4, "slideRef": 93, "difficulty": "medium", "priority": true, "stem": "The ulnar nerve and artery reach the hand through the:", "options": [{"text": "tunnel of Guyon (ulnar canal)", "correct": true, "why": "Ulnar nerve and artery bypass the carpal tunnel through Guyon's canal. [Slide #93]"}, {"text": "carpal tunnel", "correct": false, "why": "Only the median nerve goes through the carpal tunnel. [Slide #93]"}, {"text": "anatomical snuffbox", "correct": false, "why": "The radial artery crosses the snuffbox. [Slide #93]"}, {"text": "quadrangular space", "correct": false, "why": "That is in the posterior shoulder. [Slide #93]"}]},
  {"id": 164, "subjectIndex": 7, "quarter": 4, "slideRef": 93, "difficulty": "medium", "priority": false, "stem": "The roof of the carpal tunnel is formed by the _______.", "options": [{"text": "flexor retinaculum", "correct": true, "why": "The flexor retinaculum (transverse carpal ligament) forms the roof. [Slide #93]"}, {"text": "extensor retinaculum", "correct": false, "why": "That is dorsal. [Slide #93]"}, {"text": "palmar aponeurosis", "correct": false, "why": "The aponeurosis is superficial and distal to the retinaculum. [Slide #93]"}, {"text": "annular ligament", "correct": false, "why": "The annular ligament encircles the radial head. [Slide #93]"}]},
  {"id": 165, "subjectIndex": 7, "quarter": 4, "slideRef": 92, "difficulty": "hard", "priority": false, "stem": "Which muscle pairing shares a nerve but performs opposite digital movements?", "options": [{"text": "Dorsal and palmar interossei", "correct": true, "why": "Both are deep ulnar; dorsal abduct (DAB), palmar adduct (PAD). [Slide #92]"}, {"text": "Lumbricals 1 and 2", "correct": false, "why": "Both are median and have the same action. [Slide #92]"}, {"text": "FDS and FDP", "correct": false, "why": "Both flex the digits. [Slide #92]"}, {"text": "ED and extensor indicis", "correct": false, "why": "Both extend the digits. [Slide #92]"}]},
  {"id": 166, "subjectIndex": 7, "quarter": 4, "slideRef": 89, "difficulty": "hard", "priority": true, "stem": "Which muscles of digits 2-5 share FDP's split innervation (median laterally, ulnar medially)?", "options": [{"text": "Lumbricals", "correct": true, "why": "Lumbricals arise from FDP tendons and copy FDP's split: 1-2 median, 3-4 ulnar. [Slide #89]"}, {"text": "Dorsal interossei", "correct": false, "why": "These are all deep ulnar. [Slide #89]"}, {"text": "Palmar interossei", "correct": false, "why": "These are all deep ulnar. [Slide #89]"}, {"text": "Hypothenar muscles", "correct": false, "why": "These are all deep ulnar. [Slide #89]"}]},
  {"id": 167, "subjectIndex": 8, "quarter": 2, "slideRef": 40, "difficulty": "easy", "priority": true, "stem": "The brachial plexus is formed from which nerve roots?", "options": [{"text": "C5-T1", "correct": true, "why": "Brachial plexus: roots C5-T1. [Slide #40]"}, {"text": "C1-C4", "correct": false, "why": "These form the cervical plexus. [Slide #40]"}, {"text": "C3-C7", "correct": false, "why": "Wrong range. [Slide #40]"}, {"text": "T1-T5", "correct": false, "why": "Upper thoracic nerves beyond T1 form intercostal nerves. [Slide #40]"}]},
  {"id": 168, "subjectIndex": 8, "quarter": 2, "slideRef": 40, "difficulty": "easy", "priority": false, "stem": "What is the correct order of brachial plexus components from proximal to distal?", "options": [{"text": "Roots, trunks, divisions, cords, branches", "correct": true, "why": "Roots → trunks → divisions → cords → branches. [Slide #40]"}, {"text": "Roots, divisions, trunks, cords, branches", "correct": false, "why": "Trunks come before divisions. [Slide #40]"}, {"text": "Trunks, roots, cords, divisions, branches", "correct": false, "why": "Roots are first. [Slide #40]"}, {"text": "Roots, cords, trunks, divisions, branches", "correct": false, "why": "Cords come after divisions. [Slide #40]"}]},
  {"id": 169, "subjectIndex": 8, "quarter": 2, "slideRef": 42, "difficulty": "medium", "priority": true, "stem": "The cords of the brachial plexus are named for their relation to the:", "options": [{"text": "axillary (subclavian) artery", "correct": true, "why": "Cords are named lateral, medial, and posterior around the subclavian/axillary artery. [Slide #42]"}, {"text": "clavicle", "correct": false, "why": "Cords are named relative to the artery. [Slide #42]"}, {"text": "humeral head", "correct": false, "why": "Not the naming reference. [Slide #42]"}, {"text": "first rib", "correct": false, "why": "Not the naming reference. [Slide #42]"}]},
  {"id": 170, "subjectIndex": 8, "quarter": 2, "slideRef": 43, "difficulty": "medium", "priority": true, "stem": "Which terminal branches arise from the lateral cord?", "options": [{"text": "Musculocutaneous nerve and half of the median nerve", "correct": true, "why": "Lateral cord: musculocutaneous plus half of the median. [Slide #43]"}, {"text": "Axillary and radial nerves", "correct": false, "why": "These come from the posterior cord. [Slide #43]"}, {"text": "Ulnar nerve and half of the median nerve", "correct": false, "why": "These come from the medial cord. [Slide #43]"}, {"text": "Radial and musculocutaneous nerves", "correct": false, "why": "Radial is posterior cord. [Slide #43]"}]},
  {"id": 171, "subjectIndex": 8, "quarter": 2, "slideRef": 43, "difficulty": "medium", "priority": true, "stem": "Which terminal branches arise from the medial cord?", "options": [{"text": "Ulnar nerve and the other half of the median nerve", "correct": true, "why": "Medial cord: ulnar plus the other half of the median. [Slide #43]"}, {"text": "Musculocutaneous and median nerves", "correct": false, "why": "Musculocutaneous is lateral cord. [Slide #43]"}, {"text": "Axillary and ulnar nerves", "correct": false, "why": "Axillary is posterior cord. [Slide #43]"}, {"text": "Radial and ulnar nerves", "correct": false, "why": "Radial is posterior cord. [Slide #43]"}]},
  {"id": 172, "subjectIndex": 8, "quarter": 2, "slideRef": 43, "difficulty": "easy", "priority": true, "stem": "The posterior cord gives the _______ and radial nerves as terminal branches.", "options": [{"text": "axillary", "correct": true, "why": "Posterior cord: axillary and radial. [Slide #43]"}, {"text": "ulnar", "correct": false, "why": "Ulnar is medial cord. [Slide #43]"}, {"text": "musculocutaneous", "correct": false, "why": "Musculocutaneous is lateral cord. [Slide #43]"}, {"text": "median", "correct": false, "why": "Median is formed by the lateral and medial cords. [Slide #43]"}]},
  {"id": 173, "subjectIndex": 8, "quarter": 2, "slideRef": 43, "difficulty": "hard", "priority": true, "stem": "Which terminal nerve is the only one formed by contributions from two cords?", "options": [{"text": "Median nerve", "correct": true, "why": "The median nerve receives half from the lateral cord and half from the medial cord. [Slide #43]"}, {"text": "Ulnar nerve", "correct": false, "why": "Ulnar is purely medial cord. [Slide #43]"}, {"text": "Radial nerve", "correct": false, "why": "Radial is purely posterior cord. [Slide #43]"}, {"text": "Axillary nerve", "correct": false, "why": "Axillary is purely posterior cord. [Slide #43]"}]},
  {"id": 174, "subjectIndex": 8, "quarter": 2, "slideRef": 45, "difficulty": "medium", "priority": true, "stem": "The musculocutaneous nerve carries fibers from which spinal levels?", "options": [{"text": "C5-C7", "correct": true, "why": "Musculocutaneous: C5-C7. [Slide #45]"}, {"text": "C6-T1", "correct": false, "why": "C6-T1 is the median nerve. [Slide #45]"}, {"text": "C8-T1", "correct": false, "why": "C8-T1 is the ulnar nerve. [Slide #45]"}, {"text": "C5-C6", "correct": false, "why": "C5-C6 is the axillary nerve. [Slide #45]"}]},
  {"id": 175, "subjectIndex": 8, "quarter": 2, "slideRef": 46, "difficulty": "medium", "priority": true, "stem": "The median nerve carries fibers from which spinal levels?", "options": [{"text": "C6-T1", "correct": true, "why": "Median nerve: C6-T1. [Slide #46]"}, {"text": "C5-C7", "correct": false, "why": "C5-C7 is musculocutaneous. [Slide #46]"}, {"text": "C8-T1", "correct": false, "why": "C8-T1 is ulnar. [Slide #46]"}, {"text": "C5-T1", "correct": false, "why": "C5-T1 is radial. [Slide #46]"}]},
  {"id": 176, "subjectIndex": 8, "quarter": 2, "slideRef": 47, "difficulty": "medium", "priority": true, "stem": "The ulnar nerve carries fibers from which spinal levels?", "options": [{"text": "C8-T1", "correct": true, "why": "Ulnar nerve: C8-T1. [Slide #47]"}, {"text": "C6-T1", "correct": false, "why": "C6-T1 is the median nerve. [Slide #47]"}, {"text": "C5-C6", "correct": false, "why": "C5-C6 is the axillary nerve. [Slide #47]"}, {"text": "C5-C7", "correct": false, "why": "C5-C7 is musculocutaneous. [Slide #47]"}]},
  {"id": 177, "subjectIndex": 8, "quarter": 2, "slideRef": 49, "difficulty": "medium", "priority": false, "stem": "Which terminal nerve carries fibers from all five roots of the brachial plexus (C5-T1)?", "options": [{"text": "Radial nerve", "correct": true, "why": "Radial nerve: C5-T1. [Slide #49]"}, {"text": "Median nerve", "correct": false, "why": "Median is C6-T1. [Slide #49]"}, {"text": "Ulnar nerve", "correct": false, "why": "Ulnar is C8-T1. [Slide #49]"}, {"text": "Axillary nerve", "correct": false, "why": "Axillary is C5-C6. [Slide #49]"}]},
  {"id": 178, "subjectIndex": 8, "quarter": 2, "slideRef": 45, "difficulty": "medium", "priority": true, "stem": "The musculocutaneous nerve supplies which three muscles?", "options": [{"text": "Biceps brachii, brachialis, coracobrachialis", "correct": true, "why": "Musculocutaneous: all three anterior arm muscles. [Slide #45]"}, {"text": "Biceps, brachialis, brachioradialis", "correct": false, "why": "Brachioradialis is radial. [Slide #45]"}, {"text": "Triceps, anconeus, supinator", "correct": false, "why": "These are radial. [Slide #45]"}, {"text": "Deltoid, teres minor, biceps", "correct": false, "why": "Deltoid and teres minor are axillary. [Slide #45]"}]},
  {"id": 179, "subjectIndex": 8, "quarter": 2, "slideRef": 45, "difficulty": "medium", "priority": false, "stem": "The lateral antebrachial cutaneous nerve is the sensory continuation of the _______ nerve.", "options": [{"text": "musculocutaneous", "correct": true, "why": "After passing brachialis, the musculocutaneous nerve continues as the lateral antebrachial cutaneous nerve (lateral cord). [Slide #45]"}, {"text": "radial", "correct": false, "why": "The radial supplies the posterior forearm. [Slide #45]"}, {"text": "median", "correct": false, "why": "The median does not supply the forearm skin. [Slide #45]"}, {"text": "axillary", "correct": false, "why": "The axillary supplies skin over the lower shoulder. [Slide #45]"}]},
  {"id": 180, "subjectIndex": 8, "quarter": 2, "slideRef": 46, "difficulty": "medium", "priority": true, "stem": "Sensory supply to the palmar digits 1-3 and lateral 1/2 of digit 4 is from the _______ nerve.", "options": [{"text": "median", "correct": true, "why": "Median: palmar lateral hand digits 1-3½ and dorsal tips of the same digits. [Slide #46]"}, {"text": "ulnar", "correct": false, "why": "Ulnar supplies digit 5 and the medial half of 4. [Slide #46]"}, {"text": "radial", "correct": false, "why": "Radial supplies the dorsum of the hand. [Slide #46]"}, {"text": "musculocutaneous", "correct": false, "why": "Musculocutaneous supplies the lateral forearm. [Slide #46]"}]},
  {"id": 181, "subjectIndex": 8, "quarter": 2, "slideRef": 47, "difficulty": "medium", "priority": true, "stem": "Which hand muscle is supplied by the ulnar nerve rather than the median nerve?", "options": [{"text": "Adductor pollicis", "correct": true, "why": "Ulnar motor: hypothenar, medial two lumbricals, adductor pollicis, interossei, palmaris brevis, FCU, medial FDP. [Slide #47]"}, {"text": "Abductor pollicis brevis", "correct": false, "why": "APB is median (recurrent). [Slide #47]"}, {"text": "Opponens pollicis", "correct": false, "why": "OP is median (recurrent). [Slide #47]"}, {"text": "Lumbrical 1", "correct": false, "why": "Lumbricals 1-2 are median. [Slide #47]"}]},
  {"id": 182, "subjectIndex": 8, "quarter": 2, "slideRef": 47, "difficulty": "medium", "priority": false, "stem": "The ulnar nerve provides sensation to which part of the hand?", "options": [{"text": "Palmar and dorsal medial hand, digit 5 and medial 1/2 of 4", "correct": true, "why": "Ulnar sensory: ventral and dorsal medial hand including 5th and 1/2 of 4th digit. [Slide #47]"}, {"text": "Palmar digits 1-3 and lateral 1/2 of 4", "correct": false, "why": "That is median. [Slide #47]"}, {"text": "Dorsum of hand and first 3½ digits", "correct": false, "why": "That is radial. [Slide #47]"}, {"text": "Lower 2/3 of the shoulder", "correct": false, "why": "That is axillary. [Slide #47]"}]},
  {"id": 183, "subjectIndex": 8, "quarter": 2, "slideRef": 48, "difficulty": "medium", "priority": true, "stem": "The axillary nerve supplies which muscles?", "options": [{"text": "Deltoid and teres minor", "correct": true, "why": "Axillary (C5-C6): deltoid and teres minor; sensory over the lower shoulder. [Slide #48]"}, {"text": "Deltoid and teres major", "correct": false, "why": "Teres major is lower subscapular. [Slide #48]"}, {"text": "Supraspinatus and infraspinatus", "correct": false, "why": "These are suprascapular. [Slide #48]"}, {"text": "Teres minor and subscapularis", "correct": false, "why": "Subscapularis is upper/lower subscapular. [Slide #48]"}]},
  {"id": 184, "subjectIndex": 8, "quarter": 2, "slideRef": 49, "difficulty": "medium", "priority": true, "stem": "The radial nerve provides sensory supply to which region?", "options": [{"text": "Posterior forearm and dorsum of hand (first 3½ digits)", "correct": true, "why": "Radial sensory: posterior forearm, dorsum of hand, first 3 and 1/2 digits. [Slide #49]"}, {"text": "Palmar digits 1-3½", "correct": false, "why": "That is median. [Slide #49]"}, {"text": "Medial hand and digit 5", "correct": false, "why": "That is ulnar. [Slide #49]"}, {"text": "Lateral forearm", "correct": false, "why": "That is the lateral antebrachial cutaneous nerve (musculocutaneous). [Slide #49]"}]},
  {"id": 185, "subjectIndex": 8, "quarter": 2, "slideRef": 49, "difficulty": "hard", "priority": false, "stem": "Which statement correctly contrasts the superficial and deep branches of the radial nerve?", "options": [{"text": "Superficial is cutaneous; deep goes under the supinator to the muscles", "correct": true, "why": "The superficial radial nerve goes to skin; the deep radial passes under the supinator (posterior interosseous) to the extensors. [Slide #49]"}, {"text": "Superficial supplies the extensors; deep is cutaneous", "correct": false, "why": "Reversed. [Slide #49]"}, {"text": "Both go through the carpal tunnel", "correct": false, "why": "Only the median nerve does. [Slide #49]"}, {"text": "Deep supplies the triceps above the elbow", "correct": false, "why": "The triceps is supplied before the radial nerve divides. [Slide #49]"}]},
  {"id": 186, "subjectIndex": 8, "quarter": 4, "slideRef": 94, "difficulty": "medium", "priority": true, "stem": "The suprascapular nerve arises from the _______.", "options": [{"text": "superior (upper) trunk", "correct": true, "why": "Suprascapular arises high from the superior trunk and supplies supraspinatus and infraspinatus. [Slide #94]"}, {"text": "posterior cord", "correct": false, "why": "Upper/lower subscapular and thoracodorsal come from the posterior cord. [Slide #94]"}, {"text": "medial cord", "correct": false, "why": "Medial pectoral and medial cutaneous nerves come from the medial cord. [Slide #94]"}, {"text": "C5 root directly", "correct": false, "why": "Dorsal scapular and long thoracic arise from the roots. [Slide #94]"}]},
  {"id": 187, "subjectIndex": 8, "quarter": 4, "slideRef": 94, "difficulty": "medium", "priority": true, "stem": "Which nerve pair arises from the posterior cord?", "options": [{"text": "Thoracodorsal and subscapular nerves", "correct": true, "why": "Upper/lower subscapular and thoracodorsal nerves are posterior cord branches (along with axillary and radial). [Slide #94]"}, {"text": "Lateral and medial pectoral nerves", "correct": false, "why": "These are lateral and medial cord branches. [Slide #94]"}, {"text": "Suprascapular and nerve to subclavius", "correct": false, "why": "These arise from the superior trunk. [Slide #94]"}, {"text": "Long thoracic and dorsal scapular", "correct": false, "why": "These arise directly from the roots. [Slide #94]"}]},
  {"id": 188, "subjectIndex": 8, "quarter": 4, "slideRef": 94, "difficulty": "hard", "priority": true, "stem": "Which nerves arise directly from the spinal nerve roots rather than a cord?", "options": [{"text": "Dorsal scapular and long thoracic", "correct": true, "why": "Dorsal scapular (C5) and long thoracic (C5-C7) come directly off the roots. [Slide #94]"}, {"text": "Thoracodorsal and axillary", "correct": false, "why": "Both are posterior cord. [Slide #94]"}, {"text": "Lateral pectoral and musculocutaneous", "correct": false, "why": "Both are lateral cord. [Slide #94]"}, {"text": "Medial pectoral and ulnar", "correct": false, "why": "Both are medial cord. [Slide #94]"}]},
  {"id": 189, "subjectIndex": 8, "quarter": 4, "slideRef": 94, "difficulty": "medium", "priority": false, "stem": "The lateral pectoral nerve arises from the lateral cord, and the medial pectoral nerve arises from the:", "options": [{"text": "medial cord", "correct": true, "why": "Pectoral nerves are named for their cords: lateral pectoral (lateral cord), medial pectoral (medial cord, C8-T1). [Slide #94]"}, {"text": "posterior cord", "correct": false, "why": "No pectoral nerve arises from the posterior cord. [Slide #94]"}, {"text": "superior trunk", "correct": false, "why": "The superior trunk gives the suprascapular nerve. [Slide #94]"}, {"text": "C5 root", "correct": false, "why": "The C5 root gives the dorsal scapular nerve. [Slide #94]"}]},
  {"id": 190, "subjectIndex": 8, "quarter": 4, "slideRef": 95, "difficulty": "medium", "priority": true, "stem": "A lesion of the spinal accessory nerve (CN XI) produces _______.", "options": [{"text": "drooping of the shoulder", "correct": true, "why": "Loss of trapezius causes shoulder drooping and difficulty abducting the arm. [Slide #95]"}, {"text": "pronounced winging of the entire scapula", "correct": false, "why": "That is long thoracic nerve injury. [Slide #95]"}, {"text": "Popeye deformity", "correct": false, "why": "That is biceps long head rupture. [Slide #95]"}, {"text": "loss of thumb opposition", "correct": false, "why": "That is median/recurrent nerve injury. [Slide #95]"}]},
  {"id": 191, "subjectIndex": 8, "quarter": 4, "slideRef": 95, "difficulty": "medium", "priority": true, "stem": "A lesion of the long thoracic nerve produces:", "options": [{"text": "pronounced winging of the scapula", "correct": true, "why": "Long thoracic injury paralyzes serratus anterior, causing marked scapular winging (worse pushing against a wall). [Slide #95]"}, {"text": "drooping of the shoulder", "correct": false, "why": "That is spinal accessory injury. [Slide #95]"}, {"text": "loss of elbow flexion", "correct": false, "why": "That is musculocutaneous injury. [Slide #95]"}, {"text": "weak lateral rotation", "correct": false, "why": "That is suprascapular or axillary injury. [Slide #95]"}]},
  {"id": 192, "subjectIndex": 8, "quarter": 4, "slideRef": 95, "difficulty": "hard", "priority": false, "stem": "How does scapular winging differ between spinal accessory and long thoracic nerve lesions?", "options": [{"text": "CN XI: mild inferior winging; long thoracic: whole-scapula winging", "correct": true, "why": "CN XI gives a little winging at the bottom with drooping; long thoracic causes pronounced whole-scapula winging. [Slide #95]"}, {"text": "CN XI: severe winging; long thoracic: none", "correct": false, "why": "Reversed; long thoracic winging is far more pronounced. [Slide #95]"}, {"text": "Neither causes any winging", "correct": false, "why": "Both cause some degree of winging. [Slide #95]"}, {"text": "Both cause identical winging", "correct": false, "why": "The degree and pattern differ. [Slide #95]"}]},
  {"id": 193, "subjectIndex": 8, "quarter": 4, "slideRef": 96, "difficulty": "medium", "priority": true, "stem": "The medial brachial and medial antebrachial cutaneous nerves arise from the _______.", "options": [{"text": "medial cord", "correct": true, "why": "Both medial cutaneous nerves come directly off the medial cord. [Slide #96]"}, {"text": "lateral cord", "correct": false, "why": "The lateral cord gives musculocutaneous (lateral antebrachial cutaneous). [Slide #96]"}, {"text": "posterior cord", "correct": false, "why": "Posterior cord gives axillary and radial. [Slide #96]"}, {"text": "superior trunk", "correct": false, "why": "The superior trunk gives suprascapular. [Slide #96]"}]},
  {"id": 194, "subjectIndex": 8, "quarter": 4, "slideRef": 96, "difficulty": "medium", "priority": false, "stem": "Which cutaneous nerve of the upper limb is the smallest and hardest to see?", "options": [{"text": "Medial brachial cutaneous nerve", "correct": true, "why": "The medial brachial cutaneous nerve is the smallest cutaneous nerve. [Slide #96]"}, {"text": "Lateral antebrachial cutaneous nerve", "correct": false, "why": "This is the larger musculocutaneous continuation. [Slide #96]"}, {"text": "Medial antebrachial cutaneous nerve", "correct": false, "why": "Larger than the medial brachial cutaneous nerve. [Slide #96]"}, {"text": "Superficial radial nerve", "correct": false, "why": "Not described as the smallest. [Slide #96]"}]},
  {"id": 195, "subjectIndex": 8, "quarter": 4, "slideRef": 94, "difficulty": "hard", "priority": true, "stem": "Which nerve passes around the spiral (radial) groove of the humerus?", "options": [{"text": "Radial nerve", "correct": true, "why": "The radial nerve travels in the spiral groove with the deep brachial artery. [Slide #94]"}, {"text": "Ulnar nerve", "correct": false, "why": "The ulnar nerve passes behind the medial epicondyle (funny bone). [Slide #94]"}, {"text": "Axillary nerve", "correct": false, "why": "The axillary nerve passes through the quadrangular space. [Slide #94]"}, {"text": "Median nerve", "correct": false, "why": "The median nerve passes through the carpal tunnel. [Slide #94]"}]},
  {"id": 196, "subjectIndex": 8, "quarter": 4, "slideRef": 94, "difficulty": "medium", "priority": true, "stem": "Striking the 'funny bone' irritates the _______ nerve.", "options": [{"text": "ulnar", "correct": true, "why": "The ulnar nerve passes behind the medial epicondyle/olecranon notch. [Slide #94]"}, {"text": "radial", "correct": false, "why": "The radial nerve is in the spiral groove. [Slide #94]"}, {"text": "median", "correct": false, "why": "The median nerve passes anteriorly through the cubital fossa. [Slide #94]"}, {"text": "musculocutaneous", "correct": false, "why": "The musculocutaneous nerve is lateral and anterior. [Slide #94]"}]},
  {"id": 197, "subjectIndex": 8, "quarter": 2, "slideRef": 46, "difficulty": "hard", "priority": false, "stem": "Which muscle group is mostly median-innervated but has ulnar exceptions?", "options": [{"text": "Anterior forearm flexors", "correct": true, "why": "Most anterior forearm flexors are median; FCU and medial FDP are ulnar. [Slide #46]"}, {"text": "Posterior forearm extensors", "correct": false, "why": "These are all radial. [Slide #46]"}, {"text": "Hypothenar muscles", "correct": false, "why": "These are all ulnar. [Slide #46]"}, {"text": "Anterior arm muscles", "correct": false, "why": "These are all musculocutaneous. [Slide #46]"}]},
  {"id": 198, "subjectIndex": 9, "quarter": 4, "slideRef": 97, "difficulty": "easy", "priority": true, "stem": "What is the correct arterial sequence from the neck into the forearm?", "options": [{"text": "Subclavian, axillary, brachial, radial/ulnar", "correct": true, "why": "Arteries run neck to hand: subclavian → axillary → brachial → radial and ulnar. [Slide #97]"}, {"text": "Axillary, subclavian, brachial, radial/ulnar", "correct": false, "why": "Subclavian comes before axillary. [Slide #97]"}, {"text": "Subclavian, brachial, axillary, radial/ulnar", "correct": false, "why": "Axillary comes before brachial. [Slide #97]"}, {"text": "Radial/ulnar, brachial, axillary, subclavian", "correct": false, "why": "This is venous direction, not arterial. [Slide #97]"}]},
  {"id": 199, "subjectIndex": 9, "quarter": 4, "slideRef": 99, "difficulty": "medium", "priority": true, "stem": "What is the correct deep venous drainage sequence from the forearm?", "options": [{"text": "Radial/ulnar, brachial, axillary, subclavian", "correct": true, "why": "Veins drain hand to heart: radial/ulnar veins → brachial → axillary → subclavian. [Slide #99]"}, {"text": "Subclavian, axillary, brachial, radial/ulnar", "correct": false, "why": "This is arterial direction. [Slide #99]"}, {"text": "Brachial, radial/ulnar, axillary, subclavian", "correct": false, "why": "Radial/ulnar drain into brachial. [Slide #99]"}, {"text": "Radial/ulnar, axillary, brachial, subclavian", "correct": false, "why": "Brachial comes before axillary. [Slide #99]"}]},
  {"id": 200, "subjectIndex": 9, "quarter": 4, "slideRef": 97, "difficulty": "medium", "priority": true, "stem": "Which axillary artery branch has the greatest diameter but the shortest length?", "options": [{"text": "Subscapular artery", "correct": true, "why": "The subscapular artery has the greatest diameter and shortest length. [Slide #97]"}, {"text": "Anterior circumflex humeral artery", "correct": false, "why": "This is smaller than the posterior circumflex. [Slide #97]"}, {"text": "Posterior circumflex humeral artery", "correct": false, "why": "This is large but not the greatest diameter. [Slide #97]"}, {"text": "Deep brachial artery", "correct": false, "why": "This is a branch of the brachial artery. [Slide #97]"}]},
  {"id": 201, "subjectIndex": 9, "quarter": 4, "slideRef": 97, "difficulty": "medium", "priority": false, "stem": "The subscapular artery divides into which two branches?", "options": [{"text": "Circumflex scapular and thoracodorsal arteries", "correct": true, "why": "Subscapular artery: circumflex scapular and thoracodorsal branches. [Slide #97]"}, {"text": "Anterior and posterior circumflex humeral", "correct": false, "why": "These are separate axillary branches. [Slide #97]"}, {"text": "Radial and ulnar arteries", "correct": false, "why": "These come from the brachial artery. [Slide #97]"}, {"text": "Deep brachial and radial collateral", "correct": false, "why": "These are from the brachial artery. [Slide #97]"}]},
  {"id": 202, "subjectIndex": 9, "quarter": 4, "slideRef": 97, "difficulty": "medium", "priority": true, "stem": "How do the anterior and posterior circumflex humeral arteries compare?", "options": [{"text": "Posterior is larger than anterior", "correct": true, "why": "The posterior circumflex humeral artery is bigger than the anterior. [Slide #97]"}, {"text": "Anterior is larger than posterior", "correct": false, "why": "Reversed. [Slide #97]"}, {"text": "They are identical in size", "correct": false, "why": "They differ. [Slide #97]"}, {"text": "Only the anterior is present", "correct": false, "why": "Both arise from the axillary artery. [Slide #97]"}]},
  {"id": 203, "subjectIndex": 9, "quarter": 4, "slideRef": 98, "difficulty": "medium", "priority": true, "stem": "Which structures pass through the quadrangular space?", "options": [{"text": "Axillary nerve and posterior circumflex humeral artery", "correct": true, "why": "Quadrangular space: axillary nerve and posterior circumflex humeral artery. [Slide #98]"}, {"text": "Circumflex scapular artery only", "correct": false, "why": "That is the triangular space. [Slide #98]"}, {"text": "Radial nerve and deep brachial artery", "correct": false, "why": "These run in the radial groove. [Slide #98]"}, {"text": "Ulnar nerve and artery", "correct": false, "why": "These go through Guyon's canal. [Slide #98]"}]},
  {"id": 204, "subjectIndex": 9, "quarter": 4, "slideRef": 98, "difficulty": "hard", "priority": true, "stem": "Which artery is found in the triangular space?", "options": [{"text": "Circumflex scapular artery", "correct": true, "why": "Triangular space (3 borders) contains the circumflex scapular artery (3 words). [Slide #98]"}, {"text": "Posterior circumflex humeral artery", "correct": false, "why": "This passes through the quadrangular space. [Slide #98]"}, {"text": "Deep brachial artery", "correct": false, "why": "This runs in the radial groove. [Slide #98]"}, {"text": "Thoracodorsal artery", "correct": false, "why": "This runs with the thoracodorsal nerve to lat dorsi. [Slide #98]"}]},
  {"id": 205, "subjectIndex": 9, "quarter": 4, "slideRef": 98, "difficulty": "medium", "priority": true, "stem": "The borders of the triangular space are teres minor, teres major, and the:", "options": [{"text": "long head of the triceps", "correct": true, "why": "Triangular space: teres minor, teres major, long head of triceps. [Slide #98]"}, {"text": "surgical neck of the humerus", "correct": false, "why": "Adding the humerus makes it the quadrangular space. [Slide #98]"}, {"text": "lateral head of the triceps", "correct": false, "why": "The long head forms the border. [Slide #98]"}, {"text": "subscapularis", "correct": false, "why": "Not a border here. [Slide #98]"}]},
  {"id": 206, "subjectIndex": 9, "quarter": 4, "slideRef": 98, "difficulty": "hard", "priority": false, "stem": "Which border is present in the quadrangular space but absent from the triangular space?", "options": [{"text": "Humerus", "correct": true, "why": "Quadrangular = teres minor, teres major, long head of triceps, plus the humerus. [Slide #98]"}, {"text": "Teres major", "correct": false, "why": "Teres major borders both spaces. [Slide #98]"}, {"text": "Long head of the triceps", "correct": false, "why": "It borders both spaces. [Slide #98]"}, {"text": "Teres minor", "correct": false, "why": "Teres minor borders both spaces. [Slide #98]"}]},
  {"id": 207, "subjectIndex": 9, "quarter": 4, "slideRef": 97, "difficulty": "medium", "priority": true, "stem": "The deep brachial artery arises from the brachial artery and travels with the _______.", "options": [{"text": "radial nerve in the radial groove", "correct": true, "why": "The deep brachial artery runs with the radial nerve in the radial (spiral) groove. [Slide #97]"}, {"text": "ulnar nerve behind the medial epicondyle", "correct": false, "why": "The ulnar nerve travels with collateral branches, not the deep brachial. [Slide #97]"}, {"text": "axillary nerve in the quadrangular space", "correct": false, "why": "That is the posterior circumflex humeral. [Slide #97]"}, {"text": "median nerve in the carpal tunnel", "correct": false, "why": "No major artery goes through the carpal tunnel. [Slide #97]"}]},
  {"id": 208, "subjectIndex": 9, "quarter": 4, "slideRef": 99, "difficulty": "easy", "priority": true, "stem": "Which superficial vein lies along the lateral side of the upper limb?", "options": [{"text": "Cephalic vein", "correct": true, "why": "Cephalic is lateral; basilic is medial. [Slide #99]"}, {"text": "Basilic vein", "correct": false, "why": "The basilic vein is medial. [Slide #99]"}, {"text": "Brachial vein", "correct": false, "why": "The brachial vein is deep. [Slide #99]"}, {"text": "Axillary vein", "correct": false, "why": "The axillary vein is deep and proximal. [Slide #99]"}]},
  {"id": 209, "subjectIndex": 9, "quarter": 4, "slideRef": 99, "difficulty": "easy", "priority": false, "stem": "Which superficial vein lies along the medial side of the upper limb?", "options": [{"text": "Basilic vein", "correct": true, "why": "The basilic vein is medial. [Slide #99]"}, {"text": "Cephalic vein", "correct": false, "why": "The cephalic is lateral. [Slide #99]"}, {"text": "Radial vein", "correct": false, "why": "The radial vein is deep. [Slide #99]"}, {"text": "Subclavian vein", "correct": false, "why": "The subclavian vein is deep and central. [Slide #99]"}]},
  {"id": 210, "subjectIndex": 9, "quarter": 4, "slideRef": 93, "difficulty": "medium", "priority": false, "stem": "The superficial palmar arch is formed mainly by the _______ artery.", "options": [{"text": "ulnar", "correct": true, "why": "The superficial palmar arch is mainly ulnar; the deep palmar arch is mainly radial. [Slide #93]"}, {"text": "radial", "correct": false, "why": "The radial artery mainly forms the deep arch. [Slide #93]"}, {"text": "brachial", "correct": false, "why": "The brachial artery ends at the elbow. [Slide #93]"}, {"text": "anterior interosseous", "correct": false, "why": "This supplies deep forearm structures. [Slide #93]"}]},
  {"id": 211, "subjectIndex": 9, "quarter": 4, "slideRef": 97, "difficulty": "hard", "priority": false, "stem": "Which pairing of artery to the muscle it accompanies is correct?", "options": [{"text": "Thoracodorsal artery with latissimus dorsi", "correct": true, "why": "The thoracodorsal artery (from subscapular) runs with the thoracodorsal nerve to lat dorsi. [Slide #97]"}, {"text": "Circumflex scapular artery with deltoid", "correct": false, "why": "Deltoid gets the posterior circumflex humeral. [Slide #97]"}, {"text": "Deep brachial artery with biceps", "correct": false, "why": "The deep brachial runs posteriorly with the radial nerve. [Slide #97]"}, {"text": "Posterior circumflex humeral with pectoralis major", "correct": false, "why": "It passes posteriorly through the quadrangular space. [Slide #97]"}]},
  {"id": 212, "subjectIndex": 10, "quarter": 4, "slideRef": 100, "difficulty": "easy", "priority": true, "stem": "Which three ligaments are the main elbow ligaments?", "options": [{"text": "Radial collateral, ulnar collateral, annular", "correct": true, "why": "The three main elbow ligaments: radial collateral, annular, ulnar collateral. [Slide #100]"}, {"text": "Radial collateral, ulnar collateral, transverse carpal", "correct": false, "why": "The transverse carpal ligament is the flexor retinaculum at the wrist. [Slide #100]"}, {"text": "Annular, coracoacromial, ulnar collateral", "correct": false, "why": "Coracoacromial is a shoulder ligament. [Slide #100]"}, {"text": "Radial collateral, nuchal, annular", "correct": false, "why": "The nuchal ligament is cervical. [Slide #100]"}]},
  {"id": 213, "subjectIndex": 10, "quarter": 4, "slideRef": 100, "difficulty": "medium", "priority": true, "stem": "Which ligament encircles the radial head to allow pronation and supination?", "options": [{"text": "Annular ligament", "correct": true, "why": "The annular ligament runs around the radial head and holds it during rotation. [Slide #100]"}, {"text": "Radial collateral ligament", "correct": false, "why": "It crosses the lateral joint; it does not encircle the radius. [Slide #100]"}, {"text": "Ulnar collateral ligament", "correct": false, "why": "It crosses the medial joint. [Slide #100]"}, {"text": "Flexor retinaculum", "correct": false, "why": "This is at the wrist. [Slide #100]"}]},
  {"id": 214, "subjectIndex": 10, "quarter": 4, "slideRef": 100, "difficulty": "medium", "priority": true, "stem": "The fan-shaped radial collateral ligament arises from the lateral epicondyle and blends with the:", "options": [{"text": "annular ligament", "correct": true, "why": "The RCL fans from the lateral epicondyle into the annular ligament. [Slide #100]"}, {"text": "ulnar collateral ligament", "correct": false, "why": "The UCL is medial. [Slide #100]"}, {"text": "bicipital aponeurosis", "correct": false, "why": "This is part of the biceps insertion. [Slide #100]"}, {"text": "flexor retinaculum", "correct": false, "why": "This is at the wrist. [Slide #100]"}]},
  {"id": 215, "subjectIndex": 10, "quarter": 4, "slideRef": 100, "difficulty": "hard", "priority": true, "stem": "Which statement correctly contrasts the shapes of the elbow collateral ligaments?", "options": [{"text": "Radial collateral is fan-shaped; ulnar collateral is triangular", "correct": true, "why": "RCL is fan-like; UCL is triangular, with three bands. [Slide #100]"}, {"text": "Radial collateral is triangular; ulnar collateral is fan-shaped", "correct": false, "why": "Reversed. [Slide #100]"}, {"text": "Both are circular bands", "correct": false, "why": "Only the annular ligament encircles a bone. [Slide #100]"}, {"text": "Both are single cord-like bands", "correct": false, "why": "The UCL has three bands. [Slide #100]"}]},
  {"id": 216, "subjectIndex": 10, "quarter": 4, "slideRef": 100, "difficulty": "medium", "priority": true, "stem": "The radial collateral ligament mainly resists force applied from the _______ side (varus stress).", "options": [{"text": "medial", "correct": true, "why": "The RCL is lateral, so it resists force coming from the medial side (varus). [Slide #100]"}, {"text": "lateral", "correct": false, "why": "Force from the lateral side (valgus) is resisted by the UCL. [Slide #100]"}, {"text": "anterior", "correct": false, "why": "Anteroposterior force is not the collaterals' main role. [Slide #100]"}, {"text": "posterior", "correct": false, "why": "Not the main role of the collaterals. [Slide #100]"}]},
