function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ----------------- Quiz Execution Engine ----------------- */
function startQuiz(countParam) {
  const pool = getFilteredPool();
  if (pool.length === 0) {
    alert("No questions match your current subject selection. Please select at least one module.");
    return;
  }

  const targetCount = countParam === 'all' ? pool.length : Math.min(countParam, pool.length);

  let chosenPool = [];
  if (prioritizeMissed) {
    let poolCopy = [...pool];
    let selectedSet = new Set();
    while (selectedSet.size < targetCount && poolCopy.length > 0) {
      let weightedItems = [];
      poolCopy.forEach(q => {
        let weight = (hist[q.id] || 0) > 0 ? 3 : 1;
        for (let w = 0; w < weight; w++) weightedItems.push(q);
      });
      let pick = weightedItems[Math.floor(Math.random() * weightedItems.length)];
      if (!selectedSet.has(pick.id)) {
        selectedSet.add(pick.id);
        chosenPool.push(pick);
        poolCopy = poolCopy.filter(item => item.id !== pick.id);
      }
    }
  } else {
    chosenPool = shuffle(pool).slice(0, targetCount);
  }

  quizQuestions = chosenPool.map(q => {
    const copy = JSON.parse(JSON.stringify(q));
    copy.options = shuffle(copy.options);
    copy._locked = false;
    copy._selectedIndex = null;
    copy._isCorrect = false;
    return copy;
  });

  currentIndex = 0;
  score = 0;
  answeredCount = 0;
  renderActiveQuiz();
}

function renderActiveQuiz() {
  if (viewMode === 'all') renderAllQuestions();
  else renderQuestion();
}

/* Mode A: One by One */
function renderQuestion() {
  updateHeader();
  if (currentIndex >= quizQuestions.length) {
    renderSummary();
    return;
  }
  const q = quizQuestions[currentIndex];
  const L = ['A', 'B', 'C', 'D'];
  const renderedStem = esc(q.stem).replace(/_{3,}/g, '<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>');

  $('app-container').innerHTML = `
    <div class="card" id="qcard-${currentIndex}">
      <div class="meta">
        <span class="badge">Question ${currentIndex + 1} of ${quizQuestions.length}</span>
        <span class="badge alt">${SUBJECTS[q.subjectIndex]}</span>
        <span class="badge alt diff-${q.difficulty}">${q.difficulty}</span>
        <span class="badge alt">Slide #${q.slideRef}</span>
        ${q.priority ? '<span class="badge">High-Yield</span>' : ''}
      </div>
      <div class="stem">${renderedStem}</div>
      <div class="options-container">
        ${q.options.map((opt, oi) => `
          <button class="option-btn ${getOptionClass(q, oi)}"
            ${q._locked ? 'disabled' : ''}
            onclick="handleAnswer(${currentIndex}, ${oi})">
            <b>${L[oi]}.</b> ${esc(opt.text)}
          </button>
        `).join('')}
      </div>
      <div id="explanation-container">
        ${q._locked ? renderExplanationHTML(q) : ''}
      </div>
      ${q._locked ? `
        <div class="nav-actions">
          <button class="next-btn" onclick="nextQuestion()">
            ${currentIndex === quizQuestions.length - 1 ? 'View Results Summary' : 'Next Question &rarr;'}
          </button>
        </div>
      ` : ''}
    </div>
  `;
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex >= quizQuestions.length) {
    renderSummary();
  } else {
    renderQuestion();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

/* Mode B: All at Once */
function renderAllQuestions() {
  updateHeader();
  const L = ['A', 'B', 'C', 'D'];

  $('app-container').innerHTML = `
    <div id="all-questions-list">
      ${quizQuestions.map((q, qi) => {
        const renderedStem = esc(q.stem).replace(/_{3,}/g, '<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>');
        return `
          <div class="card" id="qcard-${qi}">
            <div class="meta">
              <span class="badge">Q${qi + 1}</span>
              <span class="badge alt">${SUBJECTS[q.subjectIndex]}</span>
              <span class="badge alt diff-${q.difficulty}">${q.difficulty}</span>
              <span class="badge alt">Slide #${q.slideRef}</span>
              ${q.priority ? '<span class="badge">High-Yield</span>' : ''}
            </div>
            <div class="stem">${renderedStem}</div>
            <div class="options-container">
              ${q.options.map((opt, oi) => `
                <button class="option-btn ${getOptionClass(q, oi)}"
                  ${q._locked ? 'disabled' : ''}
                  onclick="handleAnswer(${qi}, ${oi})">
                  <b>${L[oi]}.</b> ${esc(opt.text)}
                </button>
              `).join('')}
            </div>
            <div id="explanation-container-${qi}">
              ${q._locked ? renderExplanationHTML(q) : ''}
            </div>
          </div>
        `;
      }).join('')}
    </div>
    ${answeredCount === quizQuestions.length ? `
      <div class="actions-row">
        <button class="btn-launch" style="padding:14px 28px;" onclick="renderSummary()">View Final Results Summary</button>
      </div>
    ` : ''}
  `;
}

function getOptionClass(q, oi) {
  if (!q._locked) return '';
  if (q.options[oi].correct) return 'correct';
  if (q._selectedIndex === oi) return 'incorrect';
  return 'dim';
}

function handleAnswer(qIndex, oIndex) {
  const q = quizQuestions[qIndex];
  if (q._locked) return;

  q._locked = true;
  q._selectedIndex = oIndex;
  q._isCorrect = q.options[oIndex].correct;

  answeredCount++;
  if (q._isCorrect) {
    score++;
    if (hist[q.id]) {
      hist[q.id] = Math.max(0, hist[q.id] - 1);
      saveHistory();
    }
  } else {
    hist[q.id] = (hist[q.id] || 0) + 1;
    saveHistory();
    triggerWrongFeedback();
  }

  updateHeader();

  if (viewMode === 'all') {
    const card = $(`qcard-${qIndex}`);
    if (card) {
      const btns = card.querySelectorAll('.option-btn');
      btns.forEach((btn, bi) => {
        btn.disabled = true;
        btn.className = `option-btn ${getOptionClass(q, bi)}`;
      });
      const exp = $(`explanation-container-${qIndex}`);
      if (exp) exp.innerHTML = renderExplanationHTML(q);
    }
    if (answeredCount === quizQuestions.length) {
      setTimeout(() => {
        if (!$('final-btn-row')) {
          const div = document.createElement('div');
          div.id = 'final-btn-row';
          div.className = 'actions-row';
          div.innerHTML = `<button class="btn-launch" style="padding:14px 28px;" onclick="renderSummary()">View Final Results Summary</button>`;
          $('app-container').appendChild(div);
          div.scrollIntoView({ behavior: 'smooth' });
        }
      }, 300);
    }
  } else {
    renderQuestion();
  }
}

function renderExplanationHTML(q) {
  const L = ['A', 'B', 'C', 'D'];
  return `
    <div class="explain">
      <div class="banner ${q._isCorrect ? 'ok' : 'bad'}">
        ${q._isCorrect ? 'CORRECT!' : 'INCORRECT.'}
      </div>
      <div class="concept">
        <b>Core Concept:</b> ${esc(q.concept)}
      </div>
      <ul>
        ${q.options.map((opt, i) => `
          <li class="${opt.correct ? 'c' : ''}">
            <b>${L[i]}) ${esc(opt.text)}:</b> ${esc(opt.why)}
          </li>
        `).join('')}
      </ul>
    </div>
  `;
}

function triggerWrongFeedback() {
  if (muted) return;
  const audio = $('wrongAudio');
  if (audio) {
    audio.currentTime = 0;
    audio.play().catch(err => console.log('Audio autoplay prevented:', err));
  }
  const popup = $('wrongPopup');
  if (popup) {
    popup.classList.remove('hidden');
    clearTimeout(popupTimeout);
    popupTimeout = setTimeout(() => popup.classList.add('hidden'), 2000);
  }
}

/* ----------------- Summary & Analytics ----------------- */
function renderSummary() {
  const total = quizQuestions.length;
  const pct = Math.round((score / total) * 100);

  let tier = '';
  if (pct >= 90) {
    tier = 'Absolute Gigachad. You drained that test dry.';
  } else if (pct >= 70) {
    tier = 'You lasted less than 30 seconds. Time for a rematch.';
  } else {
    tier = 'You really didn’t fucking know that.';
  }

  const subjectStats = {};
  const diffStats = {
    easy: { total: 0, correct: 0 },
    medium: { total: 0, correct: 0 },
    hard: { total: 0, correct: 0 }
  };

  quizQuestions.forEach(q => {
    const sName = SUBJECTS[q.subjectIndex];
    if (!subjectStats[sName]) subjectStats[sName] = { total: 0, correct: 0 };
    subjectStats[sName].total++;
    diffStats[q.difficulty].total++;
    if (q._isCorrect) {
      subjectStats[sName].correct++;
      diffStats[q.difficulty].correct++;
    }
  });

  const missedCount = quizQuestions.filter(q => !q._isCorrect).length;

  $('app-container').innerHTML = `
    <div class="summary-card">
      <div class="score-big">${pct}%</div>
      <div style="font-size:1.15rem;color:#ccc;margin-top:4px;">${score} / ${total} Correct</div>
      <div class="tier-text" style="color:var(--accent);">${tier}</div>

      <div class="filter-title" style="margin-top:24px;">Cognitive Level Breakdown</div>
      <table class="summary-table">
        <thead>
          <tr>
            <th style="text-align:left;">Difficulty Level</th>
            <th>Correct</th>
            <th>Percentage</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td style="text-align:left;color:#22c55e;font-weight:700;">Easy (Direct Recall)</td>
            <td>${diffStats.easy.correct} / ${diffStats.easy.total}</td>
            <td>${diffStats.easy.total ? Math.round((diffStats.easy.correct / diffStats.easy.total) * 100) : 0}%</td>
          </tr>
          <tr>
            <td style="text-align:left;color:#f59e0b;font-weight:700;">Medium (Application & Relationships)</td>
            <td>${diffStats.medium.correct} / ${diffStats.medium.total}</td>
            <td>${diffStats.medium.total ? Math.round((diffStats.medium.correct / diffStats.medium.total) * 100) : 0}%</td>
          </tr>
          <tr>
            <td style="text-align:left;color:#ef4444;font-weight:700;">Hard (Multi-Concept Integration)</td>
            <td>${diffStats.hard.correct} / ${diffStats.hard.total}</td>
            <td>${diffStats.hard.total ? Math.round((diffStats.hard.correct / diffStats.hard.total) * 100) : 0}%</td>
          </tr>
        </tbody>
      </table>

      <div class="filter-title" style="margin-top:24px;">Subject Module Breakdown</div>
      <table class="summary-table">
        <thead>
          <tr>
            <th style="text-align:left;">Module / Subject</th>
            <th>Correct</th>
            <th>Percentage</th>
          </tr>
        </thead>
        <tbody>
          ${Object.keys(subjectStats).map(s => {
            const st = subjectStats[s];
            const p = Math.round((st.correct / st.total) * 100);
            return `
              <tr>
                <td style="text-align:left;font-weight:600;">${s}</td>
                <td>${st.correct} / ${st.total}</td>
                <td>${p}%</td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>

      <div class="actions-row">
        <button class="btn-ui" onclick="renderHome()">Return to Dashboard</button>
        <button class="btn-ui active" onclick="retakeCurrentSet()">Retake Same Set</button>
        ${missedCount > 0 ? `
          <button class="btn-ui" style="border-color:#ef4444;color:#ef4444;" onclick="reviewMissedNow()">
            Review Missed Questions (${missedCount})
          </button>
        ` : ''}
        <a href="index.html" class="btn-ui">Back to Main Page</a>
      </div>
    </div>
  `;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function retakeCurrentSet() {
  const ids = new Set(quizQuestions.map(q => q.id));
  const subset = questionBank.filter(q => ids.has(q.id));
  quizQuestions = shuffle(subset).map(q => {
    const copy = JSON.parse(JSON.stringify(q));
    copy.options = shuffle(copy.options);
    copy._locked = false;
    copy._selectedIndex = null;
    copy._isCorrect = false;
    return copy;
  });
  currentIndex = 0;
  score = 0;
  answeredCount = 0;
  renderActiveQuiz();
}

function reviewMissedNow() {
  const missedIds = new Set(quizQuestions.filter(q => !q._isCorrect).map(q => q.id));
  const subset = questionBank.filter(q => missedIds.has(q.id));
  quizQuestions = shuffle(subset).map(q => {
    const copy = JSON.parse(JSON.stringify(q));
    copy.options = shuffle(copy.options);
    copy._locked = false;
    copy._selectedIndex = null;
    copy._isCorrect = false;
    return copy;
  });
  currentIndex = 0;
  score = 0;
  answeredCount = 0;
  renderActiveQuiz();
}

window.addEventListener('load', () => {
  updateStfuButton();
  updateModeButton();
  renderHome();
});
</script>
</body>
</html>
