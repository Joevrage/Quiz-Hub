  {"id": 217, "subjectIndex": 10, "quarter": 4, "slideRef": 100, "difficulty": "hard", "priority": false, "stem": "Which ligament resists valgus force applied from the lateral side of the elbow?", "options": [{"text": "Ulnar collateral ligament", "correct": true, "why": "The medial UCL resists force from the lateral side (valgus), which is why throwers injure it. [Slide #100]"}, {"text": "Radial collateral ligament", "correct": false, "why": "The RCL resists force from the medial side. [Slide #100]"}, {"text": "Annular ligament", "correct": false, "why": "This stabilizes the radial head during rotation. [Slide #100]"}, {"text": "Interosseous membrane", "correct": false, "why": "This connects the radius and ulna shafts. [Slide #100]"}]},

/* ----------------- State & Storage Engine ----------------- */
let hist = {};
try { hist = JSON.parse(localStorage.getItem('quiz_missed_history') || '{}'); } catch (e) {}
const saveHistory = () => { try { localStorage.setItem('quiz_missed_history', JSON.stringify(hist)); } catch (e) {} };

let selectedSubjects = new Set(SUBJECTS.map((_, i) => i));
let prioritizeMissed = false;
let quizQuestions = [];
let currentIndex = 0;
let score = 0;
let answeredCount = 0;
let popupTimeout = null;
let muted = false;
let viewMode = 'single'; // 'single' | 'all'

try { muted = localStorage.getItem('stfuErijah') === '1'; } catch (e) {}
try { viewMode = localStorage.getItem('quizViewMode') || 'single'; } catch (e) {}

const $ = id => document.getElementById(id);

function updateStfuButton() {
  const b = $('stfuBtn');
  if (!b) return;
  b.textContent = muted ? 'Bring Back Erijah' : 'STFU Erijah';
  b.classList.toggle('muted', muted);
  if (muted) {
    const a = $('wrongAudio');
    if (a) { a.pause(); a.currentTime = 0; }
    if (popupTimeout) clearTimeout(popupTimeout);
    const p = $('wrongPopup');
    if (p) p.classList.add('hidden');
  }
}

function toggleStfu() {
  muted = !muted;
  try { localStorage.setItem('stfuErijah', muted ? '1' : '0'); } catch (e) {}
  updateStfuButton();
}

function updateModeButton() {
  const b = $('modeBtn');
  if (!b) return;
  b.textContent = viewMode === 'all' ? 'View: All at Once' : 'View: One by One';
  b.classList.toggle('active', viewMode === 'all');
}

function toggleMode() {
  viewMode = viewMode === 'all' ? 'single' : 'all';
  try { localStorage.setItem('quizViewMode', viewMode); } catch (e) {}
  updateModeButton();
  if (quizQuestions.length > 0) {
    renderActiveQuiz();
  } else {
    renderHome();
  }
}

function updateHeader() {
  const total = quizQuestions.length;
  const pct = answeredCount ? Math.round((score / answeredCount) * 100) : 0;
  if (viewMode === 'all') {
    $('progress-pill').textContent = `Answered: ${answeredCount} / ${total}`;
  } else {
    $('progress-pill').textContent = `Question ${total ? currentIndex + 1 : 0} of ${total}`;
  }
  $('score-pill').textContent = `Score: ${score} / ${answeredCount} (${pct}%)`;
  $('progress-bar').style.width = (total ? (answeredCount / total) * 100 : 0) + '%';
}

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ----------------- Filter & Menu Dashboard ----------------- */
function getFilteredPool() {
  let pool = questionBank.filter(q => selectedSubjects.has(q.subjectIndex));
  if (prioritizeMissed) {
    const missedPool = pool.filter(q => (hist[q.id] || 0) > 0);
    if (missedPool.length > 0) return missedPool;
  }
  return pool;
}

function toggleSubject(idx) {
  if (selectedSubjects.has(idx)) {
    if (selectedSubjects.size > 1) selectedSubjects.delete(idx);
  } else {
    selectedSubjects.add(idx);
  }
  renderHome();
}

function selectAllSubjects() {
  selectedSubjects = new Set(SUBJECTS.map((_, i) => i));
  renderHome();
}

function clearSubjects() {
  selectedSubjects = new Set();
  renderHome();
}

function toggleMissedFilter() {
  prioritizeMissed = !prioritizeMissed;
  renderHome();
}

function setViewModeFromHome(m) {
  viewMode = m;
  try { localStorage.setItem('quizViewMode', viewMode); } catch (e) {}
  updateModeButton();
  renderHome();
}

function renderHome() {
  quizQuestions = [];
  currentIndex = 0;
  score = 0;
  answeredCount = 0;
  updateHeader();
  updateModeButton();

  const totalMissedCount = questionBank.filter(q => (hist[q.id] || 0) > 0).length;
  const filteredPool = getFilteredPool();

  const subjectCounts = {};
  SUBJECTS.forEach((_, i) => subjectCounts[i] = 0);
  questionBank.forEach(q => subjectCounts[q.subjectIndex]++);

  $('app-container').innerHTML = `
    <div class="dashboard-card">
      <div class="dash-title">Master Practice Dashboard</div>
      <div class="dash-desc">Filter modules across the upper extremity, target previously missed questions, and choose your preferred study view.</div>

      <div class="filter-section">
        <div class="filter-title">
          <span>1. Select Subject Modules</span>
          <div style="display:flex;gap:6px;">
            <button class="btn-ui" onclick="selectAllSubjects()">Select All</button>
            <button class="btn-ui" onclick="clearSubjects()">Clear</button>
          </div>
        </div>
        <div class="subject-chips">
          ${SUBJECTS.map((s, i) => `
            <div class="chip ${selectedSubjects.has(i) ? 'active' : ''}" onclick="toggleSubject(${i})">
              ${s} (${subjectCounts[i]})
            </div>
          `).join('')}
        </div>
      </div>

      <div class="filter-section">
        <div class="filter-title">2. Study Targeting</div>
        <div class="selector-row">
          <div class="chip ${prioritizeMissed ? 'active' : ''}" onclick="toggleMissedFilter()">
            Prioritize Missed Questions (${totalMissedCount} in history)
          </div>
        </div>
      </div>

      <div class="filter-section">
        <div class="filter-title">3. Display Mode</div>
        <div class="selector-row">
          <div class="chip ${viewMode === 'single' ? 'active' : ''}" onclick="setViewModeFromHome('single')">
            One by One (Flashcard/Card View)
          </div>
          <div class="chip ${viewMode === 'all' ? 'active' : ''}" onclick="setViewModeFromHome('all')">
            All at Once (Continuous List)
          </div>
        </div>
      </div>

      <div class="bank-counter">
        Ready Pool: ${filteredPool.length} questions across ${selectedSubjects.size} selected subjects
      </div>

      <div class="filter-title" style="margin-top:20px;">4. Launch Quiz Session</div>
      <div class="launch-grid">
        <button class="btn-launch" onclick="startQuiz(15)">Quickie (15 Qs)</button>
        <button class="btn-launch" onclick="startQuiz(25)">Quickie (25 Qs)</button>
        <button class="btn-launch" onclick="startQuiz(35)">Quickie (35 Qs)</button>
        <button class="btn-launch" onclick="startQuiz(50)">Full Exam (50 Qs)</button>
        <button class="btn-launch" onclick="startQuiz(filteredPool.length)">Entire Selected Bank (${filteredPool.length} Qs)</button>
      </div>

  `;
}

/* ----------------- Quiz Execution Engine ----------------- */
function startQuiz(count) {
  const pool = getFilteredPool();
  if (pool.length === 0) {
    alert("No questions match your current subject / missed filter selection. Please expand your selection.");
    return;
  }
  const targetCount = Math.min(count, pool.length);
  const shuffledPool = shuffle(pool).slice(0, targetCount);

  quizQuestions = shuffledPool.map(q => {
    const copy = JSON.parse(JSON.stringify(q));
    copy.options = shuffle(copy.options);
    copy._locked = false;
    copy._selectedIndex = null;
    copy._isCorrect = false;
    return copy;
  });

  currentIndex = 0;
  score = 0;
  answeredCount = 0;
  renderActiveQuiz();
}

function renderActiveQuiz() {
  if (viewMode === 'all') renderAllQuestions();
  else renderQuestion();
}

/* Mode A: One by One */
function renderQuestion() {
  updateHeader();
  if (currentIndex >= quizQuestions.length) {
    renderSummary();
    return;
  }
  const q = quizQuestions[currentIndex];
  const L = ['A', 'B', 'C', 'D'];

  const renderedStem = esc(q.stem).replace(/_{3,}/g, '<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>');

  $('app-container').innerHTML = `
    <div class="card" id="qcard-${currentIndex}">
      <div class="meta">
        <span class="badge">Question ${currentIndex + 1} of ${quizQuestions.length}</span>
        <span class="badge alt">${SUBJECTS[q.subjectIndex]}</span>
        <span class="badge alt diff-${q.difficulty}">${q.difficulty}</span>
        <span class="badge alt">Slide #${q.slideRef}</span>
        ${q.priority ? '<span class="badge">High-Yield</span>' : ''}
      </div>
      <div class="stem">${renderedStem}</div>
      <div class="options-container">
        ${q.options.map((opt, oi) => `
          <button class="option-btn ${getOptionClass(q, oi)}"
            ${q._locked ? 'disabled' : ''}
            onclick="handleAnswer(${currentIndex}, ${oi})">
            <b>${L[oi]}.</b> ${esc(opt.text)}
          </button>
        `).join('')}
      </div>
      <div id="explanation-container">
        ${q._locked ? renderExplanationHTML(q) : ''}
      </div>
      ${q._locked ? `
        <div class="nav-actions">
          <button class="next-btn" onclick="nextQuestion()">
            ${currentIndex === quizQuestions.length - 1 ? 'View Results Summary' : 'Next Question &rarr;'}
          </button>
        </div>
      ` : ''}
    </div>
  `;
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex >= quizQuestions.length) {
    renderSummary();
  } else {
    renderQuestion();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

/* Mode B: All at Once */
function renderAllQuestions() {
  updateHeader();
  const L = ['A', 'B', 'C', 'D'];

  $('app-container').innerHTML = `
    <div id="all-questions-list">
      ${quizQuestions.map((q, qi) => {
        const renderedStem = esc(q.stem).replace(/_{3,}/g, '<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>');
        return `
          <div class="card" id="qcard-${qi}">
            <div class="meta">
              <span class="badge">Q${qi + 1}</span>
              <span class="badge alt">${SUBJECTS[q.subjectIndex]}</span>
              <span class="badge alt diff-${q.difficulty}">${q.difficulty}</span>
              <span class="badge alt">Slide #${q.slideRef}</span>
              ${q.priority ? '<span class="badge">High-Yield</span>' : ''}
            </div>
            <div class="stem">${renderedStem}</div>
            <div class="options-container">
              ${q.options.map((opt, oi) => `
                <button class="option-btn ${getOptionClass(q, oi)}"
                  ${q._locked ? 'disabled' : ''}
                  onclick="handleAnswer(${qi}, ${oi})">
                  <b>${L[oi]}.</b> ${esc(opt.text)}
                </button>
              `).join('')}
            </div>
            <div id="explanation-container-${qi}">
              ${q._locked ? renderExplanationHTML(q) : ''}
            </div>
          </div>
        `;
      }).join('')}
    </div>
    ${answeredCount === quizQuestions.length ? `
      <div class="actions-row">
        <button class="btn-launch" style="padding:14px 28px;" onclick="renderSummary()">View Final Results Summary</button>
      </div>
    ` : ''}
  `;
}

function getOptionClass(q, oi) {
  if (!q._locked) return '';
  if (q.options[oi].correct) return 'correct';
  if (q._selectedIndex === oi) return 'incorrect';
  return 'dim';
}

function handleAnswer(qIndex, oIndex) {
  const q = quizQuestions[qIndex];
  if (q._locked) return;

  q._locked = true;
  q._selectedIndex = oIndex;
  q._isCorrect = q.options[oIndex].correct;

  answeredCount++;
  if (q._isCorrect) {
    score++;
    if (hist[q.id]) {
      hist[q.id] = Math.max(0, hist[q.id] - 1);
      saveHistory();
    }
  } else {
    hist[q.id] = (hist[q.id] || 0) + 1;
    saveHistory();
    triggerWrongFeedback();
  }

  updateHeader();

  if (viewMode === 'all') {
    // In-place update preserving scroll position
    const card = $(`qcard-${qIndex}`);
    if (card) {
      const btns = card.querySelectorAll('.option-btn');
      btns.forEach((btn, bi) => {
        btn.disabled = true;
        btn.className = `option-btn ${getOptionClass(q, bi)}`;
      });
      const exp = $(`explanation-container-${qIndex}`);
      if (exp) exp.innerHTML = renderExplanationHTML(q);
    }
    if (answeredCount === quizQuestions.length) {
      setTimeout(() => {
        if (!$('final-btn-row')) {
          const div = document.createElement('div');
          div.id = 'final-btn-row';
          div.className = 'actions-row';
          div.innerHTML = `<button class="btn-launch" style="padding:14px 28px;" onclick="renderSummary()">View Final Results Summary</button>`;
          $('app-container').appendChild(div);
          div.scrollIntoView({ behavior: 'smooth' });
        }
      }, 300);
    }
  } else {
    renderQuestion();
  }
}

function renderExplanationHTML(q) {
  const L = ['A', 'B', 'C', 'D'];
  return `
    <div class="explain">
      <div class="banner ${q._isCorrect ? 'ok' : 'bad'}">
        ${q._isCorrect ? 'Correct!' : 'Incorrect.'}
      </div>
      <div class="concept">
        <b>Core Concept:</b> ${q.options.find(o => o.correct).why}
      </div>
      <ul>
        ${q.options.map((opt, i) => `
          <li class="${opt.correct ? 'c' : ''}">
            <b>${L[i]}) ${esc(opt.text)}:</b> ${esc(opt.why)}
          </li>
        `).join('')}
      </ul>
    </div>
  `;
}

function triggerWrongFeedback() {
  if (muted) return;
  const audio = $('wrongAudio');
  if (audio) {
    audio.currentTime = 0;
    audio.play().catch(err => console.log('Audio autoplay prevented:', err));
  }
  const popup = $('wrongPopup');
  if (popup) {
    popup.classList.remove('hidden');
    clearTimeout(popupTimeout);
    popupTimeout = setTimeout(() => popup.classList.add('hidden'), 2000);
  }
}

/* ----------------- Summary & Analytics ----------------- */
function renderSummary() {
  const total = quizQuestions.length;
  const pct = Math.round((score / total) * 100);

  let tier = '';
  if (pct >= 90) {
    tier = 'Absolute Gigachad. You drained that test dry.';
  } else if (pct >= 70) {
    tier = 'You lasted less than 30 seconds. Time for a rematch.';
  } else {
    tier = 'You really didn’t fucking know that.';
  }

  const subjectStats = {};
  quizQuestions.forEach(q => {
    const sName = SUBJECTS[q.subjectIndex];
    if (!subjectStats[sName]) subjectStats[sName] = { total: 0, correct: 0 };
    subjectStats[sName].total++;
    if (q._isCorrect) subjectStats[sName].correct++;
  });

  const missedCount = quizQuestions.filter(q => !q._isCorrect).length;

  $('app-container').innerHTML = `
    <div class="summary-card">
      <div class="score-big">${pct}%</div>
      <div style="font-size:1.1rem;color:#ccc;margin-top:4px;">${score} / ${total} Correct</div>
      <div class="tier-text" style="color:var(--accent);">${tier}</div>

      <table class="summary-table">
        <thead>
          <tr>
            <th style="text-align:left;">Module / Subject</th>
            <th>Correct</th>
            <th>Percentage</th>
          </tr>
        </thead>
        <tbody>
          ${Object.keys(subjectStats).map(s => {
            const st = subjectStats[s];
            const p = Math.round((st.correct / st.total) * 100);
            return `
              <tr>
                <td style="text-align:left;font-weight:600;">${s}</td>
                <td>${st.correct} / ${st.total}</td>
                <td>${p}%</td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>

      <div class="actions-row">
        <button class="btn-ui" onclick="renderHome()">Return to Dashboard</button>
        <button class="btn-ui active" onclick="retakeCurrentSet()">Retake Same Set</button>
        ${missedCount > 0 ? `
          <button class="btn-ui" style="border-color:#ef4444;color:#ef4444;" onclick="reviewMissedNow()">
            Review Missed Questions (${missedCount})
          </button>
        ` : ''}
      </div>
    </div>
  `;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function retakeCurrentSet() {
  const ids = new Set(quizQuestions.map(q => q.id));
  const subset = questionBank.filter(q => ids.has(q.id));
  quizQuestions = shuffle(subset).map(q => {
    const copy = JSON.parse(JSON.stringify(q));
    copy.options = shuffle(copy.options);
    copy._locked = false;
    copy._selectedIndex = null;
    copy._isCorrect = false;
    return copy;
  });
  currentIndex = 0;
  score = 0;
  answeredCount = 0;
  renderActiveQuiz();
}

function reviewMissedNow() {
  const missedIds = new Set(quizQuestions.filter(q => !q._isCorrect).map(q => q.id));
  const subset = questionBank.filter(q => missedIds.has(q.id));
  quizQuestions = shuffle(subset).map(q => {
    const copy = JSON.parse(JSON.stringify(q));
    copy.options = shuffle(copy.options);
    copy._locked = false;
    copy._selectedIndex = null;
    copy._isCorrect = false;
    return copy;
  });
  currentIndex = 0;
  score = 0;
  answeredCount = 0;
  renderActiveQuiz();
}

window.addEventListener('load', () => {
  updateStfuButton();
  updateModeButton();
  renderHome();
});
</script>
</body>
</html>
