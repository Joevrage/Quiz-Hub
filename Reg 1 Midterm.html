body {

header {

}
.header-row {

  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  max-width: 1000px;
  margin: 0 auto;
}
.brand {
  font-weight: 800;
  font-size: 1.1rem;
}
.brand span { color: var(--accent); }
.brand small {
  display: block;
  color: var(--text-muted);
  font-weight: 400;
  font-size: 0.72rem;
}
.header-right {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
.btn-ui {
  background: #222;
  color: #fff;
  border: 1px solid var(--border-color);
  border-radius: 6px;
  padding: 6px 12px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  font-size: 0.82rem;
  transition: all 0.2s ease;
  white-space: nowrap;
}
.btn-ui:hover { border-color: var(--accent); }
.btn-ui.active, .btn-ui.muted {
  background: var(--accent);
  color: #000;
  border-color: var(--accent);
}
.pill {
  background: var(--bg-dark);
  border: 1px solid var(--border-color);
  border-radius: 99px;
  padding: 4px 12px;
  font-size: 0.8rem;
  color: var(--text-sub);
}
.score-pill {
  color: var(--accent);
  border-color: var(--accent);
  font-weight: 700;
}
.progress-track {
  width: 100%;
  height: 4px;
  background: #222;
}
#progress-bar {
  height: 4px;
  width: 0%;
  background: var(--accent);

}
#app-container {

  margin: 0 auto;
  padding: 16px;
}
.hidden { display: none !important; }

  border: 1px solid var(--border-color);

  margin-bottom: 24px;
}
.dash-title {
  font-size: 1.25rem;
  font-weight: 800;
  color: var(--accent);
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.dash-desc {
  color: var(--text-sub);
  font-size: 0.92rem;
  margin-bottom: 20px;
}
.filter-section {
  margin-bottom: 20px;
}
.filter-title {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;

  justify-content: space-between;
  align-items: center;
}
.subject-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.chip {
  background: #111;
  color: #ccc;
  border: 1px solid var(--border-color);
  border-radius: 99px;
  padding: 6px 14px;
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;

  user-select: none;
}
.chip:hover { border-color: var(--accent); }
.chip.active {
  background: var(--accent);
  color: #000;
  border-color: var(--accent);
}
.selector-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 8px;
}
.launch-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px;
  margin-top: 20px;
}
.btn-launch {
  background: linear-gradient(180deg, #ff9900 0%, #e68a00 100%);

  border: none;
  border-radius: 8px;
  padding: 12px;
  font-weight: 800;
  cursor: pointer;
  text-align: center;
  font-size: 0.9rem;

}
.btn-launch:hover { opacity: 0.95; transform: translateY(-1px); }
.btn-launch:active { transform: translateY(0); }
.bank-counter {
  margin-top: 15px;
  text-align: center;
  font-size: 0.88rem;
  color: var(--accent);
  font-weight: 600;
}

/* Question Cards */
.card {
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 22px;
  margin: 16px 0;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}
.meta {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
.badge {
  background: var(--accent);
  color: #000;
  font-size: 0.72rem;
  font-weight: 800;
  border-radius: 4px;
  padding: 2px 8px;
  text-transform: uppercase;
}
.badge.alt {
  background: #282828;
  color: #aaa;
}
.badge.diff-easy { color: #22c55e; }
.badge.diff-medium { color: #f59e0b; }
.badge.diff-hard { color: #ef4444; }
.stem {
  font-size: 1.1rem;
  font-weight: 600;
  margin-bottom: 16px;
  color: #f3f3f3;
}
.stem u {
  text-decoration: underline;
  text-underline-offset: 4px;
}
.option-btn {
  display: block;
  width: 100%;
  text-align: left;
  background: #121212;
  color: #fff;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 12px 16px;
  margin: 8px 0;
  font-family: inherit;
  font-size: 0.95rem;

  transition: border-color 0.15s, background 0.15s;

.option-btn:hover:not(:disabled) {
  border-color: var(--accent);
  background: #1c1c1c;
}
.option-btn:disabled { cursor: default; }
.option-btn.correct {
  background: var(--correct-bg) !important;
  border-color: var(--correct-border) !important;
  color: #fff !important;
  font-weight: 600;
}
.option-btn.incorrect {
  background: var(--incorrect-bg) !important;
  border-color: var(--incorrect-border) !important;
  color: #fff !important;
}
.option-btn.dim { opacity: 0.45; }

.explain {
  margin-top: 16px;
  border-top: 1px solid var(--border-color);
  padding-top: 16px;
  font-size: 0.92rem;
  animation: fadeIn 0.25s ease-out;
}
.banner {
  font-weight: 800;
  font-size: 1.05rem;
  margin-bottom: 8px;
}
.banner.ok { color: var(--correct-border); }
.banner.bad { color: var(--incorrect-border); }
.concept {
  background: #0f0f0f;
  border-left: 3px solid var(--accent);
  padding: 10px 14px;
  margin: 10px 0;
  color: #eee;
  border-radius: 0 4px 4px 0;
}
.explain ul {
  padding-left: 20px;
  margin: 10px 0;
  color: #bbb;
}
.explain li {
  margin: 8px 0;
  line-height: 1.4;
}
.explain li.c {
  color: var(--correct-border);
  font-weight: 600;
}
.nav-actions {
  display: flex;
  justify-content: flex-end;
  margin-top: 16px;
}
.next-btn {
  background: var(--accent);
  color: #000;
  border: none;
  border-radius: 6px;
  padding: 10px 22px;
  font-weight: 800;
  font-size: 0.92rem;
  cursor: pointer;

.summary-card {
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 32px 24px;
  text-align: center;
  margin: 20px 0;
}
.summary-card .score-big {
  font-size: 3rem;
  font-weight: 900;
  color: var(--accent);
}
.summary-card .tier-text {
  font-size: 1.15rem;
  margin: 14px 0 20px;
  font-weight: 700;
}
.summary-table {
  width: 100%;
  border-collapse: collapse;
  margin: 20px 0;
  font-size: 0.9rem;
}
.summary-table th, .summary-table td {
  border-bottom: 1px solid var(--border-color);
  padding: 8px;
  text-align: center;
}
.summary-table th { color: var(--text-muted); font-weight: 600; }
.actions-row {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 24px;
}

/* Wrong Audio / Popup */
.wrong-popup.hidden { display: none !important; }
.wrong-popup {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 2000;
  pointer-events: none;
  display: flex;
  justify-content: center;
  align-items: center;
  animation: popIn 0.15s ease-out;
}
.wrong-popup img {
  max-width: 80vw;
  max-height: 55vh;
  border-radius: 12px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.9);
  border: 3px solid #ef4444;
  display: block;
  object-fit: contain;
  background: #111;
}
@keyframes popIn {
  from { transform: translate(-50%, -50%) scale(0.85); opacity: 0; }
  to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>

const questionBank = [
  {"id": 0, "subjectIndex": 0, "quarter": 1, "slideRef": 3, "difficulty": "easy", "priority": true, "stem": "Which pair of muscles makes up the superficial posterior axio-appendicular group?", "options": [{"text": "Trapezius and latissimus dorsi", "correct": true, "why": "These two extrinsic shoulder muscles form the superficial posterior axio-appendicular layer. [Slide #3]"}, {"text": "Levator scapulae and rhomboids", "correct": false, "why": "These form the deep posterior axio-appendicular layer, beneath trapezius. [Slide #3]"}, {"text": "Deltoid and teres major", "correct": false, "why": "These are scapulohumeral muscles running scapula to humerus, not axial skeleton to limb. [Slide #3]"}, {"text": "Pectoralis major and serratus anterior", "correct": false, "why": "These belong to the anterior axio-appendicular group. [Slide #3]"}]},
  {"id": 1, "subjectIndex": 0, "quarter": 1, "slideRef": 3, "difficulty": "easy", "priority": true, "stem": "The deep posterior axio-appendicular muscles are the levator scapulae and the:", "options": [{"text": "rhomboids", "correct": true, "why": "Levator scapulae plus rhomboid major and minor form the deep posterior axio-appendicular layer. [Slide #3]"}, {"text": "teres major", "correct": false, "why": "Teres major is a scapulohumeral muscle (scapula to humerus). [Slide #3]"}, {"text": "latissimus dorsi", "correct": false, "why": "Latissimus dorsi is a superficial posterior axio-appendicular muscle. [Slide #3]"}, {"text": "serratus anterior", "correct": false, "why": "Serratus anterior is an anterior axio-appendicular muscle. [Slide #3]"}]},
  {"id": 2, "subjectIndex": 0, "quarter": 1, "slideRef": 3, "difficulty": "medium", "priority": true, "stem": "Which muscle is classified as a scapulohumeral muscle rather than an axio-appendicular muscle?", "options": [{"text": "Teres major", "correct": true, "why": "Scapulohumeral muscles (deltoid, teres major, four rotator cuff) run from scapula to humerus. [Slide #3]"}, {"text": "Levator scapulae", "correct": false, "why": "Levator scapulae runs from cervical TPs to scapula, making it axio-appendicular (deep posterior). [Slide #3]"}, {"text": "Pectoralis minor", "correct": false, "why": "Pectoralis minor runs from ribs to coracoid, making it anterior axio-appendicular. [Slide #3]"}, {"text": "Latissimus dorsi", "correct": false, "why": "Latissimus dorsi runs from the vertebral column to humerus, making it superficial posterior axio-appendicular. [Slide #3]"}]},
  {"id": 3, "subjectIndex": 0, "quarter": 1, "slideRef": 5, "difficulty": "easy", "priority": true, "stem": "The trapezius muscle is innervated by the _______ nerve.", "options": [{"text": "spinal accessory (CN XI)", "correct": true, "why": "Trapezius is supplied by the spinal accessory nerve (CN XI), C3-C4. [Slide #5]"}, {"text": "thoracodorsal", "correct": false, "why": "Thoracodorsal nerve supplies latissimus dorsi. [Slide #5]"}, {"text": "dorsal scapular", "correct": false, "why": "Dorsal scapular nerve supplies levator scapulae and the rhomboids. [Slide #5]"}, {"text": "long thoracic", "correct": false, "why": "Long thoracic nerve supplies serratus anterior. [Slide #5]"}]},
  {"id": 4, "subjectIndex": 0, "quarter": 1, "slideRef": 5, "difficulty": "medium", "priority": true, "stem": "Which trapezius fibers act to depress the scapula?", "options": [{"text": "Ascending (inferior) fibers", "correct": true, "why": "Inferior = ascending fibers; they pull the scapula downward (depression). [Slide #5]"}, {"text": "Descending (superior) fibers", "correct": false, "why": "Descending fibers elevate the scapula. [Slide #5]"}, {"text": "Middle (transverse) fibers", "correct": false, "why": "Middle fibers retract the scapula. [Slide #5]"}, {"text": "Clavicular fibers", "correct": false, "why": "There is no clavicular division of trapezius; it inserts on the lateral 1/3 of clavicle via descending fibers. [Slide #5]"}]},
  {"id": 5, "subjectIndex": 0, "quarter": 1, "slideRef": 5, "difficulty": "medium", "priority": true, "stem": "Contraction of the middle fibers of the trapezius produces which scapular action?", "options": [{"text": "Retraction", "correct": true, "why": "The middle part pulls the scapula medially toward the spine: retraction. [Slide #5]"}, {"text": "Elevation", "correct": false, "why": "Elevation is produced by the descending part. [Slide #5]"}, {"text": "Depression", "correct": false, "why": "Depression is produced by the ascending part. [Slide #5]"}, {"text": "Protraction", "correct": false, "why": "Protraction is produced by serratus anterior and pectoralis minor, not trapezius. [Slide #5]"}]},
  {"id": 6, "subjectIndex": 0, "quarter": 1, "slideRef": 5, "difficulty": "medium", "priority": true, "stem": "Simultaneous contraction of descending and ascending trapezius fibers produces which scapular movement?", "options": [{"text": "Superior rotation", "correct": true, "why": "Descending and ascending fibers working together rotate the scapula superiorly (glenoid up). [Slide #5]"}, {"text": "Inferior rotation", "correct": false, "why": "Inferior rotation of the glenoid is produced by the rhomboids. [Slide #5]"}, {"text": "Pure elevation", "correct": false, "why": "Pure elevation comes from descending fibers acting alone. [Slide #5]"}, {"text": "Protraction", "correct": false, "why": "Protraction is a serratus anterior / pectoralis minor action. [Slide #5]"}]},
  {"id": 7, "subjectIndex": 0, "quarter": 1, "slideRef": 5, "difficulty": "medium", "priority": false, "stem": "Which set of attachments describes the distal attachment of the trapezius?", "options": [{"text": "Spine of scapula, acromion, and lateral 1/3 of clavicle", "correct": true, "why": "Trapezius inserts on spine of scapula, acromion process, and lateral 1/3 of the clavicle. [Slide #5]"}, {"text": "Medial border of scapula from spine to inferior angle", "correct": false, "why": "That is the rhomboid major insertion. [Slide #5]"}, {"text": "Deltoid tuberosity of the humerus", "correct": false, "why": "That is the deltoid insertion. [Slide #5]"}, {"text": "Coracoid process of the scapula", "correct": false, "why": "Coracoid receives pectoralis minor, coracobrachialis, and biceps short head. [Slide #5]"}]},

  {"id": 9, "subjectIndex": 0, "quarter": 1, "slideRef": 6, "difficulty": "medium", "priority": true, "stem": "Which movements of the humerus are produced by the latissimus dorsi?", "options": [{"text": "Extension, adduction, and medial rotation", "correct": true, "why": "Lat dorsi extends, adducts, and medially rotates the humerus (lat pull-down). [Slide #6]"}, {"text": "Flexion, abduction, and lateral rotation", "correct": false, "why": "These are the exact opposites of the lat dorsi actions. [Slide #6]"}, {"text": "Abduction only", "correct": false, "why": "Abduction is a supraspinatus / middle deltoid action. [Slide #6]"}, {"text": "Extension, abduction, and lateral rotation", "correct": false, "why": "Lat dorsi adducts and medially rotates; it does not abduct or laterally rotate. [Slide #6]"}]},
  {"id": 10, "subjectIndex": 0, "quarter": 1, "slideRef": 6, "difficulty": "medium", "priority": true, "stem": "Assuming the humerus is the fixed attachment (hands on a bar) and the trunk is the moving attachment, latissimus dorsi contraction produces which action?", "options": [{"text": "Raising the body toward the arms", "correct": true, "why": "With the arms fixed, lat dorsi pulls the trunk up toward the arms, as in climbing. [Slide #6]"}, {"text": "Medial rotation of the humerus", "correct": false, "why": "That action requires the humerus to be the moving attachment. [Slide #6]"}, {"text": "Elevation of the scapula", "correct": false, "why": "Scapular elevation belongs to trapezius (descending) and levator scapulae. [Slide #6]"}, {"text": "Lateral flexion of the cervical spine", "correct": false, "why": "Lat dorsi has no cervical attachment; that is levator scapulae with scapula fixed. [Slide #6]"}]},
  {"id": 11, "subjectIndex": 0, "quarter": 1, "slideRef": 6, "difficulty": "easy", "priority": false, "stem": "The latissimus dorsi arises from the spinous processes of _______, the thoracolumbar fascia, iliac crest, and inferior 3-4 ribs.", "options": [{"text": "T7-L5", "correct": true, "why": "Lat dorsi arises from SP T7-L5, thoracolumbar fascia, iliac crest, and inferior 3 or 4 ribs. [Slide #6]"}, {"text": "C7-T12", "correct": false, "why": "C7-T12 spinous processes belong to the trapezius origin. [Slide #6]"}, {"text": "T2-T5", "correct": false, "why": "T2-T5 spinous processes are the rhomboid major origin. [Slide #6]"}, {"text": "C1-C4", "correct": false, "why": "C1-C4 (transverse processes) give rise to levator scapulae. [Slide #6]"}]},
  {"id": 12, "subjectIndex": 0, "quarter": 1, "slideRef": 6, "difficulty": "medium", "priority": true, "stem": "The thoracodorsal nerve supplying latissimus dorsi carries fibers from which spinal levels?", "options": [{"text": "C6-C8", "correct": true, "why": "Thoracodorsal nerve: C6-C8. [Slide #6]"}, {"text": "C3-C4", "correct": false, "why": "C3-C4 are the levels listed for spinal accessory (trapezius). [Slide #6]"}, {"text": "C5 only", "correct": false, "why": "C5 is the primary level of the dorsal scapular nerve. [Slide #6]"}, {"text": "C8-T1", "correct": false, "why": "C8-T1 is the medial pectoral nerve / ulnar nerve level. [Slide #6]"}]},
  {"id": 13, "subjectIndex": 0, "quarter": 1, "slideRef": 8, "difficulty": "easy", "priority": true, "stem": "The levator scapulae arises from which vertebral landmarks?", "options": [{"text": "Transverse processes of C1-C4", "correct": true, "why": "Levator scapulae: origin TP C1-C4. [Slide #8]"}, {"text": "Spinous processes of C7-T1", "correct": false, "why": "SP C7-T1 is the rhomboid minor origin. [Slide #8]"}, {"text": "Spinous processes of T2-T5", "correct": false, "why": "SP T2-T5 is the rhomboid major origin. [Slide #8]"}, {"text": "Spinous processes of C7-T12", "correct": false, "why": "SP C7-T12 is part of the trapezius origin. [Slide #8]"}]},
  {"id": 14, "subjectIndex": 0, "quarter": 1, "slideRef": 8, "difficulty": "hard", "priority": true, "stem": "Assuming the scapula is the fixed attachment and the cervical vertebrae are the moving attachment, levator scapulae contraction produces which action?", "options": [{"text": "Lateral flexion of the cervical spine", "correct": true, "why": "When the scapula is stationary, levator scapulae may assist lateral flexion of the cervical vertebrae. [Slide #8]"}, {"text": "Elevation of the scapula", "correct": false, "why": "Elevation occurs when the cervical spine is fixed and the scapula moves. [Slide #8]"}, {"text": "Retraction of the scapula", "correct": false, "why": "Retraction is a rhomboid / middle trapezius action and needs a moving scapula. [Slide #8]"}, {"text": "Extension of the humerus", "correct": false, "why": "Levator scapulae has no humeral attachment. [Slide #8]"}]},
  {"id": 15, "subjectIndex": 0, "quarter": 1, "slideRef": 8, "difficulty": "medium", "priority": false, "stem": "Levator scapulae attaches distally to which part of the scapula?", "options": [{"text": "Superior portion of the medial border", "correct": true, "why": "Levator scapulae inserts on the superior portion of the medial border, above the rhomboids. [Slide #8]"}, {"text": "Medial border at the level of the spine", "correct": false, "why": "That is the rhomboid minor insertion. [Slide #8]"}, {"text": "Inferior angle, dorsal surface", "correct": false, "why": "That is the teres major origin. [Slide #8]"}, {"text": "Coracoid process", "correct": false, "why": "Coracoid receives pectoralis minor, not levator scapulae. [Slide #8]"}]},
  {"id": 16, "subjectIndex": 0, "quarter": 1, "slideRef": 9, "difficulty": "medium", "priority": true, "stem": "Which feature distinguishes rhomboid minor from rhomboid major?", "options": [{"text": "Minor arises from SP C7-T1; major from SP T2-T5", "correct": true, "why": "Rhomboid minor: SP C7-T1; rhomboid major: SP T2-T5. Same nerve and action. [Slide #9]"}, {"text": "Minor is supplied by the long thoracic nerve", "correct": false, "why": "Both rhomboids are supplied by the dorsal scapular nerve. [Slide #9]"}, {"text": "Minor protracts the scapula; major retracts it", "correct": false, "why": "Both rhomboids retract the scapula. [Slide #9]"}, {"text": "Minor inserts below major at the inferior angle", "correct": false, "why": "Minor inserts at the level of the spine; major inserts below it to the inferior angle. [Slide #9]"}]},
  {"id": 17, "subjectIndex": 0, "quarter": 1, "slideRef": 10, "difficulty": "medium", "priority": true, "stem": "In addition to retraction, the rhomboids rotate the glenoid cavity:", "options": [{"text": "inferiorly", "correct": true, "why": "Both rhomboids retract the scapula and rotate the glenoid cavity inferiorly. [Slide #10]"}, {"text": "superiorly", "correct": false, "why": "Superior rotation is produced by trapezius (descending + ascending together). [Slide #10]"}, {"text": "anteriorly", "correct": false, "why": "Rhomboids pull the scapula medially; they do not tilt the glenoid anteriorly. [Slide #10]"}, {"text": "laterally", "correct": false, "why": "Lateral glide of the scapula is protraction, the opposite of rhomboid action. [Slide #10]"}]},
  {"id": 18, "subjectIndex": 0, "quarter": 1, "slideRef": 10, "difficulty": "medium", "priority": true, "stem": "The dorsal scapular nerve, supplying the rhomboids and levator scapulae, arises primarily from which spinal level?", "options": [{"text": "C5", "correct": true, "why": "Dorsal scapular nerve: C5 (may include C3-C4). [Slide #10]"}, {"text": "C1-C2", "correct": false, "why": "C1-C2 do not contribute to the dorsal scapular nerve. [Slide #10]"}, {"text": "C8-T1", "correct": false, "why": "C8-T1 supply the medial pectoral and ulnar nerves. [Slide #10]"}, {"text": "C6-C8", "correct": false, "why": "C6-C8 are the thoracodorsal nerve levels. [Slide #10]"}]},
  {"id": 19, "subjectIndex": 0, "quarter": 1, "slideRef": 10, "difficulty": "hard", "priority": false, "stem": "Which muscle pairing shares both the same nerve and the same scapular retraction action?", "options": [{"text": "Rhomboid minor and rhomboid major", "correct": true, "why": "Both rhomboids: dorsal scapular nerve; retract and inferiorly rotate the scapula. [Slide #10]"}, {"text": "Trapezius and rhomboid major", "correct": false, "why": "They both retract, but trapezius is CN XI and rhomboids are dorsal scapular. [Slide #10]"}, {"text": "Levator scapulae and serratus anterior", "correct": false, "why": "Levator is dorsal scapular and elevates; serratus is long thoracic and protracts. [Slide #10]"}, {"text": "Latissimus dorsi and teres major", "correct": false, "why": "Neither retracts the scapula, and their nerves differ (thoracodorsal vs. lower subscapular). [Slide #10]"}]},
  {"id": 20, "subjectIndex": 1, "quarter": 1, "slideRef": 12, "difficulty": "easy", "priority": true, "stem": "All three parts of the deltoid insert on the:", "options": [{"text": "deltoid tuberosity of the humerus", "correct": true, "why": "Anterior, middle, and posterior deltoid share a common insertion on the deltoid tuberosity. [Slide #12]"}, {"text": "greater tubercle of the humerus", "correct": false, "why": "The greater tubercle receives supraspinatus, infraspinatus, and teres minor. [Slide #12]"}, {"text": "lateral lip of the intertubercular groove", "correct": false, "why": "That is the pectoralis major insertion. [Slide #12]"}, {"text": "lesser tubercle of the humerus", "correct": false, "why": "The lesser tubercle receives subscapularis. [Slide #12]"}]},
  {"id": 21, "subjectIndex": 1, "quarter": 1, "slideRef": 12, "difficulty": "medium", "priority": true, "stem": "The deltoid's proximal attachment mirrors which other muscle's distal attachment?", "options": [{"text": "Trapezius", "correct": true, "why": "Deltoid arises from spine of scapula, acromion, and lateral 1/3 clavicle: the same sites where trapezius inserts. [Slide #12]"}, {"text": "Pectoralis minor", "correct": false, "why": "Pectoralis minor inserts on the coracoid process. [Slide #12]"}, {"text": "Levator scapulae", "correct": false, "why": "Levator scapulae inserts on the superior medial border of the scapula. [Slide #12]"}, {"text": "Serratus anterior", "correct": false, "why": "Serratus anterior inserts on the anterior medial border of the scapula. [Slide #12]"}]},
  {"id": 22, "subjectIndex": 1, "quarter": 1, "slideRef": 12, "difficulty": "medium", "priority": false, "stem": "Which set of humeral actions is produced by the deltoid as a whole?", "options": [{"text": "Flexion, extension, and abduction", "correct": true, "why": "Deltoid: anterior fibers flex, posterior fibers extend, and the whole muscle abducts. [Slide #12]"}, {"text": "Adduction and medial rotation only", "correct": false, "why": "These are the main actions of pectoralis major and teres major. [Slide #12]"}, {"text": "Lateral rotation only", "correct": false, "why": "Pure lateral rotation belongs to infraspinatus and teres minor. [Slide #12]"}, {"text": "Scapular retraction and elevation", "correct": false, "why": "Deltoid acts on the humerus, not on the scapula. [Slide #12]"}]},
  {"id": 23, "subjectIndex": 1, "quarter": 1, "slideRef": 12, "difficulty": "easy", "priority": true, "stem": "The axillary nerve innervating deltoid carries fibers from which spinal levels?", "options": [{"text": "C5-C6", "correct": true, "why": "Axillary nerve: C5-C6 (deltoid and teres minor). [Slide #12]"}, {"text": "C8-T1", "correct": false, "why": "C8-T1 belong to the ulnar and medial pectoral nerves. [Slide #12]"}, {"text": "C3-C4", "correct": false, "why": "C3-C4 are listed for CN XI to trapezius. [Slide #12]"}, {"text": "C6-C8", "correct": false, "why": "C6-C8 is the thoracodorsal nerve. [Slide #12]"}]},
  {"id": 24, "subjectIndex": 1, "quarter": 1, "slideRef": 13, "difficulty": "medium", "priority": true, "stem": "Teres major arises from which scapular landmark?", "options": [{"text": "Dorsal surface of the inferior angle", "correct": true, "why": "Teres major: origin dorsal surface of the inferior angle of the scapula. [Slide #13]"}, {"text": "Middle portion of the lateral border", "correct": false, "why": "That is the teres minor origin. [Slide #13]"}, {"text": "Infraspinous fossa", "correct": false, "why": "That is the infraspinatus origin. [Slide #13]"}, {"text": "Supraglenoid tubercle", "correct": false, "why": "That is the origin of the biceps long head. [Slide #13]"}]},
  {"id": 25, "subjectIndex": 1, "quarter": 1, "slideRef": 13, "difficulty": "easy", "priority": true, "stem": "Teres major is innervated by the _______ nerve.", "options": [{"text": "lower subscapular", "correct": true, "why": "Teres major: lower subscapular nerve (C6-C7). [Slide #13]"}, {"text": "axillary", "correct": false, "why": "Axillary innervates teres minor, not teres major. [Slide #13]"}, {"text": "suprascapular", "correct": false, "why": "Suprascapular supplies supraspinatus and infraspinatus. [Slide #13]"}, {"text": "thoracodorsal", "correct": false, "why": "Thoracodorsal supplies latissimus dorsi. [Slide #13]"}]},
  {"id": 26, "subjectIndex": 1, "quarter": 1, "slideRef": 13, "difficulty": "hard", "priority": true, "stem": "Teres major and teres minor differ in which pair of features?", "options": [{"text": "Major medially rotates (not cuff); minor laterally rotates (cuff)", "correct": true, "why": "Teres major adducts/medially rotates and is not a rotator cuff muscle; teres minor laterally rotates and is part of SITS. [Slide #13]"}, {"text": "Major is in the rotator cuff; minor is not", "correct": false, "why": "Reversed: teres minor is the 'T' in SITS; teres major is excluded. [Slide #13]"}, {"text": "Both are supplied by the axillary nerve", "correct": false, "why": "Only teres minor is axillary; teres major is lower subscapular. [Slide #13]"}, {"text": "Both insert on the greater tubercle", "correct": false, "why": "Only teres minor inserts on the greater tubercle; teres major inserts in the intertubercular groove. [Slide #13]"}]},
  {"id": 27, "subjectIndex": 1, "quarter": 1, "slideRef": 14, "difficulty": "easy", "priority": true, "stem": "Which muscle is NOT part of the rotator cuff (SITS)?", "options": [{"text": "Teres major", "correct": true, "why": "SITS = supraspinatus, infraspinatus, teres minor, subscapularis. Teres major is excluded. [Slide #14]"}, {"text": "Teres minor", "correct": false, "why": "Teres minor is the 'T' in SITS. [Slide #14]"}, {"text": "Subscapularis", "correct": false, "why": "Subscapularis is the final 'S' in SITS. [Slide #14]"}, {"text": "Infraspinatus", "correct": false, "why": "Infraspinatus is the 'I' in SITS. [Slide #14]"}]},
  {"id": 28, "subjectIndex": 1, "quarter": 1, "slideRef": 15, "difficulty": "easy", "priority": true, "stem": "Which rotator cuff muscle lies superior to the spine of the scapula?", "options": [{"text": "Supraspinatus", "correct": true, "why": "Supraspinatus occupies the supraspinous fossa above the spine. [Slide #15]"}, {"text": "Infraspinatus", "correct": false, "why": "Infraspinatus lies below the spine in the infraspinous fossa. [Slide #15]"}, {"text": "Teres minor", "correct": false, "why": "Teres minor arises from the lateral border, below the spine. [Slide #15]"}, {"text": "Subscapularis", "correct": false, "why": "Subscapularis lies on the costal (anterior) surface. [Slide #15]"}]},
  {"id": 29, "subjectIndex": 1, "quarter": 1, "slideRef": 15, "difficulty": "medium", "priority": true, "stem": "The primary action of supraspinatus is _______ of the humerus.", "options": [{"text": "abduction", "correct": true, "why": "Supraspinatus abducts the humerus. [Slide #15]"}, {"text": "lateral rotation", "correct": false, "why": "Lateral rotation is infraspinatus and teres minor. [Slide #15]"}, {"text": "medial rotation", "correct": false, "why": "Medial rotation is subscapularis. [Slide #15]"}, {"text": "extension", "correct": false, "why": "Extension is latissimus dorsi, teres major, and posterior deltoid. [Slide #15]"}]},
  {"id": 30, "subjectIndex": 1, "quarter": 1, "slideRef": 16, "difficulty": "hard", "priority": true, "stem": "Which sequence correctly matches greater tubercle facets (superior, middle, inferior) to their muscles?", "options": [{"text": "Supraspinatus, infraspinatus, teres minor", "correct": true, "why": "Superior facet: supraspinatus; middle: infraspinatus; inferior: teres minor. [Slide #16]"}, {"text": "Infraspinatus, supraspinatus, teres minor", "correct": false, "why": "Supraspinatus takes the superior facet, not the middle. [Slide #16]"}, {"text": "Supraspinatus, teres minor, infraspinatus", "correct": false, "why": "Teres minor takes the inferior facet, not the middle. [Slide #16]"}, {"text": "Supraspinatus, infraspinatus, subscapularis", "correct": false, "why": "Subscapularis inserts on the lesser tubercle. [Slide #16]"}]},
  {"id": 31, "subjectIndex": 1, "quarter": 1, "slideRef": 16, "difficulty": "medium", "priority": true, "stem": "Which nerve supplies both supraspinatus and infraspinatus?", "options": [{"text": "Suprascapular nerve", "correct": true, "why": "Suprascapular nerve (C5-C6) supplies both supraspinatus and infraspinatus. [Slide #16]"}, {"text": "Axillary nerve", "correct": false, "why": "Axillary supplies deltoid and teres minor. [Slide #16]"}, {"text": "Upper subscapular nerve", "correct": false, "why": "Upper subscapular supplies subscapularis. [Slide #16]"}, {"text": "Dorsal scapular nerve", "correct": false, "why": "Dorsal scapular supplies rhomboids and levator scapulae. [Slide #16]"}]},
  {"id": 32, "subjectIndex": 1, "quarter": 1, "slideRef": 17, "difficulty": "easy", "priority": true, "stem": "Which muscle laterally rotates the humerus and is innervated by the axillary nerve?", "options": [{"text": "Teres minor", "correct": true, "why": "Teres minor: axillary nerve; lateral rotation. [Slide #17]"}, {"text": "Infraspinatus", "correct": false, "why": "Infraspinatus laterally rotates but is supplied by the suprascapular nerve. [Slide #17]"}, {"text": "Teres major", "correct": false, "why": "Teres major medially rotates and is lower subscapular. [Slide #17]"}, {"text": "Supraspinatus", "correct": false, "why": "Supraspinatus abducts and is suprascapular. [Slide #17]"}]},
  {"id": 33, "subjectIndex": 1, "quarter": 1, "slideRef": 17, "difficulty": "medium", "priority": false, "stem": "Teres minor arises from the _______ of the scapula.", "options": [{"text": "middle portion of the lateral border", "correct": true, "why": "Teres minor: origin middle portion of the lateral border. [Slide #17]"}, {"text": "dorsal surface of the inferior angle", "correct": false, "why": "That is the teres major origin. [Slide #17]"}, {"text": "infraspinous fossa", "correct": false, "why": "That is the infraspinatus origin. [Slide #17]"}, {"text": "subscapular fossa", "correct": false, "why": "That is the subscapularis origin. [Slide #17]"}]},
  {"id": 34, "subjectIndex": 1, "quarter": 1, "slideRef": 18, "difficulty": "medium", "priority": true, "stem": "Which rotator cuff muscle medially rotates the humerus?", "options": [{"text": "Subscapularis", "correct": true, "why": "Subscapularis: medial rotation (assists adduction). [Slide #18]"}, {"text": "Teres minor", "correct": false, "why": "Teres minor laterally rotates. [Slide #18]"}, {"text": "Infraspinatus", "correct": false, "why": "Infraspinatus laterally rotates. [Slide #18]"}, {"text": "Supraspinatus", "correct": false, "why": "Supraspinatus abducts. [Slide #18]"}]},
  {"id": 35, "subjectIndex": 1, "quarter": 1, "slideRef": 18, "difficulty": "easy", "priority": true, "stem": "Subscapularis is unique among the rotator cuff because it inserts on the:", "options": [{"text": "lesser tubercle of the humerus", "correct": true, "why": "Subscapularis is the only cuff muscle on the lesser tubercle; the other three use the greater tubercle. [Slide #18]"}, {"text": "superior facet of the greater tubercle", "correct": false, "why": "Supraspinatus inserts there. [Slide #18]"}, {"text": "deltoid tuberosity", "correct": false, "why": "Deltoid inserts there. [Slide #18]"}, {"text": "medial lip of the intertubercular groove", "correct": false, "why": "Teres major inserts there. [Slide #18]"}]},
  {"id": 36, "subjectIndex": 1, "quarter": 1, "slideRef": 18, "difficulty": "medium", "priority": false, "stem": "Which nerve combination supplies subscapularis?", "options": [{"text": "Upper and lower subscapular nerves (C5-C7)", "correct": true, "why": "Subscapularis receives both the upper and lower subscapular nerves (C5-C7). [Slide #18]"}, {"text": "Suprascapular nerve alone (C5-C6)", "correct": false, "why": "Suprascapular supplies supraspinatus and infraspinatus. [Slide #18]"}, {"text": "Lower subscapular and thoracodorsal nerves", "correct": false, "why": "Thoracodorsal supplies lat dorsi only; it does not reach subscapularis. [Slide #18]"}, {"text": "Axillary nerve alone (C5-C6)", "correct": false, "why": "Axillary supplies deltoid and teres minor. [Slide #18]"}]},
  {"id": 37, "subjectIndex": 1, "quarter": 1, "slideRef": 19, "difficulty": "easy", "priority": true, "stem": "Which rotator cuff tendon is most commonly ruptured?", "options": [{"text": "Supraspinatus", "correct": true, "why": "The supraspinatus tendon is the most commonly ruptured cuff tendon. [Slide #19]"}, {"text": "Infraspinatus", "correct": false, "why": "Infraspinatus tears are less common than supraspinatus tears. [Slide #19]"}, {"text": "Teres minor", "correct": false, "why": "Teres minor is rarely the primary tear. [Slide #19]"}, {"text": "Subscapularis", "correct": false, "why": "Subscapularis is not the most commonly ruptured. [Slide #19]"}]},
  {"id": 38, "subjectIndex": 1, "quarter": 1, "slideRef": 19, "difficulty": "medium", "priority": true, "stem": "Degenerative rotator cuff tendonitis and frozen shoulder show increased incidence in which population?", "options": [{"text": "Older adults, especially peri/menopausal women", "correct": true, "why": "Degenerative cuff tendonitis is common in older people; new research links shoulder problems to perimenopause/menopause. [Slide #19]"}, {"text": "Adolescents with open growth plates", "correct": false, "why": "Open growth plates are linked to Little Leaguer's elbow, not cuff degeneration. [Slide #19]"}, {"text": "Young men under 25", "correct": false, "why": "Degenerative cuff disease is age-related, not typical in young men. [Slide #19]"}, {"text": "Children under 10", "correct": false, "why": "Children rarely develop degenerative tendon disease. [Slide #19]"}]},
  {"id": 39, "subjectIndex": 1, "quarter": 1, "slideRef": 19, "difficulty": "medium", "priority": false, "stem": "Besides degeneration, which mechanism is identified as a cause of rotator cuff tears?", "options": [{"text": "Trauma that tears one or more cuff tendons", "correct": true, "why": "Trauma (e.g., a big hit to the shoulder) may tear or rupture one or more rotator cuff tendons. [Slide #19]"}, {"text": "Compression of the median nerve", "correct": false, "why": "Median compression causes carpal tunnel / pronator teres syndrome. [Slide #19]"}, {"text": "Fibrosis of the palmar aponeurosis", "correct": false, "why": "That describes Dupuytren contracture of the hand. [Slide #19]"}, {"text": "Separation of the medial epicondyle apophysis", "correct": false, "why": "That describes Little Leaguer's elbow. [Slide #19]"}]},
  {"id": 40, "subjectIndex": 2, "quarter": 1, "slideRef": 20, "difficulty": "easy", "priority": true, "stem": "Which muscle is NOT an anterior axio-appendicular muscle?", "options": [{"text": "Deltoid", "correct": true, "why": "Anterior axio-appendicular group = pectoralis major, pectoralis minor, subclavius, serratus anterior. Deltoid is scapulohumeral. [Slide #20]"}, {"text": "Subclavius", "correct": false, "why": "Subclavius is an anterior axio-appendicular muscle. [Slide #20]"}, {"text": "Serratus anterior", "correct": false, "why": "Serratus anterior is an anterior axio-appendicular muscle. [Slide #20]"}, {"text": "Pectoralis minor", "correct": false, "why": "Pectoralis minor is an anterior axio-appendicular muscle. [Slide #20]"}]},
  {"id": 41, "subjectIndex": 2, "quarter": 1, "slideRef": 21, "difficulty": "medium", "priority": true, "stem": "Pectoralis major attaches distally to the:", "options": [{"text": "lateral lip of the intertubercular groove", "correct": true, "why": "Pec major inserts on the lateral portion of the intertubercular groove; lat dorsi and teres major take the medial portion. [Slide #21]"}, {"text": "medial lip of the intertubercular groove", "correct": false, "why": "Teres major and lat dorsi insert medially. [Slide #21]"}, {"text": "coracoid process", "correct": false, "why": "Coracoid receives pectoralis minor. [Slide #21]"}, {"text": "lesser tubercle", "correct": false, "why": "Lesser tubercle receives subscapularis. [Slide #21]"}]},
  {"id": 42, "subjectIndex": 2, "quarter": 1, "slideRef": 21, "difficulty": "hard", "priority": true, "stem": "Which innervation pattern correctly describes pectoralis major?", "options": [{"text": "Lateral pectoral (C5-C7) to clavicular head; medial pectoral (C8-T1) to sternocostal head", "correct": true, "why": "Pec major has dual supply: lateral pectoral to clavicular head, medial pectoral to sternocostal head. [Slide #21]"}, {"text": "Medial pectoral to clavicular head; lateral pectoral to sternocostal head", "correct": false, "why": "The heads are reversed. [Slide #21]"}, {"text": "Long thoracic nerve to both heads", "correct": false, "why": "Long thoracic supplies serratus anterior. [Slide #21]"}, {"text": "Lateral pectoral nerve alone to both heads", "correct": false, "why": "The sternocostal head is supplied by the medial pectoral nerve. [Slide #21]"}]},
  {"id": 43, "subjectIndex": 2, "quarter": 1, "slideRef": 21, "difficulty": "medium", "priority": false, "stem": "The sternocostal head of pectoralis major arises from the anterolateral sternum and the:", "options": [{"text": "upper 6 ribs", "correct": true, "why": "Sternocostal head: anterolateral sternum and upper 6 ribs. Clavicular head: medial 1/2 of clavicle. [Slide #21]"}, {"text": "ribs 3-5 near the costocartilage", "correct": false, "why": "Ribs 3-5 give rise to pectoralis minor. [Slide #21]"}, {"text": "external surfaces of ribs 1-8", "correct": false, "why": "Ribs 1-8 give rise to serratus anterior. [Slide #21]"}, {"text": "costal junction of rib 1", "correct": false, "why": "Rib 1 gives rise to subclavius. [Slide #21]"}]},
  {"id": 44, "subjectIndex": 2, "quarter": 1, "slideRef": 21, "difficulty": "medium", "priority": true, "stem": "Which combination of humeral actions is produced by pectoralis major?", "options": [{"text": "Adduction, medial rotation, and flexion", "correct": true, "why": "Pec major adducts, medially rotates, and flexes the humerus. [Slide #21]"}, {"text": "Abduction, lateral rotation, and extension", "correct": false, "why": "These are the opposite actions. [Slide #21]"}, {"text": "Protraction and depression of the scapula", "correct": false, "why": "Those are pectoralis minor actions. [Slide #21]"}, {"text": "Extension and lateral rotation", "correct": false, "why": "Pec major flexes and medially rotates. [Slide #21]"}]},
  {"id": 45, "subjectIndex": 2, "quarter": 1, "slideRef": 22, "difficulty": "easy", "priority": true, "stem": "Pectoralis minor arises from ribs 3-5 and inserts on the:", "options": [{"text": "coracoid process", "correct": true, "why": "Pec minor inserts on the coracoid process of the scapula. [Slide #22]"}, {"text": "acromion process", "correct": false, "why": "Acromion receives trapezius and gives origin to deltoid. [Slide #22]"}, {"text": "lateral lip of the intertubercular groove", "correct": false, "why": "That is pectoralis major. [Slide #22]"}, {"text": "middle and distal clavicle", "correct": false, "why": "That is the subclavius insertion. [Slide #22]"}]},
  {"id": 46, "subjectIndex": 2, "quarter": 1, "slideRef": 22, "difficulty": "medium", "priority": true, "stem": "Pectoralis minor acts to _______ the scapula.", "options": [{"text": "protract and depress", "correct": true, "why": "Pec minor: protraction and depression of the scapula. [Slide #22]"}, {"text": "retract and elevate", "correct": false, "why": "Retraction/elevation are rhomboid/trapezius/levator actions. [Slide #22]"}, {"text": "superiorly rotate", "correct": false, "why": "Superior rotation is trapezius (descending + ascending). [Slide #22]"}, {"text": "retract and inferiorly rotate", "correct": false, "why": "That is the rhomboid action. [Slide #22]"}]},
  {"id": 47, "subjectIndex": 2, "quarter": 1, "slideRef": 22, "difficulty": "hard", "priority": false, "stem": "Which nerve supplies both pectoralis minor and the sternocostal head of pectoralis major?", "options": [{"text": "Medial pectoral nerve (C8-T1)", "correct": true, "why": "The medial pectoral nerve passes through pec minor first, then reaches the sternocostal head of pec major. [Slide #22]"}, {"text": "Lateral pectoral nerve (C5-C7)", "correct": false, "why": "Lateral pectoral supplies only the clavicular head of pec major. [Slide #22]"}, {"text": "Long thoracic nerve (C5-C7)", "correct": false, "why": "Long thoracic supplies serratus anterior. [Slide #22]"}, {"text": "Nerve to subclavius (C5-C6)", "correct": false, "why": "Nerve to subclavius supplies only subclavius. [Slide #22]"}]},
  {"id": 48, "subjectIndex": 2, "quarter": 1, "slideRef": 23, "difficulty": "medium", "priority": false, "stem": "The subclavius arises from rib 1, inserts on the clavicle, and acts to:", "options": [{"text": "stabilize and depress the clavicle", "correct": true, "why": "Subclavius stabilizes and depresses the clavicle. [Slide #23]"}, {"text": "elevate the clavicle", "correct": false, "why": "Elevation is the opposite action. [Slide #23]"}, {"text": "protract the scapula", "correct": false, "why": "Protraction is serratus anterior / pec minor. [Slide #23]"}, {"text": "adduct the humerus", "correct": false, "why": "Subclavius has no humeral attachment. [Slide #23]"}]},
  {"id": 49, "subjectIndex": 2, "quarter": 1, "slideRef": 23, "difficulty": "easy", "priority": false, "stem": "Subclavius is innervated by the:", "options": [{"text": "nerve to subclavius (C5-C6)", "correct": true, "why": "Subclavius: nerve to subclavius, C5-C6. [Slide #23]"}, {"text": "medial pectoral nerve (C8-T1)", "correct": false, "why": "Medial pectoral supplies pec minor and the sternocostal pec major. [Slide #23]"}, {"text": "long thoracic nerve (C5-C7)", "correct": false, "why": "Long thoracic supplies serratus anterior. [Slide #23]"}, {"text": "dorsal scapular nerve (C5)", "correct": false, "why": "Dorsal scapular supplies the rhomboids and levator scapulae. [Slide #23]"}]},
  {"id": 50, "subjectIndex": 2, "quarter": 1, "slideRef": 24, "difficulty": "easy", "priority": true, "stem": "Serratus anterior arises from the external lateral surfaces of:", "options": [{"text": "ribs 1-8", "correct": true, "why": "Serratus anterior: origin ribs 1-8 (lecture noted it can extend to rib 9). [Slide #24]"}, {"text": "ribs 3-5", "correct": false, "why": "Ribs 3-5 are the pectoralis minor origin. [Slide #24]"}, {"text": "upper 6 ribs with the sternum", "correct": false, "why": "That is the sternocostal head of pectoralis major. [Slide #24]"}, {"text": "inferior 3-4 ribs", "correct": false, "why": "Inferior 3-4 ribs contribute to latissimus dorsi. [Slide #24]"}]},
  {"id": 51, "subjectIndex": 2, "quarter": 1, "slideRef": 24, "difficulty": "medium", "priority": true, "stem": "Serratus anterior is innervated by the _______ nerve.", "options": [{"text": "long thoracic (C5-C7)", "correct": true, "why": "Serratus anterior: long thoracic nerve, C5-C7. [Slide #24]"}, {"text": "thoracodorsal (C6-C8)", "correct": false, "why": "Thoracodorsal supplies latissimus dorsi. [Slide #24]"}, {"text": "medial pectoral (C8-T1)", "correct": false, "why": "Medial pectoral supplies the pectoral muscles. [Slide #24]"}, {"text": "dorsal scapular (C5)", "correct": false, "why": "Dorsal scapular supplies the rhomboids and levator scapulae. [Slide #24]"}]},
  {"id": 52, "subjectIndex": 2, "quarter": 1, "slideRef": 24, "difficulty": "hard", "priority": true, "stem": "Assuming the thoracic wall is fixed, serratus anterior moves the scapula in which way?", "options": [{"text": "Protracts it and holds it against the thoracic wall", "correct": true, "why": "Serratus anterior (the 'punching muscle') protracts the scapula and stabilizes it against the thorax. [Slide #24]"}, {"text": "Retracts it toward the vertebral column", "correct": false, "why": "Retraction is rhomboids and middle trapezius. [Slide #24]"}, {"text": "Elevates it toward the occiput", "correct": false, "why": "Elevation is levator scapulae and descending trapezius. [Slide #24]"}, {"text": "Inferiorly rotates the glenoid", "correct": false, "why": "Inferior rotation is the rhomboids. [Slide #24]"}]},
  {"id": 53, "subjectIndex": 2, "quarter": 1, "slideRef": 24, "difficulty": "hard", "priority": false, "stem": "Which two muscles both protract the scapula but have different nerves?", "options": [{"text": "Serratus anterior and pectoralis minor", "correct": true, "why": "Both protract; serratus = long thoracic, pec minor = medial pectoral. [Slide #24]"}, {"text": "Rhomboid major and rhomboid minor", "correct": false, "why": "Both retract and share the dorsal scapular nerve. [Slide #24]"}, {"text": "Trapezius and levator scapulae", "correct": false, "why": "Neither protracts. [Slide #24]"}, {"text": "Teres major and latissimus dorsi", "correct": false, "why": "These act on the humerus, not on scapular protraction. [Slide #24]"}]},
  {"id": 54, "subjectIndex": 3, "quarter": 2, "slideRef": 28, "difficulty": "easy", "priority": true, "stem": "The posterior (extensor) compartment of the arm contains only the:", "options": [{"text": "triceps brachii", "correct": true, "why": "The posterior arm compartment contains the triceps brachii alone. [Slide #28]"}, {"text": "brachialis", "correct": false, "why": "Brachialis is in the anterior (flexor) compartment. [Slide #28]"}, {"text": "coracobrachialis", "correct": false, "why": "Coracobrachialis is in the anterior compartment. [Slide #28]"}, {"text": "brachioradialis", "correct": false, "why": "Brachioradialis is a forearm muscle. [Slide #28]"}]},
  {"id": 55, "subjectIndex": 3, "quarter": 2, "slideRef": 28, "difficulty": "medium", "priority": true, "stem": "How does the strength of the anterior arm compartment compare to the posterior compartment?", "options": [{"text": "Flexors are stronger than extensors", "correct": true, "why": "The anterior flexors are stronger: we are better at pulling than pushing. [Slide #28]"}, {"text": "Extensors are stronger than flexors", "correct": false, "why": "Reversed; the flexor compartment is stronger. [Slide #28]"}, {"text": "They are exactly equal", "correct": false, "why": "They are not equal; the flexors dominate. [Slide #28]"}, {"text": "Extensors are twice as strong", "correct": false, "why": "The 'twice' ratio refers to forearm flexors vs. extensors, favoring flexors. [Slide #28]"}]},
  {"id": 56, "subjectIndex": 3, "quarter": 2, "slideRef": 28, "difficulty": "medium", "priority": false, "stem": "Strengthening which muscle is emphasized in the elderly for rising from chairs and using wheelchairs?", "options": [{"text": "Triceps brachii", "correct": true, "why": "The triceps is important for getting out of chairs and using wheelchairs. [Slide #28]"}, {"text": "Biceps brachii", "correct": false, "why": "Biceps flexes and supinates; pushing up from a chair requires elbow extension. [Slide #28]"}, {"text": "Coracobrachialis", "correct": false, "why": "Coracobrachialis flexes/adducts the humerus. [Slide #28]"}, {"text": "Brachialis", "correct": false, "why": "Brachialis flexes the forearm. [Slide #28]"}]},
  {"id": 57, "subjectIndex": 3, "quarter": 2, "slideRef": 29, "difficulty": "medium", "priority": true, "stem": "Coracobrachialis attaches proximally to the coracoid process and distally to the:", "options": [{"text": "medial surface of the humerus", "correct": true, "why": "Coracobrachialis: tip of coracoid to the medial surface of the humerus. [Slide #29]"}, {"text": "radial tuberosity", "correct": false, "why": "Radial tuberosity receives the biceps brachii. [Slide #29]"}, {"text": "coronoid process of the ulna", "correct": false, "why": "Coronoid process receives the brachialis. [Slide #29]"}, {"text": "deltoid tuberosity", "correct": false, "why": "Deltoid tuberosity receives the deltoid. [Slide #29]"}]},
  {"id": 58, "subjectIndex": 3, "quarter": 2, "slideRef": 29, "difficulty": "medium", "priority": true, "stem": "Which nerve pierces the coracobrachialis?", "options": [{"text": "Musculocutaneous nerve", "correct": true, "why": "The musculocutaneous nerve pierces coracobrachialis and supplies all three anterior arm muscles. [Slide #29]"}, {"text": "Median nerve", "correct": false, "why": "The median nerve runs alongside the brachial artery without piercing coracobrachialis. [Slide #29]"}, {"text": "Radial nerve", "correct": false, "why": "The radial nerve runs posteriorly in the radial groove. [Slide #29]"}, {"text": "Axillary nerve", "correct": false, "why": "The axillary nerve exits through the quadrangular space. [Slide #29]"}]},
  {"id": 59, "subjectIndex": 3, "quarter": 2, "slideRef": 29, "difficulty": "medium", "priority": false, "stem": "Besides flexing and adducting the humerus, coracobrachialis helps to:", "options": [{"text": "resist shoulder dislocation", "correct": true, "why": "Coracobrachialis also helps prevent dislocation of the shoulder. [Slide #29]"}, {"text": "supinate the forearm", "correct": false, "why": "Supination is biceps and supinator; coracobrachialis does not cross the elbow. [Slide #29]"}, {"text": "laterally rotate the humerus", "correct": false, "why": "Lateral rotation is infraspinatus/teres minor. [Slide #29]"}, {"text": "extend the forearm", "correct": false, "why": "Forearm extension is triceps and anconeus. [Slide #29]"}]},
  {"id": 60, "subjectIndex": 3, "quarter": 2, "slideRef": 30, "difficulty": "medium", "priority": true, "stem": "Which pairing correctly gives the proximal attachments of the biceps brachii heads?", "options": [{"text": "Short head: coracoid; long head: supraglenoid tubercle", "correct": true, "why": "Biceps short head from coracoid; long head from supraglenoid tubercle. [Slide #30]"}, {"text": "Short head: supraglenoid tubercle; long head: coracoid", "correct": false, "why": "The heads are reversed. [Slide #30]"}, {"text": "Long head: infraglenoid tubercle", "correct": false, "why": "The infraglenoid tubercle gives rise to the triceps long head. [Slide #30]"}, {"text": "Both heads from the coracoid process", "correct": false, "why": "Only the short head is coracoid. [Slide #30]"}]},
  {"id": 61, "subjectIndex": 3, "quarter": 2, "slideRef": 30, "difficulty": "easy", "priority": true, "stem": "The biceps brachii inserts on the _______ and the bicipital aponeurosis.", "options": [{"text": "radial tuberosity", "correct": true, "why": "Biceps inserts on the radial tuberosity and bicipital aponeurosis. [Slide #30]"}, {"text": "coronoid process of the ulna", "correct": false, "why": "Coronoid/ulnar tuberosity receives brachialis. [Slide #30]"}, {"text": "olecranon process", "correct": false, "why": "Olecranon receives triceps. [Slide #30]"}, {"text": "styloid process of the radius", "correct": false, "why": "Radial styloid receives brachioradialis. [Slide #30]"}]},
  {"id": 62, "subjectIndex": 3, "quarter": 2, "slideRef": 30, "difficulty": "medium", "priority": true, "stem": "What actions does the biceps brachii produce at the forearm?", "options": [{"text": "Flexion and supination", "correct": true, "why": "Biceps flexes and supinates the forearm (may assist humeral flexion). [Slide #30]"}, {"text": "Flexion and pronation", "correct": false, "why": "Pronation is pronator teres and pronator quadratus. [Slide #30]"}, {"text": "Extension and supination", "correct": false, "why": "Extension is triceps. [Slide #30]"}, {"text": "Pure flexion without supination", "correct": false, "why": "That describes brachialis. [Slide #30]"}]},
  {"id": 63, "subjectIndex": 3, "quarter": 2, "slideRef": 31, "difficulty": "medium", "priority": true, "stem": "Brachialis arises from the distal 1/2 of the anterior humerus and inserts on the:", "options": [{"text": "coronoid process and tuberosity of ulna", "correct": true, "why": "Brachialis inserts on the coronoid process and ulnar tuberosity (coronoid, not coracoid). [Slide #31]"}, {"text": "coracoid process of the scapula", "correct": false, "why": "Coracoid is a scapular landmark (biceps short head, coracobrachialis, pec minor). [Slide #31]"}, {"text": "radial tuberosity", "correct": false, "why": "That is biceps. [Slide #31]"}, {"text": "olecranon process", "correct": false, "why": "That is triceps. [Slide #31]"}]},
  {"id": 64, "subjectIndex": 3, "quarter": 2, "slideRef": 31, "difficulty": "medium", "priority": true, "stem": "Which muscle pairing shares the musculocutaneous nerve but differs in action at the radioulnar joint?", "options": [{"text": "Biceps brachii supinates; brachialis does not", "correct": true, "why": "Both are musculocutaneous; biceps supinates via the radial tuberosity, while brachialis inserts on the ulna and only flexes. [Slide #31]"}, {"text": "Brachialis supinates; biceps does not", "correct": false, "why": "Reversed; brachialis inserts on the ulna and cannot supinate. [Slide #31]"}, {"text": "Both are supplied by the radial nerve", "correct": false, "why": "Both are musculocutaneous. [Slide #31]"}, {"text": "Coracobrachialis pronates; biceps supinates", "correct": false, "why": "Coracobrachialis does not cross the elbow. [Slide #31]"}]},
  {"id": 65, "subjectIndex": 3, "quarter": 2, "slideRef": 32, "difficulty": "easy", "priority": true, "stem": "The long head of triceps brachii arises from the:", "options": [{"text": "infraglenoid tubercle", "correct": true, "why": "Triceps long head: infraglenoid tubercle of the scapula. [Slide #32]"}, {"text": "supraglenoid tubercle", "correct": false, "why": "That is the biceps long head. [Slide #32]"}, {"text": "coracoid process", "correct": false, "why": "That is the biceps short head and coracobrachialis. [Slide #32]"}, {"text": "posterior humerus inferior to the radial groove", "correct": false, "why": "That is the triceps medial head. [Slide #32]"}]},
  {"id": 66, "subjectIndex": 3, "quarter": 2, "slideRef": 32, "difficulty": "hard", "priority": true, "stem": "Which statement correctly distinguishes the lateral and medial heads of triceps?", "options": [{"text": "Lateral is superior to the radial groove; medial is inferior", "correct": true, "why": "Lateral head: posterior humerus superior to the radial groove; medial head: inferior to it. [Slide #32]"}, {"text": "Lateral is inferior to the radial groove; medial is superior", "correct": false, "why": "Reversed. [Slide #32]"}, {"text": "Both arise from the infraglenoid tubercle", "correct": false, "why": "Only the long head arises there. [Slide #32]"}, {"text": "Lateral arises from the lateral epicondyle", "correct": false, "why": "Lateral epicondyle gives rise to forearm extensors and anconeus. [Slide #32]"}]},
  {"id": 67, "subjectIndex": 3, "quarter": 2, "slideRef": 32, "difficulty": "medium", "priority": true, "stem": "Which head of triceps also extends and adducts at the shoulder and resists humeral dislocation?", "options": [{"text": "Long head", "correct": true, "why": "Only the long head crosses the shoulder (infraglenoid tubercle), so it acts there and resists dislocation. [Slide #32]"}, {"text": "Lateral head", "correct": false, "why": "The lateral head arises from the humerus and does not cross the shoulder. [Slide #32]"}, {"text": "Medial head", "correct": false, "why": "The medial head arises from the humerus and does not cross the shoulder. [Slide #32]"}, {"text": "All three heads equally", "correct": false, "why": "Only the long head crosses the glenohumeral joint. [Slide #32]"}]},
  {"id": 68, "subjectIndex": 3, "quarter": 2, "slideRef": 32, "difficulty": "easy", "priority": false, "stem": "All three heads of triceps brachii insert on the _______ and are supplied by the radial nerve.", "options": [{"text": "olecranon process of the ulna", "correct": true, "why": "Triceps inserts on the olecranon; radial nerve. [Slide #32]"}, {"text": "coronoid process of the ulna", "correct": false, "why": "Coronoid receives brachialis. [Slide #32]"}, {"text": "radial tuberosity", "correct": false, "why": "Radial tuberosity receives biceps. [Slide #32]"}, {"text": "lateral epicondyle", "correct": false, "why": "Lateral epicondyle is an origin for extensors, not an insertion. [Slide #32]"}]},
  {"id": 69, "subjectIndex": 3, "quarter": 2, "slideRef": 34, "difficulty": "medium", "priority": true, "stem": "Which feature distinguishes biceps tendinosis from biceps tendinitis?", "options": [{"text": "Collagen degeneration without an inflammatory response", "correct": true, "why": "Tendinosis is collagen degeneration/disorganization with no inflammation; tendinitis involves microtears and inflammation. [Slide #34]"}, {"text": "Acute inflammation from microtears", "correct": false, "why": "That describes tendinitis. [Slide #34]"}, {"text": "Complete detachment from the supraglenoid tubercle", "correct": false, "why": "That is a rupture. [Slide #34]"}, {"text": "Displacement from the intertubercular sulcus", "correct": false, "why": "That is a dislocation. [Slide #34]"}]},
  {"id": 70, "subjectIndex": 3, "quarter": 2, "slideRef": 34, "difficulty": "medium", "priority": false, "stem": "Biceps tendinosis develops in response to poor vascularization, chronic overuse, or:", "options": [{"text": "aging", "correct": true, "why": "Tendinosis results from poor vascularization, chronic overuse, or aging. [Slide #34]"}, {"text": "acute bacterial infection", "correct": false, "why": "Infection is not a listed cause. [Slide #34]"}, {"text": "open growth plates", "correct": false, "why": "Growth plates relate to Little Leaguer's elbow. [Slide #34]"}, {"text": "median nerve compression", "correct": false, "why": "Nerve compression is unrelated to tendon collagen degeneration. [Slide #34]"}]},
  {"id": 71, "subjectIndex": 3, "quarter": 2, "slideRef": 34, "difficulty": "medium", "priority": true, "stem": "Repetitive microtrauma to the biceps long head tendon is most common in which activities?", "options": [{"text": "Throwing and racquet sports", "correct": true, "why": "Biceps tendinitis is common in throwing and racquet sports; a tight, narrow, rough sulcus irritates the tendon. [Slide #34]"}, {"text": "Running and cycling", "correct": false, "why": "These are lower-limb dominant. [Slide #34]"}, {"text": "Typing and gaming", "correct": false, "why": "Repetitive clicking is linked to medial epicondylitis. [Slide #34]"}, {"text": "Swimming breaststroke only", "correct": false, "why": "Swimming is listed under rupture, not as the classic tendinitis sport. [Slide #34]"}]},
  {"id": 72, "subjectIndex": 3, "quarter": 2, "slideRef": 34, "difficulty": "hard", "priority": false, "stem": "The biceps long head is prone to irritation because it moves within the _______ inside a synovial sheath.", "options": [{"text": "intertubercular sulcus (bicipital groove)", "correct": true, "why": "The long head tendon slides back and forth in the intertubercular sulcus; a tight/rough sulcus causes tenderness and crepitus. [Slide #34]"}, {"text": "radial groove", "correct": false, "why": "The radial groove carries the radial nerve and deep brachial artery. [Slide #34]"}, {"text": "carpal tunnel", "correct": false, "why": "The carpal tunnel is at the wrist. [Slide #34]"}, {"text": "quadrangular space", "correct": false, "why": "The quadrangular space carries the axillary nerve. [Slide #34]"}]},
  {"id": 73, "subjectIndex": 3, "quarter": 2, "slideRef": 35, "difficulty": "medium", "priority": true, "stem": "Dislocation of the biceps long head tendon in older adults typically follows a history of:", "options": [{"text": "biceps tendinitis", "correct": true, "why": "Older people with prior biceps tendinitis may dislocate the tendon, felt as popping/catching during arm rotation. [Slide #35]"}, {"text": "rotator cuff rupture alone", "correct": false, "why": "The listed predisposing factor is biceps tendinitis. [Slide #35]"}, {"text": "open growth plates", "correct": false, "why": "That relates to young people with epiphyseal separation. [Slide #35]"}, {"text": "carpal tunnel syndrome", "correct": false, "why": "Carpal tunnel is a wrist entrapment. [Slide #35]"}]},
  {"id": 74, "subjectIndex": 3, "quarter": 2, "slideRef": 35, "difficulty": "hard", "priority": false, "stem": "In young people, dislocation of the biceps long head tendon may occur with which event?", "options": [{"text": "Traumatic separation of the proximal humeral epiphysis", "correct": true, "why": "In the young, dislocation may occur during traumatic separation of the proximal humeral epiphysis. [Slide #35]"}, {"text": "Degenerative tendinosis from aging", "correct": false, "why": "That is the elderly mechanism. [Slide #35]"}, {"text": "Rupture from the infraglenoid tubercle", "correct": false, "why": "The biceps attaches to the supraglenoid tubercle. [Slide #35]"}, {"text": "UCL sprain from valgus stress", "correct": false, "why": "That is pitcher's elbow. [Slide #35]"}]},
  {"id": 75, "subjectIndex": 3, "quarter": 2, "slideRef": 36, "difficulty": "medium", "priority": true, "stem": "Rupture of the biceps long head tendon usually tears it from the supraglenoid tubercle, producing a:", "options": [{"text": "Popeye deformity", "correct": true, "why": "The detached belly balls up in the distal anterior arm: Popeye deformity. [Slide #36]"}, {"text": "winged scapula", "correct": false, "why": "Winging is long thoracic nerve injury. [Slide #36]"}, {"text": "drooping shoulder", "correct": false, "why": "Drooping is spinal accessory nerve injury. [Slide #36]"}, {"text": "Dupuytren contracture", "correct": false, "why": "Dupuytren is fibrosis of the palmar fascia. [Slide #36]"}]},
  {"id": 76, "subjectIndex": 3, "quarter": 2, "slideRef": 36, "difficulty": "medium", "priority": true, "stem": "Rupture of the biceps long head tendon usually occurs in which population?", "options": [{"text": "People over 35 doing repetitive overhead motions", "correct": true, "why": "Rupture is usually in people over 35: swimmers, pitchers, weightlifters. [Slide #36]"}, {"text": "Children under 12", "correct": false, "why": "Children have growth plates; rupture is in older adults. [Slide #36]"}, {"text": "Sedentary young adults", "correct": false, "why": "Rupture follows wear and tear from repetitive overhead motion. [Slide #36]"}, {"text": "People with thoracic outlet syndrome", "correct": false, "why": "TOS is a neurovascular compression. [Slide #36]"}]},
  {"id": 77, "subjectIndex": 4, "quarter": 3, "slideRef": 51, "difficulty": "easy", "priority": true, "stem": "The anterior forearm compartment contains which functional groups?", "options": [{"text": "Flexors and pronators", "correct": true, "why": "Anterior forearm = flexors and pronators; posterior = extensors and supinators. [Slide #51]"}, {"text": "Extensors and supinators", "correct": false, "why": "These are in the posterior compartment. [Slide #51]"}, {"text": "Flexors and supinators", "correct": false, "why": "Supinators are posterior. [Slide #51]"}, {"text": "Extensors and pronators", "correct": false, "why": "Extensors are posterior. [Slide #51]"}]},
  {"id": 78, "subjectIndex": 4, "quarter": 3, "slideRef": 51, "difficulty": "easy", "priority": true, "stem": "The anterior forearm flexors have approximately _______ the bulk and strength of the posterior extensors.", "options": [{"text": "twice", "correct": true, "why": "Forearm flexors have about twice the bulk and strength of the extensors. [Slide #51]"}, {"text": "half", "correct": false, "why": "Reversed; the flexors are larger. [Slide #51]"}, {"text": "one-quarter", "correct": false, "why": "The flexors are larger, not smaller. [Slide #51]"}, {"text": "exactly equal", "correct": false, "why": "They are not equal. [Slide #51]"}]},
  {"id": 79, "subjectIndex": 4, "quarter": 3, "slideRef": 52, "difficulty": "medium", "priority": true, "stem": "Which muscle is NOT in the superficial layer of the anterior forearm?", "options": [{"text": "Flexor digitorum superficialis", "correct": true, "why": "FDS alone forms the intermediate layer. Superficial: pronator teres, FCR, palmaris longus, FCU. [Slide #52]"}, {"text": "Pronator teres", "correct": false, "why": "Pronator teres is superficial. [Slide #52]"}, {"text": "Palmaris longus", "correct": false, "why": "Palmaris longus is superficial. [Slide #52]"}, {"text": "Flexor carpi ulnaris", "correct": false, "why": "FCU is superficial. [Slide #52]"}]},
  {"id": 80, "subjectIndex": 4, "quarter": 3, "slideRef": 52, "difficulty": "medium", "priority": true, "stem": "Which group lists all deep-layer muscles of the anterior forearm?", "options": [{"text": "FDP, flexor pollicis longus, pronator quadratus", "correct": true, "why": "Deep layer: FDP, FPL, pronator quadratus. [Slide #52]"}, {"text": "FDS, FDP, flexor pollicis longus", "correct": false, "why": "FDS is the intermediate layer. [Slide #52]"}, {"text": "Pronator teres, FCR, palmaris longus", "correct": false, "why": "These are superficial. [Slide #52]"}, {"text": "Supinator, extensor indicis, APL", "correct": false, "why": "These are deep posterior muscles. [Slide #52]"}]},
  {"id": 81, "subjectIndex": 4, "quarter": 3, "slideRef": 52, "difficulty": "easy", "priority": true, "stem": "The intermediate layer of the anterior forearm consists only of the:", "options": [{"text": "flexor digitorum superficialis", "correct": true, "why": "FDS alone occupies the intermediate layer. [Slide #52]"}, {"text": "flexor digitorum profundus", "correct": false, "why": "FDP is deep. [Slide #52]"}, {"text": "pronator quadratus", "correct": false, "why": "Pronator quadratus is deep. [Slide #52]"}, {"text": "flexor carpi radialis", "correct": false, "why": "FCR is superficial. [Slide #52]"}]},
  {"id": 82, "subjectIndex": 4, "quarter": 3, "slideRef": 53, "difficulty": "medium", "priority": true, "stem": "Pronator teres has a humeral head from the medial epicondyle and an ulnar head from the:", "options": [{"text": "coronoid process of the ulna", "correct": true, "why": "Pronator teres ulnar head: coronoid process of the ulna. [Slide #53]"}, {"text": "olecranon", "correct": false, "why": "Olecranon is part of the FCU ulnar head origin. [Slide #53]"}, {"text": "styloid process of the ulna", "correct": false, "why": "Not a pronator teres attachment. [Slide #53]"}, {"text": "crest of the ulna", "correct": false, "why": "Ulnar crest gives rise to supinator. [Slide #53]"}]},
  {"id": 83, "subjectIndex": 4, "quarter": 3, "slideRef": 53, "difficulty": "easy", "priority": false, "stem": "Pronator teres inserts on the _______ and both pronates and flexes the forearm.", "options": [{"text": "lateral surface of the radius", "correct": true, "why": "Pronator teres inserts on the lateral surface of the radius. [Slide #53]"}, {"text": "distal 1/4 of anterior radius", "correct": false, "why": "That is pronator quadratus. [Slide #53]"}, {"text": "base of the second metacarpal", "correct": false, "why": "That is FCR / ECRL. [Slide #53]"}, {"text": "radial tuberosity", "correct": false, "why": "That is biceps. [Slide #53]"}]},
  {"id": 84, "subjectIndex": 4, "quarter": 3, "slideRef": 54, "difficulty": "medium", "priority": true, "stem": "Flexor carpi radialis inserts on the base of the 2nd metacarpal and produces which wrist actions?", "options": [{"text": "Flexion and abduction (radial deviation)", "correct": true, "why": "FCR flexes and abducts (radially deviates) the wrist. [Slide #54]"}, {"text": "Flexion and adduction (ulnar deviation)", "correct": false, "why": "That is FCU. [Slide #54]"}, {"text": "Extension and abduction", "correct": false, "why": "That is ECRL/ECRB. [Slide #54]"}, {"text": "Extension and adduction", "correct": false, "why": "That is ECU. [Slide #54]"}]},
  {"id": 85, "subjectIndex": 4, "quarter": 3, "slideRef": 55, "difficulty": "easy", "priority": true, "stem": "Palmaris longus is absent on one or both sides in approximately _______ of people.", "options": [{"text": "14%", "correct": true, "why": "Palmaris longus is absent (usually the left) in about 14%, and its actions are not missed. [Slide #55]"}, {"text": "4%", "correct": false, "why": "The stated figure is about 14%. [Slide #55]"}, {"text": "40%", "correct": false, "why": "The stated figure is about 14%. [Slide #55]"}, {"text": "74%", "correct": false, "why": "The stated figure is about 14%. [Slide #55]"}]},
  {"id": 86, "subjectIndex": 4, "quarter": 3, "slideRef": 55, "difficulty": "medium", "priority": false, "stem": "Palmaris longus inserts on the:", "options": [{"text": "flexor retinaculum and palmar aponeurosis", "correct": true, "why": "Palmaris longus inserts on the flexor retinaculum and palmar aponeurosis (the palmar fascia is its expanded tendon). [Slide #55]"}, {"text": "base of the 2nd metacarpal", "correct": false, "why": "That is FCR. [Slide #55]"}, {"text": "pisiform and hook of hamate", "correct": false, "why": "That is FCU. [Slide #55]"}, {"text": "middle phalanges of digits 2-5", "correct": false, "why": "That is FDS. [Slide #55]"}]},
  {"id": 87, "subjectIndex": 4, "quarter": 3, "slideRef": 56, "difficulty": "medium", "priority": true, "stem": "Flexor carpi ulnaris inserts on the pisiform, hook of hamate, and 5th metacarpal to produce:", "options": [{"text": "wrist flexion and adduction (ulnar deviation)", "correct": true, "why": "FCU flexes and adducts (ulnar deviates) the wrist. [Slide #56]"}, {"text": "wrist flexion and abduction", "correct": false, "why": "That is FCR. [Slide #56]"}, {"text": "wrist extension and adduction", "correct": false, "why": "That is ECU. [Slide #56]"}, {"text": "forearm pronation", "correct": false, "why": "Pronation is pronator teres/quadratus. [Slide #56]"}]},
  {"id": 88, "subjectIndex": 4, "quarter": 3, "slideRef": 56, "difficulty": "hard", "priority": true, "stem": "Which two anterior forearm muscles (or parts) are innervated by the ulnar nerve?", "options": [{"text": "FCU and the medial half of FDP", "correct": true, "why": "Everything else anterior is median; the ulnar nerve supplies FCU and the medial (ulnar) portion of FDP. [Slide #56]"}, {"text": "FCR and palmaris longus", "correct": false, "why": "Both are median. [Slide #56]"}, {"text": "Pronator teres and pronator quadratus", "correct": false, "why": "Both are median. [Slide #56]"}, {"text": "FDS and flexor pollicis longus", "correct": false, "why": "Both are median. [Slide #56]"}]},
  {"id": 89, "subjectIndex": 4, "quarter": 3, "slideRef": 56, "difficulty": "medium", "priority": false, "stem": "Which anterior forearm muscle has a humeral head from the medial epicondyle and an ulnar head from the olecranon and posterior ulna?", "options": [{"text": "Flexor carpi ulnaris", "correct": true, "why": "FCU: humeral head medial epicondyle; ulnar head olecranon/posterior ulna. [Slide #56]"}, {"text": "Pronator teres", "correct": false, "why": "Its ulnar head is from the coronoid process, not the olecranon. [Slide #56]"}, {"text": "Flexor digitorum superficialis", "correct": false, "why": "Its humeroulnar head uses the coronoid process; it has a radial head too. [Slide #56]"}, {"text": "Flexor carpi radialis", "correct": false, "why": "FCR arises only from the medial epicondyle. [Slide #56]"}]},
  {"id": 90, "subjectIndex": 4, "quarter": 3, "slideRef": 57, "difficulty": "medium", "priority": true, "stem": "FDS inserts on the middle phalanges of digits 2-5 and primarily flexes the _______ joints.", "options": [{"text": "proximal interphalangeal (PIP)", "correct": true, "why": "FDS flexes at the PIP joints (and MCP). [Slide #57]"}, {"text": "distal interphalangeal (DIP)", "correct": false, "why": "DIP flexion is FDP. [Slide #57]"}, {"text": "carpometacarpal (CMC)", "correct": false, "why": "FDS does not act primarily at the CMC. [Slide #57]"}, {"text": "thumb interphalangeal", "correct": false, "why": "Thumb IP flexion is FPL. [Slide #57]"}]},
  {"id": 91, "subjectIndex": 4, "quarter": 3, "slideRef": 57, "difficulty": "hard", "priority": false, "stem": "Which muscle has a humeroulnar head (medial epicondyle and coronoid) and a radial head (anterosuperior radius)?", "options": [{"text": "Flexor digitorum superficialis", "correct": true, "why": "FDS: humeroulnar head plus radial head. [Slide #57]"}, {"text": "Pronator teres", "correct": false, "why": "Pronator teres has humeral and ulnar heads but no radial head. [Slide #57]"}, {"text": "Flexor pollicis longus", "correct": false, "why": "FPL arises from the anterior radius and interosseous membrane only. [Slide #57]"}, {"text": "Flexor digitorum profundus", "correct": false, "why": "FDP arises from the proximal 3/4 anterior ulna and interosseous membrane. [Slide #57]"}]},
  {"id": 92, "subjectIndex": 4, "quarter": 3, "slideRef": 58, "difficulty": "medium", "priority": true, "stem": "Which statement correctly contrasts FDS and FDP insertions?", "options": [{"text": "FDS: middle phalanges; FDP: distal phalanges", "correct": true, "why": "FDS stops at the middle phalanges; FDP reaches the bases of the distal phalanges (fingertips). [Slide #58]"}, {"text": "FDS: distal phalanges; FDP: middle phalanges", "correct": false, "why": "Reversed. [Slide #58]"}, {"text": "Both insert on the proximal phalanges", "correct": false, "why": "Neither inserts on the proximal phalanges. [Slide #58]"}, {"text": "Both include the thumb (digits 1-5)", "correct": false, "why": "Both digitorums go to digits 2-5 only. [Slide #58]"}]},
  {"id": 93, "subjectIndex": 4, "quarter": 3, "slideRef": 58, "difficulty": "hard", "priority": true, "stem": "Flexor digitorum profundus receives which dual innervation?", "options": [{"text": "Lateral part median; medial part ulnar", "correct": true, "why": "FDP: lateral portion median nerve, medial portion ulnar nerve. [Slide #58]"}, {"text": "Lateral part ulnar; medial part median", "correct": false, "why": "Reversed. [Slide #58]"}, {"text": "Entirely median nerve", "correct": false, "why": "The medial portion is ulnar. [Slide #58]"}, {"text": "Radial and ulnar nerves", "correct": false, "why": "The radial nerve supplies posterior muscles only. [Slide #58]"}]},
  {"id": 94, "subjectIndex": 4, "quarter": 3, "slideRef": 58, "difficulty": "medium", "priority": false, "stem": "FDP arises from the _______ and the interosseous membrane.", "options": [{"text": "proximal 3/4 of the anterior ulna", "correct": true, "why": "FDP: proximal 3/4 anterior ulna and interosseous membrane. [Slide #58]"}, {"text": "medial epicondyle of the humerus", "correct": false, "why": "That is the superficial-layer origin. [Slide #58]"}, {"text": "distal 1/4 of the anterior ulna", "correct": false, "why": "That is pronator quadratus. [Slide #58]"}, {"text": "anterior surface of the radius", "correct": false, "why": "That is FPL. [Slide #58]"}]},
  {"id": 95, "subjectIndex": 4, "quarter": 3, "slideRef": 59, "difficulty": "medium", "priority": true, "stem": "Flexor pollicis longus arises from the anterior radius/interosseous membrane and inserts on the:", "options": [{"text": "base of the distal phalanx of the pollex", "correct": true, "why": "FPL inserts on the base of the distal phalanx of the thumb. [Slide #59]"}, {"text": "lateral base of the proximal phalanx of the thumb", "correct": false, "why": "That is APB / FPB. [Slide #59]"}, {"text": "base of the first metacarpal", "correct": false, "why": "That is APL. [Slide #59]"}, {"text": "lateral side of the first metacarpal", "correct": false, "why": "That is opponens pollicis. [Slide #59]"}]},
  {"id": 96, "subjectIndex": 4, "quarter": 3, "slideRef": 60, "difficulty": "medium", "priority": true, "stem": "Pronator quadratus spans which attachments?", "options": [{"text": "Distal 1/4 anterior ulna to distal 1/4 anterior radius", "correct": true, "why": "Pronator quadratus: distal 1/4 anterior ulna to distal 1/4 anterior radius; median nerve. [Slide #60]"}, {"text": "Medial epicondyle to lateral radius", "correct": false, "why": "That is pronator teres. [Slide #60]"}, {"text": "Lateral epicondyle to proximal 1/3 radius", "correct": false, "why": "That is supinator. [Slide #60]"}, {"text": "Proximal 3/4 ulna to distal phalanges", "correct": false, "why": "That is FDP. [Slide #60]"}]},
  {"id": 97, "subjectIndex": 4, "quarter": 3, "slideRef": 60, "difficulty": "hard", "priority": true, "stem": "Which statement correctly contrasts the two pronators?", "options": [{"text": "Teres pronates and flexes the elbow; quadratus only pronates", "correct": true, "why": "Pronator teres crosses the elbow, so it also flexes; pronator quadratus is distal and only pronates. Both are median. [Slide #60]"}, {"text": "Quadratus pronates and flexes; teres only pronates", "correct": false, "why": "Reversed; quadratus does not cross the elbow. [Slide #60]"}, {"text": "Teres is ulnar; quadratus is median", "correct": false, "why": "Both are median. [Slide #60]"}, {"text": "Both originate from the medial epicondyle", "correct": false, "why": "Only pronator teres does. [Slide #60]"}]},
  {"id": 98, "subjectIndex": 4, "quarter": 3, "slideRef": 52, "difficulty": "hard", "priority": true, "stem": "Which anterior forearm muscle is the 'odd one out' in innervation?", "options": [{"text": "Flexor carpi ulnaris", "correct": true, "why": "All anterior forearm muscles are median except FCU (and medial FDP), which are ulnar. [Slide #52]"}, {"text": "Flexor carpi radialis", "correct": false, "why": "FCR is median. [Slide #52]"}, {"text": "Palmaris longus", "correct": false, "why": "Palmaris longus is median. [Slide #52]"}, {"text": "Pronator quadratus", "correct": false, "why": "Pronator quadratus is median. [Slide #52]"}]},
  {"id": 99, "subjectIndex": 5, "quarter": 3, "slideRef": 61, "difficulty": "medium", "priority": true, "stem": "Which muscle is in the deep layer of the posterior forearm?", "options": [{"text": "Supinator", "correct": true, "why": "Deep posterior: supinator, extensor indicis, APL, EPL, EPB. [Slide #61]"}, {"text": "Anconeus", "correct": false, "why": "Anconeus is superficial. [Slide #61]"}, {"text": "Extensor carpi ulnaris", "correct": false, "why": "ECU is superficial. [Slide #61]"}, {"text": "Extensor digiti minimi", "correct": false, "why": "EDM is superficial. [Slide #61]"}]},
