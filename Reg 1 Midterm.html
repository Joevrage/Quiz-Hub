<script>
/* Builder: first option listed is the correct one (shuffled at draw time).
   Q(slide, difficulty e/m/h, priority 0/1, stem, [[text, why], ...])
   Quarter = Math.ceil(slide/25). Deck order: Q1 shoulder (1-25), Q2 arm + anterior/posterior forearm (26-50),
   Q3 posterior forearm + hand (51-75), Q4 plexus, vessels, elbow, entrapments, other nerves (76-100). */
let _id=0;
function Q(slide,d,p,stem,o){
  _id++;
  return {id:_id,quarter:Math.ceil(slide/25),slideRef:slide,difficulty:{e:"easy",m:"medium",h:"hard"}[d],priority:!!p,stem:stem,
    options:o.map((x,i)=>({text:x[0],correct:i===0,why:x[1]+" [Slide #"+slide+"]"}))};
}
const questionBank=[
/* ================= QUARTER 1: SHOULDER / PECTORAL / SCAPULAR (slides 1-25) ================= */
Q(4,"e",1,"The trapezius is innervated by the _______ nerve.",[
 ["spinal accessory","Correct: the spinal accessory nerve (CN XI) supplies the trapezius."],
 ["thoracodorsal","Incorrect: the thoracodorsal nerve supplies the latissimus dorsi."],
 ["dorsal scapular","Incorrect: the dorsal scapular nerve supplies the rhomboids and levator scapulae."],
 ["long thoracic","Incorrect: the long thoracic nerve supplies the serratus anterior."]]),
Q(5,"m",1,"Which portion of the trapezius elevates the scapula?",[
 ["Descending (superior) fibers","Correct: fibers run superior to inferior, so contraction lifts the scapula."],
 ["Ascending (inferior) fibers","Incorrect: these pull inferiorly and depress the scapula."],
 ["Middle (horizontal) fibers","Incorrect: these run horizontally and retract the scapula."],
 ["Descending and ascending fibers together","Incorrect: acting together they rotate the scapula superiorly rather than elevate it."]]),
Q(5,"m",0,"What movement do the descending and ascending trapezius fibers produce when acting together?",[
 ["Superior rotation of the scapula","Correct: the opposing pulls rotate the scapula upward."],
 ["Inferior rotation of the scapula","Incorrect: inferior rotation is produced by the rhomboids."],
 ["Protraction of the scapula","Incorrect: protraction is produced by the serratus anterior and pectoralis minor."],
 ["Retraction of the scapula","Incorrect: retraction is produced by the middle fibers alone."]]),
Q(6,"m",1,"Which set of actions is produced by the latissimus dorsi at the shoulder?",[
 ["Extension, adduction, and medial rotation","Correct: the lat extends, adducts, and medially rotates the humerus."],
 ["Extension, abduction, and lateral rotation","Incorrect: the lat adducts and medially rotates; it does not abduct or laterally rotate."],
 ["Flexion, adduction, and medial rotation","Incorrect: the lat extends rather than flexes the humerus."],
 ["Flexion, abduction, and lateral rotation","Incorrect: every component is the opposite of the lat action."]]),
Q(6,"m",0,"The latissimus dorsi is innervated by the _______ nerve.",[
 ["thoracodorsal","Correct: thoracic plus dorsum (back) identifies the thoracodorsal nerve (C6-C8)."],
 ["axillary","Incorrect: the axillary nerve supplies the deltoid and teres minor."],
 ["suprascapular","Incorrect: the suprascapular nerve supplies the supraspinatus and infraspinatus."],
 ["upper subscapular","Incorrect: the upper subscapular nerve supplies the subscapularis."]]),
Q(6,"m",0,"When the arms are fixed, the latissimus dorsi _______.",[
 ["raises the body toward the arms during climbing","Correct: with the humerus fixed, the lat pulls the trunk upward."],
 ["lowers the body away from the arms during climbing","Incorrect: contraction pulls the trunk toward the fixed humerus, not away."],
 ["elevates the scapula during shrugging","Incorrect: scapular elevation is a trapezius and levator scapulae action."],
 ["laterally rotates the humerus during climbing","Incorrect: the lat is a medial rotator."]]),
Q(8,"e",0,"The levator scapulae originates from the transverse processes of which vertebrae?",[
 ["C1 to C4","Correct: it runs from C1-C4 transverse processes to the superior medial border of the scapula."],
 ["C7 to T1","Incorrect: these spinous processes are the origin of the rhomboid minor."],
 ["T2 to T5","Incorrect: these spinous processes are the origin of the rhomboid major."],
 ["T7 to L5","Incorrect: these spinous processes are the origin of the latissimus dorsi."]]),
Q(10,"m",1,"Which statement correctly distinguishes the rhomboid minor from the rhomboid major?",[
 ["Minor originates from C7-T1; major from T2-T5","Correct: minor over major refers to the superior versus inferior origin."],
 ["Minor originates from T2-T5; major from C7-T1","Incorrect: this inverts the origins."],
 ["Minor is supplied by the dorsal scapular nerve; major by the thoracodorsal nerve","Incorrect: both are supplied by the dorsal scapular nerve."],
 ["Minor protracts the scapula; major retracts it","Incorrect: both muscles retract the scapula."]]),
Q(10,"m",0,"The rhomboids retract the scapula and rotate the glenoid cavity in which direction?",[
 ["Inferiorly","Correct: they rotate the scapula back and down, tilting the glenoid inferiorly."],
 ["Superiorly","Incorrect: superior glenoid rotation is produced by the trapezius and serratus anterior."],
 ["Anteriorly","Incorrect: anterior movement is protraction, which opposes rhomboid action."],
 ["Laterally","Incorrect: the rhomboids pull the scapula medially."]]),
Q(8,"m",0,"The dorsal scapular nerve arises primarily from which spinal level?",[
 ["C5","Correct: the dorsal scapular nerve comes directly from C5."],
 ["C8-T1","Incorrect: this is the level of the medial pectoral nerve."],
 ["C2-C3","Incorrect: these levels contribute to the cervical plexus, not the dorsal scapular nerve."],
 ["T3-T4","Incorrect: these are thoracic levels outside the brachial plexus."]]),
Q(11,"e",0,"The deltoid inserts on the _______ of the humerus.",[
 ["deltoid tuberosity","Correct: all three parts insert on the deltoid tuberosity."],
 ["lesser tubercle","Incorrect: the lesser tubercle is the subscapularis insertion."],
 ["greater tubercle","Incorrect: the greater tubercle receives three rotator cuff muscles."],
 ["radial groove","Incorrect: this is the groove for the radial nerve, not a deltoid attachment."]]),
Q(13,"m",1,"Which muscle is NOT a member of the rotator cuff?",[
 ["Teres major","Correct: the teres major inserts lower on the humerus and is not part of the SITS group."],
 ["Teres minor","Incorrect: the teres minor is a rotator cuff muscle."],
 ["Infraspinatus","Incorrect: the infraspinatus is a rotator cuff muscle."],
 ["Subscapularis","Incorrect: the subscapularis is a rotator cuff muscle."]]),
Q(13,"m",0,"Which rotator cuff muscle originates superior to the spine of the scapula?",[
 ["Supraspinatus","Correct: it arises in the supraspinous fossa above the spine."],
 ["Infraspinatus","Incorrect: it arises in the infraspinous fossa below the spine."],
 ["Teres minor","Incorrect: it arises from the lateral border below the spine."],
 ["Subscapularis","Incorrect: it arises from the anterior subscapular fossa."]]),
Q(17,"m",1,"Which rotator cuff muscle medially rotates the humerus?",[
 ["Subscapularis","Correct: it inserts on the lesser tubercle and medially rotates the humerus."],
 ["Infraspinatus","Incorrect: the infraspinatus laterally rotates the humerus."],
 ["Teres minor","Incorrect: the teres minor laterally rotates the humerus."],
 ["Supraspinatus","Incorrect: the supraspinatus abducts the humerus."]]),
Q(16,"h",1,"Which muscle laterally rotates the humerus and is innervated by the axillary nerve?",[
 ["Teres minor","Correct: it laterally rotates the humerus and is supplied by the axillary nerve (C5-C6)."],
 ["Infraspinatus","Incorrect: it also laterally rotates but is supplied by the suprascapular nerve."],
 ["Teres major","Incorrect: it medially rotates and is supplied by the lower subscapular nerve."],
 ["Deltoid","Incorrect: it is axillary-supplied but produces flexion, abduction, and extension, not lateral rotation."]]),
Q(18,"m",1,"Which rotator cuff tendon is most commonly ruptured?",[
 ["Supraspinatus","Correct: it carries much of the arm's support at the top of the humerus."],
 ["Infraspinatus","Incorrect: it is ruptured less often than the supraspinatus."],
 ["Teres minor","Incorrect: it is ruptured less often than the supraspinatus."],
 ["Subscapularis","Incorrect: it is ruptured less often than the supraspinatus."]]),
Q(18,"m",0,"Rotator cuff problems such as frozen shoulder are increasingly linked with which group?",[
 ["Women in perimenopause and menopause","Correct: shoulder problems are increasingly reported in women in their late 30s through 60s."],
 ["Adolescent male athletes","Incorrect: degenerative cuff disease is typical of older patients."],
 ["Premenarchal girls","Incorrect: no association is described with this group."],
 ["Men younger than 25","Incorrect: cuff degeneration is more common in older individuals."]]),
Q(20,"h",1,"Which statement correctly describes the pectoral nerve supply?",[
 ["Medial pectoral nerve supplies both pectoralis muscles; lateral supplies only the major","Correct: the pectoralis minor receives only the medial pectoral nerve."],
 ["Lateral pectoral nerve supplies both pectoralis muscles; medial supplies only the major","Incorrect: this inverts the pattern."],
 ["Pectoralis minor receives both pectoral nerves; major receives only the medial","Incorrect: the major receives both; the minor receives only the medial."],
 ["Pectoralis minor is supplied by the long thoracic nerve","Incorrect: the long thoracic nerve supplies the serratus anterior."]]),
Q(20,"m",0,"The pectoralis major inserts on which portion of the intertubercular groove?",[
 ["Lateral","Correct: the pectoralis major inserts on the lateral lip of the groove."],
 ["Medial","Incorrect: the medial portion receives the latissimus dorsi and teres major."],
 ["Floor only","Incorrect: the major is described as attaching to the lateral portion."],
 ["Greater tubercle","Incorrect: this receives supraspinatus, infraspinatus, and teres minor."]]),
Q(21,"m",0,"The pectoralis minor originates from ribs 3-5 and acts to _______.",[
 ["protract and depress the scapula","Correct: it pulls the coracoid process forward and down."],
 ["retract and elevate the scapula","Incorrect: this opposes its action."],
 ["adduct and medially rotate the humerus","Incorrect: this is pectoralis major action; the minor does not reach the humerus."],
 ["stabilize and depress the clavicle","Incorrect: this is the subclavius action."]]),
Q(22,"e",0,"The subclavius functions to _______.",[
 ["stabilize and depress the clavicle","Correct: it runs from rib 1 to the clavicle and stabilizes it."],
 ["protract the scapula","Incorrect: protraction is produced by the serratus anterior."],
 ["elevate the first rib","Incorrect: it depresses the clavicle and does not elevate the rib."],
 ["abduct the humerus","Incorrect: it does not attach to the humerus."]]),
Q(23,"h",1,"Which muscle lies between the serratus anterior and the scapula?",[
 ["Subscapularis","Correct: the serratus anterior and scapula form the bread of the subscapularis sandwich."],
 ["Infraspinatus","Incorrect: the infraspinatus lies posterior to the scapula."],
 ["Pectoralis minor","Incorrect: the pectoralis minor lies anterior to the serratus on the chest wall."],
 ["Teres major","Incorrect: the teres major attaches to the inferior angle and is not in that sandwich."]]),
Q(24,"e",0,"Rounding the shoulders forward is _______ of the scapula.",[
 ["protraction","Correct: forward movement of the scapula is protraction."],
 ["retraction","Incorrect: retraction pulls the shoulders back."],
 ["elevation","Incorrect: elevation is superior movement."],
 ["depression","Incorrect: depression is inferior movement."]]),
Q(12,"h",1,"Which pair of muscles attaches to the medial portion of the intertubercular groove?",[
 ["Latissimus dorsi and teres major","Correct: both insert medially, so they act together in adduction and medial rotation."],
 ["Pectoralis major and latissimus dorsi","Incorrect: the pectoralis major inserts on the lateral portion."],
 ["Pectoralis major and teres major","Incorrect: the pectoralis major inserts laterally."],
 ["Subscapularis and teres major","Incorrect: the subscapularis inserts on the lesser tubercle."]]),
Q(12,"h",0,"The lower subscapular nerve supplies the teres major and the _______.",[
 ["subscapularis","Correct: the upper and lower subscapular nerves both reach the subscapularis."],
 ["supraspinatus","Incorrect: the supraspinatus is supplied by the suprascapular nerve."],
 ["latissimus dorsi","Incorrect: the latissimus dorsi is supplied by the thoracodorsal nerve."],
 ["deltoid","Incorrect: the deltoid is supplied by the axillary nerve."]]),

/* ================= QUARTER 2: ARM + ANTERIOR / POSTERIOR FOREARM (slides 26-50) ================= */
Q(26,"e",0,"The posterior (extensor) compartment of the arm contains only the _______ muscle.",[
 ["triceps brachii","Correct: the triceps is the sole muscle of the posterior arm."],
 ["brachialis","Incorrect: the brachialis is in the anterior compartment."],
 ["coracobrachialis","Incorrect: the coracobrachialis is in the anterior compartment."],
 ["biceps brachii","Incorrect: the biceps is in the anterior compartment."]]),
Q(27,"m",1,"Which nerve passes through the coracobrachialis and supplies all anterior arm muscles?",[
 ["Musculocutaneous","Correct: it pierces the coracobrachialis and supplies the biceps, brachialis, and coracobrachialis."],
 ["Radial","Incorrect: the radial nerve supplies the posterior arm."],
 ["Median","Incorrect: the median nerve supplies no arm muscles."],
 ["Axillary","Incorrect: the axillary nerve supplies the deltoid and teres minor."]]),
Q(27,"m",0,"What is the action of the coracobrachialis?",[
 ["Flexion and adduction of the humerus","Correct: it also helps prevent shoulder dislocation."],
 ["Extension and abduction of the humerus","Incorrect: this opposes its action."],
 ["Flexion and supination of the forearm","Incorrect: these are biceps brachii actions."],
 ["Extension of the forearm","Incorrect: this is a triceps action."]]),
Q(28,"h",1,"Which statement correctly describes the long head of the biceps brachii?",[
 ["Lateral; arises from the supraglenoid tubercle","Correct: long and lateral share an L, and it originates at the supraglenoid tubercle."],
 ["Medial; arises from the supraglenoid tubercle","Incorrect: the long head is lateral; the short head is medial."],
 ["Lateral; arises from the coracoid process","Incorrect: the coracoid process is the short head origin."],
 ["Medial; arises from the coracoid process","Incorrect: this describes the short head."]]),
Q(28,"m",0,"What are the actions of the biceps brachii at the elbow and forearm?",[
 ["Flexes and supinates the forearm","Correct: pulling on the radial tuberosity flexes and supinates."],
 ["Flexes and pronates the forearm","Incorrect: pronation is by pronator teres and quadratus."],
 ["Extends and supinates the forearm","Incorrect: the biceps does not extend the elbow."],
 ["Extends and pronates the forearm","Incorrect: both actions are incorrect."]]),
Q(29,"e",0,"The brachialis inserts on the coronoid process and tuberosity of the _______.",[
 ["ulna","Correct: the brachialis attaches to the ulna and flexes the forearm."],
 ["radius","Incorrect: the biceps inserts on the radial tuberosity."],
 ["humerus","Incorrect: the humerus is the brachialis origin."],
 ["scapula","Incorrect: the brachialis has no scapular attachment."]]),
Q(30,"m",1,"Where does the lateral head of the triceps originate relative to the radial groove?",[
 ["Superior to the radial groove","Correct: the lateral head arises superior to the groove."],
 ["Inferior to the radial groove","Incorrect: this is the medial head."],
 ["Anterior to the radial groove","Incorrect: the triceps heads arise from the posterior humerus."],
 ["Medial to the radial groove","Incorrect: the head is defined as superior, not medial, to the groove."]]),
Q(30,"h",1,"Which triceps head arises from the scapula and helps resist humeral dislocation?",[
 ["Long head","Correct: it arises from the infraglenoid tubercle and crosses the shoulder."],
 ["Lateral head","Incorrect: it arises from the humerus and does not cross the shoulder."],
 ["Medial head","Incorrect: it arises from the humerus inferior to the radial groove."],
 ["Short head","Incorrect: the triceps has no short head; this belongs to the biceps."]]),
Q(31,"m",1,"Tendinosis of the biceps tendon is characterized by _______.",[
 ["collagen degeneration without inflammation","Correct: it follows poor vascularization, chronic overuse, or aging."],
 ["inflammation from acute microtears","Incorrect: this describes tendonitis."],
 ["a ruptured tendon with a bunched muscle belly","Incorrect: this describes the Popeye deformity of rupture."],
 ["tendon displacement from the groove","Incorrect: this describes dislocation."]]),
Q(32,"e",0,"The long head of the biceps tendon glides within the _______ groove of the humerus.",[
 ["intertubercular","Correct: this is also called the bicipital groove."],
 ["radial","Incorrect: the radial groove carries the radial nerve and deep brachial artery."],
 ["coronoid","Incorrect: the coronoid fossa lies on the distal anterior humerus."],
 ["glenoid","Incorrect: the glenoid is a scapular socket, not a humeral groove."]]),
Q(33,"m",0,"Dislocation of the long head biceps tendon in older people is associated with prior biceps _______.",[
 ["tendonitis","Correct: older patients with a history of tendonitis develop popping or catching."],
 ["epicondylitis","Incorrect: epicondylitis affects the elbow, not the biceps groove."],
 ["adhesive capsulitis","Incorrect: this is a joint capsule condition."],
 ["myositis ossificans","Incorrect: this is heterotopic bone formation in muscle."]]),
Q(34,"m",1,"Which patient is most likely to rupture the long head biceps tendon?",[
 ["Overhead athlete older than 35 with prior tendonitis","Correct: swimmers and pitchers over 35 with an inflamed tendon are typical."],
 ["Adolescent athlete with a normal tendon","Incorrect: rupture usually follows wear and tear of an inflamed tendon."],
 ["Sedentary adult younger than 25","Incorrect: rupture usually occurs in people older than 35."],
 ["Child with proximal humeral epiphyseal separation","Incorrect: this is associated with tendon dislocation in the young."]]),
Q(34,"h",1,"At which attachment does a long head biceps rupture occur to produce the Popeye deformity?",[
 ["Supraglenoid tubercle","Correct: the tendon tears from the supraglenoid tubercle and the belly bunches distally."],
 ["Coracoid process","Incorrect: this is the short head origin."],
 ["Radial tuberosity","Incorrect: this is the distal insertion of the biceps."],
 ["Infraglenoid tubercle","Incorrect: this is the long head of the triceps origin."]]),
Q(35,"e",0,"The anterior forearm flexors have approximately _______ the bulk and strength of the posterior extensors.",[
 ["twice","Correct: flexors are about twice as bulky and strong as extensors."],
 ["half","Incorrect: this inverts the relationship."],
 ["the same as","Incorrect: the flexors are stronger."],
 ["four times","Incorrect: the stated ratio is approximately twofold."]]),
Q(36,"m",0,"Which muscle forms the intermediate layer of the anterior forearm?",[
 ["Flexor digitorum superficialis","Correct: it lies between the superficial and deep layers."],
 ["Flexor digitorum profundus","Incorrect: this is in the deep layer."],
 ["Palmaris longus","Incorrect: this is in the superficial layer."],
 ["Pronator quadratus","Incorrect: this is in the deep layer."]]),
Q(37,"m",1,"The pronator teres has a humeral head from the medial epicondyle and an ulnar head from the _______.",[
 ["coronoid process","Correct: the ulnar head arises from the coronoid process of the ulna."],
 ["olecranon","Incorrect: the olecranon is the triceps insertion and a flexor carpi ulnaris origin."],
 ["radial tuberosity","Incorrect: this is the biceps insertion."],
 ["supracondylar ridge","Incorrect: this is the brachioradialis and ECRL origin."]]),
Q(38,"m",0,"The flexor carpi radialis inserts on the base of the second metacarpal and _______.",[

const QUESTIONS_PER_FULL = 50;
let currentSet = [];
let quizData = [];
let round = 1;
let quizMode = 'full';
let quickCount = 25;
let score = 0;
let answered = 0;
let answers = {};
let popupTimeout = null;
let bankIndices = [];

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function resetBankIndices() {
    bankIndices = Array.from({ length: questionBank.length }, (_, i) => i);
    for (let i = bankIndices.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [bankIndices[i], bankIndices[j]] = [bankIndices[j], bankIndices[i]];
    }
}

function drawQuestionsForRound() {
    const targetCount = (quizMode === 'full')
        ? Math.min(QUESTIONS_PER_FULL, questionBank.length)
        : Math.min(quickCount, questionBank.length);
    if (bankIndices.length < targetCount) {
        resetBankIndices();
    }
    const selectedIndices = bankIndices.splice(0, targetCount);
    currentSet = selectedIndices.map(idx => {
        const q = JSON.parse(JSON.stringify(questionBank[idx]));
        for (let i = q.options.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [q.options[i], q.options[j]] = [q.options[j], q.options[i]];
        }
        return q;
    });
    quizData = currentSet;
}

function updateStfuButton() {
    const b = document.getElementById('stfuBtn');
    if (!b) return;
    b.textContent = muted ? 'Bring Back Erijah' : 'STFU Erijah';
    b.classList.toggle('muted', muted);
    if (muted) {
        const a = document.getElementById('wrongAudio');
        if (a) { a.pause(); a.currentTime = 0; }
        if (popupTimeout) clearTimeout(popupTimeout);
        const p = document.getElementById('wrongPopup');
        if (p) p.classList.add('hidden');
    }
}
function toggleStfu() {
    muted = !muted;
    try { localStorage.setItem('stfuErijah', muted ? '1' : '0'); } catch (e) {}
    updateStfuButton();
}

/* ---------- UI ---------- */
function updateModeButtons(){
    document.getElementById('fullQuizBtn').classList.toggle('active',quizMode==='full');
    document.getElementById('quickQuizBtn').classList.toggle('active',quizMode==='quick');
    document.getElementById('quickieOptionsBar').classList.toggle('hidden',quizMode!=='quick');
}
function setMode(m){quizMode=m;round=1;updateModeButtons();renderQuiz();}
function setQuickCount(n,chip){
    quickCount=n;round=1;
    document.querySelectorAll('.count-chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    renderQuiz();
}
function updateHeader(){
    const total=quizData.length,pct=answered?Math.round(score/answered*100):0;
    document.getElementById('answered-display').textContent='Answered: '+answered+' / '+total;
    document.getElementById('score-display').textContent='Score: '+score+' / '+answered+' ('+pct+'%)';
    document.getElementById('progress-bar').style.width=(total?answered/total*100:0)+'%';
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function renderQuiz(reviewSet){
    const popup=document.getElementById('wrongPopup');if(popup)popup.classList.add('hidden');
    const wa=document.getElementById('wrongAudio');if(wa){wa.pause();wa.currentTime=0;}
    if(reviewSet){
        currentSet=reviewSet.map(src=>{const q=JSON.parse(JSON.stringify(src));shuffle(q.options);return q;});
        shuffle(currentSet);
        quizData=currentSet;
    } else {
        drawQuestionsForRound();
    }
    score=0;answered=0;answers={};
    const L=['a','b','c','d'];
    document.getElementById('quiz-container').innerHTML=quizData.map((q,qi)=>
        '<div class="card" id="card-'+qi+'"><div class="meta"><span class="badge">Q'+(qi+1)+'</span><span class="badge alt">Quarter '+q.quarter+'</span><span class="badge alt">'+q.difficulty+'</span>'+(q.priority?'<span class="badge">High-yield</span>':'')+'</div>'
        +'<div class="stem">'+esc(q.stem).replace(/_{3,}/g,'<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>')+'</div>'
        +q.options.map((o,oi)=>'<button class="option-btn" onclick="selectOption('+qi+','+oi+')"><b>'+L[oi]+'.</b> '+esc(o.text)+'</button>').join('')
        +'<div id="exp-'+qi+'"></div></div>'
    ).join('');
    updateHeader();
    window.scrollTo({top:0});
}

function selectOption(qi,oi){
    const q=quizData[qi];
    if(q._locked)return;
    q._locked=true;
    const card=document.getElementById('card-'+qi);
    const buttons=card.querySelectorAll('.option-btn');
    const isCorrect=q.options[oi].correct;
    buttons.forEach((b,bi)=>{
        b.disabled=true;
        if(q.options[bi].correct)b.classList.add('correct');
        else if(bi===oi)b.classList.add('incorrect');
        else b.classList.add('dim');
    });
    q._result=isCorrect;
    answers[qi]=oi;
    if(isCorrect){score++;}
    else if(!muted){
        const wa=document.getElementById('wrongAudio');
        if(wa){wa.currentTime=0;wa.play().catch(err=>console.log('Audio play blocked:',err));}
        const popup=document.getElementById('wrongPopup');
        if(popup){popup.classList.remove('hidden');clearTimeout(popupTimeout);popupTimeout=setTimeout(()=>popup.classList.add('hidden'),2000);}
    }
    answered++;
    const L=['a','b','c','d'];
    document.getElementById('exp-'+qi).innerHTML='<div class="explain"><div class="banner '+(isCorrect?'ok':'bad')+'">'+(isCorrect?'Correct!':'You didn\u2019t know that?!')+'</div>'
        +'<div class="concept">Reference: Quarter '+q.quarter+', Slide #'+q.slideRef+'</div><ul>'
        +q.options.map((o,i)=>'<li class="'+(o.correct?'c':'')+'"><b>'+L[i]+'.</b> '+esc(o.text)+' &mdash; '+esc(o.why)+'</li>').join('')+'</ul></div>';
    updateHeader();
    if(answered===quizData.length)setTimeout(showSummary,700);
}

function showSummary(){
    const total=quizData.length,pct=Math.round(score/total*100);
    const tier=pct>=90?'Absolute Gigachad. You drained that test dry.':(pct>=70?'You lasted less than 30 seconds. Time for a rematch.':'You really didn\u2019t fucking know that.');
    const qs={};quizData.forEach(q=>{qs[q.quarter]=qs[q.quarter]||{t:0,c:0};qs[q.quarter].t++;if(q._result)qs[q.quarter].c++;});
    const rows=Object.keys(qs).sort().map(k=>'<tr><td>Quarter '+k+'</td><td>'+qs[k].c+' / '+qs[k].t+'</td><td>'+Math.round(qs[k].c/qs[k].t*100)+'%</td></tr>').join('');
    const missed=quizData.filter(q=>!q._result).length;
    const d=document.createElement('div');d.className='card summary';d.id='summary';
    d.innerHTML='<div class="big">'+pct+'%</div><div>'+score+' / '+total+' correct</div><div class="tier">'+tier+'</div>'
        +'<table><tr><th>Deck Quarter</th><th>Correct</th><th>%</th></tr>'+rows+'</table>'
        +'<div class="actions"><button onclick="retake()">Retake Quiz</button>'
        +(missed?'<button class="sec" onclick="reviewMissed()">Review Missed ('+missed+')</button>':'')
        +'<a class="sec" href="index.html">Back to Main Base</a></div>';
    document.getElementById('quiz-container').appendChild(d);
    d.scrollIntoView({behavior:'smooth'});
}
function retake(){round++;renderQuiz();}
function reviewMissed(){
    const ids=quizData.filter(q=>!q._result).map(q=>q.id);
    renderQuiz(questionBank.filter(q=>ids.includes(q.id)));
}

window.addEventListener('load',()=>{
    document.getElementById('stfuBtn').addEventListener('click',toggleStfu);
    document.getElementById('fullQuizBtn').addEventListener('click',()=>setMode('full'));
    document.getElementById('quickQuizBtn').addEventListener('click',()=>setMode('quick'));
    document.querySelectorAll('.count-chip').forEach(chip=>{
        chip.addEventListener('click',()=>setQuickCount(parseInt(chip.dataset.count,10),chip));
    });
    resetBankIndices();
    updateStfuButton();updateModeButtons();renderQuiz();
});
</script></body></html>
