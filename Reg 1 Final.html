<script>
const SUBJECTS=["Prevertebral & Lateral Neck Muscles","Costal & Respiratory Muscles","Posterior Abdominal Wall & Lumbar Plexus","Gluteal Region & Hip Rotators","Thigh Muscles & Vessels","Leg & Foot Muscles","Shoulder & Arm (Cumulative Review)","Forearm & Hand (Cumulative Review)","Brachial Plexus, Vessels & Spaces (Cumulative Review)","Elbow Ligaments & Upper Limb Conditions (Cumulative Review)"];
let questionBank=[],n=0;
function q(week,s,d,p,ref,stem,o){n++;const id=n;const opts=o.map((x,i)=>({text:x[0],correct:i===0,why:x[1]+` [Week ${week} • ${ref}]`}));const c=opts.shift();opts.splice(id%4,0,c);
questionBank.push({id,week,subjectIndex:s,quarter:3,slideRef:ref,difficulty:d,priority:p,stem,options:opts});}
/* First option listed = correct; position is rotated automatically so keys balance across A–D. */
// ---------- WEEK 6 ----------
q(6,0,"easy",true,"Slide #3","Longus capitis inserts on which structure?",[["Basilar portion of occipital bone","Correct. Longus capitis runs from C3–C6 transverse processes to the basilar occiput and flexes the head (ventral rami C1–C3)."],["Mastoid process","Mastoid process is the insertion of sternocleidomastoid, not longus capitis."],["Jugular process of occipital bone","Jugular process receives rectus capitis lateralis."],["Anterior tubercle of atlas","Anterior tubercle of the atlas is a superior oblique fiber insertion of longus colli."]]);
q(6,0,"medium",true,"Transcript #7","Which cervical vertebra is the only one that longus colli does not attach to?",[["C7","Correct. Longus colli spans C2–C5 and T1–T3 attachments, skipping C6–C7 for body attachments, and inserts on the atlas tubercle, C2–C4 and C5–C6 tubercles. C7 is untouched."],["C3","C3 gives origin to superior oblique fibers (anterior tubercle) and vertical fibers."],["C4","C4 is attached through the vertical fibers."],["C5","C5 is an origin of superior oblique fibers and an insertion tubercle of the inferior oblique fibers."]]);
q(6,0,"medium",false,"Slide #6","Rectus capitis lateralis inserts on which structure?",[["Jugular process of occipital bone","Correct. It arises from the C1 transverse process, is a small stabilizer, and produces lateral flexion of the head (ventral rami C1–C2)."],["Basilar process of occipital bone","Basilar process is the insertion of rectus capitis anterior."],["Mastoid process","Mastoid process is the sternocleidomastoid insertion."],["Occipital condyle","Occipital condyle is an articular surface with the atlas, not a muscle insertion for this muscle."]]);
q(6,0,"easy",true,"Slide #8","Which nerve innervates the sternocleidomastoid?",[["Spinal accessory nerve","Correct. This is CN XI; it also supplies trapezius and pierces SCM."],["Phrenic nerve","Phrenic nerve (C3–C5) supplies the diaphragm."],["Dorsal scapular nerve","Dorsal scapular nerve supplies rhomboids and levator scapulae."],["Long thoracic nerve","Long thoracic nerve supplies serratus anterior."]]);
q(6,0,"hard",true,"Slide #8","Sternocleidomastoid contraction on one side rotates the head toward the opposite side because its attachments are:",[["Lateral on the skull and medial on the sternum","Correct. The mastoid is lateral and the sternoclavicular origins are medial, so unilateral pull turns the face to the contralateral side."],["Medial on the skull and lateral on the clavicle","Reverses the actual positions; the mastoid insertion is lateral."],["Posterior on the skull and anterior on the vertebrae","SCM has no vertebral attachments."],["Superior on the skull and inferior on the first rib","SCM does not attach to rib 1; scalenes do."]]);
q(6,0,"medium",true,"Slide #10","Which vascular structure passes between the anterior and middle scalenes?",[["Subclavian artery","Correct. The artery (with the brachial plexus) exits between them; its tunica media resists compression."],["Subclavian vein","The vein stays anterior to anterior scalene and is not squeezed in the interscalene gap."],["Common carotid artery","The carotid ascends in the carotid sheath, not through the scalene gap."],["Internal jugular vein","Internal jugular vein runs in the carotid sheath anterior to the scalenes."]]);
q(6,0,"easy",false,"Slide #12","Posterior scalene inserts on which rib?",[["Rib 2","Correct. It arises from C4–C6 transverse processes (ventral rami C6–C8) and elevates rib 2."],["Rib 1","Anterior and middle scalenes insert on rib 1."],["Rib 3","Rib 3 is not a scalene insertion."],["Rib 12","Rib 12 receives quadratus lumborum."]]);
// ---------- WEEK 7 ----------
q(7,1,"easy",true,"Slide #24","The diaphragm is innervated by which nerve?",[["Phrenic nerve","Correct. Phrenic nerve (C3–C5) is the only named nerve among the costal/respiratory muscles."],["Intercostal nerve","Intercostal nerves supply the intercostals, subcostalis and transversus thoracis."],["Thoracodorsal nerve","Thoracodorsal nerve supplies latissimus dorsi."],["Subcostal nerve","Subcostal nerve supplies abdominal wall muscles."]]);
q(7,1,"medium",true,"Slide #19","Which intercostal layer can be viewed from both external and internal surfaces of the thoracic wall?",[["Internal intercostals","Correct. They depress ribs during forced exhalation and are visible from either side."],["External intercostals","External intercostals are seen only from the outer surface."],["Innermost intercostals","Innermost layer is seen only from inside the thoracic cage."],["Transversus thoracis","Transversus thoracis lies on the posterior surface of the sternum and is seen only internally."]]);
q(7,1,"medium",false,"Slide #23","Levator costarum brevis and longus are innervated by:",[["Dorsal rami C8–T11","Correct. They arise from transverse processes C7–T11 and elevate ribs during forced inspiration."],["Intercostal nerves","Intercostal nerves supply the intercostal layers, not levator costarum."],["Ventral rami C1–C3","Ventral rami C1–C3 supply longus capitis."],["Phrenic nerve C3–C5","Phrenic nerve supplies the diaphragm."]]);
q(7,3,"easy",true,"Transcript #7.1","A positive Trendelenburg sign indicates weakness of which muscle?",[["Gluteus medius","Correct. It keeps the pelvis level in single-leg stance (superior gluteal nerve) and abducts and medially rotates the thigh."],["Gluteus maximus","Gluteus maximus extends the hip and is supplied by the inferior gluteal nerve."],["Piriformis","Piriformis laterally rotates the thigh."],["Quadratus femoris","Quadratus femoris laterally rotates the thigh."]]);
q(7,3,"hard",true,"Transcript #7.2","The inferior gemellus shares its innervation with which muscle?",[["Quadratus femoris","Correct. Both are supplied by the nerve to quadratus femoris."],["Obturator externus","Obturator externus is supplied by the obturator nerve."],["Piriformis","Piriformis has its own nerve to piriformis (S1–S2)."],["Gluteus minimus","Gluteus minimus is supplied by the superior gluteal nerve."]]);
q(7,3,"medium",true,"Transcript #7.2","Which hip rotator is supplied by the obturator nerve rather than a nerve from the sacral plexus?",[["Obturator externus","Correct. The obturator nerve (lumbar plexus) pierces it, and it is the only rotator visible from the anterior pelvis."],["Obturator internus","Obturator internus has its own nerve, shared with the superior gemellus."],["Superior gemellus","Superior gemellus shares the nerve to obturator internus."],["Inferior gemellus","Inferior gemellus shares the nerve to quadratus femoris."]]);
q(7,3,"medium",false,"Transcript #7.2","Which nerve enters the gluteal region through the greater sciatic foramen superior to piriformis?",[["Superior gluteal nerve","Correct. It supplies gluteus medius, gluteus minimus and tensor fasciae latae (L4–S1)."],["Inferior gluteal nerve","Inferior gluteal nerve exits inferior to piriformis and supplies gluteus maximus."],["Sciatic nerve","Sciatic nerve typically emerges inferior to piriformis."],["Nerve to quadratus femoris","This nerve exits inferior to piriformis."]]);
q(7,4,"easy",true,"Transcript #7.2","Which quadriceps muscle also crosses the hip joint?",[["Rectus femoris","Correct. It originates at the anterior inferior iliac spine, flexes the hip and extends the knee."],["Vastus lateralis","Vastus lateralis crosses only the knee."],["Vastus intermedius","Vastus intermedius crosses only the knee."],["Vastus medialis","Vastus medialis crosses only the knee."]]);
q(7,4,"hard",true,"Transcript #7.2","The hamstring part of adductor magnus is innervated by which nerve?",[["Tibial nerve","Correct. It arises from the ischial tuberosity and extends the hip via the tibial portion of the sciatic nerve; the adductor part gets the obturator nerve."],["Obturator nerve","Obturator nerve supplies the adductor part, not the hamstring part."],["Femoral nerve","Femoral nerve supplies the anterior thigh muscles."],["Common fibular nerve","Common fibular nerve supplies the short head of biceps femoris."]]);
q(7,4,"medium",true,"Transcript #7.2","The femoral artery becomes which artery after passing through the adductor hiatus?",[["Popliteal artery","Correct. The femoral vessels enter the adductor canal and exit the hiatus as popliteal vessels."],["Deep femoral artery","Deep femoral artery branches in the femoral triangle and does not continue through the hiatus."],["Posterior tibial artery","Posterior tibial artery arises distal to the popliteal artery."],["Medial circumflex femoral artery","Medial circumflex femoral artery is a branch proximal to the canal."]]);
q(7,4,"hard",true,"Transcript #7.2","Which set of muscles forms the pes anserinus?",[["Sartorius, gracilis, semitendinosus","Correct. All three insert on the medial surface of the tibia."],["Sartorius, gracilis, semimembranosus","Semimembranosus inserts on the medial tibial condyle, not the pes anserinus."],["Sartorius, adductor longus, semitendinosus","Adductor longus inserts on the linea aspera."],["Rectus femoris, gracilis, semitendinosus","Rectus femoris inserts through the quadriceps tendon."]]);
q(7,4,"medium",false,"Transcript #7.2","Which muscle forms the medial border of the femoral triangle?",[["Adductor longus","Correct. The triangle is bounded by the inguinal ligament, sartorius and adductor longus."],["Gracilis","Gracilis is the most medial thigh muscle but not a triangle border."],["Pectineus","Pectineus forms part of the floor."],["Adductor magnus","Adductor magnus lies deeper and posterior."]]);
// ---------- WEEK 8 ----------
q(8,2,"easy",false,"Slide #27","Psoas minor inserts on which structure?",[["Iliopubic eminence","Correct. It does not cross the hip joint, so it assists trunk flexion only (ventral rami L1)."],["Lesser trochanter","Lesser trochanter receives psoas major and iliacus."],["Greater trochanter","Greater trochanter receives gluteal muscles and rotators."],["Pectineal line","Pectineal line receives pectineus and adductor brevis."]]);
q(8,2,"easy",false,"Slide #28","Which nerve innervates iliacus?",[["Femoral nerve","Correct. Iliacus flexes the hip and arises from the iliac fossa."],["Obturator nerve","Obturator nerve supplies the adductors."],["Genitofemoral nerve","Genitofemoral nerve is sensory with a cremasteric motor branch."],["Lateral femoral cutaneous nerve","Lateral femoral cutaneous nerve is purely sensory."]]);
q(8,2,"medium",true,"Slide #29","Which posterior abdominal wall muscle may help stabilize rib 12 during respiration?",[["Quadratus lumborum","Correct. It runs from the iliac crest and iliolumbar ligament to L1–L5 transverse processes and rib 12."],["Iliacus","Iliacus has no rib attachment."],["Psoas minor","Psoas minor attaches to the vertebrae and pubis."],["Psoas major","Psoas major attaches to vertebrae and the femur."]]);
q(8,2,"medium",true,"Slide #35","Meralgia paresthetica from tight clothing involves which nerve?",[["Lateral femoral cutaneous nerve","Correct. It carries sensation from the lateral thigh (L2–L3)."],["Femoral nerve","Femoral nerve also has motor roles and is not the usual site of tight-pants numbness."],["Genitofemoral nerve","Genitofemoral nerve supplies the femoral triangle skin and genital branches."],["Ilioinguinal nerve","Ilioinguinal nerve supplies the groin and anterior genitals."]]);
q(8,2,"hard",false,"Transcript #8.1","Which lumbar plexus nerve pierces and runs on the anterior surface of psoas major?",[["Genitofemoral nerve","Correct. It arises from L1–L2 and runs on psoas major (it would not run on a psoas minor, which is absent in some people)."],["Iliohypogastric nerve","Iliohypogastric nerve (L1) runs along quadratus lumborum."],["Ilioinguinal nerve","Ilioinguinal nerve (L1) lies just inferior to iliohypogastric."],["Obturator nerve","Obturator nerve passes medial to psoas to the obturator foramen."]]);
q(8,5,"medium",true,"Transcript #8.2","Which muscle belongs to the anterior compartment although it lies lateral on the foot?",[["Fibularis tertius","Correct. It is supplied by the deep fibular nerve, dorsiflexes the ankle and aids eversion."],["Fibularis longus","Lateral compartment (superficial fibular nerve)."],["Fibularis brevis","Lateral compartment (superficial fibular nerve)."],["Plantaris","Plantaris is in the superficial posterior compartment."]]);
q(8,5,"medium",true,"Transcript #8.2","Which tendon lies closest to the medial malleolus in the Tom, Dick and Harry order?",[["Tibialis posterior","Correct. Tom is tibialis posterior, then flexor digitorum longus, then artery and nerve, then flexor hallucis longus."],["Flexor digitorum longus","Dick lies just posterior to Tom."],["Flexor hallucis longus","Harry is the most posterior of the group."],["Fibularis longus","Fibularis longus is lateral, behind the lateral malleolus."]]);
q(8,5,"medium",true,"Transcript #8.2","Which muscle is selectively stretched when the knee is flexed during a calf stretch?",[["Soleus","Correct. Soleus does not cross the knee, so it is targeted with knee flexion."],["Gastrocnemius","Gastrocnemius crosses the knee and is stretched with the knee extended."],["Plantaris","Plantaris crosses the knee and assists gastrocnemius."],["Popliteus","Popliteus acts on the knee and is not a calf stretch target."]]);
q(8,5,"easy",false,"Transcript #8.2","Quadratus plantae belongs to which plantar layer?",[["Layer 2","Correct. Layer 2 contains quadratus plantae, flexor digitorum longus tendons and the lumbricals."],["Layer 1","Layer 1 has abductor hallucis, flexor digitorum brevis and abductor digiti minimi."],["Layer 3","Layer 3 has flexor hallucis brevis, adductor hallucis and flexor digiti minimi."],["Layer 4","Layer 4 contains the interossei."]]);
q(8,5,"hard",false,"Transcript #8.2","Which nerve supplies the first lumbrical of the foot?",[["Medial plantar nerve","Correct. The remaining lumbricals (2–4) are supplied by the lateral plantar nerve."],["Lateral plantar nerve","It supplies lumbricals 2–4, not the first."],["Deep fibular nerve","Deep fibular nerve supplies the dorsal foot muscles."],["Superficial fibular nerve","Superficial fibular nerve supplies the lateral leg and dorsal foot skin."]]);
// ---------- WEEK 6 CUMULATIVE REVIEW (upper extremity; instructor-emphasized items) ----------
q(6,6,"easy",true,"Transcript #5.2","Which rotator cuff tendon is most commonly ruptured?",[["Supraspinatus","Correct. It supports the top of the humeral head and bears much of the arm's load; rotator cuff injuries are also more frequent in older adults and perimenopausal/menopausal women."],["Infraspinatus","Infraspinatus is a lateral rotator and is less commonly ruptured."],["Teres minor","Teres minor is a small lateral rotator supplied by the axillary nerve."],["Subscapularis","Subscapularis medially rotates the humerus and is less commonly ruptured."]]);
q(6,6,"medium",true,"Transcript #5.2","Which rotator cuff muscle medially rotates the humerus?",[["Subscapularis","Correct. It occupies the subscapular fossa, inserts on the lesser tubercle, and is supplied by the upper and lower subscapular nerves."],["Infraspinatus","Infraspinatus laterally rotates the humerus."],["Teres minor","Teres minor laterally rotates the humerus."],["Supraspinatus","Supraspinatus abducts the humerus."]]);
q(6,6,"medium",true,"Transcript #5.2","Which nerve supplies both pectoralis major and pectoralis minor?",[["Medial pectoral nerve","Correct. It supplies both muscles (C8–T1). The lateral pectoral nerve supplies only pectoralis major, specifically the clavicular head."],["Lateral pectoral nerve","Lateral pectoral nerve reaches pectoralis major only."],["Long thoracic nerve","Long thoracic nerve supplies serratus anterior."],["Nerve to subclavius","This nerve supplies subclavius only."]]);
q(6,6,"medium",true,"Transcript #4.1","Pronounced winging of the entire medial border of the scapula indicates injury to which nerve?",[["Long thoracic nerve","Correct. It supplies serratus anterior (C5–C7), the protractor that holds the scapula against the thoracic wall."],["Spinal accessory nerve","Lesion causes shoulder drooping and only mild inferior winging from trapezius weakness."],["Dorsal scapular nerve","Dorsal scapular nerve supplies rhomboids and levator scapulae."],["Thoracodorsal nerve","Thoracodorsal nerve supplies latissimus dorsi."]]);
q(6,6,"medium",true,"Transcript #5.2","The long head of biceps brachii originates from which structure?",[["Supraglenoid tubercle","Correct. The long head is lateral and its tendon travels in the intertubercular groove; the short head arises from the coracoid process."],["Coracoid process","Coracoid process gives origin to the short head and coracobrachialis."],["Infraglenoid tubercle","Infraglenoid tubercle is the origin of the long head of triceps."],["Radial tuberosity","Radial tuberosity is the biceps insertion."]]);
q(6,6,"medium",true,"Transcript #5.2","Which term describes degeneration of tendon collagen without an inflammatory response?",[["Tendinosis","Correct. It follows poor vascularization, chronic overuse or aging."],["Tendonitis","Tendonitis is inflammation from microtears."],["Rupture","Rupture is complete tendon failure, often after prior tendonitis."],["Dislocation","Dislocation is displacement from the intertubercular sulcus."]]);
q(6,6,"medium",false,"Transcript #4.1","Popeye deformity results from rupture of which tendon?",[["Long head of biceps","Correct. It typically occurs after tendonitis in people over 35, with a snap and a bunched muscle belly."],["Short head of biceps","Short head rupture is not the classic cause."],["Triceps brachii","Triceps rupture does not form a Popeye deformity."],["Brachialis","Brachialis lies deep to biceps and is not the classic site."]]);
q(6,7,"easy",true,"Transcript #5.2","Which anterior forearm flexor of the wrist is innervated by the ulnar nerve?",[["Flexor carpi ulnaris","Correct. Along with the medial half of flexor digitorum profundus, it is one of only two ulnar-supplied anterior forearm muscles."],["Flexor carpi radialis","Flexor carpi radialis is a median nerve muscle."],["Palmaris longus","Palmaris longus is supplied by the median nerve."],["Pronator teres","Pronator teres is a median nerve muscle."]]);
q(6,7,"medium",true,"Transcript #5.2","Which forearm muscle inserts on the bases of the distal phalanges of digits 2–5?",[["Flexor digitorum profundus","Correct. It reaches the fingertips; the lateral half is median and the medial half is ulnar."],["Flexor digitorum superficialis","Superficialis inserts on the middle phalanges."],["Flexor pollicis longus","Flexor pollicis longus inserts on the thumb's distal phalanx."],["Pronator quadratus","Pronator quadratus attaches ulna to radius and does not reach the digits."]]);
q(6,7,"easy",true,"Transcript #5.2","Which artery is palpable in the anatomical snuffbox?",[["Radial artery","Correct. The box is bordered by abductor pollicis longus and extensor pollicis brevis tendons laterally and the extensor pollicis longus tendon medially."],["Ulnar artery","Ulnar artery lies on the medial side of the wrist."],["Anterior interosseous artery","This artery lies on the interosseous membrane."],["Deep palmar arch","Deep palmar arch is within the palm."]]);
q(6,7,"easy",true,"Transcript #5.2","How many tendons pass through the carpal tunnel with the median nerve?",[["Nine","Correct. Four flexor digitorum superficialis, four flexor digitorum profundus and one flexor pollicis longus."],["Eight","Eight omits flexor pollicis longus."],["Ten","Ten overcounts; flexor carpi radialis and palmaris longus do not use the tunnel."],["Five","Five counts only the profundus and thumb tendons."]]);
q(6,7,"medium",true,"Transcript #5.2","The ulnar nerve and artery enter the hand through which tunnel?",[["Ulnar tunnel","Correct. Also called the tunnel of Guyon, it lies superficial to the flexor retinaculum between the pisiform and hook of hamate."],["Carpal tunnel","Carpal tunnel transmits the median nerve and nine tendons."],["Cubital tunnel","Cubital tunnel is at the elbow."],["Radial tunnel","Radial tunnel is in the proximal forearm."]]);
q(6,7,"medium",true,"Transcript #5.2","Lumbricals 3 and 4 are innervated by which nerve branch?",[["Deep branch of ulnar nerve","Correct. Lumbricals 1 and 2 are supplied by the median nerve, matching the flexor digitorum profundus split."],["Median nerve","Median nerve supplies lumbricals 1 and 2."],["Recurrent branch of median nerve","Recurrent branch supplies the thenar muscles."],["Superficial branch of ulnar nerve","Superficial branch supplies palmaris brevis and cutaneous areas."]]);
q(6,7,"medium",false,"Transcript #5.2","Which muscle is supplied by the recurrent branch of the median nerve?",[["Opponens pollicis","Correct. All thenar muscles share this supply."],["Adductor pollicis","Adductor pollicis is supplied by the deep branch of the ulnar nerve."],["Opponens digiti minimi","Hypothenar muscles are ulnar nerve muscles."],["Palmaris brevis","Palmaris brevis is supplied by the superficial branch of the ulnar nerve."]]);
q(6,7,"medium",true,"Transcript #4.1","Deep radial nerve entrapment occurs at which muscle?",[["Supinator","Correct. The deep radial nerve passes under the supinator; this is the site of entrapment."],["Pronator teres","Pronator teres is the site of median nerve entrapment."],["Brachioradialis","Brachioradialis lies lateral and is not the usual entrapment site."],["Anconeus","Anconeus lies near the olecranon."]]);
q(6,8,"easy",true,"Transcript #5.2","Which brachial plexus cord gives rise to the axillary and radial nerves?",[["Posterior cord","Correct. The lateral cord gives the musculocutaneous nerve and half the median nerve; the medial cord gives the ulnar nerve and the other half of the median."],["Lateral cord","Lateral cord supplies the musculocutaneous nerve."],["Medial cord","Medial cord supplies the ulnar nerve."],["Inferior trunk","Trunks are proximal to the cords and are not tested here."]]);
q(6,8,"medium",true,"Transcript #5.2","Which nerve arises from C5–C7 and pierces coracobrachialis?",[["Musculocutaneous nerve","Correct. It supplies coracobrachialis, biceps brachii and brachialis, then continues as the lateral antebrachial cutaneous nerve."],["Median nerve","Median nerve arises from C6–T1."],["Radial nerve","Radial nerve arises from C5–T1."],["Ulnar nerve","Ulnar nerve arises from C8–T1."]]);
q(6,8,"hard",true,"Transcript #4.1","Which nerve and artery pass together through the quadrangular space?",[["Axillary nerve and posterior circumflex humeral artery","Correct. Borders are teres minor, teres major, the humerus and the long head of triceps."],["Radial nerve and deep brachial artery","These travel in the radial groove, not the quadrangular space."],["Axillary nerve and circumflex scapular artery","Circumflex scapular artery uses the triangular space."],["Suprascapular nerve and subscapular artery","Neither passes through the quadrangular space."]]);
q(6,8,"medium",true,"Transcript #4.1","Which artery passes through the triangular space?",[["Circumflex scapular artery","Correct. Borders are teres minor, teres major and the long head of triceps."],["Posterior circumflex humeral artery","This artery uses the quadrangular space."],["Deep brachial artery","Deep brachial artery accompanies the radial nerve in the radial groove."],["Thoracodorsal artery","Thoracodorsal artery supplies latissimus dorsi."]]);
q(6,8,"medium",false,"Transcript #5.2","Which artery travels with the radial nerve in the radial groove of the humerus?",[["Deep brachial artery","Correct. It is also called the profunda brachii and branches off the brachial artery."],["Brachial artery","Brachial artery runs with the median nerve in the medial arm."],["Posterior circumflex humeral artery","This artery runs with the axillary nerve."],["Radial recurrent artery","This artery arises in the forearm."]]);
q(6,8,"hard",true,"Transcript #5.2","Which axillary artery branch has the greatest diameter but the shortest length?",[["Subscapular artery","Correct. It divides into the circumflex scapular and thoracodorsal arteries."],["Posterior circumflex humeral artery","This is larger than the anterior circumflex humeral but not the largest."],["Anterior circumflex humeral artery","Smaller than the posterior circumflex humeral."],["Lateral thoracic artery","Not the widest branch."]]);
q(6,9,"easy",true,"Transcript #4.1","Which elbow ligament encircles the radial head and permits pronation and supination?",[["Annular ligament","Correct. The collaterals cross the joint to resist side-to-side forces, while the annular ligament holds the radial head against the ulna."],["Radial collateral ligament","It blends with the annular ligament and resists medial-directed stress."],["Ulnar collateral ligament","It crosses the medial joint line."],["Interosseous membrane","It joins the radius and ulna along the shafts."]]);
q(6,9,"medium",true,"Transcript #4.1","Which elbow ligament is triangular with anterior, posterior and oblique bands?",[["Ulnar collateral ligament","Correct. It runs from the medial epicondyle to the olecranon and coronoid; the anterior band is strongest and the posterior band weakest."],["Radial collateral ligament","This ligament is fan-like, starting at a point on the lateral epicondyle."],["Annular ligament","Annular ligament wraps the radial head."],["Quadrate ligament","Quadrate ligament is a small ligament below the annular ligament."]]);
q(6,9,"easy",true,"Transcript #4.1","Repetitive strain of the common extensor tendon causing lateral epicondyle pain is called:",[["Lateral epicondylitis","Correct. It is also known as tennis elbow; medial epicondylitis involves the flexors and pronator teres."],["Medial epicondylitis","Medial epicondylitis affects the common flexor origin."],["Olecranon bursitis","Olecranon bursitis causes swelling over the olecranon."],["Cubital tunnel syndrome","Cubital tunnel syndrome is ulnar nerve compression."]]);
q(6,9,"hard",true,"Transcript #4.1","In skeletally immature throwers, Little League elbow primarily involves which structure?",[["Medial epicondyle growth plate","Correct. Throwing pulls on the muscles attached to the growth plate; without a growth plate, the collateral ligaments are stressed instead."],["Ulnar collateral ligament","This is the typical injury site in adult pitchers."],["Annular ligament","Annular ligament is not the main site."],["Olecranon bursa","Bursitis is not the mechanism."]]);
q(6,9,"medium",true,"Transcript #4.1","Tinel sign over the proximal forearm plus pain on resisted pronation suggests:",[["Pronator teres syndrome","Correct. The median nerve is compressed by pronator teres; the same nerve at the wrist produces carpal tunnel syndrome."],["Carpal tunnel syndrome","Carpal tunnel signs are produced with wrist tapping and Phalen tests."],["Thoracic outlet syndrome","TOS involves the brachial plexus and subclavian vessels."],["Cubital tunnel syndrome","Cubital tunnel involves the ulnar nerve."]]);
q(6,9,"easy",true,"Transcript #4.1","Which is the most common type of thoracic outlet syndrome?",[["Neurogenic","Correct. It causes pain, tingling and numbness down the arm; arterial TOS is the least common."],["Venous","Venous TOS causes swelling and bluish discoloration."],["Arterial","Arterial TOS causes pallor and coldness."],["Lymphatic","Lymphatic TOS is not a recognized subtype."]]);
questionBank.sort((a,b)=>a.week-b.week||a.id-b.id);
/* ---------- APP ---------- */
let active=[],answers={},idx=0,oneByOne=false;
const $=id=>document.getElementById(id);
const wk=$("weekFilter"),sb=$("subjectFilter");
function initFilters(){wk.innerHTML='<option value="all">All Weeks</option>'+[...new Set(questionBank.map(x=>x.week))].sort().map(w=>`<option value="${w}">Week ${w} Only</option>`).join("");
sb.innerHTML='<option value="all">All Modules</option>'+SUBJECTS.map((s,i)=>`<option value="${i}">${s}</option>`).join("");}
function rebuild(){let f=questionBank.filter(x=>(wk.value==="all"||x.week==wk.value)&&(sb.value==="all"||x.subjectIndex==sb.value)&&($("diffFilter").value==="all"||x.difficulty===$("diffFilter").value));
const l=$("lengthFilter").value;if(l!=="all")f=f.slice(0,Math.min(+l,f.length));active=f;idx=0;render();}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}}
function score(){const ids=Object.keys(answers);let c=0;ids.forEach(i=>{if(answers[i].correct)c++;});const t=ids.length;$("scorePill").textContent=`Score: ${c} / ${t} (${t?Math.round(c/t*100):0}%)`;}
function card(x,num){const a=answers[x.id];const L="ABCD";
let h=`<div class="q-card"><div class="q-meta"><span class="badge week">Week ${x.week}</span><span class="badge">${SUBJECTS[x.subjectIndex]}</span><span class="badge">Difficulty: ${x.difficulty.toUpperCase()}</span>${x.priority?'<span class="badge priority">★ High-Yield Board</span>':''}</div><div class="q-stem">${num}. ${x.stem}</div><div class="options-list">`;
x.options.forEach((o,i)=>{let cls="opt-btn";if(a){if(o.correct)cls+=" correct";else if(a.pick===i)cls+=" incorrect";}
h+=`<button class="${cls}" ${a?"disabled":""} onclick="pick(${x.id},${i})">${L[i]}. ${o.text}</button>`;});
h+="</div>";
if(a){h+='<div class="rationale-box">'+x.options.map((o,i)=>`<div class="${o.correct?"is-right":"is-wrong"}"><b>${L[i]} (${o.correct?"Correct":"Incorrect"}):</b> ${o.why}</div>`).join("")+"</div>";}
return h+"</div>";}
function render(){const c=$("quizContainer");if(!active.length){c.innerHTML='<div class="empty">No questions match these filters.</div>';return;}
if(!oneByOne){c.innerHTML=active.map((x,i)=>card(x,i+1)).join("");}
else{c.innerHTML=card(active[idx],idx+1)+`<div class="nav"><button onclick="go(-1)" ${idx===0?"disabled":""}>← Previous</button><span>Question ${idx+1} of ${active.length}</span><button onclick="go(1)" ${idx===active.length-1?"disabled":""}>Next →</button></div>`;}
score();}
function pick(id,i){if(answers[id])return;const x=questionBank.find(q=>q.id===id);answers[id]={pick:i,correct:x.options[i].correct};render();}
function go(d){idx=Math.max(0,Math.min(active.length-1,idx+d));render();}
["weekFilter","subjectFilter","diffFilter","lengthFilter"].forEach(id=>$(id).addEventListener("change",rebuild));
$("viewToggle").onclick=()=>{oneByOne=!oneByOne;$("viewToggle").textContent=oneByOne?"View: One by One":"View: All at Once";render();};
$("shuffleBtn").onclick=()=>{shuffle(questionBank);questionBank.forEach(x=>shuffle(x.options));rebuild();};
$("resetBtn").onclick=()=>{answers={};idx=0;rebuild();};
initFilters();rebuild();
</script></body></html>
