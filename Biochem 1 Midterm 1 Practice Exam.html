<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Biochem 1 Midterm 1 Practice Exam</title>
<style>
:root {
    --bg-main: #0f0f0f;
    --bg-alt: #1a1a1a;
    --card-bg: #1a1a1a;
    --border-color: #282828;
    --accent: #ff9900;
    --accent-hover: #ffad33;
    --text-main: #ffffff;
    --text-muted: #888888;
    --correct-bg: #14532d;
    --correct-border: #22c55e;
    --incorrect-bg: #7f1d1d;
    --incorrect-border: #ef4444;
}
* { box-sizing: border-box; }
body {
    margin: 0;
    background: var(--bg-main);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
}
.sticky-header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 1000;
    background: var(--bg-alt);
    border-bottom: 1px solid var(--border-color);
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
}
.header-title { font-weight: 700; font-size: 1rem; color: var(--text-main); }
.header-title span { color: var(--accent); }
.score-display {
    font-weight: 700;
    color: #000000;
    background: var(--accent);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 0.95rem;
    white-space: nowrap;
}
.container { max-width: 860px; margin: 0 auto; padding: 84px 16px 60px; }
.intro { text-align: center; margin-bottom: 18px; }
.intro h1 { margin: 0 0 6px; font-size: 1.6rem; }
.intro p { margin: 0; color: var(--text-muted); font-size: 0.95rem; }
.mode-container { display: flex; justify-content: center; gap: 10px; margin: 18px 0 24px; }
.mode-btn {
    background: #222222;
    color: #ffffff;
    border: 1px solid var(--border-color);
    padding: 10px 24px;
    font-size: 0.95rem;
    font-weight: 700;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    transition: background-color 0.2s, color 0.2s;
}
.mode-btn.active { background: var(--accent); color: #000000; border-color: var(--accent); }
.question-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
}
.q-badge-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.q-badge {
    display: inline-block;
    background: var(--accent);
    color: #000000;
    font-weight: 700;
    font-size: 0.8rem;
    padding: 3px 10px;
    border-radius: 4px;
}
.q-badge.muted { background: #222222; color: var(--text-muted); border: 1px solid var(--border-color); }
.q-stem { font-size: 1.05rem; font-weight: 600; margin-bottom: 14px; }
.options { display: flex; flex-direction: column; gap: 10px; }
.option-btn {
    text-align: left;
    background: #222222;
    color: var(--text-main);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 12px 14px;
    font-size: 0.98rem;
    cursor: pointer;
    font-family: inherit;
    transition: border-color 0.15s, background-color 0.15s;
}
.option-btn:hover:not(:disabled) { border-color: var(--accent); }
.option-btn:disabled { cursor: default; }
.option-btn .letter { color: var(--accent); font-weight: 700; margin-right: 8px; }
.option-btn.correct { background: var(--correct-bg); border-color: var(--correct-border); }
.option-btn.incorrect { background: var(--incorrect-bg); border-color: var(--incorrect-border); }
.option-btn.correct .letter, .option-btn.incorrect .letter { color: #ffffff; }
.explanation {
    margin-top: 14px;
    background: #141414;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 14px 16px;
}
.status-banner { font-weight: 800; font-size: 1.05rem; margin-bottom: 6px; }
.status-banner.good { color: var(--correct-border); }
.status-banner.bad { color: var(--incorrect-border); }
.ref-line { color: var(--text-muted); font-size: 0.88rem; margin-bottom: 10px; }
.breakdown { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.breakdown li { font-size: 0.92rem; padding-left: 10px; border-left: 3px solid var(--border-color); }
.breakdown li.is-correct { border-left-color: var(--correct-border); }
.breakdown li.is-wrong { border-left-color: var(--incorrect-border); }
.breakdown .tag { font-weight: 700; }
.breakdown li.is-correct .tag { color: var(--correct-border); }
.breakdown li.is-wrong .tag { color: var(--incorrect-border); }
.summary-card {
    background: var(--card-bg);
    border: 1px solid var(--accent);
    border-radius: 10px;
    padding: 28px 20px;
    text-align: center;
    margin-top: 10px;
}
.summary-title { font-size: 1.5rem; font-weight: 800; color: var(--accent); margin-bottom: 8px; }
.summary-score { font-size: 2rem; font-weight: 800; margin-bottom: 6px; }
.summary-msg { color: var(--text-muted); margin-bottom: 18px; font-size: 1.02rem; }
.retake-btn {
    background-color: var(--accent);
    color: #000000;
    border: 1px solid var(--accent);
    padding: 12px 28px;
    font-size: 1rem;
    font-weight: 700;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    margin: 4px;
    display: inline-block;
    text-decoration: none;
    transition: background-color 0.2s, color 0.2s;
}
.retake-btn:hover {
    background-color: var(--accent-hover);
    border-color: var(--accent-hover);
}
.retake-btn.hub-btn {
    background-color: #222222;
    color: #ffffff;
    border: 1px solid var(--accent);
}
.retake-btn.hub-btn:hover {
    background-color: var(--accent);
    color: #000000;
}
.hidden { display: none !important; }
.wrong-popup {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 2000;
    pointer-events: none;
    display: flex;
    justify-content: center;
    align-items: center;
    animation: popIn 0.15s ease-out;
}
.wrong-popup img {
    max-width: 80vw;
    max-height: 55vh;
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
    border: 3px solid var(--incorrect-border);
    display: block;
    object-fit: contain;
    background: #111;
}
@keyframes popIn {
    from { transform: translate(-50%, -50%) scale(0.85); opacity: 0; }
    to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
}
@media (max-width: 600px) {
    .header-title { font-size: 0.85rem; }
    .score-display { font-size: 0.82rem; padding: 5px 10px; }
    .q-stem { font-size: 1rem; }
}
</style>
</head>

<script>
const quizData = [
    // ===================== QUARTER 1 — WEEK 1 =====================
    {
        id: 1,
        quarter: 1,
        slideRef: "Class 1 Notes",
        stem: "A reaction with a negative ΔG is _______ and forms products that are _______.",
        options: [
            { text: "exergonic; lower in energy and more stable", correct: true, why: "Negative ΔG means energy is released (EXO = energy OUT), so products sit at a lower free energy and lower free energy equals greater stability. [Class 1 Notes]" },
            { text: "endergonic; higher in energy and less stable", correct: false, why: "This describes a positive ΔG: energy is put in and stored, raising the products to a higher, less stable state. The sign is inverted. [Class 1 Notes]" },
            { text: "exergonic; higher in energy and less stable", correct: false, why: "The label is right but the energy direction is wrong. An exergonic reaction releases energy, so its products end lower, not higher. [Class 1 Notes]" },
            { text: "endergonic; lower in energy and more stable", correct: false, why: "Endergonic reactions require energy input and give higher-energy products. A drop to lower energy is exergonic. [Class 1 Notes]" }
        ]
    },
    {
        id: 2,
        quarter: 1,
        slideRef: "Class 2 Notes",
        stem: "Which property of a reversible reaction does an enzyme change?",
        options: [
            { text: "The activation energy and therefore the reaction rate", correct: true, why: "Enzymes provide an alternate pathway with a lower activation-energy barrier. This speeds both the forward and reverse reactions, which is a kinetic effect. [Class 2 Notes]" },
            { text: "The free-energy change (ΔG) between reactants and products", correct: false, why: "ΔG is a thermodynamic property of the start and end states. Enzymes cannot change it. [Class 2 Notes]" },
            { text: "The equilibrium constant and position of equilibrium", correct: false, why: "Keq is set by ΔG, so it stays the same. Enzymes only change how fast equilibrium is reached. [Class 2 Notes]" },
            { text: "The relative stability of the reactants and products", correct: false, why: "Relative stability is thermodynamics (ΔG). Enzymes change kinetics, not which state is more stable. [Class 2 Notes]" }
        ]
    },
    {

        options: [
            { text: "Hydrogen bonds between neighboring water molecules", correct: true, why: "Vaporization frees each molecule from the hydrogen-bonded liquid network, which is an intermolecular change. The H₂O molecule stays intact. [Class 1 Notes]" },
            { text: "Covalent O–H bonds inside each water molecule", correct: false, why: "A phase change does not break the covalent O–H bonds. Vapor is still H₂O, just no longer linked to other water molecules. [Class 1 Notes]" },
            { text: "Ionic bonds between H⁺ and OH⁻ within the liquid", correct: false, why: "Liquid water is not held together by H⁺–OH⁻ ionic bonds. Phase changes disrupt hydrogen bonding between intact molecules. [Class 1 Notes]" },
            { text: "Temporary dipoles only, leaving hydrogen bonds intact", correct: false, why: "This has it backward. Hydrogen bonds are the interactions that must be overcome to vaporize water. [Class 1 Notes]" }
        ]
    },
    {
        id: 4,
        quarter: 1,
        slideRef: "Class 2 Notes",
        stem: "In the hydration cage around an H⁺ ion, water molecules point their _______ toward the ion.",
        options: [
            { text: "oxygen ends, which carry partial negative charge", correct: true, why: "Water's dipole lets the electronegative oxygen side face positive ions such as H⁺. The hydrogen side faces negative ions. [Class 2 Notes]" },
            { text: "hydrogen ends, which carry partial positive charge", correct: false, why: "The partially positive hydrogen side is repelled by a cation. It points toward negative ions instead. [Class 2 Notes]" },
            { text: "oxygen and hydrogen ends in equal numbers", correct: false, why: "Orientation is not random or balanced. Electrostatic attraction lines up the negative oxygen side toward the cation. [Class 2 Notes]" },
            { text: "nonpolar faces, since water lacks a dipole", correct: false, why: "Water has a permanent dipole. That dipole is what lets it form a solvation cage around ions. [Class 2 Notes]" }
        ]
    },
    {
        id: 5,
        quarter: 1,
        slideRef: "Class 2 Notes",
        stem: "Resonance in acetate gives each carbon–oxygen bond an average bond order of about:",
        options: [
            { text: "1.0", correct: false, why: "A bond order of 1.0 would mean pure single bonds. Resonance shares double-bond character across both C–O bonds. [Class 2 Notes]" },
            { text: "1.5", correct: true, why: "Two equivalent Lewis structures spread one π bond over two C–O bonds, giving an average bond order of about 1.5. [Class 2 Notes]" },
            { text: "2.0", correct: false, why: "A bond order of 2.0 would mean both bonds are full double bonds. Acetate has only one π bond shared across both C–O bonds. [Class 2 Notes]" },
            { text: "3.0", correct: false, why: "A triple bond (such as N₂) has one σ and two π bonds. Acetate's C–O bonds have nothing like that. [Class 2 Notes]" }
        ]
    },
    {
        id: 6,
        quarter: 1,
        slideRef: "Class 2 Notes",
        stem: "Resonance stabilization of a conjugate base makes its parent acid:",
        options: [
            { text: "stronger, with a lower pKa", correct: true, why: "A more stable conjugate base makes losing H⁺ more favorable. That strengthens the acid, and a stronger acid has a lower pKa. [Class 2 Notes]" },
            { text: "weaker, with a higher pKa", correct: false, why: "Stabilizing the base favors H⁺ release, which strengthens the acid. This is the opposite direction. [Class 2 Notes]" },
            { text: "stronger, with a higher pKa", correct: false, why: "The acid does get stronger, but a stronger acid has a lower pKa. 'Higher pKa' contradicts it. [Class 2 Notes]" },
            { text: "unchanged in strength and pKa", correct: false, why: "Conjugate-base stability directly controls acid strength. That is why acetate resonance was taught. [Class 2 Notes]" }
        ]
    },
    {
        id: 7,
        quarter: 1,
        slideRef: "Class 3 Notes",
        stem: "Stomach fluid at pH 2 contains how many times more H⁺ than a fluid at pH 5?",
        options: [
            { text: "3 times", correct: false, why: "This treats pH as a linear scale. Each pH unit is a 10-fold change, so 3 units is 10³, not 3. [Class 3 Notes]" },
            { text: "30 times", correct: false, why: "This multiplies 10 by the difference instead of raising 10 to the difference. The factor is 10³. [Class 3 Notes]" },
            { text: "100 times", correct: false, why: "100-fold is a 2-unit difference. pH 2 versus pH 5 is a 3-unit difference. [Class 3 Notes]" },
            { text: "1,000 times", correct: true, why: "pH = −log[H⁺], so a 3-unit difference equals 10³ = 1,000-fold more H⁺ at the lower pH. [Class 3 Notes]" }
        ]
    },
    {
        id: 8,
        quarter: 1,
        slideRef: "Class 3 Notes",
        stem: "At blood pH 7.4, with a carbonic acid pKa of 6.4, the ratio of HCO₃⁻ to H₂CO₃ is about:",
        options: [
            { text: "1 : 10", correct: false, why: "This inverts the ratio. With pH above pKa, the conjugate base (bicarbonate) is the more concentrated form. [Class 3 Notes]" },
            { text: "1 : 1", correct: false, why: "A 1:1 ratio happens only when pH = pKa. Here the pH is one unit higher. [Class 3 Notes]" },
            { text: "10 : 1", correct: true, why: "Henderson–Hasselbalch: base/acid = 10^(7.4 − 6.4) = 10¹, so about 10 bicarbonate per 1 carbonic acid. [Class 3 Notes]" },
            { text: "100 : 1", correct: false, why: "100:1 needs a 2-unit pH–pKa difference. The difference here is only 1 unit. [Class 3 Notes]" }
        ]
    },
    {
        id: 9,
        quarter: 1,
        slideRef: "Lecture 4.2",
        stem: "In the blood buffer system, HCO₃⁻ is the _______ and is named _______.",
        options: [
            { text: "conjugate base; bicarbonate", correct: true, why: "HCO₃⁻ is what remains after carbonic acid releases H⁺, which makes it the conjugate base. Its name is bicarbonate. [Lecture 4.2]" },
            { text: "conjugate acid; bicarbonate", correct: false, why: "The name is correct but the role is reversed. H₂CO₃ is the conjugate acid, and HCO₃⁻ is the base left after H⁺ leaves. [Lecture 4.2]" },
            { text: "conjugate base; carbonic acid", correct: false, why: "Carbonic acid is H₂CO₃, the protonated form. HCO₃⁻ is bicarbonate. [Lecture 4.2]" },
            { text: "conjugate acid; carbonic acid", correct: false, why: "Both the role and the name describe H₂CO₃, not HCO₃⁻. [Lecture 4.2]" }
        ]
    },
    {
        id: 10,
        quarter: 1,
        slideRef: "Class 3 Notes",
        stem: "Which conjugate acid–base pair primarily buffers the interior of cells?",
        options: [
            { text: "H₂CO₃ / HCO₃⁻", correct: false, why: "The carbonic acid/bicarbonate pair is the main blood and interstitial-fluid buffer, working with the lungs. It is not the intracellular one. [Class 3 Notes]" },
            { text: "H₂PO₄⁻ / HPO₄²⁻", correct: true, why: "Dihydrogen phosphate and monohydrogen phosphate buffer the cell interior. HPO₄²⁻ captures excess H⁺ to form H₂PO₄⁻. [Class 3 Notes]" },
            { text: "Acetic acid / acetate", correct: false, why: "Acetate was the resonance example for conjugate-base stability. It was not named as the intracellular buffer. [Class 2 Notes]" },
            { text: "HCl / Cl⁻", correct: false, why: "Strong mineral acids dissociate almost completely (very large Ka). They do not form an effective buffering pair. [Class 2 Notes]" }
        ]
    },
    {
        id: 11,
        quarter: 1,
        slideRef: "Class 3 Notes",
        stem: "When H⁺ is added to the buffer HA ⇌ H⁺ + A⁻, the equilibrium:",
        options: [
            { text: "shifts left as A⁻ captures the added H⁺", correct: true, why: "Le Châtelier: the conjugate base A⁻ absorbs the added H⁺ and forms HA. This limits the drop in pH. [Class 3 Notes]" },
            { text: "shifts right as HA releases more H⁺", correct: false, why: "A rightward shift happens when base is added or H⁺ is removed. Adding H⁺ drives the system left. [Class 3 Notes]" },
            { text: "does not shift because buffers are static", correct: false, why: "Buffer equilibria are dynamic. They shift to counter changes, which is how they act as chemical shock absorbers. [Class 3 Notes]" },
            { text: "shifts left as HA captures the added H⁺", correct: false, why: "HA is already protonated. The species that accepts H⁺ is the conjugate base A⁻. [Class 3 Notes]" }
        ]
    },
    {
        id: 12,
        quarter: 1,
        slideRef: "Class 3 Notes",
        stem: "The side-chain Ka values of lysine (pKa 10.5) and arginine (pKa 12.5) differ by a factor of:",
        options: [
            { text: "2", correct: false, why: "2 is the linear pKa difference. On a log scale, 2 units means 10² for Ka. [Class 3 Notes]" },
            { text: "20", correct: false, why: "This multiplies 10 by 2 instead of raising 10 to the power of 2. [Class 3 Notes]" },
            { text: "100", correct: true, why: "Two pKa units = 10² = 100-fold difference in Ka. Arginine, with the higher pKa, is the more strongly basic side chain. [Class 3 Notes]" },
            { text: "1,000", correct: false, why: "1,000-fold needs a 3-unit difference. Lysine and arginine differ by 2 units. [Class 3 Notes]" }
        ]
    },

    // ===================== QUARTER 2 — WEEK 2 =====================
    {
        id: 13,
        quarter: 2,
        slideRef: "Class 5 Notes",
        stem: "At a pH equal to an ionizable group's pKa, that group is:",
        options: [
            { text: "50% protonated and 50% deprotonated", correct: true, why: "pKa is defined as the pH where the acid and conjugate-base forms of a group are equal (log 1 = 0 in Henderson–Hasselbalch). [Class 5 Notes]" },

            { text: "fully deprotonated", correct: false, why: "A group is fully deprotonated well above its pKa. At pKa, the two forms are 50/50. [Class 5 Notes]" },
            { text: "at the molecule's isoelectric point", correct: false, why: "pI is the pH of zero net charge for the whole molecule, usually between two pKa values. It is not the pKa of a single group. [Class 5 Notes]" }
        ]
    },
    {
        id: 14,
        quarter: 2,
        slideRef: "Class 6 Notes",
        stem: "On an amino acid titration curve, the flattest regions indicate:",
        options: [
            { text: "strongest buffering, centered on a pKa", correct: true, why: "Flat regions show pH resisting change as OH⁻ is added. Each half-equivalence point in these regions marks a pKa. [Class 6 Notes]" },
            { text: "equivalence points, where buffering is weakest", correct: false, why: "Equivalence points sit on the steep parts of the curve, where small amounts of base cause large pH jumps. [Class 5 Notes]" },
            { text: "the isoelectric point of the amino acid", correct: false, why: "pI is a single pH of zero net charge. It falls on a steep segment between buffering zones, not in a flat zone. [Class 5 Notes]" },
            { text: "complete deprotonation of all groups", correct: false, why: "Full deprotonation occurs only at the end of the curve. Flat zones are 50/50 mixtures of adjacent forms. [Class 5 Notes]" }

    },
    {
        id: 15,
        quarter: 2,
        slideRef: "Class 5 Notes",

        options: [

            { text: "6.0", correct: true, why: "With no ionizable side chain, pI = (pKa1 + pKa2)/2 = (2.2 + 9.8)/2 = 6.0. [Class 5 Notes]" },

    },
    {
        id: 16,

        options: [

    },
    {

        quarter: 2,

    {

            { text: "side chain is positively charged at pH 7.4", correct: false, why: "Tyrosine's side chain is a weak acid (pKa 10.1) that stays mostly neutral OH at pH 7. It is not positively charged. [Class 8 Notes]" },
            { text: "side chain forms ionic bridges with lysine", correct: false, why: "Ionic bridges need a negatively charged side chain such as Asp or Glu. Tyrosine is mostly uncharged at pH 7. [Lecture 4.1]" }

        quarter: 4,

            { text: "hydrophobic stacking of phenylalanine rings", correct: false, why: "Hydrophobic stacking holds α to β within each dimer. The dimer-to-dimer interface relies on ionic bridges. [Lecture 4.1]" },

    {
        id: 48,
        quarter: 4,
        slideRef: "Lecture 4.3",
        stem: "In sickle-cell hemoglobin, valine replacing glutamate on β-globin promotes aggregation of deoxygenated Hb because valine side chains:",
        options: [
            { text: "interlock hydrophobically with valines on neighboring β chains", correct: true, why: "Nonpolar valines interdigitate ('scissor together') with valines on other β chains, especially when Hb is deoxygenated, causing aggregation and sickling. [Lecture 4.3]" },
            { text: "repel one another through negative charges", correct: false, why: "Glu–Glu negative repulsion is what normally prevents aggregation. Valine loses that charge, which removes the protection. [Lecture 4.3]" },
            { text: "form ionic bridges with lysine and arginine", correct: false, why: "Valine has no charge, so it cannot form ionic bridges. Only a negative glutamate could pair stably with Lys/Arg. [Lecture 4.3]" },
            { text: "hydrogen bond more strongly with water", correct: false, why: "Valine has no permanent dipole and is hydrophobic. It avoids water rather than bonding with it. [Lecture 4.3]" }

        slideRef: "Class 7 Notes",
        stem: "A coding-strand change from 5′-GAG-3′ to 5′-GTG-3′ produces which mRNA codon? (GUG Val, CAC His, GAG Glu, CUC Leu)",
        options: [
            { text: "5′-GUG-3′, valine", correct: true, why: "mRNA matches the coding strand with U for T: GTG → GUG = valine. This is the Glu → Val sickle-cell point mutation. [Class 7 Notes]" },
            { text: "5′-CAC-3′, histidine", correct: false, why: "CAC is the complement of GTG, as if the coding strand were the template. The coding strand matches mRNA directly. [Class 7 Notes]" },
            { text: "5′-GAG-3′, glutamate", correct: false, why: "GAG is the original codon. The A→T change in DNA becomes A→U in mRNA, so the codon does change. [Class 7 Notes]" },

            { text: "acidic and negatively charged", correct: false, why: "Charged side chains are hydrophilic and incompatible with the nonpolar lipid phase. [Class 1 Notes]" },
            { text: "basic and positively charged", correct: false, why: "Positive Lys/Arg side chains attract water dipoles and would destabilize a segment inside the bilayer. [Lecture 4.1]" },

let currentSet = quizData;
let round = 1;
let quizMode = 'full';
let answers = {};
let popupTimeout = null;

const weekLabels = { 1: 'Week 1', 2: 'Week 2', 3: 'Week 3', 4: 'Week 4' };
const letters = ['a', 'b', 'c', 'd'];

function fisherYates(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function shuffleQuiz() {
    fisherYates(currentSet);
    currentSet.forEach(q => fisherYates(q.options));
}

function escapeHtml(str) {
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

function updateScore() {
    const total = currentSet.length;
    const correct = Object.values(answers).filter(v => v === true).length;
    const pct = total ? Math.round((correct / total) * 100) : 0;
    const label = round === 1 ? 'Score' : `Review ${round - 1}`;
    document.getElementById('scoreDisplay').textContent = `${label}: ${correct} / ${total} (${pct}%)`;
}

function updateModeButtons() {
    document.getElementById('fullQuizBtn').classList.toggle('active', quizMode === 'full');
    document.getElementById('quickQuizBtn').classList.toggle('active', quizMode === 'quick');
}

function renderQuiz(set) {
    const popup = document.getElementById('wrongPopup');
    if (popup) popup.classList.add('hidden');

    if (set) {
        currentSet = set;
    } else {
        fisherYates(quizData);
        currentSet = (quizMode === 'quick') ? quizData.slice(0, 15) : [...quizData];
    }

    answers = {};
    shuffleQuiz();

    const quizEl = document.getElementById('quiz');
    quizEl.innerHTML = '';
    document.getElementById('summary').classList.add('hidden');

    currentSet.forEach((q, qIdx) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `card-${q.id}`;

        const badgeRow = document.createElement('div');
        badgeRow.className = 'q-badge-row';
        badgeRow.innerHTML = `<span class="q-badge">Question ${qIdx + 1} of ${currentSet.length}</span><span class="q-badge muted">${weekLabels[q.quarter]}</span>`;
        card.appendChild(badgeRow);

        const stem = document.createElement('div');
        stem.className = 'q-stem';
        stem.textContent = q.stem;
        card.appendChild(stem);

        const optWrap = document.createElement('div');
        optWrap.className = 'options';
        q.options.forEach((opt, oIdx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = `<span class="letter">${letters[oIdx]}.</span>${escapeHtml(opt.text)}`;
            btn.addEventListener('click', () => handleSelect(q, oIdx, card));
            optWrap.appendChild(btn);
        });
        card.appendChild(optWrap);

        const expl = document.createElement('div');
        expl.className = 'explanation hidden';
        card.appendChild(expl);

        quizEl.appendChild(card);
    });

    updateScore();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function handleSelect(q, oIdx, card) {
    if (q.id in answers) return;
    const chosen = q.options[oIdx];
    const isCorrect = chosen.correct === true;
    answers[q.id] = isCorrect;

    const buttons = card.querySelectorAll('.option-btn');
    buttons.forEach((btn, i) => {
        btn.disabled = true;
        if (q.options[i].correct) btn.classList.add('correct');
        if (i === oIdx && !isCorrect) btn.classList.add('incorrect');
    });

    if (!isCorrect) {
        const wrongAudio = document.getElementById('wrongAudio');
        const popup = document.getElementById('wrongPopup');
        if (wrongAudio) {
            wrongAudio.currentTime = 0;
            wrongAudio.play().catch(err => console.log('Audio play blocked:', err));
        }
        if (popup) {
            popup.classList.remove('hidden');
            if (popupTimeout) clearTimeout(popupTimeout);
            popupTimeout = setTimeout(() => {
                popup.classList.add('hidden');
            }, 2000);
        }
    }

    const expl = card.querySelector('.explanation');
    const items = q.options.map((opt, i) => {
        const cls = opt.correct ? 'is-correct' : 'is-wrong';
        const tag = opt.correct ? 'Correct' : 'Incorrect';
        return `<li class="${cls}"><span class="tag">${letters[i]}. ${tag}:</span> <strong>${escapeHtml(opt.text)}</strong> — ${escapeHtml(opt.why)}</li>`;
    }).join('');
    expl.innerHTML = `
        <div class="status-banner ${isCorrect ? 'good' : 'bad'}">${isCorrect ? 'Correct!' : 'You didn’t know that?!'}</div>
        <div class="ref-line">Reference: ${weekLabels[q.quarter]}, ${escapeHtml(q.slideRef)}</div>
        <ul class="breakdown">${items}</ul>`;
    expl.classList.remove('hidden');

    updateScore();
    if (Object.keys(answers).length === currentSet.length) showSummary();
}

function showSummary() {
    const total = currentSet.length;
    const correct = Object.values(answers).filter(v => v === true).length;
    const pct = total ? Math.round((correct / total) * 100) : 0;
    const missed = currentSet.filter(q => !answers[q.id]);

    const summary = document.getElementById('summary');
    const titleEl = summary.querySelector('.summary-title');
    const scoreEl = document.getElementById('summaryScore');
    const msgEl = document.getElementById('summaryMsg');
    const reviewBtn = document.getElementById('reviewBtn');

    scoreEl.textContent = `${correct} / ${total} (${pct}%)`;

    if (round === 1) {
        titleEl.textContent = 'Quiz Complete';
        if (pct >= 90) {
            msgEl.textContent = 'Absolute Gigachad. You drained that test dry.';
        } else if (pct >= 70) {
            msgEl.textContent = "Solid run! You're locked in, get in some more reps.";
        } else {
            msgEl.textContent = 'You really didn’t fucking know that.';
        }
    } else {
        titleEl.textContent = `Review Round ${round - 1} Complete`;
        msgEl.textContent = missed.length > 0 ? `${missed.length} still missed. Go again.` : 'Everything cleared. All correct.';
    }

    if (missed.length > 0) {
        reviewBtn.style.display = 'inline-block';
        reviewBtn.textContent = `Review Missed (${missed.length})`;
    } else {
        reviewBtn.style.display = 'none';
    }

    summary.classList.remove('hidden');
    summary.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

document.getElementById('fullQuizBtn').addEventListener('click', () => {
    quizMode = 'full';
    updateModeButtons();
    round = 1;
    renderQuiz();
});

document.getElementById('quickQuizBtn').addEventListener('click', () => {
    quizMode = 'quick';
    updateModeButtons();
    round = 1;
    renderQuiz();
});

document.getElementById('retakeBtn').addEventListener('click', () => { round = 1; renderQuiz(); });
document.getElementById('reviewBtn').addEventListener('click', () => { round++; renderQuiz(currentSet.filter(q => !answers[q.id])); });

window.onload = () => { updateModeButtons(); renderQuiz(); };
</script>
