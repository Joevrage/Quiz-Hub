        :root {

            color: var(--text-main);

        }

        #score-header {
            color: var(--accent);
        }

        .container {

            padding: 0 1rem;
        }

        .question-card {

            margin-bottom: 2rem;

            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--text-main);
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .option-btn {
            background-color: #262626;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            padding: 1rem;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-main);
            font-weight: 500;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #333333;
            border-color: var(--accent);
        }

        .option-btn:disabled {
            cursor: default;
        }

        .option-btn.correct {
            background-color: var(--correct-bg);
            border-color: var(--correct-border);
            color: #ffffff;
        }

        .option-btn.incorrect {
            background-color: var(--incorrect-bg);
            border-color: var(--incorrect-border);
            color: #ffffff;
        }

        .explanation {
            margin-top: 1.25rem;
            padding: 1.2rem;
            border-radius: 6px;
            background-color: #262626;
            border-left: 4px solid var(--accent);
            font-size: 0.95rem;
            display: none;
            color: #e5e5e5;
            animation: fadeIn 0.3s ease-in;
        }

        .explanation-banner {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .correct-banner { color: var(--correct-border); }
        .incorrect-banner { color: var(--incorrect-border); }

        .takeaway-text {
            margin-bottom: 0.75rem;
            color: #f3f4f6;
            line-height: 1.5;
        }

        .rationale-list {
            margin-top: 0.8rem;
            border-top: 1px solid #404040;
            padding-top: 0.75rem;
            font-size: 0.9rem;
            color: #d4d4d4;
        }

        .rationale-item {
            margin-bottom: 0.5rem;
            line-height: 1.45;
        }

        .rationale-item strong {
            color: var(--accent);
            margin-right: 4px;
        }

        #summary-card {
            background-color: var(--bg-card);
            border-radius: 8px;
            padding: 2.5rem 1.5rem;
            text-align: center;
            border: 2px solid var(--accent);
            margin-top: 2rem;
            display: none;
        }

        #summary-card h2 {
            margin-bottom: 1rem;
            color: var(--text-main);
            font-size: 1.8rem;
        }

        .score-display {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 1rem;
        }

        #final-feedback {
            margin-bottom: 2rem;
            font-size: 1.1rem;
            color: var(--text-muted);
        }

        .reset-btn {
            background-color: var(--accent);
            color: var(--bg-main);
            border: none;
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            transition: background-color 0.2s;
        }

        .reset-btn:hover {
            background-color: var(--accent-hover);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>

                    { text: "Vasa vasorum", correct: false, why: "C) Incorrect. Large veins also contain vasa vasorum in their outer walls." },
                    { text: "Internal elastic lamina", correct: true, why: "D) Correct. A prominent internal elastic lamina separates the intima and media in arteries; it is rudimentary or completely absent in veins." }
                ],
                explanation: "Arteries possess a well-defined internal elastic lamina between intima and media to withstand systolic pressure peaks, which is absent in veins."
            },
            {
                question: "What is the histological cellular makeup of a standard capillary wall?",
                options: [
                    { text: "One to four simple squamous endothelial cells wrapped to form a lumen, surrounded by a basement membrane and scattered pericytes", correct: true, why: "A) Correct. Capillaries lack tunica media and adventitia; their walls consist solely of 1 to 4 curved endothelial cells on a basement membrane with pericytes." },
                    { text: "A continuous layer of cuboidal cells embedded in dense regular collagen", correct: false, why: "B) Incorrect. Capillary endothelium is squamous, not cuboidal, and dense collagen would block diffusion." },
                    { text: "A layer of vascular smooth muscle lined internally by fibroblasts", correct: false, why: "C) Incorrect. True capillaries contain zero smooth muscle cells." },
                    { text: "A stratified squamous epithelial tube lacking a basement membrane", correct: false, why: "D) Incorrect. Capillaries are unistratified and require a continuous or discontinuous basement membrane." }
                ],
                explanation: "A capillary wall consists of 1 to 4 simple squamous endothelial cells curled around a central lumen, encased by a basement membrane and pericytes."
            },
            {
                question: "Which capillary type features continuous tight junctions, lacks pores, is relatively non-leaky, and forms the blood-brain barrier?",
                options: [
                    { text: "Fenestrated capillaries", correct: false, why: "A) Incorrect. Fenestrated capillaries possess transcellular filtration pores." },
                    { text: "Continuous capillaries", correct: true, why: "B) Correct. Continuous capillaries feature uninterrupted endothelial cells sealed by occluding tight junctions and continuous basal lamina, maintaining high resistance in the CNS." },
                    { text: "Sinusoidal capillaries", correct: false, why: "C) Incorrect. Sinusoids have large openings and are highly permeable." },
                    { text: "Discontinuous capillaries", correct: false, why: "D) Incorrect. Discontinuous capillaries are leaky sinusoids found in liver and spleen." }
                ],
                explanation: "Continuous capillaries possess uninterrupted endothelial linings and tight junctions, forming non-leaky barriers such as the blood-brain barrier."
            },
            {
                question: "Which capillary type contains filtration pores with diaphragmatic lids and is characteristic of the renal glomerulus and endocrine glands?",
                options: [
                    { text: "Continuous capillaries", correct: false, why: "A) Incorrect. Continuous capillaries lack transcellular fenestrations." },
                    { text: "Sinusoidal capillaries", correct: false, why: "B) Incorrect. Sinusoids have open intercellular gaps rather than diaphragmatic filtration pores." },
                    { text: "Fenestrated capillaries", correct: true, why: "C) Correct. Fenestrated capillaries feature 60 to 80 nm pores spanning endothelial cells to facilitate rapid water and solute transport in renal glomeruli, choroid plexus, and endocrine glands." },
                    { text: "Discontinuous capillaries", correct: false, why: "D) Incorrect. Discontinuous capillaries lack diaphragm-covered pores." }
                ],
                explanation: "Fenestrated capillaries feature specialized pores (fenestrae) for rapid solute filtration in kidneys and endocrine organs."
            },
            {
                question: "Which capillary type is the leakiest, contains large intercellular clefts, possesses the fewest pericytes, and is located in the liver, spleen, and bone marrow?",
                options: [
                    { text: "Continuous capillaries", correct: false, why: "A) Incorrect. Continuous capillaries are the least permeable capillary class." },
                    { text: "Fenestrated capillaries", correct: false, why: "B) Incorrect. Continuous capillaries restrict whole cells and plasma proteins." },
                    { text: "Postcapillary venules", correct: false, why: "C) Incorrect. Venules are collecting conduits, not wide sinusoidal capillary beds." },
                    { text: "Sinusoidal (discontinuous) capillaries", correct: true, why: "D) Correct. Sinusoidal capillaries possess large intercellular gaps, discontinuous basal lamina, and few pericytes, permitting entire cells and large proteins to cross." }
                ],
                explanation: "Sinusoidal (discontinuous) capillaries are the leakiest vessels, featuring wide gaps and disrupted basement membranes in liver, spleen, and bone marrow."
            },
            {
                question: "What are the three histological layers that compose the vascular basement membrane?",
                options: [
                    { text: "Lamina lucida, lamina densa, and reticular lamina", correct: true, why: "A) Correct. The complete basement membrane consists of the electron-lucent lamina lucida, the collagen type IV-rich lamina densa, and the deeper fibrillar reticular lamina." },
                    { text: "Tunica intima, tunica media, and tunica adventitia", correct: false, why: "B) Incorrect. These are the three macroscopic tunics of blood vessel walls." },
                    { text: "Lamina lucida, internal elastic lamina, and external elastic lamina", correct: false, why: "C) Incorrect. Elastic laminae are arterial wall layers, not basement membrane strata." },
                    { text: "Basal lamina, subendothelial layer, and perivascular space", correct: false, why: "D) Incorrect. These represent tissue compartments rather than the three sublayers of the basement membrane." }
                ],
                explanation: "The vascular basement membrane consists ultrastructurally of the lamina lucida, lamina densa, and reticular lamina."
            },
            {
                question: "Which two layers of the basement membrane specifically combine to form the basal lamina?",
                options: [
                    { text: "Lamina densa and reticular lamina", correct: false, why: "A) Incorrect. The reticular lamina is secreted by underlying connective tissue fibroblasts, not epithelial/endothelial cells." },
                    { text: "Lamina lucida and lamina densa", correct: true, why: "B) Correct. The basal lamina specifically designates the two layers synthesized directly by epithelial or endothelial cells: the lamina lucida and lamina densa." },
                    { text: "Lamina lucida and reticular lamina", correct: false, why: "C) Incorrect. This pair omits the central lamina densa." },
                    { text: "Internal elastic lamina and lamina densa", correct: false, why: "D) Incorrect. The internal elastic lamina is an extracellular elastic arterial sheet." }
                ],
                explanation: "The basal lamina specifically consists of the lamina lucida and lamina densa."
            },
            {
                question: "What three clinical microvascular complications define the classic diabetic triopathy?",
                options: [
                    { text: "Cardiomyopathy, stroke, and peripheral claudication", correct: false, why: "A) Incorrect. These are macrovascular complications of accelerated atherosclerosis." },
                    { text: "Dermatopathy, myopathy, and hepatopathy", correct: false, why: "B) Incorrect. This is not the defined microvascular clinical triad." },
                    { text: "Retinopathy, neuropathy, and nephropathy", correct: true, why: "C) Correct. Diabetic microangiopathy causes hyaline arteriolosclerosis and capillary basement membrane thickening, manifesting as retinopathy, neuropathy, and nephropathy." },
                    { text: "Atherosclerosis, hypertension, and gangrene", correct: false, why: "D) Incorrect. Atherosclerosis and gangrene represent macrovascular pathology." }
                ],
                explanation: "The classic microvascular triopathy of diabetes mellitus comprises retinopathy, neuropathy, and nephropathy."
            },
            {
                question: "When local tissue metabolism increases and waste products like CO2, H+, and adenosine accumulate in the interstitium, what direct effect do they have on adjacent precapillary arterioles?",
                options: [
                    { text: "They induce intense vasoconstriction to limit local blood flow.", correct: false, why: "A) Incorrect. Restricting blood flow would worsen local ischemia and waste accumulation." },
                    { text: "They trigger pericytes to occlude the capillary lumen.", correct: false, why: "B) Incorrect. Pericytes do not occlude lumens in response to metabolic demand." },
                    { text: "They stimulate systemic ADH release.", correct: false, why: "C) Incorrect. ADH is secreted by the neurohypophysis in response to hyperosmolality and hypovolemia." },
                    { text: "They stimulate vascular smooth muscle relaxation, causing vasodilation and increased perfusion.", correct: true, why: "D) Correct. Local accumulation of CO2, protons, adenosine, and lactate causes metabolic autoregulation, relaxing arteriolar smooth muscle to increase perfusion." }
                ],
                explanation: "Accumulation of metabolic waste products relaxes arteriolar smooth muscle, inducing local vasodilation and functional hyperemia."
            },
            {
                question: "What physiological mechanism describes the elastic recoil of the ascending aorta during ventricular diastole that maintains continuous downstream perfusion and forces the semilunar valves shut?",
                options: [
                    { text: "The Windkessel effect", correct: true, why: "A) Correct. The Windkessel model describes how compliant elastic arteries store systolic energy and recoil during diastole to drive forward perfusion and close the aortic valve." },
                    { text: "The Frank-Starling mechanism", correct: false, why: "B) Incorrect. Frank-Starling relates ventricular end-diastolic sarcomere stretch to systolic contractile force." },
                    { text: "The Gibbs-Donnan equilibrium", correct: false, why: "C) Incorrect. Gibbs-Donnan describes electrochemical ion distribution across a semipermeable membrane with impermeant polyanions." },
                    { text: "Fick law of diffusion", correct: false, why: "D) Incorrect. Fick law describes passive solute diffusion proportional to concentration gradient and area." }
                ],
                explanation: "The Windkessel effect describes the diastolic elastic recoil of large arteries that maintains forward perfusion and snaps the aortic valve shut."
            },
            {
                question: "Large blood vessels have thick muscular walls that cannot receive adequate oxygen and nutrients solely through luminal diffusion. What specialized microvascular network located in the tunica adventitia provides this metabolic supply?",
                options: [
                    { text: "Nervi vasorum", correct: false, why: "A) Incorrect. Nervi vasorum are the autonomic nerve fibers innervating vascular smooth muscle." },
                    { text: "Vasa vasorum", correct: true, why: "B) Correct. The vasa vasorum ('vessels of the vessels') are minute arterioles, capillaries, and venules distributed through the adventitia to supply thick vessel walls." },
                    { text: "Metarterioles", correct: false, why: "C) Incorrect. Metarterioles are microcirculatory thoroughfare channels connecting arterioles to venules." },
                    { text: "Postcapillary venules", correct: false, why: "D) Incorrect. These are microvascular collecting vessels that receive capillary blood." }
                ],
                explanation: "The vasa vasorum is the specialized capillary network supplying the outer tunica media and adventitia of large vessels."
            },
            {
                question: "When sympathetic adrenergic nerves stimulate precapillary arterioles to constrict, norepinephrine binds to alpha-1 receptors on vascular smooth muscle to activate which specific intracellular signaling cascade?",
                options: [
                    { text: "Adenylyl cyclase -> cAMP -> Protein Kinase A -> Calcium efflux", correct: false, why: "A) Incorrect. This pathway is activated by beta-2 adrenergic receptors, which causes vasodilation, not constriction." },
                    { text: "Tyrosine kinase -> IRS -> PI3K -> Protein Kinase B", correct: false, why: "B) Incorrect. This is the metabolic insulin signaling cascade." },
                    { text: "G-protein coupled receptor -> Phospholipase C (PLC) -> IP3 and DAG -> Sarcoplasmic reticulum calcium release", correct: true, why: "C) Correct. Alpha-1 receptors couple to Gq, activating PLC to hydrolyze PIP2 into IP3 and DAG; IP3 triggers calcium release from the sarcoplasmic reticulum to stimulate myosin light-chain kinase and cause vasoconstriction." },
                    { text: "Voltage-gated sodium channel influx -> Calmodulin activation -> Myosin light-chain phosphatase", correct: false, why: "D) Incorrect. Myosin light-chain phosphatase causes muscle relaxation, not contraction." }
                ],
                explanation: "Alpha-1 adrenergic stimulation couples through Gq and Phospholipase C to generate IP3 and DAG, releasing intracellular calcium and causing vasoconstriction."
            },
            {
                question: "What physiological mechanism is responsible for the normal splitting of the second heart sound (S2) during quiet inspiration?",
                options: [
                    { text: "Increased thoracic pressure causes premature aortic valve closure.", correct: false, why: "A) Incorrect. Inspiration decreases intrathoracic pressure rather than increasing it." },
                    { text: "Delayed closure of the tricuspid valve due to left ventricular hypertrophy.", correct: false, why: "B) Incorrect. S2 represents semilunar valve closure (A2 and P2), whereas AV valves produce S1." },
                    { text: "Early closure of the mitral valve due to decreased systemic vascular resistance.", correct: false, why: "C) Incorrect. Mitral closure contributes to S1, not S2." },
                    { text: "Negative intrathoracic pressure increases venous return to the right heart, delaying pulmonic valve closure.", correct: true, why: "D) Correct. Negative intrathoracic pressure enhances right heart venous return, prolonging right ventricular ejection time and delaying the pulmonic closure sound (P2) relative to aortic closure (A2)." }
                ],
                explanation: "Inspiratory negative thoracic pressure increases right ventricular venous return, delaying pulmonic valve closure (P2) and producing physiological S2 splitting."
            },
            {
                question: "During periods of severe environmental heat stress, which autonomic fibers release acetylcholine (ACh) to induce cutaneous arteriolar vasodilation and stimulate eccrine sweat glands?",
                options: [
                    { text: "Sympathetic cholinergic fibers", correct: true, why: "A) Correct. Thermoregulatory cutaneous eccrine sweat glands and associated vasodilator pathways are innervated by sympathetic postganglionic cholinergic fibers releasing ACh." },
                    { text: "Parasympathetic muscarinic fibers", correct: false, why: "B) Incorrect. Limbs and skin generally lack parasympathetic innervation." },
                    { text: "Somatic motor efferents", correct: false, why: "C) Incorrect. Somatic motor efferents innervate skeletal muscle fibers, not cutaneous vasculature." },
                    { text: "Sympathetic adrenergic fibers", correct: false, why: "D) Incorrect. Sympathetic adrenergic fibers release norepinephrine, which induces vasoconstriction via alpha-1 receptors." }
                ],
                explanation: "Cutaneous thermoregulatory vasodilation and eccrine sweating are mediated by sympathetic postganglionic cholinergic fibers releasing acetylcholine."
            },
            {
                question: "How does the oxygenation profile of blood within a systemic capillary bed differ from that of systemic arteries and systemic veins?",
                options: [
                    { text: "Systemic capillaries are uniformly deoxygenated throughout their entire length.", correct: false, why: "A) Incorrect. Blood entering the capillary from the arteriole has full arterial oxygen saturation." },
                    { text: "Systemic capillaries are a hybrid: the proximal (arteriolar) capillary is oxygenated, whereas the distal (venular) capillary is deoxygenated.", correct: true, why: "B) Correct. As blood traverses the capillary bed, oxygen progressively diffuses into tissues, transitioning blood from oxygenated at the arteriolar inlet to deoxygenated at the venular outlet." },
                    { text: "Systemic capillaries contain fully oxygenated blood from end to end because diffusion occurs only in postcapillary venules.", correct: false, why: "C) Incorrect. Capillary walls are the primary site of oxygen unloading." },
                    { text: "Systemic capillaries exhibit higher oxygen saturation at the distal venular end than at the proximal arteriolar end.", correct: false, why: "D) Incorrect. Oxygen saturation drops as blood moves down the capillary." }
                ],
                explanation: "Systemic capillaries represent a functional transition: blood is oxygenated at the arteriolar inlet and becomes deoxygenated by the venular outlet."
            },
            {
                question: "Which vascular segment contains approximately 60% to 70% of total circulating blood volume at rest, functioning as the primary capacitance reservoir of the circulatory system?",
                options: [
                    { text: "Elastic conducting arteries", correct: false, why: "A) Incorrect. Systemic arteries hold only about 13% to 15% of total blood volume under high pressure." },
                    { text: "Precapillary resistance arterioles", correct: false, why: "B) Incorrect. Arterioles hold roughly 2% of volume and act as resistance vessels." },
                    { text: "Systemic veins and venules", correct: true, why: "C) Correct. Veins have high compliance and thin, distensible walls, allowing them to store roughly 60% to 70% of total blood volume at low pressures." },
                    { text: "Pulmonary capillary beds", correct: false, why: "D) Incorrect. Pulmonary capillaries hold less than 5% of circulating volume at any given time." }
                ],
                explanation: "Systemic veins and venules serve as the body's primary capacitance reservoir, containing 60% to 70% of total blood volume at rest."
            },
            {
                question: "Precapillary arterioles possess a relatively thin tunica adventitia, allowing interstitial metabolites to diffuse directly into the vascular wall. Which group of low-energy signals and metabolic byproducts promotes local arteriolar vasodilation to increase capillary blood flow?",
                options: [
                    { text: "High ATP, glucose, oxygen, and alkaline pH", correct: false, why: "A) Incorrect. High ATP and oxygen signal adequate perfusion and induce vasoconstriction." },
                    { text: "Epinephrine, thromboxane A2, and endothelin-1", correct: false, why: "B) Incorrect. Thromboxane A2 and endothelin-1 are potent vasoconstrictors." },
                    { text: "Albumin, fibrinogen, and prothrombin", correct: false, why: "C) Incorrect. Circulating plasma proteins do not act as local metabolic vasodilators." },
                    { text: "AMP, adenosine, lactate, H+ ions, and CO2", correct: true, why: "D) Correct. These metabolites signal cellular energy depletion and oxygen debt, diffusing to arteriolar smooth muscle to trigger local vasodilation and restore blood flow." }
                ],
                explanation: "Local accumulation of AMP, adenosine, lactate, protons, and carbon dioxide relaxes vascular smooth muscle, causing metabolic autoregulatory vasodilation."
            }
        ];

        let currentScore = 0;
        let answeredQuestions = new Set();
        let totalQuestions = quizData.length;

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
        }

        function renderQuiz() {
            totalQuestions = quizData.length;
            shuffleArray(quizData);
            quizData.forEach(q => shuffleArray(q.options));

            const quizContainer = document.getElementById('quiz-container');
            quizContainer.innerHTML = '';
            currentScore = 0;
            answeredQuestions.clear();
            updateScoreDisplay();
            
            document.getElementById('summary-card').style.display = 'none';
            document.getElementById('quiz-container').style.display = 'block';
            window.scrollTo(0, 0);

            quizData.forEach((data, qIndex) => {
                const questionCard = document.createElement('div');
                questionCard.className = 'question-card';
                questionCard.id = `q-${qIndex}`;

                const questionNumber = document.createElement('div');
                questionNumber.className = 'question-number';
                questionNumber.innerText = `Question ${qIndex + 1} of ${totalQuestions}`;
                
                const questionText = document.createElement('div');
                questionText.className = 'question-text';
                questionText.innerText = data.question;

                const optionsContainer = document.createElement('div');
                optionsContainer.className = 'options-container';

                data.options.forEach((opt, oIndex) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    const letter = String.fromCharCode(65 + oIndex);
                    btn.innerText = `${letter}. ${opt.text}`;
                    
                    btn.onclick = () => handleAnswer(qIndex, oIndex, btn, opt.correct, data);
                    optionsContainer.appendChild(btn);
                });

                const explanationDiv = document.createElement('div');
                explanationDiv.className = 'explanation';
                explanationDiv.id = `exp-${qIndex}`;

                questionCard.appendChild(questionNumber);
                questionCard.appendChild(questionText);
                questionCard.appendChild(optionsContainer);
                questionCard.appendChild(explanationDiv);
                quizContainer.appendChild(questionCard);
            });
        }

        function handleAnswer(qIndex, oIndex, btnElement, isCorrect, data) {
            if (answeredQuestions.has(qIndex)) return;
            answeredQuestions.add(qIndex);
            
            const card = document.getElementById(`q-${qIndex}`);
            const allButtons = card.querySelectorAll('.option-btn');
            allButtons.forEach((btn, idx) => {
                btn.disabled = true;
                if (data.options[idx].correct) {
                    btn.classList.add('correct');
                }
            });

            const expDiv = document.getElementById(`exp-${qIndex}`);
            
            let rationaleHTML = '<div class="rationale-list">';
            data.options.forEach((opt, idx) => {
                const letter = String.fromCharCode(65 + idx);
                rationaleHTML += `<div class="rationale-item"><strong>${letter})</strong> ${opt.why}</div>`;
            });
            rationaleHTML += '</div>';

            if (isCorrect) {
                currentScore++;
                expDiv.innerHTML = `
                    <div class="explanation-banner correct-banner">Correct!</div>
                    <div class="takeaway-text"><strong>Core Takeaway:</strong> ${data.takeaway}</div>
                    ${rationaleHTML}
                `;
            } else {
                btnElement.classList.add('incorrect');
                expDiv.innerHTML = `
                    <div class="explanation-banner incorrect-banner">Incorrect.</div>
                    <div class="takeaway-text"><strong>Core Takeaway:</strong> ${data.takeaway}</div>
                    ${rationaleHTML}
                `;
            }
            
            expDiv.style.display = 'block';
            updateScoreDisplay();

            if (answeredQuestions.size === totalQuestions) {
                showSummary();
            }
        }

        function updateScoreDisplay() {
            let percentage = totalQuestions === 0 ? 0 : Math.round((currentScore / totalQuestions) * 100);
            document.getElementById('score-header').innerText = `Score: ${currentScore} / ${totalQuestions} (${percentage}%)`;
        }

        function showSummary() {
            setTimeout(() => {
                document.getElementById('quiz-container').style.display = 'none';
                const summaryCard = document.getElementById('summary-card');
                summaryCard.style.display = 'block';
                
                let percentage = Math.round((currentScore / totalQuestions) * 100);
                document.getElementById('final-score-display').innerText = `${currentScore} / ${totalQuestions} (${percentage}%)`;
                
                let feedback = percentage >= 85 
                    ? "Excellent work! Mastery of circulatory hemodynamics, vascular innervation, histology, and airway architecture demonstrated." 
                    : "Review vascular histology, the Windkessel effect, airway acinus divisions, and mediastinal boundaries.";
                document.getElementById('final-feedback').innerText = feedback;
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, 800); 
        }

        function resetQuiz() { 
            renderQuiz(); 
        }

        window.onload = renderQuiz;
    </script>
