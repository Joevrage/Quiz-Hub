let currentSet = [];
        let round = 1;
        let quizMode = 'full'; // 'full' or 'quick'
        let answers = {};
        let popupTimeout = null;

        function fisherYates(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function escapeHTML(s) {
            return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
        }

        function updateHeader() {
            const total = quizData.length;
            const pct = total ? Math.round((score / total) * 100) : 0;
            const scoreDisplay = document.getElementById("score-display");
            const answeredDisplay = document.getElementById("answered-display");
            const progressBar = document.getElementById("progress-bar");
            
            if (scoreDisplay) scoreDisplay.textContent = `Score: ${score} / ${total} (${pct}%)`;
            if (answeredDisplay) answeredDisplay.textContent = `Answered ${answered} / ${total}`;
            if (progressBar) progressBar.style.width = total ? (answered / total * 100) + "%" : "0";
        }

        function renderQuiz(set) {
            const popup = document.getElementById('wrongPopup');
            if (popup) popup.classList.add('hidden');

            if (set) {
                currentSet = set;
            } else {
                // If Quickie mode is selected, take 15 questions; otherwise take the full bank
                const targetCount = (quizMode === 'quick') ? 15 : questionBank.length;
                let pool = [...questionBank];
                fisherYates(pool);
                currentSet = pool.slice(0, targetCount);
            }

            score = 0;
            answered = 0;
            answers = {};
            
            // Deep copy and shuffle questions and options
            quizData = JSON.parse(JSON.stringify(currentSet));
            quizData.forEach(q => fisherYates(q.options));
            quizData = fisherYates(quizData);

            const container = document.getElementById('quiz-container');
            if (!container) return;
            container.innerHTML = '';
            
            const summaryCard = document.getElementById('summary-card');
            if (summaryCard) summaryCard.classList.remove('show');

            quizData.forEach((q, qi) => {
                const card = document.createElement("section");
                card.className = "card";
                card.id = `card-${qi}`;
                const diffLabel = q.difficulty ? q.difficulty.charAt(0).toUpperCase() + q.difficulty.slice(1) : "";
                
                card.innerHTML = `
                  <div class="q-meta">
                    <span class="q-num">Question ${qi + 1} of ${quizData.length}</span>
                    <span class="badge">${escapeHTML(QUARTER_NAMES[q.quarter] || "General")}</span>
                    ${diffLabel ? `<span class="badge">${diffLabel}</span>` : ""}
                    ${q.priority ? '<span class="badge hot">Exam flag</span>' : ""}
                  </div>
                  <div class="stem">${escapeHTML(q.stem)}</div>
                  <div class="options">
                    ${q.options.map((o, oi) => `
                      <button class="option-btn" data-q="${qi}" data-o="${oi}">
                        <span class="letter">${String.fromCharCode(65 + oi)}.</span><span>${escapeHTML(o.text)}</span>
                      </button>`).join("")}
                  </div>
                  <div class="explanation" id="exp-${qi}"></div>`;
                container.appendChild(card);
            });

            container.querySelectorAll(".option-btn").forEach(btn => {
                btn.addEventListener("click", () => selectOption(+btn.dataset.q, +btn.dataset.o));
            });

            updateHeader();
            window.scrollTo({ top: 0 });
        }

        function selectOption(qi, oi) {
            const q = quizData[qi];
            if (q._locked) return;
            q._locked = true;

            const card = document.getElementById(`card-${qi}`);
            const buttons = card.querySelectorAll(".option-btn");
            const isCorrect = q.options[oi].correct;
            
            buttons.forEach((b, bi) => {
                b.disabled = true;
                if (q.options[bi].correct) b.classList.add("correct");
                else if (bi === oi) b.classList.add("incorrect");
                else b.classList.add("dim");
            });

            q._result = isCorrect;
            if (isCorrect) {
                score++;
            } else {
                const wrongAudio = document.getElementById("wrongAudio");
                if (wrongAudio) {
                    wrongAudio.currentTime = 0;
                    wrongAudio.play().catch(err => console.log("Audio play blocked/failed:", err));
                }
            }
            answered++;

            const correctOption = q.options.find(o => o.correct) || q.options[0];
            const conceptText = correctOption.why.replace(/\[.*?\]\s*$/, "").trim();

            const exp = document.getElementById(`exp-${qi}`);
            exp.innerHTML = `
                <div class="banner ${isCorrect ? "good" : "bad"}">${isCorrect ? "Correct!" : "Incorrect."}</div>
                <div class="concept-box"><strong>Core Concept:</strong> ${escapeHTML(conceptText)}</div>
                <ul class="breakdown">
                  ${q.options.map((o, bi) => `
                    <li><strong>${String.fromCharCode(65 + bi)}) ${escapeHTML(o.text)}:</strong> ${escapeHTML(o.why)}</li>
                  `).join("")}
                </ul>`;
            exp.classList.add("show");

            updateHeader();
            if (answered === quizData.length) showSummary();
        }

        function showSummary() {
            const total = quizData.length;
            const pct = Math.round((score / total) * 100);
            
            const pctEl = document.getElementById("summary-pct");
            const rawEl = document.getElementById("summary-raw");
            const feedbackEl = document.getElementById("summary-feedback");
            
            if (pctEl) pctEl.textContent = pct + "%";
            if (rawEl) rawEl.textContent = `${score} of ${total} correct`;
            
            if (feedbackEl) {
                if (pct >= 90) {
                    feedbackEl.textContent = "Absolute Gigachad. You drained that test dry.";
                    feedbackEl.style.color = "#22c55e";
                } else if (pct >= 70) {
                    feedbackEl.textContent = "You lasted less than 30 seconds. Time for a rematch.";
                    feedbackEl.style.color = "#ff9900";
                } else {
                    feedbackEl.textContent = "You really didn’t fucking know that.";
                    feedbackEl.style.color = "#ef4444";
                }
            }

            const card = document.getElementById("summary-card");
            if (card) {
                card.classList.add("show");
                card.scrollIntoView({ behavior: "smooth", block: "center" });
            }
        }

        function updateModeButtons() {
            const fullBtn = document.getElementById('fullQuizBtn');
            const quickBtn = document.getElementById('quickQuizBtn');
            if (!fullBtn || !quickBtn) return;
            
            if (quizMode === 'full') {
                fullBtn.classList.add('active');
                quickBtn.classList.remove('active');
            } else {
                quickBtn.classList.add('active');
                fullBtn.classList.remove('active');
            }
        }

        document.getElementById('fullQuizBtn').addEventListener('click', () => {
            quizMode = 'full';
            round = 1;
            updateModeButtons();
            renderQuiz();
        });

        document.getElementById('quickQuizBtn').addEventListener('click', () => {
            quizMode = 'quick';
            round = 1;
            updateModeButtons();
            renderQuiz();
        });

        function resetQuiz() { 
            renderQuiz(); 
        }

        window.onload = () => {
            updateModeButtons();
            renderQuiz();
        };
</script>
