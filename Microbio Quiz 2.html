<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Microbiology Quiz 2 Material Review</title>
    <style>
        /* =========================================================
           QUIZ HUB DARK THEME
           ========================================================= */
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --card-border: #282828;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --primary-accent: #ff9900;
            --correct-color: #22c55e;
            --correct-bg: rgba(34, 197, 94, 0.15);
            --correct-border: #22c55e;
            --incorrect-color: #ef4444;
            --incorrect-bg: rgba(239, 68, 68, 0.15);
            --incorrect-border: #ef4444;
            --border-color: #282828;
            --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.5);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: Arial, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.5;
            padding-bottom: 40px;
            user-select: none;
        }

        /* Sticky Score Header */
        .header-sticky {
            position: -webkit-sticky;
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: var(--card-bg);
            border-bottom: 2px solid var(--border-color);
            padding: 14px 20px;
            box-shadow: var(--shadow-sm);
        }

        .header-container {
            max-width: 850px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--primary-accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .score-box {
            font-size: 0.95rem;
            font-weight: 700;
            background-color: #0f0f0f;
            color: var(--primary-accent);
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid var(--primary-accent);
        }

        /* Progress Bar */
        .progress-bar-container {
            width: 100%;
            height: 5px;
            background-color: var(--border-color);
            position: absolute;
            bottom: 0;
            left: 0;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background-color: var(--primary-accent);
            transition: width 0.3s ease;
        }

        /* Quiz Container & Cards */
        .quiz-container {
            max-width: 850px;
            margin: 25px auto;
            padding: 0 16px;
        }

        .question-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 24px;
            margin-bottom: 22px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--card-border);
        }

        .question-header {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--primary-accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--text-primary);
            line-height: 1.4;
        }

        .options-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            width: 100%;
            text-align: left;
            padding: 14px 18px;
            font-size: 0.95rem;
            color: var(--text-primary);
            background-color: #222222;
            border: 1.5px solid var(--card-border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            line-height: 1.3;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary-accent);
            background-color: #2a2a2a;
        }

        .option-btn:disabled {
            cursor: default;
        }

        /* Option Feedback States */
        .option-btn.correct-choice {
            background-color: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: #ffffff !important;
            font-weight: 700;
        }

        .option-btn.incorrect-choice {
            background-color: var(--incorrect-bg) !important;
            border-color: var(--incorrect-border) !important;
            color: #ffffff !important;
            font-weight: 700;
        }

        .option-btn.dimmed {
            opacity: 0.4;
        }

        /* Explanation Box */
        .explanation-box {
            margin-top: 18px;
            padding: 16px 18px;
            border-radius: 8px;
            font-size: 0.92rem;
            line-height: 1.5;
            display: none;
        }

        .explanation-box.visible {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .explanation-box.correct {
            background-color: var(--correct-bg);
            border: 1px solid var(--correct-border);
            color: #e2e8f0;
        }

        .explanation-box.incorrect {
            background-color: var(--incorrect-bg);
            border: 1px solid var(--incorrect-border);
            color: #e2e8f0;
        }

        .explanation-title {
            font-weight: 800;
            margin-bottom: 6px;
            font-size: 1rem;
        }

        .explanation-box.correct .explanation-title {
            color: var(--correct-color);
        }

        .explanation-box.incorrect .explanation-title {
            color: var(--incorrect-color);
        }

        /* Summary Card */
        .summary-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 36px 24px;
            text-align: center;
            box-shadow: var(--shadow-md);
            border: 2px solid var(--primary-accent);
            display: none;
        }

        .summary-card.visible {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        .summary-title {
            font-size: 1.6rem;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .summary-score {
            font-size: 2.8rem;
            font-weight: 900;
            color: var(--primary-accent);
            margin-bottom: 16px;
        }

        .summary-text {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 28px;
        }

        .reset-btn {
            background: linear-gradient(to bottom, #ff9900, #ff5500);
            color: #ffffff;
            border: none;
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 900;
            text-transform: uppercase;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 0 #992200;
            transition: all 0.2s ease;
        }

        .reset-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #992200;
        }

        .reset-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #992200;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Sticky Score Tracker -->
    <div class="header-sticky">
        <div class="header-container">
            <div class="header-title">Microbio Quiz 2 Review</div>
            <div class="score-box" id="scoreDisplay">Score: 0 / 27 (0%)</div>
        </div>
        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progressBar"></div>
        </div>
    </div>

    <!-- Main Question Container -->
    <div class="quiz-container" id="quizContainer"></div>

    <!-- Final Summary Container -->
    <div class="quiz-container">
        <div class="summary-card" id="summaryCard">
            <div class="summary-title" id="summaryTitle">Quiz Completed!</div>
            <div class="summary-score" id="finalScore">0 / 27</div>
            <div class="summary-text" id="summaryFeedback">Here is your performance breakdown.</div>
            <button class="reset-btn" onclick="resetQuiz()">Retake Quiz</button>
        </div>
    </div>

    <script>
        /* =========================================================
           QUIZ 2 QUESTION SET (Lecture 2 through Lecture 3: Measuring Growth)
           Answer key indices randomized across 0 (A), 1 (B), 2 (C), 3 (D)
           ========================================================= */
        const questions = [
            {
                question: "According to the lecture, what material marks the beginning of the scope for Quiz 2 right after Endospores?",
                options: [
                    "Abiogenesis and biogenesis experiments",
                    "Bacterial cell wall synthesis and penicillin target sites",
                    "Bacterial shapes, arrangements, and unusual bacteria",
                    "Glycolysis and fermentation pathways"
                ],
                correct: 2,
                explanation: "The lecture transcript explicitly notes that right after endospores, bacterial shapes, arrangements, and unusual bacteria mark the start of Quiz 2 material[cite: 3, 5]."
            },
            {
                question: "Which bacterial morphology term describes spherical cells arranged in characteristic chain-like patterns?",
                options: [
                    "Staphylococci",
                    "Streptococci",
                    "Sarcina",
                    "Coccobacilli"
                ],
                correct: 1,
                explanation: "Streptococci are cocci that divide in a single plane and remain attached to form chain-like arrangements[cite: 2, 5]."
            },
            {
                question: "Which bacterial arrangement is characterized by cocci dividing in perpendicular planes to form regular cubical packets of 8 or more cells?",
                options: [
                    "Tetrads",
                    "Streptobacilli",
                    "Sarcina",
                    "Staphylococci"
                ],
                correct: 2,
                explanation: "Sarcina refers to a cubical packet of 8, 16, or more cocci resulting from division along three perpendicular planes[cite: 2, 5]."
            },
            {
                question: "How are staphylococcal cellular arrangements produced during bacterial division?",
                options: [
                    "Division in multiple random planes forming irregular grape-like clusters",
                    "Division along a single axis without separation forming long chains",
                    "Division in two fixed perpendicular planes forming flat groups of four",
                    "Endospore germination yielding branching filament networks"
                ],
                correct: 0,
                explanation: "Staphylococci divide in multiple random planes, creating irregular clusters that resemble bunches of grapes[cite: 2, 5]."
            },
            {
                question: "Which bacterial genus is clinically unique because its species completely lack a peptidoglycan cell wall and contain sterols in their plasma membrane?",
                options: [
                    "Chlamydia",
                    "Rickettsia",
                    "Mycoplasma",
                    "Mycobacterium"
                ],
                correct: 2,
                explanation: "Mycoplasma species lack a cell wall entirely and stabilize their plasma membrane using sterols acquired from the environment[cite: 1, 2]."
            },
            {
                question: "Why are Rickettsia and Chlamydia classified as obligate intracellular bacteria?",
                options: [
                    "They require acidic endosomal environments to synthesize peptidoglycan",
                    "They cannot reproduce or generate sufficient ATP outside of a host cell",
                    "They possess eukaryotic 80S ribosomes that require host cytoplasmic factors",
                    "They lack plasma membranes and rely on host phospholipid bilayers"
                ],
                correct: 1,
                explanation: "Rickettsia and Chlamydia are obligate intracellular parasites because they rely on host metabolic machinery and host cells to survive and replicate[cite: 1, 2]."
            },
            {
                question: "Which unusual bacterial group is responsible for vector-borne diseases such as Rocky Mountain Spotted Fever and Typhus?",
                options: [
                    "Mycoplasma species",
                    "Rickettsia species",
                    "Cyanobacteria",
                    "Archaea"
                ],
                correct: 1,
                explanation: "Rickettsia species are obligate intracellular bacteria transmitted by arthropod vectors (ticks, lice, fleas) causing diseases like Rocky Mountain Spotted Fever and typhus[cite: 1, 2]."
            },
            {
                question: "Which classification includes human bacterial pathogens that utilize pre-formed organic compounds for both their carbon and energy sources?",
                options: ["Photoautotrophs", "Chemoautotrophs", "Chemoheterotrophs", "Photoheterotrophs"],
                correct: 2,
                explanation: "Chemoheterotrophs derive both carbon and energy from organic substrates; nearly all human bacterial pathogens fall into this category[cite: 1, 2]."
            },
            {
                question: "What term defines organisms that live exclusively on dead or decaying organic matter to obtain nutrients?",
                options: [
                    "Obligate parasites",
                    "Saprophytes (Saprobes)",
                    "Lithoautotrophs",
                    "Commensals"
                ],
                correct: 1,
                explanation: "Saprophytes (or saprobes) decompose dead organic material to obtain nutrients[cite: 1, 2]."
            },
            {
                question: "Human pathogens typically grow best at human body temperature (~37°C). Into which temperature preference group do they fall?",
                options: [
                    "Psychrophiles",
                    "Mesophiles",
                    "Thermophiles",
                    "Hyperthermophiles"
                ],
                correct: 1,
                explanation: "Mesophiles have optimal growth temperatures between 20°C and 40°C, encompassing human body temperature (37°C) and most human pathogens[cite: 1, 2]."
            },
            {
                question: "Which microbial temperature group is adapted to cold environments (optimal growth around 15°C or below) and can grow at 0°C?",
                options: [
                    "Psychrophiles",
                    "Mesophiles",
                    "Thermophiles",
                    "Alkaliphiles"
                ],
                correct: 0,
                explanation: "Psychrophiles thrive in cold temperatures (0°C to 15°C)[cite: 1, 2]."
            },
            {
                question: "An organism that grows optimally in oxygen but can also survive and ferment in the absence of oxygen is classified as a(n):",
                options: [
                    "Obligate aerobe",
                    "Facultative anaerobe",
                    "Obligate anaerobe",
                    "Microaerophile"
                ],
                correct: 1,
                explanation: "Facultative anaerobes utilize oxygen when available for aerobic respiration, but switch to fermentation or anaerobic respiration when oxygen is absent[cite: 1, 2]."
            },
            {
                question: "Why is oxygen toxic to obligate anaerobes?",
                options: [
                    "Oxygen inactivates cytoplasmic 70S ribosomes instantly",
                    "They lack protective enzymes like superoxide dismutase (SOD) and catalase to detoxify reactive oxygen species",
                    "Oxygen degrades peptidoglycan cross-links in Gram-positive cell walls",
                    "Oxygen prevents binary fission by binding to origin of replication sites"
                ],
                correct: 1,
                explanation: "Obligate anaerobes lack enzymes such as superoxide dismutase (SOD) and catalase/peroxidase, causing accumulation of lethal reactive oxygen species (ROS) in the presence of oxygen[cite: 1, 2]."
            },
            {
                question: "Which enzyme detoxifies superoxide free radicals ($O_2^-$) by converting them into hydrogen peroxide ($H_2O_2$) and oxygen?",
                options: [
                    "Catalase",
                    "Peroxidase",
                    "Superoxide dismutase (SOD)",
                    "Coagulase"
                ],
                correct: 2,
                explanation: "Superoxide dismutase (SOD) converts superoxide radicals into hydrogen peroxide and molecular oxygen: $2O_2^- + 2H^+ \rightarrow H_2O_2 + O_2$[cite: 1, 2]."
            },
            {
                question: "Which test differentiates Staphylococcus (catalase-positive) from Streptococcus (catalase-negative) by observing gas bubble formation upon adding hydrogen peroxide?",
                options: [
                    "Oxidase test",
                    "Catalase test",
                    "Coagulase test",
                    "Urease test"
                ],
                correct: 1,
                explanation: "The catalase test uses hydrogen peroxide ($H_2O_2$). Catalase-positive organisms break it down into $H_2O$ and oxygen gas ($O_2$), producing visible bubbling[cite: 1, 2]."
            },
            {
                question: "Microaerophiles require which environmental condition for optimal growth?",
                options: [
                    "Atmospheric oxygen levels (21% $O_2$)",
                    "Complete absence of oxygen",
                    "Low concentrations of oxygen (typically 2% to 10% $O_2$)",
                    "High salt concentrations (>15% NaCl) regardless of oxygen"
                ],
                correct: 2,
                explanation: "Microaerophiles require reduced oxygen levels (2–10%) and are harmed by higher atmospheric oxygen levels[cite: 1, 2]."
            },
            {
                question: "Organisms that adapt to or require high osmotic pressure and elevated salt concentrations are classified as:",
                options: [
                    "Acidophiles",
                    "Halophiles",
                    "Barophiles",
                    "Psychrophiles"
                ],
                correct: 1,
                explanation: "Halophiles thrive in environments with high salt (NaCl) concentrations and high osmotic pressure[cite: 1, 2]."
            },
            {
                question: "What type of symbiotic relationship exists when one organism benefits while the host is neither helped nor harmed?",
                options: [
                    "Mutualism",
                    "Commensalism",
                    "Parasitism",
                    "Synergism"
                ],
                correct: 1,
                explanation: "Commensalism is a relationship where one organism benefits and the other remains unaffected[cite: 1, 2]."
            },
            {
                question: "Which term describes a non-symbiotic relationship where two or more free-living organisms cooperate and share nutrients to produce a result neither could achieve alone?",
                options: [
                    "Antagonism",
                    "Synergism",
                    "Parasitism",
                    "Commensalism"
                ],
                correct: 1,
                explanation: "Synergism is an inter-relationship where participating organisms cooperate and share benefits[cite: 1, 2]."
            },
            {
                question: "An antagonistic interaction in which one microorganism produces specific inhibitory chemical substances (such as antibiotics) that suppress or kill competing microbes is known as:",
                options: [
                    "Mutualism",
                    "Antibiosis",
                    "Commensalism",
                    "Neutralism"
                ],
                correct: 1,
                explanation: "Antibiosis (an example of microbial antagonism) occurs when one species secretes inhibitory chemicals into the environment to damage or destroy competitors[cite: 1, 2]."
            },
            {
                question: "What is the primary mechanism of asexual reproduction in most bacteria, where one parent cell splits into two equal daughter cells?",
                options: [
                    "Budding",
                    "Binary fission (Binary transverse fission)",
                    "Sporulation",
                    "Fragmentation"
                ],
                correct: 1,
                explanation: "Binary fission is the primary asexual division process in prokaryotes[cite: 1, 2]."
            },
            {
                question: "The time required for a bacterial population to double in number through binary fission is called the:",
                options: [
                    "Lag period",
                    "Generation time (Doubling time)",
                    "Stationary index",
                    "Thermal death time"
                ],
                correct: 1,
                explanation: "Generation time (or doubling time) is the duration required for a bacterial population to undergo one round of binary fission and double in size[cite: 1, 2]."
            },
            {
                question: "During which phase of the bacterial growth curve are cells metabolically active and synthesizing enzymes, but NOT yet actively dividing?",
                options: [
                    "Lag phase",
                    "Log (Exponential) phase",
                    "Stationary phase",
                    "Death phase"
                ],
                correct: 0,
                explanation: "During the Lag phase, cells adjust to their new environment, synthesize necessary enzymes, and grow in size without an immediate increase in cell number[cite: 1, 2]."
            },
            {
                question: "During which phase of the bacterial growth curve are cells dividing at a maximum constant rate, making them most susceptible to antibiotics like penicillin?",
                options: [
                    "Lag phase",
                    "Log (Exponential) phase",
                    "Stationary phase",
                    "Decline phase"
                ],
                correct: 1,
                explanation: "The Log (Exponential) phase is characterized by maximum growth rate and cell wall synthesis, rendering cells highly vulnerable to cell-wall targeting antibiotics[cite: 1, 2]."
            },
            {
                question: "What causes a bacterial population to enter the Stationary Phase of growth?",
                options: [
                    "Reactivation of endospore formation genes across all species",
                    "Depletion of essential nutrients and accumulation of toxic metabolic waste products",
                    "Exposure to ultraviolet light and radiation in culture flasks",
                    "Complete loss of flagellar motility in liquid media"
                ],
                correct: 1,
                explanation: "Nutrient exhaustion and accumulation of organic acids/toxic waste slow growth until the rate of cell division equals the rate of cell death[cite: 1, 2]."
            },
            {
                question: "Which bacterial growth measurement method relies on a spectrophotometer to gauge light transmission/absorbance through a liquid broth culture?",
                options: [
                    "Direct Microscopic Count",
                    "Turbidity measurement",
                    "Standard Plate Count",
                    "Flow Cytometry"
                ],
                correct: 1,
                explanation: "Turbidity measures the cloudiness of a culture using a spectrophotometer; greater absorbance corresponds to higher cell density[cite: 1, 2]."
            },
            {
                question: "According to the transcript, which advanced method of measuring bacterial growth utilizes sheath fluid, lasers, and detectors to count/sort cells, but hasn't fully appeared on board exams yet?",
                options: [
                    "Standard Plate Count",
                    "Turbidity measurement",
                    "Flow Cytometry",
                    "Direct Petroff-Hausser counting"
                ],
                correct: 2,
                explanation: "The transcript explicitly mentions that flow cytometry uses fluidics and lasers to count/sort cells, noting it as an advanced method that 'boards hasn't quite caught up to... just yet'[cite: 3]."
            }
        ];

        let currentAnswers = new Array(questions.length).fill(null);

        function renderQuiz() {
            const container = document.getElementById('quizContainer');
            container.innerHTML = '';

            questions.forEach((q, index) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `q-card-${index}`;

                let optionsHTML = '';
                q.options.forEach((opt, optIdx) => {
                    optionsHTML += `
                        <button class="option-btn" 
                                id="btn-${index}-${optIdx}" 
                                onclick="selectOption(${index}, ${optIdx})">
                            <span style="margin-right: 10px; font-weight: 800; color: var(--primary-accent);">${String.fromCharCode(65 + optIdx)}.</span> ${opt}
                        </button>
                    `;
                });

                card.innerHTML = `
                    <div class="question-header">Question ${index + 1} of ${questions.length}</div>
                    <div class="question-text">${q.question}</div>
                    <div class="options-list">${optionsHTML}</div>
                    <div class="explanation-box" id="exp-${index}"></div>
                `;

                container.appendChild(card);
            });
        }

        function selectOption(qIdx, selectedOptIdx) {
            if (currentAnswers[qIdx] !== null) return; // Lock question once clicked

            currentAnswers[qIdx] = selectedOptIdx;
            const q = questions[qIdx];
            const isCorrect = selectedOptIdx === q.correct;

            q.options.forEach((_, optIdx) => {
                const btn = document.getElementById(`btn-${qIdx}-${optIdx}`);
                btn.disabled = true;

                if (optIdx === q.correct) {
                    btn.classList.add('correct-choice');
                } else if (optIdx === selectedOptIdx) {
                    btn.classList.add('incorrect-choice');
                } else {
                    btn.classList.add('dimmed');
                }
            });

            const expBox = document.getElementById(`exp-${qIdx}`);
            expBox.classList.add('visible', isCorrect ? 'correct' : 'incorrect');
            expBox.innerHTML = `
                <div class="explanation-title">${isCorrect ? '✓ Correct' : '✗ Incorrect'}</div>
                <div>${q.explanation}</div>
            `;

            updateScore();
        }

        function updateScore() {
            const answeredCount = currentAnswers.filter(a => a !== null).length;
            const correctCount = currentAnswers.reduce((acc, ans, idx) => {
                return ans === questions[idx].correct ? acc + 1 : acc;
            }, 0);

            const percentage = Math.round((correctCount / questions.length) * 100);
            
            document.getElementById('scoreDisplay').innerText = `Score: ${correctCount} / ${questions.length} (${percentage}%)`;
            document.getElementById('progressBar').style.width = `${(answeredCount / questions.length) * 100}%`;

            if (answeredCount === questions.length) {
                showSummary(correctCount, percentage);
            }
        }

        function showSummary(correctCount, percentage) {
            const summaryCard = document.getElementById('summaryCard');
            const finalScore = document.getElementById('finalScore');
            const feedback = document.getElementById('summaryFeedback');

            finalScore.innerText = `${correctCount} / ${questions.length} (${percentage}%)`;

            if (percentage >= 90) {
                feedback.innerText = "Outstanding mastery of Microbio Quiz 2 material!";
            } else if (percentage >= 75) {
                feedback.innerText = "Solid understanding! Review growth curve phases and oxygen enzymes before the test.";
            } else {
                feedback.innerText = "Good effort. Re-read the lecture transcript on bacterial growth and retry!";
            }

            summaryCard.classList.add('visible');
            summaryCard.scrollIntoView({ behavior: 'smooth' });
        }

        function resetQuiz() {
            currentAnswers = new Array(questions.length).fill(null);
            document.getElementById('summaryCard').classList.remove('visible');
            document.getElementById('scoreDisplay').innerText = `Score: 0 / ${questions.length} (0%)`;
            document.getElementById('progressBar').style.width = '0%';
            renderQuiz();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.onload = renderQuiz;
    </script>
</body>
</html>
