<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Microbiology Quiz 2 Interactive Practice Hub</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --primary-accent: #ff9900;
            --correct-color: #22c55e;
            --correct-bg: #14532d;
            --incorrect-color: #ef4444;
            --incorrect-bg: #7f1d1d;
            --border-color: #333333;
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.5);
            --shadow-md: 0 4px 10px rgba(0,0,0,0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.5;
            padding-bottom: 40px;
        }

        .header-sticky {
            position: -webkit-sticky;
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: var(--card-bg);
            border-bottom: 2px solid var(--primary-accent);
            padding: 12px 20px;
            box-shadow: var(--shadow-sm);
        }

        .header-container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary-accent);
        }

        .score-box {
            font-size: 1rem;
            font-weight: 600;
            background-color: #262626;
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background-color: var(--border-color);
            position: absolute;
            bottom: 0;
            left: 0;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background-color: var(--primary-accent);
            transition: width 0.3s ease;
        }

        .quiz-container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 16px;
        }

        .question-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }

        .question-header {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--primary-accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 18px;
            color: var(--text-primary);
        }

        .options-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            width: 100%;
            text-align: left;
            padding: 14px 16px;
            font-size: 0.95rem;
            color: var(--text-primary);
            background-color: #262626;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary-accent);
            background-color: #333333;
        }

        .option-btn:disabled {
            cursor: default;
        }

        .option-btn.correct-choice {
            background-color: var(--correct-bg) !important;
            border-color: var(--correct-color) !important;
            color: #ffffff !important;
            font-weight: 600;
        }

        .option-btn.incorrect-choice {
            background-color: var(--incorrect-bg) !important;
            border-color: var(--incorrect-color) !important;
            color: #ffffff !important;
            font-weight: 600;
        }

        .option-btn.dimmed {
            opacity: 0.4;
        }

        .explanation-box {
            margin-top: 16px;
            padding: 14px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            line-height: 1.5;
            display: none;
        }

        .explanation-box.visible {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .explanation-box.correct {
            background-color: var(--correct-bg);
            border-left: 4px solid var(--correct-color);
            color: #d1fae5;
        }

        .explanation-box.incorrect {
            background-color: var(--incorrect-bg);
            border-left: 4px solid var(--incorrect-color);
            color: #fee2e2;
        }

        .summary-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--primary-accent);
            display: none;
        }

        .summary-card.visible {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        .summary-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .summary-score {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--primary-accent);
            margin-bottom: 16px;
        }

        .summary-text {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .reset-btn {
            background-color: var(--primary-accent);
            color: #000000;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .reset-btn:hover {
            background-color: #e68a00;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="header-sticky">
        <div class="header-container">
            <div class="header-title">Microbiology: Quiz 2 Practice Hub</div>
            <div class="score-box" id="scoreDisplay">Score: 0 / 35 (0%)</div>
        </div>
        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progressBar"></div>
        </div>
    </div>

    <div class="quiz-container" id="quizContainer"></div>

    <div class="quiz-container">
        <div class="summary-card" id="summaryCard">
            <div class="summary-title" id="summaryTitle">Quiz Completed!</div>
            <div class="summary-score" id="finalScore">0 / 35</div>
            <div class="summary-text" id="summaryFeedback">Here is your performance breakdown.</div>
            <button class="reset-btn" onclick="resetQuiz()">Retake Quiz</button>
        </div>
    </div>

    <script>
        const quizData = [
            /* =========================================================
               PART 1: UNUSUAL BACTERIA (CROSS-DISTRACTOR QUESTIONS)
               ========================================================= */
            {
                question: "Which unusual bacterium is characterized by a complete absence of a peptidoglycan cell wall, pleomorphic morphology, and membrane-stabilizing sterols that resist osmotic lysis?",
                options: ["Rickettsia", "Chlamydia", "Mycoplasma", "Mycobacteria"],
                correct: 2,
                explanation: "Mycoplasma completely lacks a peptidoglycan cell wall and incorporates sterols into its plasma membrane to prevent osmotic lysis."
            },
            {
                question: "Which unusual bacterium is an obligate intracellular parasite that causes vector-borne typhus and Rocky Mountain spotted fever due to possessing leaky cell membranes?",
                options: ["Chlamydia", "Rickettsia", "Mycoplasma", "Archaea"],
                correct: 1,
                explanation: "Rickettsia species are obligate intracellular parasites with leaky cell membranes that prevent them from surviving long outside of host cells; they rely on arthropod vectors like ticks and lice."
            },
            {
                question: "Which unusual bacterium is an obligate intracellular parasite that lacks the metabolic enzymes necessary to synthesize its own ATP and is transmitted primarily by direct contact (sexual or birth)?",
                options: ["Rickettsia", "Mycobacteria", "Cyanobacteria", "Chlamydia"],
                correct: 3,
                explanation: "Chlamydia lacks essential metabolic enzymes to generate its own ATP ('steals host ATP') and spreads via direct sexual contact or during birth."
            },
            {
                question: "Which unusual bacterial group is classified as acid-fast because its thick, waxy cell wall is loaded with large amounts of mycolic acid that contribute to pathogenicity?",
                options: ["Mycobacteria", "Mycoplasma", "Rickettsia", "Chlamydia"],
                correct: 0,
                explanation: "Mycobacteria possess thick, waxy cell walls rich in mycolic acid, giving them acid-fast staining characteristics and environmental durability."
            },
            {
                question: "Which unusual prokaryotic group consists primarily of extremophiles whose cell membranes utilize branched hydrocarbons instead of phospholipids and whose cell walls lack peptidoglycan?",
                options: ["Mycoplasma", "Archaeans", "Mycobacteria", "Green sulfur bacteria"],
                correct: 1,
                explanation: "Archaeans are unique prokaryotes thriving in extreme environments; their cell membranes utilize ether-linked hydrocarbons rather than phospholipids, and their walls lack peptidoglycan."
            },
            {
                question: "How do photosynthetic Cyanobacteria differ metabolically from purple and green photosynthetic bacteria?",
                options: [
                    "Cyanobacteria carry out anoxygenic photosynthesis, while purple and green bacteria produce oxygen",
                    "Cyanobacteria carry out oxygenic photosynthesis, whereas purple and green bacteria are anoxygenic",
                    "Cyanobacteria lack cell walls, while purple and green bacteria possess mycolic acid",
                    "Cyanobacteria are obligate intracellular parasites that cannot generate ATP"
                ],
                correct: 1,
                explanation: "Cyanobacteria perform oxygenic photosynthesis (generating O2), whereas purple and green sulfur bacteria perform anoxygenic photosynthesis without oxygen generation."
            },

            /* =========================================================
               PART 2: BACTERIAL SHAPES & CELL ARRANGEMENTS
               ========================================================= */
            {
                question: "You examine a bacterial specimen under the microscope and observe spherical cells grouped in chains. What is this morphology called?",
                options: ["Staphylococci", "Sarcina", "Streptococci", "Diplococci"],
                correct: 2,
                explanation: "Streptococci are cocci that divide along a single axis to produce continuous chain-like formations."
            },
            {
                question: "Why do staphylococci form irregular, grape-like clusters instead of simple chains?",
                options: [
                    "They divide along multiple, random planes of division",
                    "They lack cell walls and slide over one another",
                    "They divide strictly along two perpendicular axes",
                    "They possess peritrichous flagella that bundle them together"
                ],
                correct: 0,
                explanation: "Staphylococci divide across multiple random axes and planes, causing daughter cells to form irregular, grape-like clusters."
            },
            {
                question: "Which arrangement is characterized by cocci dividing in perpendicular planes to form regular cubical packets of 8 or more cells?",
                options: ["Tetrads", "Streptobacilli", "Sarcina", "Palisades"],
                correct: 2,
                explanation: "Sarcina refers to a cubical packet of 8, 16, or more cocci produced by division in three regular perpendicular planes."
            },
            {
                question: "Which term describes a bacterial cell shape that is intermediate between a sphere and a rod, resembling a short oval?",
                options: ["Coccobacillus", "Vibrio", "Spirillum", "Spirochete"],
                correct: 0,
                explanation: "A coccobacillus is an oval-shaped cell intermediate between a true coccus (sphere) and a bacillus (rod)."
            },
            {
                question: "What morphology describes rigid helical rods, as opposed to flexible corkscrews with axial filaments?",
                options: ["Spirochetes", "Spirilla", "Coccobacilli", "Palisades"],
                correct: 1,
                explanation: "Spirilla are rigid, spiral-shaped bacteria. Spirochetes are flexible spirals with internal periplasmic axial filaments."
            },
            {
                question: "Bacteria that appear as rods arranged end-to-end in chains are classified morphologically as:",
                options: ["Streptococci", "Streptobacilli", "Diplococci", "Palisades"],
                correct: 1,
                explanation: "Streptobacilli are rod-shaped cells (bacilli) remaining joined end-to-end in filamentous chains after division."
            },

            /* =========================================================
               PART 3: VIRULENCE, TOXINS & INVASIVE FACTORS
               ========================================================= */
            {
                question: "When comparing cellular structures within the glycocalyx category, which structure is considered MORE virulent due to its organized matrix that prevents phagocytosis?",
                options: ["Slime layer", "Capsule", "Biofilm matrix", "Axial filament"],
                correct: 1,
                explanation: "Within the glycocalyx category, a capsule is significantly more virulent than a slime layer because its dense, organized structure blocks phagocytic engulfment by host macrophages."
            },
            {
                question: "Which bacterial invasive exoenzyme acts as a chemical 'battering ram' by digesting the protective mucosal lining of host membranes?",
                options: ["Keratinase", "Mucinase", "Collagenase", "Hyaluronidase"],
                correct: 1,
                explanation: "Mucinase digests the mucous membrane lining, allowing pathogens to penetrate protective mucosal barriers."
            },
            {
                question: "Which bacterial exoenzyme degrades the primary structural protein found in skin, hair, and nails to facilitate tissue invasion?",
                options: ["Mucinase", "Coagulase", "Keratinase", "Lipase"],
                correct: 2,
                explanation: "Keratinase digests keratin, the principal structural protein of host skin, hair, and nails."
            },
            {
                question: "Which invasive exoenzyme breaks down the structural fibrous protein of host connective tissue?",
                options: ["Collagenase", "Mucinase", "Keratinase", "Amylase"],
                correct: 0,
                explanation: "Collagenase dissolves collagen, the major fibrous protein of host connective tissues, facilitating deep tissue spread."
            },
            {
                question: "Which bacterial exoenzyme breaks down the intercellular cement holding host animal tissue cells together?",
                options: ["Hyaluronidase", "Collagenase", "Mucinase", "Coagulase"],
                correct: 0,
                explanation: "Hyaluronidase digests hyaluronic acid, the ground substance and cement that binds host cells together, facilitating bacterial tissue penetration."
            },
            {
                question: "Which bacterial virulence factor is specifically classified as an avoidance factor because it is toxic to and destroys host white blood cells?",
                options: ["Mucinase", "Leukocidin (Leukocidase)", "Hyaluronidase", "Collagenase"],
                correct: 1,
                explanation: "Leukocidins (leukocidases) are extracellular bacterial avoidance factors that directly damage and kill white blood cells (phagocytes)."
            },
            {
                question: "What is the major structural endotoxin of the bacterial world, and where is it located?",
                options: [
                    "Peptidoglycan of Gram-positive cell walls",
                    "Lipopolysaccharide (LPS) in the outer membrane of Gram-negative cell walls",
                    "Teichoic acid in Gram-positive cell walls",
                    "Mycolic acid in acid-fast bacteria"
                ],
                correct: 1,
                explanation: "Lipopolysaccharide (LPS / Lipid A), located in the outer membrane of Gram-negative bacteria, is released upon lysis and acts as the classic bacterial endotoxin triggering severe fever and shock."
            },
            {
                question: "Which mode of pathogen transmissibility is considered the most virulent due to rapid dispersion and high inhalation potential?",
                options: ["Airborne transmission", "Direct contact transmission", "Fecal-oral transmission", "Vector-borne transmission"],
                correct: 0,
                explanation: "Airborne transmission allows microscopic droplets and droplet nuclei to travel rapidly through the air, making it the most virulent mode of entry."
            },
            {
                question: "What is the relationship between inoculum size (infectious dose) and a pathogen's virulence?",
                options: [
                    "A higher infectious dose indicates higher virulence",
                    "A lower infectious dose indicates higher virulence",
                    "Infectious dose is unrelated to virulence",
                    "Infectious dose applies only to opportunistic fungi"
                ],
                correct: 1,
                explanation: "Virulence is inversely proportional to infectious dose: the fewer organisms required to establish disease, the higher the virulence."
            },

            /* =========================================================
               PART 4: NUTRITION, ENVIRONMENTAL FACTORS & SYMBIOSIS
               ========================================================= */
            {
                question: "Bacteria that lack the genetic and metabolic machinery to synthesize every organic compound required for survival and must obtain pre-formed growth factors are called:",
                options: ["Fastidious bacteria", "Saprophytes", "Obligate halophiles", "Chemoautotrophs"],
                correct: 0,
                explanation: "Fastidious bacteria require special nutritional supplements or growth factors (vitamins, amino acids) because they cannot synthesize them independently."
            },
            {
                question: "Most human bacterial pathogens derive both their carbon and energy from pre-formed organic compounds. What nutritional category do they belong to?",
                options: ["Photoautotrophs", "Chemoheterotrophs", "Chemoautotrophs", "Photoheterotrophs"],
                correct: 1,
                explanation: "Chemoheterotrophs obtain both carbon and energy from organic compounds; nearly all human bacterial pathogens fall into this category."
            },
            {
                question: "Organisms that feed specifically on dead and decaying organic matter are classified as:",
                options: ["Saprophytes (Saprobes)", "Photoautotrophs", "Obligate intracellular parasites", "Lithoautotrophs"],
                correct: 0,
                explanation: "Saprophytes (or saprobes) are heterotrophs that decompose and obtain nutrients from dead organic matter."
            },
            {
                question: "Which active transport mechanism chemically alters a nutrient molecule (e.g., phosphorylation) as it is transported across the membrane?",
                options: ["Simple diffusion", "Facilitated transport", "Osmosis", "Group translocation"],
                correct: 3,
                explanation: "Group translocation is a form of active transport where a substance is chemically modified while being moved across the membrane."
            },
            {
                question: "Which temperature classification encompasses bacteria that grow optimally between 20°C and 40°C, including normal human body temperature (~37°C)?",
                options: ["Psychrophiles", "Mesophiles", "Thermophiles", "Hyperthermophiles"],
                correct: 1,
                explanation: "Mesophiles have optimal growth between 20°C and 40°C, encompassing human body temperature (37°C) and the vast majority of human pathogens."
            },
            {
                question: "What term describes cold-loving microorganisms that have an optimal growth temperature at or below 15°C and can grow at 0°C?",
                options: ["Thermophiles", "Acidophiles", "Psychrophiles", "Mesophiles"],
                correct: 2,
                explanation: "Psychrophiles are cold-adapted organisms whose optimal growth occurs at 15°C or lower."
            },
            {
                question: "Which group of organisms thrives in hot environments, with optimal growth occurring at temperatures exceeding 45°C to 80°C?",
                options: ["Thermophiles", "Psychrophiles", "Mesophiles", "Halophiles"],
                correct: 0,
                explanation: "Thermophiles are heat-adapted organisms whose optimal growth occurs at elevated temperatures, typically above 45°C."
            },
            {
                question: "What set of protective enzymes do aerobic organisms utilize to neutralize toxic reactive oxygen species (ROS)?",
                options: [
                    "Amylase, lipase, and protease",
                    "Superoxide dismutase, peroxidase, and catalase",
                    "DNA polymerase, ligase, and helicase",
                    "Coagulase, kinase, and hyaluronidase"
                ],
                correct: 1,
                explanation: "Superoxide dismutase (SOD), peroxidase, and catalase neutralize hazardous oxygen radicals (O2- and H2O2) into water and oxygen."
            },
            {
                question: "Why are obligate (strict) anaerobes killed or inhibited by exposure to atmospheric oxygen?",
                options: [
                    "They lack protective enzymes like superoxide dismutase and catalase to detoxify reactive oxygen byproducts",
                    "Oxygen destroys their cytoplasmic 70S ribosomes immediately",
                    "Oxygen causes their peptidoglycan cell walls to dissolve",
                    "They lack a plasma membrane"
                ],
                correct: 0,
                explanation: "Obligate anaerobes lack SOD and catalase/peroxidase; exposure to oxygen leads to lethal accumulation of reactive oxygen species."
            },
            {
                question: "How do facultative anaerobes behave when environmental oxygen is completely depleted?",
                options: [
                    "They immediately lyse and die",
                    "They form endospores and remain dormant indefinitely",
                    "They switch from aerobic respiration to fermentation or anaerobic respiration",
                    "They rely on phototaxis to generate ATP"
                ],
                correct: 2,
                explanation: "Facultative anaerobes utilize oxygen when available, but switch to fermentation or anaerobic respiration when oxygen is absent."
            },
            {
                question: "Microorganisms that require high osmotic pressure and elevated salt (NaCl) concentrations to survive are known as:",
                options: ["Halophiles", "Barophiles", "Psychrophiles", "Acidophiles"],
                correct: 0,
                explanation: "Halophiles are microbes adapted to high osmotic pressure requiring elevated salt concentrations for structural integrity."
            },
            {
                question: "What is the key differentiator between Synergism and Mutualism?",
                options: [
                    "Synergism involves obligate parasitism",
                    "Synergism occurs only in viruses",
                    "Synergism is an antagonistic interaction",
                    "Synergism is a non-symbiotic cooperation where organisms benefit together but are not interdependent for survival"
                ],
                correct: 3,
                explanation: "In mutualism, organisms are interdependent for survival. In synergism, organisms cooperate and share nutrients, but their association is non-obligatory."
            },

            /* =========================================================
               PART 5: BACTERIAL REPRODUCTION, ENDOSPORES & GROWTH
               ========================================================= */
            {
                question: "What is the primary biological function of bacterial endospore formation?",
                options: [
                    "Cellular reproduction and genetic recombination",
                    "Long-term survival under adverse environmental conditions (desiccation, heat, lack of nutrients)",
                    "Facilitating binary fission in hypotonic environments",
                    "Increasing the rate of horizontal gene transfer"
                ],
                correct: 1,
                explanation: "Endospore formation is strictly a survival mechanism (not reproduction) triggered by nutrient depletion, desiccation, or harsh conditions to preserve the bacterial genome."
            },
            {
                question: "During which phase of the bacterial growth curve is the population growing and dividing at its maximum, constant geometric rate?",
                options: ["Stationary phase", "Lag phase", "Log (Exponential) phase", "Decline phase"],
                correct: 2,
                explanation: "The Log (Exponential) phase is the period of maximum, steady cellular division where the population doubles at regular intervals."
            }
        ];

        let activeQuestions = [];
        let currentAnswers = [];

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function renderQuiz() {
            activeQuestions = shuffleArray(JSON.parse(JSON.stringify(quizData)));
            currentAnswers = new Array(activeQuestions.length).fill(null);

            const container = document.getElementById('quizContainer');
            container.innerHTML = '';

            activeQuestions.forEach((q, index) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `q-card-${index}`;

                let optionsHTML = '';
                q.options.forEach((opt, optIdx) => {
                    optionsHTML += `
                        <button class="option-btn" 
                                id="btn-${index}-${optIdx}" 
                                onclick="selectOption(${index}, ${optIdx})">
                            <span style="font-weight: 700; color: var(--primary-accent); margin-right: 8px;">${String.fromCharCode(65 + optIdx)}.</span> ${opt}
                        </button>
                    `;
                });

                card.innerHTML = `
                    <div class="question-header">Question ${index + 1} of ${activeQuestions.length}</div>
                    <div class="question-text">${q.question}</div>
                    <div class="options-list">${optionsHTML}</div>
                    <div class="explanation-box" id="exp-${index}"></div>
                `;

                container.appendChild(card);
            });

            document.getElementById('scoreDisplay').innerText = `Score: 0 / ${activeQuestions.length} (0%)`;
            document.getElementById('progressBar').style.width = '0%';
        }

        function selectOption(qIdx, selectedOptIdx) {
            if (currentAnswers[qIdx] !== null) return;

            currentAnswers[qIdx] = selectedOptIdx;
            const q = activeQuestions[qIdx];
            const isCorrect = selectedOptIdx === q.correct;

            q.options.forEach((_, optIdx) => {
                const btn = document.getElementById(`btn-${qIdx}-${optIdx}`);
                btn.disabled = true;

                if (optIdx === q.correct) {
                    btn.classList.add('correct-choice');
                } else if (optIdx === selectedOptIdx) {
                    btn.classList.add('incorrect-choice');
                } else {
                    btn.classList.add('dimmed');
                }
            });

            const expBox = document.getElementById(`exp-${qIdx}`);
            expBox.classList.add('visible', isCorrect ? 'correct' : 'incorrect');
            expBox.innerHTML = `<strong>${isCorrect ? '✓ Correct' : '✗ Incorrect'}</strong><br>${q.explanation}`;

            updateScore();
        }

        function updateScore() {
            const answeredCount = currentAnswers.filter(a => a !== null).length;
            const correctCount = currentAnswers.reduce((acc, ans, idx) => {
                return ans === activeQuestions[idx].correct ? acc + 1 : acc;
            }, 0);

            const percentage = Math.round((correctCount / activeQuestions.length) * 100);
            
            document.getElementById('scoreDisplay').innerText = `Score: ${correctCount} / ${activeQuestions.length} (${percentage}%)`;
            document.getElementById('progressBar').style.width = `${(answeredCount / activeQuestions.length) * 100}%`;

            if (answeredCount === activeQuestions.length) {
                showSummary(correctCount, percentage);
            }
        }

        function showSummary(correctCount, percentage) {
            const summaryCard = document.getElementById('summaryCard');
            const finalScore = document.getElementById('finalScore');
            const feedback = document.getElementById('summaryFeedback');

            finalScore.innerText = `${correctCount} / ${activeQuestions.length} (${percentage}%)`;

            if (percentage >= 90) {
                feedback.innerText = "Mastery demonstrated! You have thoroughly covered all Quiz 2 concepts.";
            } else if (percentage >= 75) {
                feedback.innerText = "Solid job! Review unusual bacteria and growth factors before testing.";
            } else {
                feedback.innerText = "Good practice run. Re-read Lecture 2 shapes/unusual bacteria and Lecture 3 growth factors and retake the quiz!";
            }

            summaryCard.classList.add('visible');
            summaryCard.scrollIntoView({ behavior: 'smooth' });
        }

        function resetQuiz() {
            document.getElementById('summaryCard').classList.remove('visible');
            renderQuiz();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.onload = renderQuiz;
    </script>
</body>
</html>
