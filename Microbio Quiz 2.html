<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Microbiology Quiz 2 Interactive Practice Hub</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --primary-accent: #ff9900;
            --correct-color: #22c55e;
            --correct-bg: #14532d;
            --incorrect-color: #ef4444;
            --incorrect-bg: #7f1d1d;
            --border-color: #333333;
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.5);
            --shadow-md: 0 4px 10px rgba(0,0,0,0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.5;
            padding-bottom: 40px;
        }

        .header-sticky {
            position: -webkit-sticky;
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: var(--card-bg);
            border-bottom: 2px solid var(--primary-accent);
            padding: 12px 20px;
            box-shadow: var(--shadow-sm);
        }

        .header-container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary-accent);
        }

        .score-box {
            font-size: 1rem;
            font-weight: 600;
            background-color: #262626;
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background-color: var(--border-color);
            position: absolute;
            bottom: 0;
            left: 0;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background-color: var(--primary-accent);
            transition: width 0.3s ease;
        }

        .quiz-container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 16px;
        }

        .question-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }

        .question-header {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--primary-accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 18px;
            color: var(--text-primary);
        }

        .options-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            width: 100%;
            text-align: left;
            padding: 14px 16px;
            font-size: 0.95rem;
            color: var(--text-primary);
            background-color: #262626;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary-accent);
            background-color: #333333;
        }

        .option-btn:disabled {
            cursor: default;
        }

        .option-btn.correct-choice {
            background-color: var(--correct-bg) !important;
            border-color: var(--correct-color) !important;
            color: #ffffff !important;
            font-weight: 600;
        }

        .option-btn.incorrect-choice {
            background-color: var(--incorrect-bg) !important;
            border-color: var(--incorrect-color) !important;
            color: #ffffff !important;
            font-weight: 600;
        }

        .option-btn.dimmed {
            opacity: 0.4;
        }

        .explanation-box {
            margin-top: 16px;
            padding: 14px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            line-height: 1.5;
            display: none;
        }

        .explanation-box.visible {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .explanation-box.correct {
            background-color: var(--correct-bg);
            border-left: 4px solid var(--correct-color);
            color: #d1fae5;
        }

        .explanation-box.incorrect {
            background-color: var(--incorrect-bg);
            border-left: 4px solid var(--incorrect-color);
            color: #fee2e2;
        }

        .summary-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--primary-accent);
            display: none;
        }

        .summary-card.visible {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        .summary-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .summary-score {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--primary-accent);
            margin-bottom: 16px;
        }

        .summary-text {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .reset-btn {
            background-color: var(--primary-accent);
            color: #000000;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .reset-btn:hover {
            background-color: #e68a00;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="header-sticky">
        <div class="header-container">
            <div class="header-title">Microbiology: Quiz 2 Practice Hub</div>
            <div class="score-box" id="scoreDisplay">Score: 0 / 30 (0%)</div>
        </div>
        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progressBar"></div>
        </div>
    </div>

    <div class="quiz-container" id="quizContainer"></div>

    <div class="quiz-container">
        <div class="summary-card" id="summaryCard">
            <div class="summary-title" id="summaryTitle">Quiz Completed!</div>
            <div class="summary-score" id="finalScore">0 / 30</div>
            <div class="summary-text" id="summaryFeedback">Here is your performance breakdown.</div>
            <button class="reset-btn" onclick="resetQuiz()">Retake Quiz</button>
        </div>
    </div>

    <script>
        const quizData = [
            {
                question: "You examine a bacterial specimen under the microscope and observe spherical cells grouped in chains. What is this morphology called?",
                options: ["Staphylococci", "Sarcina", "Streptococci", "Diplococci"],
                correct: 2,
                explanation: "Streptococci are spherical bacteria that divide along a single axis to produce continuous chain-like formations."
            },
            {
                question: "Why do staphylococci form irregular, grape-like clusters instead of simple chains?",
                options: ["They lack cell walls and slide over one another", "They divide along multiple, random axes", "They divide strictly in two perpendicular planes", "They possess peritrichous flagella that bundle them together"],
                correct: 1,
                explanation: "As explained in the transcript, true clusters (staphylococci) occur because these bacteria divide in a multi-axis direction, creating clusters that look like grapes."
            },
            {
                question: "Which term describes a bacterial cell shape that is intermediate between a sphere and a rod, resembling a short oval?",
                options: ["Coccobacillus", "Vibrio", "Spirillum", "Spirochete"],
                correct: 0,
                explanation: "The transcript notes that a coccobacillus is an intermediate oval shape: 'couldn't make up its mind... do I wanna be a rod, I wanna be a circle... so it's just a little oval shape.'"
            },
            {
                question: "What does the term 'pleomorphic' mean when describing the genus Mycoplasma?",
                options: ["Having a rigid helical structure", "Forming cubical packets of eight cells", "Forming endospores in response to starvation", "Having a variable or changeable shape due to the absence of a cell wall"],
                correct: 3,
                explanation: "Pleomorphic means variable in shape. Because Mycoplasma species lack a rigid peptidoglycan cell wall and only have a sterol-stabilized cell membrane, they can alter their shape."
            },
            {
                question: "Which of the following characteristics is true regarding Chlamydia and Rickettsia?",
                options: ["They are free-living photosynthetic autotrophs", "They are obligate intracellular parasites that rely on host cell machinery", "They contain eukaryotic 80S ribosomes", "They lack plasma membranes entirely"],
                correct: 1,
                explanation: "Rickettsia and Chlamydia are unusual bacteria classified as obligate intracellular parasites because they cannot carry out essential metabolic replication outside of host cells."
            },
            {
                question: "What unique component is found in large amounts in the cell wall of acid-fast bacteria like Mycobacterium?",
                options: ["Mycolic acid (waxy lipids)", "Pseudomurein", "Teichoic acid", "Ergosterol"],
                correct: 0,
                explanation: "Mycobacteria are acid-fast bacteria that contain exceptionally high concentrations of lipids, specifically mycolic acid, in their cell wall."
            },
            {
                question: "Which unusual prokaryotic group features membrane lipids with hydrocarbons instead of fatty acids and lacks peptidoglycan in its cell wall?",
                options: ["Archaea", "Mycoplasma", "Eubacteria", "Spirochetes"],
                correct: 0,
                explanation: "Archaea are unique prokaryotes with hydrocarbons linked to glycerol in their membranes and cell walls that lack peptidoglycan."
            },
            {
                question: "Most human bacterial pathogens derive both their carbon and energy from organic compounds. What nutritional category do they belong to?",
                options: ["Photoautotrophs", "Chemoheterotrophs", "Chemoautotrophs", "Photoheterotrophs"],
                correct: 1,
                explanation: "Chemoheterotrophs acquire both energy and carbon from organic chemical compounds. Nearly all human bacterial pathogens belong to this class."
            },
            {
                question: "Organisms that feed specifically on dead and decaying organic matter are termed:",
                options: ["Saprophytes (Saprobes)", "Photoautotrophs", "Obligate parasites", "Lithotrophs"],
                correct: 0,
                explanation: "Saprophytes (or saprobes) are heterotrophs that decompose and feed on dead organic matter."
            },
            {
                question: "Which nutrient acquisition mechanism couples transport of a substance with its chemical modification as it passes across the membrane?",
                options: ["Simple diffusion", "Facilitated transport", "Osmosis", "Group translocation (Active transport)"],
                correct: 3,
                explanation: "Group translocation is a form of active transport in which a substance is chemically altered (e.g., phosphorylated) as it is transported across the bacterial membrane."
            },
            {
                question: "Which temperature classification encompasses bacteria that grow optimally between 20°C and 40°C, including human body temperature (~37°C)?",
                options: ["Psychrophiles", "Mesophiles", "Thermophiles", "Hyperthermophiles"],
                correct: 1,
                explanation: "Mesophiles have optimal growth temperatures between 20°C and 40°C, representing human body temperature and the vast majority of human pathogens."
            },
            {
                question: "What term describes cold-loving microorganisms that have an optimal growth temperature at or below 15°C?",
                options: ["Thermophiles", "Acidophiles", "Psychrophiles", "Mesophiles"],
                correct: 2,
                explanation: "Psychrophiles are cold-loving organisms with optimal growth occurring at 15°C or lower."
            },
            {
                question: "Which group of organisms thrives in hot environments, typically at temperatures exceeding 45°C to 80°C?",
                options: ["Thermophiles", "Psychrophiles", "Mesophiles", "Halophiles"],
                correct: 0,
                explanation: "Thermophiles are heat-adapted organisms whose optimal growth occurs at elevated temperatures, typically above 45°C."
            },
            {
                question: "What set of protective enzymes do aerobic organisms utilize to neutralize toxic reactive oxygen species (ROS)?",
                options: ["Amylase, lipase, and protease", "Superoxide dismutase, peroxidase, and catalase", "DNA polymerase, ligase, and helicase", "Coagulase, kinase, and hyaluronidase"],
                correct: 1,
                explanation: "Superoxide dismutase (SOD), peroxidase, and catalase break down hazardous oxygen radicals (such as superoxide O2- and hydrogen peroxide H2O2) into water and oxygen."
            },
            {
                question: "Which enzyme is directly responsible for converting superoxide radicals (O2-) into hydrogen peroxide and molecular oxygen?",
                options: ["Catalase", "Superoxide dismutase (SOD)", "Peroxidase", "Cytochrome oxidase"],
                correct: 1,
                explanation: "Superoxide dismutase (SOD) scavenges toxic superoxide radicals (O2-) and converts them into hydrogen peroxide (H2O2) and molecular oxygen (O2)."
            },
            {
                question: "Why are obligate (strict) anaerobes killed or inhibited by exposure to atmospheric oxygen?",
                options: ["They lack protective enzymes like superoxide dismutase and catalase to detoxify reactive oxygen byproducts", "Oxygen destroys their cytoplasmic 70S ribosomes immediately", "Oxygen causes their peptidoglycan cell walls to dissolve", "They lack a plasma membrane"],
                correct: 0,
                explanation: "Strict anaerobes lack superoxide dismutase, catalase, and peroxidase; without these enzymes, toxic oxygen radicals accumulate and kill the cell."
            },
            {
                question: "How do facultative anaerobes behave when environmental oxygen is depleted?",
                options: ["They immediately lyse and die", "They form endospores and remain dormant indefinitely", "They switch from aerobic respiration to fermentation or anaerobic respiration", "They rely on phototaxis to generate ATP"],
                correct: 2,
                explanation: "Facultative anaerobes utilize oxygen for aerobic respiration when it is present, but can switch to fermentation or anaerobic respiration when oxygen is absent."
            },
            {
                question: "Which oxygen category describes bacteria that require oxygen for growth, but only at low concentrations below atmospheric levels (2–10% O2)?",
                options: ["Obligate aerobes", "Facultative anaerobes", "Microaerophiles", "Aerotolerant anaerobes"],
                correct: 2,
                explanation: "Microaerophiles require low levels of oxygen (2–10%) for survival and are damaged or inhibited by normal atmospheric concentrations (21% O2)."
            },
            {
                question: "What are aerotolerant anaerobes?",
                options: ["Organisms that do not use oxygen for respiration but can survive in its presence", "Organisms that require oxygen at concentrations higher than atmospheric air", "Organisms that die immediately upon exposure to air", "Organisms that generate energy through light"],
                correct: 0,
                explanation: "Aerotolerant anaerobes do not utilize oxygen for metabolism, but they produce detoxifying mechanisms that allow them to tolerate and survive in its presence."
            },
            {
                question: "Bacteria that grow optimally in highly acidic environments (pH below 5.5) are classified as:",
                options: ["Alkaliphiles", "Halophiles", "Acidophiles", "Neutrophiles"],
                correct: 2,
                explanation: "Acidophiles are organisms adapted to thrive in low pH (acidic) environments."
            },
            {
                question: "Microorganisms that require high osmotic pressure and elevated salt (NaCl) concentrations to survive are known as:",
                options: ["Halophiles", "Barophiles", "Psychrophiles", "Acidophiles"],
                correct: 0,
                explanation: "Halophiles are microbes adapted to thrive in environments with high osmotic pressure and high salt concentrations."
            },
            {
                question: "What term describes a symbiotic relationship where one organism benefits while the other organism is neither helped nor harmed?",
                options: ["Mutualism", "Commensalism", "Parasitism", "Synergism"],
                correct: 1,
                explanation: "Commensalism is a symbiotic relationship in which one member derives benefit while the host is unaffected (neither harmed nor helped)."
            },
            {
                question: "What is the key differentiator between Synergism and Mutualism?",
                options: ["Synergism involves obligate parasitism", "Synergism occurs only in viruses", "Synergism is an antagonistic relationship", "Synergism is a non-symbiotic cooperation where organisms benefit together but are not interdependent for survival"],
                correct: 3,
                explanation: "In mutualism, organisms are symbiotically interdependent. In synergism, free-living organisms cooperate and share nutrients, but their association is not strictly required for survival."
            },
            {
                question: "When one microorganism produces chemical substances (such as antibiotics or bacteriocins) that inhibit or kill a competing microbe, this non-symbiotic interaction is called:",
                options: ["Antagonism (Antibiosis)", "Commensalism", "Mutualism", "Synergism"],
                correct: 0,
                explanation: "Antagonism (or antibiosis) is an inhibitory non-symbiotic interaction where one organism releases antimicrobial chemicals that suppress or destroy competing species."
            },
            {
                question: "What is the primary method of asexual cell division in bacteria, where a single parent cell splits into two equal daughter cells?",
                options: ["Budding", "Binary transverse fission", "Conjugation", "Mitotic cleavage"],
                correct: 1,
                explanation: "Binary transverse fission is the standard mode of asexual bacterial division, resulting in two identical daughter cells."
            },
            {
                question: "During which phase of the bacterial growth curve are cells adapting to new media, synthesizing enzymes, and growing in size, but NOT yet increasing in number?",
                options: ["Log phase", "Lag phase", "Stationary phase", "Death phase"],
                correct: 1,
                explanation: "In the Lag phase, cells are metabolically active and preparing for division, but the overall cell count has not yet begun to increase."
            },
            {
                question: "During which phase of the bacterial growth curve is the population growing and dividing at its maximum, constant geometric rate?",
                options: ["Stationary phase", "Lag phase", "Log (Exponential) phase", "Decline phase"],
                correct: 2,
                explanation: "The Log (Exponential) phase is the period of maximum, steady cellular division where the population doubles at regular intervals."
            },
            {
                question: "What causes a bacterial culture to transition from the Log phase into the Stationary phase?",
                options: ["Complete consumption of nutrients and accumulation of toxic waste products", "Spontaneous activation of sex pili", "Exposure to atmospheric air", "A sudden decrease in temperature"],
                correct: 0,
                explanation: "As nutrients are depleted and toxic metabolic wastes accumulate, the rate of new cell division slows until it equals the rate of cell death, causing the growth curve to plateau."
            },
            {
                question: "According to the lecture transcript, what is 'turbidity' and how is it measured in the laboratory?",
                options: ["It is the color of a colony on agar, measured with an electron microscope", "It is the thickness of a capsule, measured with a hemocytometer", "It is the cloudiness of a solution, measured with a spectrophotometer by how much light passes through it", "It is the motility rate of bacteria, measured with an analog clock"],
                correct: 2,
                explanation: "The transcript explains: 'Turbidity, you should know this name. That's basically a concentration in a solution... used in this thing called a spectrophotometer, and they look and see how much light shines through it... turbidity is basically how cloudy is the thing. The more growth, the more difficulty you can see through it.'"
            },
            {
                question: "Which advanced method uses fluidics, lasers, and detectors to count and sort bacterial cells, and was noted in the transcript as something 'boards hasn't quite caught up to just yet'?",
                options: ["Flow Cytometry", "Direct plate count", "Spectrophotometric turbidity", "Petroff-Hausser counting"],
                correct: 0,
                explanation: "The transcript explicitly states that while direct counts and turbidity are standard board topics, 'flow cytometry boards hasn't quite caught up to that one just yet for whatever reason. So just know that this is how you would measure growth.'"
            }
        ];

        let activeQuestions = [];
        let currentAnswers = [];

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function renderQuiz() {
            activeQuestions = shuffleArray(JSON.parse(JSON.stringify(quizData)));
            currentAnswers = new Array(activeQuestions.length).fill(null);

            const container = document.getElementById('quizContainer');
            container.innerHTML = '';

            activeQuestions.forEach((q, index) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `q-card-${index}`;

                let optionsHTML = '';
                q.options.forEach((opt, optIdx) => {
                    optionsHTML += `
                        <button class="option-btn" 
                                id="btn-${index}-${optIdx}" 
                                onclick="selectOption(${index}, ${optIdx})">
                            <span style="font-weight: 700; color: var(--primary-accent); margin-right: 8px;">${String.fromCharCode(65 + optIdx)}.</span> ${opt}
                        </button>
                    `;
                });

                card.innerHTML = `
                    <div class="question-header">Question ${index + 1} of ${activeQuestions.length}</div>
                    <div class="question-text">${q.question}</div>
                    <div class="options-list">${optionsHTML}</div>
                    <div class="explanation-box" id="exp-${index}"></div>
                `;

                container.appendChild(card);
            });

            document.getElementById('scoreDisplay').innerText = `Score: 0 / ${activeQuestions.length} (0%)`;
            document.getElementById('progressBar').style.width = '0%';
        }

        function selectOption(qIdx, selectedOptIdx) {
            if (currentAnswers[qIdx] !== null) return;

            currentAnswers[qIdx] = selectedOptIdx;
            const q = activeQuestions[qIdx];
            const isCorrect = selectedOptIdx === q.correct;

            q.options.forEach((_, optIdx) => {
                const btn = document.getElementById(`btn-${qIdx}-${optIdx}`);
                btn.disabled = true;

                if (optIdx === q.correct) {
                    btn.classList.add('correct-choice');
                } else if (optIdx === selectedOptIdx) {
                    btn.classList.add('incorrect-choice');
                } else {
                    btn.classList.add('dimmed');
                }
            });

            const expBox = document.getElementById(`exp-${qIdx}`);
            expBox.classList.add('visible', isCorrect ? 'correct' : 'incorrect');
            expBox.innerHTML = `<strong>${isCorrect ? '✓ Correct' : '✗ Incorrect'}</strong><br>${q.explanation}`;

            updateScore();
        }

        function updateScore() {
            const answeredCount = currentAnswers.filter(a => a !== null).length;
            const correctCount = currentAnswers.reduce((acc, ans, idx) => {
                return ans === activeQuestions[idx].correct ? acc + 1 : acc;
            }, 0);

            const percentage = Math.round((correctCount / activeQuestions.length) * 100);
            
            document.getElementById('scoreDisplay').innerText = `Score: ${correctCount} / ${activeQuestions.length} (${percentage}%)`;
            document.getElementById('progressBar').style.width = `${(answeredCount / activeQuestions.length) * 100}%`;

            if (answeredCount === activeQuestions.length) {
                showSummary(correctCount, percentage);
            }
        }

        function showSummary(correctCount, percentage) {
            const summaryCard = document.getElementById('summaryCard');
            const finalScore = document.getElementById('finalScore');
            const feedback = document.getElementById('summaryFeedback');

            finalScore.innerText = `${correctCount} / ${activeQuestions.length} (${percentage}%)`;

            if (percentage >= 90) {
                feedback.innerText = "Mastery demonstrated! You have thoroughly covered all Quiz 2 concepts.";
            } else if (percentage >= 75) {
                feedback.innerText = "Solid job! Review oxygen enzymes, temperature categories, and growth curve phases.";
            } else {
                feedback.innerText = "Good effort. Review Lecture 2 shapes and Lecture 3 growth factors and retake the quiz!";
            }

            summaryCard.classList.add('visible');
            summaryCard.scrollIntoView({ behavior: 'smooth' });
        }

        function resetQuiz() {
            document.getElementById('summaryCard').classList.remove('visible');
            renderQuiz();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.onload = renderQuiz;
    </script>
</body>
</html>
