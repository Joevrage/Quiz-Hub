const quizData = [
{id:1,quarter:1,slideRef:2,stem:"Microbes that engage in mutual or commensal associations with humans, restricted to outer surfaces, are called _______ flora.",options:[
{text:"Natural",correct:true,why:"Natural flora are mutual or commensal microbes restricted mostly to outer surfaces without penetrating sterile tissues. [Slide #2]"},
{text:"Sterile",correct:false,why:"Sterile describes sites and fluids that should hold no microbes, not a microbial population. [Slide #2]"},
{text:"Pathogenic",correct:false,why:"Pathogenic microbes cause harm; natural flora live in mutual or commensal association. [Slide #2]"},
{text:"Opportunistic",correct:false,why:"Opportunistic pathogens infect when host defenses are compromised; this is the infection line of entry, not natural flora. [Slide #2]"}]},
{id:2,quarter:1,slideRef:3,stem:"Which site normally harbors natural flora?",options:[

{text:"Urine within the bladder",correct:false,why:"Urine in kidneys, ureters, and bladder is a sterile fluid. [Slide #4]"},

{id:3,quarter:1,slideRef:4,stem:"Which of the following is a sterile site or fluid?",options:[

{text:"Vagina",correct:false,why:"The vagina is a normal flora site. [Slide #3]"},
{text:"Colon",correct:false,why:"The colon is part of the GI tract harboring normal flora. [Slide #3]"}]},
{id:4,quarter:1,slideRef:4,stem:"Which pair of fluids is sterile within its gland or tract but acquires microbes after exiting to the outside?",options:[
{text:"Saliva and semen",correct:true,why:"Saliva is sterile before entering the oral cavity and semen is sterile before entering the urethra. [Slide #4]"},
{text:"Blood and cerebrospinal fluid",correct:false,why:"Both remain sterile internal fluids; neither is defined by acquiring microbes on exit. [Slide #4]"},
{text:"Urine and cerebrospinal fluid",correct:false,why:"CSF stays internal and sterile; urine is sterile only in kidneys, ureters, and bladder. [Slide #4]"},
{text:"Blood and urine",correct:false,why:"Blood is sterile throughout the circulatory system and does not exit to acquire flora. [Slide #4]"}]},
{id:5,quarter:1,slideRef:3,stem:"Natural flora of the external eye are found on which structures?",options:[
{text:"Lids and lash follicles",correct:true,why:"The external eye, including lids and lash follicles, harbors normal flora. [Slide #3]"},
{text:"Internal eye",correct:false,why:"The internal eye is a sterile site. [Slide #4]"},
{text:"Middle and inner ear",correct:false,why:"These are sterile sites, not part of the eye. [Slide #4]"},
{text:"Sinuses",correct:false,why:"Sinuses are listed as sterile anatomical sites. [Slide #4]"}]},
{id:6,quarter:2,slideRef:5,stem:"Biofilms form when organisms attach to a substrate by an _______ that binds them into organized layers.",options:[
{text:"Extracellular matrix",correct:true,why:"An extracellular matrix binds organisms together in complex organized layers. [Slide #5]"},
{text:"Endospore coat",correct:false,why:"Endospores are dormant survival bodies, not binding matrices for biofilms. [Slide #5]"},
{text:"F pilus bridge",correct:false,why:"Conjugation pili transfer DNA; they do not form the biofilm matrix. [Slide #5]"},
{text:"Plasmid network",correct:false,why:"Plasmids are DNA elements, not a structural matrix. [Slide #5]"}]},
{id:7,quarter:2,slideRef:5,stem:"Natural flora commonly form biofilms in which set of locations?",options:[
{text:"Skin, oral cavity, and large intestine",correct:true,why:"Biofilms formed by natural flora are common on skin, oral cavity, and large intestine. [Slide #5]"},
{text:"Brain, heart, and lungs",correct:false,why:"These are sterile internal organs. [Slide #4]"},
{text:"Blood, bladder, and kidneys",correct:false,why:"These are sterile sites and fluids. [Slide #4]"},
{text:"Bones, muscles, and glands",correct:false,why:"These are sterile internal tissues. [Slide #4]"}]},
{id:8,quarter:2,slideRef:6,stem:"The first exposure to microbes that become natural flora occurs when the _______.",options:[
{text:"Fetal membranes break",correct:true,why:"The first exposure occurs with breaking of the fetal membrane, exposing the fetus to the mother's vaginal bacteria. [Slide #6]"},
{text:"Child passes through the birth canal",correct:false,why:"Passage through the birth canal is the second exposure. [Slide #6]"},
{text:"Child takes its first breath",correct:false,why:"This is not listed as an exposure stage; the first exposure precedes birth. [Slide #6]"},
{text:"Child begins eating solid foods",correct:false,why:"Food contributes to the fourth exposure during the following 18 months. [Slide #6]"}]},
{id:9,quarter:2,slideRef:6,stem:"Which bacteria predominate in the intestinal flora of a breastfed infant?",options:[
{text:"Bifidobacteria",correct:true,why:"Breastfed infants select for bifidobacteria in the fourth exposure. [Slide #6]"},
{text:"Coliforms",correct:false,why:"Coliforms are part of the broader mix seen in bottle-fed infants. [Slide #6]"},
{text:"Enteric streptococci",correct:false,why:"Enteric streptococci are associated with bottle feeding. [Slide #6]"},
{text:"Staphylococci",correct:false,why:"Staphylococci are part of the mix seen with bottle feeding. [Slide #6]"}]},
{id:10,quarter:2,slideRef:7,stem:"Which of the following is the least common on the skin overall?",options:[
{text:"Staphylococcus",correct:true,why:"Staphylococcus makes up only about 5% of skin flora, less than any of the four phyla. [Slide #7]"},
{text:"Actinobacteria",correct:false,why:"Actinobacteria are the most abundant skin phylum at 51.8%. [Slide #7]"},
{text:"Firmicutes",correct:false,why:"Firmicutes make up 24.4% of skin flora. [Slide #7]"},
{text:"Proteobacteria",correct:false,why:"Proteobacteria make up 16.5% of skin flora. [Slide #7]"}]},
{id:11,quarter:3,slideRef:8,stem:"The most common residents of the mouth are aerobic _______ species.",options:[
{text:"Streptococcus",correct:true,why:"Aerobic Streptococcus species are the most common oral residents. [Slide #8]"},
{text:"Bacteroides",correct:false,why:"Bacteroides are predominantly anaerobic large intestine residents. [Slide #9]"},
{text:"Bifidobacterium",correct:false,why:"Bifidobacterium is an anaerobic intestinal resident. [Slide #9]"},
{text:"Clostridium",correct:false,why:"Clostridium is an anaerobic large intestine resident. [Slide #9]"}]},
{id:12,quarter:3,slideRef:8,stem:"Which two oral species make a major contribution to dental caries?",options:[
{text:"S. mutans and S. sanguis",correct:true,why:"S. mutans and S. sanguis contribute substantially to dental caries. [Slide #8]"},
{text:"S. salivarius and S. mitis",correct:false,why:"These are oral residents but not the species tied to caries. [Slide #8]"},
{text:"S. aureus and S. epidermidis",correct:false,why:"These staphylococci are associated with nasal and skin sites. [Slide #10]"},
{text:"S. sanguis and S. salivarius",correct:false,why:"Only S. sanguis is a caries contributor; S. salivarius is not. [Slide #8]"}]},
{id:13,quarter:3,slideRef:9,stem:"The large intestine is predominantly populated by which bacteria?",options:[
{text:"Anaerobic Bacteroides and Bifidobacterium",correct:true,why:"Large intestine flora are predominantly anaerobic, including Bacteroides and Bifidobacterium. [Slide #9]"},
{text:"Aerobic Streptococcus and Staphylococcus",correct:false,why:"Aerobic streptococci dominate the mouth, not the large intestine. [Slide #8]"},
{text:"Microaerophilic Neisseria and Haemophilus",correct:false,why:"These are respiratory tract residents. [Slide #10]"},
{text:"Facultative coliforms such as E. coli",correct:false,why:"Coliforms are present in smaller numbers. [Slide #9]"}]},
{id:14,quarter:3,slideRef:9,stem:"Large intestine flora produce gas and _______, which gives feces its odor.",options:[
{text:"Skatole",correct:true,why:"Flora produce gas and skatole, the compound that makes feces smell. [Slide #9]"},

{text:"Pyridoxine",correct:false,why:"Pyridoxine is a vitamin generated by flora. [Slide #9]"},
{text:"Propionic acid",correct:false,why:"Propionic acid is a fermentation acid produced by flora, not the odor compound. [Slide #9]"}]},
{id:15,quarter:3,slideRef:10,stem:"Which organism is found at the nasal entrance, nasal vestibule, and anterior nasopharynx?",options:[
{text:"Staphylococcus aureus",correct:true,why:"S. aureus resides at the nasal entrance, vestibule, and anterior nasopharynx. [Slide #10]"},
{text:"Neisseria",correct:false,why:"Neisseria is found in the nasopharynx behind the soft palate. [Slide #10]"},
{text:"Haemophilus",correct:false,why:"Haemophilus is found in the tonsils and lower pharynx. [Slide #10]"},
{text:"Lactobacillus",correct:false,why:"Lactobacilli predominate in the vagina after puberty. [Slide #11]"}]},
{id:16,quarter:4,slideRef:11,stem:"Which bacteria predominate in the vagina from puberty until menopause?",options:[
{text:"Lactobacilli",correct:true,why:"After puberty until menopause the vagina is primarily lactobacilli. [Slide #11]"},
{text:"Diphtheroids",correct:false,why:"Diphtheroids are prepubertal residents. [Slide #11]"},
{text:"Coliforms",correct:false,why:"Coliforms occur in the prepubertal vagina. [Slide #11]"},
{text:"Staphylococci",correct:false,why:"Staphylococci are prepubertal residents. [Slide #11]"}]},
{id:17,quarter:4,slideRef:11,stem:"Which sequence follows increased estrogen in the vagina after puberty?",options:[
{text:"Increased glycogen, increased lactobacilli, increased acid",correct:true,why:"Estrogen raises glycogen, attracting lactobacilli that produce acid and block other microbes. [Slide #11]"},
{text:"Increased glycogen, decreased lactobacilli, increased acid",correct:false,why:"Glycogen attracts lactobacilli, so their numbers increase. [Slide #11]"},
{text:"Decreased glycogen, increased lactobacilli, increased acid",correct:false,why:"Estrogen increases glycogen; it does not decrease it. [Slide #11]"},
{text:"Increased glycogen, increased lactobacilli, decreased acid",correct:false,why:"Lactobacilli are acid-producing, so acid increases. [Slide #11]"}]},
{id:18,quarter:4,slideRef:12,stem:"Which benefit of flora is described as repression of pathogenic microbial growth?",options:[
{text:"Microbial antagonism",correct:true,why:"Microbial antagonism is repression of pathogenic microbial growth. [Slide #12]"},

{text:"Metabolic function",correct:false,why:"Metabolic function involves vitamin and acid production. [Slide #12]"},
{text:"Immune desensitization",correct:false,why:"This involves the immune system tolerating microbes, not repressing pathogen growth. [Slide #12]"}]},
{id:19,quarter:4,slideRef:13,stem:"Salmonella food poisoning in a healthy adult is an example of which type of agent?",options:[
{text:"True pathogen",correct:true,why:"True pathogens cause disease in healthy persons with normal immune defenses. [Slide #13]"},
{text:"Opportunistic pathogen",correct:false,why:"Opportunistic pathogens infect when defenses are compromised or the microbe is outside its natural environment. [Slide #13]"},
{text:"Natural flora member",correct:false,why:"Natural flora remain restricted to outer surfaces without invading sterile tissue. [Slide #2]"},
{text:"Commensal resident",correct:false,why:"Commensals benefit without harming; this agent causes disease. [Slide #2]"}]},
{id:20,quarter:4,slideRef:15,stem:"A bladder infection by normal colon flora in a patient receiving chemotherapy is classified as which of the following?",options:[
{text:"Opportunistic infection",correct:true,why:"Flora established outside their natural site in a compromised host (chemotherapy weakens defenses) is opportunistic. [Slide #15]"},
{text:"True pathogen infection",correct:false,why:"True pathogens cause disease in healthy hosts with normal defenses. [Slide #13]"},
{text:"Commensal association",correct:false,why:"Commensalism involves no harm; this is an infection. [Slide #2]"},
{text:"Mutualistic association",correct:false,why:"Mutualism benefits both parties; here the host is harmed. [Slide #2]"}]},
{id:21,quarter:1,slideRef:2,stem:"Which pair represents the two lines of entry for acquiring bacteria?",options:[
{text:"Natural flora and infection",correct:true,why:"The two lines of entry are natural flora and infection (true or opportunistic pathogen). [Slide #2]"},
{text:"Biofilm and capsule",correct:false,why:"Biofilms and capsules are structures or communities, not lines of entry. [Slide #5]"},
{text:"Sterile site and normal flora",correct:false,why:"Sterile sites are anatomical locations that should hold no microbes, not a line of entry. [Slide #4]"},
{text:"Infection and sterile site",correct:false,why:"Sterile sites are not a line of entry; natural flora is the other line. [Slide #2]"}]},
{id:22,quarter:1,slideRef:3,stem:"Which GI tract site harbors natural flora?",options:[
{text:"Rectum",correct:true,why:"The mouth, colon, rectum, and anus are GI sites harboring normal flora. [Slide #3]"},
{text:"Pancreas",correct:false,why:"Glands such as the pancreas are sterile. [Slide #4]"},
{text:"Liver",correct:false,why:"The liver is a sterile internal organ. [Slide #4]"},
{text:"Bladder",correct:false,why:"The bladder is sterile and is not part of the GI tract. [Slide #4]"}]},
{id:23,quarter:1,slideRef:3,stem:"Which site in the upper respiratory tract harbors natural flora?",options:[
{text:"Pharynx",correct:true,why:"The oral cavity, pharynx, and nasal mucosa harbor normal flora. [Slide #3]"},
{text:"Sinuses",correct:false,why:"Sinuses are sterile sites. [Slide #4]"},
{text:"Lungs",correct:false,why:"Lungs are sterile internal organs. [Slide #4]"},
{text:"Middle ear",correct:false,why:"The middle and inner ear are sterile. [Slide #4]"}]},
{id:24,quarter:1,slideRef:4,stem:"Urine is sterile in which location?",options:[
{text:"Ureters",correct:true,why:"Urine in the kidneys, ureters, and bladder is sterile. [Slide #4]"},
{text:"Outer opening of the urethra",correct:false,why:"This opening harbors normal flora, so urine is no longer sterile once it reaches it. [Slide #3]"},
{text:"External genitalia",correct:false,why:"The external genitalia harbor normal flora. [Slide #3]"},
{text:"Vagina",correct:false,why:"The vagina harbors normal flora. [Slide #3]"}]},
{id:25,quarter:1,slideRef:4,stem:"Brain, heart, and _______ are sterile internal organs.",options:[
{text:"Lungs",correct:true,why:"Lungs are listed among sterile internal tissues and organs. [Slide #4]"},
{text:"Pharynx",correct:false,why:"The pharynx harbors normal flora. [Slide #3]"},
{text:"Rectum",correct:false,why:"The rectum harbors normal flora. [Slide #3]"},
{text:"Vagina",correct:false,why:"The vagina harbors normal flora. [Slide #3]"}]},
{id:26,quarter:1,slideRef:3,stem:"Microbes concentrate near the two ends of the GI tract because it is _______.",options:[
{text:"One long tube open to the outside at both ends",correct:true,why:"The GI tract is essentially one long tube open at both ends, so microbes are found nearest the openings. [Slide #3]"},
{text:"A sealed tube closed to the outside",correct:false,why:"The tract is open to the outside at the mouth and anus. [Slide #3]"},
{text:"A series of separate sterile compartments",correct:false,why:"It is a continuous tube, and flora sit near the openings rather than in sterile compartments. [Slide #3]"},
{text:"A tube lined with sterile mucosa throughout",correct:false,why:"The mouth, colon, rectum, and anus harbor flora, so the lining is not sterile throughout. [Slide #3]"}]},
{id:27,quarter:1,slideRef:4,stem:"Isolation of a microbe from which site most strongly indicates infection rather than natural flora?",options:[
{text:"Middle ear",correct:true,why:"The middle ear is sterile, so microbes there indicate infection. [Slide #4]"},
{text:"External ear canal",correct:false,why:"The external ear and canal harbor normal flora. [Slide #3]"},
{text:"Lash follicles",correct:false,why:"Lids and lash follicles harbor normal flora. [Slide #3]"},
{text:"Vagina",correct:false,why:"The vagina harbors normal flora. [Slide #3]"}]},
{id:28,quarter:1,slideRef:2,stem:"Which statement distinguishes natural flora from an infecting microbe?",options:[
{text:"Natural flora stay on outer surfaces; infecting microbes invade sterile tissue",correct:true,why:"Natural flora are restricted to outer surfaces, whereas infection involves penetrating defenses and invading sterile tissue. [Slide #2]"},

{text:"Both stay on outer surfaces; only infecting microbes form biofilms",correct:false,why:"Natural flora also create biofilms, and infecting microbes invade sterile tissue. [Slide #5]"},

{id:29,quarter:2,slideRef:5,stem:"How do biofilms of natural flora protect the host?",options:[
{text:"They form a good-bacteria film that blocks other microbes from taking up residency",correct:true,why:"Flora biofilms occupy the surface and prevent other microbes from establishing. [Slide #5]"},

{text:"They convert sterile sites into flora sites",correct:false,why:"Sterile sites should remain microbe-free; flora are restricted to outer surfaces. [Slide #4]"},

{id:30,quarter:2,slideRef:6,stem:"The second exposure to microbes that become natural flora occurs _______.",options:[

{id:31,quarter:2,slideRef:6,stem:"Which timing describes the third exposure to future natural flora?",options:[

{id:32,quarter:2,slideRef:6,stem:"Why does breastfeeding select for bifidobacteria?",options:[

{id:33,quarter:2,slideRef:6,stem:"The fourth exposure to future natural flora spans about _______ months.",options:[
{text:"18",correct:true,why:"The fourth exposure covers the next 18 months and establishes intestinal flora. [Slide #6]"},

let currentSet = quizData;
let round = 1;
let quizMode = 'full';
let answers = {};
let popupTimeout = null;
let muted = false;
try { muted = localStorage.getItem('stfuErijah') === '1'; } catch (e) {}

function fisherYates(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function shuffleQuiz(){fisherYates(currentSet);currentSet.forEach(q=>fisherYates(q.options));}

function updateStfuButton(){
    const b=document.getElementById('stfuBtn');
    b.textContent = muted ? 'Bring Back Erijah' : 'STFU Erijah';
    b.classList.toggle('muted', muted);
    if(muted){
        const a=document.getElementById('wrongAudio');
        a.pause(); a.currentTime=0;
        clearTimeout(popupTimeout);
        document.getElementById('wrongPopup').classList.add('hidden');
    }
}
function toggleStfu(){
    muted=!muted;
    try { localStorage.setItem('stfuErijah', muted ? '1' : '0'); } catch (e) {}
    updateStfuButton();
}

function updateModeButtons(){
    document.getElementById('fullQuizBtn').classList.toggle('active',quizMode==='full');
    document.getElementById('quickQuizBtn').classList.toggle('active',quizMode==='quick');
}

function updateProgress(){
    const label = round===1 ? 'Score' : `Review ${round-1}`;
    const correct = Object.values(answers).filter(v=>v===true).length;
    const total = currentSet.length;
    const pct = total ? Math.round(correct/total*100) : 0;
    document.getElementById('progress').textContent = `${label}: ${correct} / ${total} (${pct}%)`;
}

function renderQuiz(set){
    const popup=document.getElementById('wrongPopup');
    if(popup) popup.classList.add('hidden');
    clearTimeout(popupTimeout);
    if(set){currentSet=set;}
    else{fisherYates(quizData);currentSet=(quizMode==='quick')?quizData.slice(0,15):[...quizData];}
    answers={};
    shuffleQuiz();
    document.getElementById('summary').classList.add('hidden');
    const quiz=document.getElementById('quiz');
    quiz.innerHTML='';
    const letters=['a','b','c','d'];
    currentSet.forEach((q,qIdx)=>{
        const card=document.createElement('div');
        card.className='card';
        card.innerHTML=`<span class="badge">Question ${qIdx+1} of ${currentSet.length}</span><div class="stem">${q.stem}</div>`;
        const optWrap=document.createElement('div');
        q.options.forEach((o,oIdx)=>{
            const btn=document.createElement('button');
            btn.className='opt';
            btn.textContent=`${letters[oIdx]}. ${o.text}`;
            btn.addEventListener('click',()=>handleSelect(q,oIdx,card,optWrap));
            optWrap.appendChild(btn);
        });
        card.appendChild(optWrap);
        quiz.appendChild(card);
    });
    updateProgress();
    window.scrollTo(0,0);
}

function handleSelect(q,idx,card,optWrap){
    if(q.id in answers) return;
    const chosen=q.options[idx];
    const btns=optWrap.querySelectorAll('.opt');
    btns.forEach(b=>b.disabled=true);
    answers[q.id]=chosen.correct;
    btns.forEach((b,i)=>{
        if(q.options[i].correct) b.classList.add('correct');
    });
    if(!chosen.correct){
        btns[idx].classList.add('incorrect');
        if(!muted){
            const audio=document.getElementById('wrongAudio');
            audio.currentTime=0;
            audio.play().catch(err=>console.log('Audio play blocked:',err));
            document.getElementById('wrongPopup').classList.remove('hidden');
            clearTimeout(popupTimeout);
            popupTimeout=setTimeout(()=>document.getElementById('wrongPopup').classList.add('hidden'),2000);
        }
    }
    const letters=['a','b','c','d'];
    const box=document.createElement('div');
    box.className='explain';
    box.innerHTML=`<div class="banner ${chosen.correct?'good':'bad'}">${chosen.correct?'Correct!':'You didn’t know that?!'}</div>
    <div class="ref">Reference: Lecture 6, Slide #${q.slideRef}</div>
    <ul>${q.options.map((o,i)=>`<li class="${o.correct?'ok':''}"><b>${letters[i]}. ${o.correct?'Correct':'Incorrect'}:</b> ${o.why}</li>`).join('')}</ul>`;
    card.appendChild(box);
    updateProgress();
    if(Object.keys(answers).length===currentSet.length) showSummary();
}

function showSummary(){
    const total=currentSet.length;
    const correct=currentSet.filter(q=>answers[q.id]===true).length;
    const missed=currentSet.filter(q=>!answers[q.id]);
    const pct=Math.round(correct/total*100);
    document.querySelector('#summary .summary-title').textContent = round===1 ? 'Quiz Complete' : `Review Round ${round-1} Complete`;
    document.getElementById('summaryScore').textContent=`${correct} / ${total} (${pct}%)`;
    let msg;
    if(round>1){ msg = missed.length ? `${missed.length} still missed. Go again.` : 'Everything cleared. All correct.'; }
    else if(pct>=90) msg='Absolute Gigachad. You drained that test dry.';
    else if(pct>=70) msg="Solid run! You're locked in, get in some more reps.";
    else msg='You really didn’t fucking know that.';
    document.getElementById('summaryMsg').textContent=msg;
    const rb=document.getElementById('reviewBtn');
    if(missed.length){rb.style.display='inline-block';rb.textContent=`Review Missed (${missed.length})`;}
    else rb.style.display='none';
    const s=document.getElementById('summary');
    s.classList.remove('hidden');
    s.scrollIntoView({behavior:'smooth'});
}

document.getElementById('fullQuizBtn').addEventListener('click',()=>{quizMode='full';round=1;updateModeButtons();renderQuiz();});
document.getElementById('quickQuizBtn').addEventListener('click',()=>{quizMode='quick';round=1;updateModeButtons();renderQuiz();});
document.getElementById('retakeBtn').addEventListener('click',()=>{round=1;renderQuiz();});
document.getElementById('reviewBtn').addEventListener('click',()=>{round++;renderQuiz(currentSet.filter(q=>!answers[q.id]));});
document.getElementById('stfuBtn').addEventListener('click',toggleStfu);
window.onload=()=>{updateModeButtons();updateStfuButton();renderQuiz();};
</script>
</body>
