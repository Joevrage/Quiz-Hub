<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sys Phys - Practice Exam (All Combined)</title>
    <style>
        :root {
            --bg-dark: #0f0f0f;
            --card-dark: #1a1a1a;
            --text-light: #ffffff;
            --text-muted: #a0a0a0;
            --accent-orange: #ff9900;
            --correct-green: #14532d;
            --correct-border: #22c55e;
            --incorrect-red: #7f1d1d;
            --incorrect-border: #ef4444;
            --border-color: #2a2a2a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            padding-bottom: 60px;
        }

        .sticky-header {
            position: sticky;
            top: 0;
            background-color: rgba(26, 26, 26, 0.95);
            border-bottom: 2px solid var(--accent-orange);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .sticky-header h1 {
            font-size: 1.1rem;
            color: var(--text-light);
        }

        .score-box {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-orange);
            background: #262626;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #333;
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .question-card {
            background-color: var(--card-dark);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .q-number {
            color: var(--accent-orange);
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .q-text {
            font-size: 1.05rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background-color: #242424;
            color: var(--text-light);
            border: 1px solid var(--border-color);
            padding: 14px 18px;
            border-radius: 6px;
            text-align: left;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #303030;
            border-color: var(--accent-orange);
        }

        .option-btn:disabled {
            cursor: default;
        }

        .option-btn.correct {
            background-color: var(--correct-green) !important;
            border-color: var(--correct-border) !important;
            color: #ffffff !important;
            font-weight: 500;
        }

        .option-btn.incorrect {
            background-color: var(--incorrect-red) !important;
            border-color: var(--incorrect-border) !important;
            color: #ffffff !important;
        }

        .explanation-box {
            display: none;
            margin-top: 15px;
            padding: 12px 16px;
            border-radius: 6px;
            background-color: #1f1f1f;
            border-left: 4px solid var(--accent-orange);
            font-size: 0.9rem;
            line-height: 1.5;
            color: #d1d5db;
        }

        .results-card {
            display: none;
            background-color: var(--card-dark);
            border: 2px solid var(--accent-orange);
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            margin-top: 30px;
        }

        .results-card h2 {
            font-size: 1.8rem;
            margin-bottom: 15px;
            color: var(--text-light);
        }

        .retake-btn {
            background-color: var(--accent-orange);
            color: #000;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s ease;
        }

        .retake-btn:hover {
            background-color: #e68a00;
        }
    </style>
</head>
<body>

    <div class="sticky-header">
        <h1>Sys Phys: Practice Exam (All Combined)</h1>
        <div class="score-box" id="score-display">Score: 0 / 0 (0%)</div>
    </div>

    <div class="container" id="quiz-container">
        <!-- Rendered by JS -->
    </div>

    <div class="container">
        <div class="results-card" id="results-card">
            <h2>Exam Complete!</h2>
            <p id="final-stats" style="font-size: 1.2rem; margin-bottom: 15px;"></p>
            <p id="feedback-message" style="color: var(--text-muted);"></p>
            <button class="retake-btn" onclick="initQuiz()">Retake Exam (Reshuffle)</button>
        </div>
    </div>

    <script>
        const quizData = [
            // --- MODULE 1: CELL BASICS & COMPARTMENTS ---
            {
                q: "Which cellular component encompasses everything between the plasma membrane and the nucleus, including both the organelles and the fluid medium?",
                options: ["Cytoplasm", "Cytosol", "Ectoplasm", "Nucleoplasm"],
                answer: 0,
                exp: "Cytoplasm refers to all the cellular contents between the plasma membrane and the nucleus, containing the cytosol plus all suspended organelles. Cytosol is specifically the fluid portion alone."
            },
            {
                q: "What is the primary cellular function of the nucleolus?",
                options: ["Lipid synthesis", "Synthesis and assembly of ribosomal subunits", "Degradation of hydrogen peroxide", "Packaging proteins into secretory vesicles"],
                answer: 1,
                exp: "The nucleolus is a dense region inside the nucleus responsible for synthesizing ribosomal RNA (rRNA) and assembling ribosome subunits."
            },
            {
                q: "Which organelle is characterized as the cellular sorting center, packaging proteins into vesicles for secretion or delivery to lysosomes?",
                options: ["Peroxisome", "Rough Endoplasmic Reticulum", "Golgi Apparatus", "Smooth Endoplasmic Reticulum"],
                answer: 2,
                exp: "The Golgi apparatus accepts newly synthesized proteins from the rough ER, chemically modifies them, and sorts/packages them for export, lysosomal use, or membrane incorporation."
            },
            {
                q: "Which organelle contains catalase and is specifically responsible for beta-oxidation of very long-chain fatty acids and detoxification of reactive oxygen species?",
                options: ["Proteasome", "Lysosome", "Centrosome", "Peroxisome"],
                answer: 3,
                exp: "Peroxisomes contain oxidases and catalase to generate and degrade hydrogen peroxide (H2O2) while breaking down very long-chain fatty acids."
            },
            {
                q: "Which of the following functions is performed exclusively by the smooth endoplasmic reticulum?",
                options: ["Synthesis of steroid hormones and calcium sequestration", "Translation of membrane-bound proteins", "Ubiquitination of misfolded cytosolic proteins", "Glycosylation of nascent lysosomal enzymes"],
                answer: 0,
                exp: "The smooth ER specializes in lipid and steroid hormone synthesis, carbohydrate metabolism, drug detoxification, and calcium storage (sarcoplasmic reticulum)."
            },
            {
                q: "During interphase, when a cell is not actively dividing, how many DNA strands are present in a human somatic cell, and what uncoiled state do they exist in?",
                options: ["23 strands; condensed as chromosomes", "46 strands; relaxed as chromatin", "92 strands; coiled as chromatids", "46 strands; tightly wound as centromeres"],
                answer: 1,
                exp: "Human somatic cells contain 46 strands of DNA. When not dividing, these strands exist in an unwound, relaxed thread-like state called chromatin to allow gene transcription."
            },
            {
                q: "According to lecture emphasis, synovial fluid inside the knee, shoulder, or elbow joint belongs to which specific fluid subcompartment?",
                options: ["Intravascular fluid compartment", "Interstitial fluid compartment", "Transcellular fluid compartment", "Intracellular fluid compartment"],
                answer: 2,
                exp: "Synovial fluid is an epithelial-lined specialized fluid categorized under the transcellular fluid compartment—a heavily tested board distinction highlighted in lecture."
            },
            {
                q: "In clinical pathology, an abnormal fluid accumulation occurring strictly within the transcellular fluid compartment is defined as what?",
                options: ["Edema", "Anasarca", "Hypernatremia", "An effusion"],
                answer: 3,
                exp: "Pathological fluid accumulation in a potential space of the transcellular compartment (e.g., pleural space, pericardium, joint capsule) is clinically called an effusion; fluid accumulation in the general interstitium is called edema."
            },
            {
                q: "What are the primary dissolved cations and anions found in the extracellular fluid (ECF)?",
                options: ["Sodium (Na+), Chloride (Cl-), and Bicarbonate (HCO3-)", "Potassium (K+), Phosphate (PO4-3), and Magnesium (Mg2+)", "Calcium (Ca2+), Sulfate (SO4-2), and Glucose", "Hydrogen (H+), Albumin, and Urea"],
                answer: 0,
                exp: "The ECF is salt-rich: its major cation is Sodium (Na+), and its dominant anions are Chloride (Cl-) and Bicarbonate (HCO3-)."
            },
            {
                q: "What are the primary dissolved cations and anions found within the intracellular fluid (ICF)?",
                options: ["Sodium (Na+) and Chloride (Cl-)", "Potassium (K+) and Phosphate (PO4-3)", "Bicarbonate (HCO3-) and Calcium (Ca2+)", "Albumin and Hydrogen ions (H+)"],
                answer: 1,
                exp: "The ICF is potassium- and phosphate-rich: its primary cation is Potassium (K+), and its dominant anions are organic phosphates (PO4-3) and proteins."
            },

            // --- MODULE 2: OSMOREGULATION & FLUID DYNAMICS ---
            {
                q: "According to standard physiological principles, body water distribution for a healthy 70-kg adult follows which distribution rule for Total Body Water (TBW), Intracellular Fluid (ICF), Interstitial Fluid (ISF), and Plasma (IVF)?",
                options: ["50% TBW : 30% ICF : 15% ISF : 5% IVF", "60% TBW : 40% ICF : 15% ISF : 5% IVF", "70% TBW : 50% ICF : 15% ISF : 5% IVF", "60% TBW : 45% ICF : 10% ISF : 5% IVF"],
                answer: 1,
                exp: "The 60-40-15-5 rule: TBW is 60% of total body weight, ICF is 40%, ECF is 20% (split into ~15% interstitial fluid and ~5% plasma/intravascular fluid)."
            },
            {
                q: "Which major plasma protein is predominantly responsible for maintaining capillary oncotic (colloid osmotic) pressure to oppose fluid filtration into the interstitium?",
                options: ["Fibrinogen", "Gamma globulin", "Albumin", "Alpha-1 antitrypsin"],
                answer: 2,
                exp: "Albumin accounts for roughly 75–80% of total plasma oncotic pressure because of its high concentration and molecular weight, counterbalancing capillary hydrostatic pressure."
            },
            {
                q: "What phenomenon describes the unequal distribution of diffusible ions across the capillary wall caused by the presence of non-diffusible, negatively charged plasma proteins?",
                options: ["Frank-Starling law", "Bernoulli principle", "Fick diffusion dynamic", "Gibbs-Donnan equilibrium"],
                answer: 3,
                exp: "The Gibbs-Donnan equilibrium states that impermeable anionic proteins inside plasma hold back more diffusible cations (Na+) and repel diffusible anions (Cl-), altering ionic gradients."
            },
            {
                q: "Central osmoreceptors that detect minute increases in plasma osmolarity to trigger ADH release are primarily situated in which circumventricular organs?",
                options: ["Subfornical Organ (SFO) and Organum Vasculosum of the Lamina Terminalis (OVLT)", "Median eminence and posterior pituitary", "Area postrema and choroid plexus", "Pineal gland and subcommissural organ"],
                answer: 0,
                exp: "The OVLT and SFO lack a typical blood-brain barrier, allowing specialized osmoreceptive neurons to directly sense systemic plasma hypertonicity and signal the hypothalamus."
            },
            {
                q: "In what specific anatomical ventricular wall do the primary osmoreceptors (SFO and OVLT) reside?",
                options: ["Floor of the fourth ventricle", "Wall of the third ventricle", "Roof of the lateral ventricles", "Cerebral aqueduct of Sylvius"],
                answer: 1,
                exp: "The SFO (subfornical organ) and OVLT (organum vasculosum of the lamina terminalis) are circumventricular organs embedded directly within the wall of the third ventricle."
            },
            {
                q: "Where is Antidiuretic Hormone (ADH) synthesized and from where is it released into systemic circulation?",
                options: ["Synthesized in the anterior pituitary; released from the hypothalamus", "Synthesized in the supraoptic/paraventricular nuclei; released from the posterior pituitary", "Synthesized in the adrenal cortex; released from the renal tubules", "Synthesized in the median preoptic nucleus; released from the anterior pituitary"],
                answer: 1,
                exp: "ADH (vasopressin) is synthesized primarily in the supraoptic and paraventricular nuclei of the hypothalamus and transported via axons to the posterior pituitary (neurohypophysis) for release."
            },
            {
                q: "What minute percentage increase in blood saltiness (osmolality) is sufficient to trigger the release of ADH into circulation?",
                options: ["5%", "10%", "1%", "15%"],
                answer: 2,
                exp: "The hypothalamic osmoreceptor threshold is remarkably sensitive: a mere 1% increase in blood saltiness/osmolality triggers the synthesis and release of ADH."
            },
            {
                q: "Which central nervous system structure serves as the primary hypothalamic thirst center when stimulated by osmoreceptor input?",
                options: ["Supraoptic nucleus", "Organum vasculosum of the lamina terminalis (OVLT)", "Subfornical organ (SFO)", "Median preoptic nucleus (MnPO)"],
                answer: 3,
                exp: "The SFO and OVLT detect hyperosmolality and relay that signal via axons to the median preoptic nucleus (MnPO), which serves as the hypothalamic thirst center."
            },
            {
                q: "Which specific aquaporin channel subtype is translocated to the apical (luminal) membrane of renal principal cells under ADH stimulation?",
                options: ["Aquaporin-2", "Aquaporin-1", "Aquaporin-3", "Aquaporin-4"],
                answer: 0,
                exp: "ADH stimulates the insertion of Aquaporin-2 (AQP2) water channels specifically into the apical membrane of collecting duct principal cells."
            },
            {
                q: "Which receptor subtype and second-messenger pathway mediate ADH's renal water-reabsorption effects on collecting duct principal cells?",
                options: ["V1 receptor coupled to Phospholipase C and IP3/DAG", "V2 receptor coupled to Gs, Adenylyl Cyclase, and cAMP", "Alpha-1 adrenergic receptor coupled to calcium influx", "AT1 receptor coupled to Protein Kinase C"],
                answer: 1,
                exp: "ADH binds to V2 receptors on the basolateral membrane of principal cells, activating Gs and adenylyl cyclase to generate cAMP, which drives aquaporin-2 insertion. V1 receptors reside on vascular smooth muscle to cause vasoconstriction."
            },
            {
                q: "A cellular volume reduction exceeding what threshold is critical for triggering acute hyperosmolar neurological symptoms?",
                options: ["2%", "5%", "10%", "20%"],
                answer: 2,
                exp: "A rapid 10% or greater decrease in cellular brain volume pulls brain tissue away from the cranium, stretching cerebral vessels and causing acute encephalopathy or hemorrhage."
            },
            {
                q: "Which trio of cellular waste products is explicitly listed in lecture as being pulled back into the distal capillary for systemic excretion?",
                options: ["Glucose, amino acids, and glycogen", "Albumin, globulin, and fibrinogen", "Sodium, potassium, and calcium", "Hydrogen ions (H+), carbon dioxide (CO2), and free radicals"],
                answer: 3,
                exp: "Distal capillaries reabsorb fluid containing key metabolic cellular wastes, explicitly highlighted as hydrogen ions (H+), carbon dioxide (CO2), and free radicals."
            },

            // --- MODULE 3: BIOCHEMISTRY & CELLULAR RESPIRATION ---
            {
                q: "Which isozyme of hexokinase is predominantly found in hepatic parenchymal cells and pancreatic beta cells, exhibiting a high Km for glucose?",
                options: ["Hexokinase 4 (Glucokinase)", "Hexokinase 1", "Hexokinase 2", "Hexokinase 3"],
                answer: 0,
                exp: "Hexokinase 4 (Glucokinase) is localized to the liver and pancreas. It has a high Km (low affinity) and is not inhibited by glucose-6-phosphate, functioning as a glucose sensor."
            },
            {
                q: "What is the committed, rate-limiting, and most heavily regulated enzyme in the glycolytic pathway?",
                options: ["Hexokinase", "Phosphofructokinase-1 (PFK-1)", "Pyruvate Kinase", "Phosphoglycerate Kinase"],
                answer: 1,
                exp: "PFK-1 catalyzes the irreversible phosphorylation of fructose-6-phosphate to fructose-1,6-bisphosphate and represents the primary committed regulatory checkpoint of glycolysis."
            },
            {
                q: "How does high cytosolic ATP regulate the enzyme Phosphofructokinase-1 (PFK-1)?",
                options: ["Competitively binds the active catalytic site to increase velocity", "Induces irreversible covalent proteolytic cleavage", "Binds to a distinct allosteric site to inhibit enzymatic activity", "Promotes phosphorylation by Protein Kinase A to activate the enzyme"],
                answer: 2,
                exp: "PFK-1 has two ATP binding sites: one at the catalytic substrate site and another at a low-affinity allosteric regulatory site where high ATP binds to allosterically inhibit the enzyme."
            },
            {
                q: "Via which specific transport mechanism does cytosolic pyruvate cross the inner mitochondrial membrane to reach the matrix?",
                options: ["Voltage-Dependent Anion Channel (VDAC)", "Malate-Aspartate Shuttle", "Carnitine Palmitoyltransferase", "Mitochondrial Pyruvate Carrier (MPC)"],
                answer: 3,
                exp: "Pyruvate passes freely through the outer membrane via porins, but requires the Mitochondrial Pyruvate Carrier (MPC) to traverse the impermeable inner mitochondrial membrane."
            },
            {
                q: "Why do mature erythrocytes rely entirely on anaerobic glycolysis and lactate dehydrogenase to maintain their energy requirements?",
                options: ["They lack mitochondria and cannot regenerate NAD+ via the electron transport chain", "Their intracellular glucose levels are too low to activate glucokinase", "Pyruvate kinase is genetically absent in red blood cells", "They lack the GLUT-1 transporter needed for oxidative metabolism"],
                answer: 0,
                exp: "RBCs contain no mitochondria. Without an electron transport chain to re-oxidize NADH back to NAD+, they must reduce pyruvate to lactate via Lactate Dehydrogenase to keep glycolysis running."
            },
            {
                q: "Which allosteric effector acts as a specific positive allosteric activator of mitochondrial Isocitrate Dehydrogenase?",
                options: ["AMP", "ADP", "NADH", "ATP"],
                answer: 1,
                exp: "Isocitrate dehydrogenase is the rate-limiting enzyme of the Krebs cycle. It is allosterically inhibited by ATP and NADH, and directly stimulated by ADP (not AMP)."
            },
            {
                q: "During cellular respiration, in which exact subcellular locations do glycolysis, the Krebs cycle, and oxidative phosphorylation specifically occur?",
                options: ["Glycolysis in cytosol; Krebs in cristae; Oxidative phosphorylation in matrix", "Glycolysis in outer membrane; Krebs in cytosol; Oxidative phosphorylation in matrix", "Glycolysis in cytosol; Krebs in mitochondrial matrix; Oxidative phosphorylation in inner mitochondrial membrane", "Glycolysis in matrix; Krebs in cytosol; Oxidative phosphorylation in intermembrane space"],
                answer: 2,
                exp: "Glycolysis takes place in the cytosol, the Krebs cycle occurs in the mitochondrial matrix, and oxidative phosphorylation is embedded in the inner mitochondrial membrane."
            },
            {
                q: "How many net ATP molecules are produced specifically by the process of oxidative phosphorylation per glucose molecule in human physiology?",
                options: ["2 ATP", "4 ATP", "32 ATP", "28 ATP"],
                answer: 3,
                exp: "In modern biochemistry/physiology accounting, 28 ATP are generated by oxidative phosphorylation (plus 2 from glycolysis and 2 from Krebs, yielding 32 total ATP)."
            },
            {
                q: "During an acute fast, hepatic glycogenolysis provides systemic blood glucose maintenance for approximately how long before gluconeogenesis becomes the dominant source?",
                options: ["12 to 24 hours", "4 to 6 hours", "48 to 72 hours", "5 to 7 days"],
                answer: 0,
                exp: "Hepatic glycogen stores are depleted within roughly 18–24 hours of fasting, after which de novo glucose synthesis via gluconeogenesis becomes the essential supplier."
            },

            // --- MODULE 4: CIRCULATORY & AIRWAY HISTOLOGY ---
            {
                q: "What is the primary functional differentiator between the tracheobronchial tree and the respiratory unit (acinus)?",
                options: ["The tracheobronchial tree performs gas exchange; the acinus conducts air", "The tracheobronchial tree only conducts air; the acinus performs gas exchange", "The tracheobronchial tree lacks smooth muscle; the acinus has a thick muscularis", "The tracheobronchial tree contains no cartilage; the acinus contains hyaline rings"],
                answer: 1,
                exp: "The tracheobronchial tree is purely a conducting zone (nose down to terminal bronchioles). The respiratory unit (respiratory bronchioles, alveolar ducts, sacs) contains alveoli for gas exchange."
            },
            {
                q: "What is the most distal (smallest) anatomical member of the conducting tracheobronchial tree before gas-exchanging alveoli appear?",
                options: ["Segmental bronchus", "Respiratory bronchiole", "Terminal bronchiole", "Alveolar duct"],
                answer: 2,
                exp: "Terminal bronchioles are the final segments of the conducting zone. Respiratory bronchioles mark the beginning of the respiratory zone as they exhibit scattered alveoli in their walls."
            },
            {
                q: "Which heart valve separates the left atrium from the left ventricle?",
                options: ["Tricuspid valve", "Aortic semilunar valve", "Pulmonic semilunar valve", "Mitral (bicuspid) valve"],
                answer: 3,
                exp: "The mitral valve (bicuspid / left AV valve) controls flow between the left atrium and left ventricle. The tricuspid valve separates the right atrium from the right ventricle."
            },
            {
                q: "In which anatomical subdivision of the mediastinum is the pericardial sac and heart located?",
                options: ["Middle mediastinum", "Superior mediastinum", "Anterior mediastinum", "Posterior mediastinum"],
                answer: 0,
                exp: "The heart and pericardial cavity are contained within the middle mediastinum (a division of the inferior mediastinum)."
            },
            {
                q: "What are the three structural layers of the microvascular basement membrane from internal to external?",
                options: ["Lamina densa, lamina lucida, tunica adventitia", "Lamina lucida, lamina densa, reticular lamina", "Endothelial lamina, internal elastic lamina, basal lamina", "Lamina basalis, lamina fenestrata, lamina fibrosum"],
                answer: 1,
                exp: "The basement membrane consists of the basal lamina (split into lamina lucida and lamina densa) and the underlying reticular lamina."
            },
            {
                q: "Which microvascular structures comprise the classical 'diabetic triopathy' of long-term microvascular end-organ damage?",
                options: ["Cardiomyopathy, hepatopathy, gastroparesis", "Macrovascular stroke, peripheral gangrene, aortic aneurysm", "Retinopathy, nephropathy, neuropathy", "Dermatopathy, splenomegaly, pancreatitis"],
                answer: 2,
                exp: "The classic microvascular triopathy of poorly controlled diabetes mellitus involves diabetic retinopathy (eyes), nephropathy (kidneys), and neuropathy (nerves)."
            },
            {
                q: "Which functional vessel class possesses the greatest total systemic cross-sectional area and the slowest velocity of blood flow?",
                options: ["Arterioles", "Muscular arteries", "Large venae cavae", "Capillaries"],
                answer: 3,
                exp: "Capillaries collectively possess the largest total cross-sectional area in the body, causing flow velocity to drop to its lowest level, optimizing nutrient and gas exchange."
            },

            // --- MODULE 5: SPINAL NERVES, REFLEXES & AUTONOMICS ---
            {
                q: "Through which anatomical structure do the C1 and C2 spinal nerves exit the spinal axis?",
                options: ["Above and below the proximal portion of the posterior arch of Atlas", "Through distinct intervertebral foramina formed by the C1 and C2 pedicles", "Through the anterior sacral foramina along the anterior arch", "Distal to the intertransverse space within the transverse foramina"],
                answer: 0,
                exp: "Spinal nerves C3 through L5 exit via true intervertebral foramina (IVF). However, C1 and C2 do not exit through an IVF; C1 leaves above the posterior arch of Atlas (running in the groove for the vertebral artery), and C2 exits below the posterior arch of Atlas."
            },
            {
                q: "Which spinal nerve pairs exit specifically through the sacral hiatus rather than through sacral intervertebral foramina?",
                options: ["S1 and S2", "The 5th sacral and 1st coccygeal spinal nerves", "S3 and S4", "The 4th sacral and 5th sacral spinal nerves"],
                answer: 1,
                exp: "Spinal nerves S1 through S4 exit through the anterior and posterior sacral foramina within the sacrum. Spinal nerves S5 and Co1 exit inferiorly through the sacral hiatus."
            },
            {
                q: "Which trio of structures is transmitted directly within the groove for the vertebral artery located on the posterior arch of the Atlas?",
                options: ["V2 vertebral artery, C2 spinal nerve, and greater occipital nerve", "V4 segment of the vertebral artery, dorsal root ganglion of C1, and spinal accessory nerve", "V3 segment of the vertebral artery, C1 spinal nerve, and suboccipital venous plexus", "Vertebral basilar junction, suboccipital nerve, and lesser occipital nerve"],
                answer: 2,
                exp: "The groove for the vertebral artery on the posterior arch of Atlas transmits the V3 segment of the vertebral artery, the C1 spinal nerve (suboccipital nerve), and the suboccipital venous plexus. C1 also characteristically lacks a dorsal root ganglion."
            },
            {
                q: "Which anatomical structures form the precise anatomical roof and floor of a typical lumbar intervertebral foramen (IVF)?",
                options: ["Superior and inferior articular facets", "Posterior longitudinal ligament and ligamentum flavum", "Intervertebral disc and posterior vertebral body", "Pedicles of the adjacent vertebrae"],
                answer: 3,
                exp: "The roof and floor of the intervertebral foramen (IVF) are formed by the pedicles of the adjacent vertebrae. The anterior wall is formed by the vertebral body and intervertebral disc; the posterior wall is formed by the zygapophyseal joint."
            },
            {
                q: "A patient presents with sharp back pain provoked during extension and rotation. Which specific neural branch transmits nociceptive input from the zygapophyseal (facet) joints and supplies the multifidus segmentally?",
                options: ["Medial branch of the dorsal ramus", "Lateral branch of the dorsal ramus", "Sinuvertebral nerve (recurrent meningeal nerve)", "Intermediate branch of the dorsal ramus"],
                answer: 0,
                exp: "The medial branch of the dorsal ramus innervates the zygapophyseal (facet / Z) joints (receiving sensation from its own level and the level above) and supplies the multifidus segmentally. It is the target of diagnostic medial branch blocks."
            },
            {
                q: "Annular tears through the outer lamellae of the intervertebral disc cause discogenic pain. Which nerve provides sensory innervation to the outer third of the annulus fibrosus to mediate this pain?",
                options: ["Medial branch of the dorsal ramus", "Sinuvertebral nerve", "Lateral branch of the dorsal ramus", "Gray ramus communicans directly"],
                answer: 1,
                exp: "Discogenic pain resulting from an annular tear is mediated through the sinuvertebral nerve (recurrent meningeal nerve of Luschka), which supplies the outer annulus fibrosus and the posterior longitudinal ligament."
            },
            {
                q: "According to anatomical research on spinal nociception, the L3 intervertebral disc receives sensory innervation from which specific nerve roots?",
                options: ["L3 sinuvertebral nerve only", "L3, L4, and L5 dorsal rami medial branches", "L3 and L2 sinuvertebral nerves", "L1 ventral ramus directly"],
                answer: 2,
                exp: "Intervertebral discs exhibit multi-level innervation. Specifically, the L3 disc is innervated by the L3 sinuvertebral nerve as well as fibers originating from the L2 sinuvertebral nerve above."
            },
            {
                q: "After unmyelinated postganglionic sympathetic fibers travel through the gray ramus communicans back into the ventral ramus, what pathway do the fibers destined for the posterior body take?",
                options: ["They pass directly across the anterior longitudinal ligament into the adjacent vertebra", "They ascend two full vertebral levels within the sympathetic chain before crossing the pedicle", "They exit the spinal cord through the dorsal sensory rootlets into the posterior primary division", "They travel proximally up the ventral ramus, touch the distal edge of the spinal nerve, and turn into the dorsal ramus"],
                answer: 3,
                exp: "Approximately 50% of postganglionic fibers in the ventral ramus continue distally to supply anterior targets. The other approximately 50% execute a U-turn, traveling proximally up the ventral ramus, touching the end of the spinal nerve, and descending down the dorsal ramus to supply posterior targets."
            },
            {
                q: "What is the primary physiological distinction between intrafusal muscle spindles and Golgi tendon organs (GTOs)?",
                options: ["Muscle spindles detect changes in muscle length and rate of stretch, whereas GTOs detect muscle tension and prevent overload damage", "Muscle spindles detect excessive tendon force, whereas GTOs detect light cutaneous touch", "Muscle spindles cause reciprocal contraction of antagonists, whereas GTOs cause agonist muscle spasm", "Muscle spindles are located exclusively in tendons, whereas GTOs are located in the center of the muscle belly"],
                answer: 0,
                exp: "Muscle spindles are arranged in parallel with extrafusal fibers and sense changes in muscle length and rate of stretch (mediating the stretch reflex). Golgi tendon organs (GTOs) are located in series at musculotendinous junctions and detect tension/overload, mediating the autogenic inhibitory reflex."
            },
            {
                q: "Which primary sensory afferent fiber type wraps around the central non-contractile region of nuclear bag and nuclear chain fibers to convey rapid stretch signals in the myotatic reflex arc?",
                options: ["Type Ib afferent fibers", "Type Ia afferent fibers", "Type C unmyelinated fibers", "Type A-delta fibers"],
                answer: 1,
                exp: "Type Ia afferent fibers (annulospiral endings) wrap around the central equatorial region of intrafusal fibers and transmit rapid dynamic stretch signals into the spinal cord. Type Ib afferents transmit tension signals from Golgi tendon organs."
            },
            {
                q: "According to the standardized Wexler reflex grading scale, what score represents a normal, average physiological response during deep tendon reflex testing?",
                options: ["0", "1+", "2+", "4+"],
                answer: 2,
                exp: "On the standard Wexler scale: 0 = absent reflex; 1+ = hypoactive / trace response; 2+ = normal / average physiological response; 3+ = hyperactive / brisk without clonus; 4+ = hyperactive with transient or sustained clonus."
            },
            {
                q: "When eliciting a patellar tendon reflex proves difficult in a tense patient, the clinician instructs the patient to hook their flexed fingers together and pull apart isometrically. What is the clinical name and purpose of this reinforcement maneuver?",
                options: ["Valsalva maneuver; to elevate intrathoracic pressure and stimulate baroreceptors", "Spurling maneuver; to compress the cervical neural foramen", "Lhermitte test; to provoke posterior column paresthesias", "Jendrassik maneuver; to reduce central supraspinal inhibition and facilitate the spinal reflex arc"],
                answer: 3,
                exp: "The Jendrassik maneuver is a reinforcement technique where the patient performs isometric contraction of remote muscle groups (e.g., hooking fingers and pulling apart). This transiently reduces central supraspinal inhibition, facilitating lower extremity alpha motor neuron pools."
            },
            {
                q: "Dr. Gillard emphasizes that board exams frequently swap terminology. Which term is strictly synonymous with 'neurological level'?",
                options: ["Spinal nerve root", "Spinal cord segment", "Sympathetic ganglion", "Ventral ramus"],
                answer: 0,
                exp: "Dr. Gillard's notes emphasize: 'In order to assess the nerve root health of the different neurological levels (a.k.a.s: spinal nerve roots, neurological levels). Note: it's very important that the student memorizes the different a.k.a.s - you'll never know which way the boards will ask the question!'"
            },
            {
                q: "Which of the following is considered the preferred physiological terminology for what clinicians commonly refer to as a 'deep tendon reflex' (DTR)?",
                options: ["Inverse myotatic reflex", "Muscle stretch reflex (stretch reflex or myotatic reflex)", "Autogenic inhibitory reflex", "Cutaneous flexor withdrawal reflex"],
                answer: 1,
                exp: "As highlighted in lecture: 'Reflexes: the basics - best terminology: muscle stretch reflex, stretch reflex, or myotatic reflex. Note: even though clinicians still use the term deep tendon reflex (DTR), the receptor is in the muscle spindle, not the tendon.'"
            }
        ];

        let currentQuestions = [];
        let score = 0;
        let answeredCount = 0;

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function initQuiz() {
            score = 0;
            answeredCount = 0;
            document.getElementById('results-card').style.display = 'none';
            updateScoreDisplay();

            // Clone and shuffle questions
            currentQuestions = shuffle(JSON.parse(JSON.stringify(quizData)));

            const container = document.getElementById('quiz-container');
            container.innerHTML = '';

            currentQuestions.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `q-card-${index}`;

                card.innerHTML = `
                    <div class="q-number">Question ${index + 1} of ${currentQuestions.length}</div>
                    <div class="q-text">${item.q}</div>
                    <div class="options-grid" id="opt-grid-${index}">
                        ${item.options.map((opt, optIdx) => `
                            <button class="option-btn" onclick="handleAnswer(${index}, ${optIdx})">${opt}</button>
                        `).join('')}
                    </div>
                    <div class="explanation-box" id="exp-${index}">
                        <strong>Key Concept:</strong> ${item.exp}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function handleAnswer(qIndex, selectedIdx) {
            const card = document.getElementById(`q-card-${qIndex}`);
            const buttons = card.querySelectorAll('.option-btn');
            const expBox = document.getElementById(`exp-${qIndex}`);
            const correctIdx = currentQuestions[qIndex].answer;

            // Lock all buttons
            buttons.forEach(btn => btn.disabled = true);

            if (selectedIdx === correctIdx) {
                buttons[selectedIdx].classList.add('correct');
                score++;
            } else {
                buttons[selectedIdx].classList.add('incorrect');
                buttons[correctIdx].classList.add('correct');
            }

            expBox.style.display = 'block';
            answeredCount++;
            updateScoreDisplay();

            if (answeredCount === currentQuestions.length) {
                showResults();
            }
        }

        function updateScoreDisplay() {
            const percentage = answeredCount === 0 ? 0 : Math.round((score / answeredCount) * 100);
            document.getElementById('score-display').textContent = `Score: ${score} / ${answeredCount} (${percentage}%)`;
        }

        function showResults() {
            const resultsCard = document.getElementById('results-card');
            const finalStats = document.getElementById('final-stats');
            const feedbackMsg = document.getElementById('feedback-message');
            const total = currentQuestions.length;
            const pct = Math.round((score / total) * 100);

            finalStats.textContent = `You scored ${score} out of ${total} (${pct}%)`;

            if (pct >= 90) {
                feedbackMsg.textContent = "Exceptional mastery of all core slide concepts and physiological pathways across all five modules!";
            } else if (pct >= 75) {
                feedbackMsg.textContent = "Strong foundation! Review the flagged rationales for the missed questions.";
            } else {
                feedbackMsg.textContent = "Review the slides and transcripts for these topics and re-test.";
            }

            resultsCard.style.display = 'block';
            resultsCard.scrollIntoView({ behavior: 'smooth' });
        }

        window.onload = initQuiz;
    </script>
