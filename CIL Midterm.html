<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Hub - CIL II Clinical Instrumentation & Exam Tech</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --surface-color: #1a1a1a;
            --surface-border: #2a2a2a;
            --accent-color: #ff9900;
            --accent-hover: #e68a00;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --correct-bg: #14532d;
            --correct-border: #22c55e;
            --incorrect-bg: #7f1d1d;
            --incorrect-border: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; padding-bottom: 60px; user-select: none; }

        /* Sticky Top Header */
        header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(8px);
            border-bottom: 2px solid var(--accent-color);
            padding: 12px 20px;
            display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px;
        }
        .header-brand { display: flex; flex-direction: column; gap: 2px; }
        .header-title { font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
        .header-subtitle { font-size: 11px; color: var(--text-muted); font-weight: 600; letter-spacing: 0.3px; }
        .header-badge { background: var(--accent-color); color: #000; font-size: 11px; font-weight: 900; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; }
        
        .header-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .btn {
            background: #252525; color: #fff; border: 1px solid #444; border-radius: 6px;
            padding: 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.2s ease;
        }
        .btn:hover:not(:disabled) { border-color: var(--accent-color); color: var(--accent-color); }
        .btn.active { background: var(--accent-color); color: #000; border-color: var(--accent-color); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .stat-pill {
            background: #111; color: #fff; border: 1px solid #333; border-radius: 6px;
            padding: 6px 10px; font-size: 12px; font-weight: 700; cursor: default;
        }

        .progress-container { width: 100%; height: 4px; background: #222; position: absolute; bottom: 0; left: 0; }
        .progress-bar { height: 100%; width: 0%; background: var(--accent-color); transition: width 0.3s ease; }

        /* Layout Container */
        .main-container { max-width: 900px; margin: 24px auto; padding: 0 16px; }

        /* Home / Selection Interface */
        .dashboard-card {
            background: var(--surface-color); border: 1px solid var(--surface-border);
            border-radius: 12px; padding: 24px; margin-bottom: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .section-heading { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 12px; }
        
        .chip-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
        .subject-chip {
            background: #222; border: 1px solid #333; color: #ccc;
            padding: 8px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s;
        }
        .subject-chip:hover { border-color: #555; }
        .subject-chip.active { background: var(--accent-color); color: #000; border-color: var(--accent-color); font-weight: 800; }
        
        .control-row { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
        .pool-counter {
            background: #141414; border: 1px solid #2b2b2b; border-left: 3px solid var(--accent-color);
            padding: 10px 14px; border-radius: 6px; font-size: 13px; color: #ddd; margin-bottom: 22px; font-weight: 600;
        }
        .pool-counter span { color: var(--accent-color); font-weight: 800; }

        .launcher-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 12px; }
        .launch-btn {
            background: linear-gradient(135deg, #2a2a2a, #1f1f1f); border: 1px solid #333;
            color: #fff; padding: 14px 10px; border-radius: 8px; font-size: 13px; font-weight: 800; text-align: center; cursor: pointer; transition: all 0.2s;
        }
        .launch-btn:hover { border-color: var(--accent-color); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(255, 153, 0, 0.2); }
        .launch-btn.primary { background: linear-gradient(135deg, var(--accent-color), var(--accent-hover)); color: #000; border-color: var(--accent-color); }

        /* Quiz Card Styling */
        .quiz-card {
            background: var(--surface-color); border: 1px solid var(--surface-border);
            border-radius: 12px; padding: 24px; margin-bottom: 20px; position: relative;
        }
        .card-meta { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
        .meta-tags { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .pill-tag { background: #252525; color: #aaa; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; border: 1px solid #333; }
        .pill-tag.priority { border-color: #ef4444; color: #ef4444; }

        .stem-text { font-size: 16px; font-weight: 600; line-height: 1.5; margin-bottom: 20px; color: #f0f0f0; }

        .options-list { display: flex; flex-direction: column; gap: 10px; }
        .option-item {
            background: #202020; border: 1px solid #303030; border-radius: 8px;
            padding: 12px 16px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; display: flex; align-items: flex-start; gap: 10px;
        }
        .option-item:hover:not(.locked) { background: #262626; border-color: #555; }
        .option-prefix { font-weight: 800; color: var(--accent-color); min-width: 18px; }

        /* Feedback Styles */
        .option-item.correct { background: var(--correct-bg) !important; border-color: var(--correct-border) !important; color: #fff; font-weight: 700; }
        .option-item.incorrect { background: var(--incorrect-bg) !important; border-color: var(--incorrect-border) !important; color: #fff; }
        .option-item.locked { cursor: default; }

        .explanation-card {
            background: #151515; border: 1px solid #282828; border-radius: 8px;
            padding: 16px; margin-top: 18px; display: none;
        }
        .explanation-card.show { display: block; }
        .status-banner {
            font-size: 14px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px;
            padding: 8px 12px; border-radius: 6px; margin-bottom: 12px;
        }
        .status-banner.correct { background: var(--correct-bg); border: 1px solid var(--correct-border); color: #dcfce7; }
        .status-banner.incorrect { background: var(--incorrect-bg); border: 1px solid var(--incorrect-border); color: #fee2e2; }

        .rationale-row { font-size: 13px; line-height: 1.45; margin-bottom: 8px; padding-left: 10px; border-left: 3px solid #333; }
        .rationale-row:last-child { margin-bottom: 0; }
        .rationale-row.correct-ref { border-left-color: var(--correct-border); color: #dcfce7; }
        .rationale-row.incorrect-ref { border-left-color: var(--incorrect-border); color: #fca5a5; }

        /* Meme popup */
        .wrong-popup {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 1000; pointer-events: none; transition: opacity 0.2s ease;
        }
        .wrong-popup.hidden { display: none; opacity: 0; }
        .wrong-popup img { max-width: 280px; max-height: 280px; border-radius: 12px; border: 3px solid var(--incorrect-border); box-shadow: 0 0 30px rgba(239,68,68,0.5); }

        /* Bottom Controls */
        .bottom-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
        .nav-btn { background: var(--accent-color); color: #000; border: none; padding: 10px 24px; border-radius: 6px; font-weight: 800; font-size: 13px; cursor: pointer; text-transform: uppercase; transition: background 0.2s; }
        .nav-btn:hover { background: var(--accent-hover); }

        /* Summary View */
        .summary-card { background: var(--surface-color); border-radius: 12px; border: 1px solid var(--surface-border); padding: 32px; text-align: center; }
        .score-circle { width: 140px; height: 140px; border-radius: 50%; border: 6px solid var(--accent-color); margin: 0 auto 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 32px; font-weight: 900; }
        .score-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; }
    </style>
</head>
<body>

    <audio id="wrongAudio" src="Wrong-answer.mp3" preload="auto"></audio>
    <div id="wrongPopup" class="wrong-popup hidden">
        <img id="wrongImage" src="Erijah.png" alt="Incorrect Feedback">
    </div>

    <!-- Header Navigation -->
    <header>
        <div class="header-brand">
            <div class="header-title">
                <span class="header-badge">NBCE Drill</span>
                <span>CIL II Instrumentation Tech</span>
            </div>
            <div class="header-subtitle">Myovision ROM • Kinetisense Posture • Insight Subluxation Station</div>
        </div>
        <div class="header-controls">
            <button id="menuBtn" class="btn" onclick="renderHome()">Menu / Filter</button>
            <button id="modeBtn" class="btn" onclick="toggleMode()">View: One by One</button>
            <button id="stfuBtn" class="btn" onclick="toggleErijah()">STFU Erijah</button>
            <div id="progressPill" class="stat-pill">Q 0 of 0</div>
            <div id="scorePill" class="stat-pill">Score: 0 / 0 (0%)</div>
        </div>
        <div class="progress-container">
            <div id="progressBar" class="progress-bar"></div>
        </div>
    </header>

    <div class="main-container" id="appRoot"></div>

    <script>
        const SUBJECTS = [
            { title: "Myovision Range of Motion (ROM)", week: "CIL II" },
            { title: "Kinetisense Posture Analysis", week: "CIL II" },
            { title: "Insight Subluxation Station (Rolling Thermal, sEMG, HRV)", week: "CIL II" }
        ];

        /* EXHAUSTIVE QUESTION BANK COMPILED FROM LECTURE NOTES */
        const questionBank = [
            /* =========================================================================
               SUBJECT 0: MYOVISION RANGE OF MOTION (ROM)
               ========================================================================= */
            {
                id: 0,
                subjectIndex: 0,
                week: "CIL II",
                slideRef: "Notes Page 1",
                difficulty: "easy",
                priority: true,
                stem: "What physical mechanism governs the measurement functionality of the Myovision ROM inclinometers?",
                options: [
                    { text: "Gravity", correct: true, why: "Myovision inclinometers function via gravitational pendulums/mechanisms. [Page 1]" },
                    { text: "Magnetic field flux", correct: false, why: "Does not rely on active magnetometers or flux. [Page 1]" },
                    { text: "Infrared thermal sensors", correct: false, why: "Thermal sensors are utilized in rolling thermography, not ROM inclinometers. [Page 1]" },
                    { text: "Surface plethysmography", correct: false, why: "Plethysmography measures vascular pulse, not inclinometry. [Page 1]" }

            },
            {

                slideRef: "Notes Page 1",

                priority: true,
                stem: "When entering patient demographic credentials into Myovision, which parameters are strictly required?",

                    { text: "Two letters of first name, two letters of last name, and gender", correct: true, why: "Notes state explicitly: '2 letters first, last name; Gender no ID#'. [Page 1]" },

                    { text: "Six-digit clinic patient ID and biological sex", correct: false, why: "Notes explicitly state 'no ID#'. [Page 1]" },

            {

                week: "CIL II",
                slideRef: "Notes Page 1",

                    { text: "+/- 10° acceptable (+/- 5° ideal)", correct: true, why: "Notes state: '+/- 5° ideal, +/- 10° acceptable'. [Page 1]" },

                    { text: "+/- 15° acceptable (+/- 8° ideal)", correct: false, why: "Exceeds clinical tolerance guidelines. [Page 1]" },
                    { text: "+/- 20° acceptable (+/- 12° ideal)", correct: false, why: "Excessive variance exceeding clinical standards. [Page 1]" }
                ]
            },
            {
                id: 4,
                subjectIndex: 0,
                week: "CIL II",
                slideRef: "Notes Page 1",
                difficulty: "easy",
                priority: false,
                stem: "What is the ideal target variance between consecutive Myovision ROM trials?",
                options: [
                    { text: "+/- 5°", correct: true, why: "Documented as '+/- 5° ideal'. [Page 1]" },
                    { text: "+/- 10°", correct: false, why: "+/- 10° is acceptable, but not ideal. [Page 1]" },
                    { text: "+/- 0°", correct: false, why: "Zero variance is biologically unrealistic. [Page 1]" },

            },
            {
                id: 5,

                priority: true,
                stem: "During cervical flexion and extension testing, how must the inclinometers be positioned?",

            },
            {
                id: 6,
                subjectIndex: 0,
                week: "CIL II",
                slideRef: "Notes Page 1",
                difficulty: "easy",
                priority: false,
                stem: "Cervical flexion and extension occur in the _______ plane.",
                options: [
                    { text: "Sagittal", correct: true, why: "Flexion/extension movements occur in the sagittal plane. [Page 1]" },
                    { text: "Coronal", correct: false, why: "Lateral flexion occurs in the coronal plane. [Page 1]" },
                    { text: "Transverse", correct: false, why: "Axial rotation occurs in the transverse plane. [Page 1]" },

            {

                    { text: "Oblique", correct: false, why: "Standard ROM isolates cardinal orthogonal planes. [Page 1]" }

            },

        /* TRUE FISHER-YATES RANDOMIZATION ENGINE */
        function fisherYatesShuffle(arr) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        function cloneAndShuffleQuestion(q) {
            return {
                ...q,
                options: fisherYatesShuffle(q.options.map(opt => ({ ...opt })))
            };
        }

        /* APPLICATION STATE & PERSISTENCE */
        let hist = {};
        try { hist = JSON.parse(localStorage.getItem('quiz_missed_history') || '{}'); } catch (e) {}
        const saveHistory = () => { try { localStorage.setItem('quiz_missed_history', JSON.stringify(hist)); } catch (e) {} };

        let selectedSubjects = new Set(SUBJECTS.map((_, i) => i));
        let prioritizeMissed = false;
        let quizQuestions = [];

        let currentIndex = 0;
        let score = 0;

        try { muted = localStorage.getItem('stfuErijah') === '1'; } catch (e) {}
        try { viewMode = localStorage.getItem('quizViewMode') || 'single'; } catch (e) {}

        const $ = id => document.getElementById(id);

        function updateHeaderStats() {
            const total = quizQuestions.length;
            const answeredCount = userAnswers.filter(a => a !== null).length;
            const pct = total > 0 ? Math.round((answeredCount / total) * 100) : 0;
            const acc = answeredCount > 0 ? Math.round((score / answeredCount) * 100) : 0;

            $('progressBar').style.width = `${pct}%`;
            $('scorePill').textContent = `Score: ${score} / ${answeredCount} (${acc}%)`;

            if (total === 0) {
                $('progressPill').textContent = 'Q 0 of 0';
            } else if (viewMode === 'all') {
                $('progressPill').textContent = `Answered ${answeredCount} of ${total}`;
            } else {
                $('progressPill').textContent = `Q ${currentIndex + 1} of ${total}`;
            }
        }

        function updateModeButton() {
            const b = $('modeBtn');
            if (!b) return;
            b.textContent = viewMode === 'all' ? 'View: All at Once' : 'View: One by One';
            b.classList.toggle('active', viewMode === 'all');
        }

        function toggleMode() {
            const prevScroll = window.scrollY;
            viewMode = viewMode === 'all' ? 'single' : 'all';
            try { localStorage.setItem('quizViewMode', viewMode); } catch (e) {}
            updateModeButton();
            if (quizQuestions.length > 0) {
                renderActiveQuiz();
                window.scrollTo(0, prevScroll);
            } else {
                renderHome();
            }
        }

        function toggleErijah() {
            muted = !muted;
            try { localStorage.setItem('stfuErijah', muted ? '1' : '0'); } catch (e) {}
            const b = $('stfuBtn');

                b.classList.toggle('active', muted);

        /* HOME / LAUNCHER VIEW */
        function renderHome() {
            quizQuestions = [];
            activeBasePool = [];
            userAnswers = [];
            currentIndex = 0;
            score = 0;
            updateHeaderStats();
            updateModeButton();

            const missedCount = Object.keys(hist).filter(id => hist[id] > 0).length;
            const filteredPool = questionBank.filter(q => selectedSubjects.has(q.subjectIndex));
            const highYieldCount = filteredPool.filter(q => q.priority).length;

            const html = `

        function toggleSubject(idx) {
            if (selectedSubjects.has(idx)) {
                if (selectedSubjects.size > 1) selectedSubjects.delete(idx);
            } else {
                selectedSubjects.add(idx);
            }
            renderHome();

        function selectAllSubjects(all) {
            if (all) selectedSubjects = new Set(SUBJECTS.map((_, i) => i));

        function togglePrioritizeMissed() {
            prioritizeMissed = !prioritizeMissed;

        function setDisplayMode(mode) {
            viewMode = mode;
            try { localStorage.setItem('quizViewMode', mode); } catch (e) {}
            renderHome();

        /* QUIZ ENGINE WITH TWO-WAY FISHER-YATES SHUFFLE */
        function buildShuffledQuiz(pool, count) {
            let orderedPool;
            if (prioritizeMissed) {
                // Shuffle first so ties in miss count are randomly ordered, then sort highest missed first
                orderedPool = fisherYatesShuffle(pool).sort((a, b) => (hist[b.id] || 0) - (hist[a.id] || 0));
            } else {
                orderedPool = fisherYatesShuffle(pool);
            }

            const sliced = orderedPool.slice(0, Math.min(count, orderedPool.length));
            // Shuffle both question order and each question's 4 answer choices
            return fisherYatesShuffle(sliced).map(q => cloneAndShuffleQuestion(q));
        }

        function startQuiz(count) {
            let pool = questionBank.filter(q => selectedSubjects.has(q.subjectIndex));
            if (pool.length === 0) pool = [...questionBank];

            activeBasePool = pool;
            quizQuestions = buildShuffledQuiz(pool, count);
            userAnswers = new Array(quizQuestions.length).fill(null);
            currentIndex = 0;
            score = 0;
            window.scrollTo(0, 0);
            renderActiveQuiz();
        }

        function retakeSameExam() {
            const count = quizQuestions.length;
            const pool = activeBasePool.length > 0 ? activeBasePool : [...questionBank];
            quizQuestions = buildShuffledQuiz(pool, count);
            userAnswers = new Array(quizQuestions.length).fill(null);
            currentIndex = 0;
            score = 0;
            window.scrollTo(0, 0);
            renderActiveQuiz();
        }

        function renderActiveQuiz() {
            updateHeaderStats();
            if (viewMode === 'all') renderAllQuestions();
            else renderQuestion();
        }

        function buildExplanationHtml(q, chosenIdx) {
            if (chosenIdx === null) return '';
            const wasCorrect = q.options[chosenIdx].correct;
            const bannerClass = wasCorrect ? 'correct' : 'incorrect';
            const bannerText = wasCorrect ? 'Correct!' : 'Incorrect.';

            const rows = q.options.map((opt, i) => {
                const prefix = String.fromCharCode(65 + i);
                const rClass = opt.correct ? 'correct-ref' : 'incorrect-ref';
                const tag = opt.correct ? '[CORRECT]' : '[INCORRECT]';
                return `<div class="rationale-row ${rClass}"><strong>${prefix}) ${tag}:</strong> ${opt.why}</div>`;
            }).join('');

            return `
                <div class="explanation-card show">
                    <div class="status-banner ${bannerClass}">${bannerText}</div>
                    ${rows}
                </div>
            `;
        }

        /* MODE 1: ONE BY ONE */
        function renderQuestion() {
            const q = quizQuestions[currentIndex];
            const chosenIdx = userAnswers[currentIndex];
            const answered = chosenIdx !== null;
            const sub = SUBJECTS[q.subjectIndex];

            updateHeaderStats();

            const optionsHtml = q.options.map((opt, i) => {
                let cls = 'option-item';
                if (answered) {
                    cls += ' locked';
                    if (opt.correct) cls += ' correct';
                    else if (chosenIdx === i) cls += ' incorrect';
                }
                const prefix = String.fromCharCode(65 + i);
                return `<div class="${cls}" onclick="handleOptionSelect(${i})">
                    <span class="option-prefix">${prefix}.</span>
                    <span>${opt.text}</span>
                </div>`;
            }).join('');

            const html = `
                <div class="quiz-card">
                    <div class="card-meta">
                        <div class="meta-tags">
                            <span class="pill-tag">${sub.week}</span>
                            <span class="pill-tag">${sub.title}</span>
                            ${q.priority ? '<span class="pill-tag priority">HIGH YIELD</span>' : ''}
                        </div>
                        <span class="pill-tag">${q.difficulty.toUpperCase()}</span>
                    </div>
                    <div class="stem-text">${q.stem}</div>
                    <div class="options-list">${optionsHtml}</div>
                    ${buildExplanationHtml(q, chosenIdx)}
                    <div class="bottom-nav">
                        <button class="btn" onclick="navigateStep(-1)" ${currentIndex === 0 ? 'disabled' : ''}>Previous</button>
                        ${answered ? 
                            (currentIndex === quizQuestions.length - 1 ? 
                                `<button class="nav-btn" onclick="showSummary()">Finish & View Score</button>` : 
                                `<button class="nav-btn" onclick="navigateStep(1)">Next Question</button>`) : 
                            `<div></div>`
                        }
                    </div>
                </div>
            `;
            $('appRoot').innerHTML = html;
        }

        /* MODE 2: ALL AT ONCE */
        function renderAllQuestions() {
            const answeredCount = userAnswers.filter(a => a !== null).length;
            updateHeaderStats();

            let html = quizQuestions.map((q, qIndex) => {
                const chosenIdx = userAnswers[qIndex];
                const answered = chosenIdx !== null;
                const sub = SUBJECTS[q.subjectIndex];

                const optionsHtml = q.options.map((opt, i) => {
                    let cls = 'option-item';
                    if (answered) {
                        cls += ' locked';
                        if (opt.correct) cls += ' correct';
                        else if (chosenIdx === i) cls += ' incorrect';
                    }
                    const prefix = String.fromCharCode(65 + i);
                    return `<div class="${cls}" onclick="handleOptionSelectAllMode(${qIndex}, ${i})">
                        <span class="option-prefix">${prefix}.</span>
                        <span>${opt.text}</span>
                    </div>`;
                }).join('');

                return `
                    <div class="quiz-card" id="card-${qIndex}">
                        <div class="card-meta">
                            <div class="meta-tags">
                                <span class="pill-tag" style="background:var(--accent-color); color:#000;">Q${qIndex + 1}</span>
                                <span class="pill-tag">${sub.title}</span>
                                ${q.priority ? '<span class="pill-tag priority">HIGH YIELD</span>' : ''}
                            </div>
                            <span class="pill-tag">${q.difficulty.toUpperCase()}</span>
                        </div>
                        <div class="stem-text">${q.stem}</div>
                        <div class="options-list">${optionsHtml}</div>
                        ${buildExplanationHtml(q, chosenIdx)}
                    </div>
                `;
            }).join('');

            if (answeredCount === quizQuestions.length) {
                html += `
                    <div style="text-align:center; margin:30px 0;">
                        <button class="nav-btn" style="font-size:16px; padding:14px 32px;" onclick="showSummary()">View Final Exam Breakdown</button>
                    </div>
                `;
            }

            $('appRoot').innerHTML = html;
        }

        /* ANSWER SELECTION HANDLERS */
        function handleOptionSelect(optIdx) {
            if (userAnswers[currentIndex] !== null) return;
            evaluateSelection(currentIndex, optIdx);
            renderQuestion();
        }

        function handleOptionSelectAllMode(qIdx, optIdx) {
            if (userAnswers[qIdx] !== null) return;
            const prevScroll = window.scrollY;
            evaluateSelection(qIdx, optIdx);
            renderAllQuestions();
            window.scrollTo(0, prevScroll);
        }

        function evaluateSelection(qIdx, optIdx) {
            userAnswers[qIdx] = optIdx;
            const q = quizQuestions[qIdx];
            const isCorrect = q.options[optIdx].correct;

            if (isCorrect) {
                score++;
                if (hist[q.id]) {
                    hist[q.id] = Math.max(0, hist[q.id] - 1);
                    if (hist[q.id] === 0) delete hist[q.id];
                }
            } else {
                hist[q.id] = (hist[q.id] || 0) + 1;
                triggerWrongFeedback();
            }
            saveHistory();
        }

        function triggerWrongFeedback() {
            if (muted) return;
            const audio = $('wrongAudio');
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(() => {});
            }
            const popup = $('wrongPopup');
            if (popup) {
                popup.classList.remove('hidden');
                if (popupTimeout) clearTimeout(popupTimeout);
                popupTimeout = setTimeout(() => {
                    popup.classList.add('hidden');
                }, 1200);
            }
        }

        function navigateStep(delta) {
            const nextIdx = currentIndex + delta;
            if (nextIdx >= 0 && nextIdx < quizQuestions.length) {
                currentIndex = nextIdx;
                renderQuestion();
            }
        }

        /* RESULTS BREAKDOWN */
        function showSummary() {
            const pct = Math.round((score / quizQuestions.length) * 100);
            $('progressBar').style.width = '100%';

            let gradeComment = "Keep drilling to solidify clinical reflexes.";
            if (pct >= 90) gradeComment = "Outstanding mastery. You are fully board ready on this technical instrumentation.";
            else if (pct >= 75) gradeComment = "Solid passing performance. Review missed kinematic setups.";

            const html = `
                <div class="summary-card">
                    <div class="score-circle">
                        <span>${pct}%</span>
                        <span class="score-label">${score} / ${quizQuestions.length} Correct</span>
                    </div>
                    <h2 style="margin-bottom:10px;">${gradeComment}</h2>
                    <p style="color:var(--text-muted); margin-bottom:24px;">Performance records updated in local browser cache.</p>
                    <div style="display:flex; justify-content:center; gap:12px; flex-wrap:wrap;">
                        <button class="btn" style="padding:10px 20px; font-weight:800;" onclick="renderHome()">Return to Dashboard</button>
                        <button class="nav-btn" onclick="retakeSameExam()">Retake Same Exam</button>
                    </div>
                </div>
            `;
            $('appRoot').innerHTML = html;
        }

        // Initialize App on load
        window.addEventListener('DOMContentLoaded', () => {
            renderHome();
            if (muted) {
                const b = $('stfuBtn');
                if (b) { b.textContent = 'Bring Back Erijah'; b.classList.add('active'); }
            }
        });
    </script>
</body>
</html>
