<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>General Foundations & Bioenergetics Quiz Hub</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --border-color: #282828;
            --accent: #ff9900;
            --text-main: #ffffff;
            --text-muted: #888888;
            --correct-bg: #14532d;
            --correct-border: #22c55e;
            --incorrect-bg: #7f1d1d;
            --incorrect-border: #ef4444;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            padding-top: 80px;
        }

        /* Sticky Top Bar */
        .sticky-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(26, 26, 26, 0.95);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            z-index: 1000;
        }

        .header-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent);
            margin: 0;
        }

        .score-display {
            font-size: 1rem;
            font-weight: 600;
            background: var(--border-color);
            padding: 6px 14px;
            border-radius: 20px;
        }

        /* Main Container */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .intro-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 30px;
            text-align: center;
        }

        .intro-card h1 {
            margin-top: 0;
            color: var(--accent);
            font-size: 1.8rem;
        }

        .intro-card p {
            color: var(--text-muted);
            line-height: 1.5;
        }

        /* Question Card */
        .question-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            transition: all 0.3s ease;
        }

        .question-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .question-stem {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        /* Options */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px 18px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--accent);
            background-color: rgba(255, 153, 0, 0.05);
        }

        .option-btn:disabled {
            cursor: default;
        }

        .option-btn.correct {
            background-color: var(--correct-bg);
            border-color: var(--correct-border);
        }

        .option-btn.incorrect {
            background-color: var(--incorrect-bg);
            border-color: var(--incorrect-border);
        }

        /* Explanation Box */
        .explanation-box {
            margin-top: 20px;
            padding: 18px;
            border-radius: 8px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            display: none;
        }

        .explanation-banner {
            font-weight: 700;
            font-size: 1.05rem;
            margin-bottom: 8px;
        }

        .explanation-banner.correct-banner {
            color: var(--correct-border);
        }

        .explanation-banner.incorrect-banner {
            color: var(--incorrect-border);
        }

        .explanation-ref {
            font-size: 0.85rem;
            color: var(--accent);
            margin-bottom: 12px;
            font-weight: 600;
        }

        .explanation-summary {
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 14px;
            color: var(--text-main);
        }

        .rationale-list {
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .rationale-item {
            font-size: 0.9rem;
            line-height: 1.4;
            color: var(--text-muted);
        }

        .rationale-item strong {
            color: var(--text-main);
        }

        /* Summary Scorecard Modal / View */
        .scorecard {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            display: none;
            margin-top: 30px;
        }

        .scorecard h2 {
            color: var(--accent);
            margin-top: 0;
        }

        .retake-btn {
            background-color: var(--accent);
            color: #000;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 20px;
            transition: opacity 0.2s;
        }

        .retake-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>

                options: [
                    { text: "Because a substantial portion of the free energy is dissipated as thermal energy (heat).", correct: true, why: "Correct because biological energy transformations involve frictional and stepping losses, releasing significant metabolic heat. [Slide #44]" },
                    { text: "Because ATP synthases operate exclusively via endergonic absorption of room light.", correct: false, why: "Incorrect because ATP synthesis is driven by proton flow, not light absorption. [Slide #44]" },

                stem: "What structural consequence does excessive thermal energy (fever or hyperthermia) inflict upon delicate biological polymers like collagen ligaments?",

                    { text: "Increased molecular kinetic momentum leads to destructive intermolecular collisions and structural damage.", correct: true, why: "Correct because thermal energy increases translational and rotational momentum, causing violent atomic collisions that stress and damage delicate structural proteins. [Slide #54]" },

        let shuffledQuestions = [];
        let userAnswers = {};

        // Two-way Fisher-Yates Shuffle Algorithm
        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function initQuiz() {
            // Shuffle questions (Question order randomization)
            shuffledQuestions = shuffleArray([...quizData]).map(q => {
                // Shuffle options within each question (Option order randomization)
                let clonedOptions = q.options.map((opt, idx) => ({ ...opt, originalIndex: idx }));
                return {
                    ...q,
                    options: shuffleArray(clonedOptions)
                };
            });

            userAnswers = {};
            document.getElementById('scorecard').style.display = 'none';
            renderQuiz();
            updateScoreDisplay();
        }

        function renderQuiz() {
            const container = document.getElementById('quizContainer');
            container.innerHTML = '';

            shuffledQuestions.forEach((q, qIndex) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `question-card-${q.id}`;

                let optionsHTML = '';
                q.options.forEach((opt, optIndex) => {
                    optionsHTML += `
                        <button class="option-btn" id="q${q.id}-opt${optIndex}" onclick="selectOption(${q.id}, ${optIndex})">
                            <span style="font-weight:700; min-width:24px;">${String.fromCharCode(65 + optIndex)}.</span>
                            <span>${opt.text}</span>
                        </button>
                    `;
                });

                card.innerHTML = `
                    <div class="question-meta">
                        <span>Question ${qIndex + 1} of ${shuffledQuestions.length}</span>
                        <span>Quarter ${q.quarter} | Slide Ref #${q.slideRef}</span>
                    </div>
                    <div class="question-stem">${q.stem}</div>
                    <div class="options-list" id="q${q.id}-options">
                        ${optionsHTML}
                    </div>
                    <div class="explanation-box" id="q${q.id}-explanation">
                        <div class="explanation-banner" id="q${q.id}-banner"></div>
                        <div class="explanation-ref">Reference: Slide #${q.slideRef}</div>
                        <div class="explanation-summary" id="q${q.id}-summary"></div>
                        <div class="rationale-list" id="q${q.id}-rationales"></div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function selectOption(questionId, selectedOptIndex) {
            if (userAnswers[questionId] !== undefined) return; // Prevent changing answer once locked

            userAnswers[questionId] = selectedOptIndex;
            const qObj = shuffledQuestions.find(q => q.id === questionId);
            const selectedOpt = qObj.options[selectedOptIndex];

            // Disable all option buttons for this question
            for (let i = 0; i < qObj.options.length; i++) {
                const btn = document.getElementById(`q${questionId}-opt${i}`);
                btn.disabled = true;
                if (qObj.options[i].correct) {
                    btn.classList.add('correct');
                } else if (i === selectedOptIndex && !selectedOpt.correct) {
                    btn.classList.add('incorrect');
                }
            }

            // Show explanation box
            const expBox = document.getElementById(`q${questionId}-explanation`);
            const banner = document.getElementById(`q${questionId}-banner`);
            const summary = document.getElementById(`q${questionId}-summary`);
            const rationalesList = document.getElementById(`q${questionId}-rationales`);

            expBox.style.display = 'block';

            if (selectedOpt.correct) {
                banner.textContent = "Correct!";
                banner.className = "explanation-banner correct-banner";
            } else {
                banner.textContent = "Incorrect.";
                banner.className = "explanation-banner incorrect-banner";
            }

            // Find correct option text for summary
            const correctOptObj = qObj.options.find(o => o.correct);
            summary.innerHTML = `<strong>Concept Breakdown:</strong> ${selectedOpt.correct ? 'You selected the correct answer.' : `The correct choice was "${correctOptObj.text}".`} ${qObj.options.find(o => o.correct).why}`;

            // Build option-by-option rationale audit list
            let rationalesHTML = '<strong>Option Auditing & Rationales:</strong>';
            qObj.options.forEach((opt, idx) => {
                const letter = String.fromCharCode(65 + idx);
                rationalesHTML += `
                    <div class="rationale-item">
                        - <strong>${letter}) ${opt.text}</strong>: ${opt.why}
                    </div>
                `;
            });
            rationalesList.innerHTML = rationalesHTML;

            updateScoreDisplay();
            checkCompletion();
        }

        function updateScoreDisplay() {
            let correctCount = 0;
            let answeredCount = Object.keys(userAnswers).length;
            const total = shuffledQuestions.length;

            for (let qId in userAnswers) {
                const qObj = shuffledQuestions.find(q => q.id == qId);
                if (qObj.options[userAnswers[qId]].correct) {
                    correctCount++;
                }
            }

            const percentage = total > 0 ? Math.round((correctCount / total) * 100) : 0;
            document.getElementById('scoreDisplay').textContent = `Score: ${correctCount} / ${total} (${percentage}%)`;
        }

        function checkCompletion() {
            if (Object.keys(userAnswers).length === shuffledQuestions.length) {
                let correctCount = 0;
                for (let qId in userAnswers) {
                    const qObj = shuffledQuestions.find(q => q.id == qId);
                    if (qObj.options[userAnswers[qId]].correct) correctCount++;
                }
                const percentage = Math.round((correctCount / shuffledQuestions.length) * 100);
                
                const scorecard = document.getElementById('scorecard');
                const finalScoreText = document.getElementById('finalScoreText');
                finalScoreText.textContent = `You scored ${correctCount} out of ${shuffledQuestions.length} (${percentage}%)`;
                scorecard.style.display = 'block';
                scorecard.scrollIntoView({ behavior: 'smooth' });
            }
        }

        // Initialize quiz on page load
        window.onload = initQuiz;
    </script>
</body>
</html>
