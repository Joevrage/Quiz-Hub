<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biochemistry I – AA Classification & Special Products Quiz Hub</title>
<style>
:root{--bg:#0f0f0f;--card:#1a1a1a;--bd:#282828;--accent:#ff9900;--tx:#fff;--mu:#888;--cg:#14532d;--cb:#22c55e;--ig:#7f1d1d;--ib:#ef4444}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;margin:0;padding-top:104px}
header{position:fixed;top:0;left:0;width:100%;background:rgba(26,26,26,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--bd);z-index:1000}
.header-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
.brand{font-weight:700;font-size:1rem}.brand span{color:var(--accent)}.brand small{display:block;color:var(--mu);font-weight:400;font-size:.75rem}
.header-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{background:var(--bd);padding:5px 12px;border-radius:20px;font-size:.85rem;font-weight:600}
.score-pill{color:var(--accent)}
.progress-track{height:4px;background:var(--bd)}#progress-bar{height:100%;width:0;background:var(--accent);transition:width .3s}
.stfu-btn{background:#222;color:#fff;border:1px solid var(--accent,#ff9900);border-radius:6px;padding:6px 12px;font-weight:700;cursor:pointer;font-family:inherit;font-size:.82rem;transition:all .2s ease;white-space:nowrap}
.stfu-btn.muted{background:var(--accent,#ff9900);color:#000}
.container{max-width:800px;margin:0 auto;padding:16px}
.mode-container{display:flex;justify-content:center;gap:10px;margin:10px 0}
.mode-btn,.count-chip,.act-btn{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer;font-family:inherit}
.mode-btn.active,.count-chip.active{background:var(--accent);color:#000;border-color:var(--accent)}
.quickie-options-bar{display:flex;justify-content:center;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.quickie-options-bar.hidden{display:none}.quickie-label{color:var(--mu);font-size:.85rem}
.count-chip{padding:6px 14px;font-size:.85rem}
.qcard{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:22px;margin-bottom:22px}
.qmeta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.78rem;color:var(--mu);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.badge{color:var(--accent);font-weight:700}
.stem{font-size:1.1rem;font-weight:600;line-height:1.4;margin-bottom:18px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:13px 16px;text-align:left;font-size:1rem;cursor:pointer;display:flex;gap:10px;line-height:1.35;font-family:inherit;transition:all .2s}
.opt:hover:not(:disabled){border-color:var(--accent);background:rgba(255,153,0,.06)}
.opt:disabled{cursor:default}.opt.correct{background:var(--cg);border-color:var(--cb)}.opt.incorrect{background:var(--ig);border-color:var(--ib)}
.exp{display:none;margin-top:18px;padding:16px;border-radius:8px;background:var(--bg);border:1px solid var(--bd)}
.banner{font-weight:700;font-size:1.05rem;margin-bottom:6px}.banner.ok{color:var(--cb)}.banner.no{color:var(--ib)}
.ref{font-size:.85rem;color:var(--accent);font-weight:600;margin-bottom:10px}
.rat{font-size:.9rem;line-height:1.4;color:var(--mu);margin-top:8px}.rat strong{color:var(--tx)}
.summary{display:none;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:28px;text-align:center}
.summary h2{color:var(--accent);margin-top:0}.summary .act-btn{margin:6px}
.act-btn.primary{background:var(--accent);color:#000;border-color:var(--accent)}
.wrong-popup.hidden{display:none !important}
.wrong-popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2000;pointer-events:none;display:flex;justify-content:center;align-items:center;animation:popIn .15s ease-out}
.wrong-popup img{max-width:80vw;max-height:55vh;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.9);border:3px solid #ef4444;display:block;object-fit:contain;background:#111}
@keyframes popIn{from{transform:translate(-50%,-50%) scale(.85);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
</style>
</head>
<body>
<header>
  <div class="header-row">
    <div class="brand">
      <div>Biochemistry I <span>AA Classification &amp; Special Products Quiz Hub</span></div>
      <small>NBCE Part 1 Board Prep &middot; Rotating Bank</small>
    </div>
    <div class="header-right">
      <button class="stfu-btn" id="stfuBtn">STFU Erijah</button>
      <span class="pill" id="answered-display">Answered: 0 / 0</span>
      <span class="pill score-pill" id="score-display">Score: 0 / 0 (0%)</span>
    </div>
  </div>
  <div class="progress-track"><div id="progress-bar"></div></div>
</header>

<audio id="wrongAudio" src="Wrong-answer.mp3" preload="auto"></audio>
<div id="wrongPopup" class="wrong-popup hidden"><img id="wrongImage" src="Erijah.png" alt="Wrong Answer"></div>

<main class="container">
  <div class="mode-container" id="modeSelector">
    <button class="mode-btn active" id="fullQuizBtn">Full Quiz</button>
    <button class="mode-btn" id="quickQuizBtn">Quickie Drill</button>
  </div>
  <div class="quickie-options-bar hidden" id="quickieOptionsBar">
    <span class="quickie-label">Duration:</span>
    <button class="count-chip" data-count="5">5 Questions</button>
    <button class="count-chip active" data-count="10">10 Questions</button>
    <button class="count-chip" data-count="15">15 Questions</button>
  </div>
  <div id="quiz-container"></div>
  <div class="summary" id="summary">
    <h2>Quiz Complete!</h2>
    <p id="sumScore" style="font-size:1.2rem;font-weight:600"></p>
    <p id="sumMsg"></p>
    <button class="act-btn primary" id="retakeBtn">Retake Quiz</button>
    <button class="act-btn" id="reviewBtn">Review Missed</button>
    <button class="act-btn" id="backBtn">Back to Main Page</button>
  </div>
</main>

<script>
/* Row format: [slide, difficulty, priority, stem, [correct, why], [wrong, why] x3]. Slide # [Slide #X] is appended automatically.
   Slide map: 1-4 = Classification pp.1-4; 5-14 = Special Products pp.1-10. Quarters: Q1 = 1-3, Q2 = 4-7, Q3 = 8-10, Q4 = 11-14. */
const RAW = [
[1,"easy",true,"Which set of amino acids is classified as aromatic?",
 ["Phenylalanine, tyrosine, and tryptophan","Aromatic ring structures are found in Phe, Tyr, and Trp."],
 ["Valine, leucine, and isoleucine","These are the branched-chain amino acids, not aromatic."],
 ["Methionine and cysteine","These are the sulfur-containing amino acids."],
 ["Proline, glycine, and alanine","Proline has a non-aromatic ring; glycine and alanine have no ring."]],
[1,"easy",false,"Which pair of amino acids contains sulfur?",
 ["Methionine and cysteine","Met and Cys form the sulfur class."],
 ["Serine and threonine","These carry -OH alcohol groups, not sulfur."],
 ["Glutamine and asparagine","These carry amide groups."],
 ["Histidine and arginine","These are basic ionizable amino acids."]],
[2,"medium",true,"Which amino acids are classified as acidic (ionizable)?",
 ["Glutamic acid and aspartic acid","Their deionized names are glutamate and aspartate; they are the acidic pair."],
 ["Histidine, arginine, and lysine","These are the basic amino acids."],
 ["Glutamine and asparagine","These are polar amides, not ionizable."],
 ["Serine, threonine, and tyrosine","These are polar alcohol (-OH) amino acids, not ionizable."]],
[2,"medium",true,"Basic groups have _______ pKa values, whereas acidic groups have _______ pKa values.",
 ["high; low","Basic groups have high pKa values and acidic groups have low pKa values."],
 ["low; high","Inverted relationship."],
 ["high; high","Acidic groups do not share the high pKa of basic groups."],
 ["low; low","Basic groups do not share the low pKa of acidic groups."]],
[3,"medium",true,"Which amino acids are exclusively ketogenic?",
 ["Leucine and lysine","Leu and Lys are the only exclusively ketogenic amino acids."],
 ["Tyrosine, phenylalanine, tryptophan, and isoleucine","These are both ketogenic and glucogenic (skeleton splits into two fragments)."],
 ["Glycine and alanine","These are exclusively glucogenic."],
 ["Valine and methionine","These are exclusively glucogenic."]],
[4,"easy",true,"Which of the following is NOT on the NBCE essential amino acid list?",
 ["Alanine","Alanine is non-essential; the body synthesizes it."],
 ["Valine","Valine is on the essential list (PVT TIM HALL)."],
 ["Threonine","Threonine is on the essential list."],
 ["Histidine","Histidine is on the essential list."]],
[4,"medium",false,"_______ and glutamine are conditionally essential amino acids often recommended in recovery from trauma or surgery.",
 ["Arginine","Arg and Gln are the conditionally essential pair named in the notes."],
 ["Leucine","Leucine is essential and exclusively ketogenic, not the paired conditional AA."],
 ["Lysine","Lysine is essential and exclusively ketogenic."],
 ["Glycine","Glycine is non-essential and not the paired AA."]],
[5,"easy",false,"Porphyrins are organic rings that bind _______ in heme groups.",
 ["iron","Porphyrins bind Fe within heme groups."],
 ["copper","Copper is a cofactor for dopamine β-hydroxylase, not the heme metal."],
 ["calcium","Calcium is not bound by heme porphyrin rings."],
 ["zinc","Zinc is not bound by heme porphyrin rings."]],
[6,"medium",true,"Which two compounds begin the biosynthesis of porphyrins and hemes?",
 ["Glycine and succinyl-CoA","These two start porphyrin and heme biosynthesis."],
 ["Arginine and glycine","These form guanidinoacetate in the creatine pathway."],
 ["Tyrosine and L-DOPA","These form melanin."],
 ["Tryptophan and 5-HTP","These are the serotonin pathway amino acids."]],
[7,"hard",true,"Which cofactor is regenerated from BH2 by NADPH in both the Phe→Tyr and Tyr→L-DOPA hydroxylations?",
 ["Tetrahydrobiopterin (BH4)","BH4 donates electrons in each hydroxylation, becomes BH2, and is regenerated with NADPH."],
 ["Pyridoxal phosphate (PLP)","PLP is the decarboxylase coenzyme (L-DOPA → dopamine)."],
 ["Ascorbate (vitamin C)","Ascorbate is the coenzyme for dopamine β-hydroxylase."],
 ["S-adenosylmethionine (SAMe)","SAMe is the methyl donor for epinephrine synthesis."]],
[8,"medium",true,"Dopamine β-hydroxylase converts dopamine to norepinephrine using copper and which coenzyme?",
 ["Ascorbate (vitamin C)","Ascorbate is oxidized to dehydroascorbate in this step."],
 ["Pyridoxal phosphate (vitamin B6)","PLP is used by decarboxylases, not this hydroxylase."],
 ["Tetrahydrobiopterin (BH4)","BH4 serves the Phe and Tyr hydroxylases."],
 ["S-adenosylmethionine (SAMe)","SAMe donates methyl groups in the next step."]],
[8,"medium",true,"Which donor supplies the methyl group when norepinephrine becomes epinephrine?",
 ["S-adenosylmethionine (SAMe)","SAMe is converted to S-adenosylhomocysteine; enzyme is phenylethanolamine N-methyltransferase."],
 ["Tetrahydrobiopterin (BH4)","BH4 is a hydroxylase cofactor, not a methyl donor."],
 ["Ascorbate (vitamin C)","Ascorbate is the dopamine β-hydroxylase coenzyme."],
 ["Pyridoxal phosphate (PLP)","PLP is a decarboxylase coenzyme."]],
[8,"hard",true,"Which step occurs in the adrenal gland but NOT in a noradrenergic neuron?",
 ["Methylation of norepinephrine","Noradrenergic neurons stop at norepinephrine; the adrenal gland adds the methyl group to make epinephrine."],
 ["Hydroxylation of dopamine at the β carbon","This step occurs in noradrenergic neurons (and beyond)."],
 ["Decarboxylation of L-DOPA","Dopaminergic neurons already perform this step."],
 ["Hydroxylation of tyrosine to L-DOPA","This is an early step used by all catecholamine-producing cells."]],
[9,"medium",false,"Which structural change at the β carbon distinguishes norepinephrine from dopamine?",
 ["Addition of a hydroxyl group","Dopamine β-hydroxylase places an -OH on the β carbon."],
 ["Addition of a methyl group on the amine","This converts norepinephrine to epinephrine."],
 ["Removal of the carboxyl group","This converts L-DOPA to dopamine."],
 ["Addition of an acetyl group on the amine","Acetylation of serotonin's amine is part of melatonin formation."]],
[10,"medium",false,"Histamine is formed by decarboxylation of histidine and is found in _______ cells.",
 ["mast","Histamine is found in mast cells."],
 ["melanocyte","Melanocytes produce melanin."],
 ["retinal","Retinal cells sense light and dark for melatonin regulation."],
 ["skeletal muscle","Skeletal muscle relies on creatine phosphate."]],
[11,"medium",true,"Which sequence correctly describes serotonin synthesis?",
 ["Trp → 5-HTP by hydroxylation, then decarboxylation to 5-HTA","Trp hydroxylase (BH4) makes 5-HTP; PLP-dependent decarboxylase makes serotonin."],
 ["Trp → 5-HTP by decarboxylation, then hydroxylation to 5-HTA","Reverses the order of the two steps."],
 ["Tyr → L-DOPA by hydroxylation, then decarboxylation to 5-HTA","Tyr → L-DOPA is the catecholamine pathway."],
 ["Trp → L-DOPA by hydroxylation, then methylation to 5-HTA","L-DOPA is not a tryptophan intermediate."]],
[12,"hard",true,"Compared with serotonin (5-HTA), melatonin has which two modifications?",
 ["A methyl group on the hydroxyl oxygen and an acetyl group on the amine","Methyl replaces the -OH hydrogen group; acetyl is added to the amine."],
 ["A carboxyl group on the ring and a methyl group on the amine","Neither change forms melatonin."],
 ["A β-hydroxyl group and a methyl group on the amine","These are the norepinephrine and epinephrine changes."],
 ["An additional hydroxyl group and removal of the amine","Not a melatonin modification."]],
[13,"medium",true,"Which amino acids form melanin, the pigment that protects against UV light?",
 ["Tyrosine and L-DOPA","Melanin is formed by Tyr and L-DOPA (and their derivatives)."],
 ["Tryptophan and 5-HTP","Trp derivatives form serotonin and melatonin, not melanin."],
 ["Glycine and succinyl-CoA","These begin porphyrin synthesis."],
 ["Arginine and glycine","These form guanidinoacetate for creatine."]],
[14,"medium",false,"Creatine phosphate is a high-energy molecule especially important in contraction of which tissue?",
 ["Skeletal muscle","Creatine phosphate is useful when abundant ATP has not been produced, esp. in skeletal muscle."],
 ["Pineal gland","The pineal gland forms melatonin."],
 ["Adrenal medulla","The adrenal medulla makes epinephrine."],
 ["Mast cells","Mast cells store histamine."]],
[14,"hard",true,"Arginine and glycine form guanidinoacetate with release of which byproduct, and which donor then methylates it to creatine?",
 ["Ornithine; S-adenosylmethionine","Ornithine is released; SAMe becomes S-adenosylhomocysteine as creatine forms."],
 ["Ornithine; tetrahydrobiopterin","BH4 is not a methyl donor."],
 ["Homocysteine; S-adenosylmethionine","Ornithine, not homocysteine, is the byproduct of the first step."],
 ["Glycine; creatine kinase","Creatine kinase phosphorylates creatine with ATP; it is not a methyl donor."]]
];
const bank = RAW.map((r,i)=>({id:i+1,slideRef:r[0],quarter:r[0]<=3?1:r[0]<=7?2:r[0]<=10?3:4,difficulty:r[1],priority:r[2],stem:r[3],
  options:r.slice(4).map((o,k)=>({text:o[0],correct:k===0,why:o[1]+" [Slide #"+r[0]+"]"}))}));
const QUARTER_LABEL={1:"Quarter 1",2:"Quarter 2",3:"Quarter 3",4:"Quarter 4"};

let currentSet=[],quizData=[],round=1,quizMode='full',quickCount=10,score=0,answered=0,answers={},popupTimeout=null;
let muted=false;try{muted=localStorage.getItem('stfuErijah')==='1';}catch(e){}
const $=id=>document.getElementById(id);

function updateStfuButton(){
  const b=$('stfuBtn');if(!b)return;
  b.textContent=muted?'Bring Back Erijah':'STFU Erijah';b.classList.toggle('muted',muted);
  if(muted){const a=$('wrongAudio');if(a){a.pause();a.currentTime=0;}
    if(popupTimeout)clearTimeout(popupTimeout);const p=$('wrongPopup');if(p)p.classList.add('hidden');}
}
function toggleStfu(){muted=!muted;try{localStorage.setItem('stfuErijah',muted?'1':'0');}catch(e){}updateStfuButton();}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function prepare(list){return shuffle(list).map(q=>({...q,options:shuffle(q.options)}));}

function startQuiz(list){
  quizData=list;currentSet=list;score=0;answered=0;answers={};
  $('summary').style.display='none';$('quiz-container').style.display='block';
  render();updateStats();window.scrollTo({top:0,behavior:'smooth'});
}
function drawSet(){
  if(quizMode==='full')return prepare(bank);
  return prepare(shuffle(bank).slice(0,Math.min(quickCount,bank.length)));
}
function render(){
  const c=$('quiz-container');c.innerHTML='';
  currentSet.forEach((q,qi)=>{
    const d=document.createElement('div');d.className='qcard';
    d.innerHTML=`<div class="qmeta"><span>Question ${qi+1} of ${currentSet.length}</span>
      <span>${q.priority?'<span class="badge">★ High-Yield</span> · ':''}${q.difficulty} · ${QUARTER_LABEL[q.quarter]} · Slide #${q.slideRef}</span></div>
      <div class="stem">${q.stem}</div><div class="opts">${q.options.map((o,i)=>
      `<button class="opt" data-q="${q.id}" data-i="${i}"><b style="min-width:20px">${'abcd'[i]}.</b><span>${o.text}</span></button>`).join('')}</div>
      <div class="exp" id="exp-${q.id}"></div>`;
    c.appendChild(d);
  });
  c.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>pick(+b.dataset.q,+b.dataset.i)));
}
function pick(id,i){
  if(answers[id]!==undefined)return;
  const q=currentSet.find(x=>x.id===id),sel=q.options[i];answers[id]=i;answered++;
  const btns=document.querySelectorAll(`.opt[data-q="${id}"]`);
  btns.forEach((b,k)=>{b.disabled=true;if(q.options[k].correct)b.classList.add('correct');else if(k===i)b.classList.add('incorrect');});
  if(sel.correct)score++;else playWrong();
  const e=$('exp-'+id);e.style.display='block';
  e.innerHTML=`<div class="banner ${sel.correct?'ok':'no'}">${sel.correct?'Correct!':'Incorrect.'}</div>
    <div class="ref">Reference: ${QUARTER_LABEL[q.quarter]}, Slide #${q.slideRef}</div>
    ${q.options.map((o,k)=>`<div class="rat">- <strong>${'abcd'[k]}) ${o.text}</strong>${o.correct?' ✓':''}: ${o.why}</div>`).join('')}`;
  updateStats();if(answered===currentSet.length)showSummary();
}
function playWrong(){
  if(muted)return;
  const a=$('wrongAudio'),p=$('wrongPopup');
  try{a.currentTime=0;const pr=a.play();if(pr&&pr.catch)pr.catch(()=>{});}catch(e){}
  p.classList.remove('hidden');if(popupTimeout)clearTimeout(popupTimeout);
  popupTimeout=setTimeout(()=>p.classList.add('hidden'),1800);
}
function updateStats(){
  const t=currentSet.length,pct=answered?Math.round(score/answered*100):0;
  $('answered-display').textContent=`Answered: ${answered} / ${t}`;
  $('score-display').textContent=`Score: ${score} / ${t} (${pct}%)`;
  $('progress-bar').style.width=(t?answered/t*100:0)+'%';
}
function showSummary(){
  const t=currentSet.length,pct=Math.round(score/t*100);
  $('sumScore').textContent=`You scored ${score} out of ${t} (${pct}%)`;
  $('sumMsg').textContent=pct>=90?"Absolute Gigachad. You drained that test dry.":pct>=70?"You lasted less than 30 seconds. Time for a rematch.":"You really didn’t fucking know that.";
  $('reviewBtn').style.display=score===t?'none':'inline-block';
  $('summary').style.display='block';$('summary').scrollIntoView({behavior:'smooth'});
}
function setMode(m){
  quizMode=m;round=1;
  $('fullQuizBtn').classList.toggle('active',m==='full');$('quickQuizBtn').classList.toggle('active',m==='quick');
  $('quickieOptionsBar').classList.toggle('hidden',m!=='quick');
  startQuiz(drawSet());
}
$('fullQuizBtn').onclick=()=>setMode('full');
$('quickQuizBtn').onclick=()=>setMode('quick');
document.querySelectorAll('.count-chip').forEach(ch=>ch.addEventListener('click',()=>{
  quickCount=+ch.dataset.count;round=1;
  document.querySelectorAll('.count-chip').forEach(x=>x.classList.toggle('active',x===ch));
  startQuiz(drawSet());
}));
$('retakeBtn').onclick=()=>{round++;startQuiz(drawSet());};
$('reviewBtn').onclick=()=>{const missed=currentSet.filter(q=>!q.options[answers[q.id]].correct);if(missed.length)startQuiz(prepare(missed));};
$('backBtn').onclick=()=>setMode('full');
$('stfuBtn').onclick=toggleStfu;
$('fullQuizBtn').textContent=`Full Quiz (${bank.length} Qs)`;
updateStfuButton();startQuiz(drawSet());
</script>
</body>
</html>
