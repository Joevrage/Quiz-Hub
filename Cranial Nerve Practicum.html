<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab Practicum: Cranial & Spinal Nerves</title>
<style>
:root{--bg:#0f0f0f;--card:#1a1a1a;--bd:#282828;--accent:#ff9900;--muted:#888;--okbg:#14532d;--ok:#22c55e;--badbg:#7f1d1d;--bad:#ef4444}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
#header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--bd);padding:14px 20px;text-align:center;font-weight:700;color:var(--accent)}
main{max-width:780px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.4rem;text-align:center;margin:12px 0 4px}
.sub{text-align:center;color:var(--muted);margin:0 0 18px}
.controls-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:20px}
.modes,.counts{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.mode-btn,.count-btn{padding:8px 14px;border-radius:8px;border:1px solid var(--bd);background:#222;color:#fff;cursor:pointer;font-weight:600;font-family:inherit;font-size:.9rem}
.mode-btn.active,.count-btn.active{background:var(--accent);color:#000;border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:18px}
.badge{display:inline-block;background:var(--accent);color:#000;font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:999px;margin:0 6px 10px 0}
.badge.tag{background:#333;color:#ddd}
.stem{font-size:1.05rem;font-weight:600;margin:0 0 14px}
.opt{display:block;width:100%;text-align:left;background:#222;color:#fff;border:1px solid var(--bd);border-radius:8px;padding:11px 14px;margin-bottom:8px;font-size:.95rem;cursor:pointer;font-family:inherit}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.correct{background:var(--okbg);border-color:var(--ok)}
.opt.incorrect{background:var(--badbg);border-color:var(--bad)}
.fillrow{display:flex;gap:8px}
.fillrow input{flex:1;background:#222;color:#fff;border:1px solid var(--bd);border-radius:8px;padding:11px 14px;font-size:1rem;font-family:inherit}
.fillrow input:focus{outline:none;border-color:var(--accent)}
.fillrow input.correct{border-color:var(--ok);background:var(--okbg)}
.fillrow input.incorrect{border-color:var(--bad);background:var(--badbg)}
.btn{background:var(--accent);color:#000;border:0;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer;font-family:inherit}
.btn.alt{background:#333;color:#fff}
.explain{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--bd)}
.banner{font-weight:800;margin-bottom:4px}
.banner.good{color:var(--ok)}.banner.bad{color:var(--bad)}
.ans{margin:6px 0}
#summary{display:none;text-align:center}
.summary-title{font-size:1.4rem;font-weight:800;color:var(--accent);margin:0 0 8px}
@media(max-width:480px){.fillrow{flex-direction:column}}
</style>
</head>
<body>
<div id="header">Score: 0 / 0 (0%)</div>
<main>
<h1>Lab Practicum: Cranial & Spinal Nerves</h1>
<p class="sub">Test &rarr; nerve, nerve &rarr; result, and fill-in recall</p>
<div class="controls-wrap">
  <div class="modes" id="modes"></div>
  <div class="counts" id="counts"></div>
</div>
<div id="quiz"></div>
<div id="summary" class="card">
<div class="summary-title"></div>
<p id="summaryMsg"></p>
<button class="btn" id="retakeBtn">Retake</button>
<button class="btn alt" id="reviewBtn" style="display:none">Review Missed</button>
</div>
</main>
<audio id="wrongAudio" src="Wrong-answer.m4a" preload="auto"></audio>
<script>
const N=["","CN I Olfactory","CN II Optic","CN III Oculomotor","CN IV Trochlear","CN V Trigeminal","CN VI Abducent","CN VII Facial","CN VIII Vestibulocochlear","CN IX Glossopharyngeal","CN X Vagus","CN XI Spinal Accessory","CN XII Hypoglossal"];

// TEST -> NERVE: [test/finding, correct nerve #, [3 wrong nerve #s], explanation]
const T=[
["Eyes closed, one nostril blocked, scent held under the other nostril",1,[2,7,12],"Smell is CN I, tested one nostril at a time."],
["Snellen eye chart (wall chart 20 ft or pocket chart 14 in)",2,[3,8,11],"Visual acuity is CN II."],
["Visual field confrontation: wiggling fingers brought into peripheral vision",2,[3,4,6],"Visual fields are CN II (sensory)."],
["Sensory (afferent) limb of the pupillary light reflex",2,[3,5,7],"CN II carries light information in; CN III carries the response out."],
["Efferent (parasympathetic) limb of the light reflex to the sphincter pupillae",3,[2,4,6],"CN III parasympathetics constrict the pupil."],
["Near reaction: convergence, accommodation and miosis as a finger approaches the nose",3,[2,4,6],"CN III runs the medial rectus plus sphincter pupillae and ciliary muscle (afferent is CN II)."],
["Patient cannot abduct the eye (cannot look laterally) on cardinal gaze",6,[3,4,5],"CN VI innervates the lateral rectus."],
["Weak down-and-in gaze: superior oblique dysfunction",4,[3,6,7],"CN IV innervates the superior oblique."],
["Ptosis (droopy lid) from levator palpebrae superioris weakness",3,[4,6,7],"CN III innervates levator palpebrae superioris."],
["Sharp vs. soft touch on forehead, cheek and jaw, eyes closed",5,[7,9,11],"Facial sensation is CN V."],
["Bite down and palpate masseter and temporalis",5,[7,10,11],"Muscles of mastication are CN V."],
["Jaw jerk reflex",5,[7,9,12],"Jaw jerk is a CN V reflex."],
["Raise eyebrows, close eyes tightly, puff cheeks, smile with teeth showing",7,[5,10,12],"Muscles of facial expression are CN VII."],
["Taste on the anterior 2/3 of the tongue",7,[5,9,12],"CN VII carries anterior 2/3 taste."],
["Taste on the posterior 1/3 of the tongue",9,[7,10,12],"CN IX carries posterior 1/3 taste."],
["Questions about dry eye and dry mouth (parasympathetic to lacrimal and salivary glands)",7,[5,9,10],"CN VII parasympathetic fibers supply these glands."],
["Romberg's test: feet together, eyes closed, observe wobble",8,[2,7,10],"Romberg tests the vestibular portion of CN VIII."],
["Rinne's test (mastoid vs. in front of the ear)",8,[7,9,11],"Rinne is a cochlear (hearing) test, CN VIII."],
["Rub / whisper test for auditory acuity",8,[7,9,10],"Hearing is CN VIII."],
["Sensory limb of the gag reflex",9,[5,10,12],"Gag: sensory CN IX, motor CN X."],
["Motor limb of the gag reflex",10,[9,7,12],"Gag: sensory CN IX, motor CN X."],
["Patient says \"Ahhh\"; watch soft palate rise and check the uvula",10,[9,7,12],"Palate elevation is CN X."],
["Patient swallows; thyroid cartilage should rise symmetrically",10,[9,12,11],"Swallowing check is CN X."],
["Shrug the shoulders against resistance",11,[10,12,5],"Trapezius is CN XI."],
["Rotate head against resistance (sternocleidomastoid)",11,[10,12,5],"SCM is CN XI."],
["Stick tongue out and check for deviation",12,[10,9,7],"Tongue protrusion is CN XII."],
["Push tongue into the cheek against the examiner's hand",12,[10,9,5],"Tongue strength is CN XII."]
];

// NERVE + TEST -> RESULT: [stem, correct, [3 wrong], explanation]
const R=[
["CN XII: on protrusion the tongue deviates to the right. What does this indicate?","Right-sided tongue weakness","Left-sided tongue weakness|Normal finding|CN X lesion","The tongue deviates toward the weak side."],
["CN V motor: on opening the mouth the jaw deviates to the left. Which side is weak?","Left","Right|Neither, this is normal|Both equally","The jaw deviates toward the weak side."],
["CN X: patient says \"Ahhh\". Which is the NORMAL finding?","Soft palate rises equally, uvula stays midline","Uvula deviates to one side|Soft palate stays flat|Tongue deviates","Symmetric elevation with a midline uvula is normal."],
["CN VIII Rinne: bone conduction is greater than air conduction. What is this?","Conduction hearing loss","Sensorineural (nerve) hearing loss|Normal hearing|Vestibular loss","Normal is air > 2x bone; bone > air means a conduction problem."],
["CN VIII Rinne: air conduction is greater than bone but less than 2x. What is this?","Nerve (sensorineural) hearing loss","Conduction hearing loss|Normal hearing|Facial nerve palsy","Air still beats bone, but not by the normal 2x."],
["CN VIII Romberg: patient wobbles much more with eyes closed than with eyes open. How is this read?","Abnormal (positive) Romberg","Normal finding|Light reflex failure|Conjugate gaze","The amount of wobble is compared with eyes open."],
["CN III: light is shone into the right eye and the LEFT pupil constricts. Which reflex is this?","Consensual light reflex","Direct light reflex|Near reaction|Accommodation","Contralateral constriction is consensual."],
["CN III: light is shone into the right eye and the RIGHT pupil constricts. Which reflex is this?","Direct light reflex","Consensual light reflex|Convergence|Accommodation","Ipsilateral constriction is the direct reflex."],
["CN III/IV/VI: eyes jerk at the end of an extreme gaze position. What is this called?","Nystagmus","Conjugate gaze|Miosis|Accommodation","Twitching/jerking at the end of gaze is nystagmus."],
["CN III near reaction: which is NOT an expected response as a finger approaches the nose?","Pupil dilation","Convergence|Accommodation|Miosis","The pupils constrict (miosis) during near reaction."],
["CN VII: patient cannot raise the right eyebrow or smile symmetrically. Which nerve is affected?","CN VII Facial","CN V Trigeminal|CN XII Hypoglossal|CN X Vagus","Facial expression muscles are CN VII."],
["CN XI: patient cannot shrug the left shoulder against resistance. Which muscle is weak?","Left trapezius","Left masseter|Left temporalis|Left stylopharyngeus","Trapezius is tested by shrug, CN XI."],
["CN II: patient cannot read below the 20/40 line with the Snellen chart. This is documented as:","Visual acuity of 20/40","Visual field of 20/40|Convergence of 20/40|Miosis grade 40","Acuity is recorded as the line number next to the chart line."],
["Spinal nerve DTR graded 4: what is the finding?","Hyperactive with clonus","Absent reflex|Sluggish, needs reinforcement|Average response","0 absent, 1 sluggish, 2 average, 3 brisk, 4 hyperactive with clonus."],
["Myotome graded 3 (Fair): what can the patient do?","Full ROM against gravity but cannot resist","Full ROM with gravity eliminated|Full ROM with some resistance|No contraction","3 = full ROM against gravity without resistance."],
["Myotome graded 2 (Poor): what can the patient do?","Full ROM with gravity eliminated","Full ROM against gravity|Slight twitch only|Full ROM with full resistance","2 = full ROM only when gravity is eliminated."],
["Patient feels pain from a light cotton-swab touch. What is this called?","Allodynia","Hypoesthesia|Hyperesthesia|Paresthesia","Allodynia is pain from a normally non-painful stimulus."],
["Patient reports reduced sensation to sharp/soft touch in a dermatome. What is this called?","Hypoesthesia","Hyperesthesia|Paresthesia|Allodynia","Hypoesthesia = decreased sensation."],
["Biceps reflex is absent on one side only. Which spinal level is being tested?","C5","C7|L4|S1","Biceps C5, brachioradialis C6, triceps C7."],
["Absent Achilles reflex on one side. Which spinal level is being tested?","S1","L4|L5|C7","Patellar L4, medial hamstring L5, Achilles S1."]
];

// FILL-IN: [stem, [accepted answers], answer shown, explanation]
const F=[
["CN I is tested with the sense of ____.",["smell","olfaction"],"smell","CN I = olfactory."],
["Snellen wall chart is read from ____ feet away.",["20","20 feet","20 ft","20ft"],"20 feet","Pocket chart is 14 inches."],
["Snellen pocket chart is read from ____ inches away.",["14","14 inches","14 in","14in"],"14 inches","Wall chart is 20 feet."],
["For visual field confrontation, the examiner sits about an ____ length away.",["arm","arms","arm's","an arm"],"arm","Examiner compares the patient's periphery with their own."],
["The three near-reaction responses are convergence, accommodation, and ____.",["miosis","pupil constriction","constriction"],"miosis","Pupils constrict up close."],
["Pupil constriction in the SAME eye the light is shone into is the ____ light reflex.",["direct"],"direct","Ipsilateral = direct."],
["Pupil constriction in the OPPOSITE eye is the ____ light reflex.",["consensual"],"consensual","Contralateral = consensual."],
["Involuntary jerking at the end of a gaze position is called ____.",["nystagmus"],"nystagmus","Normal gaze is smooth and conjugate."],
["Both eyes moving smoothly in the same direction is called ____ gaze.",["conjugate"],"conjugate","Abnormal = nystagmus or lag."],
["Cardinal field of gaze follows what letter pattern?",["h","an h","h pattern"],"H","Six cardinal positions."],
["Which cranial nerve (number or name) innervates the lateral rectus?",["vi","6","cn vi","cn 6","abducent","abducens"],"CN VI (Abducent)","LR6 SO4 for the rest of CN III."],
["Which cranial nerve (number or name) innervates the superior oblique?",["iv","4","cn iv","cn 4","trochlear"],"CN IV (Trochlear)","CN IV = superior oblique."],
["CN III parasympathetics supply the sphincter pupillae and the ____ muscle.",["ciliary"],"ciliary","Pupil constriction and accommodation."],
["The two muscles palpated while the patient bites down (CN V) are masseter and ____.",["temporalis"],"temporalis","Muscles of mastication."],
["On mouth opening, the jaw deviates toward the ____ side.",["weak","weaker","affected"],"weak","Pterygoid weakness pulls the jaw to that side."],
["Taste for the anterior 2/3 of the tongue is CN ____.",["vii","7","cn vii","cn 7","facial"],"CN VII","Posterior 1/3 is CN IX."],
["Taste for the posterior 1/3 of the tongue is CN ____.",["ix","9","cn ix","cn 9","glossopharyngeal"],"CN IX","Anterior 2/3 is CN VII."],
["In Romberg's test the patient closes their ____ and the examiner watches for wobble.",["eyes","eye"],"eyes","Compare with eyes open."],
["Normally, air conduction is greater than ____ times bone conduction (Rinne).",["2","two","2x","2 times"],"2","Less than 2x suggests a nerve problem."],
["The sensory limb of the gag reflex is CN ____.",["ix","9","cn ix","cn 9","glossopharyngeal"],"CN IX","Motor limb is CN X."],
["The motor limb of the gag reflex is CN ____.",["x","10","cn x","cn 10","vagus"],"CN X","Sensory limb is CN IX."],
["CN XI innervates the sternocleidomastoid and the ____.",["trapezius","trap","traps"],"trapezius","Tested with head rotation and shoulder shrug."],
["The protruded tongue deviates toward the ____ side.",["weak","weaker","affected"],"weak","CN XII."],
["How many pairs of spinal nerves are there?",["31","thirty one","thirty-one"],"31","8 C, 12 T, 5 L, 5 S, 1 Co."],
["Which spinal nerve is sensory only (C1 is motor only)?",["co1","co 1","coccygeal","coccygeal 1","coccygeal nerve"],"Co1 (coccygeal)","C1 motor only, Co1 sensory only."],
["A dermatome is a region of skin innervated by the sensory endings of one ____.",["spinal nerve","spinal nerves","nerve"],"spinal nerve","Dermatome = skin; myotome = muscle."],
["A myotome tests an ____ muscle contraction.",["isometric"],"isometric","Graded 0 to 5."],
["Myotome grade 5 is described as ____.",["normal"],"Normal","Full ROM against gravity with full resistance."],
["Myotome grade 3 (Fair): full ROM ____ but cannot resist.",["against gravity"],"against gravity","Grade 2 is with gravity eliminated."],
["Myotome grade 2 (Poor): full ROM with gravity ____.",["eliminated","removed"],"eliminated","Grade 3 is against gravity."],
["Reflex grade 0 means the reflex is ____.",["absent"],"absent","0 absent to 4 hyperactive with clonus."],
["Reflex grade 4 is hyperactive with ____.",["clonus"],"clonus","Graded on a 0 to 4 scale."],
["Reflex grade 1 is sluggish and needs ____.",["reinforcement"],"reinforcement","Grade 2 is average."],
["Biceps reflex spinal level: C___",["5","c5"],"C5","Brachioradialis C6, triceps C7."],
["Brachioradialis reflex spinal level: C___",["6","c6"],"C6","Biceps C5, triceps C7."],
["Triceps reflex spinal level: C___",["7","c7"],"C7","Biceps C5, brachioradialis C6."],
["Patellar tendon reflex spinal level: L___",["4","l4"],"L4","Medial hamstring L5, Achilles S1."],
["Achilles reflex spinal level: S___",["1","s1"],"S1","Patellar L4, medial hamstring L5."],
["Abnormal sensations in a dermatome include hypoesthesia, hyperesthesia, paresthesia, and ____.",["allodynia"],"allodynia","Pain from a non-painful stimulus."]
];

const quizData=[];
T.forEach((t,i)=>quizData.push({kind:"mc",tag:"Test → Nerve",stem:"Which cranial nerve does this test? "+t[0],opts:[t[1],...t[2]].map((n,j)=>({text:N[n],correct:j===0})),why:t[3]}));
R.forEach(r=>quizData.push({kind:"mc",tag:"Nerve → Result",stem:r[0],opts:[r[1],...r[2].split("|")].map((x,j)=>({text:x,correct:j===0})),why:r[3]}));
F.forEach(f=>quizData.push({kind:"fill",tag:"Fill-in",stem:f[0],acc:f[1],ans:f[2],why:f[3]}));
quizData.forEach((q,i)=>q.id=i+1);

const MODES={all:"All Modes",t:"Test → Nerve",r:"Nerve → Result",f:"Fill-in"};
const COUNTS=[25, 50, 86];

let mode="all", countChoice=86, round=1, set=[], answers={};
const L="abcd";
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const norm=s=>s.toLowerCase().replace(/[^a-z0-9\s'\/-]/g,"").replace(/\s+/g," ").trim();
const isMatch=(inp,acc)=>{const n=norm(inp);return n&&acc.some(a=>{a=norm(a);return n===a||(a.length>3&&n.includes(a));});};

function header(){const c=Object.values(answers).filter(v=>v).length,t=set.length;
document.getElementById("header").textContent=`${round===1?"Score":"Review "+(round-1)}: ${c} / ${t} (${t?Math.round(c/t*100):0}%)`;}

function pool(){
  let p=[];
  if(mode==="t") p = quizData.filter(q=>q.tag==="Test → Nerve");
  else if(mode==="r") p = quizData.filter(q=>q.tag==="Nerve → Result");
  else if(mode==="f") p = quizData.filter(q=>q.kind==="fill");
  else p = [...quizData];
  
  const shuffled = shuf([...p]);
  return shuffled.slice(0, Math.min(countChoice, shuffled.length));
}

function render(custom){
set=custom||pool();answers={};
set.forEach(q=>{if(q.opts)shuf(q.opts);});
document.getElementById("summary").style.display="none";
const quiz=document.getElementById("quiz");quiz.innerHTML="";
set.forEach((q,n)=>{
const card=document.createElement("div");card.className="card";
card.innerHTML=`<span class="badge">Question ${n+1} of ${set.length}</span><span class="badge tag">${q.tag}</span><p class="stem"></p><div class="body"></div><div class="explain"></div>`;
card.querySelector(".stem").textContent=q.stem;
const body=card.querySelector(".body");
if(q.kind==="mc"){q.opts.forEach((o,i)=>{const b=document.createElement("button");b.className="opt";b.textContent=`${L[i]}. ${o.text}`;b.onclick=()=>pickMC(q,i,card);body.appendChild(b);});}
else{body.innerHTML=`<div class="fillrow"><input type="text" placeholder="Type your answer" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn">Check</button></div>`;
const inp=body.querySelector("input"),btn=body.querySelector("button");
btn.onclick=()=>checkFill(q,inp,btn,card);
inp.onkeydown=e=>{if(e.key==="Enter")checkFill(q,inp,btn,card);};}
quiz.appendChild(card);});
header();window.scrollTo(0,0);}

function wrongSound(){const a=document.getElementById("wrongAudio");try{a.currentTime=0;a.play().catch(()=>{});}catch(e){}}
function explain(card,ok,q,extra){const ex=card.querySelector(".explain");
ex.innerHTML=`<div class="banner ${ok?"good":"bad"}">${ok?"Correct!":"You didn’t know that?!"}</div>${extra||""}<div class="ans">${q.why}</div>`;ex.style.display="block";}

function pickMC(q,i,card){
if(q.id in answers)return;
const ok=q.opts[i].correct;answers[q.id]=ok;
card.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(q.opts[j].correct)b.classList.add("correct");else if(j===i)b.classList.add("incorrect");});
if(!ok)wrongSound();
explain(card,ok,q);done();}

function checkFill(q,inp,btn,card){
if(q.id in answers||!inp.value.trim())return;
const ok=isMatch(inp.value,q.acc);answers[q.id]=ok;
inp.disabled=true;btn.disabled=true;inp.classList.add(ok?"correct":"incorrect");
let extra="";
if(!ok){wrongSound();extra=`<div class="ans"><strong>Answer:</strong> ${q.ans}</div><button class="btn alt override">I actually knew it</button>`;}
explain(card,ok,q,extra);
const ov=card.querySelector(".override");
if(ov)ov.onclick=()=>{answers[q.id]=true;ov.remove();const b=card.querySelector(".banner");b.className="banner good";b.textContent="Counted as correct";header();if(Object.keys(answers).length===set.length)summary();};
done();}

function done(){header();if(Object.keys(answers).length===set.length)summary();}

function summary(){
const total=set.length,missed=set.filter(q=>!answers[q.id]),pct=Math.round((total-missed.length)/total*100);
const t=document.querySelector(".summary-title"),m=document.getElementById("summaryMsg");
if(round===1){t.textContent="Quiz Complete";m.textContent=pct>=90?"Absolute Gigachad. You drained that test dry.":pct>=70?"Solid run! You're locked in, get in some more reps.":"You lasted less than 30 seconds. Time for a rematch.";}
else{t.textContent=`Review Round ${round-1} Complete`;m.textContent=missed.length?`${missed.length} still missed. Go again.`:"Everything cleared. All correct.";}
const rb=document.getElementById("reviewBtn");
if(missed.length){rb.style.display="inline-block";rb.textContent=`Review Missed (${missed.length})`;}else rb.style.display="none";
const s=document.getElementById("summary");s.style.display="block";s.scrollIntoView({behavior:"smooth"});}

// Setup Mode buttons
const modesEl=document.getElementById("modes");
Object.entries(MODES).forEach(([k,v])=>{
  const b=document.createElement("button");
  b.className="mode-btn"+(k===mode?" active":"");
  b.textContent=v;
  b.dataset.k=k;
  b.onclick=()=>{
    mode=k; round=1;
    modesEl.querySelectorAll(".mode-btn").forEach(x=>x.classList.toggle("active",x.dataset.k===k));
    render();
  };
  modesEl.appendChild(b);
});

// Setup Question Count buttons
const countsEl=document.getElementById("counts");
COUNTS.forEach(cnt=>{
  const b=document.createElement("button");
  b.className="count-btn"+(cnt===countChoice?" active":"");
  b.textContent=`${cnt === 86 ? 'All (86)' : cnt} Questions`;
  b.dataset.c=cnt;
  b.onclick=()=>{
    countChoice=cnt; round=1;
    countsEl.querySelectorAll(".count-btn").forEach(x=>x.classList.toggle("active",Number(x.dataset.c)===cnt));
    render();
  };
  countsEl.appendChild(b);
});

document.getElementById("retakeBtn").onclick=()=>{round=1;render();};
document.getElementById("reviewBtn").onclick=()=>{round++;render(set.filter(q=>!answers[q.id]));};
render();
</script>
</body>
</html>
