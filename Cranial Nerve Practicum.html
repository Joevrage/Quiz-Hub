<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cranial Nerve Practicum - Full</title>
<style>
:root{--bg:#0f0f0f;--card:#1a1a1a;--border-color:#282828;--accent:#ff9900;--muted:#888;--ok-bg:#14532d;--ok:#22c55e;--bad-bg:#7f1d1d;--bad:#ef4444}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
#header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--border-color);padding:14px 20px;text-align:center;font-weight:700;color:var(--accent)}
main{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.4rem;text-align:center;margin:12px 0 4px}
.sub{text-align:center;color:var(--muted);margin:0 0 18px}
.mode-container{display:flex;justify-content:center;gap:8px;margin-bottom:18px}
.mode-btn{padding:8px 18px;border-radius:8px;border:1px solid var(--border-color);background:#222;color:#fff;cursor:pointer;font-weight:600}
.mode-btn.active{background:var(--accent);color:#000;border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--border-color);border-radius:12px;padding:18px;margin-bottom:18px}
.badge{display:inline-block;background:var(--accent);color:#000;font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:999px;margin-bottom:10px}
.stem{font-size:1.05rem;font-weight:600;margin:0 0 14px}
.opt{display:block;width:100%;text-align:left;background:#222;color:#fff;border:1px solid var(--border-color);border-radius:8px;padding:11px 14px;margin-bottom:8px;font-size:.95rem;cursor:pointer;font-family:inherit}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.correct{background:var(--ok-bg);border-color:var(--ok)}
.opt.incorrect{background:var(--bad-bg);border-color:var(--bad)}
.explain{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--border-color)}
.banner{font-weight:800;margin-bottom:4px}
.banner.good{color:var(--ok)}.banner.bad{color:var(--bad)}
.ref{color:var(--muted);font-size:.85rem;margin-bottom:10px}
.why{font-size:.88rem;padding:8px 10px;border-left:3px solid var(--border-color);margin-bottom:6px;color:#ddd}
.why.right{border-left-color:var(--ok)}.why.wrong{border-left-color:var(--bad)}
#summary{display:none;text-align:center}
.summary-title{font-size:1.4rem;font-weight:800;color:var(--accent);margin:0 0 8px}
.retake-btn{background:var(--accent);color:#000;border:0;border-radius:8px;padding:10px 20px;font-weight:700;cursor:pointer;margin:6px}
</style>
</head>
<body>
<div id="header">Score: 0 / 0 (0%)</div>
<main>
<h1>Cranial Nerve Practicum</h1>
<p class="sub">CN I-XII: tests, normal vs. abnormal findings</p>
<div class="mode-container" id="modeSelector">
<button class="mode-btn active" id="fullQuizBtn">Full Quiz</button>
<button class="mode-btn" id="quickQuizBtn">Quick 10</button>
</div>
<div id="quiz"></div>
<div id="summary" class="card">
<div class="summary-title"></div>
<p id="summaryMsg"></p>
<button class="retake-btn" id="retakeBtn">Retake Quiz</button>
<button class="retake-btn" id="reviewBtn" style="display:none">Review Missed</button>
</div>
</main>
<audio id="wrongAudio" src="Wrong-answer.m4a" preload="auto"></audio>
<script>
// Each entry: [ref, stem, [correct, wrong, wrong, wrong]] where each option is [text, why]
const raw=[
["CN I Olfactory","Which setup tests CN I?",[
["Eyes closed, one nostril blocked, scent held under the other","Smell is tested one nostril at a time with eyes closed."],
["Eyes open, both nostrils open, scent under the nose","Both nostrils open does not isolate each side, and eyes should be closed."],
["Eyes closed, vibrating tuning fork on the forehead","This is a vibration/hearing-type test, not smell."],
["Eyes closed, tongue depressor on the soft palate","This elicits the gag reflex (CN IX/X)."]]],
["CN I Olfactory","A patient cannot identify a scent in one nostril. Which nerve is affected?",[
["CN I","CN I is the sensory nerve for smell."],
["CN II","CN II carries vision, not smell."],
["CN VII","CN VII carries taste from the anterior 2/3 of the tongue, not smell."],
["CN XII","CN XII is motor to the tongue only."]]],
["CN II Optic","At what distance is the wall chart used for Snellen visual acuity?",[
["20 feet","The wall chart is read from 20 feet."],
["14 inches","This is the distance for the pocket chart."],
["About an arm's length","This is the distance for visual field confrontation."],
["6 inches","Not a distance used for acuity testing."]]],
["CN II Optic","The doctor tests the patient's left eye visual field. Which covering is correct?",[
["Patient covers right eye; doctor closes left eye","The covered eyes mirror each other so the doctor's field serves as the comparison."],
["Patient covers right eye; doctor closes right eye","The doctor must close the eye opposite the tested eye's mirror, not the same side."],
["Patient covers left eye; doctor closes left eye","The patient's tested (left) eye must stay open."],
["Neither covers an eye","One eye is tested at a time, so the other must be covered."]]],
["CN III Oculomotor","Which muscle is NOT innervated by CN III?",[
["Lateral rectus","The lateral rectus is CN VI."],
["Levator palpebrae superioris","This is CN III."],
["Inferior oblique","This is CN III."],
["Sphincter pupillae","CN III parasympathetics supply this muscle."]]],
["CN III Near Reaction","Which is NOT a response during the near reaction?",[
["Pupil dilation","Pupils constrict (miosis) during the near reaction."],
["Convergence","Eyes move inward, a normal response."],
["Accommodation","Focusing up close, a normal response."],
["Miosis","Pupil constriction, a normal response."]]],
["CN III Light Reflex","Light is shone into the right eye. Which finding is the direct reflex?",[
["Right pupil constricts","Direct reflex is ipsilateral pupil constriction."],
["Left pupil constricts","This is the consensual reflex."],
["Both eyes converge","Convergence belongs to the near reaction."],
["Right pupil dilates","Light causes constriction, not dilation."]]],
["CN IV/VI Cardinal Gaze","What is the normal finding on cardinal field of gaze?",[
["Both eyes move together smoothly with no jerking at the end","This is conjugate gaze without nystagmus."],
["Eyes twitch at the end of each position","Twitching or jerking at the end is nystagmus (abnormal)."],
["One eye lags behind the other","Eyes should move in the same direction together."],
["The head turns with the eyes","The eyes move without head movement."]]],
["CN IV/VI Cardinal Gaze","How is the cardinal field of gaze performed?",[
["Eyes follow an H pattern through 6 positions, pausing at each end","Head stays still and the end of each position is held for a few seconds."],
["Eyes follow a circle without pausing","The test uses an H pattern with pauses."],
["Finger moved toward the nose","This is the near reaction."],
["Light shone from lateral to medial","This is the light reflex."]]],
["CN V Trigeminal","On opening the mouth, the jaw deviates to the right. Which side is weak?",[
["Right","Jaw deviation is toward the weak side."],
["Left","Deviation is toward, not away from, the weak side."],
["Neither; this is normal","Normal jaw opening stays midline."],
["Both sides equally","Equal weakness would not deviate the jaw."]]],
["CN V Trigeminal","Biting down and palpating which muscles tests CN V motor?",[
["Masseter and temporalis","These are muscles of mastication."],
["Sternocleidomastoid and trapezius","These are CN XI."],
["Orbicularis oculi and zygomaticus","These are facial expression muscles (CN VII)."],
["Stylopharyngeus and levator palpebrae","Stylopharyngeus is CN IX and levator palpebrae is CN III."]]],
["CN V Trigeminal","Where is CN V sensation tested?",[
["Forehead, cheek, and jaw, eyes closed, bilaterally","Sharp vs. soft touch is compared side to side."],
["Anterior 2/3 of the tongue","This is taste (CN VII)."],
["Posterior 1/3 of the tongue","This is taste (CN IX)."],
["Soft palate and uvula","This relates to CN IX/X."]]],
["CN VII Facial","Which tongue area is CN VII taste?",[
["Anterior 2/3","CN VII carries taste from here."],
["Posterior 1/3","This is CN IX."],
["Entire tongue","Taste is split between CN VII and IX."],
["Uvula","The uvula is not a taste area tested here."]]],
["CN VII Facial","Which tasks test CN VII motor?",[
["Raise eyebrows, close eyes tightly, puff cheeks, smile","These test symmetric facial expression."],
["Shrug shoulders, turn head","These are CN XI."],
["Say \"Ahhh\", swallow","These are CN X."],
["Stick out tongue, push into cheek","These are CN XII."]]],
["CN VIII Romberg","What is observed in Romberg's test?",[
["Wobbling with eyes closed compared with eyes open","Feet together, arms at sides; wobble amount is compared."],
["Which ear hears a fork louder","This describes Weber's test."],
["Air vs. bone conduction time","This describes Rinne's test."],
["Pupil response to light","This is the light reflex."]]],
["CN VIII Weber","Where is the vibrating tuning fork placed for Weber's test?",[
["Midline of the head","The patient reports whether sound is heard in the middle or lateralizes."],
["Mastoid process","This is the first position for Rinne's test."],
["In front of the ear","This is the air conduction position in Rinne's test."],
["Over the sternum","Not used for hearing tests."]]],
["CN VIII Rinne","Air conduction is greater than bone conduction but less than 2x. What is this?",[
["Sensorineural (nerve) hearing loss","Air still beats bone, but not by the normal 2x."],
["Normal hearing","Normal is air greater than 2x bone."],
["Conduction hearing loss","Conduction loss is bone greater than air."],
["Vestibular dysfunction","Rinne's tests hearing, not balance."]]],
["CN IX Glossopharyngeal","Asking about swallowing tests which CN IX muscle?",[
["Stylopharyngeus","This is the CN IX motor muscle."],
["Masseter","This is CN V."],
["Sternocleidomastoid","This is CN XI."],
["Levator palpebrae superioris","This is CN III."]]],
["CN IX/X Gag Reflex","Which nerves are the sensory and motor limbs of the gag reflex?",[
["Sensory CN IX, motor CN X","Touch is sensed by CN IX and the response is motor CN X."],
["Sensory CN X, motor CN IX","The limbs are reversed."],
["Sensory CN V, motor CN VII","These are not part of the gag reflex."],
["Both CN XII","CN XII is the tongue motor nerve."]]],
["CN X Vagus","What is the normal finding when the patient says \"Ahhh\"?",[
["Soft palate rises equally with no uvula deviation","This is symmetric vagal motor function."],
["Uvula deviates to one side","This is abnormal."],
["Tongue deviates to one side","This is a CN XII finding."],
["Jaw deviates to one side","This is a CN V finding."]]],
["CN X Vagus","What is normal when the patient swallows?",[
["Thyroid cartilage rises symmetrically","This is the CN X swallowing check."],
["Jaw drops to one side","Not a swallow finding."],
["Eyes converge","This is the near reaction."],
["Shoulders elevate","This is the CN XI trapezius test."]]],
["CN XI Spinal Accessory","Rotating the head against resistance tests which muscle?",[
["Sternocleidomastoid","CN XI innervates the SCM."],
["Masseter","This is CN V."],
["Temporalis","This is CN V."],
["Orbicularis oculi","This is CN VII."]]],
["CN XI Spinal Accessory","Shrugging the shoulders against resistance tests which muscle?",[
["Trapezius","CN XI innervates the trapezius."],
["Platysma","Not tested with shoulder shrug."],
["Masseter","This is CN V."],
["Stylopharyngeus","This is CN IX."]]],
["CN XII Hypoglossal","The protruded tongue deviates left. What does this indicate?",[
["Left-sided tongue weakness","The tongue deviates toward the weak side."],
["Right-sided tongue weakness","Deviation is toward, not away from, the weak side."],
["CN X lesion","CN X is tested with palate/uvula."],
["Normal finding","Normal protrusion is midline."]]],
["CN XII Hypoglossal","How is tongue strength tested?",[
["Patient pushes tongue into the cheek against the examiner's hand","This tests the tongue muscles."],
["Patient shrugs against resistance","This is CN XI."],
["Patient bites down","This is CN V."],
["Patient says \"Ahhh\"","This is CN X."]]]
];
const quizData=raw.map((r,i)=>({id:i+1,ref:r[0],stem:r[1],options:r[2].map((o,j)=>({text:o[0],correct:j===0,why:o[1]}))}));

let currentSet=quizData,round=1,quizMode='full',answers={},order=[];
const L=['a','b','c','d'];
function fisherYates(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}}
function shuffleQuiz(){fisherYates(currentSet);currentSet.forEach(q=>fisherYates(q.options));}
function updateHeader(){
const total=currentSet.length,correct=Object.values(answers).filter(v=>v===true).length;
const pct=total?Math.round(correct/total*100):0;
document.getElementById('header').textContent=`${round===1?'Score':'Review '+(round-1)}: ${correct} / ${total} (${pct}%)`;}
function updateModeButtons(){
document.getElementById('fullQuizBtn').classList.toggle('active',quizMode==='full');
document.getElementById('quickQuizBtn').classList.toggle('active',quizMode==='quick');}
function renderQuiz(set){
if(set){currentSet=set;}else{fisherYates(quizData);currentSet=quizMode==='quick'?quizData.slice(0,10):[...quizData];}
answers={};shuffleQuiz();
document.getElementById('summary').style.display='none';
const quiz=document.getElementById('quiz');quiz.innerHTML='';
currentSet.forEach((q,qIdx)=>{
const card=document.createElement('div');card.className='card';
card.innerHTML=`<span class="badge">Question ${qIdx+1} of ${currentSet.length}</span><p class="stem"></p><div class="opts"></div><div class="explain"></div>`;
card.querySelector('.stem').textContent=q.stem;
const opts=card.querySelector('.opts');
q.options.forEach((o,i)=>{
const b=document.createElement('button');b.className='opt';b.textContent=`${L[i]}. ${o.text}`;
b.addEventListener('click',()=>choose(q,i,card));opts.appendChild(b);});
quiz.appendChild(card);});
updateHeader();window.scrollTo(0,0);}
function choose(q,idx,card){
if(answers.hasOwnProperty(q.id))return;
const o=q.options[idx];answers[q.id]=o.correct;
card.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;
if(q.options[i].correct)b.classList.add('correct');
else if(i===idx)b.classList.add('incorrect');});
if(!o.correct){const a=document.getElementById('wrongAudio');try{a.currentTime=0;a.play().catch(()=>{});}catch(e){}}
const ex=card.querySelector('.explain');
ex.innerHTML=`<div class="banner ${o.correct?'good':'bad'}">${o.correct?'Correct!':'You didn’t know that?!'}</div><div class="ref">Reference: ${q.ref}</div>`+
q.options.map((x,i)=>`<div class="why ${x.correct?'right':'wrong'}"><strong>${L[i]}. ${x.correct?'Correct':'Incorrect'}:</strong> ${x.why}</div>`).join('');
ex.style.display='block';
updateHeader();
if(Object.keys(answers).length===currentSet.length)showSummary();}
function showSummary(){
const total=currentSet.length,missed=currentSet.filter(q=>!answers[q.id]);
const pct=Math.round((total-missed.length)/total*100);
const title=document.querySelector('.summary-title'),msg=document.getElementById('summaryMsg');
if(round===1){title.textContent='Quiz Complete';
msg.textContent=pct>=90?"Absolute Gigachad. You drained that test dry.":pct>=70?"Solid run! You're locked in, get in some more reps.":"You lasted less than 30 seconds. Time for a rematch.";}
else{title.textContent=`Review Round ${round-1} Complete`;
msg.textContent=missed.length?`${missed.length} still missed. Go again.`:'Everything cleared. All correct.';}
const rb=document.getElementById('reviewBtn');
if(missed.length){rb.style.display='inline-block';rb.textContent=`Review Missed (${missed.length})`;}else rb.style.display='none';
document.getElementById('summary').style.display='block';
document.getElementById('summary').scrollIntoView({behavior:'smooth'});}
function setMode(m){quizMode=m;round=1;updateModeButtons();renderQuiz();}
document.getElementById('fullQuizBtn').addEventListener('click',()=>setMode('full'));
document.getElementById('quickQuizBtn').addEventListener('click',()=>setMode('quick'));
document.getElementById('retakeBtn').addEventListener('click',()=>{round=1;renderQuiz();});
document.getElementById('reviewBtn').addEventListener('click',()=>{round++;renderQuiz(currentSet.filter(q=>!answers[q.id]));});
window.onload=()=>{updateModeButtons();renderQuiz();};
</script>
</body>
</html>
