.opt:hover:not(:disabled){border-color:var(--accent)}

.opt.correct{background:var(--okbg);border-color:var(--ok)}
.opt.incorrect{background:var(--badbg);border-color:var(--bad)}
.fillrow{display:flex;gap:8px}

.fillrow input:focus{outline:none;border-color:var(--accent)}
.fillrow input.correct{border-color:var(--ok);background:var(--okbg)}
.fillrow input.incorrect{border-color:var(--bad);background:var(--badbg)}
.btn{background:var(--accent);color:#000;border:0;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer;font-family:inherit}

.banner{font-weight:800;margin-bottom:6px}
.banner.good{color:var(--ok)}.banner.bad{color:var(--bad)}
.target-nerve{color:var(--accent);font-weight:700;margin-bottom:6px}

.summary-title{font-size:1.4rem;font-weight:800;color:var(--accent);margin:0 0 8px}
@media(max-width:480px){.fillrow{flex-direction:column}}

const quizData = [];

// Populate Test -> Nerve
T.forEach(t => {
  const correctNum = t[1];
  const wrongNums = t[2];
  const allNums = [correctNum, ...wrongNums];
  
  const options = allNums.map((num, idx) => {
    const isCorrect = (idx === 0);
    return {
      text: N_NUM[num],
      correct: isCorrect,
      why: isCorrect 
        ? `${N_NUM[num]} (${N_NAME[num]}): Correct. ${t[3]}`
        : `${N_NUM[num]} (${N_NAME[num]}): Incorrect. Primarily responsible for: ${NERVE_TESTS[num]}`
    };
  });

  quizData.push({
    kind: "mc",
    tag: "Test → Nerve",
    revealedNerve: `${N_NUM[correctNum]} (${N_NAME[correctNum]})`,
    stem: "Which cranial nerve does this test? " + t[0],
    opts: options,
    why: t[3]
  });
});

// Populate Nerve -> Result
R.forEach(r => {
  quizData.push({
    kind: "mc",
    tag: "Nerve → Result",
    stem: r[0],
    opts: r[1],
    why: r[2]
  });
});

// Populate Spinal Nerves & Autonomics
SP.forEach(s => {
  quizData.push({
    kind: "mc",
    tag: "Spinal & Autonomics",
    stem: s.stem,
    opts: s.opts,
    why: s.why,
    revealedNerve: s.revealedNerve
  });
});

// Populate Fill-in
F.forEach(f => {
  quizData.push({
    kind: "fill",
    tag: "Fill-in",
    stem: f[0],
    acc: f[1],
    ans: f[2],
    why: f[3],
    revealedNerve: f[4]
  });
});

quizData.forEach((q, i) => q.id = i + 1);

const MODES = {
  all: "All Topics",
  sp: "Spinal & Autonomics",
  cn: "Cranial Only",
  t: "Test → Nerve",
  r: "Nerve → Result",
  f: "Fill-in"
};

const COUNTS = [25, 50, 80, 118];

let mode = "all", countChoice = 118, round = 1, set = [], answers = {};
const L = "ABCD";

const shuf = a => {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

const norm = s => s.toLowerCase().replace(/[^a-z0-9\s'\/-]/g, "").replace(/\s+/g, " ").trim();
const isMatch = (inp, acc) => {
  const n = norm(inp);
  return n && acc.some(a => {
    a = norm(a);
    return n === a || (a.length > 3 && n.includes(a));
  });
};

function header() {
  const c = Object.values(answers).filter(v => v).length, t = set.length;
  document.getElementById("header").textContent = `${round === 1 ? "Score" : "Review " + (round - 1)}: ${c} / ${t} (${t ? Math.round(c / t * 100) : 0}%)`;
}

function pool() {
  let p = [];
  if (mode === "t") p = quizData.filter(q => q.tag === "Test → Nerve");
  else if (mode === "r") p = quizData.filter(q => q.tag === "Nerve → Result");
  else if (mode === "sp") p = quizData.filter(q => q.tag === "Spinal & Autonomics");
  else if (mode === "cn") p = quizData.filter(q => q.tag === "Test → Nerve" || (q.tag === "Nerve → Result" && q.stem.startsWith("CN ")));
  else if (mode === "f") p = quizData.filter(q => q.kind === "fill");
  else p = [...quizData];
  
  const shuffled = shuf([...p]);
  return shuffled.slice(0, Math.min(countChoice, shuffled.length));
}

function render(custom) {
  set = custom || pool();
  answers = {};
  set.forEach(q => { if (q.opts) shuf(q.opts); });
  document.getElementById("summary").style.display = "none";
  const quiz = document.getElementById("quiz");
  quiz.innerHTML = "";
  
  set.forEach((q, n) => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<span class="badge">Question ${n + 1} of ${set.length}</span><span class="badge tag">${q.tag}</span><p class="stem"></p><div class="body"></div><div class="explain"></div>`;
    card.querySelector(".stem").textContent = q.stem;
    const body = card.querySelector(".body");
    
    if (q.kind === "mc") {
      q.opts.forEach((o, i) => {
        const b = document.createElement("button");
        b.className = "opt";
        b.textContent = `${L[i]}. ${o.text}`;
        b.onclick = () => pickMC(q, i, card);
        body.appendChild(b);
      });
    } else {
      body.innerHTML = `<div class="fillrow"><input type="text" placeholder="Type your answer" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn">Check</button></div>`;
      const inp = body.querySelector("input"), btn = body.querySelector("button");
      btn.onclick = () => checkFill(q, inp, btn, card);
      inp.onkeydown = e => { if (e.key === "Enter") checkFill(q, inp, btn, card); };
    }
    quiz.appendChild(card);
  });
  header();
  window.scrollTo(0, 0);
}

function wrongSound() {
  const a = document.getElementById("wrongAudio");
  try { a.currentTime = 0; a.play().catch(() => {}); } catch (e) {}
}

function explain(card, ok, q, extra) {
  const ex = card.querySelector(".explain");
  let nerveBanner = q.revealedNerve ? `<div class="target-nerve">Target / Key Structure: ${q.revealedNerve}</div>` : "";
  
  let rationaleHTML = "";
  if (q.opts) {
    rationaleHTML = '<div class="rationale-list"><div class="rationale-title">Option Rationale:</div>';
    q.opts.forEach((opt, idx) => {
      rationaleHTML += `<div class="rationale-item"><strong>${L[idx]})</strong> ${opt.why}</div>`;
    });
    rationaleHTML += '</div>';
  }

  ex.innerHTML = `
    <div class="banner ${ok ? "good" : "bad"}">${ok ? "Correct!" : "You didn’t know that?!"}</div>
    ${nerveBanner}
    ${extra || ""}
    <div class="ans"><strong>Explanation:</strong> ${q.why}</div>
    ${rationaleHTML}
  `;
  ex.style.display = "block";
}

function pickMC(q, i, card) {
  if (q.id in answers) return;
  const ok = q.opts[i].correct;
  answers[q.id] = ok;
  card.querySelectorAll(".opt").forEach((b, j) => {
    b.disabled = true;
    if (q.opts[j].correct) b.classList.add("correct");
    else if (j === i) b.classList.add("incorrect");
  });
  if (!ok) wrongSound();
  explain(card, ok, q);
  done();
}

function checkFill(q, inp, btn, card) {
  if (q.id in answers || !inp.value.trim()) return;
  const ok = isMatch(inp.value, q.acc);
  answers[q.id] = ok;
  inp.disabled = true;
  btn.disabled = true;
  inp.classList.add(ok ? "correct" : "incorrect");
  
  let extra = "";
  if (!ok) {
    wrongSound();
    extra = `<div class="ans"><strong>Answer:</strong> ${q.ans}</div><button class="btn alt override">I actually knew it</button>`;
  }
  explain(card, ok, q, extra);
  
  const ov = card.querySelector(".override");
  if (ov) {
    ov.onclick = () => {
      answers[q.id] = true;
      ov.remove();
      const b = card.querySelector(".banner");
      b.className = "banner good";
      b.textContent = "Counted as correct";
      header();
      if (Object.keys(answers).length === set.length) summary();
    };
  }
  done();
}

function done() {
  header();
  if (Object.keys(answers).length === set.length) summary();
}

function summary() {
  const total = set.length, missed = set.filter(q => !answers[q.id]), pct = Math.round((total - missed.length) / total * 100);
  const t = document.querySelector(".summary-title"), m = document.getElementById("summaryMsg");
  if (round === 1) {
    t.textContent = "Practicum Complete";
    m.textContent = pct >= 90 ? "Outstanding mastery! You have locked down cranial nerves, spinal topography, and autonomic wiring." : pct >= 70 ? "Solid run! You're locked in, get in some more reps." : "Keep reviewing the nerve paths, rami communicantes, and reflex arcs. Time for a rematch.";
  } else {
    t.textContent = `Review Round ${round - 1} Complete`;
    m.textContent = missed.length ? `${missed.length} still missed. Go again.` : "Everything cleared. All correct.";
  }
  const rb = document.getElementById("reviewBtn");
  if (missed.length) {
    rb.style.display = "inline-block";
    rb.textContent = `Review Missed (${missed.length})`;
  } else {
    rb.style.display = "none";
  }
  const s = document.getElementById("summary");
  s.style.display = "block";
  s.scrollIntoView({ behavior: "smooth" });
}

// Setup Mode buttons
const modesEl = document.getElementById("modes");
Object.entries(MODES).forEach(([k, v]) => {
  const b = document.createElement("button");
  b.className = "mode-btn" + (k === mode ? " active" : "");
  b.textContent = v;
  b.dataset.k = k;
  b.onclick = () => {
    mode = k;
    round = 1;
    modesEl.querySelectorAll(".mode-btn").forEach(x => x.classList.toggle("active", x.dataset.k === k));
    render();
  };
  modesEl.appendChild(b);
});

// Setup Question Count buttons
const countsEl = document.getElementById("counts");
COUNTS.forEach(cnt => {
  const b = document.createElement("button");
  b.className = "count-btn" + (cnt === countChoice ? " active" : "");
  b.textContent = `${cnt === 118 ? 'All (' + quizData.length + ')' : cnt} Questions`;
  b.dataset.c = cnt;
  b.onclick = () => {
    countChoice = cnt;
    round = 1;
    countsEl.querySelectorAll(".count-btn").forEach(x => x.classList.toggle("active", Number(x.dataset.c) === cnt));
    render();
  };
  countsEl.appendChild(b);
});

document.getElementById("retakeBtn").onclick = () => { round = 1; render(); };
document.getElementById("reviewBtn").onclick = () => { round++; render(set.filter(q => !answers[q.id])); };
render();
</script>
