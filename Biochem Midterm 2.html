<script>
const S=[["Wk 4","Hemoglobin Structure & O2 Binding"],["Wk 4-7","Hemoglobinopathies"],["Wk 5-7","Fibrous Proteins & Pathology"],["Wk 6-7","Carbohydrates"],["Wk 7","Lipids & Peroxidation"]];
const B=[];
function Q(s,d,p,r,st,...o){const id=B.length,ops=o.map((x,i)=>{const t=x.split('|');return{text:t[0],correct:i==0,why:t[1]+' ['+r+']'}}),c=ops.shift();ops.splice(id%4,0,c);B.push({id,subjectIndex:s,week:S[s][0],slideRef:r,difficulty:d,priority:p,stem:st,options:ops})}
// Hemoglobin
Q(0,'easy',1,'Lec 4.1','Adult hemoglobin is a tetramer of two _______ chains and two _______ chains.','alpha; beta|Two alpha-beta dimers make HbA (alpha2beta2).','alpha; gamma|That is fetal HbF.','beta; gamma|No such adult tetramer.','alpha; zeta|Embryonic Gower forms differ.');
Q(0,'easy',1,'Lec 7.1','Alpha-globin genes lie on chromosome _______ and beta-globin genes on chromosome _______.','16; 11|Four alpha alleles, two beta alleles from two parents.','11; 16|Reversed.','16; 16|Beta is on 11.','11; 11|Alpha is on 16.');
Q(0,'medium',1,'Lec 4.1','Chains within one alpha-beta dimer are held mainly by:','hydrophobic contacts|Nonpolar side chains fit like hand and glove.','ionic bridges|They act between dimers.','disulfide bonds|Hb has none between chains.','peptide bonds|Chains are separate polypeptides.');
Q(0,'medium',1,'Lec 4.1','The two dimers are linked across their gap mainly by:','ionic bridges|Lys/Arg pair with Asp/Glu; water would weaken them.','hydrophobic stacking|That is the intra-dimer force.','glycosidic bonds|Those join sugars.','peptide bonds|Not between subunits.');
Q(0,'medium',1,'Lec 7.1','Hb and myoglobin carry O2 only if heme iron stays _______.','Fe2+|Oxidized Fe3+ binds tightly and the spleen removes it.','Fe3+|Cannot carry O2.','Cu2+|Heme holds iron.','Zn2+|Not heme.');
Q(0,'medium',1,'Lec 4.1','The sigmoidal O2 curve of Hb reflects:','cooperativity|Each bound O2 loosens the taut structure.','independent sites|That gives a hyperbola.','one site per tetramer|Hb has four hemes.','covalent O2 binding|O2 binds iron weakly.');
Q(0,'hard',1,'Lec 4.2','Local PO2 falls from 30 to 20 mmHg. Hb on the steep curve segment releases about:','twice as much O2|Roughly 35% released becomes 70%.','no more O2|That is the flat plateau.','half as much O2|Lower PO2 favors release.','all of its O2|Saturation stays above zero.');
Q(0,'hard',1,'Lec 7.1','Whether Hb loads or unloads O2 in a capillary bed is set by _______.','local PO2|It reflects tissue demand; BPG only stabilizes structure.','2,3-BPG level|BPG is always present.','nerve signals|Signaling is chemical.','dimer number|Not the lever.');
Q(0,'medium',1,'Lec 7.1','2,3-BPG sits in the central cavity and:','binds Lys and Arg, stabilizing the taut form|Without it O2 is not released.','binds heme iron|It binds the cavity.','forms in mitochondria|RBCs have none.','oxidizes Fe2+|It does not change iron state.');
Q(0,'medium',1,'Lec 4.2','Red cells make 2,3-BPG from an intermediate of:','glycolysis|From the phosphoglycerate step.','the TCA cycle|Needs mitochondria.','the urea cycle|Liver pathway.','beta oxidation|Needs mitochondria.');
Q(0,'medium',1,'Lec 7.1','Lactic acid shifts the Hb curve right because protonated His:','tightens BPG and ionic bonds, favoring release|Bohr effect strengthens the taut form.','loosens BPG binding|Direction inverted.','oxidizes heme iron|Not the mechanism.','pulls the dimers apart|Structure is tightened only.');
Q(0,'hard',1,'Lec 4.2','Stored blood low in 2,3-BPG shifts its curve _______, so it unloads little O2.','left|Relaxed-like form dominates.','right|Needs BPG, acid, or CO2.','down|Capacity is unchanged.','nowhere|BPG shapes the curve.');
Q(0,'hard',1,'Lec 7.1','Fetal Hb binds O2 tightly because it has fewer _______ lining the cavity, weakening BPG binding.','Lys and Arg|Less positive charge for BPG.','Glu and Asp|BPG needs positive partners.','His residues|Uncharged at 7.4.','heme groups|Each chain has one.');
Q(0,'medium',1,'Lec 4.2','Carbon monoxide is dangerous because it:','binds iron tightly, locking the relaxed form|Remaining O2 is not unloaded.','oxidizes iron to Fe3+|That is methemoglobin.','displaces 2,3-BPG|It acts at iron.','denatures globin|Not its action.');
// Hemoglobinopathies
Q(1,'easy',1,'Lec 4.3','Sickle cell results from _______ replacing _______ at beta position 6.','valine; glutamate|Nonpolar branched residue for a negative one.','glutamate; valine|Reversed.','glycine; glutamate|Wrong residue.','valine; lysine|Wrong residue.');
Q(1,'medium',1,'Lec 4.3','Deoxygenated HbA does not aggregate because Glu (pKa near 4) is _______ at pH 7.4.','negatively charged|Same-charge repulsion.','positively charged|Glu is acidic.','neutral|It is ionized.','hydrophobic|It is polar.');
Q(1,'medium',1,'Lec 4.3','Deoxygenated HbS aggregates because Val side chains:','interdigitate hydrophobically|Branched nonpolar groups interlock.','form ionic bridges|Val is uncharged.','repel each other|That is Glu behavior.','hydrogen bond water|Val is hydrophobic.');
Q(1,'hard',1,'Lec 7.1','Sickled shape is directly caused by aggregation of _______ HbS.','deoxygenated|Taut form exposes Val; carrying the allele alone does nothing.','oxygenated|Relaxed form hides Val.','CO-bound|CO locks the relaxed form.','oxidized|Not the cause.');
Q(1,'medium',1,'Lec 4.3','Sickle trait differs from disease in being _______ rather than _______.','heterozygous; homozygous|One versus both chr 11 alleles.','homozygous; heterozygous|Reversed.','acquired; inherited|Both inherited.','alpha-linked; beta-linked|Both involve beta.');
Q(1,'medium',1,'Lec 4.3','Sickle trait persists because a shorter red cell lifespan:','limits Plasmodium maturation|Parasite needs time inside the cell.','raises 2,3-BPG|BPG is not antimicrobial.','blocks parasite entry|Not the mechanism.','speeds Hb synthesis|Not protective.');
Q(1,'medium',1,'Lec 7.1','Thalassemia is best described as:','too few functional globin chains|Alpha and beta cannot pair evenly.','a Glu-to-Val change|That is sickle cell.','a heme synthesis defect|That is porphyria.','a collagen defect|Unrelated.');
Q(1,'hard',1,'Lec 4.3','Beta-thalassemia appears after birth because the fetus uses _______, which has no beta chains.','HbF|Alpha2gamma2 is replaced by HbA near birth.','HbA|The adult form.','HbS|Not fetal.','myoglobin|Not a blood Hb.');
Q(1,'medium',1,'Lec 4.3','With four alpha alleles, losing one leaves _______ of alpha chains faulty.','one quarter|Three good alleles supply the rest.','one half|That is one of two beta alleles.','all|Three are normal.','none|The bad allele still wastes resources.');
Q(1,'medium',1,'Lec 7.1','Repeated transfusion in beta-thalassemia risks _______.','liver iron overload|Called hemosiderosis.','vitamin C loss|Unrelated.','copper toxicity|Unrelated.','hyperoxia|Unrelated.');
Q(1,'medium',1,'Lec 4.3','G6PD deficiency causes hemolysis because red cells lack enough _______.','NADPH|From the hexose monophosphate path.','ATP|Glycolysis still works.','2,3-BPG|Not the defect.','heme|Not the defect.');
// Fibrous
Q(2,'easy',1,'Lec 4.3','One third of collagen is glycine because its _______ lets chains braid tightly.','tiny side chain|Bulky residues block packing.','charge|Glycine is uncharged.','thiol group|That is cysteine.','ring|That is proline.');
Q(2,'medium',1,'Lec 7.2','Glycine has no L or D form because its alpha carbon:','carries two hydrogens|Not a chiral center.','has a charged group|It is uncharged.','is absent|It has one.','forms a ring|That is proline.');
Q(2,'medium',1,'Lec 5.2','Prolyl and lysyl hydroxylases need O2, iron, and _______.','vitamin C|Keeps iron reduced.','vitamin B6|Decarboxylase cofactor.','copper|Serves lysyl oxidase.','biotin|Carboxylase cofactor.');
Q(2,'medium',1,'Lec 5.2','Hydroxyproline stabilizes the triple helix by:','hydrogen bonding via its hydroxyl|Dipole and H bonds hold the braid.','forming aldehydes|That is lysine oxidation.','carrying sugars|Hydroxylysine does that.','cleaving propeptides|Peptidases do that.');
Q(2,'medium',1,'Lec 5.2','Collagen cross-links form when _______ oxidizes lysine to an aldehyde.','lysyl oxidase|Copper dependent.','lysyl hydroxylase|Adds OH only.','prolyl hydroxylase|Acts on proline.','collagenase|Degrades collagen.');
Q(2,'medium',1,'Lec 5.2','Staggered collagen fibrils improve:','fracture toughness|A crack cannot run through aligned ends.','brittleness|Opposite effect.','hydroxylation rate|Chemistry, not architecture.','water solubility|Not the purpose.');
Q(2,'medium',1,'Lec 5.1','The collagen forming the basement membrane mesh is type _______.','IV|Network former, anchored by VII.','I|Tendon and bone.','II|Cartilage.','III|Vessels and reticular tissue.');
Q(2,'medium',1,'Lec 7.2','Stretched elastin recoils because its _______ side chains avoid water.','hydrophobic|Desmosine cross-links hold the network.','charged|Not elastin-rich.','sulfur-rich|That is keratin.','hydroxylated|That is collagen.');
Q(2,'easy',1,'Lec 7.2','Keratin gets strength and metal binding from its high _______ content.','cysteine|Disulfides and sulfhydryls.','glycine|Collagen feature.','proline|Collagen feature.','lysine|Cross-link source.');
Q(2,'easy',1,'Lec 7.2','Loose teeth and easy bruising suggest weak _______ from scurvy.','collagen|Pro and Lys are not hydroxylated.','keratin|Not affected.','elastin|Not affected.','hemoglobin|Not affected.');
Q(2,'easy',1,'Lec 7.2','Hyperextensible fingers and stretchy skin suggest _______.','Ehlers-Danlos|Collagen laxity; caution with adjustments.','osteogenesis imperfecta|Bone fragility.','Marfan syndrome|Fibrillin defect.','scurvy|Nutritional.');
Q(2,'hard',1,'Lec 7.2','OI Type II is lethal because collagen defects block tight braiding and:','present in utero|Type I (tarda) is survivable.','begin in adulthood|That is not Type II.','arise from vitamin C loss|OI is genetic.','involve fibrillin|That is Marfan.');
Q(2,'medium',1,'Lec 5.2','Marfan syndrome involves fibrillin, which is _______.','not collagen, elastin, or keratin|A distinct matrix protein.','a collagen type|Not collagen.','a form of elastin|Not elastin.','a keratin|Not keratin.');
Q(2,'hard',1,'Lec 5.2','A nonsmoker with emphysema may lack alpha-1 antitrypsin, leaving _______ unchecked.','neutrophil elastase|It digests lung elastin.','collagenase|Elastin is the target.','lysyl oxidase|Not the mechanism.','trypsinogen|Not the mechanism.');
// Carbs
Q(3,'medium',1,'Lec 6.1','Mannose is the _______ epimer of glucose and galactose is the _______ epimer.','C2; C4|One chiral carbon differs each.','C4; C2|Reversed.','C1; C6|C1 is anomeric; C6 is not chiral.','C3; C5|Not the common ones.');
Q(3,'medium',1,'Lec 6.1','Alpha and beta D-glucopyranose differ at the _______ carbon.','C1|The anomeric carbon of the closed ring.','C2|That makes mannose.','C4|That makes galactose.','C6|Not chiral.');
Q(3,'easy',1,'Tutoring','Glucose and fructose are _______ because they share a formula but differ in carbonyl position.','structural isomers|Aldose versus ketose.','epimers|Differ at one chiral carbon only.','anomers|Differ at the anomeric carbon only.','enantiomers|Not mirror images.');
Q(3,'medium',1,'Tutoring','The anomeric carbon is C1 in aldoses and _______ in fructose.','C2|It carries the ketone carbonyl.','C3|Not the carbonyl carbon.','C4|Not the carbonyl carbon.','C6|Not the carbonyl carbon.');
Q(3,'medium',1,'Lec 6.1','A D-sugar rotates plane-polarized light _______ and an L-sugar _______.','clockwise; counterclockwise|Dextro versus levo.','counterclockwise; clockwise|Reversed.','upward; downward|Not used.','not at all; clockwise|Both rotate.');
Q(3,'medium',1,'Tutoring','The blood glucose form is _______.','alpha-D-glucopyranose|Metabolized by hexokinase.','beta-D-glucopyranose|Poor hexokinase fit.','alpha-D-fructofuranose|A ketose.','beta-D-galactopyranose|An epimer.');
Q(3,'medium',1,'Lec 7.2','Beta-D-glucose fails in glycolysis because its shape does not:','fit the hexokinase site|Chirality drives enzyme affinity.','contain an aldehyde|It has one.','have six carbons|It has six.','close into a ring|It does close.');
Q(3,'easy',1,'Lec 6.2','A glycosidic bond forms by _______ and is cleaved by _______.','condensation; hydrolysis|Water is released, then added.','hydrolysis; condensation|Reversed.','oxidation; reduction|Not the type.','phosphorylation; hydrolysis|Not the type.');
Q(3,'medium',1,'Lec 6.2','Lactose intolerance causes diarrhea because lactose _______.','holds water in the lumen|Disaccharides cannot enter enterocytes.','damages enterocytes|Not the cause.','blocks sodium uptake|Not the cause.','crystallizes in colon|Not the cause.');
Q(3,'medium',1,'Tutoring','Lactose is galactose joined to glucose by a _______ bond.','beta-1,4|Cleaved by lactase.','alpha-1,4|That is maltose.','alpha-1,beta-2|That is sucrose.','alpha-1,6|That is isomaltose.');
Q(3,'medium',1,'Lec 6.2','Sucrose is non-reducing because _______ are used in its bond.','both anomeric carbons|Neither ring can open.','neither anomeric carbon|One is free in lactose.','only the glucose C1|Fructose C2 is used too.','no hydroxyl groups|It has many.');
Q(3,'medium',1,'Lec 6.2','Humans cannot digest cellulose because it has _______ glucose linkages.','beta-1,4|We lack the enzyme.','alpha-1,4|Amylase cleaves these.','alpha-1,6|Isomaltase cleaves these.','alpha-1,2|Sucrase cleaves these.');
Q(3,'medium',1,'Lec 6.2','GAGs repeat an amine sugar with an _______ sugar, binding Na+ and water.','acidic|Negative charge holds sodium.','neutral|Not the repeat.','phosphorylated|Not the repeat.','fatty|Not a sugar.');
// Lipids
Q(4,'easy',1,'Lec 7.3','A true fat (TAG) is a glycerol with _______ fatty acids esterified.','three|Fatty acids alone are not the fat.','one|That is a monoacylglycerol.','two|That is a diacylglycerol.','four|Glycerol has three OH groups.');
Q(4,'medium',1,'Lec 7.3','Pancreatic lipases digest fat by hydrolyzing the _______ bond.','ester|Acid plus alcohol condensation product.','glycosidic|Joins sugars.','peptide|Joins amino acids.','phosphodiester|Joins nucleotides.');
Q(4,'medium',1,'Lec 7.3','Phospholipid head groups include phosphate bound to serine, choline, inositol, or _______.','ethanolamine|Four major adducts.','glycine|Not a major head group.','alanine|Not a major head group.','ribose|Not a head group.');
Q(4,'medium',1,'Lec 7.3','Bile salts are needed to absorb fat-soluble vitamins because they _______.','emulsify large oil droplets|Increases surface area for enterocytes.','hydrolyze esters|Lipase does that.','carry vitamins in blood|Proteins do that.','activate the vitamins|Cells do that.');
Q(4,'medium',1,'Lec 7.3','Bile salts are derived from _______.','cholesterol|Also the precursor of steroids.','phospholipids|Not the source.','triglycerides|Not the source.','ceramide|That gives sphingomyelin.');
Q(4,'medium',1,'Lec 7.3','Sphingomyelin, built on ceramide plus choline, is unique to _______ and Schwann cells.','oligodendrocytes|Myelinating cells.','hepatocytes|Not myelinating.','adipocytes|Store fat.','erythrocytes|Not myelinating.');
Q(4,'medium',1,'Lec 7.3','Vitamin A, D, E, and K occur as alcohols (retinol, tocopherol) and are packaged as _______.','fatty acid esters|The ester is the supplement form.','amides|Not the form.','phosphates|Not the form.','glycosides|Not the form.');
Q(4,'hard',1,'Lec 7.3','18:1(9) is an _______ fatty acid, oleic acid.','omega-9|18 minus 9 equals 9.','omega-3|Needs bond at C15.','omega-6|Needs bond at C12.','omega-7|That is 16:1(9).');
Q(4,'medium',1,'Lec 7.3','The essential fatty acids are linoleic acid, an omega-_______, and alpha-linolenic acid, an omega-_______.','6; 3|Humans cannot add bonds that close to the end.','3; 6|Reversed.','9; 6|Oleic is omega-9, made by delta-9.','6; 9|Wrong second family.');
Q(4,'hard',1,'Lec 7.3','Polyunsaturated fats are oxidized most easily at the _______ between double bonds.','methylene carbon|Hydrogen abstraction starts peroxidation.','carbonyl carbon|Not the target.','omega carbon|Not the target.','ester oxygen|Not the target.');
Q(4,'hard',1,'Lec 7.3','Alpha-linolenic acid is more peroxidation-prone than linoleic acid because it has _______ such methylene sites.','two|Three bonds give two bridges.','one|That is linoleic acid.','three|Needs four double bonds.','zero|Saturated fats have none.');
Q(4,'hard',1,'Lec 7.3','Heating oils too long converts cis to trans and eventually fragments chains into toxic _______.','aldehydes|Oxygen attacks the double bonds.','ketones only|Not the main product.','sterols|Not formed.','glycerol|Not toxic.');
Q(4,'medium',1,'Lec 7.3','Arachidonic acid, a 20:4 omega-6, sits at carbon 2 of phospholipids and is released for _______.','cyclooxygenase|Starts prostaglandin synthesis.','lipase digestion|Gut enzyme.','beta oxidation|Not the fate.','bile synthesis|Not the fate.');
Q(4,'medium',0,'Lec 7.3','DHA, a 22:6 omega-3, is concentrated in the _______.','retina|One DHA per phospholipid in rod outer segments.','liver|Not concentrated.','kidney|Not concentrated.','adipose|Not concentrated.');
Q(4,'easy',0,'Lec 7.3','Fat yields about _______ kcal per gram.','9|Dietary Calories are kilocalories.','4|Carbohydrate and protein.','7|Alcohol.','12|Too high.');
// Updated outline additions: globular proteins
Q(0,'easy',1,'Outline','Cytochromes differ from hemoglobin because their heme iron cycles between _______ and _______.','Fe2+; Fe3+|Redox coupling carries electrons in the ETC.','Fe0; Fe2+|Not a biological pair.','Fe3+; Fe4+|Not a biological pair.','Fe2+; Cu2+|Copper is not heme.');
Q(0,'easy',1,'Lec 7.1','A protein with quaternary structure is one made of:','several folded chains|Hemoglobin and PKA are examples.','one folded chain|That is tertiary structure.','one helical segment|That is secondary structure.','one linear sequence|That is primary structure.');
Q(0,'medium',0,'Lec 7.1','Caspases are enzymes that carry out _______.','controlled cell death|Regulated demise of a cell (apoptosis).','fatty acid synthesis|That is acetyl CoA carboxylase.','oxygen transport|That is hemoglobin.','glycogen storage|Unrelated.');
Q(0,'medium',0,'Lec 7.1','Protein kinase A is activated downstream of the _______ receptors for epinephrine and glucagon.','G protein-coupled|cAMP then activates PKA.','insulin tyrosine kinase|A different pathway.','steroid nuclear|Act on genes directly.','ligand-gated channel|Not the pathway.');
Q(0,'medium',0,'Lec 7.1','Acetyl CoA carboxylase is the key enzyme for _______.','fatty acid synthesis|A quaternary enzyme.','urea synthesis|Different pathway.','glycolysis|Different pathway.','heme synthesis|Different pathway.');
// Carbohydrates: polysaccharides, GAGs
Q(3,'medium',1,'Outline','Amylose is a _______ chain, whereas amylopectin and glycogen are _______.','straight; branched|All are alpha-glucose polymers.','branched; straight|Reversed.','beta-linked; alpha-linked|Both are alpha-linked.','protein-based; lipid-based|All are carbohydrates.');
Q(3,'medium',1,'Lec 6.2','Branch points in amylopectin and glycogen are _______ linkages.','alpha-1,6|Cleaved by isomaltase-type activity.','alpha-1,4|Straight-chain links.','beta-1,4|Cellulose links.','alpha-1,2|Sucrose-type link.');
Q(3,'hard',1,'Outline','Skeletal muscle holds about _______ of glycogen in total, and the liver holds at most about _______.','400 g; 90 g|Muscle has the larger store.','90 g; 400 g|Reversed.','40 g; 900 g|Wrong magnitudes.','900 g; 40 g|Wrong magnitudes.');
Q(3,'medium',1,'Lec 6.1','A proteoglycan is a _______ carrying many GAG chains.','core protein|Hydrophilic chains retain water.','phospholipid|Not the scaffold.','cellulose fiber|Not the scaffold.','nucleotide|Not the scaffold.');
Q(3,'hard',1,'Lec 6.1','Mucopolysaccharidoses are lysosomal storage diseases caused by a missing _______ that normally degrades GAG chains.','lysosomal acid hydrolase|Undegraded GAG accumulates.','mitochondrial dehydrogenase|Wrong organelle.','Golgi kinase|Wrong organelle.','cytosolic oxidase|Wrong organelle.');
// Lipids: classes, vitamins, lipoproteins
Q(4,'easy',1,'Lec 7.3','In fatty acid notation, 16:0 means 16 carbons and _______ double bonds.','zero|Saturated, such as palmitic acid.','one|That is monounsaturated.','two|That is polyunsaturated.','sixteen|The colon counts double bonds.');
Q(4,'medium',1,'Lec 7.3','Phosphatidylcholine has _______ attached to its phosphate.','choline|PS serine, PE ethanolamine, PI inositol.','serine|That is PS.','ethanolamine|That is PE.','inositol|That is PI.');
Q(4,'medium',1,'Lec 7.3','Cholesterol is the precursor of steroids, bile salts, and vitamin _______.','D|Via 7-dehydrocholesterol in skin.','A|Comes from retinol.','K|A quinone.','E|A tocopherol.');
Q(4,'easy',1,'Lec 7.3','The fat-soluble vitamin needed to activate clotting factors is _______.','K|Without it clotting proteins stay inactive.','A|Vision and epithelium.','D|Gut calcium absorption.','E|Lipid antioxidant.');
Q(4,'easy',1,'Lec 7.3','The lipid-phase antioxidant vitamin is _______.','E|Tocopherol.','K|Clotting.','D|Calcium absorption.','A|Epithelial differentiation.');
Q(4,'medium',1,'Lec 7.3','Vitamin A as retinoic acid is required for differentiation of _______ cells.','epithelial|Also supports vision via retinal.','erythroid|Not its role.','hepatic stellate|Not its role.','osteoclast|Not its role.');
Q(4,'medium',1,'Outline','Chylomicrons carry _______ fats from the gut into lymph.','dietary|Packaged by enterocytes.','liver-made|That is VLDL.','recycled cholesterol|That is HDL.','ketone body|Not lipoprotein cargo.');
Q(4,'medium',1,'Outline','VLDL particles are produced by the _______ to distribute triglycerides.','liver|Made endogenously.','intestine|That makes chylomicrons.','adipose tissue|Stores triglycerides.','spleen|Not involved.');
Q(4,'medium',1,'Outline','LDL delivers cholesterol to tissues, while HDL returns it to the _______.','liver|Reverse cholesterol transport.','intestine|Not the destination.','adipose tissue|Not the destination.','kidney|Not the destination.');
Q(4,'easy',0,'Lec 7.3','Excess calories are stored mainly as _______ in adipose tissue.','triglycerides|Three fatty acids on glycerol.','phospholipids|Membrane lipids.','cholesterol esters|Not the main store.','free fatty acids|Toxic in bulk.');
// ---------------- UI ----------------
const $=i=>document.getElementById(i),L=i=>String.fromCharCode(65+i);
let H={};try{H=JSON.parse(localStorage.getItem('quiz_missed_history')||'{}')}catch(e){}
const sv=()=>{try{localStorage.setItem('quiz_missed_history',JSON.stringify(H))}catch(e){}};
let sel=new Set(S.map((_,i)=>i)),pri=false,view='one',mute=false,base=[],qs=[],an=[],cur=0,sc=0,tm;
try{view=localStorage.getItem('quizView')||'one';mute=localStorage.getItem('stfuErijah')=='1'}catch(e){}
function sh(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function btn(){$('vb').textContent='View: '+(view=='all'?'All at Once':'One by One');$('eb').textContent=mute?'Bring Back Erijah':'STFU Erijah';$('eb').classList.toggle('on',mute);if(mute){$('wp').classList.add('h');clearTimeout(tm);try{$('wa').pause()}catch(e){}}}
function togE(){mute=!mute;try{localStorage.setItem('stfuErijah',mute?1:0)}catch(e){}btn()}
function setV(v){view=v;try{localStorage.setItem('quizView',v)}catch(e){}btn();qs.length&&qs.length>0&&$('main').querySelector('.qc')?draw():home()}
function togView(){setV(view=='all'?'one':'all')}
function pool(){const p=B.filter(q=>sel.has(q.subjectIndex));if(pri){const m=p.filter(q=>H[q.id]>0);if(m.length)return m}return p}
function home(){qs=[];btn();$('pp').innerHTML='Q: <b>0/0</b>';$('sp').innerHTML='Score: <b>0/0 (0%)</b>';$('pf').style.width=0;
const p=pool(),ms=Object.keys(H).filter(k=>H[k]>0).length;
$('main').innerHTML=`<div class="card"><div class="t">Biochemistry Midterm 2 Hub</div><div class="lab">Topics</div><div class="row">
<div class="chip ${sel.size==S.length?'on':''}" onclick="sA(1)">All Topics (${B.length})</div>${S.map((s,i)=>`<div class="chip ${sel.has(i)?'on':''}" onclick="tS(${i})">[${s[0]}] ${s[1]} (${B.filter(q=>q.subjectIndex==i).length})</div>`).join('')}</div>
<div class="row"><button class="btn" onclick="sA(1)">Select All</button><button class="btn" onclick="sA(0)">Clear</button><button class="btn ${pri?'on':''}" onclick="pri=!pri;home()">Prioritize Missed (${ms})</button></div>
<div class="lab">Display Mode</div><div class="row"><div class="chip ${view=='one'?'on':''}" onclick="view='one';setV('one')">One by One (Card View)</div><div class="chip ${view=='all'?'on':''}" onclick="setV('all')">All at Once (Continuous List)</div></div>
<div class="lab" style="color:var(--or)">${p.length} questions available across ${sel.size} topics selected</div>
<button class="btn on" style="padding:12px 20px" onclick="go(pool())">Start Quiz (All ${p.length} Selected Questions)</button></div>`}
function tS(i){sel.has(i)?sel.delete(i):sel.add(i);home()}function sA(a){sel=a?new Set(S.map((_,i)=>i)):new Set();home()}
function go(p){if(!p.length){alert('Please pick at least one topic.');return}base=p;qs=sh(p).map(q=>({...q,options:sh(q.options)}));an=qs.map(()=>null);cur=0;sc=0;draw()}
function card(q,i){const a=an[i],s=S[q.subjectIndex];let f='';
if(a!==null){const ok=q.options[a].correct,c=q.options.find(o=>o.correct);f=`<div class="fb"><div class="${ok?'g':'r'}">${ok?'Correct!':'Incorrect.'}</div><div style="margin-top:6px"><b>Concept:</b> ${c.why}</div>${q.options.map((o,j)=>`<div class="ri ${o.correct?'c':''}"><b>${L(j)})</b> ${o.why}</div>`).join('')}</div>`}
return `<div class="card qc"><div class="bd"><span class="b q">Q${i+1}</span><span class="b">${s[1]}</span><span class="b ${q.difficulty}">${q.difficulty}</span>${q.priority?'<span class="b hy">High Yield</span>':''}<span class="b">${q.slideRef}</span></div><div class="stem">${q.stem}</div>${q.options.map((o,j)=>`<div class="opt ${a!==null?'lk '+(a==j?(o.correct?'ok':'bad'):(o.correct?'ok':'dim')):''}" ${a===null?`onclick="pk(${i},${j})"`:''}><span class="l">${L(j)}.</span><span>${o.text}</span></div>`).join('')}${f}</div>`}
function st(lbl){const n=an.filter(x=>x!==null).length;$('pp').innerHTML=lbl;$('sp').innerHTML=`Score: <b>${sc}/${n} (${n?Math.round(sc/n*100):0}%)</b>`;$('pf').style.width=n/qs.length*100+'%'}
function draw(){const n=an.filter(x=>x!==null).length;
if(view=='all'){const y=scrollY;st(`Answered: <b>${n}/${qs.length}</b>`);$('main').innerHTML=qs.map((q,i)=>card(q,i)).join('')+(n==qs.length?'<div style="text-align:center"><button class="btn on" onclick="sum()">View Final Results Summary</button></div>':'');scrollTo(0,y)}
else{if(cur>=qs.length)return sum();st(`Question: <b>${cur+1} of ${qs.length}</b>`);$('main').innerHTML=card(qs[cur],cur)+(an[cur]!==null?`<div style="text-align:right"><button class="btn on" onclick="cur++;draw()">${cur==qs.length-1?'Finish Exam':'Next Question'}</button></div>`:'')}}
function pk(i,j){if(an[i]!==null)return;const q=qs[i];an[i]=j;if(q.options[j].correct){sc++;if(H[q.id])H[q.id]--}else{H[q.id]=(H[q.id]||0)+1;if(!mute){try{$('wa').currentTime=0;$('wa').play().catch(()=>{})}catch(e){}$('wp').classList.remove('h');clearTimeout(tm);tm=setTimeout(()=>$('wp').classList.add('h'),2000)}}sv();draw()}
let missed=[];
function sum(){const t=qs.length,p=Math.round(sc/t*100),bd={};missed=[];
qs.forEach((q,i)=>{const b=bd[q.subjectIndex]||(bd[q.subjectIndex]={t:0,c:0});b.t++;if(an[i]!==null&&q.options[an[i]].correct)b.c++;else missed.push(B[q.id])});
const msg=p>=90?'Absolute Gigachad. You drained that test dry.':p>=70?'You lasted less than 30 seconds. Time for a rematch.':'You really didn’t fucking know that.';
$('pf').style.width='100%';
$('main').innerHTML=`<div class="card sum"><div class="t">Exam Complete!</div><div class="big">${sc} / ${t}</div><div style="font-weight:700;color:${p>=70?'#4ade80':'#ef4444'}">${p}% &middot; ${p>=70?'Passing':'Needs Remediation'}</div><p style="margin-top:8px">${msg}</p>
<div class="bk"><b style="color:var(--or)">Per-Topic Performance</b>${Object.keys(bd).map(k=>`<div>${S[k][1]}: ${bd[k].c}/${bd[k].t} (${Math.round(bd[k].c/bd[k].t*100)}%)</div>`).join('')}</div>
<div class="row" style="justify-content:center"><button class="btn on" onclick="go(base)">Retake Current Set</button><button class="btn" onclick="missed.length?go(missed):alert('No missed questions!')">Review Missed (${missed.length})</button><button class="btn" onclick="home()">Back to Menu</button><a href="index.html" class="btn">Back to Hub</a></div></div>`}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',home)}else{home()}
</script></body></html>
