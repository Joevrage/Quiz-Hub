// ---- 0 Hemoglobin
Q(0,'easy',true,'Lec 4.1','Within each alpha-beta dimer of hemoglobin, the two chains are held together mainly by:',
'hydrophobic interactions between complementary nonpolar domains|The alpha and beta surfaces fit like hand and glove through nonpolar side chains (Val, Leu, Ile, Phe, Trp).',
'ionic bridges between Lys/Arg and Asp/Glu|Ionic bridges span the gap BETWEEN the two dimers, not within one.',
'covalent disulfide bonds between Cys residues|Hemoglobin subunits are not disulfide linked.',
'peptide bonds joining the C-terminus of alpha to the N-terminus of beta|The chains are separate polypeptides; association is non-covalent.');
Q(0,'medium',true,'Lec 4.1','The tetramer is stabilized across the dimer-dimer gap mainly by _______, which are disrupted if water enters the gap.',
'ionic bridges|Positive Lys/Arg pair with negative Asp/Glu; water solvates the charges and weakens them.',
'hydrophobic stacking|Hydrophobic packing is the intra-dimer force and does not depend on charge.',
'covalent glycosidic bonds|Glycosidic bonds join sugars, not subunits.',
'disulfide bridges|No interchain disulfides exist in Hb.');
Q(0,'medium',true,'Lec 4.2','A tissue bed with high CO2 and lower pH shifts the oxygen dissociation curve:',
'rightward, because protonated His strengthens the T-state ionic bridges and favors O2 release|This is the Bohr effect: more O2 is unloaded at the same PO2.',
'leftward, because protonated His weakens the T-state and favors O2 binding|Direction is inverted; acid favors the taut form.',
'leftward, because CO2 displaces 2,3-BPG from the central cavity|CO2 does not displace 2,3-BPG and the shift is right, not left.',
'rightward, because Fe2+ is oxidized to Fe3+|Oxidation to Fe3+ would abolish O2 binding; Bohr shift keeps Fe2+.');
Q(0,'hard',true,'Lec 4.2','Red cells in stored transfused blood are depleted of 2,3-BPG. Their oxygen dissociation curve is shifted:',
'left, so Hb binds O2 tightly and delivers little to tissue|Loss of 2,3-BPG weakens the T-state, raising affinity.',
'right, so Hb unloads O2 too readily in the lungs|A right shift needs more 2,3-BPG, acid, or CO2.',
'unchanged, since 2,3-BPG acts only on fetal Hb|2,3-BPG binds adult beta chains in the central cavity.',
'flattened to a hyperbola like myoglobin|Cooperativity is reduced in degree but the effector is loss of BPG, which causes a left shift.');
Q(0,'medium',true,'Lec 4.2','Venous blood leaving a resting tissue is about 75% saturated, meaning on average Hb has released about _______ of its four O2 molecules.',
'one|75% saturated = 3 of 4 sites still loaded.',
'two|That would be 50% saturation.',
'three|That would be 25% saturation.',
'all four|That would be 0% saturation, which is not the normal operating point.');
// ---- 1 Hemoglobinopathies
Q(1,'easy',true,'Lec 4.3','Sickle cell anemia results from a point mutation substituting _______ for _______ at position 6 of the beta chain.',
'valine; glutamate|Nonpolar Val replaces negatively charged Glu.',
'glutamate; valine|Reversed.',
'lysine; glutamate|That is HbC, not HbS.',
'valine; glycine|Not the sickle mutation.');
Q(1,'medium',true,'Lec 4.3','Deoxygenated HbS aggregates because the substituted residue:',
'interdigitates hydrophobically with Val on neighboring beta chains|Branched nonpolar side chains interlock, forming stacked fibers.',
'forms ionic bridges with neighboring Lys and Arg|Valine carries no charge.',
'repels the same residue on adjacent chains by negative charge|That describes Glu-Glu repulsion, which is lost in HbS.',
'hydrogen bonds with water in the gap between dimers|Valine is hydrophobic and cannot hydrogen bond.');
Q(1,'medium',true,'Lec 4.3','Sickle cell trait (heterozygous) is retained in the gene pool because shortened red cell lifespan:',
'limits Plasmodium maturation inside the red cell, reducing severe malaria|Parasites require time within the RBC to mature.',
'raises HbF to block parasite entry|HbF is not raised in trait.',
'increases 2,3-BPG to kill the parasite|2,3-BPG is not antimicrobial.',
'prevents the spleen from removing infected cells|The spleen removes rigid or abnormal cells; this does not protect against malaria.');
Q(1,'medium',true,'Lec 4.2','Carbon monoxide is toxic mainly because it:',
'binds heme Fe about 200 times more tightly than O2 and stabilizes the relaxed form so remaining O2 is not unloaded|Back-bonding makes CO binding very strong.',
'oxidizes Fe2+ to Fe3+ forming methemoglobin|That is nitrite-type toxicity, not CO.',
'displaces 2,3-BPG from the central cavity|CO binds iron, not the cavity.',
'denatures alpha chains by hydrophobic disruption|CO does not denature globin.');
// ---- 2 Collagen and elastin
Q(2,'easy',true,'Lec 4.3','Every third residue in collagen is glycine because:',
'its hydrogen side chain lets the three chains braid tightly enough to form interchain hydrogen bonds|Any bulky side chain would block the close packing.',
'its charged side chain forms ionic bridges between chains|Glycine is uncharged.',
'its thiol side chain forms disulfide crosslinks|That describes cysteine.',
'its ring structure kinks the helix|That describes proline.');
Q(2,'medium',true,'Lec 5.2','Prolyl and lysyl hydroxylases require O2, Fe, and _______ to keep the iron reduced.',
'ascorbate (vitamin C)|Deficiency causes scurvy with unstable under-hydroxylated collagen.',
'tetrahydrobiopterin|BH4 serves aromatic amino acid hydroxylases.',
'pyridoxal phosphate|PLP serves decarboxylases and transaminases.',
'S-adenosylmethionine|SAM donates methyl groups.');
Q(2,'medium',true,'Lec 5.2','Lysyl oxidase, a copper enzyme, strengthens collagen by:',
'oxidizing lysine side-chain amines to aldehydes that cross-link fibrils|Allysine condenses with another lysine amine.',
'hydroxylating proline for interchain hydrogen bonding|That is prolyl hydroxylase.',
'cleaving the terminal propeptides outside the cell|That is procollagen peptidase.',
'attaching galactose to hydroxylysine|That is glycosylation.');
Q(2,'medium',true,'Lec 5.2','The staggered arrangement of collagen fibrils improves _______ because a flaw cannot propagate along aligned molecular ends.',
'fracture toughness|Staggering interrupts crack propagation.',
'brittleness|Brittleness is the opposite property.',
'osmotic pressure|Unrelated to fiber packing.',
'hydroxylation rate|Hydroxylation is chemical, not architectural.');
Q(2,'medium',true,'Lec 5.2','Stretched elastin recoils when released mainly because its hydrophobic side chains:',

'form disulfide bonds that shorten the chains|Disulfides are characteristic of keratin.',
'carry negative charges that attract Na+|That is GAG behavior.',
'are hydroxylated by prolyl hydroxylase|That is collagen processing.');

Q(3,'hard',true,'Lec 5.2','Osteogenesis imperfecta Type II differs from Type I in that Type II:',

'lysyl oxidase|That enzyme cross-links, it does not degrade.',

'elastin cross-links|Not the defect in Marfan.',
'keratin disulfides|Unrelated.');

'alpha-1 antitrypsin deficiency|Lung elastin destruction.',
'scurvy|Nutritional; not inherited.');

Q(4,'medium',true,'Lec 6.1','Mannose is the _______ epimer of glucose.',
'C2|Differs only at carbon 2.',
'C4|That is galactose.',
'C3|Not a common dietary epimer.',
'C5|C5 determines D/L.');

'anomers|Differ only at the anomeric carbon after ring closure.',

Q(5,'medium',true,'Lec 6.2','Lactose intolerance causes osmotic diarrhea because unhydrolyzed lactose:',
'cannot be absorbed and retains water in the intestinal lumen|Only monosaccharides cross enterocytes.',

Q(0,'easy',true,'Lec 4.1','Adult hemoglobin A (HbA) is composed of which chains?',

let hist={};try{hist=JSON.parse(localStorage.getItem('quiz_missed_history')||'{}')}catch(e){}
const saveH=()=>{try{localStorage.setItem('quiz_missed_history',JSON.stringify(hist))}catch(e){}};
let sel=new Set(SUBJECTS.map((_,i)=>i)),prio=false,qs=[],ans=[],cur=0,score=0,tmo=null,mode='single',muted=false;
try{muted=localStorage.getItem('stfuErijah')==='1'}catch(e){}
try{mode=localStorage.getItem('quizViewMode')||'single'}catch(e){}
const $=i=>document.getElementById(i);
const L=i=>String.fromCharCode(65+i);
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function updBtns(){const m=$('modeBtn');m.textContent=mode==='all'?'View: All at Once':'View: One by One';m.classList.toggle('active',mode==='all');
const b=$('stfuBtn');b.textContent=muted?'Bring Back Erijah':'STFU Erijah';b.classList.toggle('active',muted);
if(muted){const a=$('wrongAudio');if(a){a.pause();a.currentTime=0}clearTimeout(tmo);$('wrongPopup').classList.add('hidden')}}
function toggleErijah(){muted=!muted;try{localStorage.setItem('stfuErijah',muted?'1':'0')}catch(e){}updBtns()}
function toggleMode(){mode=mode==='all'?'single':'all';try{localStorage.setItem('quizViewMode',mode)}catch(e){}updBtns();qs.length&&ans.length&&cur<qs.length||mode==='all'&&qs.length?draw():renderHome()}
function pool(){let p=questionBank.filter(q=>sel.has(q.subjectIndex));if(prio){const m=p.filter(q=>(hist[q.id]||0)>0);if(m.length)return m}return p}
function renderHome(){qs=[];updBtns();$('pp').innerHTML='Q: <span>0/0</span>';$('sp').innerHTML='Score: <span>0/0 (0%)</span>';$('pf').style.width='0';
const missed=Object.keys(hist).filter(k=>hist[k]>0).length,p=pool();
$('main').innerHTML=`<div class="dash"><div class="dt">Biochemistry Midterm 2 Preparation Hub</div>
<div class="lab">Select Topics</div><div class="chips">${SUBJECTS.map((s,i)=>`<div class="chip ${sel.has(i)?'active':''}" onclick="togSub(${i})">[${s.week}] ${s.title} (${questionBank.filter(q=>q.subjectIndex===i).length})</div>`).join('')}</div>
<div class="row"><button class="btn" onclick="selAll(true)">Select All</button><button class="btn" onclick="selAll(false)">Clear</button>
<button class="btn ${prio?'active':''}" onclick="prio=!prio;renderHome()">Prioritize Missed (${missed})</button>
<button class="btn ${mode==='all'?'active':''}" onclick="toggleMode();renderHome()">${mode==='all'?'Mode: All at Once':'Mode: One by One'}</button></div>
<div class="lab" style="color:var(--or)">${p.length} questions available across ${sel.size} topics selected</div>
<div class="grid"><button class="lb" onclick="start(15)">Quickie (15 Qs)</button><button class="lb" onclick="start(25)">Standard (25 Qs)</button><button class="lb" onclick="start(35)">Midterm Target (35 Qs)</button><button class="lb" onclick="start(9999)">Entire Bank (${p.length} Qs)</button></div></div>`}
function togSub(i){sel.has(i)?sel.delete(i):sel.add(i);renderHome()}
function selAll(a){sel=a?new Set(SUBJECTS.map((_,i)=>i)):new Set();renderHome()}
function start(n){const p=pool();if(!p.length){alert('Please select at least one topic.');return}
qs=shuffle(p).slice(0,n).map(q=>({...q,options:shuffle(q.options)}));ans=qs.map(()=>null);cur=0;score=0;draw()}
function draw(){mode==='all'?drawAll():drawOne()}
function cardHTML(q,i){const a=ans[i],s=SUBJECTS[q.subjectIndex];
const o=q.options.map((x,j)=>{let c='opt';if(a!==null){c+=' lk';if(x.correct)c+=' rc';c+=a===j?(x.correct?' sc2':' sw'):' dim'}
return `<div class="${c}" ${a===null?`onclick="pick(${i},${j})"`:''}><span class="l">${L(j)}.</span><span>${x.text}</span></div>`}).join('');
let f='';if(a!==null){const ok=q.options[a].correct;f=`<div class="fb"><div class="${ok?'ok':'no'}">${ok?'✓ Correct!':'✗ Incorrect.'}</div><div class="ref">Reference: [${s.week}], ${q.slideRef}</div>${q.options.map((x,j)=>`<div class="ri ${x.correct?'c':''}"><strong>${L(j)}:</strong> ${x.why}</div>`).join('')}</div>`}
return `<div class="qc" id="card-${i}"><div class="bdg"><span class="b n">Q${i+1}</span><span class="b s">[${s.week}] ${s.title}</span><span class="b ${q.difficulty}">${q.difficulty}</span>${q.priority?'<span class="b p">High Yield</span>':''}<span class="b">${q.slideRef}</span></div><div class="stem">${q.stem}</div>${o}${f}`}
function stats(label){const n=ans.filter(x=>x!==null).length;$('pp').innerHTML=label;$('sp').innerHTML=`Score: <span>${score}/${n} (${n?Math.round(score/n*100):0}%)</span>`;$('pf').style.width=(n/qs.length*100)+'%'}
function drawOne(){if(cur>=qs.length){return scoreCard()}stats(`Question: <span>${cur+1} of ${qs.length}</span>`);
const a=ans[cur]!==null;$('main').innerHTML=cardHTML(qs[cur],cur)+(a?`<div style="text-align:right;margin-top:12px"><button class="btn active" onclick="cur++;drawOne()">${cur===qs.length-1?'Finish Exam':'Next Question'}</button></div>`:'')+'</div>'}
function drawAll(){const y=window.scrollY,n=ans.filter(x=>x!==null).length;stats(`Answered: <span>${n} of ${qs.length}</span>`);
$('main').innerHTML=qs.map((q,i)=>cardHTML(q,i)+'</div>').join('')+(n===qs.length?'<div style="text-align:center;margin:28px"><button class="btn active" onclick="scoreCard()">View Final Results Summary</button></div>':'');window.scrollTo(0,y)}
function pick(i,j){if(ans[i]!==null)return;const q=qs[i];ans[i]=j;
if(q.options[j].correct){score++;if(hist[q.id])hist[q.id]=Math.max(0,hist[q.id]-1)}else{hist[q.id]=(hist[q.id]||0)+1;wrong()}saveH();draw()}
function wrong(){if(muted)return;const a=$('wrongAudio');try{a.currentTime=0;a.play().catch(()=>{})}catch(e){}const p=$('wrongPopup');p.classList.remove('hidden');clearTimeout(tmo);tmo=setTimeout(()=>p.classList.add('hidden'),1200)}
function scoreCard(){const t=qs.length,pc=Math.round(score/t*100),bd={};
qs.forEach((q,i)=>{const b=bd[q.subjectIndex]||(bd[q.subjectIndex]={t:0,c:0});b.t++;if(ans[i]!==null&&q.options[ans[i]].correct)b.c++});
$('main').innerHTML=`<div class="sc"><div class="dt">Exam Complete!</div><div class="sn">${score} / ${t}</div><div style="color:${pc>=75?'#4ade80':'#ef4444'};font-weight:700">${pc}% &middot; ${pc>=75?'Passing (Board Ready)':'Needs Remediation'}</div>
<div class="bk"><div style="color:var(--or);font-weight:800">Subject Performance:</div>${Object.keys(bd).map(k=>`<div><strong>[${SUBJECTS[k].week}] ${SUBJECTS[k].title}:</strong> ${bd[k].c}/${bd[k].t} (${Math.round(bd[k].c/bd[k].t*100)}%)</div>`).join('')}</div>
<button class="btn active" onclick="renderHome()">Return to Topic Dashboard</button></div>`}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',renderHome)}else{renderHome()}
</script></body></html>
