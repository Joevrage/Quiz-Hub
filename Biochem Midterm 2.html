<script>
const SUBJECTS=[
{title:"Hemoglobin Structure & O2 Curves",week:"Wk 4"},
{title:"Hemoglobinopathies & Thalassemia",week:"Wk 4-7"},
{title:"Collagen, Elastin & Keratin",week:"Wk 5-7"},
{title:"Connective Tissue Pathology",week:"Wk 5-7"},
{title:"Monosaccharide Chemistry",week:"Wk 6"},
{title:"Disaccharides, Polysaccharides & GAGs",week:"Wk 6"},
{title:"Core Forces, pKa & Heme Chemistry",week:"Wk 1-5"}];
const questionBank=[];
// Q(subject,difficulty,priority,sourceLabel,stem,...options) ; first option is correct; each option 'text|why'. Correct position is rotated by id so A-D are evenly distributed; the quiz also shuffles at runtime.
function Q(s,d,p,r,stem,...o){const id=questionBank.length;let ops=o.map((x,i)=>{const t=x.split('|');return{text:t[0],correct:i===0,why:t[1]+' ['+r+']'}});const c=ops.shift();ops.splice(id%4,0,c);
questionBank.push({id:id,subjectIndex:s,week:SUBJECTS[s].week,slideRef:r,difficulty:d,priority:p,stem:stem,options:ops})}
// ===== 0 Hemoglobin =====
Q(0,'easy',true,'Lec 4.1','Adult hemoglobin (HbA) is a tetramer of two _______ chains and two _______ chains.',
'alpha; beta|Two alpha-beta dimers pair to make alpha2beta2.',
'alpha; gamma|That is fetal Hb (HbF).',
'beta; gamma|No such adult tetramer.',
'alpha; alpha|Hb needs both chain types to form dimers.');
Q(0,'easy',true,'Lec 7.1','The alpha-globin genes are on chromosome _______ (four alleles), and the beta, gamma, and embryonic genes are on chromosome _______.',
'16; 11|Alpha 16, beta 11. Two parents give 4 alpha and 2 beta alleles.',
'11; 16|Reversed.',
'16; 16|Beta is on 11.',
'11; 11|Alpha is on 16.');
Q(0,'medium',true,'Lec 4.1','Within each alpha-beta dimer, the chains are held together mainly by:',
'hydrophobic interactions between nonpolar domains|Branched and aromatic nonpolar side chains fit together like hand and glove.',
'ionic bridges between Lys/Arg and Asp/Glu|Those act across the gap between dimers.',
'covalent disulfide bonds|Hb has no interchain disulfides.',
'peptide bonds linking the chains|The chains are separate polypeptides.');
Q(0,'medium',true,'Lec 4.1','The two dimers are linked across their gap mainly by _______, which water in the gap would weaken.',
'ionic bridges|Positive Lys/Arg pair with negative Asp/Glu.',
'hydrophobic stacking|That is the intra-dimer force.',
'glycosidic bonds|Those join sugars.',
'peptide bonds|Not inter-subunit.');
Q(0,'easy',false,'Lec 7.1','Which side chain is best suited to the hydrophobic alpha-beta dimer interface?',
'phenylalanine|Planar aromatic rings stack well.',
'lysine|Positively charged.',
'aspartate|Negatively charged.',
'arginine|Positively charged.');
Q(0,'easy',false,'Lec 4.3','The embryonic hemoglobin (Gower) is made by the early _______ because bone marrow does not yet exist.',
'liver|Early erythropoiesis is hepatic.',
'spleen|Not the early source.',
'kidney|Makes erythropoietin only.',
'bone marrow|It has not formed yet.');
Q(0,'medium',true,'Lec 4.1','Heme iron is held by four porphyrin nitrogens plus the _______ histidine; O2 binds at the sixth site, where the distal histidine is displaced.',
'proximal|It stays coordinated to Fe2+.',
'distal|That is the one O2 pushes aside.',
'terminal valine|Not a heme ligand.',
'cysteine|Not a heme ligand in Hb.');
Q(0,'medium',true,'Lec 7.1','Hemoglobin and myoglobin can carry O2 only if the iron stays _______, whereas cytochromes cycle between oxidation states.',
'Fe2+ (ferrous)|Oxidized Fe3+ binds tightly and cannot carry O2; the spleen removes such Hb.',
'Fe3+ (ferric)|Cannot carry O2.',
'Cu2+|Heme contains iron.',
'Zn2+|Not heme.');
Q(0,'medium',true,'Lec 4.4','The sigmoidal O2 curve of hemoglobin reflects:'.replace('4.4','4.1'),
'cooperativity: each O2 bound makes the next one easier to add|Binding loosens the taut structure.',
'independent binding at four identical sites|That would give a hyperbola.',
'one high-affinity site per tetramer|Hb has four heme sites.',
'covalent attachment of O2 to globin|O2 binds the iron weakly.');
Q(0,'hard',true,'Lec 4.2','On the curve, a tissue lowers local PO2 from 30 to 20 mmHg. Hb in the steep range responds by:',
'releasing roughly twice as much O2|Reading the curve, about 35% released becomes about 70%.',
'releasing almost no additional O2|That describes the flat plateau near 80-100 mmHg.',
'binding more O2|Lower PO2 favors release.',
'releasing every O2 completely|Saturation is still well above zero.');
Q(0,'medium',true,'Lec 4.2','Venous blood at about 75% saturation means that on average Hb has released _______ of its four O2.',
'one|75% means three of four sites remain loaded.',
'two|That is 50% saturation.',
'three|That is 25% saturation.',
'none|That is about 100% saturation.');
Q(0,'hard',true,'Lec 7.1','The variable that decides whether Hb loads or unloads O2 in a capillary bed is _______; 2,3-BPG only stabilizes the structure that responds.',
'the local partial pressure of O2|It reflects tissue demand, which is the lever on the x-axis.',
'the concentration of 2,3-BPG|BPG is always present and holds the structure steady.',
'nerve signals to the red cell|Communication is chemical, not neural.',
'the number of dimers|Not the controlling variable.');
Q(0,'medium',true,'Lec 7.1','2,3-BPG binds in the central cavity between the two dimers and:',
'stabilizes the taut structure through ionic bonds with Lys/Arg, so O2 can be released on demand|Without it the curve sits far left and O2 is not given up.',
'binds the heme iron and displaces O2|It binds the cavity, not iron.',
'is made in the mitochondria|RBCs have none.',
'oxidizes Fe2+ to Fe3+|It does not change iron state.');
Q(0,'medium',true,'Lec 4.2','Red cells make 2,3-BPG from an intermediate of _______, since they lack mitochondria and a nucleus.',
'glycolysis|From the 3-phosphoglycerate / 2-phosphoglycerate step.',
'the TCA cycle|Needs mitochondria.',
'the urea cycle|Liver pathway.',
'beta oxidation|Needs mitochondria.');
Q(0,'medium',true,'Lec 7.1','A rising lactic acid level in an exercising muscle shifts the Hb curve to the right because:',
'protonated His adds positive charge that tightens 2,3-BPG and ionic bridge binding, favoring O2 release|Bohr effect: stronger taut structure.',
'protonated His weakens 2,3-BPG binding so O2 is retained|Direction is inverted.',
'lactate oxidizes heme iron|Not the mechanism.',
'acid separates the dimers|The structure is only tightened, not pulled apart.');
Q(0,'hard',true,'Lec 4.2','Stored transfusion blood is depleted of 2,3-BPG. Its curve shifts _______, so it binds O2 tightly and gives up little.',
'left|Without BPG the relaxed-like structure dominates.',
'right|Right shift needs BPG, acid, or CO2.',
'down only|BPG loss does not lower capacity.',
'not at all|BPG is needed for the normal structure.');
Q(0,'hard',true,'Lec 7.1','Fetal Hb binds O2 more tightly than adult Hb because it has fewer _______ in the central cavity, so 2,3-BPG binds it more weakly.',
'Lys and Arg residues|Less positive charge means a weaker ionic bridge to BPG, so the curve sits left.',
'Glu and Asp residues|BPG needs positive partners.',
'His residues|His is irrelevant at pH 7.4.',
'heme groups|Each chain still has one heme.');
Q(0,'medium',true,'Lec 4.2','Carbon monoxide is dangerous mainly because it:',
'binds heme iron far more tightly than O2 and stabilizes the relaxed structure, so remaining O2 is not unloaded|Back-bonding makes it nearly irreversible.',
'oxidizes Fe2+ to Fe3+|That is methemoglobin formation.',
'displaces 2,3-BPG|It acts at iron.',
'denatures globin chains|Not its action.');
Q(0,'medium',false,'Lec 4.2','Myoglobin has a much _______ P50 than hemoglobin, so it releases O2 only at very low PO2.',
'lower|It holds O2 as a muscle reserve.',
'higher|It would unload too early.',
'equal|They differ greatly.',
'negative|Not possible.');
Q(0,'easy',false,'Lec 4.2','A pulse oximeter reports:',
'the percent of Hb binding sites carrying O2|Normally in the high 90s.',
'the PO2 of tissue fluid|Not measured.',
'the 2,3-BPG level|Not measured.',
'the red cell count|Not measured.');
Q(0,'medium',false,'Lec 7.1','At pH 7.4, His (pKa about 6) adds little to the inter-dimer ionic bridges because it:',
'is mostly uncharged until the pH drops|It becomes positive in acidic tissue.',
'is permanently negative|That is Asp/Glu.',
'is hydrophobic|It is polar and ionizable.',
'forms disulfide bonds|That is Cys.');
// ===== 1 Hemoglobinopathies =====
Q(1,'easy',true,'Lec 4.3','Sickle cell is caused by a point mutation that puts _______ in place of _______ at position 6 of the beta chain.',
'valine; glutamate|A nonpolar branched residue replaces a negative one.',
'glutamate; valine|Reversed.',
'glycine; glutamate|Not the mutation.',
'valine; lysine|Not the mutation.');
Q(1,'medium',true,'Lec 4.3','In normal HbA, deoxygenated Hb does not aggregate because Glu (pKa about 4) is _______ at pH 7.4, so the chains repel.',
'negatively charged|Same-charge repulsion.',
'positively charged|Glu is acidic.',
'neutral and hydrophobic|It is ionized.',
'bonded by disulfides|It has no sulfur.');
Q(1,'medium',true,'Lec 4.3','Deoxygenated HbS aggregates because Val side chains:',
'interdigitate hydrophobically with Val on neighboring beta chains|Branched nonpolar groups interlock and stack.',
'form ionic bridges with Lys and Arg|Val is uncharged.',
'repel each other by charge|That is Glu-Glu behavior.',
'hydrogen bond with water|Val is hydrophobic.');
Q(1,'hard',true,'Lec 7.1','Sickling occurs when Hb is _______; fully oxygenated HbS does not polymerize, even in sickle disease.',
'deoxygenated|The taut structure exposes the Val.',
'oxygenated|The relaxed structure hides it.',
'bound to CO|CO locks the relaxed form.',
'in alkaline blood|Alkalinity favors the relaxed form.');
Q(1,'hard',true,'Lec 7.1','The change in red cell shape in sickle cell disease is caused directly by:',
'aggregation of deoxygenated HbS through Val-Val contacts|Carrying the allele alone does nothing without this.',
'the gene mutation itself, independent of Hb structure|Expression and structure matter.',
'a deficiency of beta chains|That is thalassemia.',
'oxidation of heme iron|Not the cause.');
Q(1,'medium',true,'Lec 4.3','Sickle cell trait differs from disease in that the trait is _______ and disease is _______.',
'heterozygous; homozygous|One or both chromosome 11 alleles carry Val.',
'homozygous; heterozygous|Reversed.',
'alpha-chain defect; beta-chain defect|Both involve beta.',
'acquired; inherited|Both are inherited.');
Q(1,'medium',true,'Lec 4.3','In the trait, sickling is much milder because:',
'Glu-containing chains disrupt Val stacking, so aggregates are small|Only some chains carry Val.',
'all chains are replaced by HbF|Not the reason.',
'Val is not exposed in any state|It is exposed when deoxygenated.',
'the spleen is overactive|Not the reason.');
Q(1,'medium',true,'Lec 4.3','Sickle trait persists in populations because shortened red cell lifespan:',
'limits Plasmodium maturation inside the cell, reducing severe malaria|The parasite needs time in the RBC.',
'raises 2,3-BPG, which kills parasites|BPG is not antimicrobial.',
'increases HbF, blocking entry|Not the mechanism.',
'stops the spleen from clearing infected cells|Not protective.');
Q(1,'medium',false,'Lec 4.3','Rigid sickled red cells are cleared mainly by the _______, which tests deformability.',
'spleen|Cells that cannot squeeze through are phagocytosed.',
'kidney|Not the main site.',
'lungs|Gas exchange only.',
'bone marrow|It produces cells.');
Q(1,'medium',true,'Lec 7.1','Thalassemia is best described as:',
'too few functional globin chains, so alpha and beta cannot pair evenly|A numbers game of underproduction.',
'a Glu-to-Val substitution|That is sickle cell.',
'a defect in heme synthesis|That is porphyria.',
'a collagen disorder|Unrelated.');
Q(1,'hard',true,'Lec 4.3','Beta-thalassemia becomes apparent after birth rather than in utero because the fetus uses _______, which contains no beta chains.',
'HbF (alpha2gamma2)|Beta chains replace gamma around birth.',
'HbA (alpha2beta2)|That is the adult form.',
'HbS|Not the fetal form.',
'myoglobin|Not a blood Hb.');
Q(1,'medium',true,'Lec 4.3','With four alpha alleles, loss of one means about _______ of alpha chains made are faulty and the person is usually mildly affected.',
'one quarter|Three good alleles still supply the rest.',
'one half|That is one of two beta alleles.',
'all|Three alleles are normal.',
'none|A bad allele is still transcribed and wastes resources.');
Q(1,'medium',true,'Lec 7.1','A child with severe beta-thalassemia needing repeated transfusions is at risk of:',
'iron overload in the liver (hemosiderosis)|Iron accumulates from transfused cells.',
'vitamin C deficiency|Unrelated.',
'copper toxicity|Unrelated.',
'hyperoxia|Unrelated.');
Q(1,'medium',true,'Lec 4.3','G6PD deficiency causes hemolysis because red cells cannot make enough _______ to defend against oxidative damage.',
'NADPH|From the hexose monophosphate pathway.',
'ATP|Glycolysis still works.',
'2,3-BPG|Not the defect.',
'heme|Not the defect.');
// ===== 2 Fibrous proteins =====
Q(2,'easy',true,'Lec 4.3','About one third of collagen residues are glycine because:',
'its tiny hydrogen side chain lets the three chains braid tightly enough for hydrogen bonding|Bulky residues block close packing.',
'its charge forms ionic bridges|Glycine is uncharged.',
'its thiol forms disulfides|That is cysteine.',
'its ring kinks the helix|That is proline.');
Q(2,'medium',true,'Lec 7.2','Glycine is the only protein amino acid with no L or D form because its alpha carbon:',
'carries two hydrogens, so it is not a chiral center|A chiral center needs four different groups.',
'carries a charged side chain|It is uncharged.',
'is missing|It has an alpha carbon.',
'forms a ring|That is proline.');
Q(2,'medium',true,'Lec 5.2','Prolyl and lysyl hydroxylases are post-translational enzymes that require O2, iron, and _______.',
'vitamin C (ascorbate)|It keeps iron reduced.',
'vitamin B6|Decarboxylase cofactor.',
'copper|That serves lysyl oxidase.',
'biotin|Carboxylase cofactor.');
Q(2,'medium',true,'Lec 5.2','Hydroxyproline stabilizes the collagen triple helix by:',
'adding hydroxyl groups for hydrogen bonding with peptide carbonyls|Dipole and hydrogen bonds hold the braid.',
'forming aldehydes for cross-links|Those come from lysine.',
'carrying sugars|Those attach to hydroxylysine.',
'cleaving propeptides|Peptidases do that.');
Q(2,'medium',false,'Lec 5.2','Hydroxylysine is glycosylated with galactose or glucose to:',
'provide a handle to grip chains while braiding them|An assembly aid.',
'form interchain disulfides|No sulfur.',
'make the aldehyde for cross-links|Lysyl oxidase does that.',
'raise pKa|Not the purpose.');
Q(2,'medium',true,'Lec 5.2','Lysyl oxidase, a _______ enzyme, cross-links collagen by oxidizing lysine to an aldehyde that reacts with a neighboring lysine.',
'copper-dependent|Distinct from the iron/vit C hydroxylases.',
'iron-dependent|That is the hydroxylases.',
'zinc-dependent|Not its cofactor.',
'magnesium-dependent|Not its cofactor.');
Q(2,'medium',true,'Lec 5.2','Collagen fibrils are staggered like a brick wall to improve:',
'fracture toughness, since a flaw cannot run through aligned ends|Cracks are interrupted.',
'brittleness|Opposite effect.',
'hydroxylation rate|Chemistry, not architecture.',
'water solubility|Not the purpose.');
Q(2,'medium',true,'Lec 7.2','Fracture toughness is the ability to:',
'absorb repeated load by yielding in small spots without breaking apart|Bone and staggered collagen show this.',
'resist all deformation|That is stiffness.',
'stretch and recoil|That is elasticity.',
'form cross-links|A mechanism, not the property.');
Q(2,'medium',true,'Lec 5.1','The collagen that forms the open mesh network of the basement membrane is type _______.',
'IV|A network former.',
'I|Tendon and bone.',
'II|Cartilage.',
'III|Vessels and reticular tissue.');
Q(2,'easy',true,'Lec 5.1','Cartilage is made mainly of type _______ collagen.',
'II|By chondrocytes.',
'I|Tendon and bone.',
'IV|Basement membrane.',
'VII|Anchoring fibrils.');
Q(2,'medium',false,'Lec 5.1','Type VII collagen acts like needle and thread, stitching:',
'type IV basement membrane to type I and III collagen beneath it|Anchoring fibrils.',
'keratin to elastin|Not its role.',
'cartilage to bone mineral|Not its role.',
'hemoglobin dimers|Unrelated.');
Q(2,'medium',false,'Lec 5.2','Types IX and XII are fibril-associated collagens that:',
'bridge fibrils to each other and to the matrix, joining dissimilar tissues|Relevant to avulsions.',
'make up the basement membrane|That is type IV.',
'make up most of bone|That is type I.',
'cross-link elastin|Not their role.');
Q(2,'medium',true,'Lec 7.2','Stretched elastin recoils because its _______ side chains prefer to re-associate with each other rather than water.',
'hydrophobic|Desmosine cross-links hold the network.',
'charged|Not elastin-rich.',
'sulfur-containing|That is keratin.',
'hydroxylated|That is collagen.');
Q(2,'medium',false,'Lec 7.2','Elastin cross-links called desmosines form from _______ side chains oxidized by lysyl oxidase.',
'lysine|The same chemistry as collagen cross-links.',
'proline|Not the source.',
'cysteine|Gives disulfides.',
'glycine|Not the source.');
Q(2,'easy',true,'Lec 7.2','Keratin is strengthened by disulfide bonds from its high _______ content, which also binds metals such as lead and mercury.',
'cysteine|Sulfhydryl groups.',
'glycine|Collagen feature.',
'proline|Collagen feature.',
'lysine|Elastin and collagen cross-links.');
// ===== 3 Pathology =====
Q(3,'easy',true,'Lec 7.2','Loose teeth and easy bruising point to vitamin C deficiency (scurvy) because it weakens:',
'collagen, since Pro and Lys are not hydroxylated|The periodontal ligament is collagen.',
'keratin|Not the cause.',
'elastin cross-links|Not the cause.',
'hemoglobin|Not the cause.');
Q(3,'easy',true,'Lec 7.2','Hyperextensible fingers and stretchy skin suggest _______.',
'Ehlers-Danlos syndrome|Collagen laxity; caution with spinal adjustments.',
'osteogenesis imperfecta|Bone fragility.',
'Marfan syndrome|Long limbs, lens, aorta.',
'scurvy|Nutritional deficiency.');

'collagen defects, such as bulky residues replacing glycine, prevent tight braiding, and it presents in utero|Type I (tarda) is survivable.',

'fibrillin is missing|That is Marfan.',
'elastase is overactive|That is emphysema.');
Q(3,'medium',true,'Lec 7.2','Which is a feature of OI Type I (tarda)?',
'fractures from minor trauma, with survival into infancy and beyond|Reduced alpha1 and alpha2 chain production.',
'death in utero from pulmonary hypoplasia|That is Type II.',
'lens dislocation and aortic root dilation|That is Marfan.',
'joint hypermobility only|That is Ehlers-Danlos.');

'neither collagen, elastin, nor keratin|A distinct connective tissue matrix protein.',
'a collagen type|Not collagen.',
'a form of elastin|Not elastin.',
'a keratin|Not keratin.');

'lysyl oxidase, which over-cross-links lung tissue|Not the mechanism.',

Q(3,'hard',false,'Lec 5.2','Hunting for the cause of a poorly performing connective tissue, a clinician should remember that collagen, elastin, and keratin are different proteins. Which pairing is correct?',
'scurvy affects collagen, and emphysema from AAT loss affects elastin|Match the protein to the disease.',
'scurvy affects elastin, and emphysema affects collagen|Swapped.',
'Marfan affects keratin, and OI affects fibrillin|Both swapped.',
'Ehlers-Danlos affects hemoglobin, and sickle cell affects collagen|Unrelated.');
// ===== 4 Monosaccharides =====
Q(4,'medium',true,'Lec 6.1','Mannose is the _______ epimer of glucose, and galactose is the _______ epimer.',
'C2; C4|One chiral carbon differs in each.',
'C4; C2|Reversed.',
'C1; C6|C1 is the anomeric carbon and C6 is not chiral.',
'C3; C5|Not the common ones.');
Q(4,'medium',true,'Lec 6.1','Alpha and beta D-glucopyranose differ at the _______ carbon created when the ring closes.',

Q(4,'easy',true,'Lec 6.1','Carbohydrates contribute to antigenicity mainly because:',

Q(5,'medium',true,'Lec 6.2','Ruminants live on cellulose because gut bacteria release beta-D-glucose, which the liver converts to alpha-D-glucose by:',

Q(5,'medium',true,'Lec 6.2','Glycosaminoglycans are built from a repeating disaccharide of an amine sugar and an _______ sugar.',

Q(5,'easy',false,'Lec 6.2','GAGs give gel-like cushioning in the _______.',

Q(5,'easy',false,'Lec 6.1','Which cell has an absolute requirement for glucose?',
'red blood cell|Glycolysis is its only ATP source.',

// ---------------- state & UI ----------------
let hist={};try{hist=JSON.parse(localStorage.getItem('quiz_missed_history')||'{}')}catch(e){}
const saveH=()=>{try{localStorage.setItem('quiz_missed_history',JSON.stringify(hist))}catch(e){}};
let sel=new Set(SUBJECTS.map((_,i)=>i)),prio=false,qs=[],ans=[],cur=0,score=0,tmo=null,mode='single',muted=false;
try{muted=localStorage.getItem('stfuErijah')==='1'}catch(e){}
try{mode=localStorage.getItem('quizViewMode')||'single'}catch(e){}
const $=i=>document.getElementById(i);
const L=i=>String.fromCharCode(65+i);
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function updBtns(){const m=$('modeBtn');m.textContent=mode==='all'?'View: All at Once':'View: One by One';m.classList.toggle('active',mode==='all');
const b=$('stfuBtn');b.textContent=muted?'Bring Back Erijah':'STFU Erijah';b.classList.toggle('active',muted);
if(muted){const a=$('wrongAudio');if(a){a.pause();a.currentTime=0}clearTimeout(tmo);$('wrongPopup').classList.add('hidden')}}
function toggleErijah(){muted=!muted;try{localStorage.setItem('stfuErijah',muted?'1':'0')}catch(e){}updBtns()}
function toggleMode(){mode=mode==='all'?'single':'all';try{localStorage.setItem('quizViewMode',mode)}catch(e){}updBtns();if(qs.length)draw();else renderHome()}
function pool(){let p=questionBank.filter(q=>sel.has(q.subjectIndex));if(prio){const m=p.filter(q=>(hist[q.id]||0)>0);if(m.length)return m}return p}
function renderHome(){qs=[];updBtns();$('pp').innerHTML='Q: <span>0/0</span>';$('sp').innerHTML='Score: <span>0/0 (0%)</span>';$('pf').style.width='0';
const missed=Object.keys(hist).filter(k=>hist[k]>0).length,p=pool();
$('main').innerHTML=`<div class="dash"><div class="dt">Biochemistry Midterm 2 Preparation Hub</div>
<div class="lab">Select Topics</div><div class="chips">${SUBJECTS.map((s,i)=>`<div class="chip ${sel.has(i)?'active':''}" onclick="togSub(${i})">[${s.week}] ${s.title} (${questionBank.filter(q=>q.subjectIndex===i).length})</div>`).join('')}</div>
<div class="row"><button class="btn" onclick="selAll(true)">Select All</button><button class="btn" onclick="selAll(false)">Clear</button>
<button class="btn ${prio?'active':''}" onclick="prio=!prio;renderHome()">Prioritize Missed (${missed})</button></div>
<div class="lab" style="color:var(--or)">${p.length} questions available across ${sel.size} topics selected</div>
<div class="grid"><button class="lb" onclick="start(15)">Quickie (15 Qs)</button><button class="lb" onclick="start(25)">Standard (25 Qs)</button><button class="lb" onclick="start(35)">Exam Target (35 Qs)</button><button class="lb" onclick="start(9999)">Entire Bank (${p.length} Qs)</button></div></div>`}
function togSub(i){sel.has(i)?sel.delete(i):sel.add(i);renderHome()}
function selAll(a){sel=a?new Set(SUBJECTS.map((_,i)=>i)):new Set();renderHome()}
function start(n){const p=pool();if(!p.length){alert('Please select at least one topic.');return}
qs=shuffle(p).slice(0,n).map(q=>({...q,options:shuffle(q.options)}));ans=qs.map(()=>null);cur=0;score=0;draw()}
function draw(){mode==='all'?drawAll():drawOne()}
function cardHTML(q,i){const a=ans[i],s=SUBJECTS[q.subjectIndex];
const o=q.options.map((x,j)=>{let c='opt';if(a!==null){c+=' lk';if(x.correct)c+=' rc';c+=a===j?(x.correct?' sc2':' sw'):' dim'}
return `<div class="${c}" ${a===null?`onclick="pick(${i},${j})"`:''}><span class="l">${L(j)}.</span><span>${x.text}</span></div>`}).join('');
let f='';if(a!==null){const ok=q.options[a].correct;f=`<div class="fb"><div class="${ok?'ok':'no'}">${ok?'✓ Correct!':'✗ Incorrect.'}</div><div class="ref">Reference: [${s.week}], ${q.slideRef}</div>${q.options.map((x,j)=>`<div class="ri ${x.correct?'c':''}"><strong>${L(j)}:</strong> ${x.why}</div>`).join('')}</div>`}
return `<div class="qc" id="card-${i}"><div class="bdg"><span class="b n">Q${i+1}</span><span class="b s">[${s.week}] ${s.title}</span><span class="b ${q.difficulty}">${q.difficulty}</span>${q.priority?'<span class="b p">High Yield</span>':''}<span class="b">${q.slideRef}</span></div><div class="stem">${q.stem}</div>${o}${f}`}
function stats(label){const n=ans.filter(x=>x!==null).length;$('pp').innerHTML=label;$('sp').innerHTML=`Score: <span>${score}/${n} (${n?Math.round(score/n*100):0}%)</span>`;$('pf').style.width=(n/qs.length*100)+'%'}
function drawOne(){if(cur>=qs.length){return scoreCard()}stats(`Question: <span>${cur+1} of ${qs.length}</span>`);
const a=ans[cur]!==null;$('main').innerHTML=cardHTML(qs[cur],cur)+'</div>'+(a?`<div style="text-align:right;margin-top:12px"><button class="btn active" onclick="cur++;drawOne()">${cur===qs.length-1?'Finish Exam':'Next Question'}</button></div>`:'')}
function drawAll(){const y=window.scrollY,n=ans.filter(x=>x!==null).length;stats(`Answered: <span>${n} of ${qs.length}</span>`);
$('main').innerHTML=qs.map((q,i)=>cardHTML(q,i)+'</div>').join('')+(n===qs.length?'<div style="text-align:center;margin:28px"><button class="btn active" onclick="scoreCard()">View Final Results Summary</button></div>':'');window.scrollTo(0,y)}
function pick(i,j){if(ans[i]!==null)return;const q=qs[i];ans[i]=j;
if(q.options[j].correct){score++;if(hist[q.id])hist[q.id]=Math.max(0,hist[q.id]-1)}else{hist[q.id]=(hist[q.id]||0)+1;wrong()}saveH();draw()}
function wrong(){if(muted)return;const a=$('wrongAudio');try{a.currentTime=0;a.play().catch(()=>{})}catch(e){}const p=$('wrongPopup');p.classList.remove('hidden');clearTimeout(tmo);tmo=setTimeout(()=>p.classList.add('hidden'),1200)}
function scoreCard(){const t=qs.length,pc=Math.round(score/t*100),bd={};
qs.forEach((q,i)=>{const b=bd[q.subjectIndex]||(bd[q.subjectIndex]={t:0,c:0});b.t++;if(ans[i]!==null&&q.options[ans[i]].correct)b.c++});
$('main').innerHTML=`<div class="sc"><div class="dt">Exam Complete!</div><div class="sn">${score} / ${t}</div><div style="color:${pc>=75?'#4ade80':'#ef4444'};font-weight:700">${pc}% &middot; ${pc>=75?'Passing (Board Ready)':'Needs Remediation'}</div>
<div class="bk"><div style="color:var(--or);font-weight:800">Subject Performance:</div>${Object.keys(bd).map(k=>`<div><strong>[${SUBJECTS[k].week}] ${SUBJECTS[k].title}:</strong> ${bd[k].c}/${bd[k].t} (${Math.round(bd[k].c/bd[k].t*100)}%)</div>`).join('')}</div>
<button class="btn active" onclick="renderHome()">Return to Topic Dashboard</button></div>`}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',renderHome)}else{renderHome()}
</script></body></html>
