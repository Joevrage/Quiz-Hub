<script>
const SUBJECTS = [
  { week: "Wk 4-7", title: "Hemoglobin & Oxygen Transport" },
  { week: "Wk 4-7", title: "Hemoglobinopathies & Red Cell Pathology" },
  { week: "Wk 5-7", title: "Fibrous Proteins & Connective Tissue" },
  { week: "Wk 6-8", title: "Carbohydrates & Glycosaminoglycans" },
  { week: "Wk 7-8", title: "Lipids, Eicosanoids & Lipoproteins" }
];

const questionBank = [];
function addQ(s, d, p, r, st, ...opts) {
  const id = questionBank.length;
  const formatted = opts.map((item, idx) => {
    const parts = item.split('|');
    return { text: parts[0], correct: idx === 0, why: parts[1] + ' [' + r + ']' };
  });
  const ans = formatted.shift();
  formatted.splice(id % 4, 0, ans);
  questionBank.push({
    id,
    subjectIndex: s,
    week: SUBJECTS[s].week,
    slideRef: r,
    difficulty: d,
    priority: !!p,
    stem: st,
    options: formatted
  });
}

// ===================== SUBJECT 0: HEMOGLOBIN & OXYGEN TRANSPORT =====================
addQ(0, 'easy', 1, 'Lec 4.1',
  'Adult hemoglobin is a quaternary tetramer composed of two _______ chains and two _______ chains.',
  'alpha; beta|Adult hemoglobin (HbA) consists of two alpha-beta dimers forming an alpha2-beta2 tetramer.',
  'alpha; gamma|Two alpha and two gamma chains form fetal hemoglobin (HbF), not adult HbA.',
  'zeta; epsilon|Two zeta and two epsilon chains form embryonic Gower hemoglobin.',
  'beta; gamma|No functional human hemoglobin tetramer consists solely of beta and gamma chains.');

addQ(0, 'easy', 1, 'Lec 7.1',
  'The alpha-globin gene family resides on chromosome _______ and the beta-globin gene family resides on chromosome _______.',
  '16; 11|Humans inherit four alpha-globin alleles on chromosome 16 and two beta-globin alleles on chromosome 11.',
  '11; 16|The chromosome locations are reversed; alpha is on 16 and beta is on 11.',
  '16; 16|Beta-globin family genes are located on chromosome 11 rather than chromosome 16.',
  '11; 11|Alpha-globin family genes are located on chromosome 16 rather than chromosome 11.');

addQ(0, 'easy', 1, 'Lec 4.1',
  'Within a single alpha-beta dimer of hemoglobin, the two subunits are held together primarily by:',
  'hydrophobic interactions|Complementary nonpolar domains exclude water and lock each alpha-beta dimer tightly together.',
  'ionic bridges|Ionic bridges and dipole interactions link one alpha-beta dimer to the opposite dimer across the central gap.',
  'disulfide bonds|Hemoglobin subunits do not rely on inter-chain covalent disulfide bridges.',
  'peptide bonds|Separate alpha and beta polypeptide chains are not joined by covalent peptide bonds.');

addQ(0, 'easy', 1, 'Lec 4.1',
  'Across the interface separating the two alpha-beta dimers, hemoglobin is stabilized mainly by:',
  'ionic bridges|Oppositely charged side chains (Lys/Arg with Asp/Glu) form salt bridges that shift strength during oxygen binding.',
  'hydrophobic stacking|Hydrophobic contacts hold alpha to beta within each individual dimer rather than between dimers.',
  'glycosidic linkages|Glycosidic bonds join carbohydrate monomers and do not link globin subunits.',
  'phosphodiester bonds|Phosphodiester bonds form nucleic acid backbones, not protein quaternary interfaces.');

addQ(0, 'easy', 1, 'Lec 7.1',
  'To reversibly bind and transport oxygen, the iron atom inside each heme group must remain in the _______ oxidation state.',
  'ferrous|Ferrous iron (Fe2+) reversibly binds O2; oxidation to ferric iron (Fe3+) creates methemoglobin, which cannot transport oxygen.',
  'ferric|Ferric iron (Fe3+) binds water or oxygen irreversibly and fails to deliver O2 to tissues.',
  'elemental|Uncharged elemental iron (Fe0) does not coordinate inside the porphyrin ring.',
  'cupric|Copper (Cu2+) is a cofactor for enzymes like lysyl oxidase, not the central metal of heme.');

addQ(0, 'easy', 1, 'Lec 4.1',
  'How many nitrogen atoms coordinate around the central iron ion of a deoxyhemoglobin heme group?',
  'Six|Four planar porphyrin nitrogens plus two axial histidine nitrogens (proximal and distal) form an octahedral coordination complex.',
  'Four|Four nitrogens come from the porphyrin ring alone, omitting the two axial histidine side chains.',
  'Two|Two nitrogens represent only the proximal and distal histidines, ignoring the four pyrrole rings.',
  'Eight|Iron coordinates six ligands in an octahedral geometry, not eight.');

addQ(0, 'medium', 1, 'Lec 4.1',
  'When molecular oxygen binds to heme iron in hemoglobin, which structural event occurs first?',
  'The distal histidine pulls away from its axial coordination site|O2 displaces the distal histidine coordination site, pulling iron into the porphyrin plane and triggering the T-to-R transition.',
  'The proximal histidine detaches completely from the globin helix|The proximal histidine remains covalently tethered to the F-helix and transmits the conformational pull.',
  'The porphyrin ring cleaves open into linear biliverdin|Ring cleavage occurs only during senescent red cell heme catabolism in macrophages.',
  'Iron oxidizes from the +2 state to the +3 state|Reversible oxygenation keeps iron in the ferrous (+2) state.');

addQ(0, 'medium', 1, 'Lec 4.1',
  'The sigmoidal shape of the oxygen-hemoglobin dissociation curve is a direct consequence of:',
  'positive cooperativity|Binding the first O2 disrupts inter-dimer ionic bridges, shifting the tetramer toward the high-affinity relaxed state.',
  'independent non-interacting binding sites|Independent sites produce a hyperbolic curve, as seen in monomeric myoglobin.',
  'irreversible covalent oxygen attachment|Oxygen binds heme iron reversibly via weak coordination, not covalent bonds.',
  'a single oxygen-binding site per tetramer|Each hemoglobin tetramer contains four heme groups and binds up to four O2 molecules.');

addQ(0, 'easy', 1, 'Tutoring Wk 7',
  'The deoxygenated conformation of hemoglobin is designated the _______ state, whereas the oxygenated conformation is the _______ state.',
  'taut; relaxed|Deoxyhemoglobin is stabilized in the low-affinity taut (T) state; O2 binding shifts it to the high-affinity relaxed (R) state.',
  'relaxed; taut|The structural states are reversed; relaxed has high O2 affinity and taut has low O2 affinity.',
  'alpha; beta|Alpha and beta refer to globin subunit types or sugar anomers, not quaternary affinity states.',
  'cis; trans|Cis and trans describe double-bond or peptide geometry, not hemoglobin conformations.');

addQ(0, 'easy', 1, 'Tutoring Wk 7',
  'A decrease in local capillary pH shifts the oxygen-hemoglobin dissociation curve to the _______, which _______ oxygen release to active tissues.',
  'right; increases|Known as the Bohr effect, excess H+ protonates histidine residues to stabilize the taut form and promote O2 unloading.',
  'left; decreases|A left shift occurs at higher pH and increases oxygen affinity, impairing tissue unloading.',
  'right; decreases|Shifting the curve to the right lowers oxygen affinity, thereby increasing rather than decreasing O2 release.',
  'left; increases|A left shift favors oxygen retention rather than unloading.');

addQ(0, 'medium', 1, 'Lec 7.1',
  'Where does 2,3-bisphosphoglycerate bind on hemoglobin, and what is its physiological effect?',
  'In the central cavity between beta chains, stabilizing the taut form|Negatively charged 2,3-BPG binds positively charged Lys and Arg residues in the central cavity, shifting the curve right to promote O2 unloading.',
  'Directly to the ferrous iron atom, blocking oxygen attachment|2,3-BPG is an allosteric effector in the central cavity; carbon monoxide binds directly to heme iron.',
  'To the proximal histidine, oxidizing heme iron to the ferric state|2,3-BPG does not alter iron oxidation state.',
  'To the outer surface of alpha chains, locking the relaxed form|Locking the relaxed form would shift the curve left and prevent oxygen delivery.');

addQ(0, 'easy', 1, 'Tutoring Wk 7',
  'In red blood cells, 2,3-bisphosphoglycerate is synthesized as a side-branch intermediate of which metabolic pathway?',
  'Glycolysis|Because mature erythrocytes lack mitochondria, they generate 2,3-BPG from glycolytic intermediates derived from glucose.',
  'The citric acid cycle|Mature red blood cells have no mitochondria and cannot run the TCA cycle.',
  'Beta-oxidation of fatty acids|Fatty acid oxidation occurs in mitochondria and does not produce 2,3-BPG.',
  'The urea cycle|The urea cycle occurs in hepatocytes to dispose of ammonia.');

addQ(0, 'medium', 1, 'Tutoring Wk 7',
  'Because maternal and fetal blood do not mix across the placenta, how does fetal hemoglobin extract oxygen from maternal hemoglobin?',
  'Fetal hemoglobin has a higher intrinsic oxygen affinity and weaker 2,3-BPG binding|Replacing beta chains with gamma chains reduces positive charges in the central cavity, binding 2,3-BPG less tightly so HbF pulls O2 from maternal HbA.',
  'Fetal capillary blood is kept substantially more acidic than maternal blood|Acidosis shifts the curve right (lower affinity), which would push O2 away from the fetus.',
  'Fetal red blood cells maintain higher 2,3-BPG levels than maternal red blood cells|Elevated maternal 2,3-BPG shifts maternal HbA right to aid transfer; high fetal 2,3-BPG would block uptake.',
  'Fetal hemoglobin contains six heme groups per molecule instead of four|Fetal HbF (alpha2-gamma2) is a standard tetramer with four heme groups.');

addQ(0, 'hard', 1, 'Tutoring Wk 7',
  'Why is carbon monoxide poisoning particularly lethal even at low partial pressures?',
  'It binds heme iron with much higher affinity than oxygen and locks remaining subunits in the relaxed state|CO occupies heme sites irreversibly under physiological conditions and prevents the remaining bound O2 molecules from unloading into tissues.',
  'It rapidly oxidizes all ferrous heme iron into non-functional ferric methemoglobin|Methemoglobinemia is caused by oxidizing agents like nitrites, whereas CO binds Fe2+ directly.',
  'It competes with 2,3-BPG in the central cavity to stabilize the taut conformation|CO binds directly to the heme iron coordination site rather than the central cavity.',
  'It accelerates red blood cell lysis within the splenic sinusoids|CO causes acute cellular hypoxia by blocking oxygen transport and unloading, not acute hemolytic anemia.');

addQ(0, 'easy', 1, 'Outline',
  'How do cytochromes in the electron transport chain differ functionally from hemoglobin and myoglobin?',
  'Cytochrome heme iron cycles reversibly between ferrous and ferric states to transfer electrons|Unlike oxygen carriers that keep iron fixed as Fe2+, cytochromes use the Fe2+/Fe3+ redox couple for electron transport.',
  'Cytochromes lack a porphyrin ring and coordinate copper exclusively|Cytochromes are true heme proteins containing an iron-porphyrin prosthetic group.',
  'Cytochromes bind molecular oxygen cooperatively across four subunits|Cooperativity and four-subunit O2 transport are properties of hemoglobin.',
  'Cytochromes store oxygen in resting skeletal muscle fibers|Oxygen storage in skeletal muscle is the role of monomeric myoglobin.');

addQ(0, 'easy', 0, 'Lec 7.1',
  'Myoglobin exhibits a hyperbolic oxygen dissociation curve rather than a sigmoidal curve because it:',
  'consists of a single polypeptide chain with one heme group|As a tertiary monomer, myoglobin lacks multiple subunits and cannot undergo cooperative allosteric transitions.',
  'contains ferric iron that binds oxygen irreversibly|Myoglobin uses ferrous (Fe2+) iron to bind and release O2 in muscle tissue.',
  'is regulated allosterically by 2,3-bisphosphoglycerate|2,3-BPG binds the central cavity of tetrameric hemoglobin, not monomeric myoglobin.',
  'circulates freely in blood plasma rather than inside cells|Myoglobin is an intracellular muscle protein; its appearance in blood indicates muscle injury.');

addQ(1, 'easy', 1, 'Lec 4.3',

addQ(1, 'medium', 1, 'Lec 4.3',

addQ(1, 'medium', 1, 'Lec 7.1',

  'Vitamin E|Vitamin E (tocopherol) functions as a lipid-phase antioxidant protecting membranes from peroxidation.',
  'Vitamin D|Vitamin D (cholecalciferol/calcitriol) regulates intestinal calcium absorption and bone mineralization.',
  'Vitamin A|Vitamin A (retinol/retinoic acid) supports visual rhodopsin and epithelial cell differentiation.');

addQ(4, 'easy', 1, 'Lec 7.3',
  'Which fat-soluble vitamin functions primarily as a lipid-soluble antioxidant within cell membranes?',
  'Vitamin E|Tocopherol scavenges lipid peroxyl radicals inside the hydrophobic bilayer to terminate free-radical chain reactions.',
  'Vitamin K|Vitamin K is required for hepatic activation of coagulation factors.',
  'Vitamin A|Vitamin A regulates epithelial differentiation and visual phototransduction.',
  'Vitamin D|Vitamin D promotes intestinal calcium uptake.');

addQ(4, 'easy', 1, 'Tutoring Wk 8',
  'Cholesterol is characterized by a four-ring sterol nucleus attached to an _______ functional group and serves as the precursor for _______ and steroid hormones.',
  'alcohol; bile salts|Cholesterol contains a hydroxyl (-OH) group at C3 and is synthesized into steroid hormones (testosterone, estrogen) and bile salts.',
  'aldehyde; glycogen|Glycogen is polymerized from glucose, not cholesterol.',
  'amine; catecholamines|Catecholamines are synthesized from the amino acid tyrosine.',

addQ(4, 'easy', 1, 'Tutoring Wk 8',
  'Bile is synthesized from cholesterol in the _______ and stored/concentrated in the _______ before release into the duodenum.',
  'liver; gallbladder|Hepatocytes synthesize primary bile salts from cholesterol, which are stored in the gallbladder and secreted to emulsify dietary fats.',
  'gallbladder; liver|The gallbladder stores and concentrates bile, while hepatocytes synthesize it.',
  'pancreas; stomach|The pancreas secretes digestive lipases and bicarbonate, not bile salts.',
  'enterocytes; spleen|Enterocytes absorb digested lipids and package chylomicrons.');

addQ(4, 'medium', 1, 'Lec 7.3',
  'How do bile salts secreted into the duodenum facilitate the digestion of dietary triglycerides?',
  'They emulsify large water-insoluble fat globules into tiny droplets to increase surface area for pancreatic lipase|Amphipathic bile salts act like detergents, dispersing hydrophobic fat globs so water-soluble lipases can hydrolyze ester bonds.',
  'They directly hydrolyze ester linkages without requiring pancreatic enzymes|Bile salts have no catalytic activity; they physically emulsify fats so pancreatic lipase can act.',
  'They convert saturated fatty acids into essential omega-3 fatty acids|Bile salts do not alter fatty acid saturation or chain length.',
  'They transport intact triglycerides directly through the portal vein to the liver|Digested monoglycerides and fatty acids are re-esterified in enterocytes and packaged into chylomicrons.');

addQ(4, 'easy', 1, 'Tutoring Wk 8',
  'Which lipoprotein particle is assembled by intestinal enterocytes to transport dietary triglycerides and fat-soluble vitamins into the lymphatic system?',
  'Chylomicron|Chylomicrons are the largest, lowest-density lipoproteins carrying exogenous dietary lipids and essential fatty acids from enterocytes to tissues and the liver.',
  'Very-low-density lipoprotein|VLDL is synthesized by the liver to export endogenous triglycerides.',
  'Low-density lipoprotein|LDL is formed in the circulation from VLDL remnants to deliver cholesterol to peripheral tissues.',
  'High-density lipoprotein|HDL mediates reverse cholesterol transport from peripheral tissues back to the liver.');

addQ(4, 'easy', 1, 'Tutoring Wk 8',
  'Which lipoprotein particle delivers cholesterol from the liver to peripheral tissues, and which particle returns excess peripheral cholesterol back to the liver?',
  'Low-density lipoprotein delivers to tissues; high-density lipoprotein returns to the liver|LDL supplies tissue cholesterol (elevated levels promote atherogenesis), while HDL performs reverse cholesterol transport for liver disposal.',
  'High-density lipoprotein delivers to tissues; low-density lipoprotein returns to the liver|The transport directions are reversed; HDL removes excess cholesterol from tissues.',
  'Chylomicrons deliver to the liver; very-low-density lipoproteins return to enterocytes|VLDL exports endogenous triglycerides from the liver to peripheral tissues.',
  'High-density lipoprotein delivers dietary fats; chylomicrons return reverse cholesterol|Chylomicrons carry exogenous dietary fats from enterocytes.');

addQ(4, 'easy', 0, 'Tutoring Wk 8',
  'Excess dietary calories are stored long-term in adipose tissue primarily in the form of:',
  'triacylglycerols|Adipocytes pack hydrophobic triglycerides into anhydrous lipid droplets yielding ~9 kcal per gram.',
  'glycogen|Glycogen storage is limited (~490 g total in muscle and liver) and binds substantial water.',
  'phospholipids|Phospholipids are structural membrane components rather than bulk energy reserves.',
  'free fatty acids|Unesterified fatty acids are amphipathic detergents that are toxic to membranes in high concentrations.');

// ---------------- UI & STATE ----------------
const $ = i => document.getElementById(i);
const L = i => String.fromCharCode(65 + i);

let H = {};
try { H = JSON.parse(localStorage.getItem('quiz_missed_history') || '{}'); } catch (e) {}
const sv = () => { try { localStorage.setItem('quiz_missed_history', JSON.stringify(H)); } catch (e) {} };

let sel = new Set(SUBJECTS.map((_, i) => i));
let pri = false;
let view = 'one';
let mute = false;
let base = [];
let qs = [];
let an = [];
let cur = 0;
let sc = 0;
let tm = null;
let missed = [];

try {
  view = localStorage.getItem('quizView') || 'one';
  mute = localStorage.getItem('stfuErijah') === '1';
} catch (e) {}

function sh(a) {
  a = [...a];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function syncHeaderButtons() {
  $('vb').textContent = 'View: ' + (view === 'all' ? 'All at Once' : 'One by One');
  $('eb').textContent = mute ? 'Bring Back Erijah' : 'STFU Erijah';
  $('eb').classList.toggle('on', mute);
  if (mute) {
    $('wp').classList.add('h');
    clearTimeout(tm);
    try { $('wa').pause(); $('wa').currentTime = 0; } catch (e) {}
  }
}

function togE() {
  mute = !mute;
  try { localStorage.setItem('stfuErijah', mute ? '1' : '0'); } catch (e) {}
  syncHeaderButtons();
}

function setV(v) {
  view = v;
  try { localStorage.setItem('quizView', v); } catch (e) {}
  syncHeaderButtons();
  if (qs.length > 0 && $('main').querySelector('.qc')) {
    draw();
  } else {
    renderHome();
  }
}

function togView() {
  setV(view === 'all' ? 'one' : 'all');
}

function getPool() {
  const p = questionBank.filter(q => sel.has(q.subjectIndex));
  if (pri) {
    const m = p.filter(q => (H[q.id] || 0) > 0);
    if (m.length > 0) return m;
  }
  return p;
}

function renderHome() {
  qs = [];
  syncHeaderButtons();
  $('pp').innerHTML = 'Q: <b>0/0</b>';
  $('sp').innerHTML = 'Score: <b>0/0 (0%)</b>';
  $('pf').style.width = '0%';

  const p = getPool();
  const ms = Object.keys(H).filter(k => H[k] > 0).length;

  $('main').innerHTML = `
    <div class="card">
      <div class="t">Biochemistry Midterm 2 Preparation Hub</div>
      <div class="dash-sub">Tutor-Prioritized Exam Blueprint &middot; Updated with Week 8 Carbs &amp; Lipids</div>
      
      <div class="lab">1. Select Topics</div>
      <div class="row">
        <div class="chip ${sel.size === SUBJECTS.length ? 'on' : ''}" onclick="sA(true)">All Topics (${questionBank.length})</div>
        ${SUBJECTS.map((s, i) => `
          <div class="chip ${sel.has(i) ? 'on' : ''}" onclick="tS(${i})">
            [${s.week}] ${s.title} (${questionBank.filter(q => q.subjectIndex === i).length})
          </div>
        `).join('')}
      </div>
      
      <div class="row">
        <button class="btn" onclick="sA(true)">Select All</button>
        <button class="btn" onclick="sA(false)">Clear</button>
        <button class="btn ${pri ? 'on' : ''}" onclick="pri=!pri;renderHome()">Prioritize Missed (${ms})</button>
      </div>

      <div class="lab">2. Display Mode</div>
      <div class="row">
        <div class="chip ${view === 'one' ? 'on' : ''}" onclick="setV('one')">One by One (Card View)</div>
        <div class="chip ${view === 'all' ? 'on' : ''}" onclick="setV('all')">All at Once (Continuous List)</div>
      </div>

      <div class="lab" style="color:var(--or)">${p.length} questions available across ${sel.size} topics selected</div>

      <div class="lab">3. Launch Practice Exam</div>
      <div class="launcher-grid">
        <button class="launch-btn" onclick="go(getPool(), 15)">Quickie (15 Qs)</button>
        <button class="launch-btn" onclick="go(getPool(), 25)">Standard (25 Qs)</button>
        <button class="launch-btn" onclick="go(getPool(), 35)">Exam Target (35 Qs)</button>
        <button class="launch-btn" onclick="go(getPool(), 50)">Full Exam (50 Qs)</button>
        <button class="launch-btn primary" onclick="go(getPool(), getPool().length)">All Selected (${p.length} Qs)</button>
      </div>
    </div>
  `;
}

function tS(i) {
  sel.has(i) ? sel.delete(i) : sel.add(i);
  renderHome();
}

function sA(all) {
  sel = all ? new Set(SUBJECTS.map((_, i) => i)) : new Set();
  renderHome();
}

function go(p, limit) {
  if (!p.length) {
    alert('Please select at least one topic before launching the quiz.');
    return;
  }
  const cap = limit ? Math.min(limit, p.length) : p.length;
  base = p;
  qs = sh(p).slice(0, cap).map(q => ({ ...q, options: sh(q.options) }));
  an = qs.map(() => null);
  cur = 0;
  sc = 0;
  draw();
}

function renderCard(q, i) {
  const a = an[i];
  const s = SUBJECTS[q.subjectIndex];
  let fbHtml = '';

  if (a !== null) {
    const ok = q.options[a].correct;
    const c = q.options.find(o => o.correct);
    fbHtml = `
      <div class="fb">
        <div class="${ok ? 'g' : 'r'}">${ok ? 'Correct!' : 'Incorrect.'}</div>
        <div class="concept-box"><b>Concept Summary:</b> ${c.why}</div>
        ${q.options.map((o, j) => `
          <div class="ri ${o.correct ? 'c' : ''}">
            <b>${L(j)})</b> ${o.why}
          </div>
        `).join('')}
      </div>
    `;
  }

  return `
    <div class="card qc">
      <div class="bd">
        <span class="b q">Q${i + 1}</span>
        <span class="b">[${s.week}] ${s.title}</span>
        <span class="b ${q.difficulty}">${q.difficulty}</span>
        ${q.priority ? '<span class="b hy">High Yield</span>' : ''}
        <span class="b">${q.slideRef}</span>
      </div>
      <div class="stem">${q.stem}</div>
      ${q.options.map((o, j) => {
        let cls = 'opt';
        if (a !== null) {
          cls += ' lk ';
          if (a === j) cls += o.correct ? 'ok' : 'bad';
          else cls += o.correct ? 'ok' : 'dim';
        }
        return `<div class="${cls}" ${a === null ? `onclick="pk(${i},${j})"` : ''}><span class="l">${L(j)}.</span><span>${o.text}</span></div>`;
      }).join('')}
      ${fbHtml}
    </div>
  `;
}

function updateStats(lbl) {
  const n = an.filter(x => x !== null).length;
  $('pp').innerHTML = lbl;
  $('sp').innerHTML = `Score: <b>${sc}/${n} (${n ? Math.round((sc / n) * 100) : 0}%)</b>`;
  $('pf').style.width = `${(n / qs.length) * 100}%`;
}

function draw() {
  const n = an.filter(x => x !== null).length;

  if (view === 'all') {
    const y = window.scrollY;
    updateStats(`Answered: <b>${n}/${qs.length}</b>`);
    $('main').innerHTML =
      qs.map((q, i) => renderCard(q, i)).join('') +
      (n === qs.length
        ? `<div style="text-align:center;margin-top:20px"><button class="btn on" style="padding:12px 26px;font-size:.95rem" onclick="showSummary()">View Final Results Summary</button></div>`
        : '');
    window.scrollTo(0, y);
  } else {
    if (cur >= qs.length) return showSummary();
    updateStats(`Question: <b>${cur + 1} of ${qs.length}</b>`);
    const prevBtn = `<button class="btn" ${cur === 0 ? 'disabled' : ''} onclick="prevQ()">&larr; Previous Question</button>`;
    const nextBtn = an[cur] !== null
      ? `<button class="btn on" onclick="nextQ()">${cur === qs.length - 1 ? 'Finish Exam' : 'Next Question &rarr;'}</button>`
      : '';
    $('main').innerHTML =
      renderCard(qs[cur], cur) +
      `<div class="nav-footer">${prevBtn}<div>${nextBtn}</div></div>`;
  }
}

function prevQ() {
  if (cur > 0) {
    cur--;
    draw();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function nextQ() {
  cur++;
  draw();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function pk(i, j) {
  if (an[i] !== null) return;
  const q = qs[i];
  an[i] = j;

  if (q.options[j].correct) {
    sc++;
    if (H[q.id]) {
      H[q.id] = Math.max(0, H[q.id] - 1);
    }
  } else {
    H[q.id] = (H[q.id] || 0) + 1;
    if (!mute) {
      try {
        $('wa').currentTime = 0;
        $('wa').play().catch(() => {});
      } catch (e) {}
      $('wp').classList.remove('h');
      clearTimeout(tm);
      tm = setTimeout(() => $('wp').classList.add('h'), 2000);
    }
  }
  sv();
  draw();
}

function showSummary() {
  const t = qs.length;
  const p = Math.round((sc / t) * 100);
  const bd = {};
  missed = [];

  qs.forEach((q, i) => {
    const b = bd[q.subjectIndex] || (bd[q.subjectIndex] = { t: 0, c: 0 });
    b.t++;
    if (an[i] !== null && q.options[an[i]].correct) {
      b.c++;
    } else {
      missed.push(questionBank[q.id]);
    }
  });

  const msg =
    p >= 90 ? 'Absolute Gigachad. You drained that test dry.' :
    p >= 70 ? 'You lasted less than 30 seconds. Time for a rematch.' :
              'You really didn’t fucking know that.';

  $('pf').style.width = '100%';
  $('main').innerHTML = `
    <div class="card sum">
      <div class="t">Exam Complete!</div>
      <div class="big">${sc} / ${t}</div>
      <div style="font-weight:700;color:${p >= 70 ? '#4ade80' : '#ef4444'}">
        ${p}% &middot; ${p >= 70 ? 'Passing' : 'Needs Remediation'}
      </div>
      <p style="margin-top:8px;color:var(--m)">${msg}</p>
      
      <div class="bk">
        <b style="color:var(--or);display:block;margin-bottom:8px">Per-Topic Performance</b>
        ${Object.keys(bd).map(k => `
          <div>
            <span>[${SUBJECTS[k].week}] ${SUBJECTS[k].title}</span>
            <b>${bd[k].c}/${bd[k].t} (${Math.round((bd[k].c / bd[k].t) * 100)}%)</b>
          </div>
        `).join('')}
      </div>

      <div class="row" style="justify-content:center">
        <button class="btn on" onclick="go(base, qs.length)">Retake Current Set</button>
        <button class="btn" onclick="missed.length ? go(missed, missed.length) : alert('No missed questions!')">Review Missed (${missed.length})</button>
        <button class="btn" onclick="renderHome()">Back to Menu</button>
        <a href="index.html" class="btn">Back to Hub</a>
      </div>
    </div>
  `;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', renderHome);
} else {
  renderHome();
}
</script>
</body>
</html>
