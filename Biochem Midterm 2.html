<script>
const SUBJECTS = [
  { week: "Wk 4-7", title: "Hemoglobin Structure, Cooperativity & O2 Curves" },
  { week: "Wk 4-7", title: "Hemoglobinopathies, Thalassemia & RBC Pathology" },
  { week: "Wk 5-7", title: "Fibrous Proteins, Biomechanics & Cross-Links" },
  { week: "Wk 5-7", title: "Connective Tissue Pathology (OI, EDS, Marfan, Scurvy, AAT)" },

  { week: "Wk 1-7", title: "Carryover Core: Forces, pKa/Buffers, Cofactors & Enzymes" }
];

const questionBank = [];
function addQ(s, d, p, r, st, ...opts) {
  const id = questionBank.length;
  const formatted = opts.map((item, idx) => {
    const parts = item.split('|');
    return { text: parts[0], correct: idx === 0, why: parts[1] + ' [' + r + ']' };
  });
  const ans = formatted.shift();
  formatted.splice(id % 4, 0, ans);
  questionBank.push({
    id,
    subjectIndex: s,
    week: SUBJECTS[s].week,
    slideRef: r,
    difficulty: d,
    priority: !!p,
    stem: st,
    options: formatted
  });
}

// ===================== 0: HEMOGLOBIN STRUCTURE, COOPERATIVITY & O2 CURVES =====================
addQ(0, 'easy', 1, 'Lec 4.1',
  'Adult hemoglobin is a quaternary tetramer composed of two _______ chains and two _______ chains.',
  'alpha; beta|Adult hemoglobin (HbA) consists of two alpha-beta dimers forming an alpha2-beta2 tetramer.',
  'alpha; gamma|Two alpha and two gamma chains form fetal hemoglobin (HbF), not adult HbA.',
  'zeta; epsilon|Two zeta and two epsilon chains form embryonic Gower hemoglobin.',
  'beta; gamma|No functional human hemoglobin tetramer consists solely of beta and gamma chains.');

addQ(0, 'easy', 1, 'Lec 7.1',
  'The alpha-globin gene family resides on chromosome _______ and the beta-globin gene family resides on chromosome _______.',
  '16; 11|Humans inherit four alpha-globin alleles on chromosome 16 and two beta-globin alleles on chromosome 11.',
  '11; 16|The chromosome locations are reversed; alpha is on 16 and beta is on 11.',
  '16; 16|Beta-globin family genes are located on chromosome 11 rather than chromosome 16.',
  '11; 11|Alpha-globin family genes are located on chromosome 16 rather than chromosome 11.');

addQ(0, 'easy', 1, 'Lec 4.1',
  'Within each single alpha-beta dimer of hemoglobin, the two subunits are held together primarily by:',
  'hydrophobic interactions|Complementary nonpolar domains (Val, Leu, Ile, Phe, Trp) exclude water and lock each dimer tightly together.',
  'ionic bridges|Ionic bridges and dipole interactions span the gap between the two dimers, not within one dimer.',
  'disulfide bonds|Hemoglobin subunits are not linked by interchain covalent disulfide bonds.',
  'peptide bonds|Separate alpha and beta polypeptides are not joined by covalent peptide bonds.');

addQ(0, 'medium', 1, 'Lec 7.1',
  'Which set of amino acids would be most abundant at the nonpolar hydrophobic interface joining an alpha globin to a beta globin?',
  'Valine, leucine, isoleucine, phenylalanine, and tryptophan|These nonpolar branched and planar aromatic residues form extensive temporary dipole contacts while excluding water.',
  'Lysine, arginine, aspartate, and glutamate|These charged residues form electrostatic salt bridges across the dimer-dimer gap rather than the hydrophobic intra-dimer seal.',
  'Tyrosine, serine, threonine, and asparagine|Polar hydroxyl and amide dipoles attract water into the interface and loosen hydrophobic packing.',
  'Cysteine, histidine, and glutamine|Ionizable and polar side chains are excluded from the tightly sealed nonpolar dimer interface.');

addQ(0, 'hard', 1, 'Tutoring Wk 6',
  'Although tyrosine possesses a planar aromatic ring, it is poorly suited for the hydrophobic intra-dimer interface of hemoglobin because:',
  'its phenolic hydroxyl group creates a dipole that draws water into the seal|Water entering a nonpolar interface disrupts hydrophobic stacking and destabilizes subunit association.',
  'it carries a permanent positive charge at physiological pH|Tyrosine has a side-chain pKa of ~10.1 and remains uncharged at pH 7.4.',
  'its ring is non-aromatic and cannot stack with phenylalanine|Tyrosine contains a benzene ring, but its polar -OH group makes it amphipathic.',
  'it forms covalent disulfide cross-links with alpha-chain cysteines|Tyrosine lacks a sulfhydryl group and cannot form disulfide bonds.');

addQ(0, 'medium', 1, 'Lec 4.1',
  'Across the gap separating the two alpha-beta dimers, the hemoglobin tetramer is stabilized mainly by _______, which are weakened if excess water enters the gap.',
  'ionic bridges|Oppositely charged Lys/Arg and Asp/Glu residues form salt bridges that rupture sequentially as oxygen binds.',
  'hydrophobic stacking|Hydrophobic packing is the intra-dimer force and is not solvated by charge separation.',
  'covalent glycosidic bonds|Glycosidic bonds join sugars rather than protein subunits.',
  'disulfide bridges|No interchain disulfide bridges exist in hemoglobin.');

addQ(0, 'easy', 1, 'Lec 7.1',
  'To reversibly bind and transport oxygen, the iron atom inside each heme porphyrin ring must remain in the _______ oxidation state.',
  'ferrous|Ferrous iron (Fe2+) reversibly coordinates O2; oxidation to ferric iron (Fe3+) creates methemoglobin, which cannot unload oxygen.',
  'ferric|Ferric iron (Fe3+) binds water or ligands tightly and fails to transport O2; damaged red cells are cleared by the spleen.',
  'elemental|Uncharged elemental iron (Fe0) does not coordinate inside the porphyrin ring.',
  'cupric|Copper (Cu2+) serves enzymes like lysyl oxidase rather than heme.');

addQ(0, 'medium', 1, 'Lec 7.1',
  'In deoxyhemoglobin, the central iron atom forms an octahedral coordination complex with _______ nitrogen atoms, and O2 binds at the sixth coordination site by displacing the _______ histidine.',
  'six; distal|Four planar porphyrin nitrogens plus proximal and distal histidines coordinate iron; O2 displaces the distal histidine site while proximal histidine stays attached.',
  'four; proximal|Iron coordinates six nitrogens in deoxyhemoglobin, and the proximal histidine remains anchored to the F-helix.',
  'six; proximal|The proximal histidine remains covalently tethered to iron and pulls the helix when O2 binds.',
  'two; distal|Four nitrogens come from the porphyrin ring itself plus two from the axial histidines.');

addQ(0, 'hard', 1, 'Tutoring Wk 6',
  'Binding of the first oxygen molecule to deoxyhemoglobin increases the oxygen affinity of the remaining three subunits because:',
  'iron moves into the porphyrin plane and pulls the proximal histidine, breaking inter-dimer ionic bridges|This mechanical pull shifts the tetramer from the low-affinity taut (T) state toward the high-affinity relaxed (R) state.',
  'oxygen oxidizes ferrous iron to ferric iron, opening the central cavity|Iron remains Fe2+ during reversible oxygenation; oxidation to Fe3+ abolishes O2 transport.',
  'oxygen cleaves the covalent peptide bonds linking alpha and beta chains|Subunits are non-covalently associated and remain intact.',
  'oxygen displaces 2,3-bisphosphoglycerate permanently out of the red blood cell|2,3-BPG remains inside the erythrocyte and equilibrates with the central cavity.');

addQ(0, 'medium', 1, 'Lec 4.1',
  'The sigmoidal oxygen-hemoglobin dissociation curve contrasts with the hyperbolic curve of myoglobin because hemoglobin exhibits:',
  'positive cooperativity across four interacting subunits|Monomeric myoglobin has a single heme site and cannot undergo allosteric subunit-to-subunit transitions.',
  'irreversible covalent oxygen attachment|Oxygen binds heme iron reversibly via weak coordination bonds.',
  'a higher oxygen affinity than myoglobin at all partial pressures|Myoglobin has a much lower P50 (~2–3 mmHg) than hemoglobin (~26 mmHg), allowing it to extract O2 from blood for muscle storage.',
  'six heme prosthetic groups per polypeptide chain|Each globin chain holds one heme group (four total per Hb tetramer).');

addQ(0, 'easy', 1, 'Tutoring Wk 7',
  'The deoxygenated, low-affinity conformation of hemoglobin is the _______ state, whereas the oxygenated, high-affinity conformation is the _______ state.',
  'taut; relaxed|Deoxyhemoglobin is stabilized in the taut (T) state by inter-dimer salt bridges; oxygenation shifts it to the relaxed (R) state.',
  'relaxed; taut|The conformational states are reversed; relaxed has high O2 affinity and taut has low O2 affinity.',
  'alpha; beta|Alpha and beta denote globin chain types or sugar anomers rather than quaternary affinity states.',
  'cis; trans|Cis and trans describe double-bond or peptide geometry.');

addQ(0, 'medium', 1, 'Lec 4.2',
  'In active skeletal muscle beds where PO2 drops from 30 mmHg to 20 mmHg along the steep portion of the dissociation curve, hemoglobin:',
  'unloads a large fraction of its bound oxygen in response to a small drop in partial pressure|The steep middle slope of the sigmoidal curve provides high dynamic sensitivity to tissue metabolic demand.',
  'retains nearly 100% of its oxygen due to the flat plateau region|The flat plateau occurs at high arterial PO2 (80–100 mmHg), not at 20–30 mmHg.',
  'switches irreversibly into methemoglobin|Acid and low PO2 promote reversible O2 unloading, not iron oxidation.',
  'increases its oxygen affinity to prevent tissue extraction|Decreased PO2 and local acidosis reduce affinity to enhance delivery.');

addQ(0, 'medium', 1, 'Lec 7.1',
  'How do local tissue acidosis (Bohr effect) and 2,3-bisphosphoglycerate work together to promote oxygen unloading?',
  'Protonated histidines acquire a positive charge that strengthens ionic binding of negatively charged 2,3-BPG in the central cavity|At pH 7.4, His (pKa ~6) is neutral, whereas Lys/Arg bind 2,3-BPG; when pH falls, protonated His+ intensifies BPG stabilization of the T-state.',
  'Protonated histidines expel 2,3-BPG from the central cavity into blood plasma|Protonation adds positive charge that attracts negatively charged 2,3-BPG more strongly.',
  '2,3-BPG directly protonates distal histidines to oxidize heme iron|2,3-BPG is a polyanionic glycolytic intermediate that binds basic cavity residues without altering Fe2+.',
  'Both acid and 2,3-BPG bind directly to the sixth coordination site of heme iron|Neither H+ nor 2,3-BPG binds heme iron; both act allosterically via globin salt bridges.');

addQ(0, 'easy', 1, 'Tutoring Wk 7',
  'Mature red blood cells synthesize 2,3-bisphosphoglycerate as a side branch of _______ because they lack nuclei and mitochondria.',
  'glycolysis|2,3-BPG branches off the glycolytic pathway from glucose to regulate hemoglobin oxygen affinity.',
  'the citric acid cycle|Mature erythrocytes have no mitochondria and cannot run the TCA cycle.',
  'beta-oxidation|Fatty acid oxidation requires mitochondria.',
  'the urea cycle|The urea cycle operates in liver hepatocytes.');

addQ(0, 'medium', 1, 'Tutoring Wk 7',
  'Because maternal and fetal circulations never mix across the placenta, fetal hemoglobin (alpha2-gamma2) extracts oxygen from maternal hemoglobin (alpha2-beta2) because HbF:',
  'has fewer positively charged Lys/Arg residues in its central cavity and binds 2,3-BPG less tightly|Weaker 2,3-BPG binding leaves HbF left-shifted (higher affinity) while elevated maternal 2,3-BPG shifts HbA right to drive O2 transfer.',
  'binds 2,3-BPG with much higher affinity than adult hemoglobin|Stronger 2,3-BPG binding would shift HbF right (lower affinity) and prevent oxygen uptake from the mother.',
  'operates in a substantially more acidic fetal capillary bed|Low pH shifts the curve right (unloading); fetal blood relies on higher intrinsic HbF affinity.',
  'contains six heme iron sites per tetramer compared to four in maternal HbA|Both HbF and HbA are tetramers containing four heme groups.');

addQ(0, 'easy', 1, 'Tutoring Wk 6',
  'Which embryonic hemoglobin is synthesized in the early fetal liver before bone marrow hematopoiesis begins?',
  'Hemoglobin Gower|Embryonic Gower hemoglobins combine zeta chains (chromosome 16) and epsilon chains (chromosome 11) during early gestation.',
  'Hemoglobin A2|HbA2 (alpha2-delta2) is a minor adult hemoglobin.',
  'Hemoglobin H|HbH (beta4) is an abnormal tetramer seen in three-gene deletion alpha-thalassemia.',
  'Hemoglobin S|HbS is the mutant sickle-cell adult hemoglobin variant.');

addQ(0, 'hard', 1, 'Tutoring Wk 7',
  'Why does carbon monoxide poisoning lower the upper plateau of the oxygen dissociation curve and cause severe tissue hypoxia?',
  'CO binds heme iron with ~200-fold higher affinity than oxygen, reducing available sites and locking remaining subunits in the relaxed state|Occupied sites cannot carry O2, and the R-like conformation prevents the remaining bound O2 molecules from unloading into tissues.',
  'CO binds inside the central cavity to displace 2,3-BPG and stabilize the taut form|CO binds directly to heme iron rather than the central cavity.',
  'CO rapidly oxidizes ferrous heme iron to ferric methemoglobin|Methemoglobin is caused by oxidizing agents like nitrites, whereas CO binds Fe2+.',

addQ(0, 'easy', 1, 'Lec 7.1',
  'How do cytochromes in the mitochondrial electron transport chain differ functionally from hemoglobin and myoglobin?',
  'Cytochrome heme iron cycles between ferrous and ferric states to transfer electrons|Oxygen carriers keep iron fixed as Fe2+, whereas cytochromes utilize the Fe2+/Fe3+ redox couple.',

addQ(0, 'easy', 0, 'Lec 7.1',

// ===================== 1: HEMOGLOBINOPATHIES, THALASSEMIA & RBC PATHOLOGY =====================
addQ(1, 'easy', 1, 'Lec 4.3',
  'Sickle cell disease results from a point mutation substituting _______ for _______ at position 6 of the beta-globin chain.',

  'glycine; proline|Glycine and proline are the signature repeating residues of collagen.',
  'lysine; aspartate|This substitution does not produce sickle hemoglobin.');

addQ(1, 'medium', 1, 'Lec 4.3',
  'At physiological pH 7.4, normal deoxygenated HbA tetramers remain soluble because the glutamate side chain (pKa ~4) is:',

  'When sickle hemoglobin (HbS) becomes deoxygenated in hypoxic capillaries, polymer fibers form because exposed valine side chains:',
  'interdigitate hydrophobically with complementary nonpolar pockets on adjacent tetramers|In the taut deoxy state, branched valines interlock via temporary dipole forces, stacking HbS into rigid rods.',
  'form strong ionic salt bridges with neighboring lysine residues|Valine has an uncharged hydrocarbon R-group and cannot form ionic bridges.',

  'How do aggregated deoxygenated HbS fibers physically deform the red blood cell into a rigid sickle shape?',

addQ(1, 'medium', 1, 'Lec 7.1',
  'How does thalassemia fundamentally differ from sickle cell disease?',
  'Thalassemia is a quantitative underproduction of normal globin chains, whereas sickle cell is a qualitative amino acid substitution|Unequal alpha-to-beta synthesis leaves unpaired globin chains that precipitate and damage red cell precursors.',

function sh(a) {
  a = [...a];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function syncHeaderButtons() {
  $('vb').textContent = 'View: ' + (view === 'all' ? 'All at Once' : 'One by One');
  $('eb').textContent = mute ? 'Bring Back Erijah' : 'STFU Erijah';
  $('eb').classList.toggle('on', mute);
  if (mute) {
    $('wp').classList.add('h');
    clearTimeout(tm);
    try { $('wa').pause(); $('wa').currentTime = 0; } catch (e) {}
  }
}

function togE() {
  mute = !mute;
  try { localStorage.setItem('stfuErijah', mute ? '1' : '0'); } catch (e) {}
  syncHeaderButtons();
}

function setV(v) {
  view = v;
  try { localStorage.setItem('quizView', v); } catch (e) {}
  syncHeaderButtons();
  if (qs.length > 0 && $('main').querySelector('.qc')) {
    draw();
  } else {
    renderHome();
  }
}

  setV(view === 'all' ? 'one' : 'all');
}

  const p = questionBank.filter(q => sel.has(q.subjectIndex));
  if (pri) {
    const m = p.filter(q => (H[q.id] || 0) > 0);

  }
  return p;
}

  $('sp').innerHTML = 'Score: <b>0/0 (0%)</b>';
  $('pf').style.width = '0%';

  const p = getPool();
  const ms = Object.keys(H).filter(k => H[k] > 0).length;

  $('main').innerHTML = `
    <div class="card">
      <div class="t">Biochemistry Midterm 2 Preparation Hub</div>
      <div class="dash-sub">Complete Tutoring (Wks 4–8) &amp; Lecture Mastery Bank &middot; Structure &rarr; Function &rarr; Pathology</div>
      
      <div class="lab">1. Select Topics</div>
      <div class="row">
        <div class="chip ${sel.size === SUBJECTS.length ? 'on' : ''}" onclick="sA(true)">All Topics (${questionBank.length})</div>
        ${SUBJECTS.map((s, i) => `
          <div class="chip ${sel.has(i) ? 'on' : ''}" onclick="tS(${i})">
            [${s.week}] ${s.title} (${questionBank.filter(q => q.subjectIndex === i).length})
          </div>
        `).join('')}
      </div>
      
      <div class="row">
        <button class="btn" onclick="sA(true)">Select All</button>
        <button class="btn" onclick="sA(false)">Clear</button>
        <button class="btn ${pri ? 'on' : ''}" onclick="pri=!pri;renderHome()">Prioritize Missed (${ms})</button>
      </div>

      <div class="lab">2. Display Mode</div>
      <div class="row">
        <div class="chip ${view === 'one' ? 'on' : ''}" onclick="setV('one')">One by One (Card View)</div>
        <div class="chip ${view === 'all' ? 'on' : ''}" onclick="setV('all')">All at Once (Continuous List)</div>
      </div>

      <div class="lab" style="color:var(--or)">${p.length} questions available across ${sel.size} topics selected</div>

      <div class="lab">3. Launch Practice Exam</div>
      <div class="launcher-grid">
        <button class="launch-btn" onclick="go(getPool(), 15)">Quickie (15 Qs)</button>
        <button class="launch-btn" onclick="go(getPool(), 25)">Foreplay (25 Qs)</button>
        <button class="launch-btn" onclick="go(getPool(), 35)">Stamina Check (35 Qs)</button>
        <button class="launch-btn" onclick="go(getPool(), 50)">Marathon (50 Qs)</button>
        <button class="launch-btn primary" onclick="go(getPool(), getPool().length)">Chafing (${p.length} Qs)</button>
      </div>
    </div>
  `;
}

function tS(i) {
  sel.has(i) ? sel.delete(i) : sel.add(i);
  renderHome();
}

function sA(all) {
  sel = all ? new Set(SUBJECTS.map((_, i) => i)) : new Set();
  renderHome();
}

function go(p, limit) {
  if (!p.length) {
    alert('Please select at least one topic before launching the quiz.');
    return;
  }
  const cap = limit ? Math.min(limit, p.length) : p.length;
  base = p;
  qs = sh(p).slice(0, cap).map(q => ({ ...q, options: sh(q.options) }));
  an = qs.map(() => null);
  cur = 0;
  sc = 0;
  draw();
}

function renderCard(q, i) {
  const a = an[i];
  const s = SUBJECTS[q.subjectIndex];
  let fbHtml = '';

  if (a !== null) {
    const ok = q.options[a].correct;
    const c = q.options.find(o => o.correct);
    fbHtml = `
      <div class="fb">
        <div class="${ok ? 'g' : 'r'}">${ok ? 'Correct!' : 'Incorrect.'}</div>
        <div class="concept-box"><b>Concept Summary:</b> ${c.why}</div>
        ${q.options.map((o, j) => `
          <div class="ri ${o.correct ? 'c' : ''}">
            <b>${L(j)})</b> ${o.why}
          </div>
        `).join('')}
      </div>
    `;
  }

  return `
    <div class="card qc">
      <div class="bd">
        <span class="b q">Q${i + 1}</span>
        <span class="b">[${s.week}] ${s.title}</span>
        <span class="b ${q.difficulty}">${q.difficulty}</span>
        ${q.priority ? '<span class="b hy">High Yield</span>' : ''}
        <span class="b">${q.slideRef}</span>
      </div>
      <div class="stem">${q.stem}</div>
      ${q.options.map((o, j) => {
        let cls = 'opt';
        if (a !== null) {
          cls += ' lk ';
          if (a === j) cls += o.correct ? 'ok' : 'bad';
          else cls += o.correct ? 'ok' : 'dim';
        }
        return `<div class="${cls}" ${a === null ? `onclick="pk(${i},${j})"` : ''}><span class="l">${L(j)}.</span><span>${o.text}</span></div>`;
      }).join('')}
      ${fbHtml}
    </div>
  `;
}

function updateStats(lbl) {
  const n = an.filter(x => x !== null).length;
  $('pp').innerHTML = lbl;
  $('sp').innerHTML = `Score: <b>${sc}/${n} (${n ? Math.round((sc / n) * 100) : 0}%)</b>`;
  $('pf').style.width = `${(n / qs.length) * 100}%`;
}

function draw() {
  const n = an.filter(x => x !== null).length;

  if (view === 'all') {
    const y = window.scrollY;
    updateStats(`Answered: <b>${n}/${qs.length}</b>`);
    $('main').innerHTML =
      qs.map((q, i) => renderCard(q, i)).join('') +
      (n === qs.length
        ? `<div style="text-align:center;margin-top:20px"><button class="btn on" style="padding:12px 26px;font-size:.95rem" onclick="showSummary()">View Final Results Summary</button></div>`
        : '');
    window.scrollTo(0, y);
  } else {
    if (cur >= qs.length) return showSummary();
    updateStats(`Question: <b>${cur + 1} of ${qs.length}</b>`);
    const prevBtn = `<button class="btn" ${cur === 0 ? 'disabled' : ''} onclick="prevQ()">&larr; Previous Question</button>`;
    const nextBtn = an[cur] !== null
      ? `<button class="btn on" onclick="nextQ()">${cur === qs.length - 1 ? 'Finish Exam' : 'Next Question &rarr;'}</button>`
      : '';
    $('main').innerHTML =
      renderCard(qs[cur], cur) +
      `<div class="nav-footer">${prevBtn}<div>${nextBtn}</div></div>`;
  }
}

function prevQ() {
  if (cur > 0) {
    cur--;
    draw();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function nextQ() {
  cur++;
  draw();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function pk(i, j) {
  if (an[i] !== null) return;
  const q = qs[i];
  an[i] = j;

  if (q.options[j].correct) {
    sc++;
    if (H[q.id]) {
      H[q.id] = Math.max(0, H[q.id] - 1);
    }
  } else {
    H[q.id] = (H[q.id] || 0) + 1;
    if (!mute) {
      try {
        $('wa').currentTime = 0;
        $('wa').play().catch(() => {});
      } catch (e) {}
      $('wp').classList.remove('h');
      clearTimeout(tm);
      tm = setTimeout(() => $('wp').classList.add('h'), 2000);
    }
  }
  sv();
  draw();
}

function showSummary() {
  const t = qs.length;
  const p = Math.round((sc / t) * 100);
  const bd = {};
  missed = [];

  qs.forEach((q, i) => {
    const b = bd[q.subjectIndex] || (bd[q.subjectIndex] = { t: 0, c: 0 });
    b.t++;
    if (an[i] !== null && q.options[an[i]].correct) {
      b.c++;
    } else {
      missed.push(questionBank[q.id]);
    }
  });

  const msg =
    p >= 90 ? 'Absolute Gigachad. You drained that test dry.' :
    p >= 70 ? 'You lasted less than 30 seconds. Time for a rematch.' :
              'You really didn’t fucking know that.';

  $('pf').style.width = '100%';
  $('main').innerHTML = `
    <div class="card sum">
      <div class="t">Exam Complete!</div>
      <div class="big">${sc} / ${t}</div>
      <div style="font-weight:700;color:${p >= 70 ? '#4ade80' : '#ef4444'}">
        ${p}% &middot; ${p >= 70 ? 'Passing' : 'Needs Remediation'}
      </div>
      <p style="margin-top:8px;color:var(--m)">${msg}</p>
      
      <div class="bk">
        <b style="color:var(--or);display:block;margin-bottom:8px">Per-Topic Performance</b>
        ${Object.keys(bd).map(k => `
          <div>
            <span>[${SUBJECTS[k].week}] ${SUBJECTS[k].title}</span>
            <b>${bd[k].c}/${bd[k].t} (${Math.round((bd[k].c / bd[k].t) * 100)}%)</b>
          </div>
        `).join('')}
      </div>

      <div class="row" style="justify-content:center">
        <button class="btn on" onclick="go(base, qs.length)">Retake Current Set</button>
        <button class="btn" onclick="missed.length ? go(missed, missed.length) : alert('No missed questions!')">Review Missed (${missed.length})</button>
        <button class="btn" onclick="renderHome()">Back to Menu</button>
        <a href="index.html" class="btn">Back to Hub</a>
      </div>
    </div>
  `;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', renderHome);
} else {
  renderHome();
}
</script>
</body>
</html>
