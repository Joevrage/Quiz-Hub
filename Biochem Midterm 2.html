// ---------------- STATE & STORAGE ----------------
const $ = id => document.getElementById(id);
const letter = idx => String.fromCharCode(65 + idx);

}

let prioritizeMissed = false;
let viewMode = 'one';
let stfuErijah = false;

try {
  viewMode = localStorage.getItem('quizView') || 'one';
  stfuErijah = localStorage.getItem('stfuErijah') === '1';
} catch (e) {}

let currentPoolBase = [];
let activeQuestions = [];
let userAnswers = [];
let currentIndex = 0;
let score = 0;
let popupTimer = null;

function shuffle(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function updateHeaderControls() {
  $('vb').textContent = 'View: ' + (viewMode === 'all' ? 'All at Once' : 'One by One');
  $('eb').textContent = stfuErijah ? 'Bring Back Erijah' : 'STFU Erijah';
  $('eb').classList.toggle('on', stfuErijah);
  if (stfuErijah) {
    $('wp').classList.add('h');
    clearTimeout(popupTimer);
    try { $('wa').pause(); } catch (e) {}
  }
}

function togErijah() {
  stfuErijah = !stfuErijah;
  try { localStorage.setItem('stfuErijah', stfuErijah ? '1' : '0'); } catch (e) {}
  updateHeaderControls();
}

function setViewMode(mode) {
  viewMode = mode;
  try { localStorage.setItem('quizView', mode); } catch (e) {}
  updateHeaderControls();
  if (activeQuestions.length > 0 && $('main').querySelector('.qc')) {
    renderQuiz();
  } else {
    renderHome();
  }
}

function togView() {
  setViewMode(viewMode === 'all' ? 'one' : 'all');
}

function getFilteredPool() {
  const base = questionBank.filter(q => selectedSubjects.has(q.subjectIndex));
  if (prioritizeMissed) {
    const missedSubset = base.filter(q => (missedHistory[q.id] || 0) > 0);
    if (missedSubset.length > 0) return missedSubset;
  }
  return base;
}

  else selectedSubjects.add(idx);

}

  selectedSubjects = all ? new Set(SUBJECTS.map((_, i) => i)) : new Set();
  renderHome();
}

function togglePrioritizeMissed() {
  prioritizeMissed = !prioritizeMissed;
  renderHome();
}

// ---------------- QUIZ ENGINE ----------------
function launchQuiz(limit, customPool = null) {
  const pool = customPool || getFilteredPool();
  if (!pool.length) {
    alert('Please select at least one topic before starting the quiz.');
    return;
  }
  currentPoolBase = pool;
  let shuffledPool = shuffle(pool);
  if (limit > 0 && shuffledPool.length > limit) {
    shuffledPool = shuffledPool.slice(0, limit);
  }
  // Two-way Fisher-Yates shuffle: shuffle question order AND shuffle each question's 4 options
  activeQuestions = shuffledPool.map(q => ({
    ...q,
    options: shuffle(q.options)
  }));
  userAnswers = activeQuestions.map(() => null);
  currentIndex = 0;
  score = 0;
  renderQuiz();
}

function renderQuestionCard(q, qIdx) {
  const chosen = userAnswers[qIdx];
  const subj = SUBJECTS[q.subjectIndex];
  const isLocked = chosen !== null;

  const optionsHtml = q.options.map((opt, oIdx) => {
    let cls = 'opt';
    if (isLocked) {
      cls += ' lk';
      if (oIdx === chosen) {
        cls += opt.correct ? ' ok' : ' bad';
      } else if (opt.correct) {
        cls += ' ok';
      } else {
        cls += ' dim';
      }
    }
    const clickAttr = isLocked ? '' : `onclick="selectOption(${qIdx}, ${oIdx})"`;
    return `<div class="${cls}" ${clickAttr}><span class="l">${letter(oIdx)}.</span><span>${opt.text}</span></div>`;
  }).join('');

  let feedbackHtml = '';
  if (isLocked) {
    const isCorrect = q.options[chosen].correct;
    const correctOpt = q.options.find(o => o.correct);
    const rationalesHtml = q.options.map((opt, oIdx) => `
      <div class="ri ${opt.correct ? 'c' : ''}">
        <b>${letter(oIdx)})</b> ${opt.why}
      </div>
    `).join('');

    feedbackHtml = `
      <div class="fb">
        <div class="status-banner ${isCorrect ? 'g' : 'r'}">${isCorrect ? 'Correct!' : 'Incorrect.'}</div>
        <div class="concept-box"><b>Concept Summary:</b> ${correctOpt.why}</div>
        ${rationalesHtml}
      </div>
    `;
  }

  return `
    <div class="card qc">
      <div class="bd">
        <span class="b q">Q${qIdx + 1}</span>
        <span class="b">${subj.name}</span>
        <span class="b ${q.difficulty}">${q.difficulty}</span>
        ${q.priority ? '<span class="b hy">High-Yield</span>' : ''}
        <span class="b">${q.slideRef}</span>
      </div>
      <div class="stem">${q.stem}</div>
      ${optionsHtml}
      ${feedbackHtml}
    </div>
  `;
}

function updateStatsBar(progressLabel) {
  const answeredCount = userAnswers.filter(x => x !== null).length;
  const pct = answeredCount ? Math.round((score / answeredCount) * 100) : 0;
  $('pp').innerHTML = progressLabel;
  $('sp').innerHTML = `Score: <b>${score} / ${answeredCount} (${pct}%)</b>`;
  $('pf').style.width = `${(answeredCount / activeQuestions.length) * 100}%`;
}

function renderQuiz() {
  const answeredCount = userAnswers.filter(x => x !== null).length;

  if (viewMode === 'all') {
    const savedScrollY = window.scrollY;
    updateStatsBar(`Answered: <b>${answeredCount} / ${activeQuestions.length}</b>`);
    const cardsHtml = activeQuestions.map((q, i) => renderQuestionCard(q, i)).join('');
    const finishBtn = answeredCount === activeQuestions.length
      ? `<div style="text-align:center;margin-top:16px"><button class="btn on" style="padding:12px 24px;font-size:0.95rem" onclick="showSummary()">View Final Results Summary</button></div>`
      : '';
    $('main').innerHTML = cardsHtml + finishBtn;
    window.scrollTo(0, savedScrollY);
  } else {
    if (currentIndex >= activeQuestions.length) {
      return showSummary();
    }
    updateStatsBar(`Question: <b>${currentIndex + 1} of ${activeQuestions.length}</b>`);
    const cardHtml = renderQuestionCard(activeQuestions[currentIndex], currentIndex);
    const navBtn = userAnswers[currentIndex] !== null
      ? `<div style="text-align:right;margin-top:12px"><button class="btn on" style="padding:10px 20px;font-size:0.9rem" onclick="nextQuestion()">${currentIndex === activeQuestions.length - 1 ? 'Finish Exam' : 'Next Question &rarr;'}</button></div>`
      : '';
    $('main').innerHTML = cardHtml + navBtn;
  }
}

function nextQuestion() {
  currentIndex++;
  renderQuiz();
  window.scrollTo(0, 0);
}

function selectOption(qIdx, oIdx) {
  if (userAnswers[qIdx] !== null) return;
  const q = activeQuestions[qIdx];
  userAnswers[qIdx] = oIdx;

  if (q.options[oIdx].correct) {
    score++;
    if (missedHistory[q.id] > 0) {
      missedHistory[q.id]--;
      if (missedHistory[q.id] <= 0) delete missedHistory[q.id];
    }
  } else {
    missedHistory[q.id] = (missedHistory[q.id] || 0) + 1;
    if (!stfuErijah) {
      try {
        const audio = $('wa');
        audio.currentTime = 0;
        audio.play().catch(() => {});
      } catch (e) {}
      $('wp').classList.remove('h');
      clearTimeout(popupTimer);
      popupTimer = setTimeout(() => {
        $('wp').classList.add('h');
      }, 2000);
    }
  }
  saveHistory();
  renderQuiz();
}

// ---------------- COMPLETION SUMMARY ----------------
let lastMissedSet = [];

function showSummary() {
  const total = activeQuestions.length;
  const pct = total ? Math.round((score / total) * 100) : 0;
  const breakdown = {};
  lastMissedSet = [];

  activeQuestions.forEach((q, i) => {
    if (!breakdown[q.subjectIndex]) {
      breakdown[q.subjectIndex] = { total: 0, correct: 0 };
    }
    breakdown[q.subjectIndex].total++;
    if (userAnswers[i] !== null && q.options[userAnswers[i]].correct) {
      breakdown[q.subjectIndex].correct++;
    } else {
      const originalObj = questionBank.find(item => item.id === q.id);
      if (originalObj) lastMissedSet.push(originalObj);
    }
  });

  let tierMessage = '';
  if (pct >= 90) {
    tierMessage = 'Absolute Gigachad. You drained that test dry.';
  } else if (pct >= 70) {
    tierMessage = 'You lasted less than 30 seconds. Time for a rematch.';
  } else {
    tierMessage = 'You really didn’t fucking know that.';
  }

  $('pf').style.width = '100%';
  $('pp').innerHTML = `Completed: <b>${total} / ${total}</b>`;
  $('sp').innerHTML = `Final Score: <b>${score} / ${total} (${pct}%)</b>`;

  const tableRows = Object.keys(breakdown).map(k => {
    const subj = SUBJECTS[k];
    const stat = breakdown[k];
    const sPct = Math.round((stat.correct / stat.total) * 100);
    return `
      <tr>
        <td>[${subj.module}] ${subj.name}</td>
        <td>${stat.correct} / ${stat.total}</td>
        <td style="font-weight:700;color:${sPct >= 70 ? '#4ade80' : '#ef4444'}">${sPct}%</td>
      </tr>
    `;
  }).join('');

  $('main').innerHTML = `
    <div class="card sum">
      <div class="t">Exam Complete!</div>
      <div class="big">${score} / ${total}</div>
      <div style="font-weight:800;font-size:1.1rem;color:${pct >= 70 ? '#4ade80' : '#ef4444'}">${pct}%</div>
      <div class="perf-msg">${tierMessage}</div>

      <table class="sum-table">
        <thead>
          <tr>
            <th>Topic Module</th>
            <th>Score</th>
            <th>Accuracy</th>
          </tr>
        </thead>
        <tbody>
          ${tableRows}
        </tbody>
      </table>

      <div class="row" style="justify-content:center">
        <button class="btn on" onclick="launchQuiz(0, currentPoolBase)">Retake Current Set</button>
        <button class="btn" onclick="reviewMissed()">Review Missed (${lastMissedSet.length})</button>
        <button class="btn" onclick="renderHome()">Back to Menu</button>
        <a href="index.html" class="btn">Back to Hub</a>
      </div>
    </div>
  `;
}

function reviewMissed() {
  if (!lastMissedSet.length) {
    alert('Zero missed questions in this set! Nothing to review.');
    return;
  }
  launchQuiz(0, lastMissedSet);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', renderHome);
} else {
  renderHome();
}
</script>
