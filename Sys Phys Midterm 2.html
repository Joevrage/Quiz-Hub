<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sys Phys Midterm 2 Comprehensive Exam Hub</title>
  <style>
    :root {
      --bg-base: #0f0f0f;
      --bg-card: #1a1a1a;
      --bg-card-hover: #222222;
      --border-color: #2a2a2a;
      --accent: #ff9900;
      --accent-hover: #e68a00;
      --text-main: #ffffff;
      --text-muted: #a0a0a0;
      --correct-bg: #14532d;
      --correct-border: #22c55e;
      --incorrect-bg: #7f1d1d;
      --incorrect-border: #ef4444;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-family);
      line-height: 1.5;
      padding-bottom: 60px;
    }

    /* Sticky Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(26, 26, 26, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 20px;
    }
    .header-content {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .header-title h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.5px;
    }
    .header-title p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      transition: all 0.2s ease;
    }
    .btn:hover {
      background-color: var(--bg-card-hover);
      border-color: var(--accent);
    }
    .btn-accent {
      background-color: var(--accent);
      color: #000;
      border-color: var(--accent);
    }
    .btn-accent:hover {
      background-color: var(--accent-hover);
    }
    .btn.active {
      background-color: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    .pill {
      background-color: #262626;
      border: 1px solid #333;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #e5e5e5;
    }
    .progress-track {
      width: 100%;
      height: 4px;
      background-color: #262626;
      border-radius: 2px;
      margin-top: 8px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background-color: var(--accent);
      transition: width 0.3s ease;
    }

    /* Main Container */
    main {
      max-width: 900px;
      margin: 24px auto;
      padding: 0 16px;
    }

    /* Dashboard / Filter View */
    .dashboard-panel {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 24px;
      margin-bottom: 24px;
    }
    .panel-heading {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--accent);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .chip-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }
    .filter-chip {
      background-color: #222;
      border: 1px solid #333;
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.825rem;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      user-select: none;
    }
    .filter-chip:hover {
      border-color: var(--accent);
    }
    .filter-chip.active {
      background-color: var(--accent);
      color: #000;
      border-color: var(--accent);
      font-weight: 700;
    }
    .filter-chip .chip-count {
      opacity: 0.8;
      font-size: 0.75rem;
    }

    .launcher-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-top: 20px;
    }
    .launcher-btn {
      background-color: #222;
      border: 1px solid #333;
      color: var(--text-main);
      padding: 14px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      text-align: center;
      transition: all 0.2s ease;
    }
    .launcher-btn:hover {
      border-color: var(--accent);
      background-color: #282828;
      transform: translateY(-2px);
    }

    /* Question Cards */
    .question-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 24px;
      margin-bottom: 20px;
      transition: border-color 0.2s ease;
    }
    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .meta-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .tag {
      background: #252525;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid #333;
    }
    .tag-week {
      color: var(--accent);
      border-color: rgba(255,153,0,0.3);
      font-weight: 700;
    }
    .tag-priority {
      color: #38bdf8;
      border-color: rgba(56,189,248,0.3);
    }
    .stem-text {
      font-size: 1.05rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 20px;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 18px;
    }
    .option-btn {
      background-color: #222;
      border: 1px solid #333;
      color: #e5e5e5;
      padding: 12px 16px;
      border-radius: 8px;
      text-align: left;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.15s ease;
    }
    .option-btn:hover:not(:disabled) {
      background-color: #2a2a2a;
      border-color: var(--accent);
    }
    .option-btn:disabled {
      cursor: default;
    }
    .opt-key {
      font-weight: 700;
      color: var(--accent);
      background-color: #151515;
      width: 26px;
      height: 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .option-btn.selected-correct {
      background-color: var(--correct-bg) !important;
      border-color: var(--correct-border) !important;
      color: #fff !important;
    }
    .option-btn.selected-incorrect {
      background-color: var(--incorrect-bg) !important;
      border-color: var(--incorrect-border) !important;
      color: #fff !important;
    }
    .option-btn.show-correct {
      border-color: var(--correct-border) !important;
      background-color: rgba(20,83,45,0.4) !important;
    }

    /* Feedback / Rationale Drawer */
    .rationale-panel {
      margin-top: 16px;
      padding: 16px;
      background-color: #171717;
      border: 1px solid #2d2d2d;
      border-radius: 8px;
    }
    .status-banner {
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 10px;
    }
    .status-banner.correct { color: #4ade80; }
    .status-banner.incorrect { color: #f87171; }
    .rationale-item {
      font-size: 0.85rem;
      color: #d4d4d4;
      margin-bottom: 8px;
      padding-left: 8px;
      border-left: 2px solid #333;
    }
    .rationale-item strong {
      color: #ffb74d;
    }

    /* Visual Wrong Popup */
    .wrong-popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(1);
      z-index: 1000;
      pointer-events: none;
      transition: all 0.2s ease-out;
    }
    .wrong-popup.hidden {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.8);
    }
    .wrong-popup img {
      width: 240px;
      height: auto;
      border-radius: 12px;
      border: 3px solid #ef4444;
      box-shadow: 0 10px 40px rgba(239,68,68,0.5);
    }

    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    a.btn { text-decoration: none; display: inline-block; }

    /* Utility */
    .hidden { display: none !important; }
    .card-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 16px;
    }
  </style>
</head>

    let hist = {};

          let i = 0;
          while (i < quizQuestions.length - 1 && userAnswers[i] !== undefined) i++;
          currentIndex = i;

        renderActiveQuiz();

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    /* ==========================================================================

       ========================================================================== */
    let currentSet = [];

    function launchQuiz(customPool = null) {
      let pool = customPool ? [...customPool] : questionBank.filter(q => selectedSubjects.has(q.subjectIndex));
      if (pool.length === 0) return;
      currentSet = pool.map(q => questionBank.find(b => b.id === q.id) || q);

      // Fisher-Yates shuffle of the question order AND each question's 4 options
      quizQuestions = shuffleArray(currentSet).map(q => ({ ...q, shuffledOptions: shuffleArray(q.options) }));

      if (prioritizeMissed) {
        quizQuestions.sort((a, b) => (hist[b.id] || 0) - (hist[a.id] || 0));
      }
      if (orderMode === 'tiered') {
        quizQuestions.sort((a, b) =>
          DIFF_RANK[a.difficulty] - DIFF_RANK[b.difficulty] ||
          (prioritizeMissed ? (hist[b.id] || 0) - (hist[a.id] || 0) : 0) ||
          a.subjectIndex - b.subjectIndex
        );
      }

      userAnswers = {};
      currentIndex = 0;
      score = 0;
      window.scrollTo(0, 0);
      renderActiveQuiz();
    }

    function renderActiveQuiz() {
      updateHeader();
      if (viewMode === 'all') {
        renderAllQuestions();
      } else {
        renderSingleQuestion();
      }
    }

    function updateHeader() {
      const total = quizQuestions.length;
      const answeredCount = Object.keys(userAnswers).length;
      const pct = answeredCount > 0 ? Math.round((score / answeredCount) * 100) : 0;

      $('scorePill').textContent = `Score: ${score} / ${answeredCount} (${pct}%)`;
      if (viewMode === 'single') {
        $('progressPill').textContent = total > 0 ? `Q ${currentIndex + 1} of ${total}` : 'Q 0 of 0';
      } else {
        $('progressPill').textContent = total > 0 ? `Answered ${answeredCount} of ${total}` : 'Answered 0 of 0';
      }

      const barPct = total > 0 ? (answeredCount / total) * 100 : 0;
      $('progressBar').style.width = `${barPct}%`;
    }

    function renderSingleQuestion() {
      if (quizQuestions.length === 0) return;
      const q = quizQuestions[currentIndex];
      const hasAnswered = userAnswers[currentIndex] !== undefined;
      const chosenIdx = userAnswers[currentIndex];
      const sub = SUBJECTS[q.subjectIndex];

    function handleAnswer(qIdx, optIdx) {
      if (userAnswers[qIdx] !== undefined) return;

      userAnswers[qIdx] = optIdx;
      const q = quizQuestions[qIdx];
      const opt = q.shuffledOptions[optIdx];

      if (opt.correct) {
        score++;
        if (hist[q.id]) {
          hist[q.id] = Math.max(0, hist[q.id] - 1);
          saveHistory();
        }
      } else {
        hist[q.id] = (hist[q.id] || 0) + 1;
        saveHistory();
        triggerWrongFeedback();
      }

      updateHeader();

      if (viewMode === 'all') {
        const scrollY = window.scrollY;
        renderAllQuestions();
        window.scrollTo(0, scrollY);
      } else {
        renderSingleQuestion();
      }
    }

      const audio = $('wrongAudio');

        audio.currentTime = 0;
        audio.play().catch(() => {});

      const popup = $('wrongPopup');
      if (popup) {
        popup.classList.remove('hidden');
        if (popupTimeout) clearTimeout(popupTimeout);
        popupTimeout = setTimeout(() => {
          popup.classList.add('hidden');
        }, 2000);

        `;

        missedEntries.forEach(({ q, qNum, chosenIdx }) => {
          const sub = SUBJECTS[q.subjectIndex];
          html += `
            <div class="question-card" style="border-color: rgba(239,68,68,0.4);">
              <div class="card-meta">
                <div class="meta-tags">
                  <span class="tag" style="background:var(--incorrect-bg); border-color:var(--incorrect-border); color:#fff; font-weight:700;">Missed Q${qNum}</span>
                  <span class="tag tag-week">[${sub.week}] ${sub.title}</span>
                  <span class="tag">Ref: ${q.slideRef}</span>
                  <span class="tag">${q.difficulty.toUpperCase()}</span>
                </div>
              </div>

              <div class="stem-text">${q.stem}</div>

              <div class="options-grid">
          `;

          q.shuffledOptions.forEach((opt, optIdx) => {
            let btnClass = "option-btn";
            if (optIdx === chosenIdx) {
              btnClass += " selected-incorrect";
            } else if (opt.correct) {
              btnClass += " show-correct";
            }

            html += `
              <button class="${btnClass}" disabled>
                <span class="opt-key">${keys[optIdx]}</span>
                <span>${opt.text}</span>
              </button>
            `;
          });

          html += `
              </div>
              <div class="rationale-panel">
                <div class="status-banner incorrect">&#10008; Your Answer: ${keys[chosenIdx]}</div>
          `;

          q.shuffledOptions.forEach((opt, optIdx) => {
            html += `
              <div class="rationale-item">
                <strong>${keys[optIdx]}) ${opt.correct ? '[CORRECT]' : '[INCORRECT]'}:</strong> ${opt.why}
              </div>
            `;
          });

          html += `
              </div>
            </div>
          `;
        });

        html += `</div>`;
      } else {
        html += `
          <div class="dashboard-panel" style="text-align:center; color:#4ade80; font-weight:600;">
            &#10004; Perfect score! No missed questions to review.
          </div>
        `;
      }

      $('appRoot').innerHTML = html;
      window.scrollTo(0, 0);
    }

    window.onload = () => {
      renderHome();
    };
  </script>
</body>
</html>
