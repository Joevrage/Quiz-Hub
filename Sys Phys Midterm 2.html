<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sys Phys Midterm 2 Comprehensive Exam Hub</title>
  <style>
    :root {
      --bg-base: #0f0f0f;
      --bg-card: #1a1a1a;
      --bg-card-hover: #222222;
      --border-color: #2a2a2a;
      --accent: #ff9900;
      --accent-hover: #e68a00;
      --text-main: #ffffff;
      --text-muted: #a0a0a0;
      --correct-bg: #14532d;
      --correct-border: #22c55e;
      --incorrect-bg: #7f1d1d;
      --incorrect-border: #ef4444;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-family);
      line-height: 1.5;
      padding-bottom: 60px;
    }

    /* Sticky Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(26, 26, 26, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 20px;
    }
    .header-content {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .header-title h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.5px;
    }
    .header-title p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn:hover {
      background-color: var(--bg-card-hover);
      border-color: var(--accent);
    }
    .btn-accent {
      background-color: var(--accent);
      color: #000;
      border-color: var(--accent);
    }
    .btn-accent:hover {
      background-color: var(--accent-hover);
    }
    .btn.active {
      background-color: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    .pill {
      background-color: #262626;
      border: 1px solid #333;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #e5e5e5;
    }
    .progress-track {
      width: 100%;
      height: 4px;
      background-color: #262626;
      border-radius: 2px;
      margin-top: 8px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background-color: var(--accent);
      transition: width 0.3s ease;
    }

    /* Main Container */
    main {
      max-width: 900px;
      margin: 24px auto;
      padding: 0 16px;
    }

    /* Dashboard / Filter View */
    .dashboard-panel {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 24px;
      margin-bottom: 24px;
    }
    .panel-heading {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--accent);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .chip-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }
    .filter-chip {
      background-color: #222;
      border: 1px solid #333;
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.825rem;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      user-select: none;
    }
    .filter-chip:hover {
      border-color: var(--accent);
    }
    .filter-chip.active {
      background-color: var(--accent);
      color: #000;
      border-color: var(--accent);
      font-weight: 700;
    }
    .filter-chip .chip-count {
      opacity: 0.8;
      font-size: 0.75rem;
    }

    .launcher-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-top: 20px;
    }
    .launcher-btn {
      background-color: #222;
      border: 1px solid #333;
      color: var(--text-main);
      padding: 14px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      text-align: center;
      transition: all 0.2s ease;
    }
    .launcher-btn:hover {
      border-color: var(--accent);
      background-color: #282828;
      transform: translateY(-2px);
    }

    /* Question Cards */
    .question-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 24px;
      margin-bottom: 20px;
      transition: border-color 0.2s ease;
    }
    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .meta-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .tag {
      background: #252525;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid #333;
    }
    .tag-week {
      color: var(--accent);
      border-color: rgba(255,153,0,0.3);
      font-weight: 700;
    }
    .tag-priority {
      color: #38bdf8;
      border-color: rgba(56,189,248,0.3);
    }
    .stem-text {
      font-size: 1.05rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 20px;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 18px;
    }
    .option-btn {
      background-color: #222;
      border: 1px solid #333;
      color: #e5e5e5;
      padding: 12px 16px;
      border-radius: 8px;
      text-align: left;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.15s ease;
    }
    .option-btn:hover:not(:disabled) {
      background-color: #2a2a2a;
      border-color: var(--accent);
    }
    .option-btn:disabled {
      cursor: default;
    }
    .opt-key {
      font-weight: 700;
      color: var(--accent);
      background-color: #151515;
      width: 26px;
      height: 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .option-btn.selected-correct {
      background-color: var(--correct-bg) !important;
      border-color: var(--correct-border) !important;
      color: #fff !important;
    }
    .option-btn.selected-incorrect {
      background-color: var(--incorrect-bg) !important;
      border-color: var(--incorrect-border) !important;
      color: #fff !important;
    }
    .option-btn.show-correct {
      border-color: var(--correct-border) !important;
      background-color: rgba(20,83,45,0.4) !important;
    }

    /* Feedback / Rationale Drawer */
    .rationale-panel {
      margin-top: 16px;
      padding: 16px;
      background-color: #171717;
      border: 1px solid #2d2d2d;
      border-radius: 8px;
    }
    .status-banner {
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 10px;
    }
    .status-banner.correct { color: #4ade80; }
    .status-banner.incorrect { color: #f87171; }
    .rationale-item {
      font-size: 0.85rem;
      color: #d4d4d4;
      margin-bottom: 8px;
      padding-left: 8px;
      border-left: 2px solid #333;
    }
    .rationale-item strong {
      color: #ffb74d;
    }

    /* Visual Wrong Popup */
    .wrong-popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(1);
      z-index: 1000;
      pointer-events: none;
      transition: all 0.2s ease-out;
    }
    .wrong-popup.hidden {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.8);
    }
    .wrong-popup img {
      width: 240px;
      height: auto;
      border-radius: 12px;
      border: 3px solid #ef4444;
      box-shadow: 0 10px 40px rgba(239,68,68,0.5);
    }

    /* Utility */
    .hidden { display: none !important; }
    .card-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 16px;
    }
  </style>
</head>

    /* ==========================================================================

    let hist = {};
    try { hist = JSON.parse(localStorage.getItem('quiz_missed_history') || '{}'); } catch (e) {}
    const saveHistory = () => { try { localStorage.setItem('quiz_missed_history', JSON.stringify(hist)); } catch (e) {} };

    let selectedSubjects = new Set(SUBJECTS.map((_, i) => i));
    let prioritizeMissed = false;
    let quizQuestions = [];
    let userAnswers = {};
    let currentIndex = 0;
    let score = 0;
    let popupTimeout = null;
    let muted = false;
    let viewMode = 'single';

    try { muted = localStorage.getItem('stfuErijah') === '1'; } catch (e) {}
    try { viewMode = localStorage.getItem('quizViewMode') || 'single'; } catch (e) {}

    const $ = id => document.getElementById(id);

    function updateModeButton() {
      const b = $('modeBtn');
      if (!b) return;
      b.textContent = viewMode === 'all' ? 'View: All at Once' : 'View: One by One';
      b.classList.toggle('active', viewMode === 'all');
    }

    function updateStfuButton() {
      const b = $('stfuBtn');
      if (!b) return;
      b.textContent = muted ? 'Bring Back Erijah' : 'STFU Erijah';
      b.classList.toggle('btn-accent', muted);
    }

    function toggleMode() {
      viewMode = viewMode === 'all' ? 'single' : 'all';
      try { localStorage.setItem('quizViewMode', viewMode); } catch (e) {}
      updateModeButton();
      if (quizQuestions.length > 0) renderActiveQuiz();
      else renderHome();
    }

    function toggleStfu() {
      muted = !muted;
      try { localStorage.setItem('stfuErijah', muted ? '1' : '0'); } catch (e) {}
      updateStfuButton();
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    /* ==========================================================================
       DASHBOARD / HOME MENU CONTROLLER
       ========================================================================== */
    function renderHome() {
      quizQuestions = [];
      userAnswers = {};
      currentIndex = 0;
      score = 0;
      updateHeader();

      const missedCount = Object.keys(hist).filter(k => hist[k] > 0).length;
      const totalFiltered = questionBank.filter(q => selectedSubjects.has(q.subjectIndex)).length;

      let html = `
        <div class="dashboard-panel">
          <div class="panel-heading">
            <span>Subject Modules (Week Breakdown)</span>
            <div>
              <button class="btn" onclick="selectAllSubjects(true)">Select All</button>
              <button class="btn" onclick="selectAllSubjects(false)">Clear</button>
            </div>
          </div>
          <div class="chip-grid">
      `;

      SUBJECTS.forEach((sub, idx) => {
        const count = questionBank.filter(q => q.subjectIndex === idx).length;
        const isActive = selectedSubjects.has(idx);
        html += `
          <div class="filter-chip ${isActive ? 'active' : ''}" onclick="toggleSubjectFilter(${idx})">
            <span>[${sub.week}] ${sub.title}</span>
            <span class="chip-count">(${count})</span>
          </div>
        `;
      });

      html += `
          </div>
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-top:16px;">
            <div style="font-size:0.85rem; color:var(--text-muted)">
              Active Pool: <strong style="color:#fff">${totalFiltered}</strong> high-yield questions across <strong style="color:#fff">${selectedSubjects.size}</strong> modules selected.
            </div>
            <button class="btn ${prioritizeMissed ? 'btn-accent' : ''}" onclick="togglePrioritizeMissed()">
              Prioritize Missed (${missedCount})
            </button>
          </div>

          <div style="margin-top:24px; border-top:1px solid #282828; padding-top:20px;">
            <div class="panel-heading" style="margin-bottom:10px;">Select Exam Length & Launch</div>
            <div class="launcher-grid">
              <button class="launcher-btn" onclick="launchQuiz(15)">Quickie (15 Qs)</button>
              <button class="launcher-btn" onclick="launchQuiz(25)">Standard (25 Qs)</button>
              <button class="launcher-btn" onclick="launchQuiz(35)">Intense (35 Qs)</button>
              <button class="launcher-btn" onclick="launchQuiz(50)">Full Exam (50 Qs)</button>
              <button class="launcher-btn" style="border-color:var(--accent);" onclick="launchQuiz(${totalFiltered})">All Selected (${totalFiltered})</button>
            </div>
          </div>
        </div>
      `;

      $('appRoot').innerHTML = html;
      updateModeButton();
      updateStfuButton();
    }

    function toggleSubjectFilter(idx) {
      if (selectedSubjects.has(idx)) {
        if (selectedSubjects.size > 1) selectedSubjects.delete(idx);
      } else {
        selectedSubjects.add(idx);
      }
      renderHome();
    }

    function selectAllSubjects(all) {
      if (all) {
        selectedSubjects = new Set(SUBJECTS.map((_, i) => i));
      } else {
        selectedSubjects = new Set([0]);
      }
      renderHome();
    }

    function togglePrioritizeMissed() {
      prioritizeMissed = !prioritizeMissed;
      renderHome();
    }

    /* ==========================================================================
       QUIZ LAUNCHER & CONTROLLERS
       ========================================================================== */
    function launchQuiz(count) {
      let pool = questionBank.filter(q => selectedSubjects.has(q.subjectIndex));
      if (pool.length === 0) return;

      if (prioritizeMissed) {
        pool.sort((a, b) => (hist[b.id] || 0) - (hist[a.id] || 0));
      } else {
        pool = shuffleArray(pool);
      }

      const takeCount = Math.min(count, pool.length);
      quizQuestions = pool.slice(0, takeCount).map(q => {
        return {
          ...q,
          shuffledOptions: shuffleArray(q.options)
        };
      });

      userAnswers = {};
      currentIndex = 0;
      score = 0;
      renderActiveQuiz();
    }

    function renderActiveQuiz() {
      updateHeader();
      if (viewMode === 'all') {
        renderAllQuestions();
      } else {
        renderSingleQuestion();
      }
    }

    function updateHeader() {
      const total = quizQuestions.length;
      const answeredCount = Object.keys(userAnswers).length;
      const pct = answeredCount > 0 ? Math.round((score / answeredCount) * 100) : 0;

      $('scorePill').textContent = `Score: ${score} / ${answeredCount} (${pct}%)`;
      if (viewMode === 'single') {
        $('progressPill').textContent = total > 0 ? `Q ${currentIndex + 1} of ${total}` : 'Q 0 of 0';
      } else {
        $('progressPill').textContent = total > 0 ? `Answered ${answeredCount} of ${total}` : 'Answered 0 of 0';
      }

      const barPct = total > 0 ? (answeredCount / total) * 100 : 0;
      $('progressBar').style.width = `${barPct}%`;
    }

    /* ==========================================================================
       MODE A: ONE BY ONE
       ========================================================================== */
    function renderSingleQuestion() {
      if (quizQuestions.length === 0) return;
      const q = quizQuestions[currentIndex];
      const hasAnswered = userAnswers[currentIndex] !== undefined;
      const chosenIdx = userAnswers[currentIndex];
      const sub = SUBJECTS[q.subjectIndex];

      let html = `
        <div class="question-card">
          <div class="card-meta">
            <div class="meta-tags">
              <span class="tag tag-week">[${sub.week}] ${sub.title}</span>
              <span class="tag">Ref: ${q.slideRef}</span>
              <span class="tag">${q.difficulty.toUpperCase()}</span>
              ${q.priority ? '<span class="tag tag-priority">&#9733; HIGH YIELD</span>' : ''}
            </div>
            <span>Question ${currentIndex + 1} of ${quizQuestions.length}</span>
          </div>

          <div class="stem-text">${q.stem}</div>

          <div class="options-grid">
      `;

      const keys = ["A", "B", "C", "D"];
      q.shuffledOptions.forEach((opt, idx) => {
        let btnClass = "option-btn";
        if (hasAnswered) {
          if (idx === chosenIdx) {
            btnClass += opt.correct ? " selected-correct" : " selected-incorrect";
          } else if (opt.correct) {
            btnClass += " show-correct";
          }
        }

        html += `
          <button class="${btnClass}" ${hasAnswered ? 'disabled' : ''} onclick="handleAnswer(${currentIndex}, ${idx})">
            <span class="opt-key">${keys[idx]}</span>
            <span>${opt.text}</span>
          </button>
        `;
      });

      html += `</div>`;

      if (hasAnswered) {
        const isCorrect = q.shuffledOptions[chosenIdx].correct;
        html += `
          <div class="rationale-panel">
            <div class="status-banner ${isCorrect ? 'correct' : 'incorrect'}">
              ${isCorrect ? '&#10004; Correct!' : '&#10008; Incorrect.'}
            </div>
        `;
        q.shuffledOptions.forEach((opt, idx) => {
          html += `
            <div class="rationale-item">
              <strong>${keys[idx]}) ${opt.correct ? '[CORRECT]' : '[INCORRECT]'}:</strong> ${opt.why}
            </div>
          `;
        });
        html += `</div>`;
      }

      html += `
        <div class="card-footer">
          ${currentIndex > 0 ? `<button class="btn" style="margin-right:auto;" onclick="prevQuestion()">Previous</button>` : ''}
          ${hasAnswered ? (
            currentIndex < quizQuestions.length - 1
              ? `<button class="btn btn-accent" onclick="nextQuestion()">Next Question &rarr;</button>`
              : `<button class="btn btn-accent" onclick="showSummary()">Finish &amp; Results</button>`
          ) : ''}
        </div>
      </div>`;

      $('appRoot').innerHTML = html;
    }

    function prevQuestion() {
      if (currentIndex > 0) {
        currentIndex--;
        renderSingleQuestion();
        updateHeader();
      }
    }

    function nextQuestion() {
      if (currentIndex < quizQuestions.length - 1) {
        currentIndex++;
        renderSingleQuestion();
        updateHeader();
      }
    }

    /* ==========================================================================
       MODE B: ALL AT ONCE
       ========================================================================== */
    function renderAllQuestions() {
      if (quizQuestions.length === 0) return;
      const keys = ["A", "B", "C", "D"];
      let html = "";

      quizQuestions.forEach((q, qIdx) => {
        const hasAnswered = userAnswers[qIdx] !== undefined;
        const chosenIdx = userAnswers[qIdx];
        const sub = SUBJECTS[q.subjectIndex];

        html += `
          <div class="question-card" id="qcard-${qIdx}">
            <div class="card-meta">
              <div class="meta-tags">
                <span class="tag" style="background:var(--accent); color:#000; font-weight:700;">Q${qIdx + 1}</span>
                <span class="tag tag-week">[${sub.week}] ${sub.title}</span>
                <span class="tag">Ref: ${q.slideRef}</span>
                <span class="tag">${q.difficulty.toUpperCase()}</span>
                ${q.priority ? '<span class="tag tag-priority">&#9733; HIGH YIELD</span>' : ''}
              </div>
            </div>

            <div class="stem-text">${q.stem}</div>

            <div class="options-grid">
        `;

        q.shuffledOptions.forEach((opt, optIdx) => {
          let btnClass = "option-btn";
          if (hasAnswered) {
            if (optIdx === chosenIdx) {
              btnClass += opt.correct ? " selected-correct" : " selected-incorrect";
            } else if (opt.correct) {
              btnClass += " show-correct";
            }
          }

          html += `
            <button class="${btnClass}" ${hasAnswered ? 'disabled' : ''} onclick="handleAnswer(${qIdx}, ${optIdx})">
              <span class="opt-key">${keys[optIdx]}</span>
              <span>${opt.text}</span>
            </button>
          `;
        });

        html += `</div>`;

        if (hasAnswered) {
          const isCorrect = q.shuffledOptions[chosenIdx].correct;
          html += `
            <div class="rationale-panel">
              <div class="status-banner ${isCorrect ? 'correct' : 'incorrect'}">
                ${isCorrect ? '&#10004; Correct!' : '&#10008; Incorrect.'}
              </div>
          `;
          q.shuffledOptions.forEach((opt, optIdx) => {
            html += `
              <div class="rationale-item">
                <strong>${keys[optIdx]}) ${opt.correct ? '[CORRECT]' : '[INCORRECT]'}:</strong> ${opt.why}
              </div>
            `;
          });
          html += `</div>`;
        }

        html += `</div>`;
      });

      const answeredCount = Object.keys(userAnswers).length;
      if (answeredCount === quizQuestions.length) {
        html += `
          <div style="text-align:center; margin:32px 0;">
            <button class="btn btn-accent" style="padding:14px 28px; font-size:1rem;" onclick="showSummary()">
              View Complete Performance Analysis &rarr;
            </button>
          </div>
        `;
      }

      $('appRoot').innerHTML = html;
    }

    /* ==========================================================================
       ANSWER LOGIC & FEEDBACK
       ========================================================================== */
    function handleAnswer(qIdx, optIdx) {
      if (userAnswers[qIdx] !== undefined) return;

      userAnswers[qIdx] = optIdx;
      const q = quizQuestions[qIdx];
      const opt = q.shuffledOptions[optIdx];

      if (opt.correct) {
        score++;
        if (hist[q.id]) {
          hist[q.id] = Math.max(0, hist[q.id] - 1);
          saveHistory();
        }
      } else {
        hist[q.id] = (hist[q.id] || 0) + 1;
        saveHistory();
        triggerWrongFeedback();
      }

      updateHeader();

      if (viewMode === 'all') {
        const scrollY = window.scrollY;
        renderAllQuestions();
        window.scrollTo(0, scrollY);
      } else {
        renderSingleQuestion();
      }
    }

    function triggerWrongFeedback() {
      if (muted) return;

      const audio = $('wrongAudio');
      if (audio) {
        audio.currentTime = 0;
        audio.play().catch(() => {});
      }

      const popup = $('wrongPopup');
      if (popup) {
        popup.classList.remove('hidden');
        if (popupTimeout) clearTimeout(popupTimeout);
        popupTimeout = setTimeout(() => {
          popup.classList.add('hidden');
        }, 1200);
      }
    }

    /* ==========================================================================
       RESULTS SUMMARY
       ========================================================================== */
    function showSummary() {
      const total = quizQuestions.length;
      const answeredCount = Object.keys(userAnswers).length;
      const pct = answeredCount > 0 ? Math.round((score / total) * 100) : 0;

      let html = `
        <div class="dashboard-panel" style="text-align:center; padding:36px 20px;">
          <h2 style="font-size:1.6rem; color:var(--accent); margin-bottom:8px;">Exam Completed</h2>
          <p style="color:var(--text-muted); margin-bottom:24px;">Sys Phys Midterm 2 Mastery Assessment</p>

          <div style="font-size:3rem; font-weight:800; color:#fff; margin-bottom:12px;">
            ${score} / ${total}
          </div>
          <div class="pill" style="font-size:1rem; padding:6px 16px; margin-bottom:24px; display:inline-block;">
            Overall Accuracy: ${pct}%
          </div>

          <div style="margin-top:20px; display:flex; justify-content:center; gap:12px; flex-wrap:wrap;">
            <button class="btn btn-accent" onclick="launchQuiz(${total})">Retake Same Exam</button>
            <button class="btn" onclick="renderHome()">Return to Dashboard</button>
          </div>
        </div>
      `;

      $('appRoot').innerHTML = html;
      window.scrollTo(0, 0);
    }

    window.onload = () => {
      renderHome();
    };
  </script>
</body>
</html>
