            {

                explanation: "<strong>1. Overarching Core Takeaway:</strong> Specialized dendritic cells possess unique intracellular trafficking pathways that route extracellular antigens onto class I molecules to initiate cytotoxic immunity.<br><br><strong>2. Option-by-Option Rationale Breakdown:</strong><br>• A) Presentation of MHC I to CD4 T-cells: Incorrect. MHC I presents to CD8 cells.<br>• B) Secretory release of immunoglobulins: Incorrect. This describes plasma cell antibody secretion.<br>• C) Processing of exogenous antigens onto MHC Class I for CD8 T-cell activation: Correct. Cross-presentation allows professional APCs to load exogenous extracellular antigens onto MHC Class I molecules to stimulate CD8+ T-cells.<br>• D) Degranulation of mast cells: Incorrect. Mast cell degranulation releases histamine."

            {
                question: "Human Leukocyte Antigen (HLA) B27 positivity is strongly associated with which clinical condition?",
                options: ["Rheumatoid Arthritis", "Systemic Lupus", "Multiple Sclerosis", "Ankylosing Spondylitis"],
                correct: 3,
                explanation: "<strong>1. Overarching Core Takeaway:</strong> Specific genetic polymorphisms in major histocompatibility complex alleles confer robust relative risk for distinct autoimmune seronegative arthropathies.<br><br><strong>2. Option-by-Option Rationale Breakdown:</strong><br>• A) Rheumatoid Arthritis: Incorrect. Rheumatoid arthritis is associated with HLA-DR4.<br>• B) Systemic Lupus: Incorrect. Lupus is linked to complement and class II genetic loci.<br>• C) Multiple Sclerosis: Incorrect. Multiple sclerosis is associated with HLA-DR2.<br>• D) Ankylosing Spondylitis: Correct. HLA-B27 is a specialized MHC Class I genetic variant strongly associated with ankylosing spondylitis."
            },
            {
                question: "HLA-DR4 marker presence is clinically associated with an increased susceptibility to:",
                options: ["Rheumatoid Arthritis", "Ankylosing Spondylitis", "Gouty Arthritis", "Osteoarthritis"],
                correct: 0,
                explanation: "<strong>1. Overarching Core Takeaway:</strong> Autoimmune disease genetic susceptibilities are frequently mapped to specific class II human leukocyte antigen alleles.<br><br><strong>2. Option-by-Option Rationale Breakdown:</strong><br>• A) Rheumatoid Arthritis: Correct. HLA-DR4 is an MHC Class II genetic allele associated with increased susceptibility to rheumatoid arthritis.<br>• B) Ankylosing Spondylitis: Incorrect. Ankylosing spondylitis is linked to HLA-B27.<br>• C) Gouty Arthritis: Incorrect. Gout is caused by metabolic uric acid crystal deposition.<br>• D) Osteoarthritis: Incorrect. Osteoarthritis is a degenerative mechanical joint disease."
            },
            {
                question: "Which of the following is NOT one of the three professional Antigen-Presenting Cells (APCs)?",

                correct: 1,
                explanation: "<strong>1. Overarching Core Takeaway:</strong> Professional antigen-presenting cells express constitutive MHC Class II molecules to activate naive helper T-lymphocytes, excluding professional phagocytic neutrophils.<br><br><strong>2. Option-by-Option Rationale Breakdown:</strong><br>• A) Dendritic cell: Incorrect. Dendritic cells are professional APCs.<br>• B) Neutrophil: Correct. Neutrophils act as acute innate phagocytes rather than professional APCs expressing MHC Class II.<br>• C) Macrophage: Incorrect. Macrophages function as professional APCs.<br>• D) B-cell: Incorrect. B-cells are professional APCs that internalize specific antigens."
            },
            {
                question: "How do B-lymphocytes internalize antigens prior to presenting them on MHC II?",
                options: ["Phagocytosis", "Pinocytosis", "Endocytosis via Immunoglobulin receptors", "Diapedesis"],
                correct: 2,
                explanation: "<strong>1. Overarching Core Takeaway:</strong> Humoral antigen capture relies on specific surface receptor engagement followed by targeted receptor-mediated endocytosis.<br><br><strong>2. Option-by-Option Rationale Breakdown:</strong><br>• A) Phagocytosis: Incorrect. Phagocytosis is utilized by macrophages and neutrophils for particulate engulfment.<br>• B) Pinocytosis: Incorrect. Pinocytosis is nonspecific fluid-phase uptake.<br>• C) Endocytosis via Immunoglobulin receptors: Correct. B-lymphocytes bind soluble antigens via surface immunoglobulin B-cell receptors (BCRs) and internalize them via receptor-mediated endocytosis.<br>• D) Diapedesis: Incorrect. Diapedesis is leukocyte transendothelial migration."
            },
            {
                question: "What term describes the exact molecular region of an antigen recognized by immune cell receptors?",
                options: ["PAMP", "DAMP", "Haptoglobin", "Epitope (Antigenic determinant)"],
                correct: 3,
                explanation: "<strong>1. Overarching Core Takeaway:</strong> Adaptive immune receptors bind specific structural chemical determinants displayed on the surface of complex macromolecules.<br><br><strong>2. Option-by-Option Rationale Breakdown:</strong><br>• A) PAMP: Incorrect. PAMPs are conserved microbial pathogen-associated molecular patterns.<br>• B) DAMP: Incorrect. DAMPs are damage-associated endogenous molecules.<br>• C) Haptoglobin: Incorrect. Haptoglobin is a plasma protein that binds free hemoglobin.<br>• D) Epitope (Antigenic determinant): Correct. An epitope or antigenic determinant is the precise 3D surface fragment of an antigen recognized by antibodies or lymphocyte receptors."
            },
            {
                question: "Toll-Like Receptors (TLRs) on innate immune cells recognize which conserved microbial structures?",
                options: ["Pathogen-Associated Molecular Patterns (PAMPs)", "Human Leukocyte Antigens (HLAs)", "Major Histocompatibility Complexes", "Immunoglobulins"],
                correct: 0,
                explanation: "<strong>1. Overarching Core Takeaway:</strong> Innate pattern recognition receptors provide rapid sentinel detection by binding invariant molecular motifs shared across broad classes of microbes.<br><br><strong>2. Option-by-Option Rationale Breakdown:</strong><br>• A) Pathogen-Associated Molecular Patterns (PAMPs): Correct. Toll-Like Receptors (TLRs) are innate pattern recognition receptors that bind conserved microbial structures known as PAMPs.<br>• B) Human Leukocyte Antigens (HLAs): Incorrect. HLAs are host major histocompatibility proteins.<br>• C) Major Histocompatibility Complexes: Incorrect. MHC molecules present peptides to T-cells.<br>• D) Immunoglobulins: Incorrect. Immunoglobulins are adaptive humoral antibodies."
            },
            {
                question: "What are DAMPs (Damage-Associated Molecular Patterns)?",
                options: ["Viral DNA fragments", "Molecular patterns displayed by injured or dying host cells", "Extracellular bacterial toxins", "Fungal cell wall components"],
                correct: 1,
                explanation: "<strong>1. Overarching Core Takeaway:</strong> Sterile inflammatory responses are initiated when endogenous intracellular molecules released from damaged cells act as danger signals.<br><br><strong>2. Option-by-Option Rationale Breakdown:</strong><br>• A) Viral DNA fragments: Incorrect. Viral fragments represent exogenous pathogen nucleic acids.<br>• B) Molecular patterns displayed by injured or dying host cells: Correct. DAMPs are endogenous chemical signals released or displayed by injured, necrotic, or dying host cells to recruit scavenger phagocytes.<br>• C) Extracellular bacterial toxins: Incorrect. Toxins are exogenous microbial virulence factors.<br>• D) Fungal cell wall components: Incorrect. Fungal walls consist of exogenous PAMP structures."
            },
            {
                question: "In the intrinsic coagulation cascade, which contact factor initiates the conversion cascade down to fibrin?",
                options: ["Factor VII", "Factor X", "Factor XII (Hageman Factor)", "Prothrombin"],
                correct: 2,
                explanation: "<strong>1. Overarching Core Takeaway:</strong> Hemostatic pathway activation via surface contact triggers sequential enzymatic cleavages culminating in insoluble fibrin clot formation.<br><br><strong>2. Option-by-Option Rationale Breakdown:</strong><br>• A) Factor VII: Incorrect. Factor VII initiates the extrinsic tissue factor pathway.<br>• B) Factor X: Incorrect. Factor X operates downstream within the common pathway.<br>• C) Factor XII (Hageman Factor): Correct. Factor XII is activated upon contacting damaged negative subendothelial collagen, initiating the intrinsic coagulation cascade.<br>• D) Prothrombin: Incorrect. Prothrombin is cleaved into thrombin within the common pathway."
            },
            {
                question: "Which cytokine is released by mast cells to recruit eosinophils to sites of allergic inflammation?",
                options: ["Interleukin-1", "Interleukin-6", "TNF-alpha", "Interleukin-5"],
                correct: 3,
                explanation: "<strong>1. Overarching Core Takeaway:</strong> Specialized allergic immune cascades rely on targeted leukocyte chemotactic cytokines to recruit secondary effector granulocytes.<br><br><strong>2. Option-by-Option Rationale Breakdown:</strong><br>• A) Interleukin-1: Incorrect. IL-1 functions as an endogenous pyrogen.<br>• B) Interleukin-6: Incorrect. IL-6 stimulates acute-phase hepatic protein synthesis.<br>• C) TNF-alpha: Incorrect. TNF-alpha mediates systemic inflammation and cachexia.<br>• D) Interleukin-5: Correct. Interleukin-5 (IL-5) is released during allergic responses to selectively attract, activate, and prolong the survival of eosinophils."
            },
            {
                question: "Natural Killer (NK) cells are lymphocytes that participate in innate responses because they do NOT require:",
                options: ["MHC Class I recognition", "Cytokine stimulation", "Phagocytic vacuoles", "Perforins"],
                correct: 0,
                explanation: "<strong>1. Overarching Core Takeaway:</strong> Innate lymphoid surveillance operates independently of classical adaptive antigen receptor gene rearrangement or prior sensitization.<br><br><strong>2. Option-by-Option Rationale Breakdown:</strong><br>• A) MHC Class I recognition: Correct. NK cells do not require specific antigen presentation on MHC Class I to initiate lysis; instead, they target cells exhibiting absent self-MHC Class I molecules.<br>• B) Cytokine stimulation: Incorrect. Cytokines modulate NK cell activation and proliferation.<br>• C) Phagocytic vacuoles: Incorrect. NK cells utilize extracellular lytic granule release rather than phagocytosis.<br>• D) Perforins: Incorrect. Perforins form pores in target cell membranes to mediate lysis."
            },
            {
                question: "What is the tissue counterpart name for macrophages present in the Central Nervous System (CNS)?",
                options: ["Kupffer cells", "Microglia", "Alveolar macrophages", "Langerhans cells"],
                correct: 1,
                explanation: "<strong>1. Overarching Core Takeaway:</strong> Specialized immune sentinel networks populate the central nervous system under distinct anatomical nomenclature.<br><br><strong>2. Option-by-Option Rationale Breakdown:</strong><br>• A) Kupffer cells: Incorrect. Kupffer cells reside within hepatic sinusoids.<br>• B) Microglia: Correct. Microglia are resident mononuclear phagocytes of the central nervous system.<br>• C) Alveolar macrophages: Incorrect. Alveolar macrophages patrol pulmonary air spaces.<br>• D) Langerhans cells: Incorrect. Langerhans cells inhabit the epidermal skin layer."
            },
            {
                question: "Langerhans cells represent the tissue macrophage resident in which organ?",
                options: ["Lungs", "Peripheral Nerves", "Skin", "Spleen"],
                correct: 2,
                explanation: "<strong>1. Overarching Core Takeaway:</strong> Cutaneous immune defense relies on specialized resident dendritic macrophage networks located within integumentary epithelial layers.<br><br><strong>2. Option-by-Option Rationale Breakdown:</strong><br>• A) Lungs: Incorrect. Pulmonary tissue macrophages are termed alveolar dust cells.<br>• B) Peripheral Nerves: Incorrect. Peripheral nerves contain specialized Schwann cell support structures.<br>• C) Skin: Correct. Langerhans cells are resident dendritic cells and macrophages located within the epidermal layer of the skin.<br>• D) Spleen: Incorrect. Spleen architecture features littoral and red pulp macrophages."
            },
            {
                question: "Which cytokine secreted by inflammatory macrophages is known as the 'death factor' or cachectin?",
                options: ["IL-1", "IL-6", "IFN-gamma", "TNF-alpha"],
                correct: 3,
                explanation: "<strong>1. Overarching Core Takeaway:</strong> Potent systemic inflammatory cytokines induce metabolic wasting and apoptotic cellular necrosis during chronic disease states.<br><br><strong>2. Option-by-Option Rationale Breakdown:</strong><br>• A) IL-1: Incorrect. IL-1 acts primarily as an endogenous pyrogen.<br>• B) IL-6: Incorrect. IL-6 stimulates acute-phase reactant production.<br>• C) IFN-gamma: Incorrect. Interferon-gamma activates macrophage antimicrobial functions.<br>• D) TNF-alpha: Correct. Tumor Necrosis Factor-alpha (TNF-a) is termed the 'death factor' and cachectin due to its role in cell necrosis and systemic metabolic cachexia."
            }
        ];

        let activeQuizData = [];
        let currentScore = 0;
        let answeredCount = 0;

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function renderQuiz() {
            activeQuizData = shuffleArray(JSON.parse(JSON.stringify(originalQuizData)));

            const container = document.getElementById('quiz-container');
            container.innerHTML = '';

            activeQuizData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'quiz-card';
                card.id = `card-${index}`;

                const qNum = document.createElement('div');
                qNum.className = 'question-number';
                qNum.innerText = `Question ${index + 1} of ${activeQuizData.length}`;

                const qText = document.createElement('div');
                qText.className = 'question-text';
                qText.innerText = item.question;

                const optionsGrid = document.createElement('div');
                optionsGrid.className = 'options-grid';

                item.options.forEach((opt, optIdx) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerText = `${String.fromCharCode(65 + optIdx)}. ${opt}`;
                    btn.onclick = () => handleAnswer(index, optIdx);
                    optionsGrid.appendChild(btn);
                });

                const exp = document.createElement('div');
                exp.className = 'explanation';
                exp.id = `exp-${index}`;
                exp.innerHTML = item.explanation;

                card.appendChild(qNum);
                card.appendChild(qText);
                card.appendChild(optionsGrid);
                card.appendChild(exp);

                container.appendChild(card);
            });

            updateHeader();
        }

        function handleAnswer(qIndex, selectedOpt) {
            const card = document.getElementById(`card-${qIndex}`);
            const buttons = card.querySelectorAll('.option-btn');
            const exp = document.getElementById(`exp-${qIndex}`);
            const correctOpt = activeQuizData[qIndex].correct;

            buttons.forEach(btn => btn.disabled = true);

            if (selectedOpt === correctOpt) {
                buttons[selectedOpt].classList.add('correct');
                currentScore++;
            } else {
                buttons[selectedOpt].classList.add('incorrect');
                buttons[correctOpt].classList.add('correct');
            }

            exp.style.display = 'block';
            answeredCount++;

            updateHeader();

            if (answeredCount === activeQuizData.length) {
                showSummary();
            }
        }

        function updateHeader() {
            const total = activeQuizData.length;
            const pct = total === 0 ? 0 : Math.round((currentScore / total) * 100);
            document.getElementById('score-display').innerText = `Score: ${currentScore} / ${total} (${pct}%)`;
        }

        function showSummary() {
            const total = activeQuizData.length;
            const pct = Math.round((currentScore / total) * 100);
            const summaryCard = document.getElementById('summary-card');
            const finalScore = document.getElementById('final-score');
            const feedback = document.getElementById('summary-feedback');

            finalScore.innerText = `${pct}%`;

            if (pct >= 90) {
                feedback.innerText = "Mastery demonstrated! Outstanding recall of immunology and cellular defense concepts.";
            } else if (pct >= 75) {
                feedback.innerText = "Great job! Review the questions you missed to reinforce high-yield points.";
            } else {
                feedback.innerText = "Good effort! Consider reviewing Week 2 lecture notes and retrying the assessment.";
            }

            summaryCard.style.display = 'block';
            summaryCard.scrollIntoView({ behavior: 'smooth' });
        }

        function resetQuiz() {
            currentScore = 0;
            answeredCount = 0;
            document.getElementById('summary-card').style.display = 'none';
            renderQuiz();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.onload = renderQuiz;
    </script>
