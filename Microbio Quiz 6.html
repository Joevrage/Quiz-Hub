                concept: "Toxoplasma gondii causes toxoplasmosis. Cats are the definitive host and shed infectious oocysts in feces; humans acquire it via cat litter or undercooked meat containing tissue pseudocysts, posing a major congenital risk to the fetus during pregnancy.",

            {

                difficulty: "Apicomplexa / Sporozoa",
                stem: "Aside from handling contaminated cat litter, what is the other major route by which humans acquire Toxoplasma gondii infection?",
                concept: "Cats become infected by eating rodents or birds harboring T. gondii tissue pseudocysts, and humans can similarly ingest tissue pseudocysts by eating undercooked or raw meat (such as pork).",
                options: [

                concept: "Boiling kills both the waterborne cysts of fecal-oral intestinal pathogens (Giardia, E. histolytica) and the free-living trophozoites of Naegleria fowleri in tap water that could otherwise enter the brain via the olfactory nerve during nasal rinsing.",

                    {

        let currentMode = 'full';
        let currentSet = [];
        let round = 1;
        let answers = {};
        let popupTimeout = null;

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function prepareSet(baseData) {
            const cloned = baseData.map(q => ({
                ...q,
                options: shuffleArray(q.options.map(opt => ({ ...opt })))
            }));
            return shuffleArray(cloned);
        }

        function el(tag, className, textContent) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (textContent !== undefined) node.textContent = textContent;
            return node;
        }

        function updateScore() {
            const total = currentSet.length;
            const correctCount = Object.values(answers).filter(Boolean).length;
            const pct = total > 0 ? Math.round((correctCount / total) * 100) : 0;
            const prefix = round === 1 ? 'Score' : `Review ${round - 1}`;
            document.getElementById('scoreTracker').textContent = `${prefix}: ${correctCount} / ${total} (${pct}%)`;
            return { correctCount, total, pct };
        }

        function getTierMessage(pct) {
            if (pct >= 90) {
                return "Absolute Gigachad. You drained that test dry.";
            } else if (pct >= 70) {
                return "You lasted less than 30 seconds. Time for a rematch.";
            } else {
                return "You really didn’t fucking know that.";
            }
        }

        function showSummary(stats) {
            const summaryCard = document.getElementById('summary');
            const titleEl = document.getElementById('summaryTitle');
            const scoreEl = document.getElementById('finalScoreText');
            const tierEl = document.getElementById('finalTierText');
            const reviewBtn = document.getElementById('reviewBtn');

            titleEl.textContent = round === 1 ? 'Quiz Complete' : `Review Round ${round - 1} Complete`;
            scoreEl.textContent = `${stats.correctCount} / ${stats.total} (${stats.pct}%)`;
            tierEl.textContent = getTierMessage(stats.pct);

            const missedCount = currentSet.filter(q => answers[q.id] === false).length;
            if (missedCount > 0) {
                reviewBtn.style.display = 'inline-block';
                reviewBtn.textContent = `Review Missed (${missedCount})`;
            } else {
                reviewBtn.style.display = 'none';
            }

            summaryCard.classList.remove('hidden');
            summaryCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function handleSelect(q, selectedIdx, card) {
            if (answers[q.id] !== undefined) return;

            const chosen = q.options[selectedIdx];
            const isCorrect = Boolean(chosen.correct);
            answers[q.id] = isCorrect;

            const buttons = card.querySelectorAll('.option-btn');
            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (q.options[idx].correct) {
                    btn.classList.add('correct');
                } else if (idx === selectedIdx && !isCorrect) {
                    btn.classList.add('incorrect');
                }
            });

            if (!isCorrect) {
                const wrongAudio = document.getElementById('wrongAudio');
                if (wrongAudio) {
                    wrongAudio.currentTime = 0;
                    wrongAudio.play().catch(err => console.log("Audio play blocked:", err));
                }

                const popup = document.getElementById('wrongPopup');
                if (popup) {
                    popup.classList.remove('hidden');
                    clearTimeout(popupTimeout);
                    popupTimeout = setTimeout(() => {
                        popup.classList.add('hidden');
                    }, 2000);
                }
            }

            const expBox = el('div', 'explanation-box');
            const banner = el(
                'div',
                `status-banner ${isCorrect ? 'correct' : 'incorrect'}`,
                isCorrect ? 'Correct!' : 'Incorrect.'
            );
            expBox.appendChild(banner);

            const conceptP = el('p', 'concept-summary', q.concept);
            expBox.appendChild(conceptP);

            const list = el('ul', 'rationale-list');
            q.options.forEach((opt, idx) => {
                const letter = String.fromCharCode(65 + idx);
                const li = el('li', opt.correct ? 'is-correct' : '');
                const strong = el('strong', '', `${letter}) ${opt.text}: `);
                li.appendChild(strong);
                li.appendChild(document.createTextNode(opt.rationale));
                list.appendChild(li);
            });
            expBox.appendChild(list);

            card.appendChild(expBox);

            const stats = updateScore();
            if (Object.keys(answers).length === currentSet.length) {
                showSummary(stats);
            }
        }

        function renderQuiz(sourceSet) {
            answers = {};
            const base = sourceSet || (currentMode === 'quick' ? shuffleArray([...quizData]).slice(0, 15) : quizData);
            currentSet = prepareSet(base);

            const container = document.getElementById('quiz');
            container.innerHTML = '';
            document.getElementById('summary').classList.add('hidden');

            currentSet.forEach((q, qIdx) => {
                const card = el('div', 'question-card');

                const meta = el('div', 'question-meta');
                meta.appendChild(el('span', 'badge', `Question ${qIdx + 1} of ${currentSet.length}`));
                meta.appendChild(el('span', 'badge', q.difficulty));
                card.appendChild(meta);

                card.appendChild(el('div', 'question-text', q.stem));

                const opts = el('div', 'options-list');
                q.options.forEach((opt, i) => {
                    const btn = el('button', 'option-btn');
                    btn.type = 'button';
                    btn.appendChild(el('span', 'option-letter', String.fromCharCode(65 + i) + ')'));
                    btn.appendChild(el('span', '', opt.text));
                    btn.addEventListener('click', () => handleSelect(q, i, card));
                    opts.appendChild(btn);
                });
                card.appendChild(opts);

                container.appendChild(card);
            });

            updateScore();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        document.getElementById('fullQuizBtn').addEventListener('click', () => {
            currentMode = 'full';
            round = 1;
            document.getElementById('fullQuizBtn').classList.add('active');
            document.getElementById('quickQuizBtn').classList.remove('active');
            renderQuiz(quizData);
        });

        document.getElementById('quickQuizBtn').addEventListener('click', () => {
            currentMode = 'quick';
            round = 1;
            document.getElementById('quickQuizBtn').classList.add('active');
            document.getElementById('fullQuizBtn').classList.remove('active');
            renderQuiz(shuffleArray([...quizData]).slice(0, 15));
        });

        document.getElementById('retakeBtn').addEventListener('click', () => {
            round = 1;
            if (currentMode === 'quick') {
                renderQuiz(shuffleArray([...quizData]).slice(0, 15));
            } else {
                renderQuiz(quizData);
            }
        });

        document.getElementById('reviewBtn').addEventListener('click', () => {
            const missed = currentSet.filter(q => answers[q.id] === false);
            if (missed.length > 0) {
                round++;
                renderQuiz(missed);
            }
        });

        window.onload = () => renderQuiz(quizData);
    </script>
