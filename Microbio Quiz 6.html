<script>
const DATA=[{"t":"Algae","s":"Which statement about the medical significance of algae is accurate?","c":"Algae are photosynthetic autotrophs that use chlorophyll a and are rarely infectious. Their main medical threat is poisoning from toxins that concentrate in seafood. Being photosynthetic is not the threat.","src":"Protozoan Pt1, Slide 4","o":[["Their main threat is toxins that accumulate in seafood","Algae are mainly harmful through toxins, as in red tide.","Protozoan Pt1, Slide 4"],["Their main threat is that they are photosynthetic","Slides 3–4 describe algae as photosynthetic autotrophs that are not pathogenic. Photosynthesis is not what harms people; the threat is food poisoning from marine algal toxins.","Protozoan Pt1, Slide 3; Protozoan Pt1, Slide 4"],["Their main threat is invasion of the bloodstream","Slide 4 says algae are rarely infectious because animal tissues are inhospitable. Prototheca is the only exception, and it causes skin and subcutaneous infection (slide 5), not bloodstream invasion.","Protozoan Pt1, Slide 4"],["Their main threat is transmission by insect vectors","Insect vectors appear only on protozoan disease slides (tsetse fly, kissing bug, sand fly, Anopheles). None of the algae slides mention a vector.","Protozoan Pt2, Slide 11; Protozoan Pt2, Slide 14; Protozoan Pt2, Slide 16; Protozoan Pt2, Slide 31"]]},
{"t":"Algae","s":"Which alga is the exception that lacks photosynthesis and can cause skin and subcutaneous infections with blister-like lesions?","c":"Prototheca is the non-photosynthetic alga linked to skin and subcutaneous infection.","src":"Protozoan Pt1, Slide 5","o":[["Prototheca","Non-photosynthetic and associated with skin and subcutaneous infection.","Protozoan Pt1, Slide 5"],["Dinophysis","Slide 8 ties Dinophysis dinoflagellates to diarrhetic shellfish poisoning, a toxin food poisoning with mild GI symptoms. It is not the non-photosynthetic skin pathogen.","Protozoan Pt1, Slide 8"],["Alexandrium","Slide 10 lists Alexandrium as a source of paralytic shellfish toxin. That is neurologic poisoning from eating shellfish, not a skin infection.","Protozoan Pt1, Slide 10"],["Nitzschia","Slide 6 identifies Nitzschia pungens as the source of domoic acid (amnesic shellfish poisoning), causing GI and neurologic distress.","Protozoan Pt1, Slide 6"]]},
{"t":"Algae","s":"Algae carry out photosynthesis using which pigment?","c":"Algae photosynthesize with chlorophyll a, a fact that has appeared on boards.","src":"Protozoan Pt1, Slide 3","o":[["Chlorophyll a","Stated pigment of algae.","Protozoan Pt1, Slide 3"],["Ergosterol","Ergosterol is a sterol in the fungal cell membrane (Fungi deck), not a photosynthetic pigment.","Fungi, Slide 10"],["Chitin","Chitin is a fungal cell wall polysaccharide (Fungi deck). It is structural, not a pigment.","Fungi, Slide 10"],["Mycolic acid","Mycolic acid is the waxy lipid in the acid-fast Mycobacteria cell wall. It has no role in photosynthesis.","Lecture 2, Slide 26"]]},
{"t":"Algae","s":"Which algal poisoning comes from eating reef fish, is not destroyed by cooking, and has no antidote?","c":"Ciguatera fish poisoning is caused by dinoflagellate toxins in reef fish. Cooking does not destroy the toxin and there is no antidote.","src":"Protozoan Pt1, Slide 7","o":[["Ciguatera fish poisoning","Heat-stable toxin in fish with no antidote.","Protozoan Pt1, Slide 7"],["Amnesic shellfish poisoning","Slide 6 describes amnesic poisoning from shellfish (domoic acid, Nitzschia). Only slide 7 combines fish, heat-stable toxin, and no antidote.","Protozoan Pt1, Slide 6"],["Neurotoxic shellfish poisoning","Slide 9 covers shellfish toxin that causes GI and neurologic distress and is not fatal. It does not describe a fish source or a lack of antidote.","Protozoan Pt1, Slide 9"],["Paralytic shellfish poisoning","Slide 10 covers shellfish toxin from Alexandrium and related organisms in the Pacific Northwest. It lists no fish source and no antidote statement.","Protozoan Pt1, Slide 10"]]},
{"t":"Algae","s":"Which algal poisoning is NOT fatal?","c":"Neurotoxic shellfish poisoning causes GI and neurological distress but is not fatal, and its toxin can be aerosolized and trigger asthma-like symptoms.","src":"Protozoan Pt1, Slide 9","o":[["Neurotoxic shellfish poisoning","Not fatal. Source is Ptychodiscus brevis.","Protozoan Pt1, Slide 9"],["Ciguatera fish poisoning","Slide 7 says ciguatera can cause paralysis and death, with no antidote.","Protozoan Pt1, Slide 7"],["Amnesic shellfish poisoning","Slide 6 says amnesic shellfish poisoning can be fatal.","Protozoan Pt1, Slide 6"],["Paralytic shellfish poisoning","Slide 10 says paralytic shellfish poisoning can be fatal.","Protozoan Pt1, Slide 10"]]},
{"t":"Algae","s":"Domoic acid from Nitzschia pungens causes which poisoning?","c":"Amnesic shellfish poisoning is triggered by domoic acid, causes GI and neurological distress, and can be fatal.","src":"Protozoan Pt1, Slide 6","o":[["Amnesic shellfish poisoning","Domoic acid is the toxin.","Protozoan Pt1, Slide 6"],["Diarrhetic shellfish poisoning","Slide 8 attributes diarrhetic poisoning to Dinophysis dinoflagellate toxins with mild GI discomfort. Domoic acid is not listed.","Protozoan Pt1, Slide 8"],["Neurotoxic shellfish poisoning","Slide 9 attributes neurotoxic poisoning to the dinoflagellate Ptychodiscus brevis, not Nitzschia.","Protozoan Pt1, Slide 9"],["Ciguatera fish poisoning","Slide 7 attributes ciguatera to dinoflagellate toxins in fish. Domoic acid comes from Nitzschia (slide 6).","Protozoan Pt1, Slide 7"]]},
{"t":"Algae","s":"Which poisoning predominantly occurs in the Pacific Northwest and Alaska and can be fatal?","c":"Paralytic shellfish poisoning comes from Alexandrium, Gymnodinium, and Pyrodinium toxins and causes neurologic distress.","src":"Protozoan Pt1, Slide 10","o":[["Paralytic shellfish poisoning","Regional pattern and potential fatality match.","Protozoan Pt1, Slide 10"],["Diarrhetic shellfish poisoning","Slide 8 gives no region for diarrhetic poisoning and describes only mild GI discomfort, so it does not fit a potentially fatal, region-specific poisoning.","Protozoan Pt1, Slide 8"],["Neurotoxic shellfish poisoning","Slide 9 gives no region and says neurotoxic poisoning is not fatal.","Protozoan Pt1, Slide 9"],["Amnesic shellfish poisoning","Slide 6 gives no geographic pattern for amnesic poisoning. The Pacific Northwest and Alaska pattern appears only on slide 10.","Protozoan Pt1, Slide 6"]]},
{"t":"Protozoan Structure","s":"Which structure do protozoans lack?","c":"Protozoans have a cell membrane but no cell wall. Bacteria use peptidoglycan and fungi use chitin, glucan, or mannan.","src":"Protozoan Pt1, Slide 12","o":[["Cell wall","All protozoans lack a cell wall.","Protozoan Pt1, Slide 12"],["Cell membrane","Slide 12 says protozoans have a cell membrane, so it is present.","Protozoan Pt1, Slide 12"],["Ectoplasm","Slide 13 lists ectoplasm as the outer cytoplasmic layer, so it is present.","Protozoan Pt1, Slide 13"],["Endoplasm","Slide 13 lists endoplasm as the inner cytoplasmic layer, so it is present.","Protozoan Pt1, Slide 13"]]},
{"t":"Protozoan Structure","s":"Which layer of protozoan cytoplasm is involved in locomotion, feeding, and protection?","c":"Ectoplasm is the outer layer for locomotion, feeding, and protection. Endoplasm is the inner layer.","src":"Protozoan Pt1, Slide 13","o":[["Ectoplasm","Outer layer with these functions.","Protozoan Pt1, Slide 13"],["Endoplasm","Slide 13 assigns the nucleus, mitochondria, and food and contractile vacuoles to the endoplasm, not these functions.","Protozoan Pt1, Slide 13"],["Both layers","The slide splits the layers: ectoplasm handles locomotion, feeding, and protection, and endoplasm houses organelles.","Protozoan Pt1, Slide 13"],["Neither layer","The ectoplasm performs these functions, so neither is incorrect.","Protozoan Pt1, Slide 13"]]},
{"t":"Protozoan Structure","s":"Which layer of protozoan cytoplasm houses the nucleus and mitochondria?","c":"Endoplasm is the inner layer that holds the nucleus, mitochondria, and food and contractile vacuoles.","src":"Protozoan Pt1, Slide 13","o":[["Endoplasm","Inner layer with the organelles.","Protozoan Pt1, Slide 13"],["Ectoplasm","Slide 13 gives the ectoplasm locomotion, feeding, and protection, not the organelles.","Protozoan Pt1, Slide 13"],["Both layers","The organelles are listed under the endoplasm only.","Protozoan Pt1, Slide 13"],["Neither layer","The endoplasm houses the nucleus and mitochondria, so neither is incorrect.","Protozoan Pt1, Slide 13"]]},
{"t":"Life Cycle","s":"Which protozoan stage is the normal motile feeding stage?","c":"The trophozoite is the normal motile feeding stage and needs ample food and moisture. The cyst forms when conditions become unsuitable.","src":"Protozoan Pt1, Slide 17","o":[["Trophozoite","Active, motile, feeding.","Protozoan Pt1, Slide 17"],["Cyst","Slide 17 says the cyst forms when conditions become unsuitable for growth and feeding. It is the dormant survival stage.","Protozoan Pt1, Slide 17"],["Both stages","Only the trophozoite is the motile feeding stage; the cyst is not.","Protozoan Pt1, Slide 17"],["Neither stage","The trophozoite is defined on slide 17 as the normal motile feeding stage.","Protozoan Pt1, Slide 17"]]},
{"t":"Life Cycle","s":"Which statement about encystment is accurate?","c":"Encystment is the trophozoite rounding into a sphere and secreting a thick cuticle when the environment becomes unsuitable. The reverse change is not encystment.","src":"Protozoan Pt1, Slide 17","o":[["A trophozoite rounds up and secretes a thick cuticle","Defines encystment.","Protozoan Pt1, Slide 17"],["A cyst changes into a trophozoite","Slide 17 defines encystment as the trophozoite rounding up and secreting a thick cuticle. The cyst-to-trophozoite change is the reverse process.","Protozoan Pt1, Slide 17"],["A cyst divides by multiple fission","Multiple fission (schizogony) is asexual reproduction performed only by Sporozoea (slide 20). Encystment is a survival response, not reproduction.","Protozoan Pt1, Slide 20"],["A trophozoite fuses with another cell","Fusion and gamete exchange are sexual processes such as ciliate conjugation (slide 21). Encystment involves one cell forming a cuticle (slide 17).","Protozoan Pt1, Slide 21"]]},
{"t":"Life Cycle","s":"A protozoan passed by the fecal-oral route is taken into the body in which form?","c":"Fecal-oral intestinal protozoans such as Giardia, E. histolytica, and Balantidium are ingested as cysts. Cysts are the infectious stage.","src":"Protozoan Pt2, Slide 5; Protozoan Pt2, Slide 19; Protozoan Pt2, Slide 24","o":[["Cyst","Hardy infectious stage for fecal-oral spread.","Protozoan Pt2, Slide 5; Protozoan Pt2, Slide 19; Protozoan Pt2, Slide 24"],["Trophozoite","Slide 19 says people pass noninfectious trophozoites as well as infectious cysts, so the trophozoite is not the form ingested.","Protozoan Pt2, Slide 19"],["Both forms","Only the cyst is the infectious stage for these fecal-oral organisms, so both is incorrect.","Protozoan Pt2, Slide 19"],["Neither form","Slides 5 and 24 list the cyst as the infectious stage, so one form is taken in.","Protozoan Pt2, Slide 5; Protozoan Pt2, Slide 24"]]},
{"t":"Life Cycle","s":"Which stage is the infectious stage for Naegleria fowleri?","c":"Naegleria fowleri infects through the nasal passages as a trophozoite.","src":"Protozoan Pt2, Slide 21","o":[["Trophozoite","Stated infectious stage.","Protozoan Pt2, Slide 21"],["Cyst","Cyst is the infectious stage for the fecal-oral organisms, but slide 21 lists the trophozoite for Naegleria entering through the nasal passages.","Protozoan Pt2, Slide 5; Protozoan Pt2, Slide 19; Protozoan Pt2, Slide 24"],["Both stages","Slide 21 names only the trophozoite as infectious for Naegleria.","Protozoan Pt2, Slide 21"],["Neither stage","The trophozoite is infectious for Naegleria, so neither is incorrect.","Protozoan Pt2, Slide 21"]]},
{"t":"Taxonomy","s":"Which protozoan group glides via undulating ridges or is non-motile?","c":"Protozoa are grouped by movement. Apicomplexa glide via undulating ridges or are non-motile.","src":"Protozoan Pt1, Slide 14","o":[["Apicomplexa","Undulating ridges or non-motile.","Protozoan Pt1, Slide 14"],["Ciliophora","Slide 14 says Ciliophora move via cilia (\"hair bearers\").","Protozoan Pt1, Slide 14"],["Mastigophora","Mastigophora move via flexible flagella.","Protozoan Pt1, Slide 14"],["Sarcodina","Sarcodina move by forming pseudopodia.","Protozoan Pt1, Slide 14"]]},
{"t":"Taxonomy","s":"Which group is known as the whip bearers?","c":"Mastigophora move via flexible flagella.","src":"Protozoan Pt1, Slide 14","o":[["Mastigophora","Flagellates.","Protozoan Pt1, Slide 14"],["Ciliophora","Slide 14 calls Ciliophora hair bearers because they move by cilia.","Protozoan Pt1, Slide 14"],["Apicomplexa","Apicomplexia glide via undulating ridges or are non-motile.","Protozoan Pt1, Slide 14"],["Sarcodina","Sarcodina move by pseudopodia.","Protozoan Pt1, Slide 14"]]},
{"t":"Taxonomy","s":"Which group performs multiple fission (schizogony) during asexual reproduction?","c":"Multiple fission is performed only by the Sporozoea (Apicomplexa). Other groups use binary fission.","src":"Protozoan Pt1, Slide 20","o":[["Sporozoea","Only group using schizogony.","Protozoan Pt1, Slide 20"],["Ciliophora","Slide 20 lists Ciliophora under transverse binary fission.","Protozoan Pt1, Slide 20"],["Sarcodina","Slide 20 says Sarcodina divide by binary fission with no fixed plane.","Protozoan Pt1, Slide 20"],["Mastigophora","Slide 20 says Mastigophora divide by longitudinal binary fission.","Protozoan Pt1, Slide 20"]]},
{"t":"Taxonomy","s":"Which group does NOT usually participate in sexual reproduction?","c":"Mastigophora do not usually reproduce sexually. Ciliates conjugate, and Sarcodina and Sporozoea can form gametes.","src":"Protozoan Pt1, Slide 21","o":[["Mastigophora","Sexual reproduction does not usually occur.","Protozoan Pt1, Slide 21"],["Ciliophora","Slide 21 says Ciliophora reproduce sexually by conjugation using micronuclei.","Protozoan Pt1, Slide 21"],["Sporozoea","Slide 21 says Sporozoea have flagellated gametes, so sexual reproduction occurs.","Protozoan Pt1, Slide 21"],["Sarcodina","Slide 21 says some Sarcodina have flagellated gametes, so sexual reproduction occurs.","Protozoan Pt1, Slide 21"]]},
{"t":"Taxonomy","s":"Which group divides by transverse binary fission?","c":"Ciliophora divide transversely, Mastigophora longitudinally, and Sarcodina along no fixed plane.","src":"Protozoan Pt1, Slide 20","o":[["Ciliophora","Transverse fission.","Protozoan Pt1, Slide 20"],["Mastigophora","Mastigophora divide longitudinally.","Protozoan Pt1, Slide 20"],["Sarcodina","Sarcodina divide along no fixed plane.","Protozoan Pt1, Slide 20"],["Sporozoea","Sporozoea use multiple fission (schizogony), not binary fission.","Protozoan Pt1, Slide 20"]]},
{"t":"Mastigophora","s":"After drinking untreated stream water, a hiker develops cramping, flatulence, and greasy floating stools. Which organism is responsible?","c":"Giardia lamblia (also called Giardia intestinalis) causes giardiasis, nicknamed beaver fever, from cysts in contaminated water. It infects the duodenum and boiling kills it.","src":"Protozoan Pt2, Slide 5","o":[["Giardia lamblia","Beaver fever with greasy stools.","Protozoan Pt2, Slide 5"],["Entamoeba histolytica","Entamoeba histolytica infects the colon and causes diarrhea and flatulence. Slide 19 does not mention greasy floating stools.","Protozoan Pt2, Slide 19"],["Balantidium coli","Balantidium coli (slide 24) is linked to pigs, dysentery, and weight loss, not greasy floating stools.","Protozoan Pt2, Slide 24"],["Cryptosporidium","Slide 26 describes Cryptosporidium as causing self-limited enteritis in healthy people, with no greasy stools.","Protozoan Pt2, Slide 26"]]},
{"t":"Mastigophora","s":"Which protozoan disease is typically sexually transmitted?","c":"Trichomoniasis is caused by Trichomonas vaginalis, which has no cyst stage. The trophozoite is infectious, and both partners must be treated.","src":"Protozoan Pt2, Slide 7","o":[["Trichomoniasis","Sexually transmitted flagellate.","Protozoan Pt2, Slide 7"],["Giardiasis","Giardiasis spreads by the fecal-oral route, usually via contaminated drinking water.","Protozoan Pt2, Slide 5"],["Malaria","Malaria spreads by the Anopheles mosquito and occasionally by needles, transfusion, or mother to fetus, not sexually.","Protozoan Pt2, Slide 27; Protozoan Pt2, Slide 31"],["Cryptosporidiosis","Cryptosporidiosis spreads from contaminated animal feces in food or water.","Protozoan Pt2, Slide 26"]]},
{"t":"Mastigophora","s":"Which drug is used to treat trichomoniasis, with both partners treated?","c":"Metronidazole is the treatment for trichomoniasis.","src":"Protozoan Pt2, Slide 7","o":[["Metronidazole","Stated treatment.","Protozoan Pt2, Slide 7"],["Benznidazole","Benznidazole or nifurtimox treat Chagas disease.","Protozoan Pt2, Slide 14"],["Nitazoxanide","Nitazoxanide is the most common drug for cryptosporidiosis.","Protozoan Pt2, Slide 26"],["Pyrimethamine","Pyrimethamine treats toxoplasmosis.","Protozoan Pt2, Slide 35"]]},
{"t":"Mastigophora","s":"Which condition is caused by a Mastigophora?","c":"Trichomonas vaginalis is a flagellate. Balantidium is a ciliate, Cryptosporidium an apicomplexan, and Entamoeba an ameba.","src":"Protozoan Pt2, Slide 3; Protozoan Pt2, Slide 7","o":[["Trichomoniasis","Flagellate.","Protozoan Pt2, Slide 3; Protozoan Pt2, Slide 7"],["Balantidiasis","Balantidiasis is a Ciliophora condition.","Protozoan Pt2, Slide 23"],["Cryptosporidiosis","Cryptosporidiosis is an Apicomplexia condition.","Protozoan Pt2, Slide 25"],["Amebiasis","Amebiasis is a Sarcodina condition.","Protozoan Pt2, Slide 17"]]},
{"t":"Sarcodina","s":"Which condition is most likely to be asymptomatic if contracted?","c":"Amebiasis from E. histolytica is asymptomatic about 90% of the time. Giardiasis is also about 90% asymptomatic.","src":"Protozoan Pt2, Slide 19","o":[["Amebiasis","About 90% asymptomatic.","Protozoan Pt2, Slide 19"],["Chagas disease","Slide 15 says Chagas can be asymptomatic, but it gives no frequency and describes 20–30% progressing to chronic cardiac and GI disease. Slide 19 gives amebiasis a specific 90% asymptomatic rate.","Protozoan Pt2, Slide 15"],["Cryptosporidiosis","Slide 26 says Cryptosporidium causes enteritis in healthy people and fatal watery diarrhea in the immunocompromised.","Protozoan Pt2, Slide 26"],["Malaria","Slides 31–33 describe an incubation period, then cold, hot, and sweating stages, with serious complications. No asymptomatic rate is given.","Protozoan Pt2, Slide 31; Protozoan Pt2, Slide 32; Protozoan Pt2, Slide 33"]]},
{"t":"Mastigophora","s":"Which disease is vectored by the tsetse fly?","c":"African sleeping sickness is caused by Trypanosoma brucei gambiense and rhodesiense. A chancre forms at the bite, then the organism enters the blood and CNS.","src":"Protozoan Pt2, Slide 11","o":[["African sleeping sickness","Tsetse fly vector.","Protozoan Pt2, Slide 11"],["Chagas disease","Chagas disease is vectored by kissing (reduviid) bugs, not the tsetse fly.","Protozoan Pt2, Slide 14"],["Malaria","Malaria is vectored by Anopheles mosquitoes.","Protozoan Pt2, Slide 31"],["Primary amebic meningoencephalitis","PAM comes from contaminated water through the nasal passages. No insect vector is listed.","Protozoan Pt2, Slide 21"]]},
{"t":"Mastigophora","s":"Which disease is vectored by reduviid (kissing) bugs?","c":"Chagas disease is caused by Trypanosoma cruzi, spread through bug feces. Chronic disease causes dilated cardiomyopathy and congestive heart failure.","src":"Protozoan Pt2, Slide 14","o":[["Chagas disease","Reduviid bug vector.","Protozoan Pt2, Slide 14"],["African sleeping sickness","Sleeping sickness is vectored by the tsetse fly.","Protozoan Pt2, Slide 11"],["Malaria","Malaria is vectored by Anopheles mosquitoes.","Protozoan Pt2, Slide 31"],["Primary amebic meningoencephalitis","PAM comes from contaminated water, not an insect.","Protozoan Pt2, Slide 21"]]},
{"t":"Mastigophora","s":"Which finding is the swelling around the bite site in acute Chagas disease?","c":"Romana's sign is acute swelling around the bite site in Chagas disease. A chancre belongs to African sleeping sickness.","src":"Protozoan Pt2, Slide 15","o":[["Romana's sign","Acute Chagas bite-site swelling.","Protozoan Pt2, Slide 15"],["Primary chancre","A chancre forms at the bite site in African sleeping sickness, not Chagas.","Protozoan Pt2, Slide 11; Protozoan Pt2, Slide 12"],["Granulomatous ulcer","A granulomatous ulcer is the lesion of the fungal infection sporotrichosis.","Fungi, Slide 39"],["Warty nodule","Warty (verrucous) nodules are the lesion of the fungal infection chromoblastomycosis.","Fungi, Slide 41"]]},

{"t":"Sarcodina","s":"Which ameba infects the colon, has a trophozoite nucleus with a karyosome, and is spread as cysts?","c":"Entamoeba histolytica causes amebiasis, also called amebic dysentery, and is diagnosed by cysts in stool. Boiling kills the cysts.","src":"Protozoan Pt2, Slide 18; Protozoan Pt2, Slide 19","o":[["Entamoeba histolytica","Colon ameba with karyosome.","Protozoan Pt2, Slide 18; Protozoan Pt2, Slide 19"],["Giardia lamblia","Giardia is a flagellate with a binucleate trophozoite that infects the duodenum, not the colon.","Protozoan Pt2, Slide 4; Protozoan Pt2, Slide 5"],["Naegleria fowleri","Naegleria enters through the nasal passages and infects the brain.","Protozoan Pt2, Slide 21"],["Acanthamoeba","Acanthamoeba infects the cornea.","Protozoan Pt2, Slide 22"]]},

{"t":"Apicomplexa","s":"Which drug is most commonly used to treat cryptosporidiosis?","c":"Nitazoxanide (Alinia) is the most common drug. Cryptosporidiosis is self-limited in healthy people but causes fatal watery diarrhea in the immunocompromised.","src":"Protozoan Pt2, Slide 26","o":[["Nitazoxanide","Stated treatment.","Protozoan Pt2, Slide 26"],["Metronidazole","Metronidazole is listed for trichomoniasis and as one of three drugs for Balantidium, not for cryptosporidiosis.","Protozoan Pt2, Slide 7; Protozoan Pt2, Slide 24"],["Pyrimethamine","Pyrimethamine treats toxoplasmosis.","Protozoan Pt2, Slide 35"],["Benznidazole","Benznidazole treats Chagas disease.","Protozoan Pt2, Slide 14"]]},
{"t":"Apicomplexa","s":"Malaria is caused by which organism?","c":"Malaria is caused by Plasmodium, spread mainly by the female Anopheles mosquito.","src":"Protozoan Pt2, Slide 27; Protozoan Pt2, Slide 31","o":[["Plasmodium","Malaria agent.","Protozoan Pt2, Slide 27; Protozoan Pt2, Slide 31"],["Naegleria fowleri","Naegleria fowleri causes primary amebic meningoencephalitis.","Protozoan Pt2, Slide 21"],["Acanthamoeba","Acanthamoeba causes amebic keratitis.","Protozoan Pt2, Slide 22"],["Balantidium coli","Balantidium coli causes balantidiasis.","Protozoan Pt2, Slide 24"]]},
{"t":"Apicomplexa","s":"Malaria symptoms recur at 48 or 72 hour intervals because of what?","c":"Synchronous rupture of infected red blood cells releases merozoites on a regular schedule, producing cold, hot, and sweating stages.","src":"Protozoan Pt2, Slide 32","o":[["Synchronous rupturing of RBCs","Cause of the cyclic fever.","Protozoan Pt2, Slide 32"],["Changing of the tides","The slide ties the 48- or 72-hour pattern to RBC rupture, not the tides.","Protozoan Pt2, Slide 32"],["Hormone fluctuations","The pattern is tied to synchronous RBC rupture, not hormones.","Protozoan Pt2, Slide 32"],["Sexual cycle of Plasmodium in humans","The sexual phase occurs in the mosquito, not the human.","Protozoan Pt2, Slide 28"]]},
{"t":"Apicomplexa","s":"Which stage of Plasmodium is the infectious stage injected by the mosquito?","c":"Sporozoites are the infectious stage. They travel to the liver and undergo schizogony to make merozoites, which invade red blood cells.","src":"Protozoan Pt2, Slide 31; Protozoan Pt2, Slide 29","o":[["Sporozoites","Injected into the blood.","Protozoan Pt2, Slide 31; Protozoan Pt2, Slide 29"],["Merozoites","Merozoites are produced by liver schizogony and invade red blood cells, not the injected stage.","Protozoan Pt2, Slide 29"],["Oocysts","Oocysts form in the mosquito stomach wall.","Protozoan Pt2, Slide 30"],["Trophozoites","Slide 31 names the sporozoite as the infectious stage.","Protozoan Pt2, Slide 31"]]},
{"t":"Apicomplexa","s":"Where does the sexual phase of the Plasmodium life cycle take place?","c":"The asexual phase occurs in humans and the sexual phase in the mosquito, where fertilization and oocyst formation occur.","src":"Protozoan Pt2, Slide 28; Protozoan Pt2, Slide 30","o":[["In the female Anopheles mosquito","Fertilization and oocyst formation occur here.","Protozoan Pt2, Slide 28; Protozoan Pt2, Slide 30"],["In human liver cells","Liver cells are the site of asexual schizogony.","Protozoan Pt2, Slide 29"],["In human red blood cells","Red blood cells host asexual merozoite replication.","Protozoan Pt2, Slide 29; Protozoan Pt2, Slide 31"],["In the human spleen","Debris accumulates in the spleen, causing enlargement. It is not a site of Plasmodium reproduction.","Protozoan Pt2, Slide 33"]]},
{"t":"Apicomplexa","s":"Which form of malaria has the highest acute death rate, especially in children?","c":"Falciparum malaria is the most malignant type, with persistent fever and the highest acute death rate.","src":"Protozoan Pt2, Slide 32; Protozoan Pt2, Slide 33","o":[["Falciparum malaria","Most malignant.","Protozoan Pt2, Slide 32; Protozoan Pt2, Slide 33"],["Vivax malaria","Vivax is only named as a species. Slide 33 gives the highest acute death rate to falciparum.","Protozoan Pt2, Slide 27"],["Malariae malaria","Malariae is only named as a species and is not given the highest death rate.","Protozoan Pt2, Slide 27"],["Ovale malaria","Ovale is only named as a species and is not given the highest death rate.","Protozoan Pt2, Slide 27"]]},
{"t":"Apicomplexa","s":"A veterinarian tells a pregnant client not to change the cat litter box. Which condition is the warning about?","c":"Toxoplasma gondii uses cats as hosts and sheds oocysts in feces. Infection during pregnancy can cause eye or brain damage in the fetus.","src":"Protozoan Pt2, Slide 34; Protozoan Pt2, Slide 36","o":[["Toxoplasmosis","Cat-associated congenital risk.","Protozoan Pt2, Slide 34; Protozoan Pt2, Slide 36"],["Trichomoniasis","Trichomoniasis is sexually transmitted.","Protozoan Pt2, Slide 7"],["Cryptosporidiosis","Cryptosporidiosis comes from contaminated animal feces in food or water.","Protozoan Pt2, Slide 26"],["Giardiasis","Giardiasis comes from contaminated drinking water.","Protozoan Pt2, Slide 5"]]},

const $=id=>document.getElementById(id);
let base=DATA,set=[],ans={},mode="card",idx=0,muted=false,timer=null;
let activeSub="ALL",activeSize=0;

const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function prep(src){return shuf(src.map((q,i)=>({...q,id:q.id??i,o:shuf(q.o.map((x,k)=>({text:x[0],why:x[1],cite:x[2],ok:k===0})))})))}
function start(src){set=prep(src);base=src.map(q=>({...q}));ans={};idx=0;$("sum").classList.add("hidden");render()}
function el(t,c,x){const n=document.createElement(t);if(c)n.className=c;if(x!==undefined)n.textContent=x;return n}

function getPool(){
 const all=DATA.map((q,i)=>({...q,id:i}));
 return activeSub==="ALL"?all:all.filter(q=>q.t===activeSub);
}

function buildSubjects(){
 const box=$("subjects");box.innerHTML="";
 const topics=["ALL",...new Set(DATA.map(q=>q.t))];
 topics.forEach(t=>{
  const count=t==="ALL"?DATA.length:DATA.filter(q=>q.t===t).length;
  const label=t==="ALL"?`All Topics (${count})`:`${t} (${count})`;
  const b=el("button","btn"+(t===activeSub?" on":""),label);
  b.type="button";
  b.onclick=()=>{activeSub=t;buildSubjects();applyFilters()};
  box.appendChild(b);
 });
}

function applyFilters(){
 const pool=getPool();
 $("fullBtn").textContent=`All Matching (${pool.length})`;
 document.querySelectorAll("#sizes .btn").forEach(b=>b.classList.toggle("on",+b.dataset.n===activeSize));
 const chosen=activeSize&&activeSize<pool.length?shuf([...pool]).slice(0,activeSize):pool;
 start(chosen);
}

function stats(){const n=set.length,c=Object.values(ans).filter(a=>a.ok).length,d=Object.keys(ans).length;
 const p=n?Math.round(c/n*100):0;$("score").textContent=`Score: ${c} / ${n} (${p}%)`;$("pg").style.width=(n?d/n*100:0)+"%";return{c,n,p,d}}
function apply(card,q,a){
 card.querySelectorAll(".opt").forEach((b,i)=>{b.disabled=true;if(q.o[i].ok)b.classList.add("c");else if(i===a.sel)b.classList.add("w");else b.classList.add("dim")});
 const e=el("div","exp");e.appendChild(el("div","st "+(a.ok?"c":"w"),a.ok?"Correct!":"Incorrect."));
 e.appendChild(el("p","con",`${q.c} [${q.src}]`));const u=el("ul","rat");
 q.o.forEach((o,i)=>{const li=el("li",o.ok?"k":"");li.appendChild(el("strong","",`${String.fromCharCode(65+i)}) ${o.text}: `));
  li.appendChild(document.createTextNode(`${o.ok?"Correct.":"Incorrect."} ${o.why} [${o.cite}]`));u.appendChild(li)});
 e.appendChild(u);card.appendChild(e);
 if(mode==="card"){const n=el("div","next");const b=el("button","btn pri",idx<set.length-1?"Next →":"See Results");b.type="button";
  b.onclick=()=>{if(idx<set.length-1){idx++;render()}else summary()};n.appendChild(b);card.appendChild(n)}}
function pick(q,i,card){
 if(ans[q.id])return;const ok=q.o[i].ok;ans[q.id]={sel:i,ok};
 if(!ok&&!muted){const a=$("aud");a.currentTime=0;a.play().catch(()=>{});const p=$("pop");p.classList.remove("hidden");
  clearTimeout(timer);timer=setTimeout(()=>p.classList.add("hidden"),2000)}
 apply(card,q,ans[q.id]);const s=stats();if(mode==="list"&&s.d===s.n)summary()}
function render(){
 const box=$("quiz");box.innerHTML="";const list=mode==="card"?[set[idx]]:set;
 list.forEach(q=>{const n=set.indexOf(q)+1;const card=el("div","q");const m=el("div","meta");
  m.appendChild(el("span","badge",`Question ${n} of ${set.length}`));m.appendChild(el("span","badge",q.t));card.appendChild(m);
  card.appendChild(el("div","stem",q.s));const o=el("div","opts");
  q.o.forEach((x,i)=>{const b=el("button","opt");b.type="button";b.appendChild(el("b","",String.fromCharCode(65+i)+")"));b.appendChild(el("span","",x.text));b.onclick=()=>pick(q,i,card);o.appendChild(b)});
  card.appendChild(o);box.appendChild(card);if(ans[q.id])apply(card,q,ans[q.id])});
 stats()}
function summary(){
 const s=stats();$("sT").textContent="Quiz Complete";$("sS").textContent=`${s.c} / ${s.n} (${s.p}%)`;
 $("sM").textContent=s.p>=90?"Absolute Gigachad. You drained that test dry.":s.p>=70?"You lasted less than 30 seconds. Time for a rematch.":"You really didn’t fucking know that.";
 const miss=set.filter(q=>ans[q.id]&&!ans[q.id].ok).length;const r=$("review");r.classList.toggle("hidden",miss===0);r.textContent=`Review Missed (${miss})`;
 $("sum").classList.remove("hidden");$("sum").scrollIntoView({behavior:"smooth",block:"center"})}
function setMode(m){mode=m;$("mCard").classList.toggle("on",m==="card");$("mList").classList.toggle("on",m==="list");
 const a=Object.keys(ans).length;if(a<set.length)$("sum").classList.add("hidden");render()}

$("mCard").onclick=()=>setMode("card");
$("mList").onclick=()=>setMode("list");
$("mute").onclick=()=>{muted=!muted;$("mute").classList.toggle("on",muted);$("mute").textContent=muted?"Unmute Erijah":"STFU Erijah";if(muted){$("pop").classList.add("hidden");$("aud").pause()}};
$("retake").onclick=()=>{start(base);window.scrollTo({top:0,behavior:"smooth"})};
$("review").onclick=()=>{const ids=set.filter(q=>ans[q.id]&&!ans[q.id].ok).map(q=>q.id);start(DATA.map((q,i)=>({...q,id:i})).filter(q=>ids.includes(q.id)));window.scrollTo({top:0,behavior:"smooth"})};
$("backMenu").onclick=()=>{$("menuPanel").scrollIntoView({behavior:"smooth",block:"start"})};
$("popimg").onerror=function(){if(!this.dataset.f){this.dataset.f=1;this.src="wrong-answer.png"}};
document.querySelectorAll("#sizes .btn").forEach(b=>b.onclick=()=>{activeSize=+b.dataset.n;applyFilters()});

buildSubjects();
applyFilters();
</script>
</body>
