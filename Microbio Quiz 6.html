const $=id=>document.getElementById(id);
let base=DATA,set=[],ans={},mode="card",idx=0,muted=false,timer=null;
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function prep(src){return shuf(src.map((q,i)=>({...q,id:q.id??i,o:shuf(q.o.map((x,k)=>({text:x[0],why:x[1],ok:k===0})))})))}
function start(src){set=prep(src);base=src.map(q=>({...q}));ans={};idx=0;$("sum").classList.add("hidden");render();window.scrollTo(0,0)}
function el(t,c,x){const n=document.createElement(t);if(c)n.className=c;if(x!==undefined)n.textContent=x;return n}
function stats(){const n=set.length,c=Object.values(ans).filter(a=>a.ok).length,d=Object.keys(ans).length;
 const p=n?Math.round(c/n*100):0;$("score").textContent=`Score: ${c} / ${n} (${p}%)`;$("pg").style.width=(n?d/n*100:0)+"%";return{c,n,p,d}}
function apply(card,q,a){
 card.querySelectorAll(".opt").forEach((b,i)=>{b.disabled=true;if(q.o[i].ok)b.classList.add("c");else if(i===a.sel)b.classList.add("w");else b.classList.add("dim")});
 const e=el("div","exp");e.appendChild(el("div","st "+(a.ok?"c":"w"),a.ok?"Correct!":"Incorrect."));
 e.appendChild(el("p","con",q.c));const u=el("ul","rat");
 q.o.forEach((o,i)=>{const li=el("li",o.ok?"k":"");li.appendChild(el("strong","",`${String.fromCharCode(65+i)}) ${o.text}: `));
  li.appendChild(document.createTextNode(`${o.ok?"Correct.":"Incorrect."} ${o.why} [${q.src}]`));u.appendChild(li)});
 e.appendChild(u);card.appendChild(e);
 if(mode==="card"){const n=el("div","next");const b=el("button","btn pri",idx<set.length-1?"Next →":"See Results");b.type="button";
  b.onclick=()=>{if(idx<set.length-1){idx++;render()}else summary()};n.appendChild(b);card.appendChild(n)}}
function pick(q,i,card){
 if(ans[q.id])return;const ok=q.o[i].ok;ans[q.id]={sel:i,ok};
 if(!ok&&!muted){const a=$("aud");a.currentTime=0;a.play().catch(()=>{});const p=$("pop");p.classList.remove("hidden");
  clearTimeout(timer);timer=setTimeout(()=>p.classList.add("hidden"),2000)}
 apply(card,q,ans[q.id]);const s=stats();if(mode==="list"&&s.d===s.n)summary()}
function render(){
 const box=$("quiz");box.innerHTML="";const list=mode==="card"?[set[idx]]:set;
 list.forEach(q=>{const n=set.indexOf(q)+1;const card=el("div","q");const m=el("div","meta");
  m.appendChild(el("span","badge",`Question ${n} of ${set.length}`));m.appendChild(el("span","badge",q.t));card.appendChild(m);
  card.appendChild(el("div","stem",q.s));const o=el("div","opts");
  q.o.forEach((x,i)=>{const b=el("button","opt");b.type="button";b.appendChild(el("b","",String.fromCharCode(65+i)+")"));b.appendChild(el("span","",x.text));b.onclick=()=>pick(q,i,card);o.appendChild(b)});
  card.appendChild(o);box.appendChild(card);if(ans[q.id])apply(card,q,ans[q.id])});
 stats()}
function summary(){
 const s=stats();$("sT").textContent="Quiz Complete";$("sS").textContent=`${s.c} / ${s.n} (${s.p}%)`;
 $("sM").textContent=s.p>=90?"Absolute Gigachad. You drained that test dry.":s.p>=70?"You lasted less than 30 seconds. Time for a rematch.":"You really didn’t fucking know that.";
 const miss=set.filter(q=>ans[q.id]&&!ans[q.id].ok).length;const r=$("review");r.classList.toggle("hidden",miss===0);r.textContent=`Review Missed (${miss})`;
 $("sum").classList.remove("hidden");$("sum").scrollIntoView({behavior:"smooth",block:"center"})}
function setMode(m){mode=m;$("mCard").classList.toggle("on",m==="card");$("mList").classList.toggle("on",m==="list");
 const a=Object.keys(ans).length;if(a<set.length)$("sum").classList.add("hidden");render()}
$("mCard").onclick=()=>setMode("card");$("mList").onclick=()=>setMode("list");
$("mute").onclick=()=>{muted=!muted;$("mute").classList.toggle("on",muted);$("mute").textContent=muted?"Unmute Erijah":"STFU Erijah";if(muted){$("pop").classList.add("hidden");$("aud").pause()}};
$("retake").onclick=()=>start(base);
$("review").onclick=()=>{const ids=set.filter(q=>ans[q.id]&&!ans[q.id].ok).map(q=>q.id);start(DATA.map((q,i)=>({...q,id:i})).filter(q=>ids.includes(q.id)))};
$("popimg").onerror=function(){if(!this.dataset.f){this.dataset.f=1;this.src="wrong-answer.png"}};
function startN(n){document.querySelectorAll("#sizes .btn").forEach(b=>b.classList.toggle("on",+b.dataset.n===n));
 const all=DATA.map((q,i)=>({...q,id:i}));start(n?shuf(all).slice(0,n):all)}
document.querySelectorAll("#sizes .btn").forEach(b=>b.onclick=()=>startN(+b.dataset.n));
$("fullBtn").textContent="Full Bank ("+DATA.length+")";
startN(0);
</script>
