        body {

        }

        .sticky-header {

            top: 0;
            background-color: var(--bg-secondary);
            border-bottom: 2px solid var(--accent);
            padding: 14px 20px;

            justify-content: space-between;

        .header-title {

            color: var(--accent);
        }

        .score-counter {
            font-size: 1rem;
            font-weight: 600;
            background-color: #2b2b2b;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid #444;
            color: var(--accent);
        }

        .container {
            max-width: 820px;
            margin: 24px auto;
            padding: 0 16px;
        }

        .quiz-intro {
            margin-bottom: 24px;
            text-align: center;
        }

        .quiz-intro h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .quiz-intro p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .question-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 22px;
            margin-bottom: 24px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.3);

            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--accent);
            margin-bottom: 8px;

        .question-text {
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.45;
            margin-bottom: 18px;
            color: #ffffff;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-button {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            background-color: #2e2e2e;
            border: 1px solid #484848;
            border-radius: 8px;
            padding: 12px 16px;
            color: #ffffff;
            font-size: 0.95rem;
            cursor: pointer;
            text-align: left;
            width: 100%;
            transition: all 0.15s ease;
        }

        .option-button:hover:not(:disabled) {
            background-color: #383838;
            border-color: var(--accent);
        }

        .option-button:disabled {
            cursor: default;
        }

        .option-prefix {
            font-weight: 700;
            color: var(--accent);
            min-width: 22px;
        }

        .option-button.correct {
            background-color: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: #ffffff !important;
        }

        .option-button.correct .option-prefix {
            color: #86efac !important;
        }

        .option-button.incorrect {
            background-color: var(--incorrect-bg) !important;
            border-color: var(--incorrect-border) !important;
            color: #ffffff !important;
        }

        .option-button.incorrect .option-prefix {
            color: #fca5a5 !important;
        }

        .explanation-box {
            display: none;
            margin-top: 16px;
            padding: 14px 16px;
            border-radius: 8px;
            background-color: #1a1a1a;
            border-left: 4px solid var(--accent);
            font-size: 0.9rem;
            line-height: 1.5;
            color: var(--text-secondary);
        }

        .rationale-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 0.9rem;
            color: #d4d4d4;
        }

        .rationale-item {
            line-height: 1.45;
        }

        .rationale-item strong {
            color: var(--accent);
            margin-right: 4px;
        }

        #summary-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 2.5rem 1.5rem;
            text-align: center;
            border: 2px solid var(--accent);
            margin-top: 2rem;
            display: none;
        }

        #summary-card h2 {
            margin-bottom: 1rem;
            color: #ffffff;
            font-size: 1.8rem;
        }

        .score-display {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 1rem;
        }

        #final-feedback {
            margin-bottom: 2rem;
            font-size: 1.1rem;
            color: var(--text-secondary);
        }

        .reset-btn {
            background-color: var(--accent);
            color: var(--bg-primary);
            border: none;
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            transition: background-color 0.2s;
        }

        .reset-btn:hover {
            background-color: var(--accent-hover);
        }

        @media (max-width: 600px) {
            .header-title {
                font-size: 0.95rem;
            }
            .score-counter {
                font-size: 0.85rem;
                padding: 4px 10px;
            }
            .question-card {
                padding: 16px;
            }
        }
    </style>
</head>

                options: [
                    { text: "Coronary epicardial arteries", correct: false, why: "Coronary blood flow is regulated by metabolic adenosine and sympathetics." },
                    { text: "Arterioles of the external genitalia (penis)", correct: true, why: "Penile arterioles receive parasympathetic innervation inducing vasodilation and erection." },
                    { text: "Renal glomerular arterioles", correct: false, why: "Glomerular vessels are regulated by sympathetic tone and myogenic feedback." },
                    { text: "Cerebral pial arteries", correct: false, why: "Cerebral vessels are regulated by local CO2 levels." }
                ]
            },
            {
                topic: "Board Synonyms (A.K.A.s)",
                question: "Which term is strictly synonymous with 'neurological level' on board exams?",
                options: [
                    { text: "Spinal cord segment", correct: false, why: "Spinal cord segments give rise to rootlets, but neurological level refers to the nerve root." },
                    { text: "Spinal nerve root", correct: true, why: "Neurological level is synonymous with spinal nerve root." },
                    { text: "Sympathetic ganglion", correct: false, why: "Ganglia are autonomic relay stations." },
                    { text: "Ventral ramus", correct: false, why: "The ventral ramus is a distal nerve branch." }
                ]
            },
            {
                topic: "Board Synonyms (A.K.A.s)",
                question: "What is the preferred physiological terminology for what clinicians call a 'deep tendon reflex' (DTR)?",
                options: [
                    { text: "Muscle stretch reflex (or myotatic reflex)", correct: true, why: "Deep tendon reflex is a misnomer because the receptor is inside the muscle spindle." },
                    { text: "Inverse myotatic reflex", correct: false, why: "This refers to Golgi tendon organ autogenic inhibition." },
                    { text: "Autogenic inhibitory reflex", correct: false, why: "This describes GTO relaxation." },
                    { text: "Cutaneous flexor withdrawal reflex", correct: false, why: "This is a nociceptive withdrawal response." }
                ]
            }
        ];

        // Fisher-Yates Shuffle Algorithm
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        let answeredCount = 0;
        let correctCount = 0;
        let totalQuestions = quizData.length;
        let shuffledQuestions = [];

        function updateScore() {
            const scoreDisplay = document.getElementById("scoreDisplay");
            const percentage = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;
            scoreDisplay.textContent = `Score: ${correctCount} / ${answeredCount} (${percentage}%)`;
        }

        function handleOptionClick(btn, selectedIndex, correctIndex, explanationId, cardIndex) {
            const card = document.getElementById(`card-${cardIndex}`);
            const buttons = card.querySelectorAll(".option-button");
            const explanationBox = document.getElementById(explanationId);

            buttons.forEach(button => {
                button.disabled = true;
            });

            answeredCount++;

            let item = shuffledQuestions[cardIndex];
            let rationaleHTML = '<div class="rationale-list">';
            item.options.forEach((optText, optIdx) => {
                const letter = String.fromCharCode(65 + optIdx);
                const whyText = optText.why || "";
                rationaleHTML += `<div class="rationale-item"><strong>${letter})</strong> ${whyText}</div>`;
            });
            rationaleHTML += '</div>';

            if (selectedIndex === correctIndex) {
                btn.classList.add("correct");
                correctCount++;
            } else {
                btn.classList.add("incorrect");
                buttons[correctIndex].classList.add("correct");
            }

            explanationBox.innerHTML = rationaleHTML;
            explanationBox.style.display = "block";
            updateScore();

            if (answeredCount === totalQuestions) {
                showSummary();
            }
        }

        function renderQuiz() {
            const container = document.getElementById("quizContainer");
            container.innerHTML = "";
            document.getElementById("summary-card").style.display = "none";
            document.getElementById("quizContainer").style.display = "block";

            answeredCount = 0;
            correctCount = 0;
            updateScore();

            shuffledQuestions = shuffle([...quizData]);
            totalQuestions = shuffledQuestions.length;

            shuffledQuestions.forEach((item, index) => {
                const card = document.createElement("article");
                card.className = "question-card";
                card.id = `card-${index}`;

                const meta = document.createElement("div");
                meta.className = "question-meta";
                meta.textContent = `Question ${index + 1} of ${totalQuestions} • ${item.topic}`;

                const questionText = document.createElement("div");
                questionText.className = "question-text";
                questionText.textContent = item.question;

                const optionsList = document.createElement("div");
                optionsList.className = "options-list";

                const explanationId = `explanation-${index}`;
                const prefixes = ["A", "B", "C", "D"];

                let indexedOpts = item.options.map((opt, idx) => ({ ...opt, originalIdx: idx }));
                shuffle(indexedOpts);

                let newCorrectIndex = indexedOpts.findIndex(o => o.correct);

                indexedOpts.forEach((optObj, optIdx) => {
                    const btn = document.createElement("button");
                    btn.type = "button";
                    btn.className = "option-button";

                    const prefixSpan = document.createElement("span");
                    prefixSpan.className = "option-prefix";
                    prefixSpan.textContent = `${prefixes[optIdx]}.`;

                    const labelSpan = document.createElement("span");
                    labelSpan.textContent = optObj.text;

                    btn.appendChild(prefixSpan);
                    btn.appendChild(labelSpan);

                    btn.onclick = () => handleOptionClick(btn, optIdx, newCorrectIndex, explanationId, index);
                    optionsList.appendChild(btn);
                });

                const explanationBox = document.createElement("div");
                explanationBox.className = "explanation-box";
                explanationBox.id = explanationId;

                card.appendChild(meta);
                card.appendChild(questionText);
                card.appendChild(optionsList);
                card.appendChild(explanationBox);

                container.appendChild(card);
            });
            window.scrollTo(0, 0);
        }

        function showSummary() {
            setTimeout(() => {
                document.getElementById("quizContainer").style.display = "none";
                const summaryCard = document.getElementById("summary-card");
                summaryCard.style.display = "block";

                let percentage = Math.round((correctCount / totalQuestions) * 100);
                document.getElementById("final-score-display").innerText = `${correctCount} / ${totalQuestions} (${percentage}%)`;

                let feedback = percentage >= 85 
                    ? "Outstanding mastery! You have fully locked down spinal nerve anatomy, ramus pathways, autonomic wiring, and reflex physiology." 
                    : "Review spinal nerve exit landmarks, sinuvertebral/medial branch distributions, sympathetic pathways, and stretch reflex arcs.";
                document.getElementById("final-feedback").innerText = feedback;
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, 800);
        }

        function resetQuiz() {
            renderQuiz();
        }

        window.onload = renderQuiz;
    </script>
</body>
</html>
