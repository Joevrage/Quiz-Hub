                    "Autogenic inhibitory reflex",
                    "Cutaneous flexor withdrawal reflex"
                ],
                correctIndex: 0,
                explanation: "As highlighted in the lecture slides: 'Reflexes: the basics - best terminology: muscle stretch reflex, stretch reflex, or myotatic reflex. Note: even though clinicians still use the term deep tendon reflex (DTR), the receptor is in the muscle spindle, not the tendon.'"
            }
        ];

        // Fisher-Yates Shuffle Algorithm
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        let answeredCount = 0;
        let correctCount = 0;

        function updateScore() {
            const scoreDisplay = document.getElementById("scoreDisplay");
            const percentage = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;
            scoreDisplay.textContent = `Score: ${correctCount} / ${answeredCount} (${percentage}%)`;
        }

        function handleOptionClick(btn, selectedIndex, correctIndex, explanationId, cardIndex) {
            const card = document.getElementById(`card-${cardIndex}`);
            const buttons = card.querySelectorAll(".option-button");
            const explanationBox = document.getElementById(explanationId);

            // Disable all options in this card once clicked
            buttons.forEach(button => {
                button.disabled = true;
            });

            answeredCount++;

            if (selectedIndex === correctIndex) {
                btn.classList.add("correct");
                correctCount++;
            } else {
                btn.classList.add("incorrect");
                // Highlight the correct answer
                buttons[correctIndex].classList.add("correct");
            }

            // Display explanation
            explanationBox.style.display = "block";
            updateScore();
        }

        function renderQuiz() {
            const container = document.getElementById("quizContainer");
            container.innerHTML = "";

            // Shuffle questions on load
            const shuffledQuestions = shuffle([...quizData]);

            shuffledQuestions.forEach((item, index) => {
                const card = document.createElement("article");
                card.className = "question-card";
                card.id = `card-${index}`;

                const meta = document.createElement("div");
                meta.className = "question-meta";
                meta.textContent = `Question ${index + 1} of ${shuffledQuestions.length} • ${item.topic}`;

                const questionText = document.createElement("div");
                questionText.className = "question-text";
                questionText.textContent = item.question;

                const optionsList = document.createElement("div");
                optionsList.className = "options-list";

                const explanationId = `explanation-${index}`;
                const prefixes = ["A", "B", "C", "D"];

                item.options.forEach((optText, optIdx) => {
                    const btn = document.createElement("button");
                    btn.type = "button";
                    btn.className = "option-button";

                    const prefixSpan = document.createElement("span");
                    prefixSpan.className = "option-prefix";
                    prefixSpan.textContent = `${prefixes[optIdx]}.`;

                    const labelSpan = document.createElement("span");
                    labelSpan.textContent = optText;

                    btn.appendChild(prefixSpan);
                    btn.appendChild(labelSpan);

                    btn.onclick = () => handleOptionClick(btn, optIdx, item.correctIndex, explanationId, index);
                    optionsList.appendChild(btn);
                });

                const explanationBox = document.createElement("div");
                explanationBox.className = "explanation-box";
                explanationBox.id = explanationId;
                explanationBox.innerHTML = `<strong>Rationale:</strong> ${item.explanation}`;

                card.appendChild(meta);
                card.appendChild(questionText);
                card.appendChild(optionsList);
                card.appendChild(explanationBox);

                container.appendChild(card);
            });
        }

        window.onload = renderQuiz;
    </script>
</body>
</html>
