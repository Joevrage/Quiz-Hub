<script>
/* Builder: first option listed is the correct one (shuffled at draw time).
   Q(slide, difficulty e/m/h, priority 0/1, stem, [[text, why], ...])
   Quarter = Math.ceil(slide/20). Deck order: Q1 shoulder (1-25), Q2 arm + anterior/posterior forearm (26-50),
   Q3 posterior forearm + hand (51-75), Q4 plexus, vessels, elbow, entrapments, other nerves (76-100). */
let _id=0;
function Q(slide,d,p,stem,o){
  _id++;
  return {id:_id,quarter:Math.ceil(slide/20),slideRef:slide,difficulty:{e:"easy",m:"medium",h:"hard"}[d],priority:!!p,stem:stem,
    options:o.map((x,i)=>({text:x[0],correct:i===0,why:x[1]+" [Slide #"+slide+"]"}))};
}
const questionBank=[
/* ===== QUARTER 1 (slides 1-20): BRACHIAL PLEXUS FOUNDATION ===== */
Q(1,"e",1,"The brachial plexus is formed from the nerve roots of _______.",[
 ["C5-T1","Correct: the plexus is built from roots C5 through T1."],
 ["C1-C4","Incorrect: C1-C4 form the cervical plexus."],
 ["T2-T6","Incorrect: these thoracic levels form intercostal nerves."],
 ["L1-S1","Incorrect: these levels form the lumbar and sacral plexuses."]]),
Q(2,"m",1,"Which sequence correctly orders the brachial plexus from proximal to distal?",[
 ["Roots, trunks, divisions, cords, branches","Correct: this is the proximal-to-distal order."],
 ["Roots, divisions, trunks, cords, branches","Incorrect: trunks come before divisions."],
 ["Roots, trunks, cords, divisions, branches","Incorrect: divisions come before cords."],
 ["Trunks, roots, divisions, cords, branches","Incorrect: roots are the most proximal component."]]),
Q(3,"e",1,"The cords of the brachial plexus are named for their orientation around the _______ artery.",[
 ["axillary","Correct: lateral, medial, and posterior cords surround the axillary artery."],
 ["brachial","Incorrect: the cords lie proximal to the brachial artery."],
 ["radial","Incorrect: the radial artery is in the forearm."],
 ["deep brachial","Incorrect: this artery lies in the arm near the radial groove."]]),
Q(4,"m",1,"Which pair are the terminal branches of the lateral cord?",[
 ["Musculocutaneous nerve and half of the median nerve","Correct: the lateral cord gives these two branches."],
 ["Ulnar nerve and half of the median nerve","Incorrect: these are medial cord branches."],
 ["Axillary nerve and radial nerve","Incorrect: these are posterior cord branches."],
 ["Radial nerve and ulnar nerve","Incorrect: these arise from the posterior and medial cords."]]),
Q(5,"m",1,"Which pair are the terminal branches of the medial cord?",[
 ["Ulnar nerve and the other half of the median nerve","Correct: the medial cord gives these two branches."],
 ["Musculocutaneous nerve and half of the median nerve","Incorrect: these are lateral cord branches."],
 ["Axillary nerve and radial nerve","Incorrect: these are posterior cord branches."],
 ["Axillary nerve and ulnar nerve","Incorrect: the axillary nerve comes from the posterior cord."]]),
Q(6,"m",0,"Which pair are the terminal branches of the posterior cord?",[
 ["Axillary nerve and radial nerve","Correct: the posterior cord ends by splitting into these two nerves."],
 ["Musculocutaneous nerve and axillary nerve","Incorrect: the musculocutaneous nerve is from the lateral cord."],
 ["Radial nerve and ulnar nerve","Incorrect: the ulnar nerve is from the medial cord."],
 ["Median nerve and radial nerve","Incorrect: the median nerve is formed by lateral and medial cord contributions."]]),
Q(7,"m",1,"From which spinal levels does the musculocutaneous nerve arise?",[
 ["C5-C7","Correct: the musculocutaneous nerve is C5-C7."],
 ["C8-T1","Incorrect: these levels contribute to the medial cord and ulnar nerve."],
 ["C2-C4","Incorrect: these levels form the cervical plexus."],
 ["T2-T4","Incorrect: these thoracic levels are outside the brachial plexus."]]),
Q(8,"m",0,"Which muscles are supplied by the musculocutaneous nerve?",[
 ["Biceps brachii, brachialis, and coracobrachialis","Correct: these are the anterior arm muscles."],
 ["Triceps brachii, anconeus, and brachioradialis","Incorrect: these are radial nerve muscles."],
 ["Deltoid, teres minor, and supraspinatus","Incorrect: these are supplied by the axillary and suprascapular nerves."],
 ["Pronator teres, flexor carpi radialis, and palmaris longus","Incorrect: these are median nerve muscles."]]),
Q(9,"m",0,"Sensation over the lateral forearm is supplied by which nerve?",[
 ["Lateral antebrachial cutaneous nerve","Correct: it is the sensory continuation of the musculocutaneous nerve."],
 ["Medial antebrachial cutaneous nerve","Incorrect: this supplies the medial forearm and arises from the medial cord."],
 ["Dorsal cutaneous branch of the ulnar nerve","Incorrect: this supplies the medial dorsal hand."],
 ["Palmar cutaneous branch of the median nerve","Incorrect: this supplies the lateral palm, not the lateral forearm."]]),
Q(10,"m",1,"From which spinal levels does the median nerve arise?",[
 ["C6-T1","Correct: the median nerve is C6-T1."],
 ["C1-C3","Incorrect: these levels form the upper cervical plexus."],
 ["T2-T4","Incorrect: these thoracic levels are outside the brachial plexus."],
 ["L4-L5","Incorrect: these levels form the lumbar plexus and sciatic nerve."]]),
Q(11,"h",1,"Which forearm muscle pair is supplied by the median nerve?",[
 ["Pronator teres and pronator quadratus","Correct: both pronators are median-supplied."],
 ["Flexor carpi ulnaris and medial flexor digitorum profundus","Incorrect: these are the ulnar-supplied forearm muscles."],
 ["Supinator and extensor carpi radialis longus","Incorrect: these are radial nerve muscles."],
 ["Brachialis and coracobrachialis","Incorrect: these arm muscles are musculocutaneous-supplied."]]),
Q(12,"e",0,"The median nerve supplies palmar sensation to which digits?",[
 ["Thumb through the radial half of the ring finger","Correct: the lateral 3.5 digits."],
 ["Little finger and ulnar half of the ring finger","Incorrect: this is ulnar nerve territory."],
 ["Index through little finger","Incorrect: the little finger is ulnar-supplied."],
 ["Thumb and index finger only","Incorrect: the median also supplies the middle finger and half the ring finger."]]),
Q(13,"h",1,"Which nerve supplies the dorsal fingertips and nail beds of digits 1 through 3.5?",[
 ["Median nerve","Correct: median digital branches wrap to the dorsal tips."],
 ["Radial nerve","Incorrect: the superficial radial nerve supplies the dorsum of the hand and proximal digits."],
 ["Ulnar nerve","Incorrect: it supplies the medial 1.5 digits."],
 ["Musculocutaneous nerve","Incorrect: it ends in the forearm."]]),
Q(14,"m",0,"From which spinal levels does the ulnar nerve arise?",[
 ["C8-T1","Correct: the ulnar nerve is C8-T1."],
 ["C2-C4","Incorrect: these levels form the cervical plexus."],
 ["T3-T5","Incorrect: these thoracic levels are outside the plexus."],
 ["L1-L2","Incorrect: these levels form the lumbar plexus."]]),
Q(15,"m",1,"Which hand muscle is supplied by the ulnar nerve?",[
 ["Adductor pollicis","Correct: it is ulnar-supplied despite acting on the thumb."],
 ["Abductor pollicis brevis","Incorrect: it is supplied by the recurrent median nerve."],
 ["Opponens pollicis","Incorrect: it is supplied by the recurrent median nerve."],
 ["First lumbrical","Incorrect: lumbricals 1 and 2 are median-supplied."]]),
Q(16,"e",0,"The ulnar nerve supplies palmar and dorsal sensation to which digits?",[
 ["Little finger and ulnar half of the ring finger","Correct: the medial 1.5 digits."],
 ["Thumb and index finger","Incorrect: these are median and radial territory."],
 ["Middle finger and radial half of the ring finger","Incorrect: this is median territory."],
 ["Thumb through the radial half of the ring finger","Incorrect: this is the median lateral 3.5 digits."]]),
Q(17,"m",0,"Which muscle pair is supplied by the axillary nerve?",[
 ["Deltoid and teres minor","Correct: the axillary nerve (C5-C6) supplies both."],
 ["Supraspinatus and infraspinatus","Incorrect: these are supplied by the suprascapular nerve."],
 ["Teres major and subscapularis","Incorrect: these are supplied by the subscapular nerves."],
 ["Biceps brachii and brachialis","Incorrect: these are musculocutaneous-supplied."]]),
Q(18,"m",1,"Which muscles are supplied by the radial nerve?",[
 ["Triceps, supinator, and wrist and finger extensors","Correct: the radial nerve supplies the extensor compartments."],
 ["Pronator teres, flexor carpi radialis, and flexor pollicis longus","Incorrect: these are median nerve muscles."],
 ["Hypothenar muscles, interossei, and adductor pollicis","Incorrect: these are ulnar nerve muscles."],
 ["Biceps brachii, brachialis, and coracobrachialis","Incorrect: these are musculocutaneous-supplied."]]),
Q(19,"h",1,"Which nerve supplies the dorsum of the hand and proximal dorsal digits 1 through 3.5?",[
 ["Radial nerve","Correct: the superficial radial branch covers the lateral dorsal hand."],
 ["Ulnar nerve","Incorrect: it supplies the medial dorsum and medial 1.5 digits."],
 ["Median nerve","Incorrect: it supplies only the dorsal tips and nail beds of these digits."],
 ["Axillary nerve","Incorrect: it supplies skin over the shoulder."]]),
Q(20,"h",1,"Which nerve supplies the anterior arm muscles and the skin of the lateral forearm?",[
 ["Musculocutaneous","Correct: muscular branches reach the anterior arm and its cutaneous continuation reaches the forearm."],
 ["Radial","Incorrect: it supplies the posterior arm and forearm."],
 ["Median","Incorrect: it supplies no arm muscles."],
 ["Axillary","Incorrect: it supplies the deltoid and teres minor."]]),

/* ===== QUARTER 2 (slides 21-40): LAB REVIEW STRUCTURES ===== */
Q(21,"e",1,"The radial artery passes through the _______ on the dorsolateral wrist.",[
 ["anatomical snuffbox","Correct: its pulse can be felt in the snuffbox."],
 ["tunnel of Guyon","Incorrect: this carries the ulnar nerve and artery."],
 ["carpal tunnel","Incorrect: this carries the median nerve and flexor tendons."],
 ["quadrangular space","Incorrect: this is at the shoulder."]]),
Q(22,"h",1,"Which feature distinguishes the lumbricals from the interossei?",[
 ["Lumbricals attach to tendons; interossei attach to bone","Correct: lumbricals arise from FDP tendons while interossei arise from metacarpals."],
 ["Lumbricals attach to bone; interossei attach to tendons","Incorrect: this inverts the relationship."],
 ["Lumbricals lie deep between the metacarpals; interossei lie superficially","Incorrect: the interossei are the deeper muscles."],
 ["Lumbricals are all ulnar-supplied; interossei are all median-supplied","Incorrect: lumbricals are split and all interossei are ulnar-supplied."]]),
Q(23,"m",0,"Which muscle group lies deep to the flexor tendons and attaches to bone between the metacarpals?",[
 ["Interossei","Correct: they lie between and attach to the metacarpals."],
 ["Lumbricals","Incorrect: these lie in the same plane as the tendons and attach to them."],
 ["Thenar muscles","Incorrect: these form the thumb-side eminence."],
 ["Hypothenar muscles","Incorrect: these form the little-finger-side eminence."]]),
Q(24,"h",1,"The oblique head of the adductor pollicis arises from the capitate and metacarpals _______.",[
 ["2 and 3","Correct: it skips over to the third metacarpal and carpal bones before reaching the thumb."],
 ["1 and 2","Incorrect: the origin extends to the third metacarpal."],
 ["3 and 4","Incorrect: the origin begins at the second metacarpal."],
 ["4 and 5","Incorrect: these are not part of the origin."]]),
Q(25,"e",0,"A muscle seen between metacarpals on the dorsum of the hand is a _______.",[
 ["dorsal interosseous","Correct: only dorsal interossei are visible on the back of the hand."],
 ["palmar interosseous","Incorrect: palmar interossei lie on the palmar side."],
 ["lumbrical","Incorrect: lumbricals lie in the palm with the flexor tendons."],
 ["adductor pollicis","Incorrect: it lies on the palmar side."]]),
Q(26,"e",0,"Which nerve runs with the ulnar artery?",[
 ["Ulnar nerve","Correct: the two travel together with no distinguishing feature between them."],
 ["Median nerve","Incorrect: the median nerve enters the hand through the carpal tunnel."],
 ["Radial nerve","Incorrect: it travels with the radial artery branches and the deep brachial artery."],
 ["Musculocutaneous nerve","Incorrect: it ends in the forearm as a cutaneous nerve."]]),
Q(27,"m",1,"The ulnar nerve and artery enter the hand through the _______.",[
 ["tunnel of Guyon","Correct: it lies superficial to the flexor retinaculum."],
 ["carpal tunnel","Incorrect: the median nerve passes through here."],
 ["cubital tunnel only","Incorrect: this is at the elbow."],
 ["anatomical snuffbox","Incorrect: this contains the radial artery."]]),
Q(28,"m",1,"Which flexor tendon ends at the wrist rather than the digits?",[
 ["Flexor carpi radialis","Correct: carpi muscles stop at the wrist."],
 ["Flexor digitorum superficialis","Incorrect: digitorum tendons reach the digits."],
 ["Flexor digitorum profundus","Incorrect: digitorum tendons reach the digits."],
 ["Flexor pollicis longus","Incorrect: it reaches the thumb."]]),
Q(29,"m",0,"Which flexor extends to the distal phalanx of the digits?",[
 ["Flexor digitorum profundus","Correct: it passes through the split superficialis tendon to the digit tips."],
 ["Flexor digitorum superficialis","Incorrect: it ends at the middle phalanges."],
 ["Flexor carpi ulnaris","Incorrect: it ends at the carpals and fifth metacarpal."],
 ["Palmaris longus","Incorrect: it ends in the palmar aponeurosis."]]),
Q(30,"m",0,"Which structure connects the shafts of the radius and ulna?",[
 ["interosseous membrane","Correct: it spans between the two forearm bones."],
 ["annular ligament","Incorrect: it encircles the radial head."],
 ["flexor retinaculum","Incorrect: it forms the carpal tunnel roof."],
 ["palmar aponeurosis","Incorrect: it is the central palmar fascia."]]),
Q(31,"m",0,"Which small muscle near the elbow assists the triceps and is much smaller than the supinator?",[
 ["Anconeus","Correct: it is a small muscle assisting terminal elbow extension."],
 ["Brachialis","Incorrect: it is a large anterior arm flexor."],
 ["Pronator quadratus","Incorrect: it is at the distal forearm."],
 ["Brachioradialis","Incorrect: it is a long lateral forearm muscle."]]),
Q(32,"m",0,"Which muscle is the deepest and most distal pronator of the forearm?",[
 ["Pronator quadratus","Correct: it lies just above the wrist across the radius and ulna."],
 ["Pronator teres","Incorrect: it is proximal and more superficial."],
 ["Supinator","Incorrect: it is a supinator."],
 ["Flexor carpi radialis","Incorrect: it is a wrist flexor and radial deviator."]]),
Q(33,"m",0,"The palmar aponeurosis is continuous with the tendon of which muscle?",[
 ["Palmaris longus","Correct: the apex of the aponeurosis blends with its tendon."],
 ["Flexor carpi radialis","Incorrect: this inserts at the second metacarpal."],
 ["Flexor carpi ulnaris","Incorrect: this inserts at the pisiform and fifth metacarpal."],
 ["Flexor digitorum superficialis","Incorrect: this inserts on the middle phalanges."]]),
Q(34,"m",0,"Which structure forms the roof of the carpal tunnel?",[
 ["Flexor retinaculum","Correct: the transverse carpal ligament roofs the tunnel."],
 ["Extensor retinaculum","Incorrect: this is on the dorsal wrist."],
 ["Palmar aponeurosis","Incorrect: this is superficial central palm fascia."],
 ["Interosseous membrane","Incorrect: this lies in the forearm."]]),
Q(35,"m",0,"Which anterior arm muscle lies deep to the biceps and does not reach the shoulder?",[
 ["Brachialis","Correct: it arises from the distal humerus."],
 ["Coracobrachialis","Incorrect: it arises from the coracoid process."],
 ["Triceps brachii","Incorrect: it is in the posterior compartment."],
 ["Anconeus","Incorrect: it is near the posterior elbow."]]),
Q(36,"m",0,"Which head of the triceps lies deepest and arises inferior to the radial groove?",[
 ["Medial head","Correct: it is largely covered by the other two heads."],
 ["Long head","Incorrect: it arises from the scapula."],
 ["Lateral head","Incorrect: it arises superior to the radial groove."],
 ["Short head","Incorrect: the triceps has no short head."]]),
Q(37,"e",0,"The extensor digiti minimi extends the _______ finger.",[
 ["little","Correct: minimi refers to the little finger."],
 ["index","Incorrect: the extensor indicis extends the index finger."],
 ["middle","Incorrect: the middle finger has no dedicated extensor."],
 ["ring","Incorrect: the ring finger has no dedicated extensor."]]),
Q(38,"m",0,"How many palmar interossei are there?",[
 ["Three","Correct: they serve digits 2, 4, and 5."],
 ["Four","Incorrect: four is the number of dorsal interossei."],
 ["Two","Incorrect: there are three."],
 ["Five","Incorrect: there are three."]]),
Q(39,"h",1,"Which muscle lies in the same plane as the FDP tendons and is supplied by the median nerve?",[
 ["First lumbrical","Correct: lumbricals 1 and 2 are median-supplied."],
 ["Third lumbrical","Incorrect: lumbricals 3 and 4 are ulnar-supplied."],
 ["Dorsal interosseous","Incorrect: it lies deeper and is ulnar-supplied."],
 ["Palmar interosseous","Incorrect: it lies deeper and is ulnar-supplied."]]),
Q(40,"h",0,"Which tendon lies between the flexor carpi radialis and flexor carpi ulnaris at the wrist and may be absent?",[
 ["Palmaris longus","Correct: it lies centrally and is absent in about 14%."],
 ["Flexor pollicis longus","Incorrect: it is deeper and always present."],
 ["Flexor digitorum superficialis","Incorrect: it is deeper and always present."],
 ["Extensor carpi radialis longus","Incorrect: it is on the posterior forearm."]]),

/* ===== QUARTER 3 (slides 41-60): ELBOW LIGAMENTS, CONDITIONS, ENTRAPMENTS ===== */
Q(41,"e",1,"Which three ligaments are the main ligaments of the elbow?",[
 ["Radial collateral, annular, and ulnar collateral","Correct: these are the three main elbow ligaments."],
 ["Radial collateral, ulnar collateral, and transverse carpal","Incorrect: the transverse carpal ligament is at the wrist."],
 ["Annular, ulnar collateral, and glenohumeral","Incorrect: glenohumeral ligaments are in the shoulder."],
 ["Radial collateral, annular, and anterior cruciate","Incorrect: the anterior cruciate is a knee ligament."]]),
Q(42,"m",1,"Which description fits the radial collateral ligament?",[
 ["Fan-like; arises from the lateral epicondyle and blends with the annular ligament","Correct: it starts at a point and fans out."],
 ["Triangular; arises from the medial epicondyle and ends at the olecranon","Incorrect: this describes the ulnar collateral ligament."],
 ["Horizontal band encircling the head of the radius","Incorrect: this describes the annular ligament."],
 ["Sheet spanning the shafts of the radius and ulna","Incorrect: this describes the interosseous membrane."]]),
Q(43,"m",0,"The collateral ligaments of the elbow primarily resist _______ forces.",[
 ["side-to-side","Correct: they prevent the joint from opening on either side."],
 ["flexion-extension","Incorrect: the hinge joint moves freely in these directions."],
 ["rotational","Incorrect: the annular ligament manages pronation and supination."],
 ["compressive","Incorrect: bone alignment resists compression rather than collateral ligaments."]]),
Q(44,"m",1,"What is the main role of the annular ligament?",[
 ["Holds the radial head while permitting pronation and supination","Correct: the radial head rotates inside the ligament."],
 ["Resists side-to-side forces on the medial elbow","Incorrect: this is a collateral ligament role."],
 ["Connects the shafts of the radius and ulna","Incorrect: this is the interosseous membrane."],
 ["Limits elbow hyperflexion","Incorrect: this is not its main role."]]),
Q(45,"m",0,"Which cue separates the annular ligament from the collateral ligaments?",[
 ["Collaterals cross the sides of the joint; the annular encircles the radial head","Correct: this is the key positional cue."],

/* ---------- Integrity check: 100 questions, 20 per quarter ---------- */
(function(){const c={1:0,2:0,3:0,4:0};questionBank.forEach(q=>c[q.quarter]++);console.log('Bank size',questionBank.length,c);})();

/* ---------- State ---------- */
const QUESTIONS_PER_FULL = 50;
let currentSet = [];
let quizData = [];
let round = 1;
let quizMode = 'full';
let quickCount = 25;
let score = 0;
let answered = 0;
let answers = {};
let popupTimeout = null;
let bankIndices = [];

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function resetBankIndices() {
    bankIndices = Array.from({ length: questionBank.length }, (_, i) => i);
    for (let i = bankIndices.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [bankIndices[i], bankIndices[j]] = [bankIndices[j], bankIndices[i]];
    }
}

function drawQuestionsForRound() {
    const targetCount = (quizMode === 'full')
        ? Math.min(QUESTIONS_PER_FULL, questionBank.length)
        : Math.min(quickCount, questionBank.length);
    if (bankIndices.length < targetCount) {
        resetBankIndices();
    }
    const selectedIndices = bankIndices.splice(0, targetCount);
    currentSet = selectedIndices.map(idx => {
        const q = JSON.parse(JSON.stringify(questionBank[idx]));
        for (let i = q.options.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [q.options[i], q.options[j]] = [q.options[j], q.options[i]];
        }
        return q;
    });
    quizData = currentSet;
}

let muted = false;
try { muted = localStorage.getItem('stfuErijah') === '1'; } catch (e) {}

function updateStfuButton() {
    const b = document.getElementById('stfuBtn');
    if (!b) return;
    b.textContent = muted ? 'Bring Back Erijah' : 'STFU Erijah';
    b.classList.toggle('muted', muted);
    if (muted) {
        const a = document.getElementById('wrongAudio');
        if (a) { a.pause(); a.currentTime = 0; }
        if (popupTimeout) clearTimeout(popupTimeout);
        const p = document.getElementById('wrongPopup');
        if (p) p.classList.add('hidden');
    }
}
function toggleStfu() {
    muted = !muted;
    try { localStorage.setItem('stfuErijah', muted ? '1' : '0'); } catch (e) {}
    updateStfuButton();
}

/* ---------- UI ---------- */
function updateModeButtons(){
    document.getElementById('fullQuizBtn').classList.toggle('active',quizMode==='full');
    document.getElementById('quickQuizBtn').classList.toggle('active',quizMode==='quick');
    document.getElementById('quickieOptionsBar').classList.toggle('hidden',quizMode!=='quick');
}
function setMode(m){quizMode=m;round=1;updateModeButtons();renderQuiz();}
function setQuickCount(n,chip){
    quickCount=n;round=1;
    document.querySelectorAll('.count-chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    renderQuiz();
}
function updateHeader(){
    const total=quizData.length,pct=answered?Math.round(score/answered*100):0;
    document.getElementById('answered-display').textContent='Answered: '+answered+' / '+total;
    document.getElementById('score-display').textContent='Score: '+score+' / '+answered+' ('+pct+'%)';
    document.getElementById('progress-bar').style.width=(total?answered/total*100:0)+'%';
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function renderQuiz(reviewSet){
    const popup=document.getElementById('wrongPopup');if(popup)popup.classList.add('hidden');
    const wa=document.getElementById('wrongAudio');if(wa){wa.pause();wa.currentTime=0;}
    if(reviewSet){
        currentSet=reviewSet.map(src=>{const q=JSON.parse(JSON.stringify(src));shuffle(q.options);return q;});
        shuffle(currentSet);
        quizData=currentSet;
    } else {
        drawQuestionsForRound();
    }
    score=0;answered=0;answers={};
    const L=['a','b','c','d'];
    document.getElementById('quiz-container').innerHTML=quizData.map((q,qi)=>
        '<div class="card" id="card-'+qi+'"><div class="meta"><span class="badge">Q'+(qi+1)+'</span><span class="badge alt">Quarter '+q.quarter+'</span><span class="badge alt">'+q.difficulty+'</span>'+(q.priority?'<span class="badge">High-yield</span>':'')+'</div>'
        +'<div class="stem">'+esc(q.stem).replace(/_{3,}/g,'<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>')+'</div>'
        +q.options.map((o,oi)=>'<button class="option-btn" onclick="selectOption('+qi+','+oi+')"><b>'+L[oi]+'.</b> '+esc(o.text)+'</button>').join('')
        +'<div id="exp-'+qi+'"></div></div>'
    ).join('');
    updateHeader();
    window.scrollTo({top:0});
}

function selectOption(qi,oi){
    const q=quizData[qi];
    if(q._locked)return;
    q._locked=true;
    const card=document.getElementById('card-'+qi);
    const buttons=card.querySelectorAll('.option-btn');
    const isCorrect=q.options[oi].correct;
    buttons.forEach((b,bi)=>{
        b.disabled=true;
        if(q.options[bi].correct)b.classList.add('correct');
        else if(bi===oi)b.classList.add('incorrect');
        else b.classList.add('dim');
    });
    q._result=isCorrect;
    answers[qi]=oi;
    if(isCorrect){score++;}
    else if(!muted){
        const wa=document.getElementById('wrongAudio');
        if(wa){wa.currentTime=0;wa.play().catch(err=>console.log('Audio play blocked:',err));}
        const popup=document.getElementById('wrongPopup');
        if(popup){popup.classList.remove('hidden');clearTimeout(popupTimeout);popupTimeout=setTimeout(()=>popup.classList.add('hidden'),2000);}
    }
    answered++;
    const L=['a','b','c','d'];
    document.getElementById('exp-'+qi).innerHTML='<div class="explain"><div class="banner '+(isCorrect?'ok':'bad')+'">'+(isCorrect?'Correct!':'You didn\u2019t know that?!')+'</div>'
        +'<div class="concept">Reference: Quarter '+q.quarter+', Slide #'+q.slideRef+'</div><ul>'
        +q.options.map((o,i)=>'<li class="'+(o.correct?'c':'')+'"><b>'+L[i]+'.</b> '+esc(o.text)+' &mdash; '+esc(o.why)+'</li>').join('')+'</ul></div>';
    updateHeader();
    if(answered===quizData.length)setTimeout(showSummary,700);
}

function showSummary(){
    const total=quizData.length,pct=Math.round(score/total*100);
    const tier=pct>=90?'Absolute Gigachad. You drained that test dry.':(pct>=70?'You lasted less than 30 seconds. Time for a rematch.':'You really didn\u2019t fucking know that.');
    const qs={};quizData.forEach(q=>{qs[q.quarter]=qs[q.quarter]||{t:0,c:0};qs[q.quarter].t++;if(q._result)qs[q.quarter].c++;});
    const rows=Object.keys(qs).sort().map(k=>'<tr><td>Quarter '+k+'</td><td>'+qs[k].c+' / '+qs[k].t+'</td><td>'+Math.round(qs[k].c/qs[k].t*100)+'%</td></tr>').join('');
    const missed=quizData.filter(q=>!q._result).length;
    const d=document.createElement('div');d.className='card summary';d.id='summary';
    d.innerHTML='<div class="big">'+pct+'%</div><div>'+score+' / '+total+' correct</div><div class="tier">'+tier+'</div>'
        +'<table><tr><th>Deck Quarter</th><th>Correct</th><th>%</th></tr>'+rows+'</table>'
        +'<div class="actions"><button onclick="retake()">Retake Quiz</button>'
        +(missed?'<button class="sec" onclick="reviewMissed()">Review Missed ('+missed+')</button>':'')
        +'<a class="sec" href="index.html">Back to Main Base</a></div>';
    document.getElementById('quiz-container').appendChild(d);
    d.scrollIntoView({behavior:'smooth'});
}
function retake(){round++;renderQuiz();}
function reviewMissed(){
    const ids=quizData.filter(q=>!q._result).map(q=>q.id);
    renderQuiz(questionBank.filter(q=>ids.includes(q.id)));
}

window.addEventListener('load',()=>{
    document.getElementById('stfuBtn').addEventListener('click',toggleStfu);
    document.getElementById('fullQuizBtn').addEventListener('click',()=>setMode('full'));
    document.getElementById('quickQuizBtn').addEventListener('click',()=>setMode('quick'));
    document.querySelectorAll('.count-chip').forEach(chip=>{
        chip.addEventListener('click',()=>setQuickCount(parseInt(chip.dataset.count,10),chip));
    });
    resetBankIndices();
    updateStfuButton();updateModeButtons();renderQuiz();
});
