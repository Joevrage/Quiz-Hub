 by yeast; Zymomonas mobilis is the most important bacterium. [Lec 4, Slide #8]"],["Klebsiella",0,"Klebsiella uses butanediol fermentation, not alcoholic fermentation. [Lec 4, Slide #13]"],["Lactococcus",0,"Lactococcus performs homolactic fermentation, with lactic acid as the sole end product. [Lec 4, Slide #9]"],["Clostridium",0,"Clostridium is primarily associated with butyric acid and butanol-acetone fermentation. [Lec 4, Slide #14]"]],"m":"","id":94},{"s":6,"q":"Lactobacillus, Lactococcus, and most streptococci produce lactic acid as the sole end product through which pathway?","o":[["Homolactic fermentation",1,"In homolactic fermentation lactic acid is the sole end product; typical bacteria are Lactobacillus, Lactococcus, and most streptococci. [Lec 4, Slide #9]"],["Heterolactic fermentation",0,"Heterolactic fermentation produces lactic acid plus ethanol and/or acetic acid and CO₂, so lactic acid is not the sole product. [Lec 4, Slide #10]"],["Mixed acid fermentation",0,"Mixed acid fermentation produces lactic, acetic, and formic acids, succinate, and ethanol, not lactic acid alone. [Lec 4, Slide #11]"],["Alcoholic fermentation",0,"Alcoholic fermentation converts pyruvic acid to ethanol and CO₂, not lactic acid. [Lec 4, Slide #8]"]],"m":"","id":95},{"s":6,"q":"The heterolactic (phosphoketolase) pathway produces which set of end products?","o":[["Lactic acid, ethanol and/or acetic acid, and CO₂",1,"The heterolactic (phosphoketolase) pathway, used by Lactobacillus species, produces lactic acid, ethanol and/or acetic acid, and CO₂. [Lec 4, Slide #10]"],["Lactic acid as the sole end product",0,"Lactic acid as the sole end product defines homolactic fermentation. [Lec 4, Slide #9]"],["Butyric acid, acetic acid, CO₂, and H₂",0,"These are butyric acid fermentation products, used primarily by Clostridium. [Lec 4, Slide #14]"],["Acetic acid, CO₂, and propionic acid",0,"These are the products of propionic acid fermentation of lactate. [Lec 4, Slide #16]"]],"m":"","id":96},{"s":6,"q":"Lactic acid, acetic acid, formic acid, succinate, and ethanol are end products of which fermentation pathway?","o":[["Mixed acid fermentation",1,"Mixed acid fermentation, the main pathway of Enterobacteriaceae, yields lactic, acetic, and formic acids, succinate, and ethanol. [Lec 4, Slide #11]"],["Butyric acid fermentation",0,"Butyric acid fermentation forms butyric acid, acetic acid, CO₂, and H₂, not succinate or formic acid. [Lec 4, Slide #14]"],["Propionic acid fermentation",0,"Propionic acid fermentation converts lactate to acetic acid, CO₂, and propionic acid. [Lec 4, Slide #16]"],["Homolactic fermentation",0,"Homolactic fermentation yields lactic acid as the sole end product. [Lec 4, Slide #9]"]],"m":"","id":97},{"s":6,"q":"Enteric bacteria performing mixed acid fermentation also produce CO₂ and H₂ gas when they possess which enzyme?","o":[["Formate dehydrogenase",1,"Mixed acid fermenters can produce CO₂ and H₂ gas if they have formate dehydrogenase, which cleaves byproducts into gases. [Lec 4, Slide #11]"],["Phosphoketolase",0,"Phosphoketolase names the heterolactic pathway used by Lactobacillus species, not the gas-forming enzyme of enterics. [Lec 4, Slide #10]"],["DNA ligase",0,"DNA ligase is a replisome enzyme involved in DNA replication, not in fermentation gas production. [Lec 5, Slide #5]"],["Topoisomerase",0,"Topoisomerase is a replisome enzyme acting on DNA, not a fermentation enzyme. [Lec 5, Slide #5]"]],"m":"","id":98},{"s":6,"q":"Which fermentation pathway produces ethanol but does NOT produce lactic acid?","o":[["Alcoholic fermentation",1,"Alcoholic fermentation converts pyruvic acid to ethanol and CO₂ only; no lactic acid is formed. [Lec 4, Slide #8]"],["Heterolactic fermentation",0,"Heterolactic fermentation can produce ethanol, but it also produces lactic acid. [Lec 4, Slide #10]"],["Mixed acid fermentation",0,"Mixed acid fermentation produces ethanol, but lactic acid is also one of its end products. [Lec 4, Slide #11]"],["Homolactic fermentation",0,"Homolactic fermentation produces lactic acid as its sole end product and no ethanol. [Lec 4, Slide #9]"]],"m":"","id":99},{"s":6,"q":"Butanediol fermentation differs from mixed acid fermentation because it:","o":[["Decreases acid formation by forming acetonin",1,"Butanediol fermentation forms mixed acids, gases, and 2,3-butanediol, but it decreases acid formation by causing the formation of acetonin. [Lec 4, Slide #13]"],["Produces lactic acid as its sole end product",0,"Lactic acid as the sole end product is homolactic fermentation. [Lec 4, Slide #9]"],["Occurs only within the Clostridium genus",0,"Butanediol fermentation is used by Klebsiella and Enterobacter; Clostridium uses butyric acid fermentation. [Lec 4, Slide #13]"],["Produces no mixed acids or gases at all",0,"Butanediol fermentation still forms mixed acids and gases, plus 2,3-butanediol. [Lec 4, Slide #13]"]],"m":"","id":100},{"s":6,"q":"Which organism and fermentation pathway pairing is correct?","o":[["Clostridium and butyric acid fermentation",1,"Butyric acid fermentation is used primarily by the Clostridium genus, forming butyric acid, acetic acid, CO₂, and H₂. [Lec 4, Slide #14]"],["Klebsiella and homolactic fermentation",0,"Klebsiella uses butanediol fermentation; homolactic fermenters are Lactobacillus, Lactococcus, and most streptococci. [Lec 4, Slide #13]"],["Zymomonas and propionic acid fermentation",0,"Zymomonas mobilis performs alcoholic fermentation; propionic acid fermentation is used by propionic acid bacteria. [Lec 4, Slide #8]"],["Lactococcus and butanediol fermentation",0,"Lactococcus is homolactic; butanediol fermentation is used by Klebsiella and Enterobacter. [Lec 4, Slide #9]"]],"m":"","id":101},{"s":6,"q":"Butanol and acetone are fermentation products of which organisms?","o":[["Certain species of clostridia",1,"In butanol-acetone fermentation, certain species of clostridia produce butanol and acetone. [Lec 4, Slide #15]"],["Klebsiella and Enterobacter",0,"Klebsiella and Enterobacter use butanediol fermentation. [Lec 4, Slide #13]"],["Lactobacillus and Lactococcus",0,"Lactobacillus and Lactococcus are lactic acid fermenters. [Lec 4, Slide #9]"],["Propionic acid bacteria",0,"Propionic acid bacteria ferment lactate to acetic acid, CO₂, and propionic acid. [Lec 4, Slide #16]"]],"m":"","id":102},{"s":6,"q":"Propionic acid bacteria ferment which substrate to acetic acid, CO₂, and propionic acid?","o":[["Lactate",1,"Propionic acid bacteria ferment lactate to acetic acid, CO₂, and propionic acid. [Lec 4, Slide #16]"],["Succinate",0,"Succinate is an end product of mixed acid fermentation, not the substrate of propionic acid fermentation. [Lec 4, Slide #11]"],["Ethanol",0,"Ethanol is an end product of alcoholic, heterolactic, and mixed acid fermentation, not the propionic substrate. [Lec 4, Slide #8]"],["Butanediol",0,"2,3-butanediol is a product of butanediol fermentation, not the propionic substrate. [Lec 4, Slide #13]"]],"m":"","id":103},{"s":6,"q":"Which anaerobic process produces and stores methane and is the final step in the decay of organic matter?","o":[["Biological methanogenesis",1,"In biological methanogenesis, methanogens produce and store CH₄ under anaerobic conditions; it is also the final step in the decay of organic matter. [Lec 4, Slide #19]"],["Denitrification",0,"Denitrification removes nitrate from soil; it does not produce methane. [Lec 4, Slide #20]"],["Sulfate reduction",0,"Sulfate reduction produces hydrogen sulfide gas (rotten egg smell), not methane. [Lec 4, Slide #21]"],["Butanediol fermentation",0,"Butanediol fermentation forms mixed acids, gases, and 2,3-butanediol; it is fermentation, not methane-producing respiration. [Lec 4, Slide #13]"]],"m":"","id":104},{"s":6,"q":"Biological methanogenesis requires an outside electron acceptor in the form of:","o":[["CO₂",1,"Methanogenesis is energy-generating metabolism that requires an outside electron acceptor in the form of CO₂. [Lec 4, Slide #19]"],["NO₃⁻",0,"Nitrate is the electron acceptor used in denitrification. [Lec 4, Slide #20]"],["SO₄²⁻",0,"Sulfate is the electron acceptor reduced in sulfate reduction. [Lec 4, Slide #21]"],["O₂",0,"O₂ is the final electron acceptor of aerobic respiration; methanogenesis occurs under anaerobic conditions. [Lec 4, Slide #4]"]],"m":"","id":105},{"s":6,"q":"Which form of anaerobic respiration uses nitrate as the final electron acceptor?","o":[["Denitrification",1,"Denitrification uses nitrate (NO₃) as the electron acceptor; it matters in agriculture and lets gut flora like E. coli respire in the anaerobic intestine. [Lec 4, Slide #20]"],["Sulfate reduction",0,"Sulfate reduction uses sulfate and produces hydrogen sulfide gas. [Lec 4, Slide #21]"],["Methanogenesis",0,"Methanogenesis uses CO₂ as the outside electron acceptor and produces methane. [Lec 4, Slide #19]"],["Mixed acid fermentation",0,"Mixed acid fermentation is fermentation, not respiration with an inorganic electron acceptor. [Lec 4, Slide #11]"]],"m":"","id":106},{"s":6,"q":"Which anaerobic process is NOT an alternative to the use of O₂ because it occurs only under anaerobic conditions?","o":[["Sulfate reduction",1,"Sulfate reduction by some obligate anaerobes is an obligatory process occurring only under anaerobic conditions; it is not an alternative to O₂ and gives a rotten egg smell. [Lec 4, Slide #21]"],["Denitrification",0,"Denitrification is usually an alternative to O₂; Pseudomonas uses O₂ when available and disregards nitrate. [Lec 4, Slide #20]"],["Aerobic respiration",0,"Aerobic respiration uses O₂ itself as the final electron acceptor. [Lec 4, Slide #4]"],["Heterolactic fermentation",0,"Heterolactic fermentation is a fermentation pathway, not an electron-acceptor process compared against O₂. [Lec 4, Slide #10]"]],"m":"","id":107},{"s":6,"q":"When both O₂ and nitrate are available in soil, Pseudomonas will:","o":[["Use O₂ as the acceptor and disregard nitrate",1,"Denitrification is usually an alternative to O₂; soil bacteria such as Pseudomonas use O₂ if available and disregard NO₃. [Lec 4, Slide #20]"],["Use nitrate as the acceptor and disregard O₂",0,"This inverts the preference; nitrate is used as the alternative only when O₂ is not available. [Lec 4, Slide #20]"],["Reduce sulfate to hydrogen sulfide gas",0,"Sulfate reduction is performed by some obligate anaerobes and only under anaerobic conditions. [Lec 4, Slide #21]"],["Produce and store methane gas",0,"Methane production is methanogenesis by methanogens under anaerobic conditions, not Pseudomonas respiration. [Lec 4, Slide #19]"]],"m":"","id":108},{"s":7,"q":"Which statement about bacterial plasmids is accurate?","o":[["They are not essential but often carry favorable traits",1,"Plasmids exist independently in the cytoplasm and are not essential for survival, but they often carry genes that confer favorable traits. [Lec 5, Slide #2]"],["They contain all genetic material needed to survive",0,"The chromosome, not the plasmid, contains all the genetic material a cell needs to survive. [Lec 5, Slide #2]"],["They are permanently integrated into the chromosome",0,"Plasmids exist independently within the cytoplasm, separate from the chromosome. [Lec 5, Slide #2]"],["They are required for binary fission to occur",0,"Plasmids are not essential for survival; each daughter cell receives a completed chromosome during binary fission. [Lec 5, Slide #7]"]],"m":"","id":109},{"s":7,"q":"Bacterial DNA is associated with which molecules?","o":[["Polyamines",1,"Bacterial DNA is associated with polyamines, not histones. [Lec 5, Slide #3]"],["Histones",0,"Histones are specifically excluded; bacterial DNA associates with polyamines instead. [Lec 5, Slide #3]"],["Exons",0,"Bacteria have no introns or exons; all of their DNA is usable. [Lec 5, Slide #3]"],["Plasmids",0,"Plasmids are separate DNA molecules that exist independently in the cytoplasm, not molecules that package chromosomal DNA. [Lec 5, Slide #2]"]],"m":"","id":110},{"s":7,"q":"Which statement correctly describes rolling circle replication?","o":[["Occurs in plasmids and synthesizes DNA in a single direction",1,"Rolling circle replication occurs in some bacterial viruses and plasmids and synthesizes DNA in a single direction, rolling out like a paper towel roll. [Lec 5, Slide #8]"],["Occurs in chromosomes and synthesizes DNA in two directions",0,"Two-directional replication with two forks is the normal method used for the circular chromosome, not rolling circle. [Lec 5, Slide #5]"],["Occurs in plasmids and synthesizes DNA in two directions",0,"The organism type is correct, but rolling circle synthesis proceeds in a single direction, not two. [Lec 5, Slide #8]"],["Occurs in chromosomes and synthesizes DNA in a single direction",0,"The direction is correct, but rolling circle occurs in plasmids and bacterial viruses; chromosomes use normal two-fork replication. [Lec 5, Slide #5]"]],"m":"","id":111},{"s":7,"q":"Which non-genetic control mechanism involves an end product inactivating the first enzyme of a pathway at an allosteric site?","o":[["Feedback inhibition",1,"Feedback inhibition is non-genetic control: the end product binds the first enzyme's allosteric site and inactivates it, providing immediate coarse control. [Lec 5, Slide #10]"],["Operon based repression",0,"Operon based repression is genetic regulation built into the DNA sequence, not a non-genetic allosteric mechanism. [Lec 5, Slide #11]"],["Constitutive expression",0,"Constitutive enzymes are always present (such as glycolytic enzymes) and are not switched off by end product binding. [Lec 5, Slide #10]"],["CAP activation",0,"CAP is a glucose sensor that works with operon-based induction at the genetic level. [Lec 5, Slide #11]"]],"m":"","id":112},{"s":7,"q":"Which form of genetic regulation involves induction genes or end product repression?","o":[["Operon based repression",1,"Operon based repression includes induction genes (sugar usage, combined with CAP) and end product repression. [Lec 5, Slide #11]"],["Feedback inhibition",0,"Feedback inhibition is a non-genetic allosteric enzyme mechanism, not gene induction or repression. [Lec 5, Slide #10]"],["Constitutive enzymes",0,"Constitutive enzymes are always present and are not induced or repressed. [Lec 5, Slide #10]"],["Rolling circle replication",0,"Rolling circle is a method of DNA replication in plasmids and some bacterial viruses, not gene regulation. [Lec 5, Slide #8]"]],"m":"","id":113},{"s":7,"q":"With lactose present and glucose absent, how does the lac operon respond?","o":[["Strong transcription, with CAP bound to the CAP site",1,"Lactose removes the repressor from the operator, and with no glucose, CAP binds the CAP site and boosts the polymerase, giving strong transcription. [Lec 5, Slide #12]"],["Low-level transcription, with CAP not bound to the CAP site",0,"Low-level transcription with unbound CAP occurs when glucose is also present; here glucose is absent. [Lec 5, Slide #11]"],["Strong transcription, with CAP not bound to the CAP site",0,"Strong transcription is correct, but it depends on CAP being bound; CAP is unbound only when glucose is present. [Lec 5, Slide #11]"],["No transcription, with CAP bound to the CAP site",0,"No transcription occurs only when lactose is absent; with lactose present the repressor is removed and transcription proceeds. [Lec 5, Slide #12]"]],"m":"","id":114},{"s":7,"q":"When neither lactose nor glucose is present, lac operon transcription is:","o":[["Absent, because the repressor stays on the operator",1,"Without lactose, the repressor remains bound to the operator and polymerase cannot transcribe; with no lactose there is no transcription regardless of glucose. [Lec 5, Slide #12]"],["Low-level, because CAP is not bound to the CAP site",0,"Low-level transcription requires lactose to remove the repressor plus glucose present; without lactose nothing is transcribed. [Lec 5, Slide #12]"],["Strong, because CAP is bound to the CAP site",0,"CAP only speeds transcription once the repressor is removed; without lactose the repressor still blocks the operator. [Lec 5, Slide #11]"],["Strong, because allolactose removes the repressor",0,"Allolactose forms only when lactose is present; with no lactose, the repressor is not removed. [Lec 5, Slide #12]"]],"m":"","id":115},{"s":7,"q":"When both glucose and lactose are present, the lac operon shows:","o":[["Low-level transcription, since glucose leaves CAP unbound",1,"Lactose removes the repressor so transcription occurs, but glucose keeps CAP (the glucose sensor) off the CAP site, so it is slow. The two sugars are not used at the same rate. [Lec 5, Slide #11]"],["Strong transcription, since both sugars are used equally",0,"Bacteria use glucose to the exclusion of others while it is available, so both sugars are not used at the same time and rate. [Lec 4, Slide #3]"],["No transcription, since the repressor stays on the operator",0,"Lactose is present, so the repressor is removed from the operator and some transcription occurs. [Lec 5, Slide #12]"],["Strong transcription, since CAP is bound to the CAP site",0,"CAP binds the CAP site only when glucose is absent; with glucose present it is not bound. [Lec 5, Slide #11]"]],"m":"","id":116},{"s":7,"q":"Which statement about mutation and DNA repair in bacteria is accurate?","o":[["Repair can occur after a mutation arises",1,"Heritable variation arises by mutation and/or recombination, and repair can occur. [Lec 5, Slide #15]"],["Bacteria lack all DNA repair mechanisms",0,"Bacteria do have repair mechanisms; repair can occur. [Lec 5, Slide #15]"],["Repair occurs only within plasmid DNA",0,"Repair is not restricted to plasmids; the statement that repair can occur applies to bacterial DNA generally. [Lec 5, Slide #15]"],["Repair requires splicing out the introns",0,"Bacteria have no introns or exons, so repair cannot involve intron splicing. [Lec 5, Slide #3]"]],"m":"","id":117},{"s":7,"q":"Which pairing of genetic term and definition is correct?","o":[["Genotype: sum of genetic determinants",1,"Genotype is the sum of genetic determinants; phenotype is the observable properties. [Lec 5, Slide #16]"],["Phenotype: sum of genetic determinants",0,"Phenotype is the observable properties; the sum of genetic determinants is the genotype. [Lec 5, Slide #16]"],["Wild type: observable properties",0,"Wild type is the form found in nature; observable properties define the phenotype. [Lec 5, Slide #16]"],["Mutant: form found in nature",0,"A mutant is progeny expressing a mutation; the form found in nature is the wild type. [Lec 5, Slide #16]"]],"m":"","id":118},{"s":7,"q":"Which pairing of mutant type and definition is correct?","o":[["Revertant: a back mutant",1,"A revertant is a back mutant; a nutritional mutant (auxotroph) cannot grow without a particular growth factor. [Lec 5, Slide #16]"],["Auxotroph: a back mutant",0,"An auxotroph (nutritional mutant) is unable to grow without a particular growth factor; the back mutant is the revertant. [Lec 5, Slide #16]"],["Wild type: a back mutant",0,"Wild type is the form found in nature, not a back mutant. [Lec 5, Slide #16]"],["Revertant: needs a growth factor",0,"A revertant is a back mutant; needing a particular growth factor defines the auxotroph. [Lec 5, Slide #16]"]],"m":"","id":119},{"s":7,"q":"A mutation that results in an amino acid replacement is a:","o":[["Missense mutation",1,"A missense mutation is an amino acid replacement. [Lec 5, Slide #17]"],["Nonsense mutation",0,"A nonsense mutation is the early placement of a stop codon, not an amino acid replacement. [Lec 5, Slide #17]"],["Frameshift mutation",0,"A frameshift is a deletion or insertion that shifts how the sequence is read, not a single replacement. [Lec 5, Slide #17]"],["Regulatory mutation",0,"A regulatory mutation occurs outside the protein-coding DNA, so it does not replace an amino acid. [Lec 5, Slide #17]"]],"m":"","id":120},{"s":7,"q":"A mutation occurring in a region of DNA that does not code for the protein is a:","o":[["Regulatory mutation",1,"A regulatory mutation is a mutation not occurring in the regions of DNA that actually code for the protein. [Lec 5, Slide #17]"],["Missense mutation",0,"A missense mutation replaces an amino acid, so it occurs in coding DNA. [Lec 5, Slide #17]"],["Nonsense mutation",0,"A nonsense mutation places an early stop codon within the coding sequence. [Lec 5, Slide #17]"],["Frameshift mutation",0,"A frameshift shifts how the coding sequence is read through an insertion or deletion. [Lec 5, Slide #17]"]],"m":"","id":121},{"s":7,"q":"Which pairing of mutation type and definition is correct?","o":[["Transition: purine for purine",1,"A transition swaps a purine for a purine (A, G) or a pyrimidine for a pyrimidine (C, T, U). [Lec 5, Slide #17]"],["Transversion: pyrimidine for pyrimidine",0,"Pyrimidine for pyrimidine is a transition; a transversion swaps a purine for a pyrimidine or vice versa. [Lec 5, Slide #17]"],["Nonsense: amino acid replacement",0,"Amino acid replacement is missense; nonsense is the early placement of a stop codon. [Lec 5, Slide #17]"],["Missense: early stop codon",0,"An early stop codon is a nonsense mutation; missense is an amino acid replacement. [Lec 5, Slide #17]"]],"m":"","id":122},{"s":7,"q":"Which is a possible beneficial alteration that can result from a bacterial mutation?","o":[["Resistance",1,"Possible beneficial alterations from mutation include morphology change, genetic control, resistance, temperature and acid preference, osmotic regulation, and enzymatic function. [Lec 5, Slide #18]"],["Gaining introns",0,"Bacteria have no introns and exons; gaining introns is not a listed alteration. [Lec 5, Slide #3]"],["Histone binding",0,"Bacterial DNA associates with polyamines, not histones; this is not a listed beneficial alteration. [Lec 5, Slide #3]"],["Becoming diploid",0,"All bacteria are haploid; becoming diploid is not a listed alteration. [Lec 5, Slide #3]"]],"m":"","id":123},{"s":7,"q":"Most mutations in bacteria are best attributed to:","o":[["Induced exposure to a chemical or physical mutagen",1,"Induced mutations result from exposure to a mutagen; spontaneous replication mistakes are less common in bacteria because their DNA lacks introns and exons. [Lec 5, Slide #19]"],["Spontaneous mistakes made during DNA replication",0,"Spontaneous changes from replication mistakes or background radiation occur, but they are not the main source of bacterial mutations. [Lec 5, Slide #19]"],["Errors made while splicing introns from exons",0,"Bacteria have no introns or exons, so splicing errors cannot occur. [Lec 5, Slide #3]"],["Loss of histones from the bacterial chromosome",0,"Bacterial DNA is associated with polyamines, not histones. [Lec 5, Slide #3]"]],"m":"","id":124},{"s":7,"q":"Which method of DNA transfer requires direct cell-to-cell contact?","o":[["Conjugation",1,"Conjugation is transfer by cell-to-cell contact, using a pilus. [Lec 5, Slide #20]"],["Transformation",0,"Transformation transfers free DNA with no direct contact between donor and acceptor cells. [Lec 5, Slide #24]"],["Transduction",0,"Transduction is mediated by bacterial viruses, not direct cell contact. [Lec 5, Slide #26]"],["Transposition",0,"Transposition moves DNA within the chromosome; it is recombination only, not transfer between cells. [Lec 5, Slide #28]"]],"m":"","id":125},{"s":7,"q":"Conjugation is primarily performed by which bacteria?","o":[["Gram-negative bacteria",1,"Conjugation is primarily Gram (-); the F-factor (ability to form a pilus) is found only in Gram (-) bacteria. [Lec 5, Slide #21]"],["Gram-positive bacteria",0,"The F-factor needed to form a pilus is only in Gram (-) bacteria, so conjugation is not primarily Gram (+). [Lec 5, Slide #21]"],["Bacteria lacking plasmids",0,"Conjugation centers on plasmids such as the F-factor, R-factors, and RTFs. [Lec 5, Slide #21]"],["Bacterial viruses",0,"Bacterial viruses mediate transduction, not conjugation. [Lec 5, Slide #26]"]],"m":"","id":126},{"s":7,"q":"The F-factor (fertility factor) gives a bacterium the ability to:","o":[["Form a pilus",1,"The F-factor (fertility factor) is the ability to form a pilus and is found only in Gram (-) bacteria. [Lec 5, Slide #21]"],["Resist antibiotics",0,"Resistance plasmids are R-factors, not the F-factor. [Lec 5, Slide #21]"],["Take up free DNA",0,"Taking up free DNA is transformation, which needs no pilus or special vehicle. [Lec 5, Slide #24]"],["Package host DNA",0,"Packaging host DNA is done by bacteriophages during transduction. [Lec 5, Slide #26]"]],"m":"","id":127},{"s":7,"q":"A resistance transfer factor (RTF) is a plasmid that combines genetic information for:","o":[["An F pilus and antibiotic-inhibiting enzymes",1,"An RTF is a plasmid carrying genetic information for the F pilus and enzyme(s) that neutralize or inhibit antibiotic activity, combining F-factor and R-factor functions. [Lec 5, Slide #21]"],["Phage capsids and host genome fragments",0,"Phage carriage of host DNA describes transduction, not a conjugative plasmid. [Lec 5, Slide #26]"],["Free DNA uptake and CAP site binding",0,"Free DNA uptake is transformation and CAP binding is lac operon regulation; neither defines an RTF. [Lec 5, Slide #24]"],["Polyamine synthesis and replisome enzymes",0,"Polyamines associate with chromosomal DNA and the replisome performs replication; neither defines an RTF. [Lec 5, Slide #5]"]],"m":"","id":128},{"s":7,"q":"The primary mechanism for rapid spread of antibiotic resistance among Enterobacteriaceae may be:","o":[["Intergeneric conjugation",1,"Intergeneric conjugation, seen among some Enterobacteriaceae, may be the primary mechanism for rapid spread of antibiotic resistance. [Lec 5, Slide #21]"],["Generalized transduction",0,"Generalized transduction lets phages pick up any part of the host genome, but it is not named as the main route of resistance spread. [Lec 5, Slide #26]"],["Transformation of free DNA",0,"Transformation takes up free DNA fragments from lysed cells and is not named as the main route of resistance spread. [Lec 5, Slide #24]"],["Rolling circle replication",0,"Rolling circle is a replication method for plasmids and some viruses, not a transfer mechanism between cells. [Lec 5, Slide #8]"]],"m":"","id":129},{"s":7,"q":"Which DNA transfer method moves free DNA, usually fragments from a lysed cell, with no special vehicle?","o":[["Transformation",1,"Transformation transfers free DNA, usually fragments from a lysed cell, needs no special vehicle, and involves no direct donor-acceptor contact. [Lec 5, Slide #24]"],["Transduction",0,"Transduction needs a vehicle: transfer is mediated by bacterial viruses. [Lec 5, Slide #26]"],["Conjugation",0,"Conjugation requires cell-to-cell contact through a pilus. [Lec 5, Slide #20]"],["Transposition",0,"Transposition is recombination only, moving DNA within the chromosome rather than transferring free DNA between cells. [Lec 5, Slide #28]"]],"m":"","id":130},{"s":7,"q":"Which form of DNA transfer is mediated through the action of bacterial viruses?","o":[["Transduction",1,"Transduction is transfer mediated through the action of bacterial viruses (bacteriophages). [Lec 5, Slide #26]"],["Transformation",0,"Transformation is the uptake of free DNA with no special vehicle. [Lec 5, Slide #24]"],["Conjugation",0,"Conjugation is transfer by direct cell-to-cell contact. [Lec 5, Slide #20]"],["Transposition",0,"Transposition moves DNA within the chromosome and is recombination only. [Lec 5, Slide #28]"]],"m":"","id":131},{"s":7,"q":"In which type of transduction can bacteriophages pick up any portion of the host's genome?","o":[["Generalized transduction",1,"In generalized transduction, bacteriophages can pick up any portion of the host's genome. [Lec 5, Slide #26]"],["Specialized transduction",0,"In specialized transduction, bacteriophages pick up only specific portions of the host's DNA. [Lec 5, Slide #26]"],["Intergeneric transduction",0,"Intergeneric describes a type of conjugation among some Enterobacteriaceae, not a type of transduction. [Lec 5, Slide #21]"],["High frequency transduction",0,"High frequency recombination (Hfr) strains relate to conjugation, not transduction. [Lec 5, Slide #21]"]],"m":"","id":132},{"s":7,"q":"Which is a means of genetic recombination but NOT a mechanism of DNA transfer?","o":[["Transposons",1,"Transposons are recombination only; they move DNA to different positions within the chromosome rather than transferring it between cells. [Lec 5, Slide #20]"],["Conjugation",0,"Conjugation transfers DNA between cells through cell-to-cell contact. [Lec 5, Slide #20]"],["Transformation",0,"Transformation transfers free DNA into a cell. [Lec 5, Slide #24]"],["Transduction",0,"Transduction transfers DNA between cells via bacterial viruses. [Lec 5, Slide #26]"]],"m":"","id":133},{"s":7,"q":"Transposons, also called jumping genes, are officially referred to as:","o":[["Mobile genetic elements",1,"Transposons are DNA sequences that move to different chromosome positions (transposition), can cause mutation, and are officially called mobile genetic elements. [Lec 5, Slide #28]"],["Resistance transfer factors",0,"Resistance transfer factors (RTFs) are conjugative plasmids carrying pilus and antibiotic-inhibiting genes. [Lec 5, Slide #21]"],["High frequency recombination strains",0,"Hfr strains are high frequency recombination strains involved in conjugation. [Lec 5, Slide #21]"],["Replisome enzyme complexes",0,"The replisome (helicase, primase, SSBP, topoisomerase, DNA polymerase, ligase) carries out replication. [Lec 5, Slide #5]"]],"m":"","id":134},{"s":8,"q":"Microbes that engage in mutual or commensal associations with humans, restricted to outer surfaces, are called _______ flora.","o":[["Natural",1,"Natural flora are mutual or commensal microbes restricted mostly to outer surfaces without penetrating sterile tissues. [Slide #2]"],["Sterile",0,"Sterile describes sites and fluids that should hold no microbes, not a microbial population. [Slide #2]"],["Pathogenic",0,"Pathogenic microbes cause harm; natural flora live in mutual or commensal association. [Slide #2]"],["Opportunistic",0,"Opportunistic pathogens infect when host defenses are compromised; this is the infection line of entry, not natural flora. [Slide #2]"]],"m":"","id":135},{"s":8,"q":"Which of the following is a sterile site or fluid?","o":[["Saliva within the salivary gland",1,"Saliva is sterile prior to entering the oral cavity. [Slide #4]"],["External ear canal",0,"The external ear and canal harbor normal flora. [Slide #3]"],["Vagina",0,"The vagina is a normal flora site. [Slide #3]"],["Colon",0,"The colon is part of the GI tract harboring normal flora. [Slide #3]"]],"m":"","id":136},{"s":8,"q":"Which pair of fluids is sterile within its gland or tract but acquires microbes after exiting to the outside?","o":[["Saliva and semen",1,"Saliva is sterile before entering the oral cavity and semen is sterile before entering the urethra. [Slide #4]"],["Blood and cerebrospinal fluid",0,"Both remain sterile internal fluids; neither is defined by acquiring microbes on exit. [Slide #4]"],["Urine and cerebrospinal fluid",0,"CSF stays internal and sterile; urine is sterile only in kidneys, ureters, and bladder. [Slide #4]"],["Blood and urine",0,"Blood is sterile throughout the circulatory system and does not exit to acquire flora. [Slide #4]"]],"m":"","id":137},{"s":8,"q":"Natural flora of the external eye are found on which structures?","o":[["Lids and lash follicles",1,"The external eye, including lids and lash follicles, harbors normal flora. [Slide #3]"],["Internal eye",0,"The internal eye is a sterile site. [Slide #4]"],["Middle and inner ear",0,"These are sterile sites, not part of the eye. [Slide #4]"],["Sinuses",0,"Sinuses are listed as sterile anatomical sites. [Slide #4]"]],"m":"","id":138},{"s":8,"q":"Biofilms form when organisms attach to a substrate by an _______ that binds them into organized layers.","o":[["Extracellular matrix",1,"An extracellular matrix binds organisms together in complex organized layers. [Slide #5]"],["Endospore coat",0,"Endospores are dormant survival bodies, not binding matrices for biofilms. [Slide #5]"],["F pilus bridge",0,"Conjugation pili transfer DNA; they do not form the biofilm matrix. [Slide #5]"],["Plasmid network",0,"Plasmids are DNA elements, not a structural matrix. [Slide #5]"]],"m":"","id":139},{"s":8,"q":"Natural flora commonly form biofilms in which set of locations?","o":[["Skin, oral cavity, and large intestine",1,"Biofilms formed by natural flora are common on skin, oral cavity, and large intestine. [Slide #5]"],["Brain, heart, and lungs",0,"These are sterile internal organs. [Slide #4]"],["Blood, bladder, and kidneys",0,"These are sterile sites and fluids. [Slide #4]"],["Bones, muscles, and glands",0,"These are sterile internal tissues. [Slide #4]"]],"m":"","id":140},{"s":8,"q":"The first exposure to microbes that become natural flora occurs when the _______.","o":[["Fetal membranes break",1,"The first exposure occurs with breaking of the fetal membrane, exposing the fetus to the mother's vaginal bacteria. [Slide #6]"],["Child passes through the birth canal",0,"Passage through the birth canal is the second exposure. [Slide #6]"],["Child takes its first breath",0,"This is not listed as an exposure stage; the first exposure precedes birth. [Slide #6]"],["Child begins eating solid foods",0,"Food contributes to the fourth exposure during the following 18 months. [Slide #6]"]],"m":"","id":141},{"s":8,"q":"Which of the following is the least common on the skin overall?","o":[["Staphylococcus",1,"Staphylococcus makes up only about 5% of skin flora, less than any of the four phyla. [Slide #7]"],["Actinobacteria",0,"Actinobacteria are the most abundant skin phylum at 51.8%. [Slide #7]"],["Firmicutes",0,"Firmicutes make up 24.4% of skin flora. [Slide #7]"],["Proteobacteria",0,"Proteobacteria make up 16.5% of skin flora. [Slide #7]"]],"m":"","id":142},{"s":8,"q":"The most common residents of the mouth are aerobic _______ species.","o":[["Streptococcus",1,"Aerobic Streptococcus species are the most common oral residents. [Slide #8]"],["Bacteroides",0,"Bacteroides are predominantly anaerobic large intestine residents. [Slide #9]"],["Bifidobacterium",0,"Bifidobacterium is an anaerobic intestinal resident. [Slide #9]"],["Clostridium",0,"Clostridium is an anaerobic large intestine resident. [Slide #9]"]],"m":"","id":143},{"s":8,"q":"Which two oral species make a major contribution to dental caries?","o":[["S. mutans and S. sanguis",1,"S. mutans and S. sanguis contribute substantially to dental caries. [Slide #8]"],["S. salivarius and S. mitis",0,"These are oral residents but not the species tied to caries. [Slide #8]"],["S. aureus and S. epidermidis",0,"These staphylococci are associated with nasal and skin sites. [Slide #10]"],["S. sanguis and S. salivarius",0,"Only S. sanguis is a caries contributor; S. salivarius is not. [Slide #8]"]],"m":"","id":144},{"s":8,"q":"The large intestine is predominantly populated by which bacteria?","o":[["Anaerobic Bacteroides and Bifidobacterium",1,"Large intestine flora are predominantly anaerobic, including Bacteroides and Bifidobacterium. [Slide #9]"],["Aerobic Streptococcus and Staphylococcus",0,"Aerobic streptococci dominate the mouth, not the large intestine. [Slide #8]"],["Microaerophilic Neisseria and Haemophilus",0,"These are respiratory tract residents. [Slide #10]"],["Facultative coliforms such as E. coli",0,"Coliforms are present in smaller numbers. [Slide #9]"]],"m":"","id":145},{"s":8,"q":"Large intestine flora produce gas and _______, which gives feces its odor.","o":[["Skatole",1,"Flora produce gas and skatole, the compound that makes feces smell. [Slide #9]"],["Riboflavin",0,"Riboflavin is a vitamin produced by flora, not an odor compound. [Slide #9]"],["Pyridoxine",0,"Pyridoxine is a vitamin generated by flora. [Slide #9]"],["Propionic acid",0,"Propionic acid is a fermentation acid produced by flora, not the odor compound. [Slide #9]"]],"m":"","id":146},{"s":8,"q":"Which organism is found at the nasal entrance, nasal vestibule, and anterior nasopharynx?","o":[["Staphylococcus aureus",1,"S. aureus resides at the nasal entrance, vestibule, and anterior nasopharynx. [Slide #10]"],["Neisseria",0,"Neisseria is found in the nasopharynx behind the soft palate. [Slide #10]"],["Haemophilus",0,"Haemophilus is found in the tonsils and lower pharynx. [Slide #10]"],["Lactobacillus",0,"Lactobacilli predominate in the vagina after puberty. [Slide #11]"]],"m":"","id":147},{"s":8,"q":"Which bacteria predominate in the vagina from puberty until menopause?","o":[["Lactobacilli",1,"After puberty until menopause the vagina is primarily lactobacilli. [Slide #11]"],["Diphtheroids",0,"Diphtheroids are prepubertal residents. [Slide #11]"],["Coliforms",0,"Coliforms occur in the prepubertal vagina. [Slide #11]"],["Staphylococci",0,"Staphylococci are prepubertal residents. [Slide #11]"]],"m":"","id":148},{"s":8,"q":"Which sequence follows increased estrogen in the vagina after puberty?","o":[["Increased glycogen, increased lactobacilli, increased acid",1,"Estrogen raises glycogen, attracting lactobacilli that produce acid and block other microbes. [Slide #11]"],["Increased glycogen, decreased lactobacilli, increased acid",0,"Glycogen attracts lactobacilli, so their numbers increase. [Slide #11]"],["Decreased glycogen, increased lactobacilli, increased acid",0,"Estrogen increases glycogen; it does not decrease it. [Slide #11]"],["Increased glycogen, increased lactobacilli, decreased acid",0,"Lactobacilli are acid-producing, so acid increases. [Slide #11]"]],"m":"","id":149},{"s":8,"q":"Which benefit of flora is described as repression of pathogenic microbial growth?","o":[["Microbial antagonism",1,"Microbial antagonism is repression of pathogenic microbial growth. [Slide #12]"],["Trophic effects",0,"Trophic effects involve cell turnover, not repression of pathogens. [Slide #12]"],["Metabolic function",0,"Metabolic function involves vitamin and acid production. [Slide #12]"],["Immune desensitization",0,"This involves the immune system tolerating microbes, not repressing pathogen growth. [Slide #12]"]],"m":"","id":150},{"s":8,"q":"Salmonella food poisoning in a healthy adult is an example of which type of agent?","o":[["True pathogen",1,"True pathogens cause disease in healthy persons with normal immune defenses. [Slide #13]"],["Opportunistic pathogen",0,"Opportunistic pathogens infect when defenses are compromised or the microbe is outside its natural environment. [Slide #13]"],["Natural flora member",0,"Natural flora remain restricted to outer surfaces without invading sterile tissue. [Slide #2]"],["Commensal resident",0,"Commensals benefit without harming; this agent causes disease. [Slide #2]"]],"m":"","id":151},{"s":8,"q":"A bladder infection by normal colon flora in a patient receiving chemotherapy is classified as which of the following?","o":[["Opportunistic infection",1,"Flora established outside their natural site in a compromised host (chemotherapy weakens defenses) is opportunistic. [Slide #15]"],["True pathogen infection",0,"True pathogens cause disease in healthy hosts with normal defenses. [Slide #13]"],["Commensal association",0,"Commensalism involves no harm; this is an infection. [Slide #2]"],["Mutualistic association",0,"Mutualism benefits both parties; here the host is harmed. [Slide #2]"]],"m":"","id":152},{"s":8,"q":"Which pair represents the two lines of entry for acquiring bacteria?","o":[["Natural flora and infection",1,"The two lines of entry are natural flora and infection (true or opportunistic pathogen). [Slide #2]"],["Biofilm and capsule",0,"Biofilms and capsules are structures or communities, not lines of entry. [Slide #5]"],["Sterile site and normal flora",0,"Sterile sites are anatomical locations that should hold no microbes, not a line of entry. [Slide #4]"],["Infection and sterile site",0,"Sterile sites are not a line of entry; natural flora is the other line. [Slide #2]"]],"m":"","id":153},{"s":8,"q":"Which GI tract site harbors natural flora?","o":[["Rectum",1,"The mouth, colon, rectum, and anus are GI sites harboring normal flora. [Slide #3]"],["Pancreas",0,"Glands such as the pancreas are sterile. [Slide #4]"],["Liver",0,"The liver is a sterile internal organ. [Slide #4]"],["Bladder",0,"The bladder is sterile and is not part of the GI tract. [Slide #4]"]],"m":"","id":154},{"s":8,"q":"Which site in the upper respiratory tract harbors natural flora?","o":[["Pharynx",1,"The oral cavity, pharynx, and nasal mucosa harbor normal flora. [Slide #3]"],["Sinuses",0,"Sinuses are sterile sites. [Slide #4]"],["Lungs",0,"Lungs are sterile internal organs. [Slide #4]"],["Middle ear",0,"The middle and inner ear are sterile. [Slide #4]"]],"m":"","id":155},{"s":8,"q":"Urine is sterile in which location?","o":[["Ureters",1,"Urine in the kidneys, ureters, and bladder is sterile. [Slide #4]"],["Outer opening of the urethra",0,"This opening harbors normal flora, so urine is no longer sterile once it reaches it. [Slide #3]"],["External genitalia",0,"The external genitalia harbor normal flora. [Slide #3]"],["Vagina",0,"The vagina harbors normal flora. [Slide #3]"]],"m":"","id":156},{"s":8,"q":"Brain, heart, and _______ are sterile internal organs.","o":[["Lungs",1,"Lungs are listed among sterile internal tissues and organs. [Slide #4]"],["Pharynx",0,"The pharynx harbors normal flora. [Slide #3]"],["Rectum",0,"The rectum harbors normal flora. [Slide #3]"],["Vagina",0,"The vagina harbors normal flora. [Slide #3]"]],"m":"","id":157},{"s":8,"q":"Microbes concentrate near the two ends of the GI tract because it is _______.","o":[["One long tube open to the outside at both ends",1,"The GI tract is essentially one long tube open at both ends, so microbes are found nearest the openings. [Slide #3]"],["A sealed tube closed to the outside",0,"The tract is open to the outside at the mouth and anus. [Slide #3]"],["A series of separate sterile compartments",0,"It is a continuous tube, and flora sit near the openings rather than in sterile compartments. [Slide #3]"],["A tube lined with sterile mucosa throughout",0,"The mouth, colon, rectum, and anus harbor flora, so the lining is not sterile throughout. [Slide #3]"]],"m":"","id":158},{"s":8,"q":"Isolation of a microbe from which site most strongly indicates infection rather than natural flora?","o":[["Middle ear",1,"The middle ear is sterile, so microbes there indicate infection. [Slide #4]"],["External ear canal",0,"The external ear and canal harbor normal flora. [Slide #3]"],["Lash follicles",0,"Lids and lash follicles harbor normal flora. [Slide #3]"],["Vagina",0,"The vagina harbors normal flora. [Slide #3]"]],"m":"","id":159},{"s":8,"q":"Which statement distinguishes natural flora from an infecting microbe?","o":[["Natural flora stay on outer surfaces; infecting microbes invade sterile tissue",1,"Natural flora are restricted to outer surfaces, whereas infection involves penetrating defenses and invading sterile tissue. [Slide #2]"],["Natural flora invade sterile tissue; infecting microbes stay on outer surfaces",0,"This inverts the relationship; flora do not penetrate sterile tissues. [Slide #2]"],["Both stay on outer surfaces; only infecting microbes form biofilms",0,"Natural flora also create biofilms, and infecting microbes invade sterile tissue. [Slide #5]"],["Both invade sterile tissue; only natural flora cause disease",0,"Natural flora do not invade sterile tissue, and pathogens are the disease-causing agents. [Slide #2]"]],"m":"","id":160},{"s":8,"q":"How do biofilms of natural flora protect the host?","o":[["They form a good-bacteria film that blocks other microbes from taking up residency",1,"Flora biofilms occupy the surface and prevent other microbes from establishing. [Slide #5]"],["They secrete exotoxins that lyse host cells",0,"Biofilms of flora are cooperative, not host-damaging. [Slide #5]"],["They convert sterile sites into flora sites",0,"Sterile sites should remain microbe-free; flora are restricted to outer surfaces. [Slide #4]"],["They induce endospore formation in pathogens",0,"Endospores form in response to hostile conditions, not as a biofilm defense. [Slide #5]"]],"m":"","id":161},{"s":8,"q":"The second exposure to microbes that become natural flora occurs _______.","o":[["During passage through the birth canal",1,"The second exposure is during birth, picking up staph, strep, and lactobacilli. [Slide #6]"],["When the fetal membrane breaks",0,"This is the first exposure. [Slide #6]"],["Within 8 to 12 hours after birth",0,"This is the third exposure. [Slide #6]"],["Throughout the next 18 months",0,"This is the fourth exposure. [Slide #6]"]],"m":"","id":162},{"s":8,"q":"Which timing describes the third exposure to future natural flora?","o":[["Within 8 to 12 hours after birth",1,"The third exposure occurs within 8 to 12 hours, with coliforms, lactobacilli, enteric strep, and staph. [Slide #6]"],["During rupture of the fetal membrane",0,"This is the first exposure. [Slide #6]"],["During passage through the birth canal",0,"This is the second exposure. [Slide #6]"],["During the following 18 months",0,"This is the fourth exposure. [Slide #6]"]],"m":"","id":163},{"s":8,"q":"Why does breastfeeding select for bifidobacteria?","o":[["Infants cannot break down breast milk oligosaccharides, but bifidobacteria can",1,"Short-chain oligosaccharides are indigestible to the infant, so bifidobacteria that digest them accumulate. [Slide #6]"],["Infants break down oligosaccharides, leaving none for bifidobacteria",0,"Infants cannot digest them; bifidobacteria use them. [Slide #6]"],["Formula supplies oligosaccharides that only bifidobacteria can digest",0,"The oligosaccharides are the breast milk feature that selects for bifidobacteria. [Slide #6]"],["Bifidobacteria are unable to digest oligosaccharides and are selected by default",0,"Bifidobacteria process the nutrient, which is why they are selected. [Slide #6]"]],"m":"","id":164},{"s":8,"q":"The fourth exposure to future natural flora spans about _______ months.","o":[["18",1,"The fourth exposure covers the next 18 months and establishes intestinal flora. [Slide #6]"],["2",0,"The 8 to 12 hour window is the third exposure; the fourth lasts far longer. [Slide #6]"],["6",0,"The fourth exposure lasts 18 months. [Slide #6]"],["36",0,"The fourth exposure lasts 18 months, not 36. [Slide #6]"]],"m":"","id":165},{"s":8,"q":"Skin microbes reside only in or on which layer?","o":[["Dead cell layers",1,"Skin microbes reside only in or on the dead cell layers. [Slide #7]"],["Dermis",0,"Microbes do not extend into the dermis except around follicles and glands. [Slide #7]"],["Subcutaneous layer",0,"Microbes do not reach subcutaneous levels except around follicles and glands. [Slide #7]"],["Living epidermal layer",0,"Microbes are limited to the dead cell layers. [Slide #7]"]],"m":"","id":166},{"s":8,"q":"Which sequence ranks the skin phyla from most to least abundant?","o":[["Actinobacteria, Firmicutes, Proteobacteria, Bacteroidetes",1,"Skin phyla are Actinobacteria 51.8%, Firmicutes 24.4%, Proteobacteria 16.5%, Bacteroidetes 6.3%. [Slide #7]"],["Firmicutes, Actinobacteria, Proteobacteria, Bacteroidetes",0,"Actinobacteria (51.8%) outnumber Firmicutes (24.4%). [Slide #7]"],["Actinobacteria, Proteobacteria, Firmicutes, Bacteroidetes",0,"Firmicutes (24.4%) outnumber Proteobacteria (16.5%). [Slide #7]"],["Actinobacteria, Firmicutes, Bacteroidetes, Proteobacteria",0,"Proteobacteria (16.5%) outnumber Bacteroidetes (6.3%). [Slide #7]"]],"m":"","id":167},{"s":8,"q":"One estimate places the number of microbe types in the mouth at which value?","o":[["Over 600",1,"The mouth harbors over 600 types of microbes by one estimate. [Slide #8]"],["About 6",0,"The estimate is over 600 types. [Slide #8]"],["About 60",0,"The estimate is over 600 types. [Slide #8]"],["About 160",0,"The estimate is over 600 types. [Slide #8]"]],"m":"","id":168},{"s":8,"q":"Which organism is NOT an oral Streptococcus listed among the major residents of the mouth?","o":[["S. aureus",1,"S. aureus is a Staphylococcus found in the nasal region, not an oral streptococcus. [Slide #10]"],["S. sanguis",0,"S. sanguis is a listed oral streptococcus. [Slide #8]"],["S. salivarius",0,"S. salivarius is a listed oral streptococcus. [Slide #8]"],["S. mitis",0,"S. mitis is a listed oral streptococcus. [Slide #8]"]],"m":"","id":169},{"s":8,"q":"S. mutans and S. sanguis promote caries by producing a sugar-derived _______ that attracts other microbes.","o":[["Slime layer",1,"These species make a slime layer that traps other microbes and sugars against the teeth. [Slide #8]"],["Endospore",0,"Endospores are dormant survival bodies, not an attractant film. [Slide #8]"],["Exotoxin",0,"Caries contribution is through a surface film, not a secreted toxin. [Slide #8]"],["F pilus",0,"F pili mediate conjugation, not plaque formation. [Slide #8]"]],"m":"","id":170},{"s":8,"q":"Microbes make up what proportion of fecal volume?","o":[["10 to 50%",1,"Microbes are very abundant, making up 10 to 50% of fecal volume. [Slide #9]"],["Less than 5%",0,"Microbes are 10 to 50% of fecal volume. [Slide #9]"],["60 to 70%",0,"The range is 10 to 50%. [Slide #9]"],["80 to 90%",0,"The range is 10 to 50%. [Slide #9]"]],"m":"","id":171},{"s":8,"q":"Which pair of intestinal bacteria is noted for forming protective biofilms?","o":[["Bifidobacterium and Bacteroides",1,"These predominant anaerobes form biofilm in the intestine that blocks other microbes. [Slide #9]"],["E. coli and Enterobacter",0,"These are coliforms present in smaller numbers. [Slide #9]"],["Enterobacter and Citrobacter",0,"These are coliforms present in smaller numbers. [Slide #9]"],["Citrobacter and E. coli",0,"These are coliforms present in smaller numbers. [Slide #9]"]],"m":"","id":172},{"s":8,"q":"Which organism is a coliform found in the large intestine?","o":[["Citrobacter",1,"E. coli, Enterobacter, and Citrobacter are the coliforms listed. [Slide #9]"],["Bacteroides",0,"Bacteroides is a predominant anaerobe, not a coliform. [Slide #9]"],["Fusobacterium",0,"Fusobacterium is a predominant anaerobe, not a coliform. [Slide #9]"],["Clostridium",0,"Clostridium is a predominant anaerobe, not a coliform. [Slide #9]"]],"m":"","id":173},{"s":8,"q":"Neisseria colonizes which respiratory location?","o":[["Nasopharyngeal mucous membranes behind the soft palate",1,"Neisseria is found on nasopharyngeal mucous membranes behind the soft palate. [Slide #10]"],["Nasal vestibule and entrance",0,"This is where S. aureus is found. [Slide #10]"],["Tonsils and lower pharynx",0,"Streptococci and Haemophilus are found here. [Slide #10]"],["Lower lung tissue",0,"The lungs are sterile. [Slide #4]"]],"m":"","id":174},{"s":8,"q":"A healthy person with asymptomatic S. aureus at the nasal entrance is best described as which of the following?","o":[["A natural flora carrier",1,"S. aureus is a normal nasal resident restricted to the surface without invading sterile tissue. [Slide #10]"],["A true pathogen infection",0,"Infection requires invasion of sterile tissue, which is absent here. [Slide #13]"],["An opportunistic infection",0,"The microbe sits in its natural site in a healthy host. [Slide #13]"],["A sterile site contamination",0,"The nasal entrance is a flora site, not a sterile site. [Slide #3]"]],"m":"","id":175},{"s":8,"q":"Females are more prone to UTIs because the female urethra is _______ than the male urethra.","o":[["Shorter",1,"The female urethra is shorter and closer to the outside, so microbes travel a shorter distance. [Slide #11]"],["Longer",0,"The male urethra is the longer one. [Slide #11]"],["More sterile",0,"The female urethra is more likely to carry bacteria because of its proximity to the outside. [Slide #11]"],["More acidic",0,"Urethral length, not acidity, explains the difference. [Slide #11]"]],"m":"","id":176},{"s":8,"q":"Which group represents the principal residents of the urethra?","o":[["Nonhemolytic streptococci, staphylococci, and corynebacteria",1,"These are the principal urethral residents, with occasional coliforms. [Slide #11]"],["Bacteroides, Bifidobacterium, and Clostridium",0,"These are large intestine anaerobes. [Slide #9]"],["Neisseria, Haemophilus, and oral streptococci",0,"These are respiratory tract residents. [Slide #10]"],["Actinobacteria, Firmicutes, and Proteobacteria",0,"These are phyla of skin flora. [Slide #7]"]],"m":"","id":177},{"s":8,"q":"Which benefit of flora involves promoting cell sloughing and turnover to help lower cancer risk?","o":[["Trophic effects",1,"Trophic effects promote cell changeover, decreasing the potential for cancer. [Slide #12]"],["Microbial antagonism",0,"Antagonism represses pathogenic microbial growth. [Slide #12]"],["Metabolic function",0,"Metabolic function involves vitamin and acid production. [Slide #12]"],["Immune desensitization",0,"This involves reduced immune reactivity to harmless microbes. [Slide #12]"]],"m":"","id":178},{"s":8,"q":"Which pair of flora benefits is described as correlation rather than proven causation?","o":[["Allergy prevention and prevention of IBS",1,"Links between good flora and fewer allergies or less IBS are correlations. [Slide #12]"],["Trophic effects and metabolic function",0,"These are established functional benefits. [Slide #12]"],["Microbial antagonism and trophic effects",0,"These are established functional benefits. [Slide #12]"],["Metabolic function and microbial antagonism",0,"These are established functional benefits. [Slide #12]"]],"m":"","id":179},{"s":8,"q":"Production of vitamins and acids by flora is an example of which benefit?","o":[["Metabolic function",1,"Vitamin and acid generation is the metabolic function of flora. [Slide #12]"],["Trophic effects",0,"Trophic effects concern cell turnover. [Slide #12]"],["Microbial antagonism",0,"Antagonism concerns repression of pathogens. [Slide #12]"],["Allergy prevention",0,"Allergy prevention is a correlated benefit, not a metabolic output. [Slide #12]"]],"m":"","id":180},{"s":8,"q":"Which of the following weakens host defenses and increases susceptibility to infection?","o":[["Chemotherapy",1,"Chemotherapy and immunosuppressive drugs weaken host defenses. [Slide #15]"],["Lactobacilli colonization",0,"Lactobacilli are protective flora, not a weakening factor. [Slide #11]"],["Bifidobacteria accumulation",0,"Bifidobacteria are beneficial flora. [Slide #6]"],["Biofilm formation by natural flora",0,"Flora biofilms help prevent pathogen colonization. [Slide #5]"]],"m":"","id":181},{"s":9,"q":"Which protozoan group moves by pseudopodia?","o":[["Sarcodina (amebas)",1,""],["Ciliophora",0,""],["Mastigophora",0,""],["Apicomplexia",0,""]],"m":"Sarcodina form pseudopodia; ciliates use cilia, flagellates use flagella, and apicomplexans glide on undulating ridges or are non-motile.","id":182},{"s":9,"q":"Which protozoan group glides via undulating ridges or is non-motile?","o":[["Apicomplexia (Sporozoea)",1,""],["Sarcodina",0,""],["Ciliophora",0,""],["Mastigophora",0,""]],"m":"Apicomplexia (Sporozoea) include Plasmodium, Toxoplasma and Cryptosporidium.","id":183},{"s":9,"q":"Which protozoan group are the 'whip bearers'?","o":[["Mastigophora (flagellates)",1,""],["Ciliophora",0,""],["Sarcodina",0,""],["Apicomplexia",0,""]],"m":"Mastigophora move via flexible flagella; Ciliophora are the 'hair bearers'.","id":184},{"s":9,"q":"Which protozoan cytoplasm layer houses the nucleus, mitochondria and vacuoles?","o":[["Endoplasm",1,""],["Ectoplasm",0,""],["Both",0,""],["Neither",0,""]],"m":"The outer ectoplasm handles locomotion, feeding and protection; the inner endoplasm houses organelles.","id":185},{"s":9,"q":"Which structure do all protozoa lack?","o":[["Cell wall",1,""],["Cell membrane",0,""],["Nucleus",0,""],["Cytoplasm",0,""]],"m":"Protozoa are eukaryotes with a cell membrane but no cell wall.","id":186},{"s":9,"q":"Encystment is the process in which a:","o":[["Trophozoite rounds up and secretes a tough cuticle to become a cyst",1,""],["Cyst converts into a trophozoite",0,""],["Cyst divides by multiple fission",0,""],["Trophozoite fuses with a gamete",0,""]],"m":"Encystment occurs when conditions become unsuitable for growth and feeding.","id":187},{"s":9,"q":"Which asexual method is performed ONLY by the Sporozoea (multiple fission, schizogony)?","o":[["Multiple fission",1,""],["Longitudinal binary fission",0,""],["Transverse binary fission",0,""],["Conjugation",0,""]],"m":"Mastigophora divide longitudinally, Ciliophora transversely, Sarcodina with no fixed plane.","id":188},{"s":9,"q":"Which protozoan group reproduces sexually by conjugation using micronuclei?","o":[["Ciliophora",1,""],["Mastigophora",0,""],["Sarcodina",0,""],["Sporozoea",0,""]],"m":"Mastigophora do not usually reproduce sexually.","id":189},{"s":9,"q":"Which flagellate causes giardiasis, spread by contaminated water ('beaver fever')?","o":[["Giardia lamblia",1,""],["Trichomonas vaginalis",0,""],["Entamoeba histolytica",0,""],["Balantidium coli",0,""]],"m":"The cyst is infectious (fecal-oral). Boiling water kills it. About 90% of cases are asymptomatic; symptomatic cases have greasy floating stools.","id":190},{"s":9,"q":"Which protozoan disease has NO cyst stage and is sexually transmitted?","o":[["Trichomoniasis",1,""],["Giardiasis",0,""],["Amebiasis",0,""],["Balantidiasis",0,""]],"m":"Trichomonas vaginalis is spread as a trophozoite and treated with metronidazole for both partners.","id":191},{"s":9,"q":"African sleeping sickness is caused by Trypanosoma brucei and vectored by the:","o":[["Tsetse fly",1,""],["Reduviid (kissing) bug",0,""],["Anopheles mosquito",0,""],["Sand fly",0,""]],"m":"Chagas disease is vectored by reduviid bugs; malaria by Anopheles; leishmaniasis by sand flies.","id":192},{"s":9,"q":"Chagas disease (Trypanosoma cruzi) is transmitted by:","o":[["Reduviid (kissing) bug feces",1,""],["Tsetse fly bite",0,""],["Contaminated water",0,""],["Undercooked pork",0,""]],"m":"Chronic infection can cause dilated cardiomyopathy and congestive heart failure.","id":193},{"s":9,"q":"Which disease is caused by Leishmania and spread by phlebotomine sand flies?","o":[["Leishmaniasis",1,""],["Chagas disease",0,""],["Toxoplasmosis",0,""],["Amebiasis",0,""]],"m":"The cutaneous form is most common; the visceral form affects spleen, liver and bone marrow.","id":194},{"s":9,"q":"Which species causes amebic dysentery, infects the colon and is diagnosed by cysts in stool?","o":[["Entamoeba histolytica",1,""],["Naegleria fowleri",0,""],["Acanthamoeba",0,""],["Giardia lamblia",0,""]],"m":"The cyst has 4 nuclei and is the infectious stage; about 90% of cases are asymptomatic.","id":195},{"s":9,"q":"Which ameba enters through the nasal passages and causes primary amebic meningoencephalitis (~97% fatal)?","o":[["Naegleria fowleri",1,""],["Acanthamoeba",0,""],["Entamoeba histolytica",0,""],["Balantidium coli",0,""]],"m":"The trophozoite is the infectious stage and death usually occurs within about 10 days.","id":196},{"s":9,"q":"Which organism causes amebic keratitis of the cornea?","o":[["Acanthamoeba",1,""],["Naegleria fowleri",0,""],["Plasmodium",0,""],["Cryptosporidium",0,""]],"m":"Acquired from contaminated soil or water; the cyst stage complicates treatment.","id":197},{"s":9,"q":"Which ciliate causes balantidiasis, with pigs as a reservoir?","o":[["Balantidium coli",1,""],["Giardia lamblia",0,""],["Cryptosporidium",0,""],["Trichomonas vaginalis",0,""]],"m":"Balantidiasis is the only ciliate disease covered; its cyst is infectious by the fecal-oral route.","id":198},{"s":9,"q":"Cryptosporidiosis is most dangerous (fatal watery diarrhea) in:","o":[["Immunocompromised patients",1,""],["Healthy adults",0,""],["Pregnant women only",0,""],["Infants only",0,""]],"m":"In healthy people it causes self-limited enteritis; nitazoxanide is the usual drug.","id":199},{"s":9,"q":"Malaria is caused by Plasmodium and vectored by the:","o":[["Female Anopheles mosquito",1,""],["Tsetse fly",0,""],["Reduviid bug",0,""],["Sand fly",0,""]],"m":"The mosquito hosts the sexual phase, so it is a biological vector.","id":200},{"s":9,"q":"Which is the infectious stage of Plasmodium injected by the mosquito?","o":[["Sporozoites",1,""],["Merozoites",0,""],["Oocysts",0,""],["Trophozoites",0,""]],"m":"Sporozoites go to the liver, undergo schizogony, and the resulting merozoites invade RBCs.","id":201},{"s":9,"q":"Malaria fever occurs at 48- or 72-hour intervals because of:","o":[["Synchronous rupture of RBCs",1,""],["Tidal hormone cycles",0,""],["Sporozoite release from the liver",0,""],["Mosquito feeding cycles",0,""]],"m":"Interval length and regularity reflect the Plasmodium species.","id":202},{"s":9,"q":"Which Plasmodium species causes the most malignant malaria with the highest acute death rate?","o":[["P. falciparum",1,""],["P. malariae",0,""],["P. vivax",0,""],["P. ovale",0,""]],"m":"Some malaria types relapse because dormant forms persist in liver cells for years.","id":203},{"s":9,"q":"Toxoplasma gondii has which definitive host, spreading oocysts in feces?","o":[["Cats (felines)",1,""],["Pigs",0,""],["Mosquitoes",0,""],["Rodents",0,""]],"m":"Humans acquire it from cat feces or undercooked meat. Pregnant women should avoid litter boxes because the fetus can be damaged.","id":204},{"s":9,"q":"Which medical threat is the PRIMARY one from algae?","o":[["Toxins in seafood causing poisoning",1,""],["Skin infections",0,""],["Photosynthesis in tissue",0,""],["Intestinal parasitism",0,""]],"m":"Algae rarely infect (Prototheca is the exception); the main risk is marine algal toxins.","id":205},{"s":9,"q":"Which algal poisoning is NOT fatal but can also be aerosolized, causing asthma-like symptoms?","o":[["Neurotoxic shellfish poisoning",1,""],["Paralytic shellfish poisoning",0,""],["Ciguatera fish poisoning",0,""],["A let hist={};try{hist=JSON.parse(localStorage.getItem('mbh')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('mbh',JSON.stringify(hist))}catch(e){}};
let sel=new Set(SUBJ.map((_,i)=>i)),weak=false,Q=[],ans=[],cur=0;
const $=s=>document.getElementById(s),shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pool=()=>BANK.filter(b=>sel.has(b.s));
function home(){const p=pool(),m=p.filter(b=>(hist[b.id]||0)>0).length;
 const modes=[["Quickie",15],["Quickie",25],["Quickie",35],["Full exam",50],["Entire bank",p.length]];
 $('app').innerHTML=`<h1>Microbiology Question Bank</h1><div class="card"><b>${BANK.length} questions</b> across ${SUBJ.length} subjects. ${p.length} selected.</div>
 <h2>SUBJECTS</h2><div class="chips">${SUBJ.map((s,i)=>`<button class="chip ${sel.has(i)?'on':''}" onclick="tog(${i})">${s} (${BANK.filter(b=>b.s===i).length})</button>`).join('')}</div>
 <div class="row"><button class="sec" onclick="all_(1)">Select all</button><button class="sec" onclick="all_(0)">Clear</button><button class="chip ${weak?'on':''}" onclick="weak=!weak;home()">Prioritize missed (${m})</button></div>
 <h2>START</h2><div class="modes">${modes.map(([n,c])=>`<button class="m" ${p.length?'':'disabled'} onclick="start(${c})"><b>${c>p.length?p.length:c}</b>${n}<br><span>${n=='Quickie'?'Quick check':n=='Full exam'?'Exam length':'Everything selected'}</span></button>`).join('')}</div>
 <div class="row"><button class="sec" onclick="if(confirm('Clear missed-question history?')){hist={};save();home()}">Reset history</button></div>`}
function tog(i){sel.has(i)?sel.delete(i):sel.add(i);home()}
function all_(v){sel=v?new Set(SUBJ.map((_,i)=>i)):new Set();home()}
function start(n){let p=pool().slice(),out=[];n=Math.min(n,p.length);
 if(weak){while(out.length<n){const w=p.map(b=>1+3*(hist[b.id]||0));let r=Math.random()*w.reduce((a,b)=>a+b,0),k=0;while(r>w[k]&&k<p.length-1){r-=w[k];k++}out.push(p.splice(k,1)[0])}}
 else out=shuf(p).slice(0,n);
 Q=out.map(b=>({...b,o:shuf(b.o.map(x=>x.slice()))}));ans=new Array(Q.length).fill(null);cur=0;show()}
function show(){const q=Q[cur],done=ans.filter(a=>a!==null).length,sc=ans.filter(a=>a===1).length;
 $('app').innerHTML=`<div class="top"><span>Question ${cur+1} of ${Q.length}</span><span>Score ${sc}/${done}</span><button class="sec" style="padding:4px 10px" onclick="if(confirm('Quit this quiz?'))home()">Quit</button></div><div class="bar"><i style="width:${done/Q.length*100}%"></i></div>
 <div class="card" style="margin-top:12px"><div class="tag">${SUBJ[q.s]}</div><p style="font-weight:600">${q.q}</p>${q.o.map((o,i)=>`<button class="opt" id="o${i}" onclick="pick(${i})"><b style="color:var(--ac)">${'ABCD'[i]}.</b> ${o[0]}</button>`).join('')}<div id="ex"></div><div class="row" id="nx"></div></div>`}
function pick(i){if(ans[cur]!==null)return;const q=Q[cur],ok=q.o[i][1]?1:0;ans[cur]=ok;
 hist[q.id]=ok?Math.max(0,(hist[q.id]||0)-1):(hist[q.id]||0)+1;save();
 q.o.forEach((o,k)=>{const b=$('o'+k);b.disabled=true;if(o[1])b.classList.add('ok');else if(k===i)b.classList.add('no')});
 const rat=q.o.some(o=>o[2])?'<ul>'+q.o.map((o,k)=>`<li><b>${'ABCD'[k]}) ${o[0]}:</b> ${o[2]}</li>`).join('')+'</ul>':'';
 $('ex').innerHTML=`<div class="ex"><b style="color:var(--${ok?'ok':'no'})">${ok?'Correct!':'Incorrect.'}</b> ${q.m}${rat}</div>`;
 $('nx').innerHTML=`<button class="go" onclick="${cur+1<Q.length?'cur++;show()':'finish()'}">${cur+1<Q.length?'Next':'See results'}</button>`}
function finish(){const sc=ans.filter(a=>a===1).length,by={};
 Q.forEach((q,i)=>{by[q.s]=by[q.s]||[0,0];by[q.s][1]++;if(ans[i]===1)by[q.s][0]++});
 const missed=Q.filter((q,i)=>ans[i]!==1);
 $('app').innerHTML=`<h1>Results</h1><div class="card"><div style="font-size:2rem;font-weight:700;color:var(--ac)">${sc} / ${Q.length} (${Math.round(sc/Q.length*100)}%)</div></div>
 <div class="card"><table>${Object.keys(by).map(k=>`<tr><td>${SUBJ[k]}</td><td style="text-align:right">${by[k][0]}/${by[k][1]}</td></tr>`).join('')}</table></div>
 <div class="row">${missed.length?`<button class="go" onclick="retry()">Retry ${missed.length} missed</button>`:''}<button class="sec" onclick="home()">Back to menu</button></div>`}
function retry(){Q=shuf(Q.filter((q,i)=>ans[i]!==1).map(q=>({...q,o:shuf(q.o)})));ans=new Array(Q.length).fill(null);cur=0;show()}
home();
</script></body></html>
