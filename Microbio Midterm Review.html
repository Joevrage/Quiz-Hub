<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Microbiology Question Bank</title>
<style>
:root{--bg:#f6f6f4;--card:#fff;--tx:#161616;--tx2:#5c5c5c;--ac:#c26a00;--ok:#15803d;--okb:#dcfce7;--no:#b91c1c;--nob:#fee2e2;--bd:#d8d8d4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f0f0f;--card:#1a1a1a;--tx:#fff;--tx2:#a0a0a0;--ac:#ff9900;--ok:#22c55e;--okb:#14532d;--no:#ef4444;--nob:#7f1d1d;--bd:#333}}
:root[data-theme=dark]{--bg:#0f0f0f;--card:#1a1a1a;--tx:#fff;--tx2:#a0a0a0;--ac:#ff9900;--ok:#22c55e;--okb:#14532d;--no:#ef4444;--nob:#7f1d1d;--bd:#333}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,Segoe UI,Roboto,Arial,sans-serif}
.w{max-width:780px;margin:0 auto;padding:16px}h1{color:var(--ac);font-size:1.4rem;margin:8px 0}h2{font-size:1rem;color:var(--tx2);margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:14px}
button{font:inherit;color:inherit;cursor:pointer}.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.m{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;text-align:left}.m:hover{border-color:var(--ac)}.m b{display:block;color:var(--ac);font-size:1.1rem}.m span{color:var(--tx2);font-size:.85rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--bd);background:var(--card);border-radius:20px;padding:6px 12px;font-size:.85rem}.chip.on{border-color:var(--ac);background:var(--ac);color:#000}
.opt{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:12px;margin:8px 0}.opt:hover:not(:disabled){border-color:var(--ac)}
.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.no{background:var(--nob);border-color:var(--no)}.opt:disabled{cursor:default}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;font-size:.9rem;color:var(--tx2)}
.ex{margin-top:12px;padding:12px;border-radius:10px;background:var(--bg);border-left:4px solid var(--ac);font-size:.92rem}.ex li{margin:6px 0}.ex ul{padding-left:18px;margin:8px 0 0}
.go{background:var(--ac);color:#000;border:0;border-radius:10px;padding:12px 18px;font-weight:700}.sec{background:none;border:1px solid var(--bd);border-radius:10px;padding:12px 18px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.tag{font-size:.75rem;color:var(--ac)}table{width:100%;border-collapse:collapse;font-size:.9rem}td{padding:5px 0;border-bottom:1px solid var(--bd)}
</style></head><body><div class="w" id="app"></div>
<script>
const SUBJ=["Foundations & History","Pathogens & Virulence","Flagella, Pili & Glycocalyx","Cell Wall, Membrane & Endospores","Shapes & Unusual Bacteria","Nutrition & Growth","Metabolism","Genetics","Normal Flora & Infection","Protozoa & Algae"],BANK=[{"s":0,"q":"Which category of bacteria contains all organisms of medical importance?","o":[["Archaea",0,"Archaea are environmental extremophiles and do not comprise human medical pathogens."],["Prions",0,"Prions are misfolded, infectious protein particles lacking cellular organization or nucleic acid genomes."],["Eukaryotes",0,"Eukaryotes possess membrane-bound nuclei and organelles, categorizing fungi and parasites rather than true bacteria."],["Eubacteria",1,"Eubacteria encompasses all true prokaryotic bacteria of clinical and medical significance."]],"m":"Eubacteria represents the biological domain containing all medically relevant bacterial human pathogens.","id":0},{"s":0,"q":"What unit of measurement is specifically used when measuring viruses compared to bacteria?","o":[["Viruses = Micrometer (μm); Bacteria = Nanometer (nm)",0,"This reverses the units; micrometers represent cells, whereas nanometers represent sub-microscopic viral particles."],["Viruses = Nanometer (nm); Bacteria = Micrometer (μm)",1,"Viruses measure in nanometers (10–250 nm), whereas typical bacteria are measured in micrometers (0.2–5 μm)."],["Both are measured exclusively in millimeters",0,"Millimeters are macroscopic metric units suitable for multicellular helminths rather than single bacteria or viruses."],["Viruses = Picometers; Bacteria = Angstroms",0,"Picometers and Angstroms denote atomic and bond distances rather than whole microbial dimensions."]],"m":"Sub-microscopic viruses require transmission electron microscopy and are quantified in nanometers (10–250 nm), whereas light-visible bacteria are sized in micrometers (0.2–5 μm).","id":1},{"s":0,"q":"What is the typical size range of most bacteria compared to a human Red Blood Cell (RBC)?","o":[["Bacteria: 0.2–5 μm; RBC: 7–10 μm",1,"Bacteria measure 0.2–5 μm in size, rendering them smaller than human erythrocytes, which span 7–10 μm."],["Bacteria: 10–25 μm; RBC: 2–5 μm",0,"This inverts relative sizes; bacteria do not exceed erythrocyte dimensions."],["Bacteria: 100–200 nm; RBC: 1–2 μm",0,"100–200 nm reflects viral particle sizes, not typical eubacterial cell diameters."],["Bacteria: 7–10 μm; RBC: 0.2–5 μm",0,"Erythrocytes measure approximately 7–10 μm, whereas bacteria are substantially smaller."]],"m":"Clinical bacteria typically range between 0.2 and 5 μm, making them physically smaller than human erythrocytes (7–10 μm), preventing filtration clearance from infected systemic circulation.","id":2},{"s":0,"q":"Which historical figure disproved spontaneous generation for maggots on decaying meat?","o":[["Louis Pasteur",0,"Pasteur resolved the microbial debate on biogenesis using swan-neck flasks, not raw meat jars."],["Anton von Leeuwenhoek",0,"Leeuwenhoek manufactured simple microscopes to observe live animalcules rather than conducting meat exclusion tests."],["Robert Koch",0,"Koch established disease causation criteria (Koch's Postulates) rather than evaluating spontaneous macro-generation."],["Francesco Redi",1,"Redi demonstrated in 1668 that covered meat containers prevented fly oviposition, proving maggots do not spontaneously generate from rotting flesh."]],"m":"Francesco Redi utilized controlled jar experiments to prove that macro-organisms such as fly larvae arise exclusively from pre-existing eggs rather than spontaneous generation.","id":3},{"s":0,"q":"Which scientist disproved abiogenesis for microorganisms using swan-necked flasks?","o":[["Anton von Leeuwenhoek",0,"Leeuwenhoek pioneered microscopic observation of living microbes, not broth sterilization trials."],["Francesco Redi",0,"Redi evaluated fly development in meat jars rather than microbial broth infusion experiments."],["Louis Pasteur",1,"Pasteur utilized open, swan-necked flasks to allow air exposure while trapping airborne particulates, proving microbes do not generate spontaneously in sterilized infusions."],["Robert Hooke",0,"Hooke documented microscopic cellular cork structures rather than disproving microbial spontaneous generation."]],"m":"Louis Pasteur settled the abiogenesis debate for microorganisms by proving that sterile broth remains uncolonized when ambient dust and microbial vectors are mechanically excluded by a curved flask neck.","id":4},{"s":0,"q":"What is the fundamental difference between Abiogenesis and Biogenesis?","o":[["Abiogenesis states life comes from pre-existing life; Biogenesis claims life arises from non-living matter",0,"This inverts the foundational definitions of both biological concepts."],["Abiogenesis applies only to viruses; Biogenesis applies to bacteria",0,"Both terms apply broadly to the origin of living biological organisms, not specific taxa."],["Abiogenesis claims living things arise from non-living matter/vital forces; Biogenesis states living things arise only from pre-existing living cells of their same kind",1,"Abiogenesis proposes that life generates from inanimate matter or vital forces, while biogenesis establishes that life originates solely from pre-existing living organisms."],["Abiogenesis refers to chemical disinfection; Biogenesis refers to sterilization",0,"These terms describe life origin paradigms rather than physical or chemical disinfection techniques."]],"m":"Biogenesis dictates that living cells arise exclusively from pre-existing parental cells of their own kind, whereas abiogenesis purports spontaneous generation from non-living matter.","id":5},{"s":0,"q":"Who was the first person to observe live bacteria and protozoa using single-lens microscopes?","o":[["Louis Pasteur",0,"Pasteur made groundbreaking discoveries in fermentation and vaccination centuries after initial microscopic visualization."],["Francesco Redi",0,"Redi conducted macroscopic insect experiments without compound or specialized single-lens microscopes."],["Anton von Leeuwenhoek",1,"Leeuwenhoek hand-ground high-magnification single-lens microscopes, first observing and recording live motile bacteria and protozoa."],["Robert Koch",0,"Koch developed diagnostic pure-culture isolation and staining techniques in late 19th-century medical microbiology."]],"m":"Anton von Leeuwenhoek was the first to visualize and systematically document live motile microorganisms utilizing precision ground single-lens microscopes.","id":6},{"s":0,"q":"Which of the following answer choices includes ONLY prokaryotic organisms?","o":[["Fungi, Protozoa, and Eubacteria",0,"Fungi and protozoa are eukaryotic cells containing membrane-bound nuclear envelopes."],["Eubacteria and Archaea",1,"Prokaryotic life is divided into two distinct domains: Eubacteria and Archaea, both lacking membrane-delimited nuclei."],["Viruses, Eubacteria, and Molds",0,"Viruses are acellular complexes, while molds are multicellular eukaryotic fungi."],["Protozoa, Archaea, and Prions",0,"Protozoa are eukaryotes and prions are infectious proteins without cellular organization."]],"m":"The prokaryotic structural category comprises strictly Eubacteria and Archaea, defined by the absence of an enclosed nuclear envelope.","id":7},{"s":0,"q":"What primary structural feature differentiates prokaryotes from eukaryotes?","o":[["Prokaryotes have membrane-bound organelles",0,"Prokaryotes lack membrane-enclosed internal organelles such as mitochondria and chloroplasts."],["Prokaryotes lack a nucleus",1,"Prokaryotes possess a free nucleoid region and specifically lack a membrane-bound nucleus."],["Eukaryotes lack ribosomes",0,"Eukaryotes contain functional 80S cytoplasmic and 70S organellar ribosomes."],["Prokaryotes contain linear chromosomes wrapped in histones",0,"Eubacteria typically possess a single circular chromosome lacking traditional eukaryotic histones."]],"m":"Prokaryotes are defined by the absence of a true membrane-delimited nucleus, with genomic DNA localized directly within the cytoplasm.","id":8},{"s":0,"q":"Which lipid component is present in eukaryotic plasma membranes to maintain structural integrity but is absent in most prokaryotic plasma membranes?","o":[["Phospholipid bilayer",0,"Both prokaryotic and eukaryotic membranes are structured upon amphipathic phospholipid bilayers."],["Integral membrane proteins",0,"Integral membrane transport proteins are essential components of both cell types."],["Selective permeability",0,"Both prokaryotic and eukaryotic plasma membranes function as selectively permeable barriers."],["Sterols (e.g., cholesterol)",1,"Sterols (such as cholesterol) rigidify eukaryotic plasma membranes and are absent in eubacterial membranes, with the exception of cell-wall-deficient Mycoplasma."]],"m":"Eukaryotic plasma membranes incorporate sterols like cholesterol to maintain lipid fluidity and stability, a feature absent in nearly all prokaryotic membranes.","id":9},{"s":0,"q":"What is the size composition of prokaryotic cytoplasmic ribosomes compared to eukaryotic cytoplasmic ribosomes?","o":[["Prokaryotes = 80S; Eukaryotes = 70S",0,"This inverts sedimentation coefficients between the two cellular domains."],["Prokaryotes = 70S; Eukaryotes = 80S",1,"Prokaryotic ribosomes sediment at 70S (50S + 30S subunits), whereas eukaryotic cytoplasmic ribosomes sediment at 80S (60S + 40S subunits)."],["Prokaryotes = 50S; Eukaryotes = 30S",0,"50S and 30S are the structural sub-components of the intact 70S prokaryotic ribosome."],["Prokaryotes = 60S; Eukaryotes = 40S",0,"60S and 40S represent the subunit breakdown of eukaryotic cytoplasmic ribosomes."]],"m":"Prokaryotes possess 70S ribosomes (composed of 50S and 30S subunits), providing an anatomical target for selective antimicrobial therapies relative to human 80S ribosomes.","id":10},{"s":0,"q":"Which term is defined as the complete destruction or removal of ALL viable microorganisms, including endospores and viruses?","o":[["Disinfection",0,"Disinfection reduces vegetative pathogens on inanimate surfaces but often fails to eliminate bacterial endospores."],["Sterilization",1,"Sterilization represents the absolute elimination of all microbial life forms, including resistant bacterial endospores and acellular viruses."],["Bacteriostasis",0,"Bacteriostasis transiently halts microbial replication without achieving permanent lethal destruction or sporicidal clearance."],["Sanitization",0,"Sanitization mechanically reduces microbial loads to acceptable public health levels without sterilizing."]],"m":"Sterilization achieves complete destruction of all biological life, specifically validated by the eradication of heat-resistant bacterial endospores.","id":11},{"s":0,"q":"How do bactericidal agents differ from bacteriostatic agents?","o":[["Bactericidal agents kill bacteria; bacteriostatic agents halt/slow growth without killing cells",1,"Bactericidal chemicals induce irreversible cell death, whereas bacteriostatic treatments inhibit growth without directly destroying the bacterial population."],["Bactericidal agents inhibit viruses; bacteriostatic agents kill spores",0,"These terms describe bacterial control; virucidal and sporicidal are the respective proper terms."],["Bactericidal agents work only in cold temperatures; bacteriostatic agents require heat",0,"Mechanism of action depends on molecular target rather than rigid thermal prerequisites."],["Bactericidal agents affect eukaryotes; bacteriostatic agents affect prokaryotes",0,"Both categories target bacterial prokaryotic organisms."]],"m":"Bactericidal agents induce direct bacterial cellular lysis and death, whereas bacteriostatic methods suppress cellular metabolism and replication, relying on host immunity for clearance.","id":12},{"s":1,"q":"An 'opportunistic pathogen' is best defined as a microbe that:","o":[["Causes severe disease in individuals with healthy, normal immune defenses",0,"This defines a true (primary) pathogen, which possesses intrinsic virulence to breach intact host defenses."],["Is completely incapable of causing infection under any condition",0,"Non-pathogens do not cause disease, whereas opportunists cause severe clinical pathology when conditions permit."],["Causes disease when host defenses are compromised or when established outside its normal habitat",1,"Opportunistic pathogens exploit impaired host immunity, anatomical breaches, or translocations into foreign tissue sites."],["Spreads exclusively via insect vectors",0,"Vector transmission characterizes specific zoonoses, not the general opportunistic definition."]],"m":"Opportunistic pathogens cause infection when host immune barriers are suppressed or when normal endogenous microflora establishes inside sterile anatomical compartments.","id":13},{"s":1,"q":"How is a 'true pathogen' differentiated from an opportunistic pathogen?","o":[["True pathogens cause disease in healthy individuals with fully intact immune systems",1,"True (primary) pathogens have specialized virulence factors capable of invading and causing pathology in immunocompetent hosts."],["True pathogens only infect plants",0,"True pathogens encompass human, animal, and agricultural disease agents."],["True pathogens lack virulence factors",0,"Virulence factors are required for primary pathogens to overcome non-specific and adaptive immune barriers."],["True pathogens cannot survive outside a host cell",0,"Many primary bacterial pathogens can persist or replicate in extracellular environments."]],"m":"True pathogens possess virulence mechanisms that enable infection and pathology in healthy, immunocompetent human hosts.","id":14},{"s":1,"q":"What is the relationship between Pathogenicity and Virulence?","o":[["Pathogenicity is the qualitative ability to cause harm, while virulence is the quantitative degree or intensity of pathogenicity",1,"Pathogenicity is a qualitative binary property (disease-causing capability), whereas virulence measures the quantitative severity and potency of that capacity."],["Pathogenicity is the degree of damage, while virulence is the capability to cause disease",0,"This reverses the qualitative versus quantitative definitions of these pathological concepts."],["Pathogenicity applies only to viruses, while virulence applies only to bacteria",0,"Both parameters are applicable to all biological infectious agents."],["Pathogenicity is quantitative, while virulence is qualitative",0,"Pathogenicity denotes qualitative potential, while virulence denotes quantitative severity."]],"m":"Pathogenicity refers to the qualitative capacity of an organism to cause harm, while virulence represents the quantitative degree of pathology or structural damage it can inflict.","id":15},{"s":1,"q":"What is the mathematical relationship between inoculum size (infectious dose) and virulence?","o":[["The higher the required infectious dose, the higher the virulence",0,"Higher required doses reflect lower virulence because more organisms are needed to establish disease."],["The lower the required infectious dose, the higher the virulence",1,"Virulence is inversely proportional to infectious dose; a lower cell count needed to cause disease reflects higher pathogenic potency."],["Infectious dose and virulence are completely unrelated",0,"Infectious dose is a critical quantitative metric used to assess pathogen virulence (e.g., ID50)."],["Infectious dose applies only to opportunistic fungi",0,"Infectious dose applies to bacterial, viral, parasitic, and fungal clinical agents."]],"m":"The smaller the infectious dose needed to colonize and cause disease within a host, the higher the comparative virulence of that pathogen.","id":16},{"s":2,"q":"Most bacteria that possess flagella exhibit which cell shape?","o":[["Cocci (spherical)",0,"The vast majority of spherical cocci are non-motile and lack flagella."],["Rods (bacilli)",1,"Flagellar appendages are predominantly distributed among rod-shaped bacteria (bacilli) and spiral forms."],["Spirochetes (corkscrew)",0,"Spirochetes utilize periplasmic axial filaments rather than standard external flagellar projections."],["Spirilla (rigid helix)",0,"While some spirilla are flagellated, bacilli represent the largest group of flagellated organisms."]],"m":"Most flagellated bacteria of medical importance are bacilli (rods), whereas true cocci are almost universally non-motile.","id":17},{"s":2,"q":"What three basic components form the physical structure of a bacterial flagellum?","o":[["Capsule, Slime layer, Peptidoglycan",0,"These are structural layers of the glycocalyx and bacterial cell envelope."],["Pilus, Fimbriae, Flagellin",0,"Pili and fimbriae are non-motile attachment appendages."],["Filament, Hook, Basal Body",1,"A complete bacterial flagellum comprises the external helical filament, the universal curved hook, and the membrane-anchored basal body motor."],["Outer membrane, Periplasm, Plasma membrane",0,"These represent anatomical divisions of a Gram-negative cell envelope."]],"m":"Bacterial flagella consist of the external flagellin filament, a flexible curved hook, and a motor-driven basal body embedded in the cell envelope.","id":18},{"s":2,"q":"Which component of the flagellum directly anchors it into the cell wall and plasma membrane?","o":[["Basal Body",1,"The basal body consists of central rods and ring complexes that anchor the flagellar apparatus into the cell wall and plasma membrane."],["Filament",0,"The filament extends outward into the extracellular milieu to provide propulsion."],["Hook",0,"The hook acts as a universal joint connecting the filament to the basal body."],["Capsule",0,"The capsule is an extracellular polysaccharide glycocalyx structure."]],"m":"The basal body serves as the rotary motor and structural anchor, embedding the flagellar assembly into the bacterial envelope.","id":19},{"s":2,"q":"What powers the rotation of bacterial flagella?","o":[["Proton Motive Force (H+) generated by the Electron Transport Chain driving Mot proteins",1,"Flagellar rotation is powered by the proton motive force (transmembrane H+ gradient) channeled through Mot protein stators."],["Direct ATP hydrolysis via ATPase",0,"Unlike eukaryotic cilia/flagella which consume ATP directly via dynein, bacterial flagella utilize proton motive force."],["GTP consumption in the cytoplasm",0,"GTP is utilized in protein translation, not bacterial flagellar propulsion."],["Passive diffusion of sodium ions",0,"Standard eubacterial motors are driven by hydrogen ion (proton) influx."]],"m":"Flagellar torque is driven by the electrochemical proton gradient (proton motive force) moving hydrogen ions through stator complexes.","id":20},{"s":2,"q":"Which flagellar arrangement features a cluster of multiple flagella located at only ONE pole of the cell?","o":[["Monotrichous",0,"Monotrichous denotes a solitary single flagellum at one bacterial pole."],["Amphitrichous",0,"Amphitrichous denotes flagellar structures projecting from both opposite poles."],["Peritrichous",0,"Peritrichous describes flagella distributed over the entire cellular surface."],["Lophotrichous",1,"Lophotrichous designates a tuft or cluster of multiple flagella emerging from a single polar site."]],"m":"A lophotrichous flagellar configuration features a tuft or bundle of flagella originating from one cellular pole.","id":21},{"s":2,"q":"If a single flagellum is found at both poles of a bacterial cell, how is the bacterium classified?","o":[["Amphitrichous",1,"Amphitrichous indicates flagella located at both opposite ends/poles of the cell."],["Lophotrichous",0,"Lophotrichous denotes a tuft restricted to a single pole."],["Monotrichous",0,"Monotrichous describes a single flagellum restricted to one pole."],["Peritrichous",0,"Peritrichous refers to flagella distributed across the entire periphery."]],"m":"An amphitrichous arrangement is characterized by flagella positioned at both diametrically opposed cellular poles.","id":22},{"s":2,"q":"Which term describes flagella distributed randomly all over the surface of the bacterial cell?","o":[["Peritrichous",1,"Peritrichous describes flagella dispersed over the entire surface of the cell body."],["Amphitrichous",0,"Amphitrichous denotes flagellar localization strictly at both poles."],["Lophotrichous",0,"Lophotrichous refers to a localized cluster at one pole."],["Atrichous",0,"Atrichous designates an absence of flagellar appendages."]],"m":"Peritrichous flagellation displays flagella distributed nonspecifically across the perimeter of the bacterium.","id":23},{"s":2,"q":"During flagellar movement, what rotation direction produces a smooth 'run' versus a 'tumble'?","o":[["Run = Clockwise; Tumble = Counterclockwise",0,"This reverses the rotational dynamics of bacterial motility."],["Run = Counterclockwise; Tumble = Clockwise",1,"Counterclockwise (CCW) rotation bundles the flagella for a smooth, directional run, whereas clockwise (CW) rotation causes the bundle to disperse, inducing a tumble."],["Run = Side-to-side; Tumble = Stationary",0,"Bacterial motility is based on continuous rotation rather than planar whipping."],["Run = Linear; Tumble = Circular",0,"Motility is determined by rotational directions (clockwise versus counterclockwise)."]],"m":"Counterclockwise flagellar rotation aligns filaments into a cohesive bundle for linear runs, whereas clockwise rotation disrupts the bundle to produce reorienting tumbles.","id":24},{"s":2,"q":"How does a bacterium alter its movement behavior when navigating a REPELLENT concentration gradient?","o":[["Tumbles less, moving up the gradient slowly",0,"This describes adaptation toward a chemical attractant, not an environmental toxicant."],["Stops moving entirely to conserve ATP",0,"Bacteria increase motility to vacate dangerous local chemical environments."],["Tumbles more often, moving down the gradient at INCREASED speeds",1,"Exposure to a repellent increases tumbling frequency and increases migration speed away from the toxic source down the gradient."],["Moves in a perfectly straight line toward the repellent",0,"Bacteria do not migrate toward harmful chemical repellents."]],"m":"In a repellent gradient, cells tumble more frequently and achieve faster net velocity moving down the concentration gradient to escape.","id":25},{"s":2,"q":"How does a bacterium adapt its movement behavior when navigating an ATTRACTANT concentration gradient?","o":[["Tumbles less, moving up the gradient at SLOWER speeds",1,"In an attractant gradient, tumbling frequency is suppressed and runs are prolonged, moving slowly up the gradient toward the nutrient."],["Tumbles more, moving down the gradient rapidly",0,"Increased tumbling occurs in response to repellents or absent gradients."],["Moves in random directions at max speed",0,"Attractant detection creates biased, directional migration rather than purely random runs."],["Rotates clockwise continuously",0,"Continuous clockwise rotation would cause indefinite tumbling with zero forward progress."]],"m":"Attractant gradients suppress clockwise rotation, producing fewer tumbles and longer runs moving up the concentration gradient toward the chemical.","id":26},{"s":2,"q":"In the absence of any chemical gradient (no attractant or repellent), how does a bacterium move?","o":[["In a straight line indefinitely",0,"Without tumbling, bacteria cannot reorient their spatial trajectory."],["In random directions with equal distribution of runs and tumbles",1,"Without a gradient stimulus, runs and tumbles occur with balanced frequency, producing a random three-dimensional walk."],["It remains completely motionless",0,"Basal flagellar motors continue rotating even in isotropic environments."],["It tumbles continuously without running",0,"Basal states alternate between periods of runs and tumbles."]],"m":"When no chemical gradient exists, bacteria execute unbiased random walks characterized by an equal distribution of runs and reorienting tumbles.","id":27},{"s":2,"q":"Why is the protein flagellin classified as a Pathogen-Associated Molecular Pattern (PAMP or MAMP)?","o":[["Because it is a host cell protein stolen by bacteria",0,"Flagellin is encoded directly by bacterial genes, not acquired from host cells."],["Because flagellin is a conserved bacterial protein recognized by host macrophages to trigger innate responses like fever and inflammation",1,"Flagellin is a conserved foreign structure recognized by host pattern recognition receptors (e.g., TLR5) on macrophages to activate innate immune defenses."],["Because it directly degrades host white blood cells",0,"Flagellin acts as an immune target rather than a cytotoxic leukocidin."],["Because it prevents phagocytosis",0,"Antiphagocytic functions are mediated by capsules, whereas flagella provoke immune recognition."]],"m":"Flagellin is an evolutionary conserved bacterial molecule recognized by host innate receptors (PAMP/MAMP), triggering inflammation, phagocytosis, and fever.","id":28},{"s":2,"q":"Axial filaments (endoflagella) are located between the cell wall and outer membrane to produce undulating motility in which group of bacteria?","o":[["Gram-positive cocci",0,"Gram-positive cocci lack periplasmic spaces, outer membranes, and axial filaments."],["Acid-fast bacilli",0,"Mycobacteria possess thick mycolic acid walls and are non-motile."],["Spirochetes",1,"Axial filaments (endoflagella) are located within the periplasmic space of spirochetes, producing their characteristic corkscrew motility."],["Mycoplasmas",0,"Mycoplasma organisms lack cell walls and periplasmic spaces entirely."]],"m":"Endoflagella (axial filaments) reside within the periplasmic space of spirochetes, rotating to generate twisting, undulating locomotion.","id":29},{"s":2,"q":"From which cellular structure do bacterial pili and fimbriae originate?","o":[["Outer membrane",0,"While they traverse the outer layers, their assembly is rooted within the inner membrane."],["Peptidoglycan cell wall",0,"Peptidoglycan provides structural rigidity but does not anchor pilus initiation complexes."],["Capsule",0,"Capsules are external carbohydrate matrices secreted outside the envelope."],["Cytoplasmic (plasma) membrane",1,"Non-motile appendages like pili and fimbriae originate directly from basal platforms anchored in the cytoplasmic membrane."]],"m":"Bacterial fimbriae and pili originate from protein platforms embedded within the cytoplasmic (plasma) membrane and extend through the wall.","id":30},{"s":2,"q":"What is the key functional difference between short pili (fimbriae) and long pili (sex pili)?","o":[["Short pili (fimbriae) function in adhesion/attachment; long pili function in conjugation (DNA transfer)",1,"Short pili (fimbriae) mediate mechanical adhesion to host tissues, whereas long pili (sex/F pili) facilitate genetic transfer during conjugation."],["Short pili function in locomotion; long pili prevent phagocytosis",0,"Locomotion is mediated by flagella, and phagocytosis prevention is mediated by capsules."],["Short pili carry antibiotic resistance genes; long pili store glycogen",0,"Plasmids carry resistance genes, and inclusion bodies store metabolic glycogen."],["Short pili synthesize peptidoglycan; long pili generate proton motive force",0,"Enzymes in the cytoplasm synthesize peptidoglycan, and the electron transport chain establishes proton motive force."]],"m":"Short pili (fimbriae) mediate adherence to host mucosal surfaces, while specialized long pili (sex pili) form conjugation bridges to transfer genetic material.","id":31},{"s":2,"q":"How do short pili (fimbriae) enable bacterial adhesion to host cells despite both cells carrying negative surface charges?","o":[["By neutralizing host nuclear membranes",0,"Bacterial pili do not interact with internal host nuclear membranes."],["By overcoming electrostatic repulsion to bind host cells before depolymerizing to allow permanent cell wall attachment",1,"Short pili project past the negative charge barrier to bind host receptors, then depolymerize to pull the bacterial cell wall into close contact for permanent attachment."],["By secreting exotoxins that dissolve host plasma membranes",0,"Pili mediate mechanical adherence rather than enzymatic membrane degradation."],["By wrapping around host cells using axial filaments",0,"Axial filaments are internal spirochete structures not involved in fimbrial binding."]],"m":"Short pili overcome mutually negative electrostatic surface repulsions between cells, binding host receptors and depolymerizing to pull the bacterial envelope into permanent contact.","id":32},{"s":2,"q":"What are the two structural layers that make up the bacterial glycocalyx?","o":[["Peptidoglycan layer and Outer membrane",0,"These are distinct layers of the bacterial cell envelope."],["Capsule and Slime layer",1,"The glycocalyx is categorized into two physical forms: a dense, organized capsule or a loose, diffuse slime layer."],["Lipid A and O-antigen",0,"Lipid A and O-antigen are structural domains of lipopolysaccharide (LPS)."],["Plasma membrane and Cell wall",0,"The plasma membrane and cell wall underlie the external glycocalyx."]],"m":"The bacterial glycocalyx is expressed either as a tightly bound, organized capsule or as a loose, unorganized slime layer.","id":33},{"s":2,"q":"What primary advantage does the loose polysaccharide slime layer provide to a bacterial cell?","o":[["Protection from dehydration and nutrient loss, as well as serving in adhesion",1,"The unorganized polysaccharide slime layer retains water and soluble nutrients, preventing dehydration while facilitating surface adherence."],["Active swimming movement",0,"Motility is mediated by flagella, not glycocalyx secretion."],["Direct horizontal gene transfer",0,"Gene transfer requires conjugation pili, transformation complexes, or bacteriophage vectors."],["Complete resistance to autoclaving",0,"Heat resistance is a property of endospores containing calcium dipicolinate."]],"m":"Slime layers consist of loosely bound exopolysaccharides that shield bacteria from dehydration, prevent nutrient loss, and assist in surface colonization.","id":34},{"s":2,"q":"How does a bacterial capsule function as a virulence factor?","o":[["It destroys host red blood cells via hemolysins",0,"Hemolysis is driven by secreted pore-forming protein exotoxins."],["It limits or prevents phagocytic immune cells from engulfing the bacteria",1,"The slippery, organized capsular matrix blocks opsonization and impairs engulfment by host macrophages and neutrophils."],["It allows bacteria to undergo binary fission twice as fast",0,"Replication speed is determined by metabolic and enzymatic rates, not capsules."],["It produces high-energy ATP through photosynthesis",0,"Capsules are extracellular protective coatings with no energetic metabolic activity."]],"m":"Capsules are major virulence determinants that enhance pathogenicity by physically preventing phagocytosis by host immune cells.","id":35},{"s":7,"q":"Which statement correctly describes bacterial genomic DNA and plasmids?","o":[["Bacterial genomes are diploid; plasmids are essential for cell survival",0,"Bacterial genomes are haploid, and plasmids carry non-essential accessory genes."],["Bacterial chromosomes are strictly linear; plasmids contain all essential survival genes",0,"Chromosomes are predominantly circular, and essential housekeeping genes reside on the chromosome."],["Plasmids are located inside the bacterial nucleus",0,"Prokaryotes lack a nucleus; plasmids float freely within the cytoplasm."],["Bacterial genomes are haploid double-stranded DNA; plasmids exist independently, carry non-essential favorable traits, and are non-functional on their own",1,"Bacterial genomes are haploid dsDNA; plasmids are extrachromosomal circular DNA elements that replicate autonomously and encode adaptive, non-essential traits."]],"m":"Bacterial chromosomes are haploid circular dsDNA, while plasmids are autonomous extrachromosomal elements conferring non-essential adaptive benefits such as drug resistance.","id":36},{"s":7,"q":"Regarding bacterial genetics, which of the following is NOT true for all bacteria?","o":[["They have circular chromosomes",0,"Most bacteria possess circular chromosomes, although rare linear exceptions exist."],["The DNA does not associate with histones",0,"True bacteria lack histone octamers, organizing DNA via histone-like anchoring proteins."],["They have NO intron/exon arrangement",0,"Prokaryotic continuous coding sequences generally lack mRNA-spliced intron/exon structures."],["They are diploid",1,"Bacteria are strictly haploid, possessing a single chromosomal copy rather than paired diploid homologs."]],"m":"Bacteria are haploid organisms with unpaired genomes; they are not diploid.","id":37},{"s":3,"q":"What is the primary structural macromolecule composing the cell wall of Eubacteria?","o":[["Chitin",0,"Chitin is a fungal and arthropod structural polysaccharide."],["Cellulose",0,"Cellulose forms the rigid structural framework of plant cell walls."],["Peptidoglycan",1,"The eubacterial cell wall is composed of a rigid meshwork of peptidoglycan (murein)."],["Pseudomurein",0,"Pseudomurein is restricted to cell walls of certain archaeal taxa."]],"m":"Eubacteria are characterized by cell walls made of peptidoglycan, composed of repeating glycan backbones cross-linked by peptide chains.","id":38},{"s":3,"q":"What is the primary physiological function of the peptidoglycan cell wall in bacteria?","o":[["Prevents osmotic lysis in hypotonic environments",1,"The cross-linked peptidoglycan sacculus provides tensile strength, counteracting high internal turgor pressure to prevent osmotic lysis."],["Facilitates active transport of glucose",0,"Active nutrient transport is performed by transport proteins in the plasma membrane."],["Synthesizes ATP through oxidative phosphorylation",0,"ATP synthesis is driven by ATP synthase complexes embedded in the cell membrane."],["Generates proton motive force for motility",0,"Proton motive force is established across the semipermeable cytoplasmic membrane."]],"m":"The rigid peptidoglycan wall maintains morphological structure and prevents cell bursting (osmotic lysis) in hypoosmotic fluids.","id":39},{"s":3,"q":"What do the acronyms NAG and NAM stand for in the peptidoglycan cell wall of bacteria?","o":[["N-acetylglucosamine and N-acetylmuramic acid",1,"NAG represents N-acetylglucosamine and NAM represents N-acetylmuramic acid."],["N-acetylgalactosamine and N-acetylmaltose",0,"These are alternative biochemical carbohydrates not found in murein backbones."],["Nitrogenated alpha-glucose and Nitrogenated alpha-mannose",0,"These do not correspond to the chemical monomers of peptidoglycan."],["N-acetylglycine and N-acetylmethionine",0,"Glycine and methionine are amino acids, not amino-sugar wall derivatives."]],"m":"The glycan backbone of bacterial peptidoglycan consists of alternating amino sugars: N-acetylglucosamine (NAG) and N-acetylmuramic acid (NAM).","id":40},{"s":3,"q":"Where in the bacterial cell are NAG and NAM sugar monomers synthesized before being assembled into peptidoglycan?","o":[["Periplasmic space",0,"Polymerization occurs in the periplasm/exterior, but monomer precursors are manufactured internally."],["Cytosol",1,"NAG and NAM building blocks are enzymatically synthesized in the cytoplasm before bactoprenol translocates them across the cell membrane."],["Outer membrane",0,"The outer membrane lacks metabolic biosynthetic machinery for precursor synthesis."],["Capsule",0,"The capsule is an inert external layer with no enzymatic biosynthetic function."]],"m":"Peptidoglycan nucleotide-sugar precursors (NAG and NAM) are synthesized within the cytosol before being ferried across the plasma membrane.","id":41},{"s":3,"q":"What type of chemical bond links repeating NAG and NAM sugar monomers together in the bacterial cell wall backbone?","o":[["Peptide bonds",0,"Peptide bonds cross-link the tetrapeptide side chains protruding from NAM."],["Glycosidic bonds",1,"Alternating NAG and NAM sugar monomers are joined linearly by covalent beta-1,4-glycosidic bonds."],["Phosphodiester bonds",0,"Phosphodiester linkages form the backbone of DNA and RNA nucleic acids."],["Hydrogen bonds",0,"Hydrogen bonds provide secondary stabilizing interactions rather than primary covalent backbone bonds."]],"m":"Glycosidic bonds join alternating NAG and NAM residues, forming the continuous glycan chains cleaved by lysozyme.","id":42},{"s":3,"q":"How do Archaeal cell walls differ structurally from Eubacterial cell walls?","o":[["Archaeal cell walls contain thick peptidoglycan",0,"Archaea completely lack true peptidoglycan."],["Archaeal cell walls lack peptidoglycan (composed instead of pseudomurein or protein layers)",1,"Archaea do not synthesize peptidoglycan; their cell walls utilize pseudomurein, complex polysaccharides, or surface-layer (S-layer) proteins."],["Archaeal cell walls contain outer LPS toxin layers",0,"Lipopolysaccharide (LPS) is a hallmark of Gram-negative eubacteria."],["Archaeal cell walls are composed entirely of chitin",0,"Chitin is restricted to eukaryotic fungal cell walls."]],"m":"Archaeal cell walls lack true peptidoglycan, relying instead on pseudomurein, specialized polysaccharides, or paracrystalline protein S-layers.","id":43},{"s":3,"q":"Which of the following cellular structures is found in ALL bacterial cells without exception?","o":[["Capsule",0,"Many non-pathogenic or rough bacterial strains lack a protective capsule."],["Cell Wall",0,"Cell-wall-less taxa like Mycoplasma lack a peptidoglycan cell wall."],["Flagella",0,"Many bacteria, including most cocci, are atrichous and non-motile."],["Cell Membrane",1,"Every living bacterial cell requires an intact cytoplasmic (plasma) membrane to regulate internal homeostasis and maintain viability."]],"m":"All bacteria possess a cytoplasmic membrane; structures such as cell walls, capsules, and flagella are variable.","id":44},{"s":3,"q":"Spore formation in bacteria is performed as a mechanism of:","o":[["Reproduction",0,"Reproduction requires a net increase in cell number; sporulation results in a 1:1 conservation."],["Survival and reproduction",0,"Because one cell yields only one spore, it is strictly non-reproductive."],["Survival",1,"Endospores are specialized cryptobiotic survival structures formed to protect the genome under lethal conditions."],["Horizontal gene transfer",0,"Endospores do not transfer genetic material between unrelated cells."]],"m":"Endosporulation is purely a cellular survival adaptation; one vegetative bacterium generates one endospore, resulting in zero population increase.","id":45},{"s":3,"q":"Which of the following is NOT an endospore-forming bacterium?","o":[["Bacillus",0,"Bacillus species (e.g., B. anthracis) are typical aerobic endospore-forming rods."],["Clostridium",0,"Clostridium species (e.g., C. tetani) are typical anaerobic endospore-forming rods."],["Sporosarcina",0,"Sporosarcina is a recognized genus of endospore-forming cocci."],["Streptococcus",1,"Streptococcus species are non-spore-forming Gram-positive cocci."]],"m":"Streptococcus does not form endospores, whereas Bacillus, Clostridium, and Sporosarcina are recognized spore-forming genera.","id":46},{"s":3,"q":"Which specific layer of a bacterial endospore is used to reform the peptidoglycan cell wall during germination?","o":[["Cortex",1,"The endospore cortex consists of modified peptidoglycan that is remodeled to establish the vegetative cell wall upon germination."],["Spore coat",0,"The spore coat is a dense keratin-like protein shell conferring chemical and enzymatic resistance."],["Core",0,"The core contains dehydrated genomic DNA, ribosomes, and dipicolinic acid."],["Exosporium",0,"The exosporium is an outermost lipid-protein membrane layer present in select species."]],"m":"The spore cortex contains peptidoglycan, which reconstitutes the vegetative bacterial cell wall during germination.","id":47},{"s":3,"q":"Which endospore-forming bacterial genus is a notable Gram-negative exception?","o":[["Bacillus",0,"Bacillus is a Gram-positive endospore-forming genus."],["Clostridium",0,"Clostridium is an obligately anaerobic Gram-positive endospore-forming genus."],["Staphylococcus",0,"Staphylococcus is a non-spore-forming Gram-positive cluster-forming coccus."],["Coxiella",1,"Coxiella burnetii represents the primary Gram-negative pathogen capable of producing resistant spore-like structures."]],"m":"While endospores are primarily found in Gram-positive rods, Coxiella represents a clinically significant Gram-negative spore-former.","id":48},{"s":3,"q":"Which anaerobic, endospore-forming species produces a potent neurotoxin responsible for tetanus?","o":[["Clostridium tetani",1,"Clostridium tetani produces the potent neurotoxin tetanospasmin, causing spastic paralysis."],["Bacillus anthracis",0,"Bacillus anthracis produces anthrax toxin complexes, not tetanus neurotoxin."],["Coxiella burnetii",0,"Coxiella burnetii is the causative agent of Q fever."],["Clostridium botulinum",0,"Clostridium botulinum secretes botulinum neurotoxin, resulting in flaccid paralysis."]],"m":"Clostridium tetani is an anaerobic, spore-forming bacillus that elaborates tetanospasmin, resulting in clinical tetanus.","id":49},{"s":3,"q":"What process occurs when an endospore exits dormancy in a favorable environment to reform an active vegetative cell?","o":[["Sporulation",0,"Sporulation is the process of generating a dormant spore from a vegetative cell."],["Binary fission",0,"Binary fission is the vegetative replication process following complete outgrowth."],["Vegetative cycle (Germination)",1,"Germination is the process whereby a dormant spore degrades its protective coats to re-emerge as a metabolically active vegetative cell."],["Conjugation",0,"Conjugation is the horizontal transfer of plasmid DNA through sex pili."]],"m":"Germination describes the transition of an endospore back into a metabolically active, dividing vegetative bacterial cell.","id":50},{"s":3,"q":"What is the process of endospore formation called when a vegetative cell encounters harsh environmental conditions?","o":[["Sporulation",1,"Sporulation (or sporogenesis) is the multi-step pathway by which a vegetative cell forms an endospore under environmental stress."],["Germination",0,"Germination is the return from dormant spore to vegetative cell."],["Binary fission",0,"Binary fission is normal vegetative reproduction in nutrient-rich media."],["Transformation",0,"Transformation is the uptake of exogenous naked DNA from the surroundings."]],"m":"Sporulation is the developmental sequence in which a stressed vegetative bacterium encapsulates its genome into a dormant endospore.","id":51},{"s":3,"q":"How does the acquisition mechanism of adult foodborne botulism differ from infant botulism?","o":[["Adults ingest pre-formed exotoxin in food; infants ingest bacterial endospores from honey",1,"Adults experience intoxication via ingestion of pre-formed botulinum exotoxin in canned goods, whereas infants suffer toxicoinfection from ingesting viable endospores (e.g., in honey) that germinate in the gut."],["Adults ingest endospores; infants ingest pre-formed endotoxin",0,"Adult intestinal flora generally suppresses ingested endospores, and botulinum toxin is an exotoxin, not an endotoxin."],["Both adults and infants acquire botulism exclusively via endotoxins",0,"Botulism pathology is driven by a protein neurotoxin (exotoxin), not lipopolysaccharide (endotoxin)."],["Adults acquire botulism via inhalation; infants acquire botulism via direct contact",0,"Both forms involve oral ingestion routes."]],"m":"Adult foodborne botulism is an intoxication resulting from ingesting pre-formed neurotoxin, while infant botulism is an infection caused by ingesting endospores that colonize the infant gastrointestinal tract.","id":52},{"s":4,"q":"Which unusual bacterium is characterized by a complete absence of a peptidoglycan cell wall, pleomorphic morphology, and membrane-stabilizing sterols that resist osmotic lysis?","o":[["Rickettsia",0,"Possesses a bacterial cell wall and outer membrane but exhibits leaky membrane permeability."],["Chlamydia",0,"Possesses an outer membrane complex and exists as an obligate intracellular pathogen incapable of synthesizing ATP."],["Mycoplasma",1,"Lacks a peptidoglycan cell wall entirely and incorporates environmental sterols into its plasma membrane to prevent osmotic lysis."],["Mycobacteria",0,"Possesses an exceptionally thick, lipid-rich cell wall containing mycolic acid."]],"m":"Mycoplasma is distinct among eubacteria due to the complete absence of a peptidoglycan cell wall and the incorporation of sterols into its plasma membrane to withstand osmotic lysis.","id":53},{"s":4,"q":"Which unusual bacterium is an obligate intracellular parasite that causes vector-borne typhus and Rocky Mountain spotted fever due to possessing leaky cell membranes?","o":[["Chlamydia",0,"Transmitted primarily via direct contact or vertical transmission during parturition, not arthropod vectors."],["Rickettsia",1,"Features structurally leaky plasma membranes that mandate immediate intracellular existence, spreading via tick, flea, or louse vectors."],["Mycoplasma",0,"Extracellular mucosal colonizer lacking a cell wall rather than an arthropod-vectored intracellular parasite."],["Archaea",0,"Non-pathogenic environmental extremophiles possessing ether-linked branched hydrocarbon membranes."]],"m":"Rickettsia organisms possess highly permeable, leaky membranes that prevent free-living extracellular survival, requiring transmission by arthropod vectors to access host endothelial cells.","id":54},{"s":4,"q":"Which unusual bacterium is an obligate intracellular parasite that lacks the metabolic enzymes necessary to synthesize its own ATP and is transmitted primarily by direct contact (sexual or birth)?","o":[["Rickettsia",0,"Synthesizes minimal ATP and relies primarily on arthropod vectors rather than venereal or perinatal routes."],["Mycobacteria",0,"Free-living, slow-growing acid-fast bacillus capable of independent oxidative phosphorylation and ATP synthesis."],["Cyanobacteria",0,"Free-living photosynthetic prokaryote producing abundant ATP and oxygen."],["Chlamydia",1,"Lacks the metabolic enzymatic machinery to generate ATP ('energy parasite') and is transmitted via direct mucosal or perinatal contact."]],"m":"Chlamydia is an obligate intracellular bacterium deficient in autonomous nucleotide and ATP generation, depending entirely on host cellular energy stores and spreading via direct physical contact.","id":55},{"s":4,"q":"Which unusual bacterial group is classified as acid-fast because its thick, waxy cell wall is loaded with large amounts of mycolic acid that contribute to pathogenicity?","o":[["Mycobacteria",1,"Contains abundant long-chain mycolic acids within its peptidoglycan-arabinogalactan envelope, resisting acid alcohol decolorization."],["Mycoplasma",0,"Completely lacks peptidoglycan and mycolic acid, bounded only by a sterol-containing membrane."],["Rickettsia",0,"Possesses a standard Gram-negative envelope with leaky characteristics, lacking acid-fast lipids."],["Chlamydia",0,"Contains a modified Gram-negative envelope lacking significant mycolic acid concentrations."]],"m":"Mycobacteria are designated acid-fast due to high concentrations of mycolic acids in their cell walls, which confer resistance to chemical disinfectants, desiccation, and standard Gram staining.","id":56},{"s":4,"q":"Which unusual prokaryotic group consists primarily of extremophiles whose cell membranes utilize branched hydrocarbons instead of phospholipids and whose cell walls lack peptidoglycan?","o":[["Mycoplasma",0,"A true eubacterium with sterol-containing phospholipid bilayers lacking wall structures."],["Archaeans",1,"Possesses ether-linked branched hydrocarbon monolayers or bilayers and cell walls composed of pseudomurein or protein S-layers."],["Mycobacteria",0,"A eubacterium with typical ester-linked fatty acids and a peptidoglycan-mycolic acid wall."],["Green sulfur bacteria",0,"Anoxygenic photosynthetic eubacteria with standard eubacterial ester-linked lipids."]],"m":"Archaea represent a distinct domain of prokaryotic extremophiles possessing ether-linked isoprenoid hydrocarbon chains and cell walls deficient in peptidoglycan.","id":57},{"s":4,"q":"How do photosynthetic Cyanobacteria differ metabolically from purple and green photosynthetic bacteria?","o":[["Cyanobacteria carry out anoxygenic photosynthesis, while purple and green bacteria produce oxygen",0,"This reverses the photochemical pathways of both microbial groups."],["Cyanobacteria carry out oxygenic photosynthesis, whereas purple and green bacteria are anoxygenic",1,"Cyanobacteria utilize water as an electron donor to release oxygen, whereas purple and green sulfur bacteria utilize sulfur compounds and do not produce oxygen."],["Cyanobacteria lack cell walls, while purple and green bacteria possess mycolic acid",0,"Neither group lacks cell walls or produces mycobacterial mycolic acid."],["Cyanobacteria are obligate intracellular parasites that cannot generate ATP",0,"Cyanobacteria are autotrophic, photo-synthesizing, free-living bacteria that generate their own ATP."]],"m":"Cyanobacteria perform oxygenic photosynthesis utilizing chlorophyll a and releasing O2, whereas purple and green sulfur bacteria utilize bacteriochlorophyll to carry out anoxygenic photosynthesis.","id":58},{"s":4,"q":"Under the microscope, you observe rod-shaped bacteria grouped side-by-side in parallel rows, resembling folded dominoes or a picket fence, remaining attached by a small hinge at one end. What arrangement is this?","o":[["Streptobacilli",0,"Streptobacilli consist of bacilli aligned linearly end-to-end in continuous strands."],["Palisades",1,"Formed when bacilli divide transversely and snap together laterally to form side-by-side columns attached by a terminal hinge."],["Staphylococci",0,"Consists of spherical cocci dividing across multiple planes into irregular clusters."],["Sarcina",0,"Consists of cocci dividing in three regular perpendicular planes into geometric cubical packets."]],"m":"Palisades arrangements occur when rod-shaped bacilli divide by snapping transverse fission, remaining hinged at the poles to create parallel picket-fence formations.","id":59},{"s":4,"q":"Why do rod-shaped bacteria (bacilli) NEVER form irregular, grape-like 'staph' clusters under normal physiological conditions?","o":[["Bacilli lack peptidoglycan and therefore cannot adhere after division",0,"Bacilli maintain thick or thin peptidoglycan cell walls."],["Bacilli divide along only a single transverse plane of division, preventing multi-planar clustering",1,"Bacillary morphology restricts division exclusively across a single transverse axis, allowing only pairs, chains, or snapping palisades."],["Bacilli always possess peritrichous flagella that forcibly propel daughter cells apart",0,"Arrangement is governed by planes of septation, not flagellar motility."],["Bacilli only divide in three perpendicular planes to form regular cubes",0,"Cubic division is unique to sarcina arrangements of cocci."]],"m":"Bacilli are geometrically constrained to a single transverse plane of division, precluding the formation of multi-planar clusters characteristic of staphylococci.","id":60},{"s":4,"q":"A specimen shows spherical bacterial cells dividing strictly along two perpendicular axes to form a symmetrical square group of four cells. What is the correct microbiological term?","o":[["Tetrads",1,"Tetrads are symmetrical four-cell planar packets resulting from septation along two perpendicular axes."],["Sarcina",0,"Sarcina involves septation along three perpendicular axes to form cubical packets of eight or more cells."],["Streptococci",0,"Streptococci result from continuous divisions along a single axis."],["Diplococci",0,"Diplococci represent persistent pairs formed after a single division cycle."]],"m":"Tetrads are square, planar arrangements of four cocci generated by sequential divisions along two perpendicular geometric axes.","id":61},{"s":4,"q":"Which bacterial arrangement is characterized by division in three regular perpendicular planes, resulting in a distinct cubical packet of 8, 16, or more cocci?","o":[["Staphylococci",0,"Staphylococci divide along irregular, non-symmetrical, random planes."],["Tetrads",0,"Tetrads divide across only two perpendicular planes, yielding four cells."],["Sarcina",1,"Produced by orderly division across three perpendicular geometric planes, forming cuboidal packets."],["Streptobacilli",0,"Streptobacilli are elongated linear chains of rod-shaped cells."]],"m":"Sarcina packets are regular cubical complexes of 8, 16, or more cocci produced by successive divisions along three mutually perpendicular axes.","id":62},{"s":4,"q":"Microscopic analysis reveals bacterial cells that are short, plump ovals intermediate in shape between a sphere and a rod. Which term describes this specific morphology?","o":[["Diplococci",0,"Diplococci are distinct spherical pairs."],["Coccobacilli",1,"Coccobacilli exhibit intermediate morphology, appearing as short, rounded oval rods."],["Vibrio",0,"Vibrios are curved, comma-shaped rods."],["Spirilla",0,"Spirilla are rigid helical spiral forms."]],"m":"Coccobacilli display transitional morphology between spherical cocci and elongated bacilli, appearing as distinct short, plump ovals.","id":63},{"s":4,"q":"You observe helical, spiral-shaped bacterial cells that maintain a rigid cell wall and rotate via external polar flagella, rather than bending via periplasmic axial filaments. What morphology is this?","o":[["Spirochetes",0,"Spirochetes are flexible, undulating spiral cells powered by internal periplasmic axial filaments."],["Spirilla",1,"Spirilla are rigid spiral cylinders propelled by external, polar flagellar tufts."],["Palisades",0,"Palisades are parallel snapping formations of straight bacilli."],["Pleomorphic",0,"Pleomorphic cells display variable, amoeboid-like shapes without fixed spiral helices."]],"m":"Spirilla are characterized by rigid helical cell walls and external polar flagella, distinguishing them from flexible spirochetes with internal endoflagella.","id":64},{"s":4,"q":"Gram-positive spherical bacteria that divide repeatedly along a single plane to produce elongated, continuous chains of pearls are classified as:","o":[["Staphylococci",0,"Staphylococci form irregular multi-axial clusters."],["Streptococci",1,"Streptococcal division is restricted to a single axis without separation, yielding linear cellular chains."],["Streptobacilli",0,"Streptobacilli are chains composed of rod-shaped bacilli."],["Diplococci encapsulated",0,"Diplococci exist as paired cells rather than continuous multi-cellular chains."]],"m":"Streptococci are cocci that divide along a single persistent plane, remaining linked to produce characteristic chain-like formations.","id":65},{"s":4,"q":"Bacteria that completely lack a rigid cell wall and naturally display variable, irregular shapes without a fixed morphology are designated as:","o":[["Pleomorphic",1,"Denotes organisms lacking structural peptidoglycan walls, enabling continuous variation in individual cell shape."],["Palisades",0,"A fixed structural arrangement of hinged rod-shaped bacteria."],["Coccobacilli",0,"A defined, static oval cell morphology."],["Vibrio",0,"A rigid, comma-shaped cellular morphology."]],"m":"Pleomorphism describes morphological variability resulting from the absence of a rigid, shape-determining peptidoglycan cell wall.","id":66},{"s":2,"q":"When comparing cellular structures within the glycocalyx category, which structure is considered MORE virulent due to its organized matrix that prevents phagocytosis?","o":[["Slime layer",0,"A loose, unorganized polysaccharide shield primarily functioning in desiccation defense and weak adherence."],["Capsule",1,"Composed of a dense, highly organized polymer matrix that directly blocks complement deposition and phagocytic engulfment."],["Biofilm matrix",0,"A collective community structure rather than an individual cellular glycocalyx layer."],["Axial filament",0,"An internal periplasmic motor structure mediating motility in spirochetes."]],"m":"Within the glycocalyx family, capsules represent high-potency virulence factors because their organized, dense structure directly inhibits phagocytosis by host white blood cells.","id":67},{"s":1,"q":"Which bacterial invasive exoenzyme acts as a chemical 'battering ram' by digesting the protective mucosal lining of host membranes?","o":[["Keratinase",0,"Digests keratinized structural proteins of the stratum corneum, hair, and nails."],["Mucinase",1,"Enzymatically digests the mucosal gel coating epithelial linings to facilitate bacterial penetration."],["Collagenase",0,"Targets the fibrous collagen matrix of subcutaneous and deep connective tissues."],["Hyaluronidase",0,"Hydrolyzes interstitial hyaluronic acid between tissue cells."]],"m":"Mucinase degrades protective mucin glycoproteins lining mucosal membranes, exposing the underlying epithelial cells to colonization and invasion.","id":68},{"s":1,"q":"Which bacterial exoenzyme degrades the primary structural protein found in skin, hair, and nails to facilitate tissue invasion?","o":[["Mucinase",0,"Degrades mucosal barrier secretions, not cornified integumentary proteins."],["Coagulase",0,"Converts fibrinogen to protective fibrin clots around bacterial clusters."],["Keratinase",1,"Hydrolyzes insoluble keratin proteins within the stratum corneum, nails, and hair shafts."],["Lipase",0,"Breaks down host lipid and sebum reserves."]],"m":"Keratinase is an invasive exoenzyme that digests insoluble keratin, enabling dermatophytic and bacterial pathogens to breach cornified cutaneous barriers.","id":69},{"s":1,"q":"Which invasive exoenzyme breaks down the structural fibrous protein of host connective tissue?","o":[["Collagenase",1,"Degrades connective tissue collagen fibers, facilitating rapid deep-tissue dissemination."],["Mucinase",0,"Targets mucosal secretions rather than collagenous stroma."],["Keratinase",0,"Degrades epidermal keratin, not dermal or interstitial collagen."],["Amylase",0,"Cleaves polysaccharide glycosidic bonds."]],"m":"Collagenase dissolves fibrous collagen within extracellular matrices, destroying supportive connective tissue architecture and accelerating pathogen invasion.","id":70},{"s":1,"q":"Which bacterial exoenzyme breaks down the intercellular cement holding host animal tissue cells together?","o":[["Hyaluronidase",1,"Hydrolyzes hyaluronic acid, the glycosaminoglycan ground substance binding host cells together."],["Collagenase",0,"Cleaves structural collagen fibers rather than ground substance mucopolysaccharides."],["Mucinase",0,"Digests luminal mucous layers."],["Coagulase",0,"Induces plasma clotting rather than tissue ground substance degradation."]],"m":"Hyaluronidase hydrolyzes interstitial hyaluronic acid ('spreading factor'), breaking intercellular junctional integrity to enhance pathogen diffusion through tissues.","id":71},{"s":1,"q":"Which bacterial virulence factor is specifically classified as an avoidance factor because it is toxic to and destroys host white blood cells?","o":[["Mucinase",0,"An invasive factor degrading extracellular secretions, not a leukotoxic enzyme."],["Leukocidin (Leukocidase)",1,"A pore-forming, membrane-disrupting toxin that directly lyses host leukocytes and macrophages."],["Hyaluronidase",0,"Spreading factor targeting extracellular matrix components."],["Collagenase",0,"Connective tissue enzyme with no direct cellular leukocidal toxicity."]],"m":"Leukocidins (leukocidases) are specific anti-phagocytic virulence factors that form pores in leukocyte membranes, killing immune cells to avoid host defense.","id":72},{"s":1,"q":"What is the major structural endotoxin of the bacterial world, and where is it located?","o":[["Peptidoglycan of Gram-positive cell walls",0,"Peptidoglycan provides structural rigidity and is not classified as endotoxin."],["Lipopolysaccharide (LPS) in the outer membrane of Gram-negative cell walls",1,"Lipid A of lipopolysaccharide (LPS), integral to the Gram-negative outer membrane, is the definitive bacterial endotoxin."],["Teichoic acid in Gram-positive cell walls",0,"Teichoic acids assist in envelope maintenance and antigenicity in Gram-positive walls."],["Mycolic acid in acid-fast bacteria",0,"Mycolic acid confers waxy chemical resistance, not classical endotoxic shock."]],"m":"Lipopolysaccharide (LPS), specifically the Lipid A moiety embedded in the outer membrane of Gram-negative bacteria, is the primary bacterial endotoxin released upon lysis.","id":73},{"s":1,"q":"Which mode of pathogen transmissibility is considered the most virulent due to rapid dispersion and high inhalation potential?","o":[["Airborne transmission",1,"Small droplet nuclei and aerosols remain suspended, dispersing over broad distances for immediate respiratory inhalation."],["Direct contact transmission",0,"Requires close physical proximity, limiting spatial dispersal velocity."],["Fecal-oral transmission",0,"Requires ingestive vehicle contamination, producing slower regional spread."],["Vector-borne transmission",0,"Constrained by intermediate arthropod vector distributions and life cycles."]],"m":"Airborne transmission displays the highest pathogenic transmissibility potential due to rapid aerosolization, persistent environmental suspension, and direct access to respiratory mucosal surfaces.","id":74},{"s":5,"q":"Bacteria that lack the genetic and metabolic machinery to synthesize every organic compound required for survival and must obtain pre-formed growth factors are called:","o":[["Fastidious bacteria",1,"Fastidious organisms require specialized exogenous nutritional supplements and organic growth factors."],["Saprophytes",0,"Decomposers feeding generally on dead decaying biomass."],["Obligate halophiles",0,"Organisms requiring hyper-saline osmotic gradients, not necessarily specific organic growth factors."],["Chemoautotrophs",0,"Inorganic fixers capable of synthesizing all organic molecules from carbon dioxide."]],"m":"Fastidious bacteria possess complex nutritional requirements and rely on external pre-formed growth factors such as specific amino acids and vitamins.","id":75},{"s":5,"q":"Most human bacterial pathogens derive both their carbon and energy from pre-formed organic compounds. What nutritional category do they belong to?","o":[["Photoautotrophs",0,"Utilize sunlight for energy and carbon dioxide for carbon."],["Chemoheterotrophs",1,"Metabolize organic chemical substrates for both cellular energy (ATP) and carbon skeletons."],["Chemoautotrophs",0,"Derive energy from inorganic chemical oxidation and fix carbon from CO2."],["Photoheterotrophs",0,"Capture solar light energy while requiring organic carbon sources."]],"m":"Nearly all human bacterial pathogens are chemoheterotrophs, utilizing host organic molecules as reciprocal sources of metabolic energy and carbon.","id":76},{"s":5,"q":"Organisms that feed specifically on dead and decaying organic matter are classified as:","o":[["Saprophytes (Saprobes)",1,"Heterotrophic decomposers that digest non-living organic substrates."],["Photoautotrophs",0,"Autotrophic solar fixers independent of decaying organic substrates."],["Obligate intracellular parasites",0,"Require live, metabolizing host cells for survival."],["Lithoautotrophs",0,"Inorganic rock-oxidizing autotrophs."]],"m":"Saprophytes (saprobes) are free-living decomposers specialized in metabolizing dead organic material.","id":77},{"s":5,"q":"Which active transport mechanism chemically alters a nutrient molecule (e.g., phosphorylation) as it is transported across the membrane?","o":[["Simple diffusion",0,"Passive, non-carrier, non-concentrating movement down a chemical gradient."],["Facilitated transport",0,"Passive carrier-mediated transport lacking chemical nutrient modification."],["Osmosis",0,"Passive movement of solvent water across semipermeable barriers."],["Group translocation",1,"Active, energy-dependent transport coupling trans-membrane translocation with covalent chemical alteration (e.g., phosphorylation)."]],"m":"Group translocation is an active prokaryotic transport process that chemically alters substrates during import to prevent back-diffusion across the membrane.","id":78},{"s":5,"q":"Which temperature classification encompasses bacteria that grow optimally between 20°C and 40°C, including normal human body temperature (~37°C)?","o":[["Psychrophiles",0,"Cold-adapted organisms growing optimally at or below 15°C."],["Mesophiles",1,"Organisms with growth optima between 20°C and 40°C, encompassing human thermal physiology."],["Thermophiles",0,"Heat-adapted organisms thriving between 45°C and 80°C."],["Hyperthermophiles",0,"Extreme thermophilic organisms thriving above 80°C."]],"m":"Mesophiles exhibit optimal growth kinetics between 20°C and 40°C, making them uniquely adapted to colonize and infect human hosts (37°C).","id":79},{"s":5,"q":"What term describes cold-loving microorganisms that have an optimal growth temperature at or below 15°C and can grow at 0°C?","o":[["Thermophiles",0,"High-temperature organisms requiring heat for enzyme kinetics."],["Acidophiles",0,"Low-pH-adapted organisms independent of thermal preferences."],["Psychrophiles",1,"Obligate cold-adapted microbes with optimal reproduction at 15°C or lower."],["Mesophiles",0,"Moderate-temperature organisms with 20–40°C optima."]],"m":"Psychrophiles are obligate cold-loving microbes with optimal metabolic and division rates occurring at or below 15°C.","id":80},{"s":5,"q":"Which group of organisms thrives in hot environments, with optimal growth occurring at temperatures exceeding 45°C to 80°C?","o":[["Thermophiles",1,"Adapted to elevated thermal ranges, exhibiting enzymatic stability between 45°C and 80°C."],["Psychrophiles",0,"Denatured and killed rapidly at elevated temperatures."],["Mesophiles",0,"Experience thermal protein denaturation above 45°C."],["Halophiles",0,"Defined by sodium chloride osmotic requirements, not temperature."]],"m":"Thermophiles possess heat-stable enzymes and membrane adaptations allowing optimal physiological growth between 45°C and 80°C.","id":81},{"s":5,"q":"What set of protective enzymes do aerobic organisms utilize to neutralize toxic reactive oxygen species (ROS)?","o":[["Amylase, lipase, and protease",0,"Digestive enzymes targeting starch, lipids, and proteins."],["Superoxide dismutase, peroxidase, and catalase",1,"Detoxification triad that neutralizes reactive superoxide radicals (O2-) and hydrogen peroxide (H2O2)."],["DNA polymerase, ligase, and helicase",0,"Nucleic acid replication and repair enzymes."],["Coagulase, kinase, and hyaluronidase",0,"Bacterial exoenzymes involved in tissue invasion and clotting."]],"m":"Aerobes survive oxidative environments by expressing superoxide dismutase (SOD), catalase, and peroxidase to detoxify toxic reactive oxygen intermediates.","id":82},{"s":5,"q":"Why are obligate (strict) anaerobes killed or inhibited by exposure to atmospheric oxygen?","o":[["They lack protective enzymes like superoxide dismutase and catalase to detoxify reactive oxygen byproducts",1,"Lacking SOD, catalase, and peroxidase, strict anaerobes accumulate lethal concentrations of toxic reactive oxygen radicals."],["Oxygen destroys their cytoplasmic 70S ribosomes immediately",0,"Ribosomes remain structurally intact; death is mediated by broad cellular oxidative damage."],["Oxygen causes their peptidoglycan cell walls to dissolve",0,"Cell walls are not chemically cleaved by molecular oxygen."],["They lack a plasma membrane",0,"All bacteria possess functional cytoplasmic membranes."]],"m":"Obligate anaerobes lack the detoxifying enzymatic machinery (superoxide dismutase and catalase), resulting in lethal oxidative damage in the presence of oxygen.","id":83},{"s":5,"q":"How do facultative anaerobes behave when environmental oxygen is completely depleted?","o":[["They immediately lyse and die",0,"Characteristics of obligate aerobes, not metabolically flexible facultative organisms."],["They form endospores and remain dormant indefinitely",0,"Endospores form under starvation, whereas facultative cells continue active anaerobic division."],["They switch from aerobic respiration to fermentation or anaerobic respiration",1,"Possess metabolic plasticity to conduct aerobic respiration with oxygen and switch to fermentation or anaerobic respiration without it."],["They rely on phototaxis to generate ATP",0,"Heterotrophic facultative anaerobes do not generate energy from light."]],"m":"Facultative anaerobes metabolize oxygen via aerobic respiration when present, but switch to anaerobic respiration or fermentation pathways when oxygen is absent.","id":84},{"s":5,"q":"Which oxygen category describes bacteria that require oxygen for growth, but only at low concentrations below atmospheric levels (2–10% O2)?","o":[["Obligate aerobes",0,"Require standard 21% atmospheric oxygen concentrations."],["Facultative anaerobes",0,"Grow across a broad range from 0% to 21% oxygen."],["Microaerophiles",1,"Require oxygen at sub-atmospheric tensions (2–10%) and are inhibited by higher oxygen levels."],["Aerotolerant anaerobes",0,"Do not use oxygen at all, though they tolerate its presence."]],"m":"Microaerophiles require low oxygen tensions (2–10%) for respiration, lacking sufficient enzyme quantities to tolerate standard 21% atmospheric levels.","id":85},{"s":5,"q":"Microorganisms that require high osmotic pressure and elevated salt (NaCl) concentrations to survive are known as:","o":[["Halophiles",1,"Require high sodium chloride concentrations to maintain cell envelope integrity and osmotic balance."],["Barophiles",0,"Require high hydrostatic pressures (deep ocean environments)."],["Psychrophiles",0,"Defined by low temperature adaptations."],["Acidophiles",0,"Defined by low pH adaptations."]],"m":"Halophiles require hyper-saline environments (elevated NaCl concentrations) to sustain membrane stability and prevent osmotic collapse.","id":86},{"s":5,"q":"What is the key differentiator between Synergism and Mutualism?","o":[["Synergism involves obligate parasitism",0,"Parasitism involves harm to one partner, whereas synergism is mutually beneficial."],["Synergism occurs only in viruses",0,"Synergism is an ecological relationship between cellular microbial organisms."],["Synergism is an antagonistic interaction",0,"Antagonism is inhibitory; synergism is cooperative."],["Synergism is a non-symbiotic cooperation where organisms benefit together but are not interdependent for survival",1,"Mutualism is an obligate symbiotic relationship required for survival, whereas synergism is a non-obligate cooperation where free-living organisms benefit mutually."]],"m":"Mutualism represents an obligate symbiotic dependence, whereas synergism is a non-symbiotic cooperation where organisms share nutrients for mutual benefit without being dependent for survival.","id":87},{"s":6,"q":"Bacteria use which sugar to the exclusion of all others as long as it is available?","o":[["Glucose",1,"All bacteria use glucose and will use it to the exclusion of other sugars while it is available (\"Glucose is king\"). [Lec 4, Slide #3]"],["Lactose",0,"Lactose is a disaccharide; some bacteria can break down secondary disaccharides and others cannot, so it is not the universally preferred sugar. [Lec 4, Slide #3]"],["Fructose",0,"Fructose is not the sugar bacteria use preferentially; glucose holds that role. [Lec 4, Slide #3]"],["Sucrose",0,"Sucrose is a disaccharide; disaccharide use varies by species, unlike glucose, which all bacteria use first. [Lec 4, Slide #3]"]],"m":"","id":88},{"s":6,"q":"Which is the most common bacterial glycolytic pathway, producing 2 pyruvate and 4 ATP?","o":[["Embden-Meyerhof pathway",1,"Embden-Meyerhof is the most common glycolytic pathway, resembles human glycolysis, and produces 2 pyruvate and 4 ATP. [Lec 4, Slide #5]"],["Entner-Doudoroff pathway",0,"Entner-Doudoroff is the least common pathway (very few bacteria) and produces 2 ethanol and 3 ATP, not 2 pyruvate and 4 ATP. [Lec 4, Slide #5]"],["Phosphoketolase pathway",0,"Phosphoketolase is another name for the heterolactic fermentation pathway, not a primary glycolytic pathway. [Lec 4, Slide #10]"],["Butanediol pathway",0,"Butanediol is a fermentation pathway that forms mixed acids, gases, and 2,3-butanediol; it is not a glycolytic pathway. [Lec 4, Slide #13]"]],"m":"","id":89},{"s":6,"q":"Which products are generated by the Entner-Doudoroff pathway?","o":[["2 ethanol and 3 ATP",1,"Entner-Doudoroff, the least common alternative to Embden-Meyerhof, produces 2 ethanol and 3 ATP. [Lec 4, Slide #5]"],["2 pyruvate and 4 ATP",0,"2 pyruvate and 4 ATP are the products of the Embden-Meyerhof pathway, not Entner-Doudoroff. [Lec 4, Slide #5]"],["2 lactate and 2 ATP",0,"Lactic acid as an end product belongs to lactic fermentations, not to the Entner-Doudoroff glycolytic pathway. [Lec 4, Slide #5]"],["2 acetate and 4 ATP",0,"Acetate is not a listed Entner-Doudoroff product, and 4 ATP is the Embden-Meyerhof yield. [Lec 4, Slide #5]"]],"m":"","id":90},{"s":6,"q":"Aerobic respiration uses which molecule as its final electron acceptor?","o":[["O₂",1,"Aerobic respiration (glycolysis + TCA + ETC) uses O₂ as the final electron acceptor. [Lec 4, Slide #4]"],["NO₃⁻",0,"Nitrate is one of the inorganic ions used as a final electron acceptor in anaerobic respiration, not aerobic respiration. [Lec 4, Slide #4]"],["SO₄²⁻",0,"Sulfate is an inorganic final electron acceptor used in anaerobic respiration, not aerobic respiration. [Lec 4, Slide #4]"],["CO₃²⁻",0,"Carbonate is an inorganic ion acceptor of anaerobic respiration; aerobic respiration uses O₂. [Lec 4, Slide #4]"]],"m":"","id":91},{"s":6,"q":"Anaerobic respiration differs from fermentation because anaerobic respiration:","o":[["Uses the TCA cycle and ETC with an inorganic ion acceptor",1,"Anaerobic respiration is glycolysis + TCA + ETC using inorganic ions (NO₃⁻, SO₄²⁻, CO₃²⁻) as final electron acceptors; fermentation is glycolysis + fermentation only. [Lec 4, Slide #4]"],["Uses only glycolysis followed by a fermentation step",0,"Glycolysis + fermentation describes fermentation itself, not anaerobic respiration. [Lec 4, Slide #4]"],["Uses molecular oxygen as the final electron acceptor",0,"O₂ as final electron acceptor defines aerobic respiration, not anaerobic respiration. [Lec 4, Slide #4]"],["Bypasses glycolysis and feeds directly into the ETC",0,"Respiration requires glycolysis feed-in before the TCA cycle and ETC; it does not bypass glycolysis. [Lec 4, Slide #17]"]],"m":"","id":92},{"s":6,"q":"Which statement best describes bacterial fermentation?","o":[["Partial oxidation of an organic compound fed by glycolysis",1,"Fermentation is the partial oxidation of an organic compound and is always fed by glycolysis; it handles overload ATP needs. [Lec 4, Slide #6]"],["Complete oxidation of glucose through the TCA and ETC",0,"Glycolysis + TCA + ETC describes respiration, not fermentation, which is only a partial oxidation. [Lec 4, Slide #4]"],["A process that never occurs alongside aerobic respiration",0,"Fermentation typically falls under anaerobic metabolism but can occur continuously alongside aerobic or anaerobic respiration. [Lec 4, Slide #6]"],["Reduction of sulfate to hydrogen sulfide gas",0,"Reducing sulfate to hydrogen sulfide is sulfate reduction, a form of anaerobic respiration, not fermentation. [Lec 4, Slide #21]"]],"m":"","id":93},{"s":6,"q":"Which bacterium is the most important and well-known performer of alcoholic fermentation?","o":[["Zymomonas mobilis",1,"Alcoholic fermentation (pyruvic acid to ethanol and CO₂) is mainly done
