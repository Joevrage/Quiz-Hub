<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spinal Anatomy II - Lab Practical Identification Hub</title>
    <style>
        :root {
            --bg-canvas: #0f0f0f;
            --bg-card: #1a1a1a;
            --text-main: #ffffff;
            --text-sub: #a3a3a3;
            --accent-orange: #ff9900;
            --border-default: #282828;
            --correct-bg: #14532d;
            --correct-border: #22c55e;
            --incorrect-bg: #7f1d1d;
            --incorrect-border: #ef4444;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-canvas);
            color: var(--text-main);
            padding: 12px;
            display: flex;
            justify-content: center;
        }

        .quiz-container {
            width: 100%;
            max-width: 850px;
            background: transparent;
            overflow: hidden;
        }

        .sticky-header {
            position: -webkit-sticky;
            position: sticky;
            top: 0;
            background-color: var(--bg-canvas);
            border-bottom: 2px solid var(--border-default);
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            margin-bottom: 16px;
        }

        .sticky-header h1 {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--accent-orange);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .score-tracker {
            font-size: 0.95rem;
            font-weight: bold;
            background-color: var(--bg-card);
            border: 1px solid var(--accent-orange);
            color: var(--accent-orange);
            padding: 6px 14px;
            border-radius: 20px;
            white-space: nowrap;
        }

        .filter-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
            padding: 0 4px;
        }

        .filter-btn {
            background-color: #242424;
            color: var(--text-sub);
            border: 1px solid var(--border-default);
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.88rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-btn.active {
            background-color: var(--accent-orange);
            color: #000;
            border-color: var(--accent-orange);
        }

        .quiz-body {
            padding: 0 4px;
        }

        .question-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-default);
            border-radius: 8px;
            padding: 18px;
            margin-bottom: 18px;
        }

        .image-wrapper {
            text-align: center;
            margin-bottom: 14px;
            background: #000;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid var(--border-default);
        }

        .image-wrapper img {
            max-width: 100%;
            height: auto;
            max-height: 480px;
            border-radius: 4px;
            display: inline-block;
        }

        .question-text {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 14px;
            line-height: 1.45;
            color: #ffffff;
        }

        .options-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .option-item {
            background-color: #242424;
            border: 1.5px solid var(--border-default);
            border-radius: 6px;
            padding: 12px 14px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: border-color 0.15s ease, background-color 0.15s ease;
            font-size: 0.95rem;
            touch-action: manipulation;
            display: flex;
            align-items: flex-start;
            color: #e5e5e5;
        }

        .option-item strong {
            margin-right: 10px;
            color: var(--accent-orange);
        }

        .option-item:hover:not(.disabled) {
            border-color: var(--accent-orange);
            background-color: #2a2a2a;
        }

        .option-item.correct {
            border-color: var(--correct-border) !important;
            background-color: var(--correct-bg) !important;
            color: #ffffff !important;
            font-weight: 600;
        }

        .option-item.correct strong {
            color: #ffffff !important;
        }

        .option-item.incorrect {
            border-color: var(--incorrect-border) !important;
            background-color: var(--incorrect-bg) !important;
            color: #ffffff !important;
        }

        .option-item.incorrect strong {
            color: #ffffff !important;
        }

        .option-item.disabled {
            cursor: default;
            pointer-events: none;
        }

        .feedback-box {
            padding: 14px 16px;
            border-radius: 6px;
            margin-top: 14px;
            display: none;
            font-size: 0.92rem;
            line-height: 1.5;
        }

        .feedback-box.show {
            display: block;
        }

        .feedback-box.correct {
            background-color: rgba(20, 83, 45, 0.4);
            border: 1px solid var(--correct-border);
            color: #e2fbe8;
        }

        .feedback-box.incorrect {
            background-color: rgba(127, 29, 29, 0.4);
            border: 1px solid var(--incorrect-border);
            color: #fde8e8;
        }

        .status-banner {
            font-size: 1.05rem;
            font-weight: 800;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .feedback-box.correct .status-banner {
            color: #4ade80;
        }

        .feedback-box.incorrect .status-banner {
            color: #f87171;
        }

        .explanation-text {
            margin-bottom: 10px;
        }

        .rationales-list {
            list-style-type: none;
            padding-left: 0;
            margin-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            padding-top: 8px;
        }

        .rationales-list li {
            margin-bottom: 4px;
            font-size: 0.88rem;
            line-height: 1.4;
        }

        .summary-card {
            background: var(--bg-card);
            border: 2px solid var(--accent-orange);
            color: white;
            padding: 24px;
            border-radius: 8px;
            text-align: center;
            margin-top: 20px;
            margin-bottom: 30px;
        }

        .summary-card h2 {
            font-size: 1.4rem;
            margin-bottom: 8px;
            color: var(--accent-orange);
        }

        .btn {
            background-color: var(--accent-orange);
            color: #000000;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 14px;
            touch-action: manipulation;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>

    let currentMode = 'all';
    let activeQuestions = [];
    let userAnswers = [];
    let answeredCount = 0;
    let correctCount = 0;

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function setMode(mode) {
        currentMode = mode;
        
        // Update nav buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.getAttribute('onclick').includes(mode)) {
                btn.classList.add('active');
            }
        });

        // Filter and re-render
        if (mode === 'all') {
            activeQuestions = JSON.parse(JSON.stringify(masterImageQuestions));
            document.getElementById('quiz-title').innerText = "Spinal 2 Comprehensive Practical";
        } else {
            activeQuestions = JSON.parse(JSON.stringify(masterImageQuestions.filter(q => q.week === mode)));
            const titles = {
                'week1': 'Spinal 2 - Week 1 Practical Drill',
                'week2': 'Spinal 2 - Week 2 Practical Drill',
                'week3_4': 'Spinal 2 - Weeks 3 & 4 Practical Drill'
            };
            document.getElementById('quiz-title').innerText = titles[mode];
        }

        resetQuiz();
    }

    function renderQuiz() {
        shuffleArray(activeQuestions);
        userAnswers = new Array(activeQuestions.length).fill(null);
        answeredCount = 0;
        correctCount = 0;
        updateHeaderScore();

        const quizContainer = document.getElementById('quiz-body');
        quizContainer.innerHTML = '';

        activeQuestions.forEach((q, qIndex) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = `q-card-${qIndex}`;

            // Image Element
            const imgWrap = document.createElement('div');
            imgWrap.className = 'image-wrapper';
            const img = document.createElement('img');
            img.src = `images/${q.image}`;
            img.alt = `Anatomy Diagram - Question ${qIndex + 1}`;
            imgWrap.appendChild(img);
            card.appendChild(imgWrap);

            // Question Text
            const qText = document.createElement('div');
            qText.className = 'question-text';
            qText.textContent = `${qIndex + 1}. ${q.question}`;
            card.appendChild(qText);

            // Options List
            const optionsList = document.createElement('ul');
            optionsList.className = 'options-list';

            q.options.forEach((opt, optIndex) => {
                const optItem = document.createElement('li');
                optItem.className = 'option-item';
                optItem.id = `opt-${qIndex}-${optIndex}`;
                
                const label = document.createElement('strong');
                label.textContent = `${String.fromCharCode(65 + optIndex)}.`;
                
                const text = document.createTextNode(` ${opt}`);
                
                optItem.appendChild(label);
                optItem.appendChild(text);

                optItem.addEventListener('click', function() {
                    selectAnswer(qIndex, optIndex);
                });

                optionsList.appendChild(optItem);
            });

            card.appendChild(optionsList);

            // Feedback Box
            const feedback = document.createElement('div');
            feedback.className = 'feedback-box';
            feedback.id = `feedback-${qIndex}`;
            card.appendChild(feedback);

            quizContainer.appendChild(card);
        });
    }

    function selectAnswer(qIndex, optIndex) {
        if (userAnswers[qIndex] !== null) return;

        const q = activeQuestions[qIndex];
        userAnswers[qIndex] = optIndex;
        answeredCount++;

        const isCorrect = (optIndex === q.correct);
        if (isCorrect) correctCount++;

        for (let i = 0; i < q.options.length; i++) {
            const optEl = document.getElementById(`opt-${qIndex}-${i}`);
            optEl.classList.add('disabled');

            if (i === q.correct) {
                optEl.classList.add('correct');
            } else if (i === optIndex && !isCorrect) {
                optEl.classList.add('incorrect');
            }
        }

        const feedbackEl = document.getElementById(`feedback-${qIndex}`);
        feedbackEl.classList.add('show');
        
        let rationalesHTML = '<ul class="rationales-list">';
        q.rationales.forEach(rat => {
            rationalesHTML += `<li>- ${rat}</li>`;
        });
        rationalesHTML += '</ul>';

        if (isCorrect) {
            feedbackEl.classList.add('correct');
            feedbackEl.innerHTML = `
                <div class="status-banner">Correct!</div>
                <div class="explanation-text">${q.explanation}</div>
                ${rationalesHTML}
            `;
        } else {
            feedbackEl.classList.add('incorrect');
            feedbackEl.innerHTML = `
                <div class="status-banner">Incorrect.</div>
                <div class="explanation-text">${q.explanation}</div>
                ${rationalesHTML}
            `;
        }

        updateHeaderScore();

        if (answeredCount === activeQuestions.length) {
            showFinalSummary();
        }
    }

    function updateHeaderScore() {
        const total = activeQuestions.length;
        const percent = total > 0 ? Math.round((correctCount / total) * 100) : 0;
        document.getElementById('score-tracker').innerText = `Score: ${correctCount} / ${total} (${percent}%)`;
    }

    function showFinalSummary() {
        const total = activeQuestions.length;
        const percent = Math.round((correctCount / total) * 100);
        const summaryBox = document.getElementById('final-summary');
        summaryBox.style.display = 'block';
        document.getElementById('final-score-text').innerText = `Final Score: ${correctCount} out of ${total} (${percent}%)`;
        summaryBox.scrollIntoView({ behavior: 'smooth' });
    }

    function resetQuiz() {
        document.getElementById('final-summary').style.display = 'none';
        renderQuiz();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.onload = function() {
        setMode('all');
        document.getElementById('reset-btn').addEventListener('click', resetQuiz);
    };
</script>
