                "D) Longissimus Capitis: Incorrect. This muscle is consistently present."
            ]
        },
        {
            question: "23. What upper extremity muscle was compared in lecture to Spinalis Cervicis regarding anatomical variability?",
            options: [
                "Palmaris brevis (or Palmaris longus)",
                "Biceps brachii short head",
                "Anconeus",
                "Brachioradialis"
            ],
            correct: 0,
            explanation: "The inconstant presence of Spinalis Cervicis in the back was compared to the variable presence of the palmaris muscle in the hand/arm.",
            rationales: [
                "A) Palmaris brevis (or Palmaris longus): Correct. Both exhibit notable anatomical variability and frequent absence.",
                "B) Biceps brachii short head: Incorrect. This head is consistently present.",
                "C) Anconeus: Incorrect. Anconeus is a stable elbow muscle.",
                "D) Brachioradialis: Incorrect. This is a consistent forearm landmark."
            ]
        },
        {
            question: "24. Why does the Spinalis group act almost exclusively as postural extensors rather than lateral flexors?",
            options: [
                "They attach directly adjacent to the spinous processes along the midline, lacking a lateral lever arm",
                "They are innervated by anterior thoracic nerves",
                "They contain no type I slow-twitch muscle fibers",
                "Their origins cross the sagittal plane diagonally"
            ],
            correct: 0,
            explanation: "Because Spinalis muscles hug the midline spinous processes, they lack the lateral distance needed to create leverage for lateral flexion.",
            rationales: [
                "A) They attach directly adjacent to the spinous processes along the midline, lacking a lateral lever arm: Correct. Midline attachment restricts them primarily to extension.",
                "B) They are innervated by anterior thoracic nerves: Incorrect. They are innervated by dorsal rami.",
                "C) They contain no type I slow-twitch muscle fibers: Incorrect. Postural muscles are rich in type I fibers.",
                "D) Their origins cross the sagittal plane diagonally: Incorrect. Their orientation is primarily longitudinal."
            ]
        },
        {
            question: "25. Why have National Board examiners shifted from strict 'Origin/Insertion' terminology to 'Attachment Sites'?",
            options: [
                "Functional reversal occurs in closed kinetic chain movements where origins move toward insertions",
                "Muscles no longer possess tendon insertions",
                "Innervations vary between cadavers",
                "Board questions are moving away from biomechanics"
            ],
            correct: 0,
            explanation: "In closed kinetic chain mechanics, traditional origins and insertions reverse, making 'attachment sites' a more accurate term.",
            rationales: [
                "A) Functional reversal occurs in closed kinetic chain movements where origins move toward insertions: Correct. Kinetic chain shifts invert functional anchor points.",
                "B) Muscles no longer possess tendon insertions: Incorrect. Tendinous insertions remain structurally present.",
                "C) Innervations vary between cadavers: Incorrect. Terminology changes are based on biomechanics.",
                "D) Board questions are moving away from biomechanics: Incorrect. Boards emphasize functional biomechanics."
            ]
        }
    ];

    let questions = [];
    let userAnswers = [];
    let answeredCount = 0;
    let correctCount = 0;

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function renderQuiz() {
        // Deep clone and shuffle question order with Fisher-Yates
        questions = JSON.parse(JSON.stringify(originalQuestions));
        shuffleArray(questions);

        userAnswers = new Array(questions.length).fill(null);
        answeredCount = 0;
        correctCount = 0;

        const quizContainer = document.getElementById('quiz-body');
        quizContainer.innerHTML = '';

        questions.forEach((q, qIndex) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = `q-card-${qIndex}`;

            const qText = document.createElement('div');
            qText.className = 'question-text';
            qText.textContent = `${qIndex + 1}. ${q.question.replace(/^\d+\.\s*/, '')}`;
            card.appendChild(qText);

            const optionsList = document.createElement('ul');
            optionsList.className = 'options-list';

            q.options.forEach((opt, optIndex) => {
                const optItem = document.createElement('li');
                optItem.className = 'option-item';
                optItem.id = `opt-${qIndex}-${optIndex}`;
                
                const label = document.createElement('strong');
                label.textContent = `${String.fromCharCode(65 + optIndex)}.`;
                
                const text = document.createTextNode(` ${opt}`);
                
                optItem.appendChild(label);
                optItem.appendChild(text);

                optItem.addEventListener('click', function() {
                    selectAnswer(qIndex, optIndex);
                });

                optionsList.appendChild(optItem);
            });

            card.appendChild(optionsList);

            const feedback = document.createElement('div');
            feedback.className = 'feedback-box';
            feedback.id = `feedback-${qIndex}`;
            card.appendChild(feedback);

            quizContainer.appendChild(card);
        });
    }

    function selectAnswer(qIndex, optIndex) {
        if (userAnswers[qIndex] !== null) return;

        const q = questions[qIndex];
        userAnswers[qIndex] = optIndex;
        answeredCount++;

        const isCorrect = (optIndex === q.correct);
        if (isCorrect) correctCount++;

        for (let i = 0; i < q.options.length; i++) {
            const optEl = document.getElementById(`opt-${qIndex}-${i}`);
            optEl.classList.add('disabled');

            if (i === q.correct) {
                optEl.classList.add('correct');
            } else if (i === optIndex && !isCorrect) {
                optEl.classList.add('incorrect');
            }
        }

        const feedbackEl = document.getElementById(`feedback-${qIndex}`);
        feedbackEl.classList.add('show');
        
        let rationalesHTML = '<ul class="rationales-list">';
        q.rationales.forEach(rat => {
            rationalesHTML += `<li>- ${rat}</li>`;
        });
        rationalesHTML += '</ul>';

        if (isCorrect) {
            feedbackEl.classList.add('correct');
            feedbackEl.innerHTML = `
                <div class="status-banner">Correct!</div>
                <div class="explanation-text">${q.explanation}</div>
                ${rationalesHTML}
            `;
        } else {
            feedbackEl.classList.add('incorrect');
            feedbackEl.innerHTML = `
                <div class="status-banner">Incorrect.</div>
                <div class="explanation-text">${q.explanation}</div>
                ${rationalesHTML}
            `;
        }

        updateHeaderScore();

        if (answeredCount === questions.length) {
            showFinalSummary();
        }
    }

    function updateHeaderScore() {
        const percent = Math.round((correctCount / questions.length) * 100);
        document.getElementById('score-tracker').innerText = `Score: ${correctCount} / ${questions.length} (${percent}%)`;
    }

    function showFinalSummary() {
        const percent = Math.round((correctCount / questions.length) * 100);
        const summaryBox = document.getElementById('final-summary');
        summaryBox.style.display = 'block';
        document.getElementById('final-score-text').innerText = `Final Score: ${correctCount} out of ${questions.length} (${percent}%)`;
        summaryBox.scrollIntoView({ behavior: 'smooth' });
    }

    function resetQuiz() {
        document.getElementById('final-summary').style.display = 'none';
        updateHeaderScore();
        renderQuiz();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.onload = function() {
        renderQuiz();
        document.getElementById('reset-btn').addEventListener('click', resetQuiz);
    };
</script>
