<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Hub - Master Base</title>
    <style>
        /* Base Variables (Default: Clash of Clans Village) */
        :root {
            --bg-color: #4a7c29;
            --bg-pattern-1: #5a8c39;
            --bg-pattern-2: #5a8c39;
            --card-bg: #8b5a2b;
            --card-border: #4a2e16;
            --card-shadow: #2a180b;
            --header-bg: rgba(0, 0, 0, 0.4);
            --header-border: #ffcc00;
            --logo-color: #ffcc00;
            --logo-box-bg: transparent;
            --logo-box-text: #ffcc00;
            --title-color: #ffffff;
            --subtitle-color: #ffcc00;
            --btn-bg-top: #ff9900;
            --btn-bg-bottom: #ff5500;
            --btn-border: #ffffff;
            --btn-shadow: #992200;
            --btn-text: #ffffff;
        }

        /* Alternate Theme (Dark / Orange Mode) */
        body.hub-mode {
            --bg-color: #0f0f0f;
            --bg-pattern-1: #0f0f0f;
            --bg-pattern-2: #0f0f0f;
            --card-bg: #1a1a1a;
            --card-border: #333333;
            --card-shadow: #000000;
            --header-bg: #111111;
            --header-border: #222222;
            --logo-color: #ffffff;
            --logo-box-bg: #ff9900;
            --logo-box-text: #000000;
            --title-color: #ffffff;
            --subtitle-color: #888888;
            --btn-bg-top: #ff9900;
            --btn-bg-bottom: #ff9900;
            --btn-border: #ff9900;
            --btn-shadow: #000000;
            --btn-text: #000000;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Supercell-Magic', Arial, sans-serif; 
            background: var(--bg-color);
            background-image: 
                radial-gradient(var(--bg-pattern-1) 15%, transparent 16%),
                radial-gradient(var(--bg-pattern-2) 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            color: var(--title-color); 
            padding: 20px; 
            user-select: none;
            transition: background 0.3s, color 0.3s;
        }

        /* Top Header Bar */
        .header-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            max-width: 1000px; 
            margin: 0 auto 20px auto; 
            background: var(--header-bg); 
            padding: 12px 20px; 
            border-radius: 12px; 
            border: 3px solid var(--header-border);
            box-shadow: 0 6px 0 #000;
        }

        .logo-container {
            font-size: 26px;
            font-weight: 900;
            text-transform: uppercase;
            color: var(--logo-color);
            text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .logo-box {
            background-color: var(--logo-box-bg);
            color: var(--logo-box-text);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .builder-stats {
            display: flex;
            gap: 15px;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 1px 1px 0 #000;
        }

        .stat-badge {
            background: #333;
            padding: 6px 12px;
            border-radius: 20px;
            border: 2px solid #666;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #fff;
        }

        .village-grid {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        /* Building / Module Card */
        .building-card {
            background: var(--card-bg);
            border: 4px solid var(--card-border);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 8px 0 var(--card-shadow);
            text-decoration: none;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.1s, background 0.3s;
        }

        .building-card:hover {
            transform: translateY(-4px);
        }

        .building-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .building-icon {
            font-size: 32px;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px;
            border-radius: 8px;
            border: 2px solid #d4af37;
        }

        .building-title {
            font-size: 18px;
            font-weight: 900;
            color: var(--title-color);
            text-shadow: 1px 1px 0 #000;
        }

        .level-badge {
            font-size: 11px;
            color: var(--subtitle-color);
            margin-top: 2px;
        }

        /* Action Buttons */
        .attack-btn {
            background: linear-gradient(to bottom, var(--btn-bg-top), var(--btn-bg-bottom));
            border: 2px solid var(--btn-border);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            font-weight: 900;
            font-size: 14px;
            text-transform: uppercase;
            text-shadow: 1px 1px 0 #000;
            box-shadow: 0 4px 0 var(--btn-shadow);
            color: var(--btn-text);
            margin-top: 10px;
        }

        .multi-btn-group {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .multi-btn-group .attack-btn {
            flex: 1;
            margin-top: 0;
        }
    </style>
</head>
<body>

    <!-- Top Navigation Bar -->
    <div class="header-bar">
        <div class="logo-container" id="logoToggle">
            <span>Quiz</span>
            <span class="logo-box">Hub</span>
        </div>
        <div class="builder-stats">
            <div class="stat-badge">🔨 Builders: 2/2</div>
            <div class="stat-badge">🏆 Trophies: 2,400</div>
        </div>
    </div>

    <!-- Main Grid -->
    <div class="village-grid">

        <!-- Biochem -->
        <div class="building-card">
            <div>
                <div class="building-header">
                    <div class="building-icon">🧪</div>
                    <div>
                        <div class="building-title">Biochem</div>
                        <div class="level-badge">Town Hall Level 1</div>
                    </div>
                </div>
            </div>
            <a href="Biochem%20Week%201.html" style="text-decoration: none;">
                <div class="attack-btn">Attack Week 1</div>
            </a>
        </div>

        <!-- GenPath -->
        <div class="building-card">
            <div>
                <div class="building-header">
                    <div class="building-icon">🔬</div>
                    <div>
                        <div class="building-title">GenPath</div>
                        <div class="level-badge">Town Hall Level 1</div>
                    </div>
                </div>
            </div>
            <a href="Gen%20Path%20Week%201.html" style="text-decoration: none;">
                <div class="attack-btn">Attack Week 1</div>
            </a>
        </div>

        <!-- Microbio -->
        <div class="building-card">
            <div>
                <div class="building-header">
                    <div class="building-icon">🧫</div>
                    <div>
                        <div class="building-title">Microbio</div>
                        <div class="level-badge">Town Hall Level 1</div>
                    </div>
                </div>
            </div>
            <a href="Microbio%20Week%201.html" style="text-decoration: none;">
                <div class="attack-btn">Attack Week 1</div>
            </a>
        </div>

        <!-- Reg 1 -->
        <div class="building-card">
            <div>
                <div class="building-header">
                    <div class="building-icon">🦴</div>
                    <div>
                        <div class="building-title">Reg 1</div>
                        <div class="level-badge">Town Hall Level 1</div>
                    </div>
                </div>
            </div>
            <a href="Reg%201%20Week%201.html" style="text-decoration: none;">
                <div class="attack-btn">Attack Week 1</div>
            </a>
        </div>

        <!-- Spinal 2 -->
        <div class="building-card">
            <div>
                <div class="building-header">
                    <div class="building-icon">🩺</div>
                    <div>
                        <div class="building-title">Spinal 2</div>
                        <div class="level-badge">Town Hall Level 2</div>
                    </div>
                </div>
            </div>
            <div class="multi-btn-group">
                <a href="Spinal%202%20Week%201.html" style="text-decoration: none; flex: 1;">
                    <div class="attack-btn">Week 1</div>
                </a>
                <a href="Spinal%202%20Week%202.html" style="text-decoration: none; flex: 1;">
                    <div class="attack-btn">Week 2</div>
                </a>
            </div>
        </div>

        <!-- Sys Phys -->
        <div class="building-card">
            <div>
                <div class="building-header">
                    <div class="building-icon">🫀</div>
                    <div>
                        <div class="building-title">Sys Phys</div>
                        <div class="level-badge">Town Hall Level 1</div>
                    </div>
                </div>
            </div>
            <a href="Sys%20Phys%20Week%201.html" style="text-decoration: none;">
                <div class="attack-btn">Attack Week 1</div>
            </a>
        </div>

    </div>

    <script>
        const logo = document.getElementById('logoToggle');
        
        // Remember mode across page refreshes
        if (localStorage.getItem('quizHubTheme') === 'dark') {
            document.body.classList.add('hub-mode');
        }

        // Toggle theme when clicking the Quiz Hub logo
        logo.addEventListener('click', () => {
            document.body.classList.toggle('hub-mode');
            if (document.body.classList.contains('hub-mode')) {
                localStorage.setItem('quizHubTheme', 'dark');
            } else {
                localStorage.setItem('quizHubTheme', 'clash');
            }
        });
    </script>
</body>
</html>
