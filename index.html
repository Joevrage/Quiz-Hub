<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Hub - Master Base</title>
    <style>
        /* =========================================================
           1. CLASH OF CLANS THEME (DEFAULT)
           ========================================================= */
        :root {
            --bg-color: #4a7c29;
            --bg-pattern: #5a8c39;
            --header-bg: rgba(0, 0, 0, 0.4);
            --header-border: #ffcc00;
            --logo-color: #ffcc00;
            --logo-box-bg: transparent;
            --logo-box-text: #ffcc00;
            --card-bg: #8b5a2b;
            --card-border: #4a2e16;
            --card-shadow: #2a180b;
            --title-color: #ffffff;
            --badge-color: #ffcc00;
            --btn-bg-top: #ff9900;
            --btn-bg-bottom: #ff5500;
            --btn-border: #ffffff;
            --btn-shadow: #992200;
            --btn-text: #ffffff;
        }

        /* =========================================================
           2. HUB THEME (TOGGLED)
           ========================================================= */
        body.hub-mode {
            --bg-color: #0f0f0f;
            --bg-pattern: #0f0f0f;
            --header-bg: #0f0f0f;
            --header-border: #222222;
            --logo-color: #ffffff;
            --logo-box-bg: #ff9900;
            --logo-box-text: #000000;
            --card-bg: #1a1a1a;
            --card-border: #282828;
            --card-shadow: transparent;
            --title-color: #ffffff;
            --badge-color: #888888;
            --btn-bg-top: #ff9900;
            --btn-bg-bottom: #ff9900;
            --btn-border: #ff9900;
            --btn-shadow: transparent;
            --btn-text: #000000;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: Arial, sans-serif; 
            background: var(--bg-color);
            background-image: 
                radial-gradient(var(--bg-pattern) 15%, transparent 16%),
                radial-gradient(var(--bg-pattern) 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            color: var(--title-color); 
            padding: 20px; 
            user-select: none;
            transition: background 0.2s, color 0.2s;
        }

        /* Top Navigation Bar */
        .header-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            max-width: 1050px; 
            margin: 0 auto 25px auto; 
            background: var(--header-bg); 
            padding: 12px 20px; 
            border-radius: 8px; 
            border: 2px solid var(--header-border);
            box-shadow: 0 4px 0 #000;
        }

        .logo-container {
            font-size: 26px;
            font-weight: 900;
            text-transform: uppercase;
            color: var(--logo-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            letter-spacing: -1px;
        }

        .logo-box {
            background-color: var(--logo-box-bg);
            color: var(--logo-box-text);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .builder-stats {
            display: flex;
            gap: 12px;
            font-size: 13px;
            font-weight: bold;
        }

        body.hub-mode .builder-stats {
            display: none;
        }

        .stat-badge {
            background: #222;
            padding: 6px 12px;
            border-radius: 16px;
            border: 1px solid #444;
            color: #fff;
        }

        .main-container {
            max-width: 1050px;
            margin: 0 auto;
        }

        /* =========================================================
           LAYOUT 1: CLASH OF CLANS VILLAGE GRID
           ========================================================= */
        .clash-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        body.hub-mode .clash-grid {
            display: none;
        }

        .building-card {
            background: var(--card-bg);
            border: 3px solid var(--card-border);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 6px 0 var(--card-shadow);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .building-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .building-icon {
            font-size: 32px;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #ffcc00;
        }

        .building-title {
            font-size: 18px;
            font-weight: 900;
            color: #ffffff;
        }

        .level-badge {
            font-size: 11px;
            color: #ffcc00;
            margin-top: 2px;
            text-transform: uppercase;
        }

        .attack-btn {
            background: linear-gradient(to bottom, #ff9900, #ff5500);
            border: 1px solid #ffffff;
            border-radius: 6px;
            padding: 10px;
            text-align: center;
            font-weight: 900;
            font-size: 13px;
            text-transform: uppercase;
            box-shadow: 0 3px 0 #992200;
            color: #ffffff;
            margin-top: 10px;
