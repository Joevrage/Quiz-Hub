let sel = new Set(SUBJECTS.map((_, idx) => idx));
let P = [], i = 0, sc = 0, dn = 0, mode = 'card', missed = [], curSet = [];
const $ = id => document.getElementById(id);
const sh = a => {
  a = a.slice();
  for (let k = a.length - 1; k > 0; k--) {
    const j = Math.floor(Math.random() * (k + 1));
    [a[k], a[j]] = [a[j], a[k]];
  }
  return a;
};
let mute = localStorage.getItem('stfuErijah') === '1';

function tmute() {
  mute = !mute;
  localStorage.setItem('stfuErijah', mute ? '1' : '0');
  bar();
}

function tmode() {
  mode = mode === 'card' ? 'list' : 'card';
  if (P.length && !$('app').querySelector('.chip')) draw();
  bar();
}

function bar() {
  const t = dn ? Math.round(sc / dn * 100) : 0;
  $('sc').textContent = `Score: ${sc} / ${P.length || 0} (${t}%)`;
  $('pc').textContent = P.length ? `Answered ${dn}/${P.length}` : '';
  $('pb').style.width = (P.length ? dn / P.length * 100 : 0) + '%';
  $('md').textContent = 'Mode: ' + (mode === 'card' ? 'One by One (Card View)' : 'All at Once (Continuous List)');
  $('mu').textContent = mute ? 'Bring Back Erijah' : 'STFU Erijah';
}

function menu() {
  P = [];
  sc = dn = 0;
  bar();
  const n = questionBank.filter(q => sel.has(q.subjectIndex)).length;
  $('app').innerHTML = `<h1>Week 7: Helminths and Prions</h1><p>Select one or more topics, then start.</p>
<button class="pr" onclick="sel=new Set(SUBJECTS.map((_,idx)=>idx));menu()">Select All (${questionBank.length})</button> <button onclick="sel.clear();menu()">Clear</button><div>` +
    SUBJECTS.map((subj, idx) => `<button class="chip ${sel.has(idx) ? 'on' : ''}" onclick="tg(${idx})">${subj.title} (${subj.week}) (${questionBank.filter(q => q.subjectIndex === idx).length})</button>`).join('') +
    `</div><p><b>Active Pool: ${n} questions across ${sel.size} topics selected</b></p><button class="pr" onclick="go()">Start Quiz</button>`;
}

function tg(idx) {
  sel.has(idx) ? sel.delete(idx) : sel.add(idx);
  menu();
}

function go() {
  if (!sel.size) return alert('Select at least one topic.');
  begin(questionBank.filter(q => sel.has(q.subjectIndex)));
}

function begin(src) {
  curSet = src;
  P = sh(src).map(q => ({
    q,
    o: sh(q.options.map(opt => ({ t: opt.text, r: opt.why, ok: opt.correct }))),
    a: null
  }));
  i = 0;
  sc = dn = 0;
  missed = [];
  draw();
  bar();
}

function qh(n) {
  const p = P[n];
  const L = 'ABCD';
  const subj = SUBJECTS[p.q.subjectIndex];
  const correctOpt = p.o.find(o => o.ok);
  return `<div class="q" id="q${n}"><div class="tag">${subj.title} · ${p.q.week} · ${p.q.difficulty.toUpperCase()} · Question ${n + 1}/${P.length}</div><h3>${p.q.stem}</h3>` +
    p.o.map((o, k) => `<button class="o ${p.a === null ? '' : o.ok ? 'ok' : k === p.a ? 'no' : 'dim'}" ${p.a === null ? `onclick="ans(${n},${k})"` : 'disabled'}>${L[k]}) ${o.t}</button>`).join('') +
    (p.a === null ? '' : `<div class="ex"><div class="ban ${p.o[p.a].ok ? 'g' : 'rd'}">${p.o[p.a].ok ? 'Correct!' : 'Incorrect.'}</div><p>${correctOpt ? correctOpt.r : ''}</p><ul>` + p.o.map((o, k) => `<li><b>${L[k]}) ${o.t}:</b> ${o.r}</li>`).join('') + '</ul></div>') + '</div>';
}

function draw() {
  const a = $('app');
  if (mode === 'card') {
    a.innerHTML = qh(i) + (P[i].a !== null ? `<button class="pr" onclick="nx()">${i < P.length - 1 ? 'Next' : 'Finish'}</button>` : '');
  } else {
    a.innerHTML = P.map((_, n) => qh(n)).join('') + `<button class="pr" onclick="summ()">Finish</button>`;
  }
}

function ans(n, k) {
  const p = P[n];
  if (p.a !== null) return;
  p.a = k;
  dn++;
  if (p.o[k].ok) sc++;
  else {
    missed.push(p.q);
    wrong();
  }
  if (mode === 'card') draw();
  else $('q' + n).outerHTML = qh(n);
  bar();
}

function nx() {
  if (i < P.length - 1) {
    i++;
    draw();
    scrollTo(0, 0);
  } else {
    summ();
  }
}

function wrong() {
  if (mute) return;
  const a = new Audio('Wrong-answer.m4a');
  a.onerror = () => {
    new Audio('Wrong-answer.mp3').play().catch(() => {});
  };
  a.play().catch(() => {});
  $('pop').style.display = 'flex';
  setTimeout(() => $('pop').style.display = 'none', 2000);
}

function summ() {
  const t = P.length ? Math.round(sc / P.length * 100) : 0;
  const m = t >= 90 ? 'Absolute Gigachad. You drained that test dry.' : t >= 70 ? 'You lasted less than 30 seconds. Time for a rematch.' : 'You really didn’t fucking know that.';
  $('app').innerHTML = `<div class="q sum"><h2>${sc} / ${P.length} (${t}%)</h2><p>${m}</p><button class="pr" onclick="begin(curSet)">Retake Current Set</button><button onclick="rev()">Review Missed (${missed.length})</button><button onclick="menu()">Back to Menu</button><a href="index.html"><button>Back to Hub</button></a></div>`;
}

function rev() {
  if (!missed.length) return alert('No missed questions.');
  begin(missed.slice());
}

menu();
</script>
