    /* =========================================================
       STATE & UTILITIES
       ========================================================= */
    let selectedSubject = "all";
    let setMode = "full";     // "full" | "quick"
    let viewMode = "list";    // "list" | "card"
    let isMuted = false;

    let activeQuestions = [];
    let userAnswers = {};     // { [q.id]: { selectedIndex, correct } }
    let round = 1;
    let currentCardIndex = 0;
    let popupTimer = null;

    function fisherYates(arr) {
      const copy = arr.slice();
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function prepareQuestion(rawQ) {
      return {
        ...rawQ,
        options: fisherYates(rawQ.options)
      };
    }

    /* =========================================================
       AUDIO & POPUP FEEDBACK
       ========================================================= */
    const wrongAudio = document.getElementById("wrongAudio");
    const wrongPopup = document.getElementById("wrongPopup");
    const muteToggleBtn = document.getElementById("muteToggleBtn");

    muteToggleBtn.addEventListener("click", () => {
      isMuted = !isMuted;
      muteToggleBtn.classList.toggle("muted", isMuted);
      muteToggleBtn.textContent = isMuted ? "Erijah Muted" : "STFU Erijah";
      if (isMuted) {
        wrongAudio.pause();
        wrongAudio.currentTime = 0;
        wrongPopup.classList.add("hidden");
      }
    });

    function triggerWrongFeedback() {
      if (isMuted) return;
      try {
        wrongAudio.currentTime = 0;
        wrongAudio.play().catch(() => {});
      } catch (e) {}

      wrongPopup.classList.remove("hidden");
      if (popupTimer) clearTimeout(popupTimer);
      popupTimer = setTimeout(() => {
        wrongPopup.classList.add("hidden");
      }, 2000);
    }

    /* =========================================================
       SUBJECT FILTERS & INITIALIZATION
       ========================================================= */
    function renderSubjectFilters() {
      const container = document.getElementById("subjectFilters");
      container.innerHTML = "";

      const allBtn = document.createElement("button");
      allBtn.type = "button";
      allBtn.className = "pill-btn" + (selectedSubject === "all" ? " active" : "");
      allBtn.textContent = `All Week 7 Topics (${questionBank.length})`;
      allBtn.onclick = () => {
        selectedSubject = "all";
        startNewSession();
      };
      container.appendChild(allBtn);

      SUBJECTS.forEach((sub, idx) => {
        const count = questionBank.filter(q => q.subjectIndex === idx).length;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "pill-btn" + (selectedSubject === idx ? " active" : "");
        btn.textContent = `${sub.title} (${count})`;
        btn.onclick = () => {
          selectedSubject = idx;
          startNewSession();
        };
        container.appendChild(btn);
      });
    }

    function startNewSession(customPool = null) {
      round = 1;
      userAnswers = {};
      currentCardIndex = 0;

      let pool = customPool
        ? customPool
        : (selectedSubject === "all"
            ? questionBank
            : questionBank.filter(q => q.subjectIndex === selectedSubject));

      let shuffled = fisherYates(pool).map(prepareQuestion);
      if (!customPool && setMode === "quick") {
        shuffled = shuffled.slice(0, 15);
      }

      activeQuestions = shuffled;
      document.getElementById("summaryCard").classList.add("hidden");
      document.getElementById("quizContainer").classList.remove("hidden");
      renderSubjectFilters();
      updateHeaderStats();
      renderQuiz();
    }

    function startReviewMissedRound() {
      const missedIds = new Set(
        activeQuestions
          .filter(q => !userAnswers[q.id] || !userAnswers[q.id].correct)
          .map(q => q.id)
      );
      const missedPool = questionBank.filter(q => missedIds.has(q.id));
      if (missedPool.length === 0) return;

      round++;
      userAnswers = {};
      currentCardIndex = 0;
      activeQuestions = fisherYates(missedPool).map(prepareQuestion);

      document.getElementById("summaryCard").classList.add("hidden");
      document.getElementById("quizContainer").classList.remove("hidden");
      updateHeaderStats();
      renderQuiz();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    /* =========================================================
       SCORE & PROGRESS TRACKING
       ========================================================= */
    function updateHeaderStats() {
      const total = activeQuestions.length;
      const answeredCount = Object.keys(userAnswers).length;
      const correctCount = Object.values(userAnswers).filter(a => a.correct).length;
      const pct = total > 0 ? Math.round((correctCount / total) * 100) : 0;
      const label = round === 1 ? "Score" : `Review ${round - 1}`;

      document.getElementById("scoreCounter").textContent =
        `${label}: ${correctCount} / ${total} (${pct}%)`;

      const progressPct = total > 0 ? Math.round((answeredCount / total) * 100) : 0;
      document.getElementById("progressBar").style.width = `${progressPct}%`;
    }

    /* =========================================================
       RENDERING ENGINE
       ========================================================= */
    function buildQuestionCard(q, index) {
      const card = document.createElement("article");
      card.className = "question-card";

      const meta = document.createElement("div");
      meta.className = "q-meta";

      const tags = document.createElement("div");
      tags.className = "q-tags";

      const numTag = document.createElement("span");
      numTag.className = "tag";
      numTag.textContent = `Q${index + 1} of ${activeQuestions.length}`;
      tags.appendChild(numTag);

      const subTag = document.createElement("span");
      subTag.className = "tag";
      subTag.textContent = SUBJECTS[q.subjectIndex].title;
      tags.appendChild(subTag);

      if (q.priority) {
        const hyTag = document.createElement("span");
        hyTag.className = "tag high-yield";
        hyTag.textContent = "High-Yield";
        tags.appendChild(hyTag);
      }

      const refSpan = document.createElement("span");
      refSpan.textContent = `${q.week} • ${q.slideRef}`;

      meta.appendChild(tags);
      meta.appendChild(refSpan);
      card.appendChild(meta);

      const stemEl = document.createElement("div");
      stemEl.className = "q-stem";
      stemEl.textContent = q.stem;
      card.appendChild(stemEl);

      const optsGrid = document.createElement("div");
      optsGrid.className = "options-grid";

      const savedAnswer = userAnswers[q.id];
      const letters = ["A", "B", "C", "D"];

      q.options.forEach((opt, optIdx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "option-btn";

        if (savedAnswer) {
          btn.disabled = true;
          if (opt.correct) {
            btn.classList.add("correct-choice");
          } else if (savedAnswer.selectedIndex === optIdx) {
            btn.classList.add("incorrect-choice");
          } else {
            btn.classList.add("dimmed");
          }
        }

        const letterSpan = document.createElement("span");
        letterSpan.className = "opt-letter";
        letterSpan.textContent = `${letters[optIdx]})`;

        const textSpan = document.createElement("span");
        textSpan.textContent = opt.text;

        btn.appendChild(letterSpan);
        btn.appendChild(textSpan);

        if (!savedAnswer) {
          btn.onclick = () => handleOptionSelect(q, optIdx);
        }

        optsGrid.appendChild(btn);
      });

      card.appendChild(optsGrid);

      if (savedAnswer) {
        const expBox = document.createElement("div");
        expBox.className = "explanation-box";

        const banner = document.createElement("div");
        banner.className = "status-banner " + (savedAnswer.correct ? "pass" : "fail");
        banner.textContent = savedAnswer.correct ? "Correct!" : "Incorrect.";
        expBox.appendChild(banner);

        const summaryEl = document.createElement("div");
        summaryEl.className = "concept-summary";
        summaryEl.textContent = q.summary;
        expBox.appendChild(summaryEl);

        const list = document.createElement("ul");
        list.className = "rationale-list";

        q.options.forEach((opt, optIdx) => {
          const li = document.createElement("li");
          if (opt.correct) li.classList.add("is-right");
          const strong = document.createElement("strong");
          strong.textContent = `${letters[optIdx]}) ${opt.text}: `;
          li.appendChild(strong);
          li.appendChild(document.createTextNode(opt.why));
          list.appendChild(li);
        });

        expBox.appendChild(list);
        card.appendChild(expBox);
      }

      return card;
    }

    function handleOptionSelect(q, optIdx) {
      if (userAnswers[q.id]) return;
      const chosen = q.options[optIdx];
      userAnswers[q.id] = {
        selectedIndex: optIdx,
        correct: Boolean(chosen.correct)
      };

      if (!chosen.correct) {
        triggerWrongFeedback();
      }

      updateHeaderStats();
      renderQuiz();

      if (Object.keys(userAnswers).length === activeQuestions.length) {
        showSummaryCard();
      }
    }

    function renderQuiz() {
      const container = document.getElementById("quizContainer");
      container.innerHTML = "";

      if (activeQuestions.length === 0) {
        container.innerHTML = `<div class="question-card">No questions found for this filter.</div>`;
        return;
      }

      if (viewMode === "list") {
        activeQuestions.forEach((q, idx) => {
          container.appendChild(buildQuestionCard(q, idx));
        });
      } else {
        const q = activeQuestions[currentCardIndex];
        container.appendChild(buildQuestionCard(q, currentCardIndex));

        const nav = document.createElement("div");
        nav.className = "card-nav";

        const prevBtn = document.createElement("button");
        prevBtn.type = "button";
        prevBtn.className = "btn btn-secondary";
        prevBtn.textContent = "Previous";
        prevBtn.disabled = currentCardIndex === 0;
        prevBtn.onclick = () => {
          if (currentCardIndex > 0) {
            currentCardIndex--;
            renderQuiz();
          }
        };

        const indicator = document.createElement("span");
        indicator.style.color = "var(--text-muted)";
        indicator.style.fontWeight = "600";
        indicator.textContent = `Card ${currentCardIndex + 1} / ${activeQuestions.length}`;

        const nextBtn = document.createElement("button");
        nextBtn.type = "button";
        nextBtn.className = "btn";
        nextBtn.textContent = currentCardIndex === activeQuestions.length - 1 ? "Finish Review" : "Next";
        nextBtn.onclick = () => {
          if (currentCardIndex < activeQuestions.length - 1) {
            currentCardIndex++;
            renderQuiz();
          } else {
            showSummaryCard();
          }
        };

        nav.appendChild(prevBtn);
        nav.appendChild(indicator);
        nav.appendChild(nextBtn);
        container.appendChild(nav);
      }
    }

    function showSummaryCard() {
      const total = activeQuestions.length;
      const correctCount = Object.values(userAnswers).filter(a => a.correct).length;
      const pct = total > 0 ? Math.round((correctCount / total) * 100) : 0;
      const missedCount = total - correctCount;

      const summaryCard = document.getElementById("summaryCard");
      const heading = document.getElementById("summaryHeading");
      const scoreEl = document.getElementById("summaryScore");
      const tierEl = document.getElementById("summaryTier");
      const reviewBtn = document.getElementById("reviewMissedBtn");

      heading.textContent = round === 1 ? "Quiz Complete" : `Review Round ${round - 1} Complete`;
      scoreEl.textContent = `${correctCount} / ${total} (${pct}%)`;

      if (pct >= 90) {
        tierEl.textContent = "Absolute Gigachad. You drained that test dry.";
        tierEl.style.color = "#22c55e";
      } else if (pct >= 70) {
        tierEl.textContent = "You lasted less than 30 seconds. Time for a rematch.";
        tierEl.style.color = "#ff9900";
      } else {
        tierEl.textContent = "You really didn’t fucking know that.";
        tierEl.style.color = "#ef4444";
      }

      if (missedCount > 0) {
        reviewBtn.classList.remove("hidden");
        reviewBtn.textContent = `Review Missed (${missedCount})`;
      } else {
        reviewBtn.classList.add("hidden");
      }

      summaryCard.classList.remove("hidden");
      summaryCard.scrollIntoView({ behavior: "smooth" });
    }

    /* =========================================================
       EVENT BINDINGS
       ========================================================= */
    document.getElementById("setFullBtn").addEventListener("click", () => {
      setMode = "full";
      document.getElementById("setFullBtn").classList.add("active");
      document.getElementById("setQuickBtn").classList.remove("active");
      startNewSession();
    });

    document.getElementById("setQuickBtn").addEventListener("click", () => {
      setMode = "quick";
      document.getElementById("setQuickBtn").classList.add("active");
      document.getElementById("setFullBtn").classList.remove("active");
      startNewSession();
    });

    document.getElementById("viewListBtn").addEventListener("click", () => {
      viewMode = "list";
      document.getElementById("viewListBtn").classList.add("active");
      document.getElementById("viewCardBtn").classList.remove("active");
      renderQuiz();
    });

    document.getElementById("viewCardBtn").addEventListener("click", () => {
      viewMode = "card";
      document.getElementById("viewCardBtn").classList.add("active");
      document.getElementById("viewListBtn").classList.remove("active");
      renderQuiz();
    });

    document.getElementById("retakeCurrentBtn").addEventListener("click", () => {
      const currentPoolIds = new Set(activeQuestions.map(q => q.id));
      const samePool = questionBank.filter(q => currentPoolIds.has(q.id));
      startNewSession(samePool);
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    document.getElementById("reviewMissedBtn").addEventListener("click", () => {
      startReviewMissedRound();
    });

    document.getElementById("backToMenuBtn").addEventListener("click", () => {
      selectedSubject = "all";
      setMode = "full";
      document.getElementById("setFullBtn").classList.add("active");
      document.getElementById("setQuickBtn").classList.remove("active");
      startNewSession();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    // Boot
    startNewSession();
  </script>
