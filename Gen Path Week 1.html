            padding: 6px 14px;

        }

        .container {

            margin: 0 auto;
            padding: 20px;
        }

        .quiz-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 24px;
            margin-bottom: 24px;

            font-weight: bold;
            text-transform: uppercase;

        }

        .question-text {
            font-size: 1.15rem;
            line-height: 1.5;
            margin-bottom: 18px;
            font-weight: 500;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background-color: #252525;
            color: var(--text-white);
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 6px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover:not([disabled]) {
            background-color: #333333;
            border-color: var(--accent-orange);
        }

        .option-btn.correct {
            background-color: var(--correct-green-bg) !important;
            border-color: var(--correct-green-border) !important;
            color: #fff !important;
        }

        .option-btn.incorrect {
            background-color: var(--incorrect-red-bg) !important;
            border-color: var(--incorrect-red-border) !important;
            color: #fff !important;
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.85;
        }

        .explanation {
            margin-top: 16px;
            padding: 16px;
            background-color: #222222;
            border-left: 4px solid var(--accent-orange);
            border-radius: 4px;
            font-size: 0.95rem;
            line-height: 1.5;
            color: var(--text-dim);
            display: none;
        }

        .explanation strong {
            color: var(--text-white);
        }

        .status-banner {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 12px;
            padding: 6px 12px;
            border-radius: 4px;
            display: inline-block;
        }

        .status-banner.correct {
            background-color: var(--correct-green-bg);
            color: var(--correct-green-border);
            border: 1px solid var(--correct-green-border);
        }

        .status-banner.incorrect {
            background-color: var(--incorrect-red-bg);
            color: var(--incorrect-red-border);
            border: 1px solid var(--incorrect-red-border);
        }

            background-color: var(--card-bg);
            border: 2px solid var(--accent-orange);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            display: none;
            margin-top: 30px;
        }

            font-size: 1.8rem;
            color: var(--accent-orange);
            margin-bottom: 10px;
        }

        .summary-score {
            font-size: 2.5rem;
            font-weight: bold;
            margin: 15px 0;
        }

        .retake-btn {
            background-color: var(--accent-orange);
            color: #000;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 15px;
        }

        .retake-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>

                    "A) Myeloid Tissue: Correct. Active red bone marrow responsible for hematopoiesis is termed myeloid tissue.",
                    "B) Lymphoid Tissue: Incorrect. Lymphoid tissue supports adaptive lymphocyte maturation.",
                    "C) Endothelial Tissue: Incorrect. Endothelium lines the inner surface of blood vessels.",
                    "D) Epithelial Tissue: Incorrect. Epithelia line body cavities and external surfaces."
                ]
            },
            {
                question: "During neutrophil extravasation, which adhesion molecules mediate initial ROLLING vs firm DOCKING (pavementing)?",
                options: ["Selectins (P/E-selectin) mediate rolling; Integrins (ICAM-1) mediate pavementing", "Integrins mediate rolling; Selectins mediate pavementing", "IgA mediates rolling; IgG mediates pavementing", "Histamine mediates rolling; Leukotrienes mediate pavementing"],
                correct: 0,
                explanationText: "Leukocyte recruitment from blood vessels into inflamed tissue requires sequential receptor-mediated adhesive interactions.",
                rationales: [
                    "A) Selectins mediate rolling; Integrins mediate pavementing: Correct. Selectins mediate initial leukocyte rolling, whereas integrins and ICAM-1 mediate firm docking.",
                    "B) Integrins mediate rolling; Selectins mediate pavementing: Incorrect. Reverses the functional roles of selectins and integrins.",
                    "C) IgA mediates rolling; IgG mediates pavementing: Incorrect. Immunoglobulins do not govern vascular adhesion.",
                    "D) Histamine mediates rolling; Leukotrienes mediate pavementing: Incorrect. Vasoactive amines mediate vascular permeability rather than direct endothelial rolling."
                ]
            }
        ];

        let activeQuizData = [];
        let currentScore = 0;
        let answeredCount = 0;

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function renderQuiz() {
            activeQuizData = shuffleArray(JSON.parse(JSON.stringify(originalQuizData)));

            const container = document.getElementById('quiz-container');
            container.innerHTML = '';

            activeQuizData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'quiz-card';
                card.id = `card-${index}`;

                const qNum = document.createElement('div');
                qNum.className = 'question-number';
                qNum.innerText = `Question ${index + 1} of ${activeQuizData.length}`;

                const qText = document.createElement('div');
                qText.className = 'question-text';
                qText.innerText = item.question;

                const optionsGrid = document.createElement('div');
                optionsGrid.className = 'options-grid';

                item.options.forEach((opt, optIdx) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerText = `${String.fromCharCode(65 + optIdx)}. ${opt}`;
                    btn.onclick = () => handleAnswer(index, optIdx);
                    optionsGrid.appendChild(btn);
                });

                const exp = document.createElement('div');
                exp.className = 'explanation';
                exp.id = `exp-${index}`;

                card.appendChild(qNum);
                card.appendChild(qText);
                card.appendChild(optionsGrid);
                card.appendChild(exp);

                container.appendChild(card);
            });

            updateHeader();
        }

        function handleAnswer(qIndex, selectedOpt) {
            const card = document.getElementById(`card-${qIndex}`);
            const buttons = card.querySelectorAll('.option-btn');
            const exp = document.getElementById(`exp-${qIndex}`);
            const correctOpt = activeQuizData[qIndex].correct;

            buttons.forEach(btn => btn.disabled = true);

            let isCorrect = (selectedOpt === correctOpt);
            if (isCorrect) {
                buttons[selectedOpt].classList.add('correct');
                currentScore++;
            } else {
                buttons[selectedOpt].classList.add('incorrect');
                buttons[correctOpt].classList.add('correct');
            }

            const statusClass = isCorrect ? 'correct' : 'incorrect';
            const statusText = isCorrect ? 'Correct!' : 'Incorrect.';

            const rationalesList = activeQuizData[qIndex].rationales.map(r => `• ${r}`).join('<br>');

            exp.innerHTML = `
                <div class="status-banner ${statusClass}">${statusText}</div>
                <div style="margin-bottom: 12px;"><strong>Explanation:</strong> ${activeQuizData[qIndex].explanationText}</div>
                <div><strong>Option Rationale:</strong><br>${rationalesList}</div>
            `;

            exp.style.display = 'block';
            answeredCount++;

            updateHeader();

            if (answeredCount === activeQuizData.length) {
                showSummary();
            }
        }

        function updateHeader() {
            const total = activeQuizData.length;
            const pct = total === 0 ? 0 : Math.round((currentScore / total) * 100);
            document.getElementById('score-display').innerText = `Score: ${currentScore} / ${total} (${pct}%)`;
        }

        function showSummary() {
            const total = activeQuizData.length;
            const pct = Math.round((currentScore / total) * 100);
            const summaryCard = document.getElementById('summary-card');
            const finalScore = document.getElementById('final-score');
            const feedback = document.getElementById('summary-feedback');

            finalScore.innerText = `${pct}%`;

            if (pct >= 90) {
                feedback.innerText = "Mastery demonstrated! Outstanding recall of cellular adaptation, pathology, and immunology concepts.";
            } else if (pct >= 75) {
                feedback.innerText = "Solid job! Review the questions you missed to reinforce high-yield board points.";
            } else {
                feedback.innerText = "Good effort! Consider reviewing lecture notes and retrying the comprehensive assessment.";
            }

            summaryCard.style.display = 'block';
            summaryCard.scrollIntoView({ behavior: 'smooth' });
        }

        function resetQuiz() {
            currentScore = 0;
            answeredCount = 0;
            document.getElementById('summary-card').style.display = 'none';
            renderQuiz();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.onload = renderQuiz;
    </script>
</body>
</html>
