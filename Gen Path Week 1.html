                explanation: "<strong>1. Direct Explanation / Core Takeaway:</strong> Reversible structural and functional modifications enable cells to survive adverse environmental pressures without sustaining permanent damage.<br><br><strong>2. Option-by-Option Rationale Breakdown:</strong><br>• A) Hypertrophy is the increase in number of cells: Incorrect. Hypertrophy is an increase in size.<br>• B) Adaptations to stress allow cells to alter their structure and function to escape injury: Correct. Cellular adaptations are reversible modifications that enable cells to escape injury and maintain homeostasis.<br>• C) Thickening of the left ventricle is an example of anaplasia: Incorrect. LV hypertrophy is an adaptive structural enlargement.<br>• D) Adaptations to stress alter cell structures and functions irreversibly: Incorrect. Physiological adaptations are inherently reversible."
            },
            {
                question: "What is the basic building block of DNA?",
                options: ["Diglyceride", "Amino acid", "Nucleotide", "Enzyme"],
                correct: 2,
                explanation: "<strong>1. Direct Explanation / Core Takeaway:</strong> Nucleic acid macromolecules are assembled from repeating monomeric units composed of a nitrogenous base, pentose sugar, and phosphate group.<br><br><strong>2. Option-by-Option Rationale Breakdown:</strong><br>• A) Diglyceride: Incorrect. Diglycerides are lipid molecules.<br>• B) Amino acid: Incorrect. Amino acids are the building blocks of proteins.<br>• C) Nucleotide: Correct. Nucleotides are the foundational building blocks of DNA, consisting of a nitrogenous base, a sugar, and a phosphate group.<br>• D) Enzyme: Incorrect. Enzymes are functional protein catalysts."
            }
        ];

        let activeQuizData = [];
        let currentScore = 0;
        let answeredCount = 0;

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function renderQuiz() {
            // Deep copy and dynamic Fisher-Yates question shuffle
            activeQuizData = shuffleArray(JSON.parse(JSON.stringify(originalQuizData)));

            const container = document.getElementById('quiz-container');
            container.innerHTML = '';

            activeQuizData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'quiz-card';
                card.id = `card-${index}`;

                const qNum = document.createElement('div');
                qNum.className = 'question-number';
                qNum.innerText = `Question ${index + 1} of ${activeQuizData.length}`;

                const qText = document.createElement('div');
                qText.className = 'question-text';
                qText.innerText = item.question;

                const optionsGrid = document.createElement('div');
                optionsGrid.className = 'options-grid';

                item.options.forEach((opt, optIdx) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerText = `${String.fromCharCode(65 + optIdx)}. ${opt}`;
                    btn.onclick = () => handleAnswer(index, optIdx);
                    optionsGrid.appendChild(btn);
                });

                const exp = document.createElement('div');
                exp.className = 'explanation';
                exp.id = `exp-${index}`;
                
                card.appendChild(qNum);
                card.appendChild(qText);
                card.appendChild(optionsGrid);
                card.appendChild(exp);

                container.appendChild(card);
            });

            updateHeader();
        }

        function handleAnswer(qIndex, selectedOpt) {
            const card = document.getElementById(`card-${qIndex}`);
            const buttons = card.querySelectorAll('.option-btn');
            const exp = document.getElementById(`exp-${qIndex}`);
            const correctOpt = activeQuizData[qIndex].correct;

            // Instant lock-in: Disable all options for this question
            buttons.forEach(btn => btn.disabled = true);

            let isCorrect = (selectedOpt === correctOpt);
            if (isCorrect) {
                buttons[selectedOpt].classList.add('correct');
                currentScore++;
            } else {
                buttons[selectedOpt].classList.add('incorrect');
                buttons[correctOpt].classList.add('correct');
            }

            const statusClass = isCorrect ? 'correct' : 'incorrect';
            const statusText = isCorrect ? 'Correct!' : 'Incorrect.';

            exp.innerHTML = `
                <div class="status-banner ${statusClass}">${statusText}</div>
                <div>${activeQuizData[qIndex].explanation}</div>
            `;

            exp.style.display = 'block';
            answeredCount++;

            updateHeader();

            if (answeredCount === activeQuizData.length) {
                showSummary();
            }
        }

        function updateHeader() {
            const total = activeQuizData.length;
            const pct = total === 0 ? 0 : Math.round((currentScore / total) * 100);
            document.getElementById('score-display').innerText = `Score: ${currentScore} / ${total} (${pct}%)`;
        }

        function showSummary() {
            const total = activeQuizData.length;
            const pct = Math.round((currentScore / total) * 100);
            const summaryCard = document.getElementById('summary-card');
            const finalScore = document.getElementById('final-score');
            const feedback = document.getElementById('summary-feedback');

            finalScore.innerText = `${pct}%`;

            if (pct >= 90) {
                feedback.innerText = "Mastery demonstrated! Outstanding recall of cellular adaptation and general pathology concepts.";
            } else if (pct >= 75) {
                feedback.innerText = "Solid job! Review the questions you missed to reinforce high-yield points.";
            } else {
                feedback.innerText = "Good effort! Consider reviewing Week 1 lecture notes and retrying the assessment.";
            }

            summaryCard.style.display = 'block';
            summaryCard.scrollIntoView({ behavior: 'smooth' });
        }

        function resetQuiz() {
            currentScore = 0;
            answeredCount = 0;
            document.getElementById('summary-card').style.display = 'none';
            renderQuiz();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.onload = renderQuiz;
    </script>
</body>
</html>
