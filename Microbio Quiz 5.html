<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Microbiology: Quiz 1 Material Review</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --primary-accent: #ff9900;
            --accent-hover: #e68a00;
            --correct-color: #10b981;
            --correct-bg: rgba(16, 185, 129, 0.15);
            --correct-border: #10b981;
            --incorrect-color: #ef4444;
            --incorrect-bg: rgba(239, 68, 68, 0.18);
            --incorrect-border: #ef4444;
            --border-color: #333333;
            --shadow-sm: 0 2px 6px rgba(0,0,0,0.5);
            --shadow-md: 0 4px 14px rgba(0,0,0,0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.5;
            padding-bottom: 50px;
        }

        /* Sticky Header */
        .header-sticky {
            position: -webkit-sticky;
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: var(--card-bg);
            border-bottom: 2px solid var(--primary-accent);
            box-shadow: var(--shadow-sm);
        }

        .header-container {
            max-width: 840px;
            margin: 0 auto;
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-hub-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: #262626;
            color: var(--primary-accent);
            text-decoration: none;
            padding: 6px 14px;
            font-size: 0.85rem;
            font-weight: 700;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            transition: all 0.2s ease;
        }

        .nav-hub-btn:hover {
            background-color: #333333;
            border-color: var(--primary-accent);
        }

        .header-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .score-box {
            font-size: 0.95rem;
            font-weight: 700;
            background-color: #262626;
            color: var(--primary-accent);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            white-space: nowrap;
        }

        .progress-bar-container {
            width: 100%;
            height: 5px;
            background-color: #262626;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background-color: var(--primary-accent);
            transition: width 0.3s ease;
        }

        /* Mode Selector Container */
        .mode-container {
            max-width: 840px;
            margin: 22px auto 6px;
            padding: 0 16px;
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .mode-btn {
            background-color: #222222;
            color: #ffffff;
            border: 1px solid var(--border-color);
            padding: 10px 24px;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mode-btn:hover {
            border-color: var(--primary-accent);
        }

        .mode-btn.active {
            background-color: var(--primary-accent);
            color: #000000;
            border-color: var(--primary-accent);
        }

        /* Quiz Container */
        .quiz-container {
            max-width: 840px;
            margin: 18px auto;
            padding: 0 16px;
        }

        .question-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 22px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }

        .question-header {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--primary-accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .question-text {
            font-size: 1.12rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text-primary);
            line-height: 1.45;
        }

        .options-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            width: 100%;
            text-align: left;
            padding: 14px 18px;
            font-size: 0.96rem;
            color: var(--text-primary);
            background-color: #242424;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            line-height: 1.4;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary-accent);
            background-color: #2e2e2e;
        }

        .option-btn:disabled {
            cursor: default;
        }

        .option-btn.correct-choice {
            background-color: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: #ffffff !important;
            font-weight: 600;
        }

        .option-btn.incorrect-choice {
            background-color: var(--incorrect-bg) !important;
            border-color: var(--incorrect-border) !important;
            color: #ffffff !important;
            font-weight: 600;
        }

        .option-btn.dimmed {
            opacity: 0.42;
        }

        /* Structured Explanation Box */
        .explanation-box {
            margin-top: 20px;
            padding: 18px;
            border-radius: 8px;
            font-size: 0.92rem;
            line-height: 1.55;
            display: none;
            background-color: #202020;
            border: 1px solid var(--border-color);
        }

        .explanation-box.visible {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .status-banner {
            font-size: 1.05rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-banner.correct {
            color: var(--correct-color);
        }

        .status-banner.incorrect {
            color: var(--incorrect-color);
        }

        .concept-summary {
            color: #e5e5e5;
            margin-bottom: 14px;
            padding-bottom: 12px;
            border-bottom: 1px solid #333333;
        }

        .rationale-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--primary-accent);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .rationale-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .rationale-item {
            color: #cccccc;
            font-size: 0.88rem;
            line-height: 1.45;
        }

        .rationale-item strong {
            color: #ffffff;
        }

        .citation-tag {
            color: var(--primary-accent);
            font-weight: 600;
            font-size: 0.82rem;
        }

        /* 2-Second Wrong Answer Modal */
        .wrong-popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.75);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease, visibility 0.2s ease;
            pointer-events: none;
        }

        .wrong-popup-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .wrong-popup-card {
            background-color: var(--card-bg);
            border: 2px solid var(--incorrect-color);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.5);
            transform: scale(0.9);
            transition: transform 0.2s ease;
            max-width: 340px;
            width: 90%;
        }

        .wrong-popup-overlay.show .wrong-popup-card {
            transform: scale(1);
        }

        .wrong-popup-img {
            max-width: 100%;
            max-height: 240px;
            border-radius: 8px;
            display: block;
            margin: 0 auto 12px;
            object-fit: cover;
        }

        .wrong-popup-caption {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--incorrect-color);
            letter-spacing: 0.5px;
        }

        /* Summary Card */
        .summary-card {
            background-color: var(--card-bg);
            border-radius: 14px;
            padding: 38px 24px;
            text-align: center;
            box-shadow: var(--shadow-md);
            border: 2px solid var(--primary-accent);
            display: none;
            margin-top: 10px;
        }

        .summary-card.visible {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        .summary-title {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .summary-score {
            font-size: 2.8rem;
            font-weight: 900;
            color: var(--primary-accent);
            margin-bottom: 16px;
        }

        .summary-text {
            font-size: 1.15rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 28px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.5;
        }

        .reset-btn {
            background-color: var(--primary-accent);
            color: #000000;
            border: none;
            padding: 14px 34px;
            font-size: 1.05rem;
            font-weight: 800;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .reset-btn:hover {
            background-color: var(--accent-hover);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .header-title { font-size: 0.95rem; }
            .score-box { font-size: 0.85rem; padding: 5px 10px; }
            .question-card { padding: 18px 16px; }
            .question-text { font-size: 1.02rem; }
            .option-btn { font-size: 0.9rem; padding: 12px 14px; }
        }
    </style>
</head>
<body>

    <!-- Audio Element for Wrong Answer Feedback -->
    <audio id="wrongAudio" src="Wrong-answer.m4a" preload="auto"></audio>

    <!-- 2-Second Wrong Answer Popup Modal -->
    <div class="wrong-popup-overlay" id="wrongPopup">
        <div class="wrong-popup-card">
            <img src="wrong-answer.png" alt="Incorrect" class="wrong-popup-img" onerror="this.onerror=null; this.src='https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3Z0bjJ6bjNscjhybmZsd2Z1ZzJrdWprcWJ3dzBocm5iNjJidXpvdSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/hPPx8yk3Bmqys/giphy.gif';">
            <div class="wrong-popup-caption">INCORRECT</div>
        </div>
    </div>

    <!-- Sticky Navigation & Real-Time Score Tracker -->
    <div class="header-sticky">
        <div class="header-container">
            <div class="header-left">
                <a href="index.html" class="nav-hub-btn">← Hub</a>
                <div class="header-title">Microbio: Quiz 1 Material Review</div>
            </div>
            <div class="score-box" id="scoreDisplay">Score: 0 / 0 (0%)</div>
        </div>
        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progressBar"></div>
        </div>
    </div>

    <!-- Centered Mode Selector Toggle -->
    <div class="mode-container" id="modeSelector">
        <button class="mode-btn active" id="fullQuizBtn" onclick="setMode('full')">Full Quiz</button>
        <button class="mode-btn" id="quickQuizBtn" onclick="setMode('quick')">Quickie (15 Qs)</button>
    </div>

    <!-- Quiz Question Cards Container -->
    <div class="quiz-container" id="quizContainer"></div>

    <!-- Completion Summary Card -->
    <div class="quiz-container">
        <div class="summary-card" id="summaryCard">
            <div class="summary-title">Quiz Completed!</div>
            <div class="summary-score" id="finalScore">0 / 0</div>
            <div class="summary-text" id="summaryFeedback">Performance feedback tier will appear here.</div>
            <button class="reset-btn" onclick="resetQuiz()">Retake Quiz</button>
        </div>
    </div>

    <script>
        const masterQuizData = [
            {
                question: "Which category of bacteria contains all organisms of medical importance to humans?",
                concept: "Bacterial taxonomy divides prokaryotes into Archaea and Eubacteria; only Eubacteria contain human clinical pathogens.",
                options: [
                    { text: "Eubacteria", isCorrect: true, rationale: "Correct! Eubacteria contains all medically significant bacteria that cause human diseases [Lecture 1]." },
                    { text: "Archaea", isCorrect: false, rationale: "Incorrect. Archaea are extremophiles living in harsh habitats and are not known to cause human disease [Lecture 1]." },
                    { text: "Eukaryotes", isCorrect: false, rationale: "Incorrect. Eukaryotes have membrane-bound nuclei and include fungi, protozoa, and humans, not bacteria [Lecture 1]." },
                    { text: "Prions", isCorrect: false, rationale: "Incorrect. Prions are infectious misfolded proteins devoid of nucleic acids, not bacteria [Lecture 1]." }
                ]
            },
            {
                question: "What unit of measurement is specifically used when measuring viruses compared to bacteria?",
                concept: "Microbial dimensions scale from micrometers for cellular organisms down to nanometers for acellular viral particles.",
                options: [
                    { text: "Viruses = Nanometer (nm); Bacteria = Micrometer (μm)", isCorrect: true, rationale: "Correct! Viruses are submicroscopic (10–250 nm), whereas bacteria are measured in micrometers (0.2–5 μm) [Lecture 1]." },
                    { text: "Viruses = Micrometer (μm); Bacteria = Nanometer (nm)", isCorrect: false, rationale: "Incorrect. This reverses the size orders; viruses are orders of magnitude smaller than bacteria [Lecture 1]." },
                    { text: "Both are measured exclusively in millimeters (mm)", isCorrect: false, rationale: "Incorrect. Millimeters measure macroscopic organisms like adult helminths, not microscopic bacteria or viruses [Lecture 1]." },
                    { text: "Viruses = Picometers (pm); Bacteria = Angstroms (Å)", isCorrect: false, rationale: "Incorrect. Picometers and Angstroms measure atomic radii and molecular bonds [Lecture 1]." }
                ]
            },
            {
                question: "What is the typical size range of most bacteria compared to a human Red Blood Cell (RBC)?",
                concept: "Pathogenic bacteria average 0.2–5 μm, making them substantially smaller than human red blood cells (7–10 μm).",
                options: [
                    { text: "Bacteria: 0.2–5 μm; RBC: 7–10 μm", isCorrect: true, rationale: "Correct! Bacteria range from 0.2 to 5 μm, while human erythrocytes average 7 to 10 μm [Lecture 1]." },
                    { text: "Bacteria: 10–25 μm; RBC: 2–5 μm", isCorrect: false, rationale: "Incorrect. Bacteria are smaller than red blood cells, not larger [Lecture 1]." },
                    { text: "Bacteria: 100–200 nm; RBC: 1–2 μm", isCorrect: false, rationale: "Incorrect. 100–200 nm is the viral size scale, and RBCs are 7–10 μm [Lecture 1]." },
                    { text: "Bacteria: 7–10 μm; RBC: 0.2–5 μm", isCorrect: false, rationale: "Incorrect. This reverses their dimensions [Lecture 1]." }
                ]
            },
            {
                question: "Which historical figure disproved spontaneous generation for maggots on decaying meat using open, sealed, and gauze-covered jars?",
                concept: "Francesco Redi in 1668 demonstrated that maggots only appear on meat if flies have direct physical access to lay eggs.",
                options: [
                    { text: "Francesco Redi", isCorrect: true, rationale: "Correct! Francesco Redi (1668) disproved abiogenesis for macroscopic fly larvae using covered and uncovered meat jars [Lecture 1]." },
                    { text: "Louis Pasteur", isCorrect: false, rationale: "Incorrect. Pasteur disproved spontaneous generation for airborne microorganisms two centuries later using swan-necked flasks [Lecture 1]." },
                    { text: "Anton von Leeuwenhoek", isCorrect: false, rationale: "Incorrect. Leeuwenhoek was the pioneer of microscopy who first visualized living microbes [Lecture 1]." },
                    { text: "Robert Koch", isCorrect: false, rationale: "Incorrect. Koch established the germ theory of disease and Koch's postulates [Lecture 1]." }
                ]
            },
            {
                question: "Which scientist definitively disproved abiogenesis for microorganisms using swan-necked (gooseneck) flasks?",
                concept: "Louis Pasteur proved that nutrient broth remains sterile indefinitely unless gravity-deposited airborne dust settles into it.",
                options: [
                    { text: "Louis Pasteur", isCorrect: true, rationale: "Correct! Pasteur used swan-necked flasks to prove airborne microbes, not vital forces, contaminate broth [Lecture 1]." },
                    { text: "Francesco Redi", isCorrect: false, rationale: "Incorrect. Redi experimented with meat jars and fly larvae, not swan-necked flasks [Lecture 1]." },
                    { text: "Anton von Leeuwenhoek", isCorrect: false, rationale: "Incorrect. Leeuwenhoek ground lenses and observed microbes but did not conduct swan-neck experiments [Lecture 1]." },
                    { text: "Robert Hooke", isCorrect: false, rationale: "Incorrect. Hooke coined the term 'cell' while observing cork tissue under an early compound microscope [Lecture 1]." }
                ]
            },
            {
                question: "What is the fundamental biological distinction between Abiogenesis and Biogenesis?",
                concept: "Biogenesis dictates that living organisms arise exclusively from existing living matter, rejecting abiogenesis.",
                options: [
                    { text: "Abiogenesis claims living things arise from non-living matter; Biogenesis dictates living things arise only from pre-existing living cells", isCorrect: true, rationale: "Correct! Abiogenesis was spontaneous generation from non-living matter; biogenesis establishes life only begets life [Lecture 1]." },
                    { text: "Abiogenesis states life comes from pre-existing life; Biogenesis claims life arises from chemical vapors", isCorrect: false, rationale: "Incorrect. This reverses the definitions [Lecture 1]." },
                    { text: "Abiogenesis applies exclusively to viruses; Biogenesis applies exclusively to bacteria", isCorrect: false, rationale: "Incorrect. These were broader theories regarding the biological origin of organisms [Lecture 1]." },
                    { text: "Abiogenesis refers to chemical disinfection; Biogenesis refers to physical autoclaving", isCorrect: false, rationale: "Incorrect. These terms address the origin of living matter, not sterilization protocols [Lecture 1]." }
                ]
            },
            {
                question: "Who was the first person to observe and describe live bacteria and protozoa ('animalcules') using single-lens microscopes?",
                concept: "Anton von Leeuwenhoek hand-crafted single bi-convex lens microscopes with up to 300x magnification to discover living microbes.",
                options: [
                    { text: "Anton von Leeuwenhoek", isCorrect: true, rationale: "Correct! Leeuwenhoek was the first to record observations of living bacteria and protozoa in rain water and dental scrapings [Lecture 1]." },
                    { text: "Louis Pasteur", isCorrect: false, rationale: "Incorrect. Pasteur made his discoveries in fermentation and vaccination in the 19th century [Lecture 1]." },
                    { text: "Robert Koch", isCorrect: false, rationale: "Incorrect. Koch isolated anthrax, tuberculosis, and cholera bacilli in the late 1800s [Lecture 1]." },
                    { text: "Francesco Redi", isCorrect: false, rationale: "Incorrect. Redi investigated macrobiology (fly larvae) without microscopic observation [Lecture 1]." }
                ]
            },
            {
                question: "Which of the following answer choices includes ONLY prokaryotic organisms?",
                concept: "Prokaryotes consist strictly of the domains Eubacteria and Archaea, completely lacking a membrane-bound nucleus.",
                options: [
                    { text: "Eubacteria and Archaea", isCorrect: true, rationale: "Correct! Prokaryota is comprised strictly of Eubacteria and Archaea [Lecture 1]." },
                    { text: "Fungi and Protozoa", isCorrect: false, rationale: "Incorrect. Both fungi and protozoans are eukaryotic cells containing nuclei and organelles [Lecture 1]." },
                    { text: "Viruses and Prions", isCorrect: false, rationale: "Incorrect. Viruses and prions are acellular infectious particles, not cellular organisms [Lecture 1]." },
                    { text: "Algae and Helminths", isCorrect: false, rationale: "Incorrect. Algae are eukaryotic protists/plants and helminths are eukaryotic multicellular animals [Lecture 1]." }
                ]
            },
            {
                question: "What primary structural feature differentiates prokaryotic cells from eukaryotic cells?",
                concept: "Prokaryotes lack a membrane-bound nucleus and membrane-bound organelles; their genome resides freely in the nucleoid.",
                options: [
                    { text: "Prokaryotes lack a membrane-bound nucleus", isCorrect: true, rationale: "Correct! Prokaryotes lack a nuclear membrane; their genome sits directly in the nucleoid region [Lecture 1]." },
                    { text: "Prokaryotes possess membrane-bound organelles", isCorrect: false, rationale: "Incorrect. Eukaryotes possess membrane-bound organelles like mitochondria and ER; prokaryotes lack them [Lecture 1]." },
                    { text: "Eukaryotes lack ribosomes", isCorrect: false, rationale: "Incorrect. Both cell types contain ribosomes for translation (80S in eukaryotes, 70S in prokaryotes) [Lecture 1]." },
                    { text: "Prokaryotes contain linear chromosomes wrapped in histones", isCorrect: false, rationale: "Incorrect. True bacteria have naked circular chromosomes lacking eukaryotic histone proteins [Lecture 1]." }
                ]
            },
            {
                question: "Which lipid component is present in eukaryotic plasma membranes to provide rigidity but is absent in almost all prokaryotes?",
                concept: "Eukaryotes stabilize their plasma membranes with sterols (such as cholesterol); prokaryotes generally do not synthesize sterols.",
                options: [
                    { text: "Sterols (e.g., cholesterol)", isCorrect: true, rationale: "Correct! Eukaryotic membranes contain sterols like cholesterol for mechanical stability; almost all prokaryotes lack sterols [Lecture 1]." },
                    { text: "Phospholipid bilayers", isCorrect: false, rationale: "Incorrect. Both prokaryotic and eukaryotic membranes are structured as phospholipid bilayers [Lecture 1]." },
                    { text: "Integral membrane proteins", isCorrect: false, rationale: "Incorrect. Both cell types rely heavily on integral membrane transport proteins [Lecture 1]." },
                    { text: "Peripheral proteins", isCorrect: false, rationale: "Incorrect. Both prokaryotes and eukaryotes utilize peripheral surface proteins [Lecture 1]." }
                ]
            },
            {
                question: "What is the sedimentation coefficient (Svedberg unit) of prokaryotic cytoplasmic ribosomes compared to eukaryotic cytoplasmic ribosomes?",
                concept: "Prokaryotes possess 70S ribosomes (50S + 30S subunits), while eukaryotic cytoplasmic ribosomes are 80S (60S + 40S subunits).",
                options: [
                    { text: "Prokaryotes = 70S; Eukaryotes = 80S", isCorrect: true, rationale: "Correct! Prokaryotic ribosomes sediment at 70S (50S + 30S), while eukaryotic cytoplasmic ribosomes are 80S (60S + 40S) [Lecture 1]." },
                    { text: "Prokaryotes = 80S; Eukaryotes = 70S", isCorrect: false, rationale: "Incorrect. This reverses the ribosomal sizes [Lecture 1]." },
                    { text: "Prokaryotes = 50S; Eukaryotes = 30S", isCorrect: false, rationale: "Incorrect. 50S and 30S are the individual subunits forming the complete 70S prokaryotic ribosome [Lecture 1]." },
                    { text: "Prokaryotes = 60S; Eukaryotes = 40S", isCorrect: false, rationale: "Incorrect. 60S and 40S are the individual subunits forming the complete 80S eukaryotic ribosome [Lecture 1]." }
                ]
            },
            {
                question: "Which term is defined as the absolute destruction or removal of ALL viable microorganisms, including bacterial endospores and viruses?",
                concept: "Sterilization represents the highest antimicrobial threshold, rendering an object completely free of all viable microbial life forms.",
                options: [
                    { text: "Sterilization", isCorrect: true, rationale: "Correct! Sterilization destroys all viable microbial life, including highly resistant bacterial endospores [Lecture 1]." },
                    { text: "Disinfection", isCorrect: false, rationale: "Incorrect. Disinfection kills vegetative pathogens on inanimate surfaces but fails to reliably kill endospores [Lecture 1]." },
                    { text: "Bacteriostasis", isCorrect: false, rationale: "Incorrect. Bacteriostasis inhibits growth without actually killing the bacterial cells [Lecture 1]." },
                    { text: "Sanitization", isCorrect: false, rationale: "Incorrect. Sanitization reduces microbial populations to safe public health levels via mechanical cleansing [Lecture 1]." }
                ]
            },
            {
                question: "How do bactericidal antimicrobial agents differ from bacteriostatic agents?",
                concept: "Bactericidal agents directly cause irreversible cell death, whereas bacteriostatic agents reversibly arrest cell replication.",
                options: [
                    { text: "Bactericidal agents kill bacteria; bacteriostatic agents inhibit growth without directly killing", isCorrect: true, rationale: "Correct! '-cidal' means killing; '-static' means arresting growth so host defenses can clear the infection [Lecture 1]." },

        let currentMode = 'full'; // 'full' or 'quick'
        let activeQuestions = [];
        let currentAnswers = [];

        // Two-Way Fisher-Yates Shuffle
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('fullQuizBtn').classList.toggle('active', mode === 'full');
            document.getElementById('quickQuizBtn').classList.toggle('active', mode === 'quick');
            initQuizSession();
        }

        function initQuizSession() {
            // Shuffle question order
            let shuffled = shuffleArray(masterQuizData);

            // Quickie mode takes randomized 15 questions
            if (currentMode === 'quick') {
                shuffled = shuffled.slice(0, 15);
            }

            // Shuffle options for each question independently
            activeQuestions = shuffled.map(q => {
                const shuffledOptions = shuffleArray(q.options);
                return {
                    question: q.question,
                    concept: q.concept,
                    options: shuffledOptions
                };
            });

            currentAnswers = new Array(activeQuestions.length).fill(null);
            document.getElementById('summaryCard').classList.remove('visible');
            updateScoreTracker();
            renderQuizCards();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderQuizCards() {
            const container = document.getElementById('quizContainer');
            container.innerHTML = '';

            activeQuestions.forEach((q, qIdx) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `q-card-${qIdx}`;

                let optionsHTML = '';
                q.options.forEach((opt, optIdx) => {
                    const letter = String.fromCharCode(65 + optIdx);
                    optionsHTML += `
                        <button class="option-btn" 
                                id="btn-${qIdx}-${optIdx}" 
                                onclick="handleOptionSelect(${qIdx}, ${optIdx})">
                            <strong>${letter})&nbsp;</strong> ${opt.text}
                        </button>
                    `;
                });

                card.innerHTML = `
                    <div class="question-header">Question ${qIdx + 1} of ${activeQuestions.length}</div>
                    <div class="question-text">${q.question}</div>
                    <div class="options-list">${optionsHTML}</div>
                    <div class="explanation-box" id="exp-${qIdx}"></div>
                `;

                container.appendChild(card);
            });
        }

        function handleOptionSelect(qIdx, selectedOptIdx) {
            if (currentAnswers[qIdx] !== null) return; // Prevent double clicking

            currentAnswers[qIdx] = selectedOptIdx;
            const q = activeQuestions[qIdx];
            const chosenOption = q.options[selectedOptIdx];
            const isCorrect = chosenOption.isCorrect;

            // Audio & Image Feedback for Incorrect Answers
            if (!isCorrect) {
                const audio = document.getElementById('wrongAudio');
                if (audio) {
                    audio.currentTime = 0;
                    audio.play().catch(e => console.log('Audio autoplay prevented:', e));
                }

                const popup = document.getElementById('wrongPopup');
                if (popup) {
                    popup.classList.add('show');
                    setTimeout(() => {
                        popup.classList.remove('show');
                    }, 2000);
                }
            }

            // Lock options and apply styling
            q.options.forEach((opt, optIdx) => {
                const btn = document.getElementById(`btn-${qIdx}-${optIdx}`);
                btn.disabled = true;

                if (opt.isCorrect) {
                    btn.classList.add('correct-choice');
                } else if (optIdx === selectedOptIdx) {
                    btn.classList.add('incorrect-choice');
                } else {
                    btn.classList.add('dimmed');
                }
            });

            // Build Structured Explanation Box
            const expBox = document.getElementById(`exp-${qIdx}`);
            let rationalesHTML = '';
            q.options.forEach((opt, optIdx) => {
                const letter = String.fromCharCode(65 + optIdx);
                rationalesHTML += `
                    <li class="rationale-item">
                        <strong>${letter}) ${opt.text}:</strong> ${opt.rationale}
                    </li>
                `;
            });

            expBox.innerHTML = `
                <div class="status-banner ${isCorrect ? 'correct' : 'incorrect'}">
                    ${isCorrect ? '✓ Correct!' : '✗ Incorrect.'}
                </div>
                <div class="concept-summary">
                    <strong>Core Concept:</strong> ${q.concept}
                </div>
                <div class="rationale-title">Option Rationale:</div>
                <ul class="rationale-list">${rationalesHTML}</ul>
            `;
            expBox.classList.add('visible');

            updateScoreTracker();
        }

        function updateScoreTracker() {
            const answeredCount = currentAnswers.filter(a => a !== null).length;
            const correctCount = currentAnswers.reduce((acc, ans, idx) => {
                if (ans !== null && activeQuestions[idx].options[ans].isCorrect) {
                    return acc + 1;
                }
                return acc;
            }, 0);

            const total = activeQuestions.length;
            const percentage = total > 0 ? Math.round((correctCount / total) * 100) : 0;

            document.getElementById('scoreDisplay').innerText = `Score: ${correctCount} / ${total} (${percentage}%)`;
            document.getElementById('progressBar').style.width = total > 0 ? `${(answeredCount / total) * 100}%` : '0%';

            if (answeredCount === total && total > 0) {
                showCompletionSummary(correctCount, total, percentage);
            }
        }

        function showCompletionSummary(correctCount, total, percentage) {
            const summaryCard = document.getElementById('summaryCard');
            const finalScore = document.getElementById('finalScore');
            const feedback = document.getElementById('summaryFeedback');

            finalScore.innerText = `${correctCount} / ${total} (${percentage}%)`;

            // Completion Feedback Tiers
            if (percentage >= 90) {
                feedback.innerText = "Absolute Gigachad. You drained that test dry.";
            } else if (percentage >= 70) {
                feedback.innerText = "You lasted less than 30 seconds. Time for a rematch.";
            } else {
                feedback.innerText = "You really didn’t fucking know that.";
            }

            summaryCard.classList.add('visible');
            summaryCard.scrollIntoView({ behavior: 'smooth' });
        }

        function resetQuiz() {
            initQuizSession();
        }

        window.onload = initQuizSession;
    </script>
