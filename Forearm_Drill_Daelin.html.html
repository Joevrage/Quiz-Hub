<head>

    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --accent-orange: #ff9900;
            --text-white: #ffffff;
            --text-dim: #b0b0b0;
            --correct-green: #28a745;
            --incorrect-red: #dc3545;
            --border-color: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-white);
            margin: 0;
            padding: 0;
            padding-top: 70px;
            padding-bottom: 40px;
        }

        /* Sticky Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background-color: var(--card-bg);
            border-bottom: 2px solid var(--accent-orange);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .header-title {
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--accent-orange);
        }

        .score-tracker {
            font-size: 1.1rem;
            font-weight: bold;
            background-color: #2a2a2a;
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid var(--accent-orange);
        }

        /* Main Container */
        .quiz-container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
        }

        /* Question Cards */
        .question-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        .question-number {
            color: var(--accent-orange);
            font-size: 0.9rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        /* Options */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .option-btn {
            background-color: #262626;
            color: var(--text-white);
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 6px;
            text-align: left;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
            width: 100%;
            box-sizing: border-box;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #333333;
            border-color: var(--accent-orange);
        }

        .option-btn:disabled {
            cursor: not-allowed;
        }

        .option-btn.correct {
            background-color: var(--correct-green) !important;
            color: #ffffff !important;
            border-color: var(--correct-green) !important;
            font-weight: bold;
        }

        .option-btn.incorrect {
            background-color: var(--incorrect-red) !important;
            color: #ffffff !important;
            border-color: var(--incorrect-red) !important;
        }

        /* Feedback Box */
        .explanation-box {
            margin-top: 15px;
            padding: 12px 15px;
            border-radius: 6px;
            background-color: #222222;
            border-left: 4px solid var(--accent-orange);
            font-size: 0.9rem;
            line-height: 1.5;
            display: none;
        }

        /* Final Results Summary */
        .results-card {
            display: none;
            background-color: var(--card-bg);
            border: 2px solid var(--accent-orange);
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            margin-top: 30px;
        }

        .results-score {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--accent-orange);
            margin: 15px 0;
        }

        .restart-btn {
            background-color: var(--accent-orange);
            color: #000000;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 15px;
            transition: transform 0.1s, background-color 0.2s;
        }

        .restart-btn:hover {
            background-color: #ffaa22;
            transform: scale(1.03);
        }
    </style>
</head>

        let currentScore = 0;
        let answeredCount = 0;

        function renderQuiz() {
            const wrapper = document.getElementById('questions-wrapper');
            wrapper.innerHTML = '';

            quizData.forEach((item, qIndex) => {
                const card = document.createElement('div');
                card.className = 'question-card';

                const qNum = document.createElement('div');
                qNum.className = 'question-number';
                qNum.innerText = `Question ${qIndex + 1} of 60`;
                card.appendChild(qNum);

                const qText = document.createElement('div');
                qText.className = 'question-text';
                qText.innerText = item.q;
                card.appendChild(qText);

                const optionsGrid = document.createElement('div');
                optionsGrid.className = 'options-grid';

                item.options.forEach((optText, oIndex) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerText = optText;
                    btn.id = `q${qIndex}-opt${oIndex}`;
                    btn.onclick = () => selectOption(qIndex, oIndex);
                    optionsGrid.appendChild(btn);
                });

                card.appendChild(optionsGrid);

                const expBox = document.createElement('div');
                expBox.className = 'explanation-box';
                expBox.id = `exp-${qIndex}`;
                card.appendChild(expBox);

                wrapper.appendChild(card);
            });
        }

        function selectOption(qIndex, selectedIndex) {
            const question = quizData[qIndex];
            const expBox = document.getElementById(`exp-${qIndex}`);
            
            question.options.forEach((_, oIndex) => {
                const btn = document.getElementById(`q${qIndex}-opt${oIndex}`);
                btn.disabled = true;
                if (oIndex === question.correct) {
                    btn.classList.add('correct');
                }
            });

            if (selectedIndex === question.correct) {
                currentScore++;
            } else {
                const selectedBtn = document.getElementById(`q${qIndex}-opt${selectedIndex}`);
                selectedBtn.classList.add('incorrect');
            }

            answeredCount++;

            expBox.innerHTML = `<strong>Explanation:</strong> ${question.exp}`;
            expBox.style.display = 'block';

            const percentage = Math.round((currentScore / 60) * 100);
            document.getElementById('score-display').innerText = `Score: ${currentScore} / 60 (${percentage}%)`;

            if (answeredCount === 60) {
                showFinalResults(percentage);
            }
        }

        function showFinalResults(percentage) {
            const resultsCard = document.getElementById('results-wrapper');
            document.getElementById('final-percentage').innerText = `${percentage}%`;
            document.getElementById('final-stats').innerText = `You answered ${currentScore} out of 60 questions correctly.`;

            let feedback = "";
            if (percentage >= 90) {
                feedback = "Mastery demonstrated! Outstanding recall of all forearm muscle origins, insertions, innervations, and actions.";
            } else if (percentage >= 75) {
                feedback = "Great job! Re-review the specific nerve branches (Anterior vs. Posterior Interosseous) to perfect your score.";
            } else {
                feedback = "Good practice run. Go over the deep vs. superficial extensor and flexor tables and retake the drill.";
            }

            document.getElementById('performance-feedback').innerText = feedback;
            resultsCard.style.display = 'block';
            resultsCard.scrollIntoView({ behavior: 'smooth' });
        }

        function resetQuiz() {
            currentScore = 0;
            answeredCount = 0;
            document.getElementById('score-display').innerText = `Score: 0 / 60 (0%)`;
            document.getElementById('results-wrapper').style.display = 'none';
            renderQuiz();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        renderQuiz();
    </script>
