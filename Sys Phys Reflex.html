const QUESTIONS_PER_ATTEMPT=50;
let currentSet=[],round=1,quizMode='full',answers={},popupTimeout=null,quizData=[],score=0,answered=0;
let muted=false;try{muted=localStorage.getItem('stfuErijah')==='1';}catch(e){}
function updateStfuButton(){const b=document.getElementById('stfuBtn');if(!b)return;b.textContent=muted?'Bring Back Erijah':'STFU Erijah';b.classList.toggle('muted',muted);
 if(muted){const a=document.getElementById('wrongAudio');if(a){a.pause();a.currentTime=0;}if(popupTimeout)clearTimeout(popupTimeout);const p=document.getElementById('wrongPopup');if(p)p.classList.add('hidden');}}
function toggleStfu(){muted=!muted;try{localStorage.setItem('stfuErijah',muted?'1':'0');}catch(e){}updateStfuButton();}
function fisherYates(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function updateModeButtons(){document.getElementById('fullQuizBtn').classList.toggle('active',quizMode==='full');document.getElementById('quickQuizBtn').classList.toggle('active',quizMode==='quick');}
function setMode(m){quizMode=m;round=1;updateModeButtons();renderQuiz();}
function updateHeader(){const t=quizData.length,pct=answered?Math.round(score/answered*100):0;
 document.getElementById('answered-display').textContent='Answered '+answered+' / '+t;
 document.getElementById('score-display').textContent='Score: '+score+' / '+answered+' ('+pct+'%)';
 document.getElementById('progress-bar').style.width=(t?answered/t*100:0)+'%';}
function renderQuiz(set){
 const popup=document.getElementById('wrongPopup');if(popup)popup.classList.add('hidden');
 if(set){currentSet=set;}else{const n=(quizMode==='quick')?15:Math.min(QUESTIONS_PER_ATTEMPT,questionBank.length);let pool=[...questionBank];fisherYates(pool);currentSet=pool.slice(0,n);}
 score=0;answered=0;answers={};
 quizData=JSON.parse(JSON.stringify(currentSet));quizData.forEach(q=>fisherYates(q.options));quizData=fisherYates(quizData);
 const c=document.getElementById('quiz-container');c.innerHTML='';
 quizData.forEach((q,qi)=>{const d=document.createElement('div');d.className='card';d.id='card-'+qi;
  d.innerHTML='<div><span class="badge">Q'+(qi+1)+'</span>'+(q.priority?'<span class="badge">HIGH YIELD</span>':'')+'</div><div class="stem">'+q.stem+'</div>'+
  q.options.map((o,oi)=>'<button class="option-btn" onclick="selectOption('+qi+','+oi+')">'+'abcd'[oi]+') '+o.text+'</button>').join('');
  c.appendChild(d);});
 updateHeader();window.scrollTo({top:0});}
function selectOption(qi,oi){
 const q=quizData[qi];if(q._locked)return;q._locked=true;
 const card=document.getElementById('card-'+qi);const buttons=card.querySelectorAll('.option-btn');const isCorrect=q.options[oi].correct;
 buttons.forEach((b,bi)=>{b.disabled=true;if(q.options[bi].correct)b.classList.add('correct');else if(bi===oi)b.classList.add('incorrect');else b.classList.add('dim');});
 q._result=isCorrect;
 if(isCorrect){score++;}else if(!muted){
  const wa=document.getElementById('wrongAudio');if(wa){wa.currentTime=0;wa.play().catch(err=>console.log('Audio play blocked:',err));}
  const p=document.getElementById('wrongPopup');if(p){p.classList.remove('hidden');clearTimeout(popupTimeout);popupTimeout=setTimeout(()=>{p.classList.add('hidden');},2000);}}
 answered++;
 const correctOpt=q.options.find(o=>o.correct);
 const e=document.createElement('div');e.className='expl';
 e.innerHTML='<div class="status '+(isCorrect?'ok':'bad')+'">'+(isCorrect?'Correct!':'Incorrect.')+'</div><div class="core"><b>Core Concept:</b> '+correctOpt.why+'</div><ul>'+
  q.options.map((o,i)=>'<li><b>'+'abcd'[i]+') '+(o.correct?'(Correct) ':'')+'</b>'+o.text+' &mdash; '+o.why+'</li>').join('')+'</ul>';
 card.appendChild(e);updateHeader();
 if(answered===quizData.length)setTimeout(showSummary,400);}
function showSummary(){
 const t=quizData.length,pct=Math.round(score/t*100);
 const msg=pct>=90?'Absolute Gigachad. You drained that test dry.':pct>=70?'You lasted less than 30 seconds. Time for a rematch.':'You really didn\u2019t fucking know that.';
 const q=[0,0,0,0],qt=[0,0,0,0];quizData.forEach(x=>{qt[x.quarter-1]++;if(x._result)q[x.quarter-1]++;});
 const d=document.createElement('div');d.className='card summary';
 d.innerHTML='<h2>'+score+' / '+t+' ('+pct+'%)</h2><p>'+msg+'</p><table><tr><th>Deck Quarter</th><th>Correct</th></tr>'+
  q.map((v,i)=>'<tr><td>Q'+(i+1)+'</td><td>'+v+' / '+qt[i]+'</td></tr>').join('')+'</table>'+
  '<button class="act" onclick="round++;renderQuiz()">Retake Quiz</button><button class="act" onclick="reviewMissed()">Review Missed</button><button class="act" onclick="location.href=\'index.html\'">Back to Main Page</button>';
