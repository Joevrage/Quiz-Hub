<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Biochem 1: Midterm 1 Practice Exam</title>
<style>
  :root {
    --bg-color: #0f0f0f;
    --card-bg: #1a1a1a;
    --card-border: #282828;
    --hub-orange: #ff9900;
    --hub-orange-hover: #ffad33;
    --text-primary: #ffffff;
    --text-muted: #a0a0a0;
    --correct-bg: #14532d;
    --correct-border: #22c55e;
    --wrong-bg: #7f1d1d;
    --wrong-border: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { background-color: var(--bg-color); color: var(--text-primary); padding-bottom: 60px; line-height: 1.5; }

  /* Sticky Top Header */
  header {
    position: sticky; top: 0; z-index: 1000;
    background-color: rgba(26, 26, 26, 0.96);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--card-border);
    padding: 10px 18px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.6);
  }
  .header-content {
    max-width: 900px; margin: 0 auto;
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px;
  }
  .header-title h1 { font-size: 1.05rem; color: var(--hub-orange); font-weight: 800; }
  .header-title p { font-size: 0.78rem; color: var(--text-muted); }
  .header-nav { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .btn {
    background: #242424; color: var(--text-primary); border: 1px solid #3d3d3d;
    padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: 700; cursor: pointer; transition: 0.2s ease;
    white-space: nowrap;
  }
  .btn:hover { background: #333333; border-color: var(--hub-orange); }
  .btn.active { background: var(--hub-orange); color: #000000; border-color: var(--hub-orange); font-weight: 800; }
  .btn.muted-active { background: var(--hub-orange); color: #000000; border-color: var(--hub-orange); }
  
  .pills { display: flex; gap: 8px; font-size: 0.8rem; align-items: center; }
  .pill { background: #141414; padding: 4px 11px; border-radius: 999px; border: 1px solid #333; color: var(--text-muted); font-weight: 600; white-space: nowrap; }
  .pill span { color: var(--hub-orange); font-weight: 800; }
  .pill.score-pill span { color: #ffffff; }
  .pill.score-pill { background: #222; border-color: var(--card-border); }

  .progress-bar-container { width: 100%; height: 4px; background: #222; border-radius: 2px; margin-top: 8px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0%; background: var(--hub-orange); transition: width 0.25s ease; }

  /* Main Container */
  .container { max-width: 900px; margin: 20px auto; padding: 0 16px; }

  /* Dashboard / Home View */
  .dashboard {
    background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px;
    padding: 24px; box-shadow: 0 6px 20px rgba(0,0,0,0.4);
  }
  .dash-title { font-size: 1.45rem; font-weight: 800; color: var(--hub-orange); margin-bottom: 6px; }
  .dash-subtitle { font-size: 0.88rem; color: var(--text-muted); margin-bottom: 22px; }
  .section-label { font-size: 0.86rem; font-weight: 700; color: #ffffff; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.6px; }
  
  .chip-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .chip {
    background: #202020; border: 1px solid #333; color: var(--text-muted);
    padding: 7px 14px; border-radius: 20px; font-size: 0.84rem; font-weight: 600; cursor: pointer; transition: 0.2s;
  }
  .chip:hover { border-color: var(--hub-orange); color: #fff; }
  .chip.active { background: var(--hub-orange); color: #000; font-weight: 700; border-color: var(--hub-orange); }

  .controls-row { display: flex; gap: 8px; margin-bottom: 22px; flex-wrap: wrap; align-items: center; }
  .bank-counter { font-size: 0.95rem; color: var(--hub-orange); margin: 16px 0 12px; font-weight: 700; }
  
  .launcher-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-top: 14px; }
  .launch-btn {
    background: #242424; border: 1px solid #3a3a3a; color: #fff; padding: 13px 10px;
    border-radius: 8px; font-weight: 700; font-size: 0.88rem; cursor: pointer; text-align: center; transition: 0.2s;
  }
  .launch-btn:hover { background: var(--hub-orange); color: #000; border-color: var(--hub-orange); transform: translateY(-2px); }

  /* Question Card */
  .question-card {
    background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px;
    padding: 22px; margin-bottom: 20px; box-shadow: 0 4px 14px rgba(0,0,0,0.3);
  }
  .card-badges { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  .badge { font-size: 0.74rem; padding: 3px 8px; border-radius: 4px; font-weight: 700; text-transform: uppercase; }
  .badge-subject { background: #262626; color: var(--hub-orange); border: 1px solid #3d3d3d; }
  .badge-diff { background: #262626; color: #bbb; border: 1px solid #333; }
  .badge-diff.easy { color: #4ade80; }
  .badge-diff.medium { color: #facc15; }
  .badge-diff.hard { color: #f87171; }
  .badge-priority { background: #7c2d12; color: #fdba74; }
  .badge-num { background: var(--hub-orange); color: #000; }

  .stem { font-size: 1.05rem; font-weight: 600; line-height: 1.48; margin-bottom: 16px; color: var(--text-primary); }
  
  /* Options */
  .options-list { display: flex; flex-direction: column; gap: 9px; margin-bottom: 14px; }
  .option-item {
    background: #222222; border: 1px solid var(--card-border); border-radius: 6px; padding: 12px 15px;
    font-size: 0.95rem; cursor: pointer; transition: 0.15s ease; display: flex; align-items: flex-start; gap: 10px;
    color: var(--text-primary);
  }
  .option-item:hover:not(.locked) { background: #2a2a2a; border-color: var(--hub-orange); }
  .option-item.selected-correct { background: var(--correct-bg) !important; border-color: var(--correct-border) !important; color: #fff; }
  .option-item.selected-wrong { background: var(--wrong-bg) !important; border-color: var(--wrong-border) !important; color: #fff; }
  .option-item.reveal-correct { border-color: var(--correct-border); background: #064e3b; }
  .option-item.dim { opacity: 0.45; }
  .opt-letter { font-weight: 800; min-width: 22px; color: var(--hub-orange); }
  .option-item.selected-correct .opt-letter, .option-item.selected-wrong .opt-letter { color: #fff; }

  /* Feedback & Rationales */
  .feedback-box {
    margin-top: 16px; padding: 14px 16px; border-radius: 8px; background: #141414;
    border: 1px solid var(--card-border); animation: fadeIn 0.2s ease-out;
  }
  .status-banner { font-size: 1.05rem; font-weight: 800; margin-bottom: 6px; }
  .status-banner.correct { color: #4ade80; }
  .status-banner.wrong { color: #ef4444; }
  .ref-line { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 10px; }
  .rationale-title { font-size: 0.82rem; font-weight: 700; color: var(--hub-orange); margin: 10px 0 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  .rationale-item { font-size: 0.88rem; color: #bbb; line-height: 1.42; margin-bottom: 7px; padding-left: 10px; border-left: 3px solid #333; }
  .rationale-item.correct-rat { border-left-color: var(--correct-border); color: #dcfce7; }
  .rationale-item strong { color: #fff; }

  /* Navigation Footer for Single Mode */
  .quiz-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }

  /* Popup */
  .wrong-popup {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    z-index: 2000; pointer-events: none; opacity: 1; transition: opacity 0.3s ease;
    display: flex; justify-content: center; align-items: center;
  }
  .wrong-popup.hidden { opacity: 0; pointer-events: none; }
  .wrong-popup img {
    max-width: 80vw; max-height: 55vh; border-radius: 12px;
    border: 3px solid var(--wrong-border); box-shadow: 0 10px 40px rgba(0,0,0,0.9);
    background: #111; object-fit: contain;
  }

  /* Scorecard */
  .scorecard { background: var(--card-bg); border: 1px solid var(--hub-orange); border-radius: 12px; padding: 32px 24px; text-align: center; }
  .score-num { font-size: 2.8rem; color: var(--hub-orange); font-weight: 800; margin: 12px 0 6px; }
  .score-grade { font-size: 1.15rem; font-weight: 700; margin-bottom: 20px; }
  .score-breakdown { text-align: left; margin: 24px 0; font-size: 0.92rem; }
  .score-breakdown div { margin-bottom: 8px; border-bottom: 1px solid #282828; padding-bottom: 6px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>

  <div class="header-content">
    <div class="header-title">
      <h1>Biochem 1: Midterm 1 Quiz Hub</h1>

    priority: true,
    stem: "A reaction with a negative ΔG is _______ and forms products that are _______.",
    options: [
      { text: "exergonic; lower in energy and more stable", correct: true, why: "Negative ΔG means energy is released (EXO = energy OUT), so products sit at a lower free energy and lower free energy equals greater stability. [Class 1 Notes]" },
      { text: "endergonic; higher in energy and less stable", correct: false, why: "This describes a positive ΔG: energy is put in and stored, raising the products to a higher, less stable state. The sign is inverted. [Class 1 Notes]" },
      { text: "exergonic; higher in energy and less stable", correct: false, why: "The label is right but the energy direction is wrong. An exergonic reaction releases energy, so its products end lower, not higher. [Class 1 Notes]" },
      { text: "endergonic; lower in energy and more stable", correct: false, why: "Endergonic reactions require energy input and give higher-energy products. A drop to lower energy is exergonic. [Class 1 Notes]" }

  {

      { text: "The activation energy and therefore the reaction rate", correct: true, why: "Enzymes provide an alternate pathway with a lower activation-energy barrier. This speeds both the forward and reverse reactions, which is a kinetic effect. [Class 2 Notes]" },
      { text: "The free-energy change (ΔG) between reactants and products", correct: false, why: "ΔG is a thermodynamic property of the start and end states. Enzymes cannot change it. [Class 2 Notes]" },

  },
  {
    id: 3,
    subjectIndex: 0,
    week: "Week 1",
    slideRef: "Class 1 Notes",
    difficulty: "medium",
    priority: false,
    stem: "When liquid water vaporizes, which interactions are disrupted?",
    options: [
      { text: "Hydrogen bonds between neighboring water molecules", correct: true, why: "Vaporization frees each molecule from the hydrogen-bonded liquid network, which is an intermolecular change. The H₂O molecule stays intact. [Class 1 Notes]" },
      { text: "Covalent O–H bonds inside each water molecule", correct: false, why: "A phase change does not break the covalent O–H bonds. Vapor is still H₂O, just no longer linked to other water molecules. [Class 1 Notes]" },

    priority: false,
    stem: "In the hydration cage around an H⁺ ion, water molecules point their _______ toward the ion.",

      { text: "oxygen and hydrogen ends in equal numbers", correct: false, why: "Orientation is not random or balanced. Electrostatic attraction lines up the negative oxygen side toward the cation. [Class 2 Notes]" },

  {

    options: [
      { text: "1.0", correct: false, why: "A bond order of 1.0 would mean pure single bonds. Resonance shares double-bond character across both C–O bonds. [Class 2 Notes]" },
      { text: "1.5", correct: true, why: "Two equivalent Lewis structures spread one π bond over two C–O bonds, giving an average bond order of about 1.5. [Class 2 Notes]" },
      { text: "2.0", correct: false, why: "A bond order of 2.0 would mean both bonds are full double bonds. Acetate has only one π bond shared across both C–O bonds. [Class 2 Notes]" },
      { text: "3.0", correct: false, why: "A triple bond (such as N₂) has one σ and two π bonds. Acetate's C–O bonds have nothing like that. [Class 2 Notes]" }

  {

/* -------------------------------------------------------------
   STATE & PERSISTENCE
   ------------------------------------------------------------- */
let hist = {};
try { hist = JSON.parse(localStorage.getItem('biochem1_missed_history') || '{}'); } catch (e) {}
const saveHistory = () => { try { localStorage.setItem('biochem1_missed_history', JSON.stringify(hist)); } catch (e) {} };

let selectedSubjects = new Set(SUBJECTS.map((_, i) => i));
let prioritizeMissed = false;
let quizQuestions = [], userAnswers = [], currentIndex = 0, score = 0, popupTimeout = null;
let viewMode = 'single'; // 'single' | 'all'
let muted = false;

try { muted = localStorage.getItem('stfuErijah') === '1'; } catch (e) {}
try { viewMode = localStorage.getItem('quizViewMode') || 'single'; } catch (e) {}

const $ = id => document.getElementById(id);

function updateErijahButton() {
  const b = $('stfuBtn');
  if (!b) return;
  b.textContent = muted ? 'Bring Back Erijah' : 'STFU Erijah';
  b.classList.toggle('muted-active', muted);
  if (muted) {
    const a = $('wrongAudio');
    if (a) { a.pause(); a.currentTime = 0; }
    if (popupTimeout) clearTimeout(popupTimeout);
    const p = $('wrongPopup');
    if (p) p.classList.add('hidden');
  }
}

function toggleErijah() {
  muted = !muted;
  try { localStorage.setItem('stfuErijah', muted ? '1' : '0'); } catch (e) {}
  updateErijahButton();
}

function updateModeButton() {
  const b = $('modeBtn');
  if (!b) return;
  b.textContent = viewMode === 'all' ? 'View: All at Once' : 'View: One by One';
  b.classList.toggle('active', viewMode === 'all');
}

function toggleMode() {
  viewMode = viewMode === 'all' ? 'single' : 'all';
  try { localStorage.setItem('quizViewMode', viewMode); } catch (e) {}
  updateModeButton();
  if (quizQuestions.length > 0) renderActiveQuiz();
  else renderHome();
}

function renderActiveQuiz() {
  if (viewMode === 'all') renderAllQuestions();
  else renderQuestion();
}

/* -------------------------------------------------------------
   HOME DASHBOARD & FILTERING
   ------------------------------------------------------------- */
function renderHome() {
  $('quizHeader').style.display = 'block';
  updateModeButton();
  updateErijahButton();
  $('progressPill').innerHTML = `Q: <span>0/0</span>`;
  $('scorePill').innerHTML = `Score: <span>0/0 (0%)</span>`;
  $('progressFill').style.width = '0%';

  const totalMissedCount = Object.keys(hist).filter(id => hist[id] > 0).length;

  let chipsHtml = SUBJECTS.map((sub, idx) => {
    const count = questionBank.filter(q => q.subjectIndex === idx).length;
    const isActive = selectedSubjects.has(idx) ? 'active' : '';
    return `<div class="chip ${isActive}" onclick="toggleSubject(${idx})">[${sub.week}] ${sub.title} (${count})</div>`;
  }).join('');

  let filteredPool = getFilteredQuestions();

  $('mainContainer').innerHTML = `
    <div class="dashboard">
      <div class="dash-title">Biochem 1 Midterm 1 Practice Hub</div>
      <div class="dash-subtitle">Intermolecular forces &middot; Acid–base, pKa &amp; titration &middot; Genetic code &middot; Nucleotides &amp; HMP &middot; Specialized products</div>
      
      <div class="section-label">Select Topics for Review</div>
      <div class="chip-grid">${chipsHtml}</div>
      
      <div class="controls-row">
        <button class="btn" onclick="selectAllSubjects(true)">Select All</button>
        <button class="btn" onclick="selectAllSubjects(false)">Clear</button>
        <button class="btn ${prioritizeMissed ? 'active' : ''}" onclick="togglePrioritizeMissed()">Prioritize Missed (${totalMissedCount})</button>
        <button class="btn ${viewMode === 'all' ? 'active' : ''}" onclick="toggleModeFromDash()">${viewMode === 'all' ? 'Mode: All at Once' : 'Mode: One by One'}</button>
      </div>

      <div class="bank-counter">
        Active Pool: ${filteredPool.length} questions available across ${selectedSubjects.size} topics
      </div>

      <div class="section-label">Launch Practice Exam</div>
      <div class="launcher-grid">
        <button class="launch-btn" onclick="startQuiz(10)">Quickie (10 Qs)</button>
        <button class="launch-btn" onclick="startQuiz(25)">Quickie (25 Qs)</button>
        <button class="launch-btn" onclick="startQuiz(35)">Quickie (35 Qs)</button>
        <button class="launch-btn" onclick="startQuiz(filteredPool.length)">Entire Bank (${filteredPool.length} Qs)</button>
      </div>
    </div>
  `;
}

function toggleModeFromDash() {
  toggleMode();
  renderHome();
}

function toggleSubject(idx) {
  if (selectedSubjects.has(idx)) {
    if (selectedSubjects.size > 1) selectedSubjects.delete(idx);
  } else {
    selectedSubjects.add(idx);
  }
  renderHome();
}

function selectAllSubjects(all) {
  if (all) selectedSubjects = new Set(SUBJECTS.map((_, i) => i));
  else selectedSubjects = new Set([0]);
  renderHome();
}

function togglePrioritizeMissed() {
  prioritizeMissed = !prioritizeMissed;
  renderHome();
}

function getFilteredQuestions() {
  let pool = questionBank.filter(q => selectedSubjects.has(q.subjectIndex));
  if (prioritizeMissed) {
    const missed = pool.filter(q => (hist[q.id] || 0) > 0);
    if (missed.length > 0) return missed;
  }
  return pool;
}

function shuffle(array) {
  let arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function startQuiz(limit) {
  let pool = getFilteredQuestions();
  if (pool.length === 0) {
    alert("Please select at least one topic with available questions.");
    return;
  }
  pool = shuffle(pool);
  quizQuestions = pool.slice(0, Math.min(limit, pool.length));
  userAnswers = new Array(quizQuestions.length).fill(null);
  currentIndex = 0;
  score = 0;
  renderActiveQuiz();
}

/* -------------------------------------------------------------
   FEEDBACK POPUP & SOUND
   ------------------------------------------------------------- */
function triggerWrongFeedback() {
  if (muted) return;
  const audio = $('wrongAudio');
  if (audio) {
    audio.currentTime = 0;
    audio.play().catch(() => {});
  }
  const popup = $('wrongPopup');
  if (popup) {
    popup.classList.remove('hidden');
    if (popupTimeout) clearTimeout(popupTimeout);
    popupTimeout = setTimeout(() => {
      popup.classList.add('hidden');
    }, 1200);
  }
}

/* -------------------------------------------------------------
   MODE A: ONE BY ONE (Flashcard / Card View)
   ------------------------------------------------------------- */
function renderQuestion() {
  if (currentIndex >= quizQuestions.length) {
    renderScorecard();
    return;
  }
  const q = quizQuestions[currentIndex];
  const answered = userAnswers[currentIndex] !== null;
  const sub = SUBJECTS[q.subjectIndex];

  $('progressPill').innerHTML = `Question: <span>${currentIndex + 1} of ${quizQuestions.length}</span>`;
  const answeredCount = userAnswers.filter(a => a !== null).length;
  const pct = answeredCount > 0 ? Math.round((score / answeredCount) * 100) : 0;
  $('scorePill').innerHTML = `Score: <span>${score}/${answeredCount} (${pct}%)</span>`;
  $('progressFill').style.width = `${((currentIndex) / quizQuestions.length) * 100}%`;

  let optionsHtml = q.options.map((opt, i) => {
    let classes = ['option-item'];
    let letter = String.fromCharCode(65 + i);
    if (answered) {
      classes.push('locked');
      if (opt.correct) classes.push('reveal-correct');
      if (userAnswers[currentIndex] === i) {
        classes.push(opt.correct ? 'selected-correct' : 'selected-wrong');
      } else {
        classes.push('dim');
      }
    }
    const clickHandler = !answered ? `onclick="handleOptionClick(${i})"` : '';
    return `
      <div class="${classes.join(' ')}" ${clickHandler}>
        <span class="opt-letter">${letter}.</span>
        <span>${opt.text}</span>
      </div>
    `;
  }).join('');

  let feedbackHtml = '';
  if (answered) {
    const isCorrect = q.options[userAnswers[currentIndex]].correct;
    const rationales = q.options.map((opt, i) => {
      const letter = String.fromCharCode(65 + i);
      const isCor = opt.correct;
      return `<div class="rationale-item ${isCor ? 'correct-rat' : ''}"><strong>${letter}:</strong> ${opt.why}</div>`;
    }).join('');

    feedbackHtml = `
      <div class="feedback-box">
        <div class="status-banner ${isCorrect ? 'correct' : 'wrong'}">
          ${isCorrect ? '✓ Correct!' : '✗ Incorrect.'}
        </div>
        <div class="ref-line">Reference: [${sub.week}], ${q.slideRef}</div>
        <div class="rationale-title">Option Breakdown</div>
        ${rationales}
      </div>
    `;
  }

  let nextBtnText = currentIndex === quizQuestions.length - 1 ? 'Finish Exam' : 'Next Question';
  let nextBtnHtml = answered ? `<button class="btn active" onclick="nextQuestion()">${nextBtnText}</button>` : '';

  $('mainContainer').innerHTML = `
    <div class="question-card">
      <div class="card-badges">
        <span class="badge badge-num">Q${currentIndex + 1}</span>
        <span class="badge badge-subject">[${sub.week}] ${sub.title}</span>
        <span class="badge badge-diff ${q.difficulty}">${q.difficulty}</span>
        ${q.priority ? '<span class="badge badge-priority">High Yield</span>' : ''}
        <span class="badge badge-diff">${q.slideRef}</span>
      </div>
      <div class="stem">${q.stem}</div>
      <div class="options-list">${optionsHtml}</div>
      ${feedbackHtml}
      <div class="quiz-footer">${nextBtnHtml}</div>
    </div>
  `;
}

function handleOptionClick(optionIdx) {
  if (userAnswers[currentIndex] !== null) return;
  const q = quizQuestions[currentIndex];
  userAnswers[currentIndex] = optionIdx;
  const isCorrect = q.options[optionIdx].correct;

  if (isCorrect) {
    score++;
    if (hist[q.id]) {
      hist[q.id] = Math.max(0, hist[q.id] - 1);
      saveHistory();
    }
  } else {
    hist[q.id] = (hist[q.id] || 0) + 1;
    saveHistory();
    triggerWrongFeedback();
  }
  renderQuestion();
}

function nextQuestion() {
  currentIndex++;
  renderQuestion();
}

/* -------------------------------------------------------------
   MODE B: ALL AT ONCE (Continuous Scrolling View)
   ------------------------------------------------------------- */
function renderAllQuestions() {
  const total = quizQuestions.length;
  const answeredCount = userAnswers.filter(a => a !== null).length;
  const pct = answeredCount > 0 ? Math.round((score / answeredCount) * 100) : 0;
  $('progressPill').innerHTML = `Answered: <span>${answeredCount} of ${total}</span>`;
  $('scorePill').innerHTML = `Score: <span>${score}/${answeredCount} (${pct}%)</span>`;
  $('progressFill').style.width = `${(answeredCount / total) * 100}%`;

  let cardsHtml = quizQuestions.map((q, qIndex) => {
    const answered = userAnswers[qIndex] !== null;
    const sub = SUBJECTS[q.subjectIndex];

    let optionsHtml = q.options.map((opt, i) => {
      let classes = ['option-item'];
      let letter = String.fromCharCode(65 + i);
      if (answered) {
        classes.push('locked');
        if (opt.correct) classes.push('reveal-correct');
        if (userAnswers[qIndex] === i) {
          classes.push(opt.correct ? 'selected-correct' : 'selected-wrong');
        } else {
          classes.push('dim');
        }
      }
      const clickHandler = !answered ? `onclick="handleAllModeSelect(${qIndex}, ${i})"` : '';
      return `
        <div class="${classes.join(' ')}" ${clickHandler}>
          <span class="opt-letter">${letter}.</span>
          <span>${opt.text}</span>
        </div>
      `;
    }).join('');

    let feedbackHtml = '';
    if (answered) {
      const isCorrect = q.options[userAnswers[qIndex]].correct;
      const rationales = q.options.map((opt, i) => {
        const letter = String.fromCharCode(65 + i);
        return `<div class="rationale-item ${opt.correct ? 'correct-rat' : ''}"><strong>${letter}:</strong> ${opt.why}</div>`;
      }).join('');

      feedbackHtml = `
        <div class="feedback-box">
          <div class="status-banner ${isCorrect ? 'correct' : 'wrong'}">
            ${isCorrect ? '✓ Correct!' : '✗ Incorrect.'}
          </div>
          <div class="ref-line">Reference: [${sub.week}], ${q.slideRef}</div>
          <div class="rationale-title">Option Breakdown</div>
          ${rationales}
        </div>
      `;
    }

    return `
      <div class="question-card" id="card-${qIndex}">
        <div class="card-badges">
          <span class="badge badge-num">Q${qIndex + 1}</span>
          <span class="badge badge-subject">[${sub.week}] ${sub.title}</span>
          <span class="badge badge-diff ${q.difficulty}">${q.difficulty}</span>
          ${q.priority ? '<span class="badge badge-priority">High Yield</span>' : ''}
          <span class="badge badge-diff">${q.slideRef}</span>
        </div>
        <div class="stem">${q.stem}</div>
        <div class="options-list">${optionsHtml}</div>
        ${feedbackHtml}
      </div>
    `;
  }).join('');

  let finishBtn = answeredCount === total
    ? `<div style="text-align: center; margin: 30px 0;"><button class="btn active" style="padding: 12px 28px; font-size: 1rem;" onclick="renderScorecard()">View Final Results Summary</button></div>`
    : '';

  $('mainContainer').innerHTML = cardsHtml + finishBtn;
}

function handleAllModeSelect(qIndex, optIndex) {
  if (userAnswers[qIndex] !== null) return;
  const q = quizQuestions[qIndex];
  userAnswers[qIndex] = optIndex;
  const isCorrect = q.options[optIndex].correct;

  if (isCorrect) {
    score++;
    if (hist[q.id]) {
      hist[q.id] = Math.max(0, hist[q.id] - 1);
      saveHistory();
    }
  } else {
    hist[q.id] = (hist[q.id] || 0) + 1;
    saveHistory();
    triggerWrongFeedback();
  }
  renderAllQuestions();
}

/* -------------------------------------------------------------
   SCORECARD & RESULTS
   ------------------------------------------------------------- */
function renderScorecard() {
  const total = quizQuestions.length;
  const pct = Math.round((score / total) * 100);

  let subBreakdown = {};
  quizQuestions.forEach((q, idx) => {
    if (!subBreakdown[q.subjectIndex]) subBreakdown[q.subjectIndex] = { total: 0, correct: 0 };
    subBreakdown[q.subjectIndex].total++;
    if (userAnswers[idx] !== null && q.options[userAnswers[idx]].correct) {
      subBreakdown[q.subjectIndex].correct++;
    }
  });

  let breakdownHtml = Object.keys(subBreakdown).map(sIdx => {
    const s = SUBJECTS[sIdx];
    const item = subBreakdown[sIdx];
    const sPct = Math.round((item.correct / item.total) * 100);
    return `<div><strong>[${s.week}] ${s.title}:</strong> ${item.correct}/${item.total} (${sPct}%)</div>`;
  }).join('');

  let feedbackMsg = '';
  if (pct >= 90) {
    feedbackMsg = 'Absolute Gigachad. You drained that test dry.';
  } else if (pct >= 75) {
    feedbackMsg = 'Solid passing score! Keep reviewing missed concepts.';
  } else {
    feedbackMsg = 'Needs remediation. Review ionization curves, pKa rules, and metabolic cofactors.';
  }

  $('mainContainer').innerHTML = `
    <div class="scorecard">
      <div class="dash-title">Exam Complete!</div>
      <div class="score-num">${score} / ${total}</div>
      <div class="score-grade" style="color: ${pct >= 75 ? '#4ade80' : '#ef4444'};">
        ${pct}% &middot; ${pct >= 75 ? 'Passing Grade (Board Ready)' : 'Needs Remediation'}
      </div>
      <p style="color: var(--text-muted); margin-bottom: 20px;">${feedbackMsg}</p>
      <div class="score-breakdown">
        <div style="font-weight: 800; margin-bottom: 12px; color: var(--hub-orange);">Subject Performance:</div>
        ${breakdownHtml}
      </div>
      <button class="btn active" style="padding: 10px 24px;" onclick="renderHome()">Return to Topic Dashboard</button>
    </div>
  `;
}

// Initial Boot
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', renderHome);
} else {
  renderHome();
}
</script>
</body>
</html>
