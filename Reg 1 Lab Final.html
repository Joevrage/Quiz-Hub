<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Regional Anatomy I - Lower Extremity Lab Final</title>
    <style>
        :root {
            --bg: #0f0f0f;
            --surface: #1a1a1a;
            --surface-hover: #242424;
            --border: #2e2e2e;
            --text: #f5f5f5;
            --muted: #a3a3a3;
            --accent: #ff9900;
            --accent-dim: rgba(255, 153, 0, 0.15);
            --green: #22c55e;
            --green-bg: rgba(34, 197, 94, 0.14);
            --red: #ef4444;
            --red-bg: rgba(239, 68, 68, 0.14);
            --yellow: #eab308;
            --yellow-bg: rgba(234, 179, 8, 0.16);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            padding-bottom: 60px;
        }

        /* Sticky Header */
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: var(--surface);
            border-bottom: 2px solid var(--accent);
            padding: 12px 18px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.65);
        }

        .title-block h1 {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .title-block span {
            display: block;
            font-size: 0.8rem;
            color: var(--muted);
            margin-top: 2px;
        }

        .stats-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .hub-link {
            background-color: var(--surface-hover);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 0.82rem;
            font-weight: 700;
            text-decoration: none;
            transition: border-color 0.2s, color 0.2s;
        }

        .hub-link:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        #stfuBtn {
            background-color: var(--surface-hover);
            color: var(--text);
            border: 1px solid var(--accent);
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }

        #stfuBtn.muted {
            background-color: var(--accent);
            color: #000000;
        }

        .score-pill {
            background-color: var(--accent-dim);
            border: 1px solid var(--accent);
            color: var(--accent);
            font-weight: 800;
            font-size: 0.86rem;
            padding: 6px 14px;
            border-radius: 999px;
            white-space: nowrap;
        }

        /* Single-Row Filter & Action Toolbar */
        .controls {
            max-width: 960px;
            margin: 16px auto 0 auto;
            padding: 12px 16px;
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }

        .controls select,
        .controls button {
            background-color: var(--surface-hover);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 7px 11px;
            font-size: 0.83rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: border-color 0.15s, background-color 0.15s;
        }

        .controls select:hover,
        .controls button:hover {
            border-color: var(--accent);
        }

        .controls button.primary {
            background-color: var(--accent);
            color: #000000;
            border-color: var(--accent);
        }

        .controls button.primary:hover {
            opacity: 0.9;
        }

        /* Main Container */
        .container {
            max-width: 960px;
            margin: 16px auto;
            padding: 0 12px;
        }

        /* Question Card */
        .q-card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 18px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
            font-size: 0.8rem;
            color: var(--muted);
            font-weight: 700;
        }

        .region-tag {
            background-color: var(--accent-dim);
            color: var(--accent);
            border: 1px solid rgba(255, 153, 0, 0.35);
            padding: 2px 9px;
            border-radius: 4px;
            font-size: 0.76rem;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .image-wrapper {
            background: #000000;
            border-radius: 8px;
            padding: 8px;
            text-align: center;
            margin-bottom: 14px;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 200px;
        }

        .img-error-box {
            color: var(--red);
            background: var(--red-bg);
            border: 1px dashed var(--red);
            padding: 14px;
            border-radius: 6px;
            font-size: 0.86rem;
        }

        .q-stem {
            font-size: 1.04rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 14px;
        }

        /* Mode A: Multiple Choice Buttons */
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .opt-btn {
            width: 100%;
            text-align: left;
            background-color: var(--surface-hover);
            color: var(--text);
            border: 1.5px solid var(--border);
            border-radius: 7px;
            padding: 11px 14px;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            transition: border-color 0.15s, background-color 0.15s;
        }

        .opt-btn .opt-letter {
            color: var(--accent);
            font-weight: 800;
            min-width: 20px;
        }

        .opt-btn:hover:not(:disabled) {
            border-color: var(--accent);
            background-color: #2c2c2c;
        }

        .opt-btn:disabled {
            cursor: default;
        }

        .opt-btn.correct {
            background-color: var(--green-bg) !important;
            border-color: var(--green) !important;
            color: #ffffff !important;
        }

        .opt-btn.correct .opt-letter {
            color: var(--green) !important;
        }

        .opt-btn.incorrect {
            background-color: var(--red-bg) !important;
            border-color: var(--red) !important;
            color: #ffffff !important;
        }

        .opt-btn.incorrect .opt-letter {
            color: var(--red) !important;
        }

        /* Mode B: Type-In Input */
        .typein-row {
            display: flex;
            gap: 8px;
        }

        .typein-input {
            flex: 1;
            background-color: var(--surface-hover);
            color: var(--text);
            border: 1.5px solid var(--border);
            border-radius: 7px;
            padding: 11px 14px;
            font-size: 0.98rem;
            font-family: inherit;
            outline: none;
        }

        .typein-input:focus {
            border-color: var(--accent);
        }

        .typein-input:disabled {
            opacity: 0.75;
            cursor: not-allowed;
        }

        .typein-submit {
            background-color: var(--accent);
            color: #000000;
            border: none;
            border-radius: 7px;
            padding: 0 20px;
            font-weight: 800;
            font-size: 0.92rem;
            cursor: pointer;
            font-family: inherit;
        }

        .typein-submit:disabled {
            background-color: #3a3a3a;
            color: #888888;
            cursor: not-allowed;
        }

        .spell-warning {
            margin-top: 9px;
            padding: 10px 14px;
            background-color: var(--yellow-bg);
            border: 1px solid var(--yellow);
            color: #fef08a;
            border-radius: 6px;
            font-size: 0.88rem;
            font-weight: 700;
        }

        /* Rationale Box */
        .rationale-box {
            margin-top: 14px;
            padding: 14px;
            background-color: #141414;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.88rem;
        }

        .rationale-status {
            font-weight: 800;
            font-size: 0.96rem;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .rationale-status.is-right {
            color: var(--green);
        }

        .rationale-status.is-wrong {
            color: var(--red);
        }

        .rationale-item {
            padding: 6px 10px;
            margin-bottom: 6px;
            border-radius: 5px;
            border-left: 3px solid transparent;
        }

        .rationale-item.is-right {
            background-color: var(--green-bg);
            border-left-color: var(--green);
            color: #dcfce7;
        }

        .rationale-item.is-wrong {
            background-color: var(--red-bg);
            border-left-color: var(--red);
            color: #fee2e2;
        }

        /* One-by-One Navigation Bar */
        .one-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 16px;
            margin-top: 12px;
        }

        .one-nav button {
            background-color: var(--surface-hover);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 7px 14px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            font-family: inherit;
        }

        .one-nav button:hover:not(:disabled) {
            border-color: var(--accent);
            color: var(--accent);
        }

        .one-nav button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .one-nav span {
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--muted);
        }

        /* Wrong Popup */
        .wrong-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2500;
            pointer-events: none;
            animation: popIn 0.15s ease-out;
        }

        .wrong-popup img {
            max-width: 80vw;
            max-height: 55vh;
            border-radius: 12px;
            border: 3px solid var(--red);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.9);
            background: #111111;
        }

        .hidden {
            display: none !important;
        }

        @keyframes popIn {
            from { transform: translate(-50%, -50%) scale(0.85); opacity: 0; }
            to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<audio id="wrongAudio" preload="auto">
    <source src="Wrong-answer.m4a" type="audio/mp4">
    <source src="Wrong-answer.mp3" type="audio/mpeg">
</audio>

<div id="wrongPopup" class="wrong-popup hidden">
    <img id="wrongImage" src="Erijah.png" onerror="this.onerror=null;this.src='wrong-answer.png';" alt="Wrong Answer">
</div>

<header>
    <div class="title-block">
        <h1>Regional Anatomy I — Lower Extremity Lab Final</h1>
        <span>Weeks 6–8: Gluteal, Thigh, Knee, Leg, Ankle &amp; Plantar Foot Layers</span>
    </div>
    <div class="stats-bar">
        <a href="index.html" class="hub-link">← Main Page</a>
        <button id="stfuBtn">STFU Erijah</button>
        <div class="score-pill" id="scorePill">Score: 0 / 0 (0%)</div>
    </div>
</header>

<div class="controls">
    <select id="weekFilter">
        <option value="all">All Weeks</option>
    </select>
    <select id="regionFilter">
        <option value="all">All Regions</option>
    </select>
    <select id="lengthFilter">
        <option value="all">Length: Chafing (All)</option>
        <option value="15">Length: Quickie (15 Qs)</option>
        <option value="25">Length: Foreplay (25 Qs)</option>
        <option value="35">Length: Play (35 Qs)</option>
        <option value="50">Length: Marathon (50 Qs)</option>
        <option value="100">Length: Sweat (100 Qs)</option>
    </select>
    <button id="formatToggle">Format: Multiple Choice</button>
    <button id="viewToggle">View: All at Once</button>
    <button id="shuffleBtn">Shuffle Questions</button>
    <button id="resetBtn" class="primary">Reset Quiz</button>
</div>

<div class="container" id="quizContainer"></div>

<script>
    const REGIONS = [
        "Gluteal & Hip Rotators",
        "Anterior & Medial Thigh",
        "Posterior Thigh & Knee",
        "Lower Leg Compartments",
        "Foot & Plantar Layers",
        "Neurovascular & Spaces"
    ];

    const imageBank = [
        // ==================== WEEK 6 (39 ITEMS) ====================
        {
            id: 1,
            week: 6,
            regionIndex: 1,
            image: "Adductor brevis.png",
            priority: true,
            accepted: ["adductor brevis", "adductor brevis muscle"],
            stem: "Identify the highlighted deep medial compartment muscle in the anatomical diagram above:",
            options: [
                { text: "Adductor brevis", correct: true, why: "Originates from the body and inferior ramus of the pubis to insert on the pectineal line and proximal linea aspera; separates the anterior and posterior divisions of the obturator nerve. [Week 6 • Lab Hit List]" },
                { text: "Adductor longus", correct: false, why: "Lies anteriorly in the superficial adductor layer and forms the medial boundary of the femoral triangle. [Week 6 • Slide/Transcript]" },
                { text: "Pectineus", correct: false, why: "Forms the medial floor of the femoral triangle superior to adductor brevis and attaches to the pectineal line of the femur. [Week 6 • Slide/Transcript]" },
                { text: "Adductor magnus", correct: false, why: "Large triangular muscle located posterior to adductor brevis containing the adductor hiatus. [Week 6 • Slide/Transcript]" }
            ]
        },
        {
            id: 2,
            week: 6,
            regionIndex: 5,
            image: "Adductor Canal.png",
            priority: true,
            accepted: ["adductor canal", "hunters canal", "hunter's canal", "subsartorial canal"],
            stem: "Identify the highlighted neurovascular passageway deep to the sartorius in the anatomical diagram above:",
            options: [
                { text: "Adductor canal", correct: true, why: "Subsartorial tunnel (Hunter's canal) extending from the apex of the femoral triangle to the adductor hiatus; transmits the femoral artery, femoral vein, and saphenous nerve. [Week 6 • Lab Hit List]" },
                { text: "Femoral triangle", correct: false, why: "Proximal subfascial triangular space bounded by the inguinal ligament, sartorius, and adductor longus. [Week 6 • Slide/Transcript]" },
                { text: "Adductor hiatus", correct: false, why: "Distal tendinous opening in adductor magnus where femoral vessels exit posteriorly into the popliteal fossa. [Week 6 • Slide/Transcript]" },
                { text: "Popliteal fossa", correct: false, why: "Diamond-shaped depression posterior to the knee joint containing the popliteal vessels and tibial/common fibular nerves. [Week 6 • Slide/Transcript]" }
            ]
        },
        {
            id: 3,
            week: 6,
            regionIndex: 5,
            image: "Adductor Hiatus.png",
            priority: true,
            accepted: ["adductor hiatus"],
            stem: "Identify the highlighted distal opening in the adductor magnus where femoral vessels become popliteal:",
            options: [
                { text: "Adductor hiatus", correct: true, why: "Gap between the adductor and hamstring attachments of adductor magnus transmitting the femoral artery and vein into the popliteal fossa where they rename to popliteal vessels. [Week 6 • Lab Hit List]" },
                { text: "Adductor canal", correct: false, why: "Proximal fascial tunnel deep to sartorius leading down toward the hiatus. [Week 6 • Slide/Transcript]" },
                { text: "Obturator canal", correct: false, why: "Superior pelvic opening transmitting the obturator nerve and vessels into the medial thigh. [Week 6 • Slide/Transcript]" },
                { text: "Popliteal fossa", correct: false, why: "Posterior knee space entered after vessels pass through the hiatus. [Week 6 • Slide/Transcript]" }
            ]
        },
        {
            id: 4,
            week: 6,
            regionIndex: 1,
            image: "Adductor longus.png",
            priority: true,
            accepted: ["adductor longus", "adductor longus muscle"],
            stem: "Identify the highlighted superficial medial thigh muscle in the anatomical diagram above:",
            options: [
                { text: "Adductor longus", correct: true, why: "Arises via a narrow tendon from the anterior pubis and fans out to the middle third of the linea aspera; forms the medial border of the femoral triangle. [Week 6 • Lab Hit List]" },
                { text: "Gracilis", correct: false, why: "Strap-like most medial muscle of the thigh crossing the knee joint to insert at the pes anserine. [Week 6 • Slide/Transcript]" },
                { text: "Sartorius", correct: false, why: "Courses obliquely from the ASIS to the medial tibia, forming the lateral border of the femoral triangle. [Week 6 • Slide/Transcript]" },
                { text: "Adductor brevis", correct: false, why: "Lies deep behind pectineus and adductor longus. [Week 6 • Slide/Transcript]" }
            ]
        },
        {
            id: 5,
            week: 6,
            regionIndex: 1,
            image: "Adductor magnus.png",
            priority: true,
            accepted: ["adductor magnus", "adductor magnus muscle"],
            stem: "Identify the highlighted massive medial thigh muscle in the anatomical diagram above:",
            options: [
                { text: "Adductor magnus", correct: true, why: "Dual-innervated muscle with an adductor portion (obturator nerve) inserting on the linea aspera and a hamstring portion (tibial nerve) inserting on the adductor tubercle. [Week 6 • Lab Hit List]" },
                { text: "Semimembranosus", correct: false, why: "Posterior hamstring muscle inserting onto the posterior medial tibial condyle. [Week 6 • Slide/Transcript]" },
                { text: "Vastus medialis", correct: false, why: "Anterior compartment quadriceps muscle located medial to rectus femoris. [Week 6 • Slide/Transcript]" },
                { text: "Adductor longus", correct: false, why: "Smaller superficial adductor attaching only to the middle third of the linea aspera. [Week 6 • Slide/Transcript]" }
            ]
        },
        {
            id: 6,
            week: 6,
            regionIndex: 2,
            image: "Biceps Femoris Long Head.png",
            priority: true,
            accepted: ["biceps femoris long head", "long head of biceps femoris", "biceps femoris - long head", "biceps femoris"],
            stem: "Identify the highlighted lateral hamstring muscle head in the anatomical diagram above:",
            options: [
                { text: "Biceps femoris long head", correct: true, why: "Originates from the ischial tuberosity, crosses both hip and knee joints, inserts on the fibular head, and is innervated by the tibial division of the sciatic nerve. [Week 6 • Lab Hit List]" },
                { text: "Biceps femoris short head", correct: false, why: "Arises from the linea aspera of the femur and is innervated by the common fibular (peroneal) division. [Week 6 • Slide/Transcript]" },
                { text: "Semitendinosus", correct: false, why: "Courses medially in the posterior thigh to insert into the pes anserine on the medial tibia. [Week 6 • Slide/Transcript]" },
                { text: "Semimembranosus", correct: false, why: "Lies deep to semitendinosus on the posteromedial aspect of the thigh. [Week 6 • Slide/Transcript]" }
            ]
        },
        {
            id: 7,
            week: 6,
            regionIndex: 2,
            image: "Biceps Femoris Short Head.png",
            priority: true,
            accepted: ["biceps femoris short head", "short head of biceps femoris", "biceps femoris - short head"],
            stem: "Identify the highlighted deep lateral posterior thigh muscle head in the anatomical diagram above:",
            options: [
                { text: "Biceps femoris short head", correct: true, why: "Originates from the linea aspera and lateral supracondylar line; does not cross the hip and is innervated by the common peroneal (fibular) nerve. [Week 6 • Lab Hit List]" },
                { text: "Biceps femoris long head", correct: false, why: "Superficial head originating superiorly from the ischial tuberosity. [Week 6 • Slide/Transcript]" },
                { text: "Vastus lateralis", correct: false, why: "Anterior compartment quadriceps muscle located anterior to the lateral intermuscular septum. [Week 6 • Slide/Transcript]" },
                { text: "Adductor magnus", correct: false, why: "Medial compartment muscle attaching medial to the linea aspera. [Week 6 • Slide/Transcript]" }
            ]
        },
        {
            id: 8,
            week: 6,
            regionIndex: 5,
            image: "Common Peroneal nerve.png",
            priority: true,
            accepted: ["common peroneal nerve", "common fibular nerve", "common peroneal", "common fibular"],
            stem: "Identify the highlighted lateral nerve branch at the knee in the anatomical diagram above:",
            options: [
                { text: "Common peroneal nerve", correct: true, why: "Also called common fibular nerve; lateral branch of the sciatic nerve following biceps femoris and wrapping around the fibular neck where it is vulnerable to trauma causing foot drop. [Week 6 • Lab Hit List]" },
                { text: "Tibial nerve", correct: false, why: "Medial terminal branch of the sciatic nerve descending straight down the midline of the popliteal fossa. [Week 6 • Slide/Transcript]" },
                { text: "Sciatic nerve", correct: false, why: "Main parent trunk prior to bifurcating superior to the popliteal fossa. [Week 6 • Slide/Transcript]" },
                { text: "Sural nerve", correct: false, why: "Cutaneous nerve descending posteriorly along the calf toward the lateral malleolus. [Week 6 • Slide/Transcript]" }
            ]
        },
        {
            id: 9,
            week: 6,
            regionIndex: 5,
            image: "Deep Femoral Artery.png",
            priority: true,
            accepted: ["deep femoral artery", "profunda femoris artery", "profunda femoris"],
            stem: "Identify the highlighted deep thigh artery in the anatomical diagram above:",
            options: [
                { text: "Deep femoral artery", correct: true, why: "Also called profunda femoris artery; largest posterolateral branch of the femoral artery supplying the deep thigh via perforating and circumflex branches. [Week 6 • Lab Hit List]" },
                { text: "Femoral artery", correct: false, why: "Superficial main arterial trunk continuing down through the femoral triangle and adductor canal. [Week 6 • Slide/Transcript]" },
                { text: "Lateral femoral circumflex artery", correct: false, why: "Perpendicular lateral branch arising from the deep femoral or femoral trunk. [Week 6 • Slide/Transcript]" },
                { text: "Popliteal artery", correct: false, why: "Continuation of the femoral artery distal to the adductor hiatus. [Week 6 • Slide/Transcript]" }
            ]
        },
        {
            id: 10,
            week: 6,
            regionIndex: 5,
            image: "Femoral artery.png",
            priority: true,
            accepted: ["femoral artery"],
            stem: "Identify the highlighted primary arterial trunk of the anterior thigh in the anatomical diagram above:",
            options: [
                { text: "Femoral artery", correct: true, why: "Continuation of the external iliac artery distal to the inguinal ligament; courses through the femoral triangle and adductor canal before becoming the popliteal artery. [Week 6 • Lab Hit List]" },
                { text: "Deep femoral artery", correct: false, why: "Branches posterolaterally in the proximal thigh to run deep along the femur. [Week 6 • Slide/Transcript]" },
                { text: "Femoral vein", correct: false, why: "Lies medial to the femoral artery within the femoral sheath. [Week 6 • Slide/Transcript]" },
                { text: "Popliteal artery", correct: false, why: "Located posteriorly behind the knee after exiting the adductor hiatus. [Week 6 • Slide/Transcript]" }
            ]
        },
        {
            id: 11,
            week: 6,
            regionIndex: 5,
            image: "Femoral nerve.png",
            priority: true,
            accepted: ["femoral nerve"],
            stem: "Identify the highlighted anterior thigh nerve in the anatomical diagram above:",
            options: [

    function populateFilters() {
        const weekSel = document.getElementById("weekFilter");
        const uniqueWeeks = [...new Set(imageBank.map(item => item.week))].sort((a, b) => a - b);
        uniqueWeeks.forEach(w => {
            const opt = document.createElement("option");
            opt.value = String(w);
            opt.textContent = `Week ${w} Only`;
            weekSel.appendChild(opt);
        });

        const regSel = document.getElementById("regionFilter");
        REGIONS.forEach((regName, idx) => {
            const opt = document.createElement("option");
            opt.value = String(idx);
            opt.textContent = regName;
            regSel.appendChild(opt);
        });
    }

    function updateStfuUI() {
        const btn = document.getElementById("stfuBtn");
        btn.textContent = muted ? "Bring Back Erijah" : "STFU Erijah";
        btn.classList.toggle("muted", muted);
        if (muted) {
            const audio = document.getElementById("wrongAudio");
            if (audio) {
                audio.pause();
                audio.currentTime = 0;
            }
            clearTimeout(popupTimeout);
            document.getElementById("wrongPopup").classList.add("hidden");
        }
    }

    function triggerWrongFeedback() {
        if (muted) return;
        const audio = document.getElementById("wrongAudio");
        if (audio) {
            audio.currentTime = 0;
            audio.play().catch(() => {});
        }
        const popup = document.getElementById("wrongPopup");
        popup.classList.remove("hidden");
        clearTimeout(popupTimeout);
        popupTimeout = setTimeout(() => {
            popup.classList.add("hidden");
        }, 2000);
    }

    function fisherYatesShuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
    }

        const regVal = document.getElementById("regionFilter").value;
        const lenVal = document.getElementById("lengthFilter").value;

        let filtered = imageBank.filter(item => {
            const matchWeek = weekVal === "all" || item.week === Number(weekVal);
            const matchReg = regVal === "all" || item.regionIndex === Number(regVal);
            return matchWeek && matchReg;
        });

        if (lenVal !== "all") {
            const limit = Number(lenVal);
            filtered = filtered.slice(0, Math.min(limit, filtered.length));
        }

        activeQuizList = filtered;
        userAnswers = new Array(activeQuizList.length).fill(null);
        currentIndex = 0;
        renderQuiz();
    }

    // =========================================================================
    // BULLETPROOF GITHUB PAGES IMAGE LOADER
    // =========================================================================
    function handleImageError(imgEl, filename) {
        const attempt = Number(imgEl.dataset.attempt || 0);
        const week = imgEl.dataset.week || "6";
        const altExt = filename.endsWith(".png")
            ? filename.replace(/\.png$/, ".PNG")
            : filename.endsWith(".PNG")
            ? filename.replace(/\.PNG$/, ".png")
            : filename.endsWith(".png")
            ? filename.replace(/\.png$/, ".png")
            : filename.replace(/\.png$/, ".png");

        const encodedFile = encodeURIComponent(filename);
        const encodedAltFile = encodeURIComponent(altExt);

        const fallbacks = [
            `Images/Reg%201/Week%20${week}/${encodedFile}`,
            `./Images/Reg 1/Week ${week}/${filename}`,
            `../Images/Reg 1/Week ${week}/${filename}`,
            `images/Reg 1/Week ${week}/${filename}`,
            `images/reg 1/week ${week}/${filename}`,
            `Images/Reg 1/Week ${week}/${altExt}`,
            `Images/Reg%201/Week%20${week}/${encodedAltFile}`,
            `Images/Reg 1/${filename}`
        ];

        if (attempt < fallbacks.length) {
            imgEl.dataset.attempt = String(attempt + 1);
            imgEl.src = fallbacks[attempt];
        } else {
            const wrapper = imgEl.parentElement;
            wrapper.innerHTML = `<div class="img-error-box">⚠️ Image missing: <strong>${filename}</strong> in folder <code>Images/Reg 1/Week ${week}/</code></div>`;
        }
    }

    // =========================================================================
    // LEVENSHTEIN SPELLING CHECKER
    // =========================================================================
    function getLevenshtein(a, b) {
        const matrix = [];
        for (let i = 0; i <= b.length; i++) matrix[i] = [i];
        for (let j = 0; j <= a.length; j++) matrix[0][j] = j;

        for (let i = 1; i <= b.length; i++) {
            for (let j = 1; j <= a.length; j++) {
                if (b.charAt(i - 1) === a.charAt(j - 1)) {
                    matrix[i][j] = matrix[i - 1][j - 1];
                } else {
                    matrix[i][j] = Math.min(
                        matrix[i - 1][j - 1] + 1,
                        matrix[i][j - 1] + 1,
                        matrix[i - 1][j] + 1
                    );
                }
            }
        }
        return matrix[b.length][a.length];
    }

    function checkTypedString(rawInput, acceptedArray) {
        const normalized = rawInput.trim().toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "");
        if (!normalized) return { status: "empty" };

        let minDistance = Infinity;
        let closestTerm = acceptedArray[0];

        for (const candidate of acceptedArray) {
            const normCand = candidate.trim().toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "");
            if (normalized === normCand) {
                return { status: "exact", match: candidate };
            }
            const dist = getLevenshtein(normalized, normCand);
            if (dist < minDistance) {
                minDistance = dist;
                closestTerm = candidate;
            }
        }

        if (closestTerm.length > 7 && minDistance >= 1 && minDistance <= 2) {
            return { status: "typo", match: closestTerm };
        }
        return { status: "wrong", match: acceptedArray[0] };
    }

    // =========================================================================
    // RENDERING & SCORE TRACKING
    // =========================================================================
    function updateScorePill() {
        const answered = userAnswers.filter(a => a !== null).length;
        const correct = userAnswers.filter(a => a && a.isCorrect).length;
        const pct = answered > 0 ? Math.round((correct / answered) * 100) : 0;
        document.getElementById("scorePill").textContent = `Score: ${correct} / ${answered} (${pct}%)`;
    }

    function renderCardHTML(q, idx) {
        const letters = ["A", "B", "C", "D"];
        const state = userAnswers[idx];
        const locked = state !== null;
        const regionLabel = REGIONS[q.regionIndex] || "Lower Extremity";

        let answerAreaHTML = "";
        if (currentFormat === "mc") {
            const btns = q.options.map((opt, optIdx) => {
                let classes = "opt-btn";
                if (locked) {
                    if (opt.correct) classes += " correct";
                    else if (state.selectedIdx === optIdx) classes += " incorrect";
                }
                return `<button class="${classes}" onclick="selectMCOption(${idx}, ${optIdx})" ${locked ? "disabled" : ""}>
                    <span class="opt-letter">${letters[optIdx]}.</span>
                    <span>${opt.text}</span>
                </button>`;
            }).join("");
            answerAreaHTML = `<div class="options-grid">${btns}</div>`;
        } else {
            const savedVal = locked ? state.typedVal : "";
            answerAreaHTML = `
                <div class="typein-row">
                    <input type="text" class="typein-input" id="input-${idx}" placeholder="Type exact anatomical structure name..." value="${savedVal.replace(/"/g, "&quot;")}" ${locked ? "disabled" : ""} onkeydown="if(event.key==='Enter') submitTypeIn(${idx})">
                    <button class="typein-submit" onclick="submitTypeIn(${idx})" ${locked ? "disabled" : ""}>Submit</button>
                </div>
                <div class="spell-warning hidden" id="warn-${idx}"></div>
            `;
        }

        let rationaleHTML = "";
        if (locked) {
            const statusBanner = state.isCorrect
                ? `<div class="rationale-status is-right">CORRECT!</div>`
                : `<div class="rationale-status is-wrong">INCORRECT.</div>`;

            const items = q.options.map((opt, optIdx) => {
                const cls = opt.correct ? "rationale-item is-right" : "rationale-item is-wrong";
                const tag = opt.correct ? "Correct" : "Incorrect";
                return `<div class="${cls}"><strong>${letters[optIdx]} (${tag}):</strong> ${opt.why}</div>`;
            }).join("");

            rationaleHTML = `<div class="rationale-box">${statusBanner}${items}</div>`;
        }

        let oneByOneNav = "";
        if (currentView === "one") {
            oneByOneNav = `
                <div class="one-nav">
                    <button onclick="prevCard()" ${idx === 0 ? "disabled" : ""}>← Previous</button>
                    <span>Question ${idx + 1} of ${activeQuizList.length}</span>
                    <button onclick="nextCard()" ${idx >= activeQuizList.length - 1 ? "disabled" : ""}>Next →</button>
                </div>
            `;
        }

        return `
            <div class="q-card" id="card-${idx}">
                <div class="card-header">
                    <span>Question ${idx + 1} of ${activeQuizList.length} • Week ${q.week}</span>
                    <span class="region-tag">${regionLabel}</span>
                </div>
                <div class="image-wrapper">
                    <img src="Images/Reg 1/Week ${q.week}/${q.image}" data-attempt="0" data-week="${q.week}" style="max-height: 460px; max-width: 100%; border-radius: 6px;" onerror="handleImageError(this, '${q.image.replace(/'/g, "\\'")}')" alt="Anatomical Structure">
                </div>
                <div class="q-stem">${q.stem}</div>
                ${answerAreaHTML}
                ${rationaleHTML}
                ${oneByOneNav}
            </div>
        `;
    }

    function renderQuiz() {
        const container = document.getElementById("quizContainer");
        updateScorePill();

        if (activeQuizList.length === 0) {
            container.innerHTML = `<div class="q-card" style="text-align:center; color:var(--muted);">No questions match the selected Week and Region filters.</div>`;
            return;
        }

        if (currentView === "one") {
            container.innerHTML = renderCardHTML(activeQuizList[currentIndex], currentIndex);
        } else {
            container.innerHTML = activeQuizList.map((q, idx) => renderCardHTML(q, idx)).join("");
        }
    }

    function updateSingleCardDOM(idx) {
        const cardEl = document.getElementById(`card-${idx}`);
        if (cardEl) {
            cardEl.outerHTML = renderCardHTML(activeQuizList[idx], idx);
        }
        updateScorePill();
    }

    function selectMCOption(qIdx, optIdx) {
        if (userAnswers[qIdx] !== null) return;
        const q = activeQuizList[qIdx];
        const isCorrect = q.options[optIdx].correct;
        userAnswers[qIdx] = { isCorrect, selectedIdx: optIdx };

        if (!isCorrect) triggerWrongFeedback();
        updateSingleCardDOM(qIdx);
    }

    function submitTypeIn(qIdx) {
        if (userAnswers[qIdx] !== null) return;
        const q = activeQuizList[qIdx];
        const inputEl = document.getElementById(`input-${qIdx}`);
        const warnEl = document.getElementById(`warn-${qIdx}`);
        const val = inputEl.value;

        const res = checkTypedString(val, q.accepted);
        if (res.status === "empty") return;

        if (res.status === "typo") {
            warnEl.textContent = `SPELLING ERROR — TRY AGAIN! Close match to ${res.match}. Fix spelling and resubmit.`;
            warnEl.classList.remove("hidden");
            inputEl.focus();
            return;
        }

        warnEl.classList.add("hidden");
        const isCorrect = res.status === "exact";
        userAnswers[qIdx] = { isCorrect, typedVal: val };

        if (!isCorrect) triggerWrongFeedback();
        updateSingleCardDOM(qIdx);
    }

    function prevCard() {
        if (currentIndex > 0) {
            currentIndex--;
            renderQuiz();
            window.scrollTo({ top: 0, behavior: "smooth" });
        }
    }

    function nextCard() {
        if (currentIndex < activeQuizList.length - 1) {
            currentIndex++;
            renderQuiz();
            window.scrollTo({ top: 0, behavior: "smooth" });
        }
    }

    // =========================================================================
    // EVENT LISTENERS
    // =========================================================================
    document.getElementById("stfuBtn").addEventListener("click", () => {
        muted = !muted;
        try { localStorage.setItem("stfuErijah", muted ? "1" : "0"); } catch (e) {}
        updateStfuUI();
    });

    document.getElementById("weekFilter").addEventListener("change", rebuildActivePool);
    document.getElementById("regionFilter").addEventListener("change", rebuildActivePool);
    document.getElementById("lengthFilter").addEventListener("change", rebuildActivePool);

    document.getElementById("formatToggle").addEventListener("click", (e) => {
        currentFormat = currentFormat === "mc" ? "typein" : "mc";
        e.target.textContent = currentFormat === "mc" ? "Format: Multiple Choice" : "Format: Type-In Spelling";
        renderQuiz();
    });

    document.getElementById("viewToggle").addEventListener("click", (e) => {
        currentView = currentView === "all" ? "one" : "all";
        e.target.textContent = currentView === "all" ? "View: All at Once" : "View: One by One";
        currentIndex = 0;
        renderQuiz();
    });

    document.getElementById("shuffleBtn").addEventListener("click", () => {
        fisherYatesShuffle(imageBank);
        imageBank.forEach(item => fisherYatesShuffle(item.options));
        rebuildActivePool();
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
        rebuildActivePool();
    });

    window.onload = function() {
        updateStfuUI();
        populateFilters();
        rebuildActivePool();
    };
</script>
</body>
</html>
